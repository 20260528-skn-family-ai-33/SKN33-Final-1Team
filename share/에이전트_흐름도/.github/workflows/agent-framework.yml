name: Agent framework contracts
on:
  pull_request:
    paths: ["backend/agent_framework/**", "tests/agent_framework/**", "examples/agent_framework/**", "docs/agent-framework/**", "scripts/export_agent_framework.py", "pyproject.toml", "uv.lock", ".github/workflows/agent-framework.yml"]
  push:
    branches: [main, feat/agent-framework]
    paths: ["backend/agent_framework/**", "tests/agent_framework/**", "examples/agent_framework/**", "docs/agent-framework/**", "scripts/export_agent_framework.py", "pyproject.toml", "uv.lock", ".github/workflows/agent-framework.yml"]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - run: uv sync --locked --group dev
      - run: uv run pytest tests/agent_framework -q
      - run: uv run python -m backend.agent_framework demo
