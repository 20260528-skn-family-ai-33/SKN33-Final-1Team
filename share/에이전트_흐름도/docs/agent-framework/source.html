<main><h1>흐름과 연결된 소스.</h1><p class="note">저장소 기준 상대 경로와 실제 줄 번호입니다. 소스가 이 HTML에 내장되어 있어 macOS·Windows에서 서버 없이 열 수 있습니다.<br>생성 시점의 코드 사본이며, 실제 모델·DB 실행 결과를 나타내지는 않습니다.</p>

</main><script type="application/json" id="source-data">{"backend/agent_framework/__init__.py":{"text":"\"\"\"Independent-development scaffold; not the production review executor.\"\"\"\n\nCONTRACT_VERSION = \"1.0.0\"\n","sha256":"f046a8a976eb540236a08b1cd8397dd6c75d7b7269bab156b20869994da8b13c"},"backend/agent_framework/__main__.py":{"text":"\"\"\"Run the developer CLI without importing the product application.\"\"\"\nfrom .cli import main\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n","sha256":"fb2d181351fd041a5dd6a36600de816234886105df0333fd7c06f079e47bc6e5"},"backend/agent_framework/adapters/__init__.py":{"text":"\"\"\"Opt-in synthetic fixtures and explicit, unconfigured production adapter seams.\n\nImporting this package performs no network, database, filesystem or model work.\n\"\"\"\n\n","sha256":"ca0b3ee9e346a27efcf15d9d17e00a6de20f7878d7e00b19fb1ba10648db4d9a"},"backend/agent_framework/adapters/generate_examples.py":{"text":"\"\"\"Rebuild deterministic synthetic role JSON fixtures without external services.\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nfrom pathlib import Path\n\nfrom ..contracts import ExtractRequest, InspectRequest, ReportRequest, RetrieveRequest, ValidateRequest\nfrom .synthetic import SCENARIOS, make_agents, sample_inputs\n\n\ndef role_examples(scenario=\"pass\"):\n    context, document, asset = sample_inputs()\n    agents = make_agents(scenario)\n    extract_input = ExtractRequest(context=context, document=document, synthetic=True)\n    criteria = agents.extractor.extract(extract_input)\n    retrieve_input = RetrieveRequest(context=context, criteria=criteria.criteria, synthetic=True)\n    evidence = agents.retriever.retrieve(retrieve_input)\n    inspect_input = InspectRequest(context=context, criteria=criteria.criteria, asset=asset, evidence=evidence, synthetic=True)\n    observations = agents.inspector.inspect(inspect_input)\n    validate_input = ValidateRequest(context=context, criteria=criteria.criteria, asset=asset, evidence=evidence, inspection=observations, synthetic=True)\n    validated = agents.validator.validate(validate_input)\n    report_input = ReportRequest(context=context, validated=validated, evidence=evidence, synthetic=True)\n    report = agents.reporter.report(report_input)\n    return {\n        \"A02\": (extract_input, criteria), \"A03\": (retrieve_input, evidence),\n        \"A04_A05\": (inspect_input, observations), \"A06\": (validate_input, validated),\n        \"A07\": (report_input, report),\n    }\n\n\ndef generate(destination: Path) -\u003e tuple[Path, ...]:\n    destination.mkdir(parents=True, exist_ok=True)\n    files = []\n    for role, (request, response) in role_examples().items():\n        for suffix, payload in ((\"\", request), (\".output\", response)):\n            file = destination / f\"{role}{suffix}.json\"\n            file.write_text(payload.model_dump_json(indent=2) + \"\\n\", encoding=\"utf-8\")\n            files.append(file)\n    scenarios = destination / \"scenarios\"\n    scenarios.mkdir(exist_ok=True)\n    for scenario in SCENARIOS:\n        validated = role_examples(scenario)[\"A06\"][1]\n        file = scenarios / f\"{scenario}.validated.json\"\n        file.write_text(validated.model_dump_json(indent=2) + \"\\n\", encoding=\"utf-8\")\n        files.append(file)\n    return tuple(files)\n\n\ndef main(argv=None):\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\"--output\", type=Path, default=Path(__file__).resolve().parents[3] / \"examples\" / \"agent_framework\")\n    args = parser.parse_args(argv)\n    paths = generate(args.output)\n    print(f\"Generated {len(paths)} synthetic JSON examples in {args.output}\")\n\n\nif __name__ == \"__main__\":\n    main()\n","sha256":"c4e9a46ffe6e56024f12204abc38ef9cdb3f6ea26b0e4032a2bcf92801f4733f"},"backend/agent_framework/adapters/synthetic.py":{"text":"\"\"\"Deterministic protocol fixtures. These never inspect a real PDF or poster.\n\nThe fixture file IDs and hashes describe synthetic marker strings, not files.\nOnly an explicit choice of this adapter enables synthetic behavior; production\nadapter failures must never fall back to this module.\n\"\"\"\nfrom __future__ import annotations\n\nimport hashlib\nfrom typing import Literal\n\nfrom ..contracts import (\n    AssetRef, Context, CriteriaDraft, Criterion, DocumentRef, Evidence,\n    EvidenceBundle, ExtractRequest, ImageEvidence, InspectRequest,\n    InspectionResult, Observation, ReportDraft, ReportRequest, RetrieveRequest,\n    SourceRef,\n)\nfrom ..ports import AdapterFailure, Agents\n\nScenario = Literal[\"pass\", \"fail\", \"review\", \"stale\", \"unavailable\"]\nSCENARIOS = (\"pass\", \"fail\", \"review\", \"stale\", \"unavailable\")\nSYNTHETIC_NOTICE = \"합성 계약 예제입니다. 실제 PDF·포스터·모델·DB를 읽거나 실행하지 않았습니다.\"\nDOCUMENT_MARKER = \"SYNTHETIC DOCUMENT REFERENCE; no PDF bytes exist; document-v1\"\n\n\ndef _hash(text: str) -\u003e str:\n    return hashlib.sha256(text.encode(\"utf-8\")).hexdigest()\n\n\ndef sample_inputs(\n    run_id: str = \"demo-run-1\",\n    asset_version_id: str = \"poster-v1\",\n    parent_run_id: str | None = None,\n) -\u003e tuple[Context, DocumentRef, AssetRef]:\n    \"\"\"Return clearly synthetic references, without opening or creating files.\"\"\"\n    context = Context(\n        project_id=\"synthetic-project\", run_id=run_id, actor_id=\"synthetic-reviewer\",\n        document_version_id=\"document-v1\", criteria_version_id=\"criteria-v1\",\n        asset_version_id=asset_version_id, parent_run_id=parent_run_id,\n    )\n    document = DocumentRef(\n        file_id=\"synthetic-pdf-reference\", document_version_id=context.document_version_id,\n        sha256=_hash(DOCUMENT_MARKER), page_count=1,\n    )\n    asset = AssetRef(\n        file_id=f\"synthetic-{asset_version_id}\", asset_version_id=asset_version_id,\n        sha256=_hash(f\"SYNTHETIC POSTER REFERENCE; no image bytes exist; {asset_version_id}\"),\n        width=1200, height=1600,\n    )\n    return context, document, asset\n\n\ndef _same_context(left: Context, right: Context) -\u003e None:\n    if left != right:\n        raise AdapterFailure(\"CONTEXT_MISMATCH\", \"합성 예제의 실행 컨텍스트가 일치하지 않습니다.\")\n\n\nclass SyntheticAdapters:\n    \"\"\"One stateless fixture implements A02, A03, A04/A05 and A07 ports.\"\"\"\n\n    def __init__(self, scenario: Scenario = \"pass\"):\n        if scenario not in SCENARIOS:\n            raise ValueError(f\"scenario must be one of {', '.join(SCENARIOS)}\")\n        self.scenario = scenario\n\n    def extract(self, request: ExtractRequest) -\u003e CriteriaDraft:\n        if request.context.document_version_id != request.document.document_version_id:\n            raise AdapterFailure(\"CONTEXT_MISMATCH\", \"문서 버전이 추출 실행 컨텍스트와 다릅니다.\")\n        text_quote = \"포스터에는 MORNING CUP 문구를 정확히 표시해야 합니다.\"\n        number_quote = \"포스터에는 딸기 3개가 표시되어야 합니다.\"\n\n        def source(block_id: str, quote: str) -\u003e SourceRef:\n            return SourceRef(\n                document_version_id=request.document.document_version_id,\n                page=1, block_id=block_id, quote=quote, source_hash=_hash(quote),\n            )\n\n        return CriteriaDraft(\n            context=request.context,\n            criteria=(\n                Criterion(\n                    criterion_id=\"requirement-text\", text=text_quote, kind=\"text\",\n                    expected=\"MORNING CUP\", operator=\"equals\",\n                    source=source(\"synthetic-page-1-block-1\", text_quote),\n                ),\n                Criterion(\n                    criterion_id=\"requirement-number\", text=number_quote, kind=\"number\",\n                    expected=\"3\", operator=\"equals\", unit=\"개\",\n                    source=source(\"synthetic-page-1-block-2\", number_quote),\n                ),\n            ),\n            warnings=(SYNTHETIC_NOTICE, \"파일 해시는 실제 파일이 아닌 합성 참조 문자열의 SHA-256입니다.\"),\n            synthetic=True,\n        )\n\n    def retrieve(self, request: RetrieveRequest) -\u003e EvidenceBundle:\n        for criterion in request.criteria:\n            if criterion.source.document_version_id != request.context.document_version_id:\n                raise AdapterFailure(\"CONTEXT_MISMATCH\", \"요구조건의 출처 문서 버전이 다릅니다.\")\n        status = self.scenario if self.scenario in {\"stale\", \"unavailable\"} else \"complete\"\n        entries = () if status == \"unavailable\" else tuple(\n            Evidence(\n                evidence_id=f\"synthetic-evidence-{criterion.criterion_id}\",\n                project_id=request.context.project_id, kind=\"current_requirement\",\n                criterion_ids=(criterion.criterion_id,),\n                source_record_id=f\"synthetic-source-{criterion.criterion_id}\",\n                source=criterion.source,\n            )\n            for criterion in request.criteria\n        )\n        warning = {\n            \"stale\": \"합성 장애: Graph 반영 버전이 PostgreSQL 원본보다 오래되었습니다.\",\n            \"unavailable\": \"합성 장애: 근거 검색 서비스를 사용할 수 없습니다.\",\n        }.get(status)\n        return EvidenceBundle(\n            context=request.context, retrieval_id=f\"synthetic-retrieval-{request.context.run_id}\",\n            status=status, evidence=entries,\n            postgres_revision=0 if status == \"unavailable\" else 2,\n            graph_revision=None if status == \"unavailable\" else 1 if status == \"stale\" else 2,\n            warnings=(SYNTHETIC_NOTICE, warning) if warning else (SYNTHETIC_NOTICE,),\n            synthetic=True,\n        )\n\n    def inspect(self, request: InspectRequest) -\u003e InspectionResult:\n        _same_context(request.context, request.evidence.context)\n        if request.context.asset_version_id != request.asset.asset_version_id:\n            raise AdapterFailure(\"CONTEXT_MISMATCH\", \"포스터 버전이 검사 실행 컨텍스트와 다릅니다.\")\n        observations = []\n        for index, criterion in enumerate(request.criteria):\n            citations = tuple(\n                evidence.evidence_id for evidence in request.evidence.evidence\n                if evidence.kind == \"current_requirement\" and criterion.criterion_id in evidence.criterion_ids\n            )\n            observed, verdict, uncertainty = criterion.expected, \"pass\", None\n            if criterion.kind == \"unsupported\" or criterion.operator == \"manual\":\n                observed, verdict, uncertainty = \"\", \"review\", \"합성 예제: 수동 확인 조건입니다.\"\n            elif self.scenario == \"review\":\n                observed, verdict, uncertainty = \"\", \"review\", \"합성 예제: 현재 포스터의 관측이 불명확합니다.\"\n            elif self.scenario == \"fail\" and criterion.kind == \"number\":\n                observed, verdict = \"2\", \"fail\"\n            observations.append(Observation(\n                criterion_id=criterion.criterion_id, observed=observed, verdict=verdict,\n                image=ImageEvidence(\n                    asset_version_id=request.asset.asset_version_id, asset_hash=request.asset.sha256,\n                    bbox=(0.08, 0.08, 0.88, 0.24) if index % 2 == 0 else (0.12, 0.35, 0.78, 0.82),\n                ),\n                evidence_ids=citations, uncertainty=uncertainty,\n            ))\n        return InspectionResult(context=request.context, observations=tuple(observations), synthetic=True)\n\n    def report(self, request: ReportRequest) -\u003e ReportDraft:\n        _same_context(request.context, request.validated.context)\n        _same_context(request.context, request.evidence.context)\n        verdict = request.validated.verdict\n        validated_ids = {item.criterion_id for item in request.validated.items}\n        citations = tuple(\n            evidence.evidence_id for evidence in request.evidence.evidence\n            if evidence.kind == \"current_requirement\" and validated_ids.intersection(evidence.criterion_ids)\n        )\n        lines = [SYNTHETIC_NOTICE, f\"기계 판정: {verdict}\"]\n        changes = []\n        for item in request.validated.items:\n            issues = \", \".join(item.issues)\n            lines.append(f\"{item.criterion_id}: {item.verdict}\" + (f\" ({issues})\" if issues else \"\"))\n            if item.verdict != \"pass\":\n                action = \"수정 확인\" if item.verdict == \"fail\" else \"근거와 관측 확인\"\n                changes.append(f\"{item.criterion_id}: {action}이 필요합니다.\")\n        return ReportDraft(\n            context=request.context, verdict=verdict, summary=\"\\n\".join(lines),\n            evidence_ids=citations, change_requests=tuple(changes), synthetic=True,\n        )\n\n\ndef make_agents(scenario: Scenario = \"pass\") -\u003e Agents:\n    \"\"\"Explicit synthetic composition; validation is the shared reference code.\"\"\"\n    from ..validation import ReferenceValidator\n\n    adapters = SyntheticAdapters(scenario)\n    return Agents(\n        extractor=adapters, retriever=adapters, inspector=adapters,\n        validator=ReferenceValidator(), reporter=adapters,\n    )\n\n","sha256":"d1f215fffe3ae6f797022fd18209bbabe18aaf89835fa6a7c3d58952274b5f91"},"backend/agent_framework/adapters/templates.py":{"text":"\"\"\"Unconfigured adapter seams. These intentionally never return synthetic results.\"\"\"\nfrom __future__ import annotations\n\nfrom ..contracts import (\n    CriteriaDraft, EvidenceBundle, ExtractRequest, InspectRequest,\n    InspectionResult, ReportDraft, ReportRequest, RetrieveRequest,\n)\nfrom ..ports import AdapterFailure\n\n\nclass QwenAdapterStub:\n    \"\"\"Implement Qwen3.5-4B calls outside the framework; no client is created here.\n\n    A02 must preserve PDF source provenance. A04/A05 must use the current poster\n    and approved criteria. A07 must preserve the validated verdict and citations.\n    Return synthetic=False only after a real configured execution.\n    \"\"\"\n\n    def extract(self, request: ExtractRequest) -\u003e CriteriaDraft:\n        raise AdapterFailure(\"ADAPTER_NOT_CONFIGURED\", \"A02 Qwen PDF 추출 어댑터를 구현하고 연결해야 합니다.\")\n\n    def inspect(self, request: InspectRequest) -\u003e InspectionResult:\n        raise AdapterFailure(\"ADAPTER_NOT_CONFIGURED\", \"A04/A05 Qwen 포스터 검사 어댑터를 구현하고 연결해야 합니다.\")\n\n    def report(self, request: ReportRequest) -\u003e ReportDraft:\n        raise AdapterFailure(\"ADAPTER_NOT_CONFIGURED\", \"A07 Qwen 보고서 어댑터를 구현하고 연결해야 합니다.\")\n\n\nclass PostgresNeo4jRetrieverStub:\n    \"\"\"Implement permission/version-checked PostgreSQL + Neo4j retrieval here.\n\n    No database is opened by this class. Keep current requirements, approved\n    exceptions, and historical context separate, including stale/unavailable\n    states. Do not silently supply fixtures when a dependency fails.\n    \"\"\"\n\n    def retrieve(self, request: RetrieveRequest) -\u003e EvidenceBundle:\n        raise AdapterFailure(\"ADAPTER_NOT_CONFIGURED\", \"A03 PostgreSQL·Neo4j 근거 검색 어댑터를 구현하고 연결해야 합니다.\")\n\n","sha256":"165944ea114310b54d93e5d4a60f23de8838501556c45e823cea223f6451afea"},"backend/agent_framework/api.py":{"text":"\"\"\"Loopback-only development API contract. Never mounted into the product API.\n\nThis service has no authentication or durable storage. IDs supplied in requests\nare test context, not proof of identity. Bind to 127.0.0.1, never a shared host.\n\"\"\"\nfrom fastapi import FastAPI, HTTPException\n\nfrom .contracts import Approval, AssetRef, Context, Contract, DocumentRef, RunSnapshot\nfrom .ports import Agents\nfrom .runtime import Workflow\n\n\nclass StartRequest(Contract):\n    context: Context\n    document: DocumentRef\n    asset: AssetRef\n\n\nclass RevisionRequest(Contract):\n    context: Context\n    asset: AssetRef\n\n\ndef create_app(agents: Agents | None = None, *, profile: str = \"development\") -\u003e FastAPI:\n    if agents is None:\n        from .adapters.synthetic import make_agents\n        agents = make_agents()\n    workflow = Workflow(agents, profile=profile)\n    app = FastAPI(title=\"Creative Checker — Development Framework\",\n                  version=\"1.0.0\",\n                  description=\"Development only. In-memory state, synthetic default adapters, no authentication. \"\n                              \"Not the front-v2/M008 production API. Bind to loopback only.\")\n    app.state.workflow = workflow\n\n    @app.middleware(\"http\")\n    async def development_boundary(request, call_next):\n        # Host headers are not authentication; reject obvious accidental exposure.\n        from starlette.responses import JSONResponse\n        host = request.url.hostname\n        if host not in {\"127.0.0.1\", \"localhost\", \"::1\", \"testserver\"}:\n            return JSONResponse(status_code=403, content={\"code\": \"DEVELOPMENT_LOOPBACK_ONLY\"})\n        response = await call_next(request)\n        response.headers[\"X-Creative-Checker-Profile\"] = profile\n        response.headers[\"Cache-Control\"] = \"no-store\"\n        return response\n\n    def invoke(action, *args):\n        try:\n            return action(*args)\n        except KeyError as exc:\n            raise HTTPException(404, detail={\"code\": \"RUN_NOT_FOUND\"}) from exc\n        except ValueError as exc:\n            raise HTTPException(409, detail={\"code\": \"WORKFLOW_CONFLICT\", \"message\": str(exc)}) from exc\n\n    prefix = \"/api/framework/v1\"\n\n    @app.get(prefix + \"/health\")\n    def health():\n        return {\"contract_version\": \"1.0.0\", \"profile\": profile, \"storage\": \"memory\",\n                \"authenticated\": False, \"production_ready\": False,\n                \"default_adapters\": \"synthetic\" if agents.extractor.__class__.__module__.endswith(\".synthetic\") else \"custom\"}\n\n    @app.post(prefix + \"/runs\", response_model=RunSnapshot, status_code=201)\n    def start(request: StartRequest):\n        return invoke(workflow.start, request.context, request.document, request.asset)\n\n    @app.get(prefix + \"/runs/{run_id}\", response_model=RunSnapshot)\n    def read(run_id: str):\n        return invoke(workflow.get, run_id)\n\n    @app.post(prefix + \"/runs/{run_id}/approvals\", response_model=RunSnapshot)\n    def approve(run_id: str, request: Approval):\n        return invoke(workflow.approve, run_id, request)\n\n    @app.post(prefix + \"/runs/{run_id}/revisions\", response_model=RunSnapshot, status_code=201)\n    def revise(run_id: str, request: RevisionRequest):\n        return invoke(workflow.rereview, run_id, request.context, request.asset)\n\n    return app\n","sha256":"a405636d783eea49517c943c68f241bd3f4b5686c4e6ac03eddbc4bcc33b3028"},"backend/agent_framework/cli.py":{"text":"\"\"\"Explicit development commands; never starts product services or migrations.\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport importlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport sys\nimport tempfile\n\nfrom pydantic import ValidationError\n\nfrom .contracts import (\n    CONTRACT_TYPES, Approval, CriteriaDraft, EvidenceBundle, ExtractRequest,\n    FrameworkError, InspectRequest, InspectionResult, ReportDraft, ReportRequest,\n    RetrieveRequest, ValidateRequest, ValidatedResult,\n)\nfrom .ports import AdapterFailure, Agents\n\n\nROLE_CONTRACTS = {\n    \"A02\": (\"extractor\", \"extract\", ExtractRequest, CriteriaDraft),\n    \"A03\": (\"retriever\", \"retrieve\", RetrieveRequest, EvidenceBundle),\n    \"A04_A05\": (\"inspector\", \"inspect\", InspectRequest, InspectionResult),\n    \"A06\": (\"validator\", \"validate\", ValidateRequest, ValidatedResult),\n    \"A07\": (\"reporter\", \"report\", ReportRequest, ReportDraft),\n}\n\n\ndef _emit(payload, output=None):\n    rendered = json.dumps(payload, ensure_ascii=False, indent=2, allow_nan=False) + \"\\n\"\n    if output:\n        # An explicit output path authorizes this file only. Missing parent\n        # directories are reported instead of silently creating another tree.\n        path = Path(output)\n        temporary = None\n        try:\n            with tempfile.NamedTemporaryFile(mode=\"w\", encoding=\"utf-8\", dir=path.parent,\n                    prefix=\".framework-\", suffix=\".tmp\", delete=False) as stream:\n                temporary = Path(stream.name)\n                stream.write(rendered)\n            os.replace(temporary, path)\n        finally:\n            if temporary is not None:\n                temporary.unlink(missing_ok=True)\n    else:\n        sys.stdout.write(rendered)\n\n\ndef _error(code, message, *, retryable=False, outcome_unknown=False):\n    error = FrameworkError(code=code, message=message, retryable=retryable, outcome_unknown=outcome_unknown)\n    _emit({\"error\": error.model_dump(mode=\"json\")})\n\n\ndef _factory(reference):\n    if not re.fullmatch(r\"[A-Za-z_]\\w*(?:\\.[A-Za-z_]\\w*)*:[A-Za-z_]\\w*\", reference):\n        raise AdapterFailure(\"INVALID_FACTORY\", \"Use an importable module:callable factory.\")\n    module_name, callable_name = reference.split(\":\", 1)\n    # Loading code is permitted only by this explicit CLI option. No factory\n    # name is accepted from the untrusted role request JSON.\n    factory = getattr(importlib.import_module(module_name), callable_name, None)\n    if not callable(factory):\n        raise AdapterFailure(\"INVALID_FACTORY\", \"The named factory is not callable.\")\n    agents = factory()\n    if not isinstance(agents, Agents):\n        raise AdapterFailure(\"INVALID_FACTORY\", \"The factory must return an Agents instance.\")\n    return agents\n\n\ndef _check_role(role, request, result):\n    from .validation import (validate_draft, validate_evidence, validate_inspection,\n                             validate_report, validate_validated)\n\n    try:\n        if role == \"A02\":\n            validate_draft(request.context, request.document, result)\n        else:\n            {\"A03\": validate_evidence, \"A04_A05\": validate_inspection,\n             \"A06\": validate_validated, \"A07\": validate_report}[role](request, result)\n    except ValueError as exc:\n        code = str(exc).split(\":\", 1)[0]\n        if not re.fullmatch(r\"[A-Z][A-Z0-9_]{1,80}\", code):\n            code = \"BOUNDARY_INVALID\"\n        raise AdapterFailure(code, \"The role output violates the shared scope, evidence, or verdict policy.\") from None\n\n\ndef _has_synthetic(value):\n    if isinstance(value, dict):\n        return value.get(\"synthetic\") is True or any(_has_synthetic(item) for item in value.values())\n    if isinstance(value, (list, tuple)):\n        return any(_has_synthetic(item) for item in value)\n    return False\n\n\ndef _role(args):\n    if not args.synthetic and not args.factory:\n        _error(\"ADAPTER_NOT_CONFIGURED\", \"Choose --synthetic or an explicit --factory module:callable.\")\n        return 2\n    if args.scenario and not args.synthetic:\n        _error(\"INVALID_ARGUMENT\", \"--scenario is only available with --synthetic.\")\n        return 2\n    port_name, method_name, request_type, result_type = ROLE_CONTRACTS[args.role]\n    request = request_type.model_validate_json(Path(args.input).read_text(encoding=\"utf-8\"))\n    inherited_synthetic = _has_synthetic(request.model_dump(mode=\"json\"))\n    if args.synthetic:\n        from .adapters.synthetic import make_agents\n\n        agents = make_agents(scenario=args.scenario or \"pass\")\n        print(\"SYNTHETIC DEVELOPMENT FIXTURE: no real model, PostgreSQL, Neo4j, or MCP call.\", file=sys.stderr)\n    else:\n        print(\"EXPLICIT DEVELOPER FACTORY: loading trusted local adapter code.\", file=sys.stderr)\n        agents = _factory(args.factory)\n    method = getattr(getattr(agents, port_name), method_name, None)\n    if not callable(method):\n        raise AdapterFailure(\"ADAPTER_NOT_IMPLEMENTED\", \"The selected role does not implement its port.\")\n    raw = method(request)\n    # model_copy/model_construct do not validate, so even typed adapter output\n    # is round-tripped through the public JSON shape before accepting it.\n    result = result_type.model_validate(raw.model_dump(mode=\"json\") if isinstance(raw, result_type) else raw)\n    if result.context != request.context:\n        raise AdapterFailure(\"CONTEXT_MISMATCH\", \"The role changed the request's execution or version scope.\")\n    if args.synthetic and not result.synthetic:\n        raise AdapterFailure(\"SYNTHETIC_LABEL_MISSING\", \"Fixture output must explicitly identify itself as synthetic.\")\n    if inherited_synthetic and not result.synthetic:\n        result = result.model_copy(update={\"synthetic\": True})\n        print(\"SYNTHETIC INPUT: preserving the fixture label on this role's output.\", file=sys.stderr)\n    _check_role(args.role, request, result)\n    _emit(result.model_dump(mode=\"json\"), args.output)\n    return 0\n\n\ndef _demo(args):\n    from .adapters.synthetic import make_agents, sample_inputs\n    from .runtime import Workflow\n\n    print(\"SYNTHETIC DEVELOPMENT DEMO: approvals are scripted test inputs; storage is in memory only.\", file=sys.stderr)\n    workflow = Workflow(make_agents(scenario=\"pass\"), profile=\"development\")\n    context, document, asset = sample_inputs()\n    steps = []\n\n    def record(action, snapshot):\n        steps.append({\"action\": action, \"run_id\": snapshot.context.run_id,\n            \"execution_status\": snapshot.execution_status, \"machine_verdict\": snapshot.machine_verdict,\n            \"human_decision\": snapshot.human_decision, \"synthetic\": snapshot.synthetic})\n        if snapshot.error:\n            raise AdapterFailure(snapshot.error.code, snapshot.error.message,\n                retryable=snapshot.error.retryable, outcome_unknown=snapshot.error.outcome_unknown)\n        return snapshot\n\n    record(\"start\", workflow.start(context, document, asset))\n    record(\"approve_criteria\", workflow.approve(context.run_id,\n        Approval(context=context, actor_id=context.actor_id, decision=\"approve_criteria\")))\n    record(\"approve_changes\", workflow.approve(context.run_id,\n        Approval(context=context, actor_id=context.actor_id, decision=\"approve_changes\",\n                 reason=\"합성 개발 예제: 수정본 전체 재검수 흐름을 확인합니다.\")))\n    revised_context, _document, revised_asset = sample_inputs(\n        run_id=\"demo-run-2\", asset_version_id=\"poster-v2\", parent_run_id=context.run_id)\n    record(\"rereview\", workflow.rereview(context.run_id, revised_context, revised_asset))\n    record(\"approve_revised_criteria\", workflow.approve(revised_context.run_id,\n        Approval(context=revised_context, actor_id=revised_context.actor_id, decision=\"approve_criteria\")))\n    record(\"approve_final\", workflow.approve(revised_context.run_id,\n        Approval(context=revised_context, actor_id=revised_context.actor_id, decision=\"approve_final\")))\n    _emit({\"profile\": \"development\", \"synthetic\": True, \"storage\": \"memory\",\n        \"notice\": \"Scripted fixture approvals, not authenticated human decisions or real model results.\",\n        \"steps\": steps, \"runs\": [workflow.get(context.run_id).model_dump(mode=\"json\"),\n                                  workflow.get(revised_context.run_id).model_dump(mode=\"json\")]}, args.output)\n    return 0\n\n\ndef _schemas(args):\n    schemas = {contract.__name__: contract.model_json_schema() for contract in CONTRACT_TYPES}\n    if args.output_dir:\n        directory = Path(args.output_dir)\n        directory.mkdir(parents=True, exist_ok=True)\n        for name, schema in schemas.items():\n            _emit(schema, directory / f\"{name}.schema.json\")\n        _emit({\"schema_count\": len(schemas), \"output_dir\": str(directory)})\n    else:\n        _emit(schemas)\n    return 0\n\n\ndef parser():\n    cli = argparse.ArgumentParser(description=\"Creative Checker agent framework development commands\")\n    commands = cli.add_subparsers(dest=\"command\", required=True)\n    demo = commands.add_parser(\"demo\", help=\"run a labelled synthetic approval and re-review example\")\n    demo.add_argument(\"--output\", help=\"write JSON to this file instead of stdout\")\n    demo.set_defaults(handler=_demo)\n    role = commands.add_parser(\"role\", help=\"execute one role against its JSON request contract\")\n    role.add_argument(\"role\", choices=tuple(ROLE_CONTRACTS))\n    role.add_argument(\"--input\", required=True, help=\"request JSON file\")\n    role.add_argument(\"--output\", help=\"response JSON file; parent directory must exist\")\n    adapters = role.add_mutually_exclusive_group()\n    adapters.add_argument(\"--synthetic\", action=\"store_true\", help=\"explicitly use labelled development fixtures\")\n    adapters.add_argument(\"--factory\", help=\"trusted importable module:callable returning Agents; called with no arguments\")\n    role.add_argument(\"--scenario\", choices=(\"pass\", \"fail\", \"review\", \"stale\", \"unavailable\"),\n                      help=\"synthetic scenario name, default: pass\")\n    role.set_defaults(handler=_role)\n    schema = commands.add_parser(\"schema\", help=\"export the current versioned JSON contracts\")\n    schema.add_argument(\"--output-dir\", help=\"write one NAME.schema.json file per contract\")\n    schema.set_defaults(handler=_schemas)\n    return cli\n\n\ndef main(argv=None):\n    args = parser().parse_args(argv)\n    try:\n        return args.handler(args)\n    except ValidationError:\n        _error(\"CONTRACT_INVALID\", \"Input or adapter output does not match the versioned JSON contract.\")\n        return 2\n    except (OSError, UnicodeError):\n        _error(\"FILE_UNAVAILABLE\", \"The requested input or output file could not be read or written.\")\n        return 2\n    except AdapterFailure as exc:\n        _error(exc.code, exc.message, retryable=exc.retryable, outcome_unknown=exc.outcome_unknown)\n        return 1\n    except (NotImplementedError, AttributeError):\n        _error(\"ADAPTER_NOT_IMPLEMENTED\", \"The adapter or factory is incomplete; no successful result was produced.\")\n        return 1\n    except Exception:\n        # Do not leak model responses, credentials, local paths, or tracebacks.\n        _error(\"ADAPTER_FAILED\", \"The selected command or adapter failed; inspect it in your development environment.\")\n        return 1\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n","sha256":"ab179977572e8acf92eca61bab1f07c413cbf54e7d13b3eb23444225d1a66874"},"backend/agent_framework/contracts.py":{"text":"\"\"\"Versioned JSON contracts shared by agents, adapters, fixtures and API clients.\"\"\"\nfrom __future__ import annotations\n\nfrom typing import Annotated, Literal\n\nfrom pydantic import BaseModel, ConfigDict, Field, model_validator\n\nIdentifier = Annotated[str, Field(min_length=1, max_length=160, pattern=r\"^[A-Za-z0-9][A-Za-z0-9_.:-]*$\")]\nHash = Annotated[str, Field(pattern=r\"^[a-f0-9]{64}$\")]\nVerdict = Literal[\"pass\", \"fail\", \"review\"]\n\n\nclass Contract(BaseModel):\n    model_config = ConfigDict(extra=\"forbid\", frozen=True)\n    contract_version: Literal[\"1.0.0\"] = \"1.0.0\"\n\n\nclass Context(Contract):\n    project_id: Identifier\n    run_id: Identifier\n    actor_id: Identifier\n    document_version_id: Identifier\n    criteria_version_id: Identifier\n    asset_version_id: Identifier | None = None\n    parent_run_id: Identifier | None = None\n\n\nclass DocumentRef(Contract):\n    file_id: Identifier\n    document_version_id: Identifier\n    sha256: Hash\n    media_type: Literal[\"application/pdf\"] = \"application/pdf\"\n    page_count: int = Field(ge=1)\n\n\nclass AssetRef(Contract):\n    file_id: Identifier\n    asset_version_id: Identifier\n    sha256: Hash\n    media_type: Literal[\"image/png\", \"image/jpeg\", \"image/webp\"] = \"image/png\"\n    width: int = Field(gt=0)\n    height: int = Field(gt=0)\n\n\nclass SourceRef(Contract):\n    document_version_id: Identifier\n    page: int = Field(ge=1)\n    block_id: Identifier\n    quote: str = Field(min_length=1)\n    source_hash: Hash\n\n\nclass Criterion(Contract):\n    criterion_id: Identifier\n    text: str = Field(min_length=1)\n    kind: Literal[\"text\", \"number\", \"visual\", \"unsupported\"]\n    expected: str\n    operator: Literal[\"equals\", \"contains\", \"gte\", \"lte\", \"present\", \"manual\"]\n    unit: str | None = None\n    required: bool = True\n    source: SourceRef\n    human_added: bool = False\n\n\nclass RoleRequest(Contract):\n    # Preserve provenance even when only a previous draft's criteria are passed on.\n    synthetic: bool = False\n\n\nclass ExtractRequest(RoleRequest):\n    context: Context\n    document: DocumentRef\n\n\nclass CriteriaDraft(Contract):\n    context: Context\n    criteria: tuple[Criterion, ...] = Field(min_length=1)\n    warnings: tuple[str, ...] = ()\n    synthetic: bool = False\n\n\nclass RetrieveRequest(RoleRequest):\n    context: Context\n    criteria: tuple[Criterion, ...] = Field(min_length=1)\n    purpose: Literal[\"inspection\", \"report\"] = \"inspection\"\n\n\nclass Evidence(Contract):\n    evidence_id: Identifier\n    project_id: Identifier\n    kind: Literal[\"current_requirement\", \"approved_exception\", \"historical_context\"]\n    criterion_ids: tuple[Identifier, ...] = Field(min_length=1)\n    source_record_id: Identifier\n    source: SourceRef\n    approval_id: Identifier | None = None\n    # Exception eligibility must be checked by the retrieval implementation.\n    applicable_asset_version_id: Identifier | None = None\n\n    @model_validator(mode=\"after\")\n    def exception_has_scope(self):\n        if self.kind == \"approved_exception\" and (not self.approval_id or not self.applicable_asset_version_id):\n            raise ValueError(\"approved_exception requires approval_id and asset scope\")\n        return self\n\n\nclass EvidenceBundle(Contract):\n    context: Context\n    retrieval_id: Identifier\n    status: Literal[\"complete\", \"empty\", \"stale\", \"unavailable\"]\n    evidence: tuple[Evidence, ...] = ()\n    warnings: tuple[str, ...] = ()\n    postgres_revision: int = Field(default=0, ge=0)\n    graph_revision: int | None = Field(default=None, ge=0)\n    synthetic: bool = False\n\n\nclass InspectRequest(RoleRequest):\n    context: Context\n    criteria: tuple[Criterion, ...] = Field(min_length=1)\n    asset: AssetRef\n    evidence: EvidenceBundle\n\n\nclass ImageEvidence(Contract):\n    asset_version_id: Identifier\n    asset_hash: Hash\n    # Normalized x1,y1,x2,y2; absence means no localization claim.\n    bbox: tuple[float, float, float, float] | None = None\n\n    @model_validator(mode=\"after\")\n    def valid_box(self):\n        if self.bbox is not None:\n            x1, y1, x2, y2 = self.bbox\n            if not (0 \u003c= x1 \u003c x2 \u003c= 1 and 0 \u003c= y1 \u003c y2 \u003c= 1):\n                raise ValueError(\"bbox must be finite normalized x1,y1,x2,y2\")\n        return self\n\n\nclass Observation(Contract):\n    criterion_id: Identifier\n    observed: str\n    verdict: Verdict\n    image: ImageEvidence\n    evidence_ids: tuple[Identifier, ...] = ()\n    uncertainty: str | None = None\n\n\nclass InspectionResult(Contract):\n    context: Context\n    observations: tuple[Observation, ...]\n    synthetic: bool = False\n\n\nclass ValidateRequest(RoleRequest):\n    context: Context\n    criteria: tuple[Criterion, ...] = Field(min_length=1)\n    asset: AssetRef\n    evidence: EvidenceBundle\n    inspection: InspectionResult\n\n\nclass ValidatedItem(Contract):\n    criterion_id: Identifier\n    verdict: Verdict\n    issues: tuple[str, ...] = ()\n\n\nclass ValidatedResult(Contract):\n    context: Context\n    verdict: Verdict\n    items: tuple[ValidatedItem, ...] = Field(min_length=1)\n    limitations: tuple[str, ...] = ()\n    synthetic: bool = False\n\n\nclass ReportRequest(RoleRequest):\n    context: Context\n    validated: ValidatedResult\n    evidence: EvidenceBundle\n\n\nclass ReportDraft(Contract):\n    context: Context\n    verdict: Verdict\n    summary: str = Field(min_length=1)\n    evidence_ids: tuple[Identifier, ...] = ()\n    change_requests: tuple[str, ...] = ()\n    synthetic: bool = False\n\n\nclass FrameworkError(Contract):\n    code: str\n    message: str\n    retryable: bool = False\n    outcome_unknown: bool = False\n\n\nclass Approval(Contract):\n    context: Context\n    actor_id: Identifier\n    decision: Literal[\"approve_criteria\", \"approve_changes\", \"approve_final\", \"approve_exception\"]\n    reason: str = \"\"\n    criterion_ids: tuple[Identifier, ...] = ()\n\n    @model_validator(mode=\"after\")\n    def scoped_exception(self):\n        if self.decision in (\"approve_changes\", \"approve_exception\") and not self.reason.strip():\n            raise ValueError(\"a reason is required\")\n        if self.decision == \"approve_exception\" and not self.criterion_ids:\n            raise ValueError(\"exception approval requires criterion_ids\")\n        return self\n\n\nclass RunSnapshot(Contract):\n    context: Context\n    profile: Literal[\"development\", \"test\"]\n    synthetic: bool\n    execution_status: Literal[\"waiting_criteria\", \"waiting_review\", \"waiting_revision\", \"completed\", \"failed\", \"outcome_unknown\"]\n    machine_verdict: Verdict | None = None\n    human_decision: Literal[\"unreviewed\", \"changes_approved\", \"final_approved\", \"exception_approved\"] = \"unreviewed\"\n    criteria: CriteriaDraft | None = None\n    evidence: EvidenceBundle | None = None\n    inspection: InspectionResult | None = None\n    validated: ValidatedResult | None = None\n    report: ReportDraft | None = None\n    approvals: tuple[Approval, ...] = ()\n    stages: tuple[str, ...] = ()\n    error: FrameworkError | None = None\n\n\nCONTRACT_TYPES = (Context, DocumentRef, AssetRef, Criterion, ExtractRequest, CriteriaDraft,\n                  RetrieveRequest, EvidenceBundle, InspectRequest, InspectionResult,\n                  ValidateRequest, ValidatedResult, ReportRequest, ReportDraft, Approval,\n                  FrameworkError, RunSnapshot)\n","sha256":"ead26cafc963c465980619fd6029764f69122f3cbcc6fc6d2f283f3201996023"},"backend/agent_framework/ports.py":{"text":"\"\"\"Implement these interfaces without importing another agent's internals or ORM.\"\"\"\nfrom dataclasses import dataclass\nfrom typing import Protocol\n\nfrom .contracts import (CriteriaDraft, EvidenceBundle, ExtractRequest, InspectRequest,\n                        InspectionResult, ReportDraft, ReportRequest, RetrieveRequest,\n                        ValidateRequest, ValidatedResult)\n\n\nclass Extractor(Protocol):\n    def extract(self, request: ExtractRequest) -\u003e CriteriaDraft: ...\n\n\nclass Retriever(Protocol):\n    def retrieve(self, request: RetrieveRequest) -\u003e EvidenceBundle: ...\n\n\nclass Inspector(Protocol):\n    def inspect(self, request: InspectRequest) -\u003e InspectionResult: ...\n\n\nclass Validator(Protocol):\n    def validate(self, request: ValidateRequest) -\u003e ValidatedResult: ...\n\n\nclass Reporter(Protocol):\n    def report(self, request: ReportRequest) -\u003e ReportDraft: ...\n\n\n@dataclass(frozen=True)\nclass Agents:\n    extractor: Extractor\n    retriever: Retriever\n    inspector: Inspector\n    validator: Validator\n    reporter: Reporter\n\n\nclass AdapterFailure(Exception):\n    \"\"\"Safe, structured adapter error. An ambiguous remote call is never retried here.\"\"\"\n    def __init__(self, code: str, message: str, *, retryable=False, outcome_unknown=False):\n        super().__init__(message)\n        self.code, self.message = code, message\n        self.retryable, self.outcome_unknown = retryable, outcome_unknown\n","sha256":"4d9ad3d3890c01dd6a9b7d9a657fee132bf955f2426abfbd8c125806bb257256"},"backend/agent_framework/runtime.py":{"text":"\"\"\"Development-only, in-memory LangGraph workflow.\n\nAll runs and approvals disappear when this Workflow instance is discarded or the\nprocess exits. This is an integration scaffold, not a durable worker, an identity\nprovider, or evidence that a real model/database was executed. The service that\nadopts it must implement authorization and persistence at its own boundary.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom threading import RLock\nfrom typing import Any, TypeVar, TypedDict\n\nfrom langgraph.graph import END, START, StateGraph\nfrom pydantic import BaseModel\n\nfrom .contracts import (\n    Approval, AssetRef, Context, CriteriaDraft, DocumentRef, EvidenceBundle,\n    ExtractRequest, FrameworkError, InspectionResult, InspectRequest, ReportDraft,\n    ReportRequest, RetrieveRequest, RunSnapshot, ValidatedResult, ValidateRequest,\n)\nfrom .ports import AdapterFailure, Agents\nfrom .validation import (\n    validate_draft, validate_evidence, validate_inspection, validate_report,\n    validate_validated,\n)\n\nT = TypeVar('T', bound=BaseModel)\n_EXCEPTION_BLOCKERS = frozenset({\n    'missing_observation', 'missing_requirement_evidence', 'missing_citation',\n    'uncertain_observation', 'unsupported_criterion', 'retrieval_incomplete',\n    'numeric_observation_invalid', 'verdict_conflict',\n})\n\n\ndef _boundary(contract: type[T], value: Any) -\u003e T:\n    \"\"\"Revalidate even model_construct/model_copy values; do not trust frozen models.\"\"\"\n    try:\n        if isinstance(value, BaseModel):\n            if not isinstance(value, contract):\n                raise ValueError('unexpected contract type')\n            value = value.model_dump(mode='python')\n        return contract.model_validate(value).model_copy(deep=True)\n    except (ValueError, TypeError) as exc:\n        raise ValueError(f'invalid {contract.__name__} contract') from exc\n\n\ndef _copy(value: T) -\u003e T:\n    return value.model_copy(deep=True)\n\n\nclass _GraphState(TypedDict):\n    run_id: str\n\n\n@dataclass\nclass _Run:\n    document: DocumentRef\n    asset: AssetRef\n    snapshot: RunSnapshot\n    lock: Any = field(default_factory=RLock)\n    child_run_id: str | None = None\n\n\nclass Workflow:\n    \"\"\"Synchronous adapters behind replaceable contracts and real LangGraph nodes.\n\n    Different runs may execute concurrently. A per-run lock serializes approvals;\n    repeated or stale commands raise ValueError and leave existing runs unchanged.\n    Adapter/output failures close the affected run; no adapter is auto-retried.\n    \"\"\"\n\n    persistence = 'memory_only'\n\n    def __init__(self, agents: Agents, profile: str = 'development'):\n        if profile not in ('development', 'test'):\n            raise ValueError('Workflow supports development/test only; memory is not production persistence')\n        self.agents = agents\n        self.profile = profile\n        self._runs: dict[str, _Run] = {}\n        self._registry_lock = RLock()\n        extraction = StateGraph(_GraphState)\n        extraction.add_node('A02', self._extract)\n        extraction.add_edge(START, 'A02')\n        extraction.add_edge('A02', END)\n        self._extraction_graph = extraction.compile()\n        review = StateGraph(_GraphState)\n        nodes = [('A03', self._retrieve), ('A04_A05', self._inspect),\n                 ('A06', self._validate), ('A07', self._report)]\n        for name, fn in nodes:\n            review.add_node(name, fn)\n        for left, right in zip([START] + [name for name, _ in nodes],\n                               [name for name, _ in nodes] + [END]):\n            review.add_edge(left, right)\n        self._review_graph = review.compile()\n\n    def _record(self, run_id: str) -\u003e _Run:\n        with self._registry_lock:\n            record = self._runs.get(run_id)\n        if record is None:\n            raise KeyError('unknown run; this runtime has no persistent storage')\n        return record\n\n    def _save(self, record: _Run, **updates: Any) -\u003e None:\n        record.snapshot = _boundary(RunSnapshot, record.snapshot.model_copy(update=updates))\n\n    def _output(self, record: _Run, stage: str, field_name: str, value: T) -\u003e None:\n        synthetic = record.snapshot.synthetic or bool(getattr(value, 'synthetic', False))\n        value = _boundary(type(value), value.model_copy(update={'synthetic': synthetic}))\n        self._save(record, **{field_name: value}, synthetic=synthetic,\n                   stages=record.snapshot.stages + (stage,))\n\n    def _failed(self, record: _Run, exc: Exception) -\u003e RunSnapshot:\n        if isinstance(exc, AdapterFailure):\n            error = FrameworkError(code=exc.code, message=exc.message,\n                                   retryable=exc.retryable, outcome_unknown=exc.outcome_unknown)\n        else:\n            # Do not include arbitrary provider errors or invalid payloads in output.\n            error = FrameworkError(code='contract_violation' if isinstance(exc, ValueError) else 'adapter_failed',\n                                   message='The stage failed. Inspect the adapter contract before an explicit new run.')\n        self._save(record, execution_status='outcome_unknown' if error.outcome_unknown else 'failed', error=error)\n        return _copy(record.snapshot)\n\n    def start(self, context: Context, document: DocumentRef, asset: AssetRef) -\u003e RunSnapshot:\n        context = _boundary(Context, context)\n        document = _boundary(DocumentRef, document)\n        asset = _boundary(AssetRef, asset)\n        if context.parent_run_id is not None:\n            raise ValueError('use rereview to create a child run')\n        self._input_scope(context, document, asset)\n        record = _Run(document, asset, RunSnapshot(context=context, profile=self.profile,\n            synthetic=False, execution_status='waiting_criteria', stages=('A01',)))\n        # Publish only after holding this record's lock: get cannot observe a partial start.\n        with record.lock:\n            with self._registry_lock:\n                if context.run_id in self._runs:\n                    raise ValueError('run_id already exists')\n                self._runs[context.run_id] = record\n            try:\n                self._extraction_graph.invoke({'run_id': context.run_id}, {'recursion_limit': 8})\n            except Exception as exc:\n                return self._failed(record, exc)\n            return _copy(record.snapshot)\n\n    @staticmethod\n    def _input_scope(context: Context, document: DocumentRef, asset: AssetRef) -\u003e None:\n        if context.document_version_id != document.document_version_id:\n            raise ValueError('document version differs from context')\n        if context.asset_version_id != asset.asset_version_id:\n            raise ValueError('asset version differs from context')\n\n    def get(self, run_id: str) -\u003e RunSnapshot:\n        record = self._record(run_id)\n        with record.lock:\n            return _copy(record.snapshot)\n\n    def approve(self, run_id: str, approval: Approval) -\u003e RunSnapshot:\n        approval = _boundary(Approval, approval)\n        record = self._record(run_id)\n        with record.lock:\n            state = record.snapshot\n            if approval.context != state.context or approval.actor_id != state.context.actor_id:\n                raise ValueError('approval actor/context does not match the exact run snapshot')\n            if any(item.decision == approval.decision for item in state.approvals):\n                raise ValueError('approval already recorded')\n            decision = approval.decision\n            if decision == 'approve_criteria':\n                if state.execution_status != 'waiting_criteria' or state.criteria is None:\n                    raise ValueError('criteria approval is not available')\n                self._save(record, approvals=state.approvals + (approval,))\n                try:\n                    self._review_graph.invoke({'run_id': run_id}, {'recursion_limit': 12})\n                except Exception as exc:\n                    return self._failed(record, exc)\n            else:\n                if state.execution_status != 'waiting_review' or state.validated is None or state.report is None:\n                    raise ValueError('review approval is not available')\n                if decision == 'approve_changes':\n                    self._save(record, execution_status='waiting_revision', human_decision='changes_approved',\n                               approvals=state.approvals + (approval,))\n                elif decision == 'approve_final':\n                    if state.machine_verdict != 'pass':\n                        raise ValueError('normal final approval requires a pass; exceptions need explicit scope')\n                    self._save(record, execution_status='completed', human_decision='final_approved',\n                               approvals=state.approvals + (approval,))\n                elif decision == 'approve_exception':\n                    self._exception_scope(state, approval)\n                    self._save(record, execution_status='completed', human_decision='exception_approved',\n                               approvals=state.approvals + (approval,))\n            return _copy(record.snapshot)\n\n    @staticmethod\n    def _exception_scope(state: RunSnapshot, approval: Approval) -\u003e None:\n        if state.criteria is None or state.validated is None or state.evidence is None:\n            raise ValueError('validated evidence is required for an exception')\n        if state.evidence.status != 'complete':\n            raise ValueError('incomplete retrieval cannot be approved as an exception')\n        if any(_EXCEPTION_BLOCKERS.intersection(item.issues) for item in state.validated.items):\n            raise ValueError('unknown or unsupported evidence cannot be approved as an exception')\n        # Custom A06 adapters cannot silently turn new uncertainty codes into an\n        # exception path. New eligible issue codes require a shared policy change.\n        if any(item.verdict == 'review' or set(item.issues) - {'value_mismatch'}\n               for item in state.validated.items):\n            raise ValueError('unknown or unsupported evidence cannot be approved as an exception')\n        ids = set(approval.criterion_ids)\n        criteria = {item.criterion_id: item for item in state.criteria.criteria}\n        if len(ids) != len(approval.criterion_ids) or not ids or ids - criteria.keys():\n            raise ValueError('exception targets must be unique existing criteria')\n        required = {item.criterion_id for item in state.validated.items\n                    if criteria[item.criterion_id].required and item.verdict != 'pass'}\n        if not required or not required.issubset(ids):\n            raise ValueError('exception must cover every non-pass required criterion')\n\n    def rereview(self, parent_run_id: str, new_context: Context, asset: AssetRef) -\u003e RunSnapshot:\n        new_context = _boundary(Context, new_context)\n        asset = _boundary(AssetRef, asset)\n        parent = self._record(parent_run_id)\n        with parent.lock:\n            old = parent.snapshot\n            if old.execution_status != 'waiting_revision' or old.human_decision != 'changes_approved':\n                raise ValueError('an approved change request is required before rereview')\n            if parent.child_run_id is not None:\n                raise ValueError('this change request already has a child run')\n            if (new_context.parent_run_id != parent_run_id or new_context.run_id == parent_run_id\n                    or new_context.project_id != old.context.project_id\n                    or new_context.document_version_id != old.context.document_version_id\n                    or new_context.criteria_version_id != old.context.criteria_version_id\n                    or asset.asset_version_id == parent.asset.asset_version_id):\n                raise ValueError('rereview requires the same project/document/criteria and a new run/asset version')\n            self._input_scope(new_context, parent.document, asset)\n            if old.criteria is None:\n                raise ValueError('parent has no reusable criteria draft')\n            draft = _boundary(CriteriaDraft, old.criteria.model_copy(update={'context': new_context}))\n            validate_draft(new_context, parent.document, draft)\n            child = _Run(_copy(parent.document), asset, RunSnapshot(context=new_context, profile=self.profile,\n                synthetic=old.synthetic, execution_status='waiting_criteria', criteria=draft,\n                stages=('A08', 'A01', 'A02_draft_reused')))\n            with self._registry_lock:\n                if new_context.run_id in self._runs:\n                    raise ValueError('run_id already exists')\n                self._runs[new_context.run_id] = child\n                parent.child_run_id = new_context.run_id\n            return _copy(child.snapshot)\n\n    def _extract(self, state: _GraphState) -\u003e dict:\n        record = self._record(state['run_id'])\n        context = record.snapshot.context\n        request = ExtractRequest(context=_copy(context), document=_copy(record.document), synthetic=record.snapshot.synthetic)\n        result = _boundary(CriteriaDraft, self.agents.extractor.extract(request))\n        validate_draft(context, record.document, result)\n        self._output(record, 'A02', 'criteria', result)\n        return {}\n\n    def _retrieve(self, state: _GraphState) -\u003e dict:\n        record = self._record(state['run_id'])\n        request = RetrieveRequest(context=_copy(record.snapshot.context), criteria=_copy(record.snapshot.criteria).criteria,\n                                  synthetic=record.snapshot.synthetic)\n        result = _boundary(EvidenceBundle, self.agents.retriever.retrieve(_copy(request)))\n        validate_evidence(request, result)\n        self._output(record, 'A03', 'evidence', result)\n        return {}\n\n    def _inspect_request(self, record: _Run) -\u003e InspectRequest:\n        return InspectRequest(context=_copy(record.snapshot.context), criteria=_copy(record.snapshot.criteria).criteria,\n                              synthetic=record.snapshot.synthetic,\n                              asset=_copy(record.asset), evidence=_copy(record.snapshot.evidence))\n\n    def _inspect(self, state: _GraphState) -\u003e dict:\n        record = self._record(state['run_id'])\n        request = self._inspect_request(record)\n        result = _boundary(InspectionResult, self.agents.inspector.inspect(_copy(request)))\n        validate_inspection(request, result)\n        self._output(record, 'A04_A05', 'inspection', result)\n        return {}\n\n    def _validate(self, state: _GraphState) -\u003e dict:\n        record = self._record(state['run_id'])\n        request = ValidateRequest(**self._inspect_request(record).model_dump(), inspection=_copy(record.snapshot.inspection))\n        result = _boundary(ValidatedResult, self.agents.validator.validate(_copy(request)))\n        validate_validated(request, result)\n        self._output(record, 'A06', 'validated', result)\n        self._save(record, machine_verdict=result.verdict)\n        return {}\n\n    def _report(self, state: _GraphState) -\u003e dict:\n        record = self._record(state['run_id'])\n        request = ReportRequest(context=_copy(record.snapshot.context), validated=_copy(record.snapshot.validated),\n                                synthetic=record.snapshot.synthetic,\n                                evidence=_copy(record.snapshot.evidence))\n        result = _boundary(ReportDraft, self.agents.reporter.report(_copy(request)))\n        validate_report(request, result)\n        self._output(record, 'A07', 'report', result)\n        self._save(record, execution_status='waiting_review')\n        return {}\n","sha256":"30ec76fc75d3520151aaddbdad6aeeb5a18eed82ebe652f629cd34847b7055c6"},"backend/agent_framework/validation.py":{"text":"\"\"\"A06 reference policy and boundary checks; these do not establish model accuracy.\"\"\"\nfrom decimal import Decimal, InvalidOperation\nfrom hashlib import sha256\n\nfrom .contracts import (Context, CriteriaDraft, DocumentRef, EvidenceBundle,\n                        InspectRequest, InspectionResult, ReportDraft, ReportRequest,\n                        RetrieveRequest, ValidateRequest, ValidatedItem, ValidatedResult)\n\n\ndef ensure_context(expected: Context, result) -\u003e None:\n    if result.context != expected:\n        raise ValueError(\"CONTEXT_MISMATCH: project/run/version snapshot changed\")\n\n\ndef _unique(values, label):\n    values = tuple(values)\n    if len(set(values)) != len(values):\n        raise ValueError(f\"DUPLICATE_{label}\")\n\n\ndef _criteria(context, criteria):\n    _unique((c.criterion_id for c in criteria), \"CRITERION\")\n    for criterion in criteria:\n        source = criterion.source\n        if source.document_version_id != context.document_version_id:\n            raise ValueError(\"CRITERION_DOCUMENT_MISMATCH\")\n        if sha256(source.quote.encode(\"utf-8\")).hexdigest() != source.source_hash:\n            raise ValueError(\"SOURCE_HASH_MISMATCH\")\n\n\ndef validate_draft(context: Context, document: DocumentRef, draft: CriteriaDraft) -\u003e None:\n    ensure_context(context, draft)\n    if document.document_version_id != context.document_version_id:\n        raise ValueError(\"DOCUMENT_VERSION_MISMATCH\")\n    _criteria(context, draft.criteria)\n    if any(c.source.page \u003e document.page_count for c in draft.criteria):\n        raise ValueError(\"SOURCE_PAGE_OUT_OF_RANGE\")\n\n\ndef validate_evidence(request: RetrieveRequest, bundle: EvidenceBundle) -\u003e None:\n    ensure_context(request.context, bundle)\n    _criteria(request.context, request.criteria)\n    criteria = {c.criterion_id: c for c in request.criteria}\n    _unique((e.evidence_id for e in bundle.evidence), \"EVIDENCE\")\n    if bundle.status == \"empty\" and bundle.evidence:\n        raise ValueError(\"EMPTY_RETRIEVAL_HAS_EVIDENCE\")\n    if (bundle.status == \"complete\" and bundle.graph_revision is not None\n            and bundle.graph_revision \u003c bundle.postgres_revision):\n        raise ValueError(\"STALE_GRAPH_MARKED_COMPLETE\")\n    for evidence in bundle.evidence:\n        if evidence.project_id != request.context.project_id:\n            raise ValueError(\"EVIDENCE_PROJECT_MISMATCH\")\n        if not set(evidence.criterion_ids) \u003c= criteria.keys():\n            raise ValueError(\"UNKNOWN_EVIDENCE_CRITERION\")\n        if sha256(evidence.source.quote.encode(\"utf-8\")).hexdigest() != evidence.source.source_hash:\n            raise ValueError(\"EVIDENCE_HASH_MISMATCH\")\n        if evidence.kind == \"current_requirement\":\n            if any(evidence.source != criteria[cid].source for cid in evidence.criterion_ids):\n                raise ValueError(\"EVIDENCE_SOURCE_MISMATCH\")\n        if evidence.kind == \"approved_exception\":\n            if (evidence.source.document_version_id != request.context.document_version_id\n                    or evidence.applicable_asset_version_id != request.context.asset_version_id):\n                raise ValueError(\"EXCEPTION_SCOPE_MISMATCH\")\n\n\ndef validate_inspection(request: InspectRequest, result: InspectionResult) -\u003e None:\n    ensure_context(request.context, result)\n    validate_evidence(RetrieveRequest(context=request.context, criteria=request.criteria), request.evidence)\n    if request.asset.asset_version_id != request.context.asset_version_id:\n        raise ValueError(\"ASSET_VERSION_MISMATCH\")\n    ids = {c.criterion_id for c in request.criteria}\n    evidence = {e.evidence_id: e for e in request.evidence.evidence}\n    _unique((o.criterion_id for o in result.observations), \"OBSERVATION\")\n    for observation in result.observations:\n        if observation.criterion_id not in ids:\n            raise ValueError(\"UNKNOWN_OBSERVATION_CRITERION\")\n        if (observation.image.asset_version_id != request.asset.asset_version_id\n                or observation.image.asset_hash != request.asset.sha256):\n            raise ValueError(\"OBSERVATION_ASSET_MISMATCH\")\n        _unique(observation.evidence_ids, \"CITATION\")\n        for eid in observation.evidence_ids:\n            if eid not in evidence:\n                raise ValueError(\"UNKNOWN_CITATION\")\n            source = evidence[eid]\n            if (source.kind == \"historical_context\"\n                    or observation.criterion_id not in source.criterion_ids):\n                raise ValueError(\"INVALID_OBSERVATION_CITATION\")\n\n\ndef aggregate(criteria, items):\n    required_ids = {c.criterion_id for c in criteria if c.required}\n    verdicts = [i.verdict for i in items if i.criterion_id in required_ids]\n    if \"fail\" in verdicts:\n        return \"fail\"\n    if \"review\" in verdicts or not verdicts:\n        return \"review\"\n    return \"pass\"\n\n\ndef validate_validated(request: ValidateRequest, result: ValidatedResult) -\u003e None:\n    ensure_context(request.context, result)\n    _unique((i.criterion_id for i in result.items), \"VALIDATED_ITEM\")\n    if {i.criterion_id for i in result.items} != {c.criterion_id for c in request.criteria}:\n        raise ValueError(\"VALIDATION_MUST_COVER_ALL_CRITERIA\")\n    if aggregate(request.criteria, result.items) != result.verdict:\n        raise ValueError(\"AGGREGATE_VERDICT_MISMATCH\")\n    # Independent of a team's custom A06 implementation, basic missing-data rules hold.\n    safe = ReferenceValidator().validate(request)\n    safe_items = {i.criterion_id: i for i in safe.items}\n    for item in result.items:\n        expected = safe_items[item.criterion_id]\n        if expected.verdict != \"pass\" and item.verdict == \"pass\":\n            raise ValueError(\"VALIDATOR_UNSUPPORTED_PASS\")\n        if expected.verdict == \"fail\" and item.verdict != \"fail\":\n            raise ValueError(\"VALIDATOR_HID_CONFIRMED_FAILURE\")\n        if not set(expected.issues) \u003c= set(item.issues):\n            raise ValueError(\"VALIDATOR_DROPPED_LIMITATIONS\")\n\n\ndef validate_report(request: ReportRequest, result: ReportDraft) -\u003e None:\n    ensure_context(request.context, request.validated)\n    ensure_context(request.context, request.evidence)\n    ensure_context(request.context, result)\n    if result.verdict != request.validated.verdict:\n        raise ValueError(\"REPORT_CHANGED_VERDICT\")\n    _unique(result.evidence_ids, \"REPORT_CITATION\")\n    allowed = {e.evidence_id for e in request.evidence.evidence}\n    if not set(result.evidence_ids) \u003c= allowed:\n        raise ValueError(\"UNKNOWN_REPORT_CITATION\")\n    if request.evidence.evidence and not result.evidence_ids:\n        raise ValueError(\"REPORT_CITATION_REQUIRED\")\n\n\nclass ReferenceValidator:\n    \"\"\"Conservative example A06. Visual observations remain a model's claims.\n\n    No automatic exception application, semantic entailment or group policies.\n    Those extensions must retain these coverage/citation/version boundaries.\n    \"\"\"\n\n    def validate(self, request: ValidateRequest) -\u003e ValidatedResult:\n        validate_inspection(InspectRequest(context=request.context, criteria=request.criteria,\n                                          asset=request.asset, evidence=request.evidence), request.inspection)\n        observations = {o.criterion_id: o for o in request.inspection.observations}\n        evidence = {e.evidence_id: e for e in request.evidence.evidence}\n        items = []\n        for criterion in request.criteria:\n            issues = []\n            observation = observations.get(criterion.criterion_id)\n            verdict = observation.verdict if observation else \"review\"\n            if not observation:\n                issues.append(\"missing_observation\")\n            else:\n                if observation.uncertainty:\n                    issues.append(\"uncertain_observation\")\n                    verdict = \"review\"\n                if not observation.observed.strip():\n                    issues.append(\"missing_observation\")\n                    verdict = \"review\"\n                if not any(evidence[eid].kind == \"current_requirement\" for eid in observation.evidence_ids):\n                    issues.append(\"missing_citation\")\n                supported = {\"text\": {\"equals\", \"contains\"}, \"number\": {\"equals\", \"gte\", \"lte\"},\n                             \"visual\": {\"present\"}}\n                if criterion.operator not in supported.get(criterion.kind, set()):\n                    issues.append(\"unsupported_criterion\")\n                    verdict = \"review\"\n                elif criterion.kind == \"number\" and not observation.uncertainty and observation.observed.strip():\n                    try:\n                        observed, expected = Decimal(observation.observed), Decimal(criterion.expected)\n                        if not observed.is_finite() or not expected.is_finite():\n                            raise InvalidOperation\n                        comparisons = {\"equals\": observed == expected, \"gte\": observed \u003e= expected,\n                                       \"lte\": observed \u003c= expected}\n                        if criterion.operator not in comparisons:\n                            issues.append(\"unsupported_criterion\")\n                            verdict = \"review\"\n                        elif not comparisons[criterion.operator]:\n                            verdict = \"fail\"\n                            issues.append(\"value_mismatch\")\n                        elif observation.verdict == \"fail\":\n                            verdict = \"review\"\n                            issues.append(\"verdict_conflict\")\n                    except InvalidOperation:\n                        issues.append(\"numeric_observation_invalid\")\n                        verdict = \"review\"\n                elif criterion.kind == \"text\" and not observation.uncertainty and observation.observed.strip():\n                    matched = (criterion.expected == observation.observed if criterion.operator == \"equals\"\n                               else criterion.expected in observation.observed)\n                    if not matched:\n                        verdict = \"fail\"\n                        issues.append(\"value_mismatch\")\n                    elif observation.verdict == \"fail\":\n                        verdict = \"review\"\n                        issues.append(\"verdict_conflict\")\n            if not any(e.kind == \"current_requirement\" and criterion.criterion_id in e.criterion_ids\n                       for e in evidence.values()):\n                issues.append(\"missing_requirement_evidence\")\n            if request.evidence.status != \"complete\":\n                issues.append(\"retrieval_incomplete\")\n            if issues and verdict == \"pass\":\n                verdict = \"review\"\n            items.append(ValidatedItem(criterion_id=criterion.criterion_id, verdict=verdict, issues=tuple(issues)))\n        return ValidatedResult(context=request.context, verdict=aggregate(request.criteria, items),\n                               items=tuple(items),\n                               limitations=(\"Reference policy only; visual accuracy and source authority require real adapters.\",),\n                               synthetic=request.synthetic or request.inspection.synthetic or request.evidence.synthetic)\n","sha256":"c44dcfc0db3a710a1d03c9bb432fd5e08e687a59308fc992b2309a897165dcb9"},"docs/agent-framework/README.md":{"text":"# 에이전트 공통 개발 프레임워크\n\n각 담당자가 같은 JSON 계약으로 자신의 역할을 단독 개발하고, 합성 입력으로 전체 흐름을 연결하는 개발용 기반이다. `backend/agent_framework`는 기존 제품 앱과 분리되어 있다.\n\n**[HTML 업무 흐름 열기](flow.html)** — 노드 선택·검색·확대/이동·기본 검수/재검수/검색 장애 시나리오 탐색을 제공한다. HTML 파일을 브라우저에서 열면 되며 Python이나 서버를 실행할 필요가 없다. 실제 코드의 함수·클래스 관계는 **[Graphify 코드 지도](graphify-out/graph.html)**와 [추출 진단 보고서](graphify-out/GRAPH_REPORT.md)에서 확인한다. 업무 흐름은 코드·계획을 대조해 정리한 설명 그래프이며 실행 모니터가 아니다.\n\n브라우저에서 열 파일은 **`docs/agent-framework/flow.html`**이다. 업무 흐름의 원본은 `flow-data.json`과 빌드 전용 `scripts/templates/agent-flow.html.in`이며 `python -m scripts.build_agent_flow_html`로 단일 HTML을 재생성한다. 이전 `scripts/templates/agent-flow.html` 경로는 완성본으로 이동하는 안내 페이지다. Graphify 코드 지도는 별도 임시 환경의 공식 `graphifyy==0.9.100`으로 생성했다. 프로젝트 의존성에는 추가하지 않았다. 두 HTML은 자동 외부 자원을 로드하지 않도록 만들었으며 정적 구조·JavaScript 문법을 검사했다. 브라우저 렌더링은 미검증이다.\n\n현재 제공하는 것은 Pydantic 계약, 교체 가능한 역할 포트, 실제 LangGraph 단계 실행, 메모리 내 승인·재검수 상태, 참조 검증기, 합성 어댑터, CLI 및 개발 API다. **실제 PDF·포스터 읽기, Qwen 추론, PostgreSQL·Neo4j 조회, MCP 통신, 영속 worker, 인증, front-v2 연결은 구현하지 않았다.**\n\n현재 로컬 검증 결과와 범위는 [검증 기록](verification-2026-11-02.md)에 정리했다.\n\n제품 목표는 **PDF·Qwen3.5-4B·PostgreSQL/Neo4j 근거 검색 및 RAG·데스크톱 front-v2**다. PaddleOCR를 포함한 별도 OCR 대체 경로, 벡터 DB·임베딩·벡터 인덱스를 추가하지 않는다. 실제 어댑터 구현 범위는 [전체 계획](../planning/pdf-qwen-rag-workflow-plan-2026-11-02.md)을 따른다.\n\n## 설치와 첫 실행\n\n저장소 루트에서 실행한다. Python **3.12 이상, 3.14 미만**과 `uv`가 필요하다. 의존성 정본은 루트 `pyproject.toml`·`uv.lock`이며 개별 에이전트용 requirements를 따로 만들지 않는다.\n\n```sh\nuv sync --locked --group dev\n```\n\n이 명령은 잠금 버전으로 개발 의존성을 동기화한다. 이미 설치된 `.venv`를 사용해도 되지만 잠금 파일과 다른 환경의 결과를 동일한 검증으로 표시하지 않는다.\n\nmacOS:\n\n```sh\n.venv/bin/python -m backend.agent_framework demo\n.venv/bin/python -m pytest tests/agent_framework -q\n```\n\nWindows PowerShell:\n\n```powershell\n.\\.venv\\Scripts\\python.exe -m backend.agent_framework demo\n.\\.venv\\Scripts\\python.exe -m pytest tests/agent_framework -q\n```\n\n`demo`는 **SYNTHETIC** 안내를 stderr에, 결과 JSON을 stdout에 출력한다. 조건 승인 → 검사·보고 → 수정 요청 승인 → 새 포스터 버전 → 조건 재승인 → 전체 재검수 → 최종 승인까지 두 실행을 만든다. 여기서 승인자는 스크립트가 넣은 테스트 값이며 실제 사용자의 승인 증거가 아니다.\n\n`--output \u003c파일\u003e`로 JSON을 저장할 수 있다. 상위 디렉터리는 미리 존재해야 한다. 합성 참조의 파일 해시는 예제 문자열의 해시이며 실제 PDF·이미지 파일의 해시가 아니다.\n\n## 담당별 입력과 출력\n\n| 역할 | 호출 포트 | 입력 → 출력 | 담당 범위 |\n|---|---|---|---|\n| A01 | `Workflow.start/approve/get` | 실행 문맥·파일 참조·승인 → `RunSnapshot` | 공통 실행·상태 전환·계약 연결 |\n| A02 | `Extractor.extract` | `ExtractRequest` → `CriteriaDraft` | PDF 전체 처리·조건·원문 출처 |\n| A03 | `Retriever.retrieve` | `RetrieveRequest` → `EvidenceBundle` | 승인 기준·원문·예외·이력 검색 |\n| A04·A05 | `Inspector.inspect` | `InspectRequest` → `InspectionResult` | 현재 포스터 관측·조건별 판정 초안 |\n| A06 | `Validator.validate` | `ValidateRequest` → `ValidatedResult` | 전체 조건 커버리지·관측·인용·판정 검증 |\n| A07 | `Reporter.report` | `ReportRequest` → `ReportDraft` | 검증된 판정의 설명·수정 요청 초안 |\n| A08 | `Workflow.rereview` | 부모 실행·새 문맥·새 산출물 → 새 `RunSnapshot` | 수정 요청 승인 확인·전체 재검수 |\n\n소유 파일은 다음처럼 나눈다.\n\n- 공통 기반 담당: `contracts.py`, `ports.py`, `runtime.py`, `validation.py`, `api.py`, CLI, 계약 스키마, 통합 테스트.\n- 개별 담당: 팀 소유 어댑터 모듈과 해당 테스트. 다른 역할의 내부 구현이나 ORM을 직접 import하지 않는다.\n- A01·A08 상태 전환은 공통 기반 담당이 관리한다. DB 스키마·마이그레이션도 통합 담당 한 명이 소유하며 각 역할이 독립 테이블을 임의 생성하지 않는다.\n- front-v2·기존 인증·M008·운영 worker 변경은 별도 제품 통합 작업이다.\n\n## 한 역할만 실행하기\n\n예제 입력·예상 출력은 `examples/agent_framework/`에 있다. 역할 입력은 `A02.json`처럼, 예상 출력은 `A02.output.json`처럼 구분한다.\n\n```sh\n.venv/bin/python -m backend.agent_framework role A03 --input examples/agent_framework/A03.json --synthetic\n.venv/bin/python -m backend.agent_framework role A04_A05 --input examples/agent_framework/A04_A05.json --synthetic --scenario fail\n.venv/bin/python -m backend.agent_framework role A06 --input examples/agent_framework/A06.json --synthetic\n```\n\nWindows 실행 파일은 `.\\.venv\\Scripts\\python.exe`이며 인자는 동일하다.\n\n`--synthetic` 시나리오는 `pass`, `fail`, `review`, `stale`, `unavailable`다. 시나리오 효과는 해당 역할에 한정된다. 예를 들어 A06는 받은 관측을 검증하므로 `--scenario fail`만 주어 관측을 임의 변경하지 않는다. 연속 시나리오의 검증 결과는 `examples/agent_framework/scenarios/*.validated.json`에 있다.\n\nCLI는 요청·응답 스키마와 공통 역할 검증을 적용한다. `--synthetic` 또는 `--factory`를 지정하지 않으면 `ADAPTER_NOT_CONFIGURED`로 종료한다. 미구현 어댑터를 합성 성공으로 대체하지 않는다.\n\n종료 코드는 정상 계약 출력 `0`, 어댑터·역할 검증 실패 `1`, 입력·파일·설정 오류 `2`다. 기계 판정 `fail/review`도 정상적인 검사 결과이므로 그것만으로 CLI 오류가 되지는 않는다. 역할 처리 오류는 `error` 안에 `FrameworkError` 계약을 담은 JSON으로 반환하며 실패 시 기존 출력 파일을 덮어쓰지 않는다. 명령 인자 사용법 오류는 stderr의 안내를 확인한다.\n\n## 자신의 어댑터 연결\n\n`examples/agent_framework/custom_adapter.py`는 연결 지점 예제다. 기본 상태에서는 실제 서비스를 호출하지 않고 `ADAPTER_NOT_CONFIGURED`를 발생시킨다. 메서드를 구현한 뒤 명시적으로 factory를 선택한다.\n\n```sh\n.venv/bin/python -m backend.agent_framework role A03 --input examples/agent_framework/A03.json --factory examples.agent_framework.custom_adapter:make_agents\n```\n\nfactory는 인자 없이 호출되며 `ports.Agents`를 반환해야 한다. factory import는 로컬 Python 코드를 실행하므로 팀이 관리하는 신뢰된 모듈만 지정한다. 요청 JSON 안에서는 factory나 모듈을 지정할 수 없다.\n\n각 메서드는 동기식 계약을 따른다. 현재 프레임워크가 async 함수·원격 호출 timeout·재시도·비밀정보 설정을 대신 구현하지 않는다. 원격 호출 결과를 알 수 없으면 `AdapterFailure(..., outcome_unknown=True)`로 반환하고 자동으로 다시 호출하지 않는다. 알려진 오류 메시지만 안전하게 전달한다.\n\n실제 출력은 실행 증거가 있을 때만 `synthetic=False`로 표시한다. 합성 입력이나 이전 단계가 섞인 전체 실행은 계속 `synthetic=True`로 추적된다. 이 플래그 자체가 실제 모델·DB 연결을 증명하지는 않는다.\n\n모든 역할 요청에도 `synthetic` 필드가 있다. 합성 조건 초안에서 조건 목록만 꺼내 A03에 전달할 때도 이 표시를 유지한다. 같은 어댑터 인스턴스는 여러 실행에서 호출될 수 있으므로 공유 상태의 스레드 안전성과 모델 동시 실행 제한은 해당 구현에서 관리한다.\n\n## 계약에서 지켜야 할 경계\n\n- **ID와 버전:** 프로젝트·실행·문서·조건·산출물 버전은 요청 문맥과 동일해야 한다. ID는 공통 `Identifier` 문자열 규격을 사용하며 모델이 임의 발급·변경하지 않는다. 제품 UUID 매핑은 이후 저장소 어댑터가 맡는다.\n- **원문:** 인용 위치는 1부터 시작하는 페이지와 블록 ID를 사용한다. `SourceRef.source_hash`는 인용문 UTF-8 바이트의 SHA-256이며 파일 해시와 다르다. 참조 검증은 해시 정합성을 확인할 뿐 실제 PDF에 그 문장이 있다는 사실을 증명하지 않는다.\n- **현재 관측:** 이미지 근거는 현재 산출물 버전·파일 해시를 가리킨다. 좌표가 있으면 정규화된 `x1,y1,x2,y2`를 사용한다. 과거 통과나 예외 승인은 현재 이미지 관측이 아니다.\n- **근거:** `current_requirement`, `approved_exception`, `historical_context`를 구분한다. A03의 예외 유효기간·철회·권한 확인은 실제 검색 구현의 책임이다. 참조 코드의 범위 검사를 실제 권한 검사로 부르지 않는다.\n- **조건 전체:** A03 검색이 검사 조건을 줄이면 안 된다. A06는 누락·중복·알 수 없는 ID·근거 부족을 확인하며 잘못된 통과를 차단한다.\n- **판정:** 실행 상태, 기계 판정, 사람 결정을 별도로 기록한다. A07은 A06의 판정을 변경하지 않는다. 예외 승인도 원래 기계 판정을 보존한다.\n- **재검수:** 수정 요청 승인 후 새 실행·산출물 버전을 등록한다. 현재 메서드는 같은 문서·조건 버전의 초안을 재사용하고 새 실행에서 다시 승인받는다. A03·A04/A05·A06·A07 모두 다시 실행한다. 문서나 기준 버전이 달라지면 새 `start`가 필요하다. 조건 편집 API는 이 범위에 없다.\n\n참조 A06는 텍스트·수치 대조와 누락·근거·범위의 기초 정책을 제공한다. 객체를 잘못 센 모델을 자동으로 교정하거나 시각 관측의 정확도를 보장하지 않는다. 복잡한 조건 그룹·정책 예외·문맥 판단은 후속 구현과 평가가 필요하다.\n\n일반 최종 승인은 `pass` 실행에만 허용한다. 개발 참조 정책의 예외 승인은 근거가 완전한 확정 `fail`만 대상으로 하며 `review`나 알 수 없는 검증 사유는 거부한다. 현재 허용 사유는 `value_mismatch`다. 새 검증 사유를 도입할 때에는 공통 담당과 예외 승인 정책도 함께 정한다.\n\n## 개발 API 프로토콜\n\nCLI 없이 팀별 클라이언트를 붙일 때 사용하는 **인증 없는 loopback 개발 API**다. 기존 제품 앱에는 마운트하지 않는다. API 기본 어댑터는 합성이며 health와 snapshot으로 개발 상태를 확인한다.\n\nmacOS 실행 명령:\n\n```sh\n.venv/bin/python -m uvicorn backend.agent_framework.api:create_app --factory --host 127.0.0.1 --port 8012\n```\n\nWindows PowerShell 실행 명령:\n\n```powershell\n.\\.venv\\Scripts\\python.exe -m uvicorn backend.agent_framework.api:create_app --factory --host 127.0.0.1 --port 8012\n```\n\n| 메서드·경로 | JSON 본문·응답 |\n|---|---|\n| `GET /api/framework/v1/health` | 개발 profile·합성 기본값·메모리 저장·인증 없음 |\n| `POST /api/framework/v1/runs` | `{context, document, asset}` → `RunSnapshot` |\n| `GET /api/framework/v1/runs/{run_id}` | 현재 프로세스가 보유한 실행 스냅샷 |\n| `POST /api/framework/v1/runs/{run_id}/approvals` | `Approval` → 갱신된 스냅샷 |\n| `POST /api/framework/v1/runs/{run_id}/revisions` | `{context, asset}` → 새 실행 스냅샷 |\n\nAPI를 실행하지 않아도 `examples/agent_framework/openapi.json`으로 계약을 확인할 수 있다. 실행 후에는 `/docs`와 `/openapi.json`을 사용한다. 입력 구조 오류는 422, 없는 실행은 404, 상태·승인 충돌은 409다. 단계 어댑터 실패는 반환된 스냅샷의 `failed/outcome_unknown`과 `error`로 확인한다. HTTP 성공만으로 검수 통과를 판단하지 않는다.\n\n`actor_id`는 테스트 문맥이며 로그인·권한의 증명이 아니다. `127.0.0.1`에만 바인딩한다. Host 검사만으로 외부 노출을 안전하게 만들 수 없다. 메모리 상태를 쓰므로 다중 worker·다중 인스턴스로 실행하지 않는다.\n\n현재 Workflow는 동기식이다. 조건 승인 요청은 해당 검사·보고 단계가 끝난 뒤 반환하며, 같은 실행의 GET도 그동안 기다릴 수 있다. 제품용 비동기 접수·진행률 조회 API는 후속 연결 범위다.\n\n## 저장·복구 범위\n\n실행 기록은 **현재 `Workflow` 인스턴스의 메모리에만 존재**한다. 프로세스 재시작이나 새 인스턴스 생성 시 실행·승인·단계 결과가 사라진다. LangGraph의 실제 노드를 사용하지만 PostgreSQL checkpoint·lease·heartbeat·영속 재개를 연결한 것은 아니다.\n\n같은 프로세스에서는 중복·오래된 승인과 실행 ID 충돌을 거부하고, 호출 결과 불명은 `outcome_unknown`으로 남긴다. 자동 재시도는 하지 않는다. 이 동작을 운영 DB의 멱등성·장애 복구 검증으로 확대 해석하지 않는다.\n\nPostgreSQL·Neo4j RAG의 실제 쿼리, projection/outbox, 권한·원문 버전·freshness, 동등한 SQL fallback, 원문 파일 검증, MCP 전송 및 모델 실행은 각 담당자가 연결해야 한다. 이 프레임워크를 실행한다고 기존 DB나 front-v2가 변경되지는 않는다.\n\n## 테스트·예제·스키마 갱신\n\n```sh\n.venv/bin/python -m pytest tests/agent_framework -q\n.venv/bin/python -m backend.agent_framework schema\n.venv/bin/python -m scripts.export_agent_framework\n```\n\n`scripts/export_agent_framework.py`는 `examples/agent_framework/` 아래 합성 입력·출력, `schemas/*.schema.json`, `openapi.json`을 함께 재생성한다. 실제 모델·DB는 실행하지 않는다. Windows에서는 `.\\.venv\\Scripts\\python.exe -m scripts.export_agent_framework`로 실행한다.\n\n스키마만 별도 디렉터리에 받으려면 `schema --output-dir \u003c디렉터리\u003e`를 사용한다. `CONTRACT_TYPES`의 각 타입에 대해 `NAME.schema.json`을 생성한다. 합성 역할 예제만 재생성하는 명령은 `python -m backend.agent_framework.adapters.generate_examples`다.\n\n공통 회귀에서 보존할 여섯 반례 묶음:\n\n| 반례 | 기대 동작 |\n|---|---|\n| 다른 프로젝트·문서·산출물 버전 | 범위 변경을 거부하고 성공 출력 차단 |\n| 근거 ID·인용 해시 위조, 과거 이력의 현재 관측 사용 | 인용·근거 검증 실패 |\n| 조건 누락·중복, 수량 불일치인데 통과 | 누락은 확인 필요, 확실한 위반은 유지 |\n| 검색 stale/unavailable, 관측 부족 | 확인 필요를 숨기지 않고 정상 통과 차단 |\n| A07 판정 변경, 승인 전 재검수·중복 승인 | 상태·판정 경계에서 거부 |\n| 미설정 어댑터, 모델 호출 결과 불명 | 합성 대체·자동 재호출 없이 명시적 실패/결과 불명 |\n\nCI에는 같은 계약·어댑터·CLI·runtime·API 테스트를 연결한다. 테스트 결과는 합성/계약 검증이며 실모델 정확도·실제 DB 성능·Windows 장치 검증을 대신하지 않는다. Windows 명령은 해당 플랫폼에서 실행한 증거와 별도로 관리한다.\n\n## 계약 변경 규칙\n\n1. 변경 제안에 영향받는 역할·필드·예제·소비자를 적고 공통 기반 담당과 먼저 합의한다.\n2. `contract_version`을 관리한다. 필드 제거·이름/의미/타입 변경은 호환되지 않는 변경으로 취급하고 이전 소비자 처리 방안을 함께 정한다.\n3. 계약을 바꿀 때 JSON Schema, 입력·출력 fixture, 반례, 문서·API 명세를 같이 갱신한다. 생성 파일만 수작업으로 고치지 않는다.\n4. 자기 역할 단독 테스트와 전체 합성 승인·재검수 테스트를 모두 통과시킨다. 인터페이스만 맞는다고 제품 통합 완료로 보고하지 않는다.\n5. 제품의 인증·파일 접근·M008·영속 실행기에 연결할 때에는 공통 통합 담당이 마이그레이션·권한·실행 소유권을 조정한다. 운영 데이터 변경은 이 개발 프레임워크 범위 밖이다.\n\n## 팀 공유 · macOS / Windows\n\nGit으로 받은 팀원은 **[공유 시작 페이지](index.html)**를 Chrome에서 연다. HTML만 열람할 때 Python, 서버, 가상환경은 필요하지 않다. [브라우저용 개발 안내](guide.html)에 두 OS의 실행 명령이 있다.\n\n별도 전달용은 저장소의 `share/agent-framework-2026-11-02.zip`이다. **전체 압축을 해제한 뒤 최상위 `index.html`**을 열며, 하위 폴더 구조를 유지한다. ZIP 내부에서 HTML만 여는 방식은 연결 문서를 찾지 못할 수 있다. 한글·공백이 있는 폴더에
