서도 상대 경로로 연결하도록 구성했다. 실제 Windows 장치 실행·렌더링은 별도 검증 대상이다.\n\n코드 근거는 `source.html?file=저장소상대경로#L행번호`로 열어 브라우저에서 해당 행을 표시한다. 내장된 소스 스냅샷이므로 파일 변경 후 아래 명령으로 갱신한다. 전체 계획의 작성자 로컬 채팅은 링크 대신 출처 ID로 남겼다.\n\n```sh\npython -m scripts.package_agent_framework\n```\n\n표준 라이브러리만으로 시작 페이지·안내·업무 흐름·코드 뷰어와 ZIP을 재생성한다. ZIP에는 전체 계획, Graphify 결과·라이선스, 공통 Python 소스, 합성 예제·스키마, 테스트, 저장소 정본 `pyproject.toml`·`uv.lock`이 포함된다. 전체 제품 프론트/백엔드, `.env`, 모델 가중치, `.venv`, 업로드 파일, DB, Git 이력은 포함하지 않는다. 각 파일의 해시는 ZIP 안 `MANIFEST.json`에, ZIP의 해시는 옆 `.zip.sha256` 파일에 기록한다.\n\nGraphify 관계 지도는 현재 코드의 AST 스냅샷이다. 구조가 바뀌면 `scripts/build_agent_code_graph.py`로 이를 먼저 갱신한 뒤 공유 묶음을 만든다. 원본 문서는 `docs/agent-framework`, 전체 계획은 `docs/planning`에서 관리하고 ZIP은 재생성 가능한 배포 사본으로 다룬다.\n","sha256":"63c65357fb6515a036a07468b3193840f368dc4545dca248a1ef7e2f9848cd94"},"docs/agent-framework/graphify-out/GRAPH_REPORT.md":{"text":"# Creative Checker — Graphify AST audit\n\n\u003e **Static code relationships only.** This graph does not demonstrate real Qwen execution,\n\u003e PostgreSQL/Neo4j connectivity, durable workers, or production deployment.\n\u003e The separate clickable business flow is a curated workflow illustration, not this AST graph.\n\n- Tool: official `graphifyy==0.9.100`; directed build, community detection and native HTML exporter.\n- Corpus: **12 Python files**, 5,064 words, exclusively `backend/agent_framework/**/*.py`.\n- Git baseline: `87a3b9eaf92c2a8c14f823053beb58d7812e06c3`. The files are current working-tree sources; their SHA-256 values are recorded in `source-manifest.json`.\n- Raw AST: **158 nodes / 678 edges**.\n- Native directed graph: **173 nodes / 633 edges / 14 communities**.\n- **Integrity limits:** raw dangling endpoints 33, missing endpoints 0, self-loops 1, same-endpoint directed edges collapsed 45.\n- Build added **15 implicit/external placeholder nodes**. These have no extracted in-scope definition; they are not deployment components.\n- The native view has collapsed parallel relations. **`extraction.json` retains every raw relationship and source location**; `diagnostics.json` and `diagnostics.txt` retain the official diagnostic.\n- Raw edge confidence: `{'EXTRACTED': 563, 'INFERRED': 115}`. `INFERRED` edges are extractor resolution inferences, not verified runtime calls.\n- Source direction, confidence, `_origin` and location metadata are retained as emitted by Graphify. AST name resolution can be incomplete or ambiguous.\n- AST extraction model tokens: **0 input / 0 output**. No semantic extraction or model API call. Host-agent reasoning/labeling tokens were **not separately measured**; this is not a zero-cost claim for the whole conversation.\n- Token-reduction benchmark not run: the requested scope is the flow/code graph artifact, not a compression experiment.\n- `graph.html` uses the official renderer with only its pinned vis-network dependency embedded after SRI verification. **No automatic external HTML resources remain in a static audit. Browser rendering was not tested here.**\n- Graphify detected this small corpus as fitting in one context; graph generation proceeded because the user explicitly requested it.\n- Rebuild script: `scripts/build_agent_code_graph.py`. A disposable environment and asset cache are required; project dependencies and user profiles were not changed.\n- These outputs are written into the working tree; no ignore, commit or push operation was performed.\n\n- Portable sharing: source metadata uses repository-relative paths; the extractor path is package-relative. Nodes, edges and diagnostic counts are unchanged.\n\n## Raw diagnostic\n\n```text\n[graphify] MultiDiGraph edge-collapse diagnostic\ninput: \u003cin-memory\u003e\ninput_stage: provided JSON (normal graph.json is post-build)\neffective_directed: \u003cdirect-call\u003e\nnodes: 158\nunverified_code_nodes: 0\nraw_edges: 678\nvalid_candidate_edges: 645\nmissing_endpoint_edges: 0\ndangling_endpoint_edges: 33\nexternal_reference_edges: 0\nself_loop_edges: 1\nexact_duplicate centrality (0.013) - this node is a cross-community bridge._\n- **Are the 18 inferred relationships involving `Workflow` (e.g. with `Approval` and `AssetRef`) actually correct?**\n  _`Workflow` has 18 INFERRED edges - model-reasoned connections that need verification._\n- **Should `CLI and fixture composition` be split into smaller, more focused modules?**\n  _Cohesion score 0.11174242424242424 - nodes in this community are weakly interconnected._\n- **Why does `make_agents()` connect `CLI and fixture composition` to `Evidence and verdict validation`, `Synthetic data and observations`?**\n  _High betweenness centrality (0.012) - this node is a cross-community bridge._\n- **Are the 14 inferred relationships involving `SyntheticAdapters` (e.g. with `CriteriaDraft` and `Criterion`) actually correct?**\n  _`SyntheticAdapters` has 14 INFERRED edges - model-reasoned connections that need verification._\n- **Why does `SyntheticAdapters` connect `Synthetic data and observations` to `CLI and fixture composition`, `Retrieval contracts and adapters`, `Extraction contracts and adapters`, `Reporting contracts and adapters`, `Inspection contracts and ports`, `Adapter error boundaries`?**\n  _High betweenness centrality (0.010) - this node is a cross-community bridge._","sha256":"4e7a24b48fae89a8ac89683ed22d6a509bb2845ec305f0e41ec0c8a10261478e"},"docs/agent-framework/verification-2026-11-02.md":{"text":"# 공통 개발 프레임워크 검증 기록\n\n- 날짜: 2026-11-02 (Asia/Seoul)\n- 작업 브랜치: `feat/agent-framework`\n- 시작 커밋: `87a3b9e` (`feat/29-front-v2`에서 분기)\n- 대상: 역할별 독립 개발 계약과 개발용 실행기. 실제 제품 통합 완료 기록이 아니다.\n- 상태: 로컬 작업 파일이며 커밋·푸시하지 않았다.\n\n## 실행한 검사\n\n저장소 루트의 기존 `.venv`를 사용했다. 이번 작업에서 의존성 설치·잠금 파일 갱신은 하지 않았다.\n\n```sh\n.venv/bin/python -m scripts.export_agent_framework\n.venv/bin/python -m pytest tests/agent_framework -q --tb=short\n.venv/bin/python -m backend.agent_framework demo --output /tmp/agent-framework-demo-20261102.json\n.venv/bin/python -m backend.agent_framework role A03 --input examples/agent_framework/A03.json --synthetic --output /tmp/agent-framework-A03-20261102.json\ngit diff --check\n```\n\n결과: **104개 테스트와 9개 하위 테스트 통과**, `git diff --check` 통과.\n\n- 공통 JSON 계약 및 모델 생성 우회 출력 재검증.\n- 잘못된 프로젝트·문서·조건·이미지 버전, 위조 인용·해시, 과거 이력의 현재 관측 사용 차단.\n- 조건 누락·중복·불확실 관측·지원하지 않는 비교·수량 모순·검색 지연/실패 처리.\n- 조건 승인, 수정 요청 승인, 새 버전 전체 재검수, 최종 승인 및 예외 승인 제한.\n- 동시/중복 승인, 새 실행 ID 충돌, 승인 자동 승계 방지.\n- 모델·검색 미설정 및 결과 불명 시 합성 대체·자동 재호출 없음.\n- 모든 역할의 독립 CLI, factory 교체, 합성 입력 표시 전파, 오류 시 기존 출력 파일 보존.\n- FastAPI TestClient를 통한 접수·조회·승인·재검수와 오류 응답. 서버 포트는 열지 않았다.\n- 17개 JSON Schema, 15개 합성 예제 JSON, 개발 OpenAPI의 생성 결과와 저장된 파일 일치.\n\ndemo는 2개 합성 실행에서 6개 동작을 수행했다. 수정 전 실행은 `changes_approved`, 수정 후 실행은 `final_approved`로 끝났으며 두 실행 모두 `synthetic=true`다. 승인자는 스크립트 입력이므로 실제 사용자의 승인 기록으로 사용할 수 없다.\n\n## 검증 범위와 남은 연결\n\n현재 환경에는 `pytest-asyncio` 플러그인이 없어 기존 `asyncio_mode`, `asyncio_default_fixture_loop_scope` 설정에 대한 경고 2개가 발생했다. 이번 검사는 동기 테스트이며 모두 통과했다. 잠금 파일로 새 환경을 설치한 결과로 확대 해석하지 않는다.\n\n실제 Qwen·PDF·이미지 처리, PostgreSQL·Neo4j 쿼리, MCP 전송, 영속 worker 복구, 제품 인증 및 front-v2 API 연결은 이번 검증에 포함하지 않는다. 모델 정확도·검색 품질·배포 완료를 검증한 것이 아니다.\n\n기존 front-v2, `backend/app`, `backend/creative_checker`, 마이그레이션, 실행 스크립트, 의존성 파일은 변경하지 않았다. 업무 DB와 환경설정에 접근하거나 서비스를 기동하지 않았다. 이전에 작성한 계획 MD·HTML은 그대로 보존했다.\n\nUbuntu·Windows용 GitHub Actions 검사를 추가했지만 아직 원격 실행하지 않았다. Windows 장치 실행과 제품 전체 회귀 테스트는 이번 로컬 검증 결과에 포함하지 않는다.\n","sha256":"736ee986c1e267c2eda2d12e335c710fed9c2ec20776f15ef70a6fcf27d270c4"},"docs/planning/pdf-qwen-rag-workflow-plan-2026-11-02.md":{"text":"# Creative Checker — PDF·Qwen·PostgreSQL·Neo4j RAG 구현 계획\n\n- 작성일: 2026-11-02 (Asia/Seoul)\n- 상태: **계획 문서 — 실제 통합 구현·배포 완료를 의미하지 않음**\n- 코드 조사 기준: `feat/29-front-v2`, `376946f`\n- 1차 대상: **데스크톱 웹 / PDF 기준 문서 / 포스터 이미지**\n- 최종 사용자 결정: **벡터DB 제외, PostgreSQL·Neo4j 기반 근거 검색과 RAG 유지**\n- 모델 결정: **Qwen3.5-4B. PaddleOCR는 기본·보조·실패 시 대체 경로 모두 사용하지 않음.**\n\n## 1. 목표와 범위\n\n기존 front-v2의 디자인과 기존 PostgreSQL 데이터를 유지하면서 다음 업무를 실제 서비스 흐름으로 연결한다.\n\n\u003e PDF 등록 → 조건 추출 → 사람의 조건 승인 → 포스터 등록 → 근거 검색 → 검사 → 결과 검증 → 보고서 → 수정 요청 승인 → 수정본 전체 재검수 → 최종 승인\n\n### 포함 범위\n\n| 구분 | 1차 범위 |\n|---|---|\n| 문서 | PDF만 등록·읽기·조건 추출·원문 대조 |\n| 산출물 | PNG·JPEG·WEBP 포스터 및 수정 버전 |\n| 문서 이해·이미지 검사·보고 | Qwen3.5-4B |\n| 업무 원본 | 기존 PostgreSQL의 사용자·프로젝트·파일·검수 이력 보존 및 필요한 구조 확장 |\n| 관계 검색 | Neo4j에서 조건·원문·예외·수정·승인 관계 탐색 |\n| RAG | 조회한 근거를 Qwen 입력에 제공하고 생성 결과의 출처·버전을 검증 |\n| 실행 | LangGraph의 역할별 진행과 PostgreSQL의 영속 작업·단계 기록 |\n| 도구 호출 | 실제 MCP 클라이언트·서버 연결. 단순 내부 함수 호출을 MCP 실행으로 표시하지 않음 |\n| 사람의 결정 | 조건 승인, 수정 요청 승인, 최종·예외 승인 |\n| 재검수 | 새 버전의 새 실행 생성, 승인 조건 전체 재검사, 이전 실행과 비교 |\n| 화면 | 기존 front-v2 유지, 데스크톱에서 검수·비교·승인·이력 연결 |\n\n### 이번 범위에서 제외\n\n- DOCX·HWPX 등 PDF 이외 문서 형식.\n- 영상·음성 검수, 모바일·태블릿 전용 화면.\n- PaddleOCR, EasyOCR 등 추가 OCR 모델과 실패 시 자동 대체 경로.\n- Qdrant·pgvector·Neo4j 벡터 인덱스, 임베딩 모델 및 벡터 검색.\n- SigLIP·별도 로고 모델·추가 학습을 필수로 요구하는 경로.\n- 자유로운 Text2SQL/Text2Cypher, 범용 챗봇, 자동 외부 메시지 발송.\n- 클라우드 신규 자원 생성·운영 배포를 1차 연결의 선행 조건으로 삼는 작업.\n\n기존 연구 코드·실험 결과·모델 캐시는 삭제하지 않는다. 제품 실행 경로와 역사 자료를 구분한다.\n\n## 2. 현재 상태와 통합 방향\n\n다음은 조사 당시 코드와 기존 검증 자료의 구분이다. 독립 경로의 구현을 현재 기본 웹의 동작으로 합쳐 표현하지 않는다.\n\n| 구성 | 현재 확인한 내용 | 통합에서 할 일 |\n|---|---|---|\n| 기본 웹 | `backend.app.api`와 M008 PostgreSQL 저장·조회, BackgroundTasks 검수 실행 | 새 작업은 영속 worker로 연결 |\n| M008 worker | 작업 선점, 실행 권한 만료, heartbeat, 중복 실행 방지·복구 코드 | PDF·Qwen 역할 실행을 수용하도록 확장 |\n| 별도 rebuild | LangGraph, Qwen, MCP, 사람 승인, Neo4j outbox 코드 | 기존 사용자·프로젝트·인증·데이터 계약으로 이식 |\n| Neo4j | 별도 경로의 관계·영향 조회 및 동기화 코드 | 제품의 실제 원본 데이터·버전·권한과 연결 |\n| A03/RAG | 현재 제품 경로에 근거 검색부터 모델 입력까지의 통합이 필요 | 검색 도구, 근거 묶음, 인용 검증 신규 구성 |\n| front-v2 | 기존 검수 UI와 이미지 확대·근거 표시 | 상태·비교·승인·재검수 API 연결 |\n\n**기존 M008를 업무 데이터의 기준으로 유지한다.** 별도 rebuild의 `cc_*` 사용자·프로젝트·실행 테이블을 그대로 생성하여 같은 업무를 이중 저장하지 않는다. 기존 작업 선점·실행 권한 규칙을 확장하고, 하나의 worker 체계가 새 워크플로를 처리한다.\n\n현재 `PRODUCT.md`의 `A03/RAG/VectorDB 제외`는 최신 사용자 결정과 다르다. 실제 구현 착수 시 이를 **벡터DB 제외 / A03 근거 검색 및 RAG 유지 / PDF·Qwen 전용**으로 수정한다. 이 계획 문서 작성만으로 기존 제품 문서나 코드가 수정된 것으로 간주하지 않는다.\n\n## 3. 전체 구조\n\n```mermaid\nflowchart TD\n    UI[기존 front-v2 데스크톱 화면] \u003c--\u003e API[FastAPI · 인증 · 권한 · 접수 · 승인]\n    API \u003c--\u003e PG[(PostgreSQL 업무 원본)]\n    PG --\u003e QUEUE[영속 작업 큐]\n    QUEUE --\u003e WORKER[CPU worker · LangGraph]\n    WORKER \u003c--\u003e TOOLS[MCP 도구 · 문서 · 추론 · 근거]\n    TOOLS \u003c--\u003e QWEN[Qwen3.5-4B 모델 서비스]\n    WORKER --\u003e RETRIEVE[A03 근거 검색]\n    RETRIEVE \u003c--\u003e PG\n    RETRIEVE \u003c--\u003e GRAPH[(Neo4j 관계 검색)]\n    PG --\u003e OUTBOX[트랜잭션 outbox]\n    OUTBOX --\u003e GRAPH\n    WORKER --\u003e PG\n```\n\n- PostgreSQL: 실제 업무 원본, 승인·버전·권한·실행 결과의 최종 기준.\n- Neo4j: PostgreSQL에서 재구축할 수 있는 관계 표현. 모델이 만들어 낸 관계를 사람의 승인 관계로 취급하지 않는다.\n- LangGraph: 단계 전환·분기·재진입을 담당하는 실행 구조. GraphDB와 다른 구성요소다.\n- MCP: 작업별 입력·출력과 호출 기록을 남기는 도구 연결. 모든 DB 내부 함수를 반드시 MCP로 우회시킬 필요는 없다.\n- Qwen: PDF 내용을 읽고 조건을 구조화하며, 현재 포스터를 관측하고 검증 결과를 설명한다.\n\n초기 검증은 기존 로컬 환경을 기준으로 한다. 로컬 Qwen과 원격 Qwen은 동일한 모델 어댑터 계약으로 연결하되, 별도 모델 선택 UI를 제품 화면에 노출하지 않는다. 초기 GPU 추론 동시 실행은 1개를 기준으로 검증하고 실제 지연·메모리 측정 후 조정한다.\n\n## 4. 에이전트 역할과 계약\n\n기존 A01~A08 번호를 유지하고 A04·A05는 통합한다. 따라서 실제 역할은 7개다. 모든 역할이 별도의 LLM이나 GPU 프로세스일 필요는 없다.\n\n| 역할 | 실행 방식 | 입력 | 출력·책임 |\n|---|---|---|---|\n| A01 조정 | 코드·LangGraph | 프로젝트, 문서·조건·산출물 버전, 사용자 요청 | 실행 스냅샷, 작업 배정, 상태 전환, 대기·실패·재개 |\n| A02 조건 추출 | Qwen | 현재 PDF 전체 페이지·텍스트 | 조건 ID·유형·기대값·필수 여부·예외·원문 출처의 초안 |\n| A03 근거 검색 | SQL·Cypher 도구 | 고정 버전, 대상 조건, 조회 목적 | 원문·관계·유효한 예외·과거 이력이 구분된 근거 묶음 |\n| A04·A05 통합 검사 | Qwen + 파일 도구 | 승인 조건 전체, 현재 포스터, 허용된 검색 근거 | 현재 관측값, 조건별 판정 초안, 이미지 근거·불확실성 |\n| A06 검증 | 코드 | 조건·관측·출처·검색 스냅샷 | 누락·모순·잘못된 인용 차단, 검증 결과·기계 판정 |\n| A07 보고 | Qwen | A06 결과와 검증된 근거 | 항목별 설명, 보고서, 수정 요청 초안 |\n| A08 재검수 연결 | 코드·LangGraph | 승인된 수정 요청, 새 산출물 버전 | 이전 실행과 연결된 새 실행, A03부터 전체 재검수 |\n\n### 공통 경계\n\n- 모델은 사람의 승인 상태를 만들거나 변경하지 않는다.\n- A03는 승인된 검사 조건을 검색 결과 일부로 대체하지 않는다.\n- A07은 A06의 판정을 다시 결정하지 않는다.\n- A08의 변경 영향 조회는 설명과 우선순위에 사용한다. 1차 구현에서는 검사 생략에 사용하지 않는다.\n- RAG는 현재 포스터 관측을 대신하지 않는다. 과거의 통과·개수·문구가 이번 이미지의 사실을 증명하지 않는다.\n\n## 5. PDF·Qwen 처리\n\n### PDF 읽기\n\n1. 파일 내용이 PDF인지, 손상·암호화·크기·페이지 제한에 해당하는지 검사한다.\n2. 페이지별 이미지와 사용 가능한 PDF 텍스트를 준비한다. 렌더링·텍스트 파싱 라이브러리는 파일 전처리 도구다.\n3. Qwen이 페이지 내용을 읽고 페이지·블록 단위 기록을 만든다. 스캔 페이지도 별도 OCR 모델로 넘기지 않는다.\n4. 전체 페이지의 처리·실패·누락 목록을 기록한다. 긴 PDF는 구간을 나누되 문서 전체 처리 여부를 보존한다.\n5. Qwen이 조건을 구조화하고, 코드가 원문 인용·조건 ID·형식을 검사한다.\n6. 사람이 PDF 원문과 추출 조건을 대조하고 수정·승인한다.\n\nPDF 전체 읽기를 검색 top-k 결과로 대체하지 않는다. 읽을 수 없는 페이지나 구간 간 해석 충돌은 누락·확인 필요로 보여 준다. 처리 실패는 재시도 또는 확인 필요로 기록하며 PaddleOCR로 전환하지 않는다.\n\n### 조건 데이터\n\n조건에는 최소 다음 정보를 둔다.\n\n```text\ncriterion_id\ndocument_version_id / criteria_version_id\ntext / kind / expected / operator / unit\nrequired / target_scope\nsource: page / block_id / quote / source_hash\nexceptions / group_relation / supported / limitations\n```\n\n사람의 수정은 추출 초안과 구분하여 수정자·수정 내용·시각을 남긴다. 사람이 보충한 조건을 모델이 원문에서 그대로 추출한 조건으로 표시하지 않는다.\n\n파일·페이지·해상도 제한은 기존 제품 제한과 Qwen 실측을 기준으로 구현 계약에서 확정한다. 제한을 초과한 PDF를 일부만 읽고 전체 처리 완료로 표시하지 않는다.\n\n## 6. PostgreSQL·Neo4j 기반 RAG\n\n### 조회 순서\n\n1. 서버가 사용자·프로젝트 권한을 확인한다.\n2. 실행에 고정된 승인 조건과 연결 원문을 PostgreSQL에서 직접 조회한다.\n3. 관련 정의·상호참조가 필요하면 해당 프로젝트·문서 버전 내에서 키워드 검색한다.\n4. Neo4j에서 근거 연결, 예외, 이전 수정·재검수, 변경 영향을 조회한다.\n5. 반환된 원본 ID의 본문·권한·버전·승인 유효성을 PostgreSQL에서 다시 확인한다.\n6. 근거 묶음을 저장하고 Qwen의 검사·보고 입력에 제공한다.\n7. 생성한 설명의 인용 ID·원문·적용 범위를 검증한다.\n\n초기에는 매개변수가 정해진 SQL·Cypher 템플릿을 사용한다. 사용자나 모델이 생성한 임의 쿼리를 실행하지 않는다. 벡터 인덱스·임베딩 모델은 추가하지 않는다.\n\n### 초기 검색 도구\n\n| 도구 | 목적 |\n|---|---|\n| 조건 원문 조회 | 조건을 만든 원문 조항·페이지·확정 버전 확인 |\n| 적용 예외 조회 | 승인 여부·적용 대상·기간·철회 여부 확인 |\n| 이전 검수 근거 조회 | 지정한 과거 실행의 판정·수정 사유 확인 |\n| 변경 영향 조회 | 변경한 기준과 연결된 산출물·검수·승인 확인 |\n| 문서 키워드 검색 | 해당 문서의 정의·관련 조항·추가 설명 탐색 |\n\n자유로운 질문 응답 화면은 1차 필수 범위가 아니다. 우선 검수·보고에 필요한 업무 조회를 완성한다.\n\n### 근거 묶음 계약\n\n```text\nretrieval_id / purpose / policy_version\nproject_id / run_id\ndocument_version_id / criteria_version_id / asset_version_id\nstatus / coverage / warnings\npostgres_revision / graph_revision / source_backend\nquery_template / parameters / retrieved_at\nevidence[]:\n  evidence_id / kind / source_record_id / source_version\n  page / block_id / quote / source_hash\n  criterion_ids / approval_id / validity_scope\nrelationships[]\nbundle_hash\n```\n\n근거 종류는 다음처럼 구분한다.\n\n- `current_requirement`: 현재 승인 조건과 원문.\n- `current_observation`: 이번 산출물에서 관측한 문구·객체·좌표. A03가 과거 이력에서 만들어 넣지 않는다.\n- `approved_exception`: 명시적으로 승인되고 현재 대상에 적용되는 예외.\n- `historical_context`: 과거 조건·검수·수정·승인 이력.\n\n검사 모델에는 과거 판정을 기본 관측 근거로 제공하지 않는다. 보고서에는 과거 이력을 별도 맥락으로 사용할 수 있으나 현재 판정과 구분한다.\n\n### 동기화·실패 처리\n\n| 상황 | 처리 |\n|---|---|\n| 정상 조회 | 조회 버전과 근거를 고정하여 사용 |\n| 검색 결과 없음 | 해당 범위에서 찾지 못했다고 표시. 충족·예외 부재의 증명으로 사용하지 않음 |\n| 그래프 동기화 지연 | 요구 revision과 적용 revision을 기록하고 지연 상태 표시 |\n| Neo4j 장애 | PostgreSQL에서 동일 의미를 재현할 수 있는 조회만 대체, 대체 여부 기록 |\n| 필수 정의·적용 예외 확인 불가 | 영향받는 조건을 확인 필요로 처리 |\n| 선택적인 과거 이력 조회 실패 | 현재 원문·이미지 검사 진행 가능, 이력 조회 한계 표시 |\n| 다른 프로젝트·잘못된 버전·철회 근거 | 모델 입력에서 제외하고 검증 오류 기록 |\n\n검색한 문서 안의 명령문은 자료로 취급한다. 시스템 지시·도구 권한·승인 규칙을 변경할 수 없다.\n\n## 7. 승인·수정·재검수 흐름\n\n```mermaid\nflowchart TD\n    D[PDF 등록 · A02 조건 추출] --\u003e C[사람: 조건 수정·승인]\n    C --\u003e P[포스터 버전 등록]\n    P --\u003e A[A01 실행 스냅샷 확정]\n    A --\u003e R[A03 근거 검색]\n    R --\u003e I[A04·A05 통합 검사]\n    I --\u003e V[A06 검증]\n    V --\u003e B[A07 보고서·수정 요청 초안]\n    B --\u003e H{사람 검토}\n    H --\u003e|수정 요청 승인| N[수정본 등록]\n    N --\u003e RE[A08 새 실행 생성]\n    RE --\u003e A\n    H --\u003e|최종·예외 승인| F[대상 버전의 승인 이력 확정]\n```\n\n### 세 승인 지점\n\n1. **조건 승인:** 사람이 원문과 추출 초안을 확인하여 검사 기준 버전을 확정한다.\n2. **수정 요청 승인:** 모델의 초안을 사람이 확정한다. 외부 발송은 별도 범위이며 자동으로 수행하지 않는다.\n3. **최종·예외 승인:** 현재 실행·조건·포스터 버전에 대해 사람이 결정한다.\n\n예외 승인에는 사유·대상 조건·승인자·시각·원래 판정을 남긴다. 과거 실행의 예외 승인을 새 버전에 자동 승계하지 않는다. 프로젝트 정책 예외가 있다면 적용 범위를 별도로 검증한다.\n\n새 PDF나 수정 포스터는 기존 파일·조건·결과를 덮어쓰지 않는다. 새 버전과 새 실행을 만들고 이전 실행 ID·수정 요청 ID를 연결한다. 최종 승인 API는 대상 버전과 현재 상태를 다시 확인한다.\n\n### 세 가지 상태를 분리\n\n| 종류 | 의미 |\n|---|---|\n| 실행 상태 | 접수·대기·처리·대기 중단·완료·실패·취소·결과 확인 불가 |\n| 기계 판정 | `pass / fail / review` |\n| 사람 결정 | 미검토·수정 요청 승인·최종 승인·예외 승인 |\n\n필수 조건의 확실한 위반이 있으면 전체 `fail`, 확실한 위반 없이 불확실·미지원·실패가 남으면 `review`, 모든 적용 필수 조건을 충분히 검사해 충족한 경우만 `pass`로 집계한다. 권장 조건과 조건 그룹은 별도 정책으로 처리한다.\n\n## 8. 실행·저장·복구 설계\n\n### 단일 실행 소유자\n\n- API는 접수·조회·승인만 처리한다.\n- 새 워크플로는 PostgreSQL 작업 큐를 통해 worker가 실행한다.\n- 기존 BackgroundTasks와 rebuild worker가 같은 새 작업을 중복 실행하지 않도록 한다.\n- 문서 추출처럼 아직 산출물·승인 조건이 없는 작업은 공통 작업 계약으로 수용한다.\n- 실행 권한은 작업 선점·lease·heartbeat·token 확인으로 관리한다.\n\n### 단계 저장과 재개\n\n단계는 `execution_id + node + ordinal + input_hash`로 구분한다. 단계 결과, 업무 변경, 감사 이벤트, outbox 이벤트를 같은 업무 트랜잭션에서 확정한다.\n\nLangGraph 체크포인트와 업무 DB 커밋이 자동으로 하나의 트랜잭션이 된다고 가정하지 않는다. 재진입 시 업무 DB의 완료 기록을 확인하고 완료된 결과를 재사용한다. 검색 단계도 당시 근거 스냅샷을 재사용하며 임의로 최신 자료를 섞지 않는다.\n\n모델 호출에는 요청 식별자와 결과 기록을 남긴다. 호출 후 통신이 끊겨 실행 여부를 모르면 자동으로 다시 보내지 않는다. 확인 가능한 기존 작업 결과를 조회하거나 `outcome_unknown`으로 남기고 명시적 복구 절차를 제공한다.\n\n승인 대기 중에는 GPU 작업이나 실행 lease를 유지하지 않는다. 승인 기록을 저장한 뒤 재개 작업을 등록한다. 실행 권한을 잃은 worker는 늦게 받은 결과를 확정하지 못하게 한다.\n\n### 실행 재현 정보\n\n- 원문 PDF·포스터 파일 해시와 버전.\n- 승인 조건·그룹·적용 예외 스냅샷.\n- 모델명, 실제 확인 가능한 모델 revision/가중치 식별자, 미확인 여부.\n- 프롬프트·스키마·전처리·판정·검색 정책 버전.\n- 근거 묶음 해시, Neo4j revision, 도구 요청·응답·오류 기록.\n- 부모 실행, 수정 요청, 사람 승인 연결.\n\n## 9. DB 확장과 데이터 보존\n\n기존 사용자·프로젝트·멤버십·파일·산출물·조건·검수 이력을 재사용한다. 실제 마이그레이션 번호와 테이블명은 착수 시 현재 migration head를 확인하여 확정한다.\n\n확장이 필요한 논리 항목:\n\n1. PDF 원문 버전·페이지/블록·추출 초안·조건 출처 연결.\n2. 사람의 조건 확정·수정 이력.\n3. 공통 작업·단계 실행·시도·모델 호출 기록.\n4. 검색 실행·근거 스냅샷·인용 연결.\n5. 수정 요청·재검수 연결·최종/예외 승인.\n6. PostgreSQL outbox·Neo4j 반영 revision·실패 재시도 기록.\n\n변경은 명시적인 추가 마이그레이션으로 관리한다. 권한·스키마 inventory·백업/복원 검증도 함께 갱신한다. 앱 시작 시 임의 `create_all`이나 자동 마이그레이션으로 운영 DB를 바꾸지 않는다.\n\n검증 순서는 격리 DB에 마이그레이션 적용 → 기존 데이터 복제본의 호환성·조회 확인 → 백업·복구 확인 → 대상 DB 적용 순서로 잡는다. 과거 기록에 존재하지 않았던 승인·근거·모델 실행 정보를 만들어 채우지 않는다.\n\n## 10. API와 front-v2 연결\n\n기존 인증·프로젝트 권한·CSRF 정책을 사용한다. 새 경로 이름은 기존 API와 충돌하지 않도록 구현 계약에서 확정하며, 아래는 필요한 기능 목록이다.\n\n| API 기능 | 핵심 계약 |\n|---|---|\n| 프로젝트 조회·선택 | 현재 사용자가 접근 가능한 범위만 반환 |\n| PDF 등록·상태 조회 | 파일 검증, 새 문서 버전, 비동기 작업 ID |\n| 조건 초안 수정·승인 | 기대 revision, 원문 출처, 수정자, 불변 승인 버전 |\n| 포스터·수정본 등록 | 새 버전, 부모 버전, 파일 해시 |\n| 검수 실행·상태·취소·복구 | 고정 입력, 멱등키, 단계 상태, 명확한 오류 |\n| 근거·원문·보고 조회 | 프로젝트 권한, 출처 위치, 조회 버전 |\n| 수정 요청 작성·승인 | 대상 실행·조건, 사람의 확정 기록 |\n| 재검수 접수 | 부모 실행·수정 요청·새 버전 연결 |\n| 최종·예외 승인 | 현재 대상 확인, 원판정 보존, 사유·승인자 |\n| 이력·관계·비교 조회 | 과거/현재 버전 구분, 동기화 상태 |\n\nfront-v2의 디자인 토큰·레이아웃·이미지 확대·근거 표시를 유지한다. 새로운 디자인 시안이나 랜딩 페이지 교체는 수행하지 않는다.\n\n화면에 연결할 기능:\n\n- **PDF·포스터 등록:** 파일 제한, 현재 기준과 산출물 버전 표시.\n- **조건 승인:** PDF 원문과 조건을 대조하고 수정·승인.\n- **검수 진행:** 실제 완료 단계·실패·재시도 상태 표시. 추정 진행률 생성 금지.\n- **검수 결과:** 조건별 기대값·현재 관측·이미지 영역·원문 근거·한계 표시.\n- **버전 비교:** 이전/수정 포스터, 수정 요청, 판정 변경 대조.\n- **승인·재검수:** 수정 요청 승인, 수정본 전체 재검수, 최종·예외 승인.\n- **이력·관계:** 어떤 원문·조건·버전·실행·사람 결정으로 이어졌는지 확인.\n\n제품 화면에는 내부 모델 선택·개발용 도구 설명 대신 사용자가 업무 판단에 필요한 상태·근거·승인 범위를 표시한다. 기존 기록의 조회 접근도 보존한다.\n\n## 11. 구현 단계와 완료 기준\n\n| 단계 | 작업 | 완료 기준 |\n|---|---|---|\n| 1. 기준·계약 정리 | PDF/Qwen/RAG 최신 결정, 역할·입출력·상태·권한 확정 | 제품 문서·API·DB 계약의 모순 해소 |\n| 2. 저장·실행 기반 | 기존 DB 확장, worker·LangGraph, 단계 기록·복구 | 중복 요청·재시작·권한 상실 시 중복 확정 차단 |\n| 3. PDF·조건 승인 | PDF 처리, Qwen 추출, 원문 대조·수정·승인 | 전체 처리 범위와 조건 출처가 연결됨 |\n| 4. A03·RAG | PostgreSQL 조회, Neo4j projection, 근거 묶음·인용 검증 | 실제 조회 근거가 모델 입력·결과까지 연결됨 |\n| 5. 검사·보고 | Qwen 포스터 검사, A06, A07 | 조건 전체의 결과·관측·근거·한계 조회 가능 |\n| 6. 승인·재검수·화면 | 수정 요청, 새 버전 전체 검사, 비교, 최종·예외 승인 | 기존 front-v2에서 업무 전체 수행 가능 |\n| 7. 통합 검증 | 실제 모델 E2E, 권한·장애·복구·데이터 보존 | 실행 ID·로그·DB 기록으로 결과 재현 가능 |\n\n처음 관통시킬 실행은 **PDF 1건 → 사람의 조건 승인 → 포스터 1건 → 실제 근거 검색 → Qwen 검사 → 근거가 표시된 보고서**다. 이 흐름에 수정 요청·수정본·전체 재검수·최종 승인을 연결한다.\n\n계약 확정 후 PDF/Qwen 어댑터와 근거 검색 도구는 병렬 구현할 수 있다. 데이터 마이그레이션·실행기·공통 계약은 한 담당 경로에서 관리하여 충돌을 줄인다. 기간과 병렬 실행 수는 첫 관통 흐름의 실측 후 결정한다.\n\n## 12. 검증 계획\n\n### 기능·권한·버전\n\n- PDF 이외 파일, 손상·암호화 PDF, 제한 초과 입력 처리.\n- 조건 승인 전 검사 차단, 권한 없는 승인 차단.\n- 다른 프로젝트의 파일·조건·근거·승인 접근 차단.\n- 진행 중 기준 변경 시 기존 실행의 스냅샷 유지.\n- 새 산출물/조건 버전에 과거 승인 자동 승계 금지.\n- 수정 요청 승인 후 새 버전 전체 재검수·최종 승인.\n- 예외 승인 후 원래 기계 판정·대상 조건·사유 보존.\n\n### RAG·관계 정합성\n\n- 조건 ID 기반 원문 조회와 문서 버전 일치.\n- 검색 누락·빈 결과·장애·동기화 지연을 각각 구분.\n- 만료·철회·대상 불일치 예외 차단.\n- 존재하지 않는 근거 ID, 변조된 인용, 과거 판정의 현재 관측 오용 차단.\n- PostgreSQL 대체 조회와 Neo4j의 동등 근거 집합 비교.\n- outbox 중복·역순·재시도·전체 재구축 검증.\n- 검색 결과가 필수 검사 조건을 줄이지 않는지 검증.\n\n### 모델·판정\n\n- 잘린 JSON, 조건 누락·중복, 근거 부족을 정상 통과로 처리하지 않음.\n- 기대 수량과 관측 수량이 다른데 통과시키는 모순 차단.\n- 객체별 위치·중복·가림·검사 범위를 기록하고 불확실성을 표시.\n- 정확 문구·날짜·금액·수량 등 조건 유형별 결과를 분리 평가.\n- 현재 조건의 확실한 위반과 불확실 조건이 함께 있어도 위반을 숨기지 않음.\n- 보고서가 원래 판정·숫자·승인 사실을 임의 변경하지 않음.\n\n기존 98조건 비교는 사람 검증이 완료된 정답셋이 아니다. 사람이 원문·이미지·기대값·판정을 확인하고, 원본 포스터 그룹이 겹치지 않는 별도 평가셋을 사용한다. 조건 추출 완전성, 검색 근거 적합성, 위반 탐지, 잘못 통과, 보류, 인용 정확도를 하나의 정확도로 합치지 않는다.\n\n수량 비교 코드가 모델의 잘못된 시각 관측 자체를 보장해서 고칠 수는 없다. 근거 좌표가 존재한다는 사실과 그 관측이 정확하다는 사실도 구분한다.\n\n### 실행 복구\n\n- 중복 접수·승인 요청의 멱등성.\n- worker 종료 후 단계 재개와 완료 단계 재사용.\n- lease를 잃은 worker의 결과 반영 차단.\n- 모델 호출 결과 불명 시 자동 중복 호출 차단.\n- 검색·모델·DB 장애를 실제 실패로 표시.\n- 승인 대기 중 재시작 후 기록·대상 버전 복원.\n\n### 최종 E2E 완료 기준\n\n실제 PDF·포스터와 실제 Qwen을 사용해 다음을 브라우저에서 수행하고 로그·DB 기록·원문/근거 ID를 남긴다.\n\n1. PDF 등록과 Qwen 조건 추출.\n2. 사람이 원문을 대조하고 조건 승인.\n3. 포스터 등록과 PostgreSQL·Neo4j 근거 검색.\n4. Qwen 검사, A06 검증, A07 보고서 생성.\n5. 수정 요청 작성과 사람의 승인.\n6. 수정 포스터 새 버전 등록과 조건 전체 재검수.\n7. 이전/현재 결과 비교와 최종 승인.\n8. 서버 재시작 후 동일 실행·버전·근거·승인 기록 조회.\n\nDB/mock 테스트, 실제 모델 테스트, 브라우저 업무 테스트를 따로 기록한다. 실제 모델이 준비되지 않았을 때 합성 응답을 실모델 성공으로 표시하지 않는다.\n\n## 13. 산출물과 완료 보고\n\n실제 구현을 진행할 때 다음 산출물을 남긴다.\n\n- 최신 제품 기준과 역할·API·데이터 계약.\n- 기존 데이터 보존을 검증한 마이그레이션·스키마·권한 변경.\n- PDF/Qwen 어댑터, A03 검색·근거 계약, A06 판정 검증.\n- worker·LangGraph·MCP 실행 및 복구 경로.\n- front-v2의 승인·비교·재검수 연결.\n- Windows/macOS 실행 안내와 비밀정보 없는 설정 예시.\n- 테스트 결과, 실제 실행 ID, 알려진 한계, 미검증 사항.\n\n계획 문서와 설계 그림은 실행 완료 증거가 아니다. 구현·DB 적용·실모델 E2E·배포 상태는 각각 별도로 보고한다. 커밋·푸시는 별도 지시 범위에 따른다.\n\n## 14. 근거와 후속 정합성 작업\n\n참조한 채팅 (작성자의 로컬 Codex 기록이며 공유 파일에는 포함되지 않음):\n\n- 벡터·Graph 보고서 — 기록 ID `01a15bde-c9b5-75f1-90be-047782ddca96`\n- 최종 모델 비교 결과 정리 — 기록 ID `01a18a2d-9a65-76c1-acc9-7adde20686ea`\n- 모델 최종 분석 — 기록 ID `01a17c65-83b7-7392-b71d-9a7147075eef`\n\n현재 코드·문서와의 주요 대조 대상:\n\n- `PRODUCT.md`: RAG 제외·문서 형식·모델 역할을 최신 합의로 갱신할 대상.\n- `backend/app/api.py`, `backend/app/web_postgres.py`: 현재 기본 웹과 PostgreSQL 연결.\n- `backend/app/worker.py`, `backend/app/execution/queue.py`: 기존 작업 선점·lease·복구 기반.\n- `backend/creative_checker/orchestration.py`: 별도 LangGraph 흐름의 재사용 후보.\n- `backend/creative_checker/tools.py`: 실제 MCP 도구 연결의 재사용 후보.\n- `backend/creative_checker/graph.py`, `projection.py`: 관계 조회·outbox 재사용 후보.\n- `docs/postgresql-web-integration-2026-10-30.md`, `docs/rebuild/status.md`: 검증 범위와 미완료 상태 구분.\n\n기술 참고:\n\n- [Neo4j GraphRAG: 검색기·모델 연결과 벡터 없는 조회](https://neo4j.com/docs/neo4j-graphrag-python/current/user_guide_rag.html)\n- [LangGraph: 사람 입력을 기다리는 중단·재개](https://docs.langchain.com/oss/python/langgraph/interrupts)\n\n이 문서는 최신 사용자 합의를 기준으로 한 계획이다. 과거 문서의 벡터 검색·PaddleOCR·DOCX/HWPX·영상 구성을 현재 구현 범위로 다시 포함하지 않는다.\n","sha256":"c2b0ced39cde5f8b8aa5335d784beaf8e093c3173e005264430f8762ab1e93e6"},"examples/agent_framework/README.md":{"text":"# 합성 에이전트 계약 예제\n\n이 폴더의 JSON은 실제 PDF, 포스터, 모델, PostgreSQL, Neo4j 실행 결과가 아닙니다.\n파일 ID와 SHA-256도 **합성 참조 문자열**을 나타냅니다. 원본 미디어 파일은 제공하지 않습니다.\n모든 역할 출력의 `synthetic`은 `true`이며 모델 정확도나 배포 완료 증거로 사용할 수 없습니다.\n\n| 역할 | 요청 JSON | 응답 JSON | 계약 |\n|---|---|---|---|\n| A02 조건 추출 | `A02.json` | `A02.output.json` | ExtractRequest → CriteriaDraft |\n| A03 근거 검색 | `A03.json` | `A03.output.json` | RetrieveRequest → EvidenceBundle |\n| A04/A05 통합 검사 | `A04_A05.json` | `A04_A05.output.json` | InspectRequest → InspectionResult |\n| A06 코드 검증 | `A06.json` | `A06.output.json` | ValidateRequest → ValidatedResult |\n| A07 보고서 | `A07.json` | `A07.output.json` | ReportRequest → ReportDraft |\n\n기본 예제는 `MORNING CUP` 정확문구와 딸기 `3개` 조건을 사용합니다.\n`scenarios/`에는 `pass`, `fail`, `review`, `stale`, `unavailable`의 A06 검증 결과가 있습니다.\n`stale`과 `unavailable`에서는 합성 검사기가 충족을 주장해도 검색 근거가 불완전하므로 코드 검증이 `review`로 남깁니다.\n\n저장소 루트에서 같은 JSON을 다시 생성할 수 있습니다. 외부 서비스에 접속하지 않습니다.\n\n```sh\npython -m backend.agent_framework.adapters.generate_examples\n```\n\n`custom_adapter.py`는 팀별 어댑터 팩터리의 연결 위치만 보여 줍니다. 구현하지 않은 메서드는\n`ADAPTER_NOT_CONFIGURED`를 반환하며 합성 결과로 대체하지 않습니다. 실제 서비스를 연결할 때는\n각 메서드의 입력·출력 계약과 현재 버전·출처·인용 검증을 유지해야 합니다.\n","sha256":"3b365f5cbccb7624f8fe87a8a7a651b8d556bf2e4414c8a70028707e7d87151c"}}</script><script>
(() => {
  'use strict';
  const sources=JSON.parse(document.getElementById('source-data').textContent);
  const paths=Object.keys(sources), select=document.getElementById('file'), code=document.getElementById('code');
  for(const path of paths){const option=document.createElement('option');option.value=path;option.textContent=path;select.append(option);}
  const requested=new URLSearchParams(location.search).get('file'), path=requested===null?paths[0]:requested;
  if(!Object.prototype.hasOwnProperty.call(sources,path)){
    const error=document.getElementById('error');error.hidden=false;error.textContent='묶음에 포함되지 않은 파일입니다. 목록에서 파일을 선택해 주세요.';code.hidden=true;select.selectedIndex=-1;
  }else{
    select.value=path;document.getElementById('path').textContent=path;document.getElementById('hash').textContent='SHA-256 · '+sources[path].sha256;
    const lines=sources[path].text.replace(/\r\n/g,'\n').split('\n');if(lines[lines.length-1]==='')lines.pop();
    const fragment=document.createDocumentFragment();
    lines.forEach((text,index)=>{const line=document.createElement('div'),number=document.createElement('a'),content=document.createElement('span');line.id='L'+(index+1);line.className='line';number.className='number';number.href='#'+line.id;number.textContent=String(index+1);number.setAttribute('aria-label',String(index+1)+'번째 줄');content.className='text';content.textContent=text||' ';line.append(number,content);fragment.append(line);});code.append(fragment);
  }
  select.addEventListener('change',()=>{if(Object.prototype.hasOwnProperty.call(sources,select.value))location.href='source.html?file='+encodeURIComponent(select.value)+'#L1';});
  function focusLine(){for(const line of code.querySelectorAll('.selected'))line.classList.remove('selected');if(!/^#L[1-9][0-9]*$/.test(location.hash))return;const line=document.getElementById(location.hash.slice(1));if(line){line.classList.add('selected');line.scrollIntoView({block:'center'});}}
  window.addEventListener('hashchange',focusLine);requestAnimationFrame(focusLine);
})();
</script></body></html>
