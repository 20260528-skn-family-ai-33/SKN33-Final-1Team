# EC2 B. Use the image built on A; DATABASE_URL points to the same PostgreSQL source of truth.
name: creative-checker-worker
services:
  mcp:
    image: creative-checker:rebuild
    command: ["/app/.venv/bin/uvicorn", "backend.creative_checker.tools:create_app", "--factory", "--host", "0.0.0.0", "--port", "8129", "--no-access-log", "--no-proxy-headers"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Select a runtime file with --env-file}
      CC_DATA_DIR: ${CC_DATA_DIR:-/app/data/creative_checker}
      CC_STORAGE_BACKEND: ${CC_STORAGE_BACKEND:-local}
      CC_S3_BUCKET: ${CC_S3_BUCKET:-}
      CC_S3_REGION: ${CC_S3_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      CC_QWEN_BASE_URL: ${CC_QWEN_BASE_URL:-}
      CC_QWEN_API_KEY: ${CC_QWEN_API_KEY:-}
      CC_QWEN_MODEL: ${CC_QWEN_MODEL:-Qwen/Qwen3.5-4B}
      CC_QWEN_REVISION: ${CC_QWEN_REVISION:-unverified}
      CC_MCP_URL: http://mcp:8129/mcp
      CC_MCP_TOKEN: ${CC_MCP_TOKEN:?Set the private MCP token}
    expose: ["8129"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    security_opt: ["no-new-privileges:true"]
  worker:
    image: creative-checker:rebuild
    command: ["/app/.venv/bin/python", "-m", "backend.creative_checker.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Select a runtime file with --env-file}
      CC_QWEN_MODEL: ${CC_QWEN_MODEL:-Qwen/Qwen3.5-4B}
      CC_QWEN_REVISION: ${CC_QWEN_REVISION:-unverified}
      CC_MCP_URL: http://mcp:8129/mcp
      CC_MCP_TOKEN: ${CC_MCP_TOKEN:?Set the private MCP token}
    depends_on: [mcp]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    security_opt: ["no-new-privileges:true"]
  projection:
    image: creative-checker:rebuild
    command: ["/app/.venv/bin/python", "-m", "backend.creative_checker.worker", "--projection-only"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Select a runtime file with --env-file}
      CC_NEO4J_URI: ${CC_NEO4J_URI:?Set the graph projection address}
      CC_NEO4J_USER: ${CC_NEO4J_USER:-neo4j}
      CC_NEO4J_PASSWORD: ${CC_NEO4J_PASSWORD:?Set the graph projection password}
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
