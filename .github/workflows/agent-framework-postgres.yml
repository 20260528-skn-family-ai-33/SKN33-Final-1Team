name: Agent framework PostgreSQL
on:
  pull_request:
    paths: ["backend/agent_framework/**", "backend/app/**", "backend/migrations/**", "tests/agent_framework/**", "backend/tests/**", "pyproject.toml", "uv.lock", ".github/workflows/agent-framework-postgres.yml"]
  push:
    branches: [main, feat/agent-framework]
    paths: ["backend/agent_framework/**", "tests/agent_framework/**", "pyproject.toml", "uv.lock", ".github/workflows/agent-framework-postgres.yml"]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: disposable-framework-ci-admin
        ports: ["25430:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_ALLOW_CREATE: "1"
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "25430"
      TEST_DB_ADMIN_USER: postgres
      TEST_DB_ADMIN_PASSWORD: disposable-framework-ci-admin
      TEST_DB_OWNER_USER: af_owner
      TEST_DB_OWNER_PASSWORD: disposable-framework-ci-owner
      TEST_DB_APP_USER: af_app
      TEST_DB_APP_PASSWORD: disposable-framework-ci-app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - run: uv sync --locked --group dev
      - name: Create restricted roles in disposable CI server
        run: |
          uv run python - <<'PY'
          import os,psycopg
          from psycopg import sql
          with psycopg.connect(host=os.environ['TEST_DB_HOST'],port=os.environ['TEST_DB_PORT'],dbname='postgres',user='postgres',password=os.environ['TEST_DB_ADMIN_PASSWORD'],autocommit=True) as connection:
              for name,password in [('TEST_DB_OWNER_USER','TEST_DB_OWNER_PASSWORD'),('TEST_DB_APP_USER','TEST_DB_APP_PASSWORD')]:
                  connection.execute(sql.SQL('CREATE ROLE {} LOGIN PASSWORD {}').format(sql.Identifier(os.environ[name]),sql.Literal(os.environ[password])))
          PY
      - run: uv run pytest tests/agent_framework/test_postgres_integration.py -m db_integration -q
