name: Agent framework PostgreSQL
on:
  pull_request:
    paths: ["backend/agent_framework/**", "backend/app/**", "backend/migrations/**", "tests/agent_framework/**", "tests/app/**", "docs/poster-baselines/**", "deploy/agent-framework/**", "scripts/framework_desktop.py", "scripts/framework_graph_test*.py", "scripts/framework_graph_runtime.py", "tests/test_framework_graph_test.py", "tests/test_framework_graph_runtime.py", "pyproject.toml", "uv.lock", ".github/workflows/agent-framework-postgres.yml", "backend/runtime_environment.py", "backend/app/config.py", ".env*.example"]
  push:
    branches: ["main", "AWS_TEST", "feat/agent-framework", "feat/37-a02-pdf-registration"]
    paths: ["backend/agent_framework/**", "backend/app/**", "backend/migrations/**", "tests/agent_framework/**", "tests/app/**", "docs/poster-baselines/**", "deploy/agent-framework/**", "scripts/framework_desktop.py", "scripts/framework_graph_test*.py", "scripts/framework_graph_runtime.py", "tests/test_framework_graph_test.py", "tests/test_framework_graph_runtime.py", "pyproject.toml", "uv.lock", ".github/workflows/agent-framework-postgres.yml", "backend/runtime_environment.py", "backend/app/config.py", ".env*.example"]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FRAMEWORK_DOCKER_TEST_IMAGE: creative-checker-framework:ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - run: uv sync --locked --group dev
      - run: docker build -f deploy/agent-framework/Dockerfile -t creative-checker-framework:ci .
      - run: uv run pytest tests/test_framework_graph_test.py tests/test_framework_graph_runtime.py -q
      - name: Isolated PostgreSQL and Neo4j integration
        run: uv run python scripts/framework_graph_test.py --host -- tests/agent_framework -q
      - name: Common Mac-Windows Linux-container entry point
        run: python3 scripts/framework_graph_test.py
