name: Agent framework PostgreSQL
on:
  pull_request:
    paths: ["backend/agent_framework/**", "backend/app/**", "backend/migrations/**", "tests/agent_framework/**", "tests/app/**", "docs/poster-baselines/**", "deploy/agent-framework/**", "scripts/framework_desktop.py", "pyproject.toml", "uv.lock", ".github/workflows/agent-framework-postgres.yml", "backend/runtime_environment.py", "backend/app/config.py", ".env*.example"]
  push:
    branches: ["main", "feat/agent-framework", "feat/37-a02-pdf-registration"]
    paths: ["backend/agent_framework/**", "tests/agent_framework/**", "deploy/agent-framework/**", "scripts/framework_desktop.py", "pyproject.toml", "uv.lock", ".github/workflows/agent-framework-postgres.yml", "backend/runtime_environment.py", "backend/app/config.py", ".env*.example"]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: disposable-framework-ci-admin
        ports: ["25430:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/disposable-framework-ci-graph
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports: ["57631:7687"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      AF_TEST_NEO4J_URI: bolt://127.0.0.1:57631
      AF_TEST_NEO4J_PASSWORD: disposable-framework-ci-graph
      TEST_DB_ALLOW_CREATE: "1"
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "25430"
      TEST_DB_ADMIN_USER: postgres
      TEST_DB_ADMIN_PASSWORD: disposable-framework-ci-admin
      TEST_DB_OWNER_USER: af_owner
      TEST_DB_OWNER_PASSWORD: disposable-framework-ci-owner
      TEST_DB_APP_USER: af_app
      TEST_DB_APP_PASSWORD: disposable-framework-ci-app
      FRAMEWORK_DOCKER_TEST_IMAGE: creative-checker-framework:ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - run: uv sync --locked --group dev
      - run: docker build -f deploy/agent-framework/Dockerfile -t creative-checker-framework:ci .
      - name: Create restricted roles in disposable CI server
        run: |
          uv run python - <<'PY'
          import os,psycopg
          from psycopg import sql
          with psycopg.connect(host=os.environ['TEST_DB_HOST'],port=os.environ['TEST_DB_PORT'],dbname='postgres',user='postgres',password=os.environ['TEST_DB_ADMIN_PASSWORD'],autocommit=True) as connection:
              for name,password in [('TEST_DB_OWNER_USER','TEST_DB_OWNER_PASSWORD'),('TEST_DB_APP_USER','TEST_DB_APP_PASSWORD')]:
                  connection.execute(sql.SQL('CREATE ROLE {} LOGIN PASSWORD {}').format(sql.Identifier(os.environ[name]),sql.Literal(os.environ[password])))
          PY
      - run: uv run pytest tests/agent_framework -m db_integration -q
