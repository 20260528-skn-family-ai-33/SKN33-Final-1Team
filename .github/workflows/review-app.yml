name: Rebuild checks
on:
  pull_request:
    paths: ["backend/**", "frontend/**", "tests/rebuild/**", "pyproject.toml", "uv.lock", "start.py", "deploy/**", ".github/workflows/**"]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --group dev
      - run: uv run pytest tests/rebuild -m "not integration and not live_model" -q
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
