name: Integrated review checks
on:
  pull_request:
    paths: ["backend/**", "frontend/**", "tests/**", "scripts/**", "requirements*.txt", "pyproject.toml", "uv.lock", "start.py", "setup_local.py", "run.sh", "run.cmd", ".env*.example", "compose*.yaml", "deploy/**", ".github/workflows/**"]
  push:
    branches: [main, AWS_TEST]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --group dev
      - run: .venv/bin/python -m pytest -q
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run test:v1 && npm run typecheck
        working-directory: frontend
      - run: npm run build && npm run build:v1 && npm run build:rebuild
        working-directory: frontend
