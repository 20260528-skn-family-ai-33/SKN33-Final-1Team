name: Rebuild PostgreSQL and Neo4j integration
on:
  pull_request:
    paths: ["backend/**", "tests/rebuild/**", "pyproject.toml", "uv.lock", ".github/workflows/**"]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: checker
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: checker_rebuild
        ports: ["25429:5432"]
        options: >-
          --health-cmd "pg_isready -U checker" --health-interval 5s --health-timeout 5s --health-retries 10
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-only-disposable
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports: ["57629:7687"]
    env:
      CC_INTEGRATION_DATABASE_URL: postgresql+psycopg://checker:ci-only-disposable@127.0.0.1:25429/checker_rebuild
      CC_TEST_NEO4J_URI: bolt://127.0.0.1:57629
      CC_TEST_NEO4J_PASSWORD: ci-only-disposable
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - run: uv sync --locked --group dev
      - run: uv run pytest tests/rebuild -m integration -q
