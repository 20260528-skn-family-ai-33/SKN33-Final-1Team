name: Agent framework contracts
on:
  pull_request:
    paths: ["backend/agent_framework/**", "tests/agent_framework/**", "examples/agent_framework/**", "docs/agent-framework/**", "scripts/*agent*framework.py", "scripts/build_agent_flow_html.py", "scripts/build_agent_code_graph.py", "scripts/templates/agent-flow.*", ".gitattributes", "pyproject.toml", "uv.lock", ".github/workflows/agent-framework.yml"]
  push:
    branches: [main, feat/agent-framework]
    paths: ["backend/agent_framework/**", "tests/agent_framework/**", "examples/agent_framework/**", "docs/agent-framework/**", "scripts/*agent*framework.py", "scripts/build_agent_flow_html.py", "scripts/build_agent_code_graph.py", "scripts/templates/agent-flow.*", ".gitattributes", "pyproject.toml", "uv.lock", ".github/workflows/agent-framework.yml"]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - run: uv sync --locked --group dev
      - run: uv run pytest tests/agent_framework -q
      - run: uv run python -m backend.agent_framework demo
      - run: uv run python -m backend.agent_framework doctor --config examples/agent_framework/team_config.synthetic.json
      - run: uv run python -m backend.agent_framework check A06 --config examples/agent_framework/team_config.synthetic.json --cases examples/agent_framework/checks/A06.suite.json
      - run: uv run python -m backend.agent_framework check A07 --config examples/agent_framework/team_config.synthetic.json --cases examples/agent_framework/checks/A07.suite.json
      - run: uv run python -m examples.agent_framework.file_access_demo
      - run: uv run python -m backend.agent_framework check-flow --config examples/agent_framework/team_config.synthetic.json --case examples/agent_framework/workflow.synthetic.json
      - run: uv run python -m examples.agent_framework.file_flow_demo
