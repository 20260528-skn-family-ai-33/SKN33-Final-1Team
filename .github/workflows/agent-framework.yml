name: Agent framework contracts
on:
  pull_request:
    paths: ["backend/agent_framework/**", "tests/agent_framework/**", "tests/test_qwen_server_preparation.py", "tests/test_framework_desktop.py", "deploy/qwen-a02/**", "deploy/agent-framework/**", "scripts/framework_desktop.py", "examples/agent_framework/**", "docs/agent-framework/**", "scripts/*agent*framework.py", "scripts/build_agent_flow_html.py", "scripts/build_agent_code_graph.py", "scripts/templates/agent-flow.*", ".gitattributes", "pyproject.toml", "uv.lock", ".github/workflows/agent-framework.yml"]
  push:
    branches: [main, feat/agent-framework, feat/37-a02-pdf-registration]
    paths: ["backend/agent_framework/**", "tests/agent_framework/**", "tests/test_qwen_server_preparation.py", "tests/test_framework_desktop.py", "deploy/qwen-a02/**", "deploy/agent-framework/**", "scripts/framework_desktop.py", "examples/agent_framework/**", "docs/agent-framework/**", "scripts/*agent*framework.py", "scripts/build_agent_flow_html.py", "scripts/build_agent_code_graph.py", "scripts/templates/agent-flow.*", ".gitattributes", "pyproject.toml", "uv.lock", ".github/workflows/agent-framework.yml"]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - run: uv sync --locked --group dev
      - run: uv run pytest tests/agent_framework -q
      - run: uv run pytest tests/test_qwen_server_preparation.py tests/test_framework_desktop.py -q
      - run: uv run python -m backend.agent_framework demo
      - run: uv run python -m backend.agent_framework doctor --config examples/agent_framework/team_config.synthetic.json
      - run: uv run python -m backend.agent_framework check A06 --config examples/agent_framework/team_config.synthetic.json --cases examples/agent_framework/checks/A06.suite.json
      - run: uv run python -m backend.agent_framework check A07 --config examples/agent_framework/team_config.synthetic.json --cases examples/agent_framework/checks/A07.suite.json
      - run: uv run python -m examples.agent_framework.file_access_demo
      - run: uv run python -m backend.agent_framework check-flow --config examples/agent_framework/team_config.synthetic.json --case examples/agent_framework/workflow.synthetic.json
      - run: uv run python -m examples.agent_framework.file_flow_demo
  desktop-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/agent-framework/Dockerfile -t creative-checker-framework:ci .
      - run: python3 scripts/framework_desktop.py doctor
      - run: python3 scripts/framework_desktop.py demo --image creative-checker-framework:ci
      - run: python3 scripts/framework_desktop.py init-pdf --image creative-checker-framework:ci --volume cc-framework-ci-${{ github.run_id }}
      - name: Check Linux-volume file integrity and locking
        run: |
          docker run --rm -v cc-framework-ci-${{ github.run_id }}:/data --entrypoint /app/.venv/bin/python creative-checker-framework:ci -c "from backend.agent_framework.documents import open_document_storage; s=open_document_storage('/data/pdf'); s.start(shared=True); s.close(); print('Linux storage checks passed')"
      - if: always()
        run: docker volume rm cc-framework-ci-${{ github.run_id }}
