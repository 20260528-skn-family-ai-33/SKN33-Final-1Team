name: OCR compatibility

# Run explicitly after pushing; do not spend runner time on every commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ocr:
    name: OCR on ${{ matrix.os }} / ${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            device: cpu
          - os: macos-latest
            device: cpu
          - os: macos-latest
            device: mps
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LATTE_OCR_BACKEND: rapidocr
      LATTE_OCR_DEVICE: ${{ matrix.device }}
      LATTE_RUNTIME_DIR: ${{ runner.temp }}/latte-ocr-ci
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Prepare and verify OCR models
        run: python scripts/prepare_ocr.py

      - name: Run automated tests
        run: python -m pytest -q

      - name: Check Django configuration
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run actual OCR and MCP smoke checks
        run: python scripts/ocr_smoke.py --expect-device ${{ matrix.device }}

      - name: Upload OCR smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-smoke-${{ matrix.os }}-${{ matrix.device }}
          path: .runtime/ocr-smoke-report.json
          include-hidden-files: true
          if-no-files-found: warn
