[project]
name = "creative-checker"
version = "0.2.0"
description = "Versioned creative review, evidence and human approval"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.143.0", "starlette==1.7.0", "uvicorn==0.54.0", "pydantic==2.13.5",
  "sqlalchemy==2.1.5", "psycopg[binary,pool]==3.3.6",
  "python-multipart==0.0.32",
  "httpx==0.28.1", "pillow==12.3.0", "pymupdf>=1.25,<2",
  "numpy==2.5.3", "opencv-python-headless==5.0.0.93",
  "pypdfium2==5.14.0", "pypdf==6.21.2",
  "defusedxml>=0.7,<1", "imageio-ffmpeg>=0.6,<1", "boto3>=1.40,<2",
  "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4",
  "mcp>=1.26,<2", "neo4j>=5.28,<7",
  "portalocker==3.2.0", "rfc8785==0.1.4",
  "alembic==1.20.0", "argon2-cffi==25.1.0", "email-validator==2.3.0"
]

[project.optional-dependencies]
legacy-ocr = ["torch==2.10.0", "torchvision==0.25.0", "easyocr==1.7.2"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not db_integration and not ocr_external and not integration and not live_model'"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["db_integration: explicit isolated legacy PostgreSQL integration", "ocr_external: real local OCR inference", "integration: requires isolated PostgreSQL and Neo4j", "live_model: requires explicitly configured Qwen endpoint"]
