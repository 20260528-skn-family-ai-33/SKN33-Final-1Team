runtime_sha256']!=self.runtime_hash):\n                    raise AuthError('FRAMEWORK_IDEMPOTENCY_CONFLICT',409)\n                return RunSnapshot.model_validate(old['snapshot_json'])\n            flow=coordinator();flow.profile=self.configuration.profile\n            snapshot=flow.start(context,document,asset,defer=True)\n            if asset is None and self.configuration.pdf_extraction is not None and self.configuration.pdf_extraction.mode=='mock':\n                snapshot=snapshot.model_copy(update={'synthetic':True})\n            self._create(c,snapshot,document,asset,phase='extract')\n        return snapshot\n\n    def start_pdf(self,subject,project_id,version_id,request_key):\n        \"\"\"IDs and immutable PDF reference are resolved by the server, not the model.\"\"\"\n        from .documents import versions,_dto\n        if self.configuration.pdf_extraction is None:raise AuthError('A02_EXTRACTION_DISABLED',503)\n        with unit_of_work(self.engine) as c:\n            self.authorization.project(c,subject,project_id,action='write')\n            row=c.execute(select(versions).where(versions.c.project_id==project_id,\n                versions.c.document_version_id==version_id)).mappings().one_or_none()\n            if row is None:raise AuthError('RESOURCE_NOT_FOUND',404)\n            document=_dto(row).document\n        name='creative-checker-a02:'+str(project_id)+':'+str(request_key)\n        context=Context(project_id=str(project_id),actor_id=str(subject.user_id),\n            run_id=str(uuid5(NAMESPACE_URL,name)),criteria_version_id=str(uuid5(NAMESPACE_URL,name+':criteria')),\n            document_version_id=str(version_id),asset_version_id=None)\n        return self.start(subject,context,document,None)\n\n    def get(self,subject,run_id):\n        with unit_of_work(self.engine) as c:\n            row=self._row(c,run_id)\n            snapshot=RunSnapshot.model_validate(row['snapshot_json'])\n            self._access(c,subject,snapshot.context,write=False)\n        return snapshot\n\n    def get_steps(self,subject,run_id):\n        snapshot=self.get(subject,run_id)\n        return StepTimeline(context=snapshot.context,profile=snapshot.profile,storage='postgres',\n            execution_status=snapshot.execution_status,records=snapshot.step_records)\n\n    def approve(self,subject,run_id,approval):\n        approval=_boundary(Approval,approval)\n        with unit_of_work(self.engine) as c:\n            self._access(c,subject,approval.context)\n            row=self._row(c,run_id,lock=True)\n            if row['project_id']!=UUID(approval.context.project_id):raise AuthError('FRAMEWORK_RUN_NOT_FOUND',404)\n            if row['input_json'].get('baseline') is not None:\n                from .poster_review import validate_pinned_review\n                validate_pinned_review(self,c,row)\n            existing=c.execute(select(approvals).where(approvals.c.run_id==run_id,\n                approvals.c.decision==approval.decision)).mappings().one_or_none()\n            if existing:\n                if existing['payload_sha256']!=digest(approval):raise AuthError('FRAMEWORK_APPROVAL_CONFLICT',409)\n                return RunSnapshot.model_validate(row['snapshot_json'])\n            if (approval.decision=='approve_criteria' and (row['configuration_sha256']!=self.config_hash\n                    or row['runtime_sha256']!=self.runtime_hash)):\n                raise AuthError('FRAMEWORK_CONFIGURATION_CHANGED',409)\n            flow=self._restore(row)\n            snapshot=flow.approve(run_id,approval,defer=True)\n            if snapshot.baseline is not None and approval.decision=='approve_criteria':\n                snapshot=snapshot.model_copy(update={'approved_criteria_version_id':snapshot.baseline.criteria_version_id})\n            c.execute(insert(approvals).values(approval_id=uuid4(),run_id=run_id,project_id=row['project_id'],\n                actor_id=UUID(approval.actor_id),decision=approval.decision,payload_json=payload(approval),payload_sha256=digest(approval)))\n            self._save(c,snapshot)\n            self.event(c,run_id,'approval.recorded',decision=approval.decision,actor_id=approval.actor_id)\n            if approval.decision=='approve_criteria':self._job(c,snapshot,'review')\n        return snapshot\n\n    def rereview(self,subject,parent_id,context,asset):\n        context,asset=_boundary(Context,context),_boundary(AssetRef,asset)\n        with unit_of_work(self.engine) as c:\n            self._access(c,subject,context)\n            parent=self._row(c,parent_id,lock=True)\n            if parent['project_id']!=UUID(context.project_id):raise AuthError('FRAMEWORK_RUN_NOT_FOUND',404)\n            if parent['input_json'].get('baseline') is not None:\n                raise AuthError('USE_POSTER_REVISION_ENDPOINT',409)\n            document=DocumentRef.model_validate(parent['input_json']['document'])\n            fixed={'context':payload(context),'document':payload(document),'asset':payload(asset)}\n            existing=c.execute(select(runs).where(runs.c.parent_run_id==parent_id)).mappings().one_or_none()\n            if existing:\n                if existing['input_sha256']!=digest(fixed):raise AuthError('FRAMEWORK_REVISION_CONFLICT',409)\n                return RunSnapshot.model_validate(existing['snapshot_json'])\n            flow=self._restore(parent)\n            snapshot=flow.rereview(parent_id,context,asset)\n            self._create(c,snapshot,document,asset)\n        return snapshot\n\n    def approval_history(self,subject,run_id):\n        snapshot=self.get(subject,run_id)\n        with unit_of_work(self.engine) as c:\n            self._access(c,subject,snapshot.context,write=False)\n            rows=c.execute(select(approvals).where(approvals.c.run_id==run_id).order_by(approvals.c.approved_at)).mappings().all()\n            return [{'approval_id':str(r['approval_id']),'approved_at':r['approved_at'].isoformat(),\n                     'approval':r['payload_json']} for r in rows]\n\n    def worker_access(self,c,project_id,actor_id):\n        # A queued command may outlive its login session. Worker rechecks the\n        # existing account, membership and project rather than extending a session.\n        project=c.execute(select(business_table('projects')).where(business_table('projects').c.project_id==project_id)\n                          .with_for_update(key_share=True)).mappings().one_or_none()\n        user=c.execute(select(business_table('users')).where(business_table('users').c.user_id==actor_id)\n                       .with_for_update(read=True)).mappings().one_or_none()\n        members=business_table('project_members')\n        member=c.execute(select(members).where(members.c.project_id==project_id,members.c.user_id==actor_id)\n                         .with_for_update(read=True)).mappings().one_or_none()\n        if (not project or project['business_state']!='active' or not user or not user['is_active']\n                or not member or not member['is_active'] or member['role'] not in ('owner','editor')):\n            raise AuthError('FRAMEWORK_ACCESS_REVOKED',403)\n","sha256":"7feaabf18a99d48edb0d9b25cb5b4b7c5a9abb0c910ad7ba2979004cc6b7d548"},"backend/agent_framework/postgres_api.py":{"text":"\"\"\"Fresh framework entrypoint reusing M008 authentication, CSRF and app Engine.\n\nNo OCR/background-task leader, frontend build, model initialization or migration.\nPOST admission/approval only queues work; the separate worker invokes adapters.\n\"\"\"\nfrom contextlib import asynccontextmanager\nfrom dataclasses import replace\nfrom functools import partial\nfrom urllib.parse import quote\nfrom uuid import UUID\nfrom typing import Literal\n\nfrom fastapi import Header, Query, Request, Response\nfrom starlette.concurrency import run_in_threadpool\n\nfrom backend.app.main import create_app as create_auth_app\nfrom backend.app.persistence.transaction import unit_of_work\nfrom backend.app.persistence.database import PersistenceError\nfrom backend.app.security.csrf import developer_allowed\nfrom backend.app.security.errors import AuthError\nfrom backend.app.config import ConfigurationError\nfrom backend.app.services.business import Business\nfrom backend.app.routes.v1.business import project_router, image_router\nfrom backend.app.services.files import Files\nfrom .api import StartRequest,RevisionRequest\nfrom .composition import poster_review_configuration_blockers\nfrom .contracts import Approval,RunSnapshot,StepTimeline\nfrom .postgres import PostgresStore\nfrom .postgres_schema import check_extension,check_app_permissions,check_document_extension\nfrom .documents import PostgresDocuments,RegisteredDocument,TextDocumentInput,open_document_storage\nfrom .files import FileLimits\nfrom .criteria_review import PostgresCriteriaReview\nfrom .criteria_contracts import CriteriaVersionRequest,CriteriaVersionRecord,CriteriaApprovalRequest,CriteriaApprovalRecord\nfrom .poster_review import PosterReviewRequest,PostgresPosterReviews,open_poster_storage\nfrom .my_tasks import MyTasks, HistoryVisibility\n\n\ndef create_postgres_app(settings,configuration,*,engine=None,pdf_storage_root=None,poster_storage_root=None):\n    if settings.environment not in ('development','test','production'):\n        raise ConfigurationError('Unsupported framework environment.')\n    if settings.environment=='production':\n        from .deployment import require_verified_database,require_live_configuration\n        require_verified_database(settings)\n        require_live_configuration(configuration)\n    # The existing authentication app deliberately skips all legacy media and\n    # review executors when storage/frontend are unset.\n    settings=replace(settings,storage_root=None,frontend_dist=None,review_pipeline='disabled',\n                     review_executor='background_tasks',review_config_file=None)\n    app=create_auth_app(settings=settings,engine=engine)\n    original=app.router.lifespan_context\n    @asynccontextmanager\n    async def lifespan(current):\n        async with original(current):\n            def prepare():\n                with unit_of_work(current.state.engine) as c:\n                    revision=check_extension(c);check_app_permissions(c)\n                    if pdf_storage_root is not None:check_document_extension(c)\n                if configuration.context_preparation is not None and revision['revision']!='AF005':\n                    raise ConfigurationError('Neo4j evidence preparation requires explicit AF005 migration.')\n                current.state.framework_revision=revision['revision']\n                current.state.business=Business(current.state.engine,current.state.authorization,settings)\n                return PostgresStore(current.state.engine,configuration,current.state.authorization)\n            current.state.framework=await run_in_threadpool(prepare)\n            storage=None\n            poster_storage=None\n            current.state.documents=None\n            current.state.criteria_review=None\n            current.state.poster_reviews=None\n            try:\n                if pdf_storage_root is not None:\n                    storage=await run_in_threadpool(open_document_storage,pdf_storage_root)\n                    current.state.documents=PostgresDocuments(current.state.engine,current.state.authorization,storage)\n                if current.state.framework_revision in ('AF003','AF004','AF005'):\n                    current.state.criteria_review=PostgresCriteriaReview(current.state.framework,current.state.documents)\n                if poster_storage_root is not None:\n                    if current.state.criteria_review is None or storage is None:\n                        raise ConfigurationError('Poster reviews require AF003 and registered PDF storage.')\n                    poster_storage=await run_in_threadpool(open_poster_storage,poster_storage_root)\n                    if configuration.roles['A04_A05'].kind=='registered_poster':\n                        current.state.files = Files(current.state.engine, poster_storage, current.state.business)\n                        await run_in_threadpool(current.state.files.recover, concurrent=True)\n                        current.state.poster_reviews=PostgresPosterReviews(current.state.framework,current.state.criteria_review,poster_storage)\n                yield\n            finally:\n                if poster_storage is not None:await run_in_threadpool(poster_storage.close)\n                if storage is not None:await run_in_threadpool(storage.close)\n    app.router.lifespan_context=lifespan\n    app.title='Creative Checker — PostgreSQL agent framework'\n    app.include_router(project_router(),prefix='/api/v1')\n\n    def subject(request):\n        user=app.state.auth.current(request.cookies.get(settings.session_cookie),\n            developer_allowed=developer_allowed(request,settings))\n        if user is None:raise AuthError('AUTHENTICATION_REQUIRED',401)\n        return user\n\n    def invoke(action,*args):\n        try:return action(*args)\n        except ValueError:raise AuthError('FRAMEWORK_CONFLICT',409) from None\n\n    prefix='/api/framework/v1'\n    app.include_router(project_router(),prefix=prefix)\n    if poster_storage_root is not None and configuration.roles['A04_A05'].kind == 'registered_poster':\n        app.include_router(image_router(), prefix=prefix)\n    from backend.app.routes.v1.auth import csrf_response\n    app.add_api_route(prefix+'/csrf',csrf_response,methods=['GET'])\n    @app.get(prefix+'/health')\n    def health():\n        blockers=[code for ready,code in (\n            (app.state.documents is not None,'DOCUMENT_STORAGE_NOT_READY'),\n            (app.state.criteria_review is not None,'CRITERIA_REVIEW_NOT_READY'),\n            (app.state.poster_reviews is not None,'POSTER_STORAGE_NOT_READY'),\n        ) if not ready]\n        blockers.extend(poster_review_configuration_blockers(configuration))\n        return {'storage':'postgres','queue':'agent_framework.jobs','schema':app.state.framework_revision,\n                'pdf_registration':app.state.documents is not None,\n                'free_text_registration':app.state.documents is not None and app.state.framework_revision in ('AF004','AF005'),\n                'pdf_extraction_mode':configuration.pdf_extraction.mode if configuration.pdf_extraction and app.state.documents else None,\n                'requirements_presentation':bool(configuration.pdf_extraction and configuration.pdf_extraction.presentation),\n                'context_preparation':configuration.context_preparation.mode if configuration.context_preparation else 'approved_sources',\n                'graph_projection':app.state.framework_revision=='AF005',\n                'task_controls':True,\n                'criteria_review':app.state.criteria_review is not None,\n                'poster_reviews':app.state.poster_reviews is not None,\n                'poster_review_ready':not blockers,'poster_review_blockers':blockers,\n                'authentication':'existing_M008_session_and_CSRF','adapters_initialized_in_api':False,'production_ready':False}\n    @app.get('/api/health')\n    def frontend_health():\n        # front-v2 probes this legacy-compatible path. Readiness is API-only;\n        # no inference request or claim of model connectivity is made here.\n        return {'status':'ok','ready':app.state.ready,'runtime':{'profile':'agent_framework'},\n                'model_connection_verified':False,**health()}\n    @app.get(prefix+'/projects/{project_id}/graph-status')\n    def graph_status_view(request:Request,project_id:UUID):\n        from .graph_projection import graph_status,installed\n        actor=subject(request)\n        with unit_of_work(app.state.engine) as c:\n            app.state.authorization.project(c,actor,project_id,action='read')\n            if not installed(c):raise AuthError('FRAMEWORK_GRAPH_SCHEMA_NOT_READY',503)\n            return graph_status(c,project_id)\n\n    @app.get(prefix+'/projects/{project_id}/criteria-impact')\n    def impact_view(request:Request,project_id:UUID,criteria_version_id:UUID,criterion_id:str):\n        from .graph_projection import criteria_impact\n        actor=subject(request)\n        with unit_of_work(app.state.engine) as c:\n            app.state.authorization.project(c,actor,project_id,action='read')\n            return criteria_impact(c,project_id,criteria_version_id,criterion_id)\n\n    @app.get(prefix+'/runs/{run_id}/evidence-context')\n    def evidence_view(request:Request,run_id:str):\n        from .evidence_context import read_context\n        return read_context(app.state.framework,subject(request),run_id)\n\n    @app.get(prefix+'/my-tasks')\n    def my_tasks(request:Request, visibility:Literal['visible','hidden','all']='visible',\n                 limit:int=Query(30,ge=1,le=100), before:str|None=Query(None,max_length=160)):\n        return MyTasks(app.state.framework).list(subject(request),visibility=visibility,limit=limit,before=before)\n\n    @app.post(prefix+'/runs/{run_id}/cancel',response_model=RunSnapshot)\n    def cancel_task(request:Request,run_id:str):\n        return MyTasks(app.state.framework).cancel(subject(request),run_id)\n\n    @app.post(prefix+'/runs/{run_id}/history-visibility')\n    def task_visibility(request:Request,run_id:str,body:HistoryVisibility):\n        return MyTasks(app.state.framework).visibility(subject(request),run_id,body.hidden)\n\n    @app.post(prefix+'/runs',response_model=RunSnapshot,status_code=202)\n    def start(request:Request,body:StartRequest):\n        return invoke(app.state.framework.start,subject(request),body.context,body.document,body.asset)\n    @app.get(prefix+'/runs/{run_id}',response_model=RunSnapshot)\n    def read(request:Request,run_id:str):return invoke(app.state.framework.get,subject(request),run_id)\n    @app.get(prefix+'/runs/{run_id}/requirements')\n    def requirements(request:Request,run_id:str):\n        from .requirements_presentation import present_requirements\n        snapshot=invoke(app.state.framework.get,subject(request),run_id)\n        return present_requirements(snapshot)\n    @app.get(prefix+'/runs/{run_id}/steps',response_model=StepTimeline)\n    def timeline(request:Request,run_id:str):return invoke(app.state.framework.get_steps,subject(request),run_id)\n    @app.get(prefix+'/runs/{run_id}/approvals')\n    def history(request:Request,run_id:str):return invoke(app.state.framework.approval_history,subject(request),run_id)\n    @app.post(prefix+'/runs/{run_id}/approvals',response_model=RunSnapshot)\n    def approve(request:Request,run_id:str,body:Approval):\n        return invoke(app.state.framework.approve,subject(request),run_id,body)\n    @app.post(prefix+'/runs/{run_id}/revisions',response_model=RunSnapshot,status_code=201)\n    def revise(request:Request,run_id:str,body:RevisionRequest):\n        return invoke(app.state.framework.rereview,subject(request),run_id,body.context,body.asset)\n\n    def documents():\n        if app.state.documents is None:raise AuthError('PDF_REGISTRATION_DISABLED',503)\n        return app.state.documents\n\n    def criteria_review():\n        if app.state.criteria_review is None:raise AuthError('CRITERIA_REVIEW_SCHEMA_REQUIRED',503)\n        return app.state.criteria_review\n\n    async def poster_command(request,run_id,key,revision):\n        from backend.app.routes.v1.business import parse\n        service=app.state.poster_reviews\n        if service is None:raise AuthError('POSTER_REVIEW_DISABLED',503)\n        actor=await run_in_threadpool(subject,request)\n        try:\n            await run_in_threadpool(service.preflight,actor,run_id)\n            body=await parse(request,PosterReviewRequest)\n            action=service.revise if revision else service.create\n            return await run_in_threadpool(action,actor,run_id,key,body)\n        except PersistenceError:raise AuthError('POSTER_ADMISSION_UNCONFIRMED',503) from None\n        except ValueError:raise AuthError('POSTER_INPUT_INVALID',422) from None\n\n    @app.post(prefix+'/runs/{run_id}/poster-reviews',response_model=RunSnapshot,status_code=201)\n    async def poster_review(request:Request,run_id:str,idempotency_key:UUID=Header(alias='Idempotency-Key')):\n        return await poster_command(request,run_id,idempotency_key,False)\n\n    @app.post(prefix+'/runs/{run_id}/poster-revisions',response_model=RunSnapshot,status_code=201)\n    async def poster_revision(request:Request,run_id:str,idempotency_key:UUID=Header(alias='Idempotency-Key')):\n        return await poster_command(request,run_id,idempotency_key,True)\n\n    async def review_command(request,run_id,model,action,request_key):\n        from backend.app.routes.v1.business import parse\n        service=criteria_review()\n        actor=await run_in_threadpool(subject,request)\n        try:\n            await run_in_threadpool(service.preflight,actor,run_id)\n            body=await parse(request,model)  # Existing bounded/strict JSON parser.\n            return await run_in_threadpool(action,actor,run_id,request_key,body)\n        except PersistenceError:raise AuthError('CRITERIA_WRITE_UNCONFIRMED',503) from None\n        except ValueError:raise AuthError('CRITERIA_REQUEST_INVALID',422) from None\n\n    @app.get(prefix+'/runs/{run_id}/criteria-review')\n    def review_overview(request:Request,run_id:str):\n        return criteria_review().overview(subject(request),run_id)\n\n    @app.post(prefix+'/runs/{run_id}/criteria-versions',response_model=CriteriaVersionRecord,status_code=201)\n    async def revise_criteria(request:Request,run_id:str,idempotency_key:UUID=Header(alias='Idempotency-Key')):\n        return await review_command(request,run_id,CriteriaVersionRequest,criteria_review().create,idempotency_key)\n\n    @app.get(prefix+'/runs/{run_id}/criteria-versions',response_model=list[CriteriaVersionRecord])\n    def criteria_history(request:Request,run_id:str):\n        return criteria_review().history(subject(request),run_id)\n\n    @app.get(prefix+'/runs/{run_id}/criteria-versions/{version_id}',response_model=CriteriaVersionRecord)\n    def criteria_version(request:Request,run_id:str,version_id:UUID):\n        return criteria_review().get(subject(request),run_id,version_id)\n\n    @app.post(prefix+'/runs/{run_id}/criteria-approvals',response_model=CriteriaApprovalRecord)\n    async def approve_criteria(request:Request,run_id:str,idempotency_key:UUID=Header(alias='Idempotency-Key')):\n        return await review_command(request,run_id,CriteriaApprovalRequest,criteria_review().approve,idempotency_key)\n\n    @app.get(prefix+'/runs/{run_id}/criteria-approval',response_model=CriteriaApprovalRecord)\n    def approved_criteria(request:Request,run_id:str):\n        return criteria_review().approved(subject(request),run_id)\n\n    @app.post(prefix+'/projects/{project_id}/document-versions/{version_id}/extractions',response_model=RunSnapshot,status_code=202)\n    async def extract_pdf(request:Request,project_id:UUID,version_id:UUID,\n                          idempotency_key:UUID=Header(alias='Idempotency-Key')):\n        service=documents()\n        actor=await run_in_threadpool(subject,request)\n        await run_in_threadpool(service.get,actor,developer_allowed(request,settings),project_id,version_id)\n        # No answers, model URL, actor IDs or poster placeholders from the client.\n        async for chunk in request.stream():\n            if chunk:raise AuthError('A02_EXTRACTION_BODY_NOT_ALLOWED',422)\n        try:return await run_in_threadpool(app.state.framework.start_pdf,actor,project_id,version_id,idempotency_key)\n        except PersistenceError:raise AuthError('A02_ADMISSION_UNCONFIRMED',503) from None\n\n    async def text_document(request,pid,request_key,document_id=None,previous=None):\n        from backend.app.routes.v1.business import parse\n        service=documents();actor=await run_in_threadpool(subject,request)\n        await run_in_threadpool(service.preflight,actor,developer_allowed(request,settings),pid,document_id,previous)\n        if app.state.framework_revision not in ('AF004','AF005'):raise AuthError('FRAMEWORK_TEXT_SCHEMA_NOT_READY',503)\n        body=await parse(request,TextDocumentInput)\n        try:raw=body.text.encode('utf-8')\n        except UnicodeError:raise AuthError('REQUIREMENT_TEXT_INVALID',422) from None\n        return await run_in_threadpool(partial(service.register,actor,developer_allowed(request,settings),pid,request_key,raw,\n            filename='requirements.txt',document_id=document_id,previous_version_id=previous,media_type='text/plain'))\n\n    text_body_schema={'requestBody':{'required':True,'content':{'application/json':{'schema':TextDocumentInput.model_json_schema()}}}}\n    @app.post(prefix+'/projects/{project_id}/text-documents',response_model=RegisteredDocument,status_code=201,openapi_extra=text_body_schema)\n    async def register_text(request:Request,project_id:UUID,idempotency_key:UUID=Header(alias='Idempotency-Key')):\n        return await text_document(request,project_id,idempotency_key)\n\n    @app.post(prefix+'/projects/{project_id}/text-documents/{document_id}/versions',response_model=RegisteredDocument,status_code=201,openapi_extra=text_body_schema)\n    async def register_text_version(request:Request,project_id:UUID,document_id:UUID,previous_version_id:UUID,\n                                    idempotency_key:UUID=Header(alias='Idempotency-Key')):\n        return await text_document(request,project_id,idempotency_key,document_id,previous_version_id)\n\n    async def upload(request,pid,request_key,filename,document_id=None,previous=None):\n        service=documents()\n        actor=await run_in_threadpool(subject,request)\n        dev=developer_allowed(request,settings)\n        # Authorize before consuming any uploaded bytes; the transaction is\n        # closed while streaming and rechecked when metadata is committed.\n        await run_in_threadpool(service.preflight,actor,dev,pid,document_id,previous)\n        if request.headers.get('content-type','').split(';',1)[0].strip().lower()!='application/pdf':\n            raise AuthError('PDF_CONTENT_TYPE_REQUIRED',415)\n        limit=FileLimits().max_document_bytes\n        length=request.headers.get('content-length')\n        if length is not None:\n            if not length.isascii() or not length.isdecimal():raise AuthError('PDF_LENGTH_INVALID',400)\n            if len(length)\u003e10 or int(length)\u003elimit:raise AuthError('FILE_TOO_LARGE',413)\n        raw=bytearray()\n        async for chunk in request.stream():\n            if len(raw)+len(chunk)\u003elimit:raise AuthError('FILE_TOO_LARGE',413)\n            raw.extend(chunk)\n        return await run_in_threadpool(partial(service.register,actor,dev,pid,request_key,bytes(raw),\n            filename=filename,document_id=document_id,previous_version_id=previous))\n\n    @app.post(prefix+'/projects/{project_id}/documents',response_model=RegisteredDocument,status_code=201)\n    async def register_document(request:Request,project_id:UUID,filename:str='document.pdf',\n                                idempotency_key:UUID=Header(alias='Idempotency-Key')):\n        return await upload(request,project_id,idempotency_key,filename)\n\n    @app.post(prefix+'/projects/{project_id}/documents/{document_id}/versions',response_model=RegisteredDocument,status_code=201)\n    async def register_version(request:Request,project_id:UUID,document_id:UUID,previous_version_id:UUID,\n                               filename:str='document.pdf',idempotency_key:UUID=Header(alias='Idempotency-Key')):\n        return await upload(request,project_id,idempotency_key,filename,document_id,previous_version_id)\n\n    @app.get(prefix+'/projects/{project_id}/document-versions/{version_id}',response_model=RegisteredDocument)\n    def document_version(request:Request,project_id:UUID,version_id:UUID):\n        return documents().get(subject(request),developer_allowed(request,settings),project_id,version_id)\n\n    @app.get(prefix+'/projects/{project_id}/documents/{document_id}/versions',response_model=list[RegisteredDocument])\n    def document_history(request:Request,project_id:UUID,document_id:UUID):\n        return documents().history(subject(request),developer_allowed(request,settings),project_id,document_id)\n\n    @app.get(prefix+'/projects/{project_id}/document-versions/{version_id}/content')\n    def document_content(request:Request,project_id:UUID,version_id:UUID):\n        record,raw=documents().content(subject(request),developer_allowed(request,settings),project_id,version_id)\n        fallback='requirements.txt' if record.document.media_type=='text/plain' else 'document.pdf'\n        return Response(raw,media_type=record.document.media_type,headers={\n            'Content-Disposition':f'attachment; filename=\"{fallback}\"; filename*=UTF-8\\'\\''+quote(record.original_name,safe='')})\n    return app\n","sha256":"16f062bf465ad9851a99351392a1187ced1778dabdda7251f4d964efbd186ee5"},"backend/agent_framework/postgres_commands.py":{"text":"\"\"\"Explicit app/owner separation and framework-only process startup.\"\"\"\nimport json\nfrom pathlib import Path\nimport signal\nimport sys\nfrom threading import Event\n\nfrom backend.app.config import load_settings,read_environment_file,ConfigurationError\nfrom backend.app.persistence.database import create_app_engine,PersistenceError\nfrom backend.app.persistence.schema_inventory import check_schema\nfrom backend.app.persistence.transaction import unit_of_work\nfrom backend.app.security.errors import AuthError\nfrom .composition import load_config,build_agents\nfrom .postgres import PostgresStore\nfrom .postgres_schema import check_extension,check_app_permissions\nfrom backend.runtime_environment import activate_runtime\n\n\ndef _values(filename, component='v1'):\n    # An explicit file is required; never discover or modify the user's .env.\n    values=activate_runtime(component, Path(filename))\n    if any(values.get(k) for k in ('DB_OWNER_PASSWORD','POSTGRES_PASSWORD')):\n        raise ConfigurationError('Runtime requires app-only credentials.')\n    if values.get('APP_ENV') not in ('development','test','production'):\n        raise ConfigurationError('Select APP_ENV=development, test or production explicitly.')\n    settings=load_settings(values)\n    if settings.persistence_mode!='postgres':raise ConfigurationError('Select PostgreSQL explicitly.')\n    if values.get('APP_ENV')=='production':\n        from .deployment import require_verified_database\n        require_verified_database(settings)\n    return values,settings\n\n\ndef _ready(engine,settings):\n    check_schema(engine,settings)\n    with unit_of_work(engine) as c:\n        result=check_extension(c);check_app_permissions(c);return result\n\n\ndef postgres_check(args):\n    _values_map,settings=_values(args.env_file)\n    engine=create_app_engine(settings)\n    try:print(json.dumps(_ready(engine,settings)));return 0\n    finally:engine.dispose()\n\n\ndef postgres_serve(args):\n    from backend.app.v1_config import load_v1_settings\n    from .postgres_api import create_postgres_app\n    import uvicorn\n    values,_settings=_values(args.env_file)\n    from .deployment import trusted_proxies\n    proxies=trusted_proxies(values.get('TRUSTED_PROXY_IPS',''))\n    root=Path(args.pdf_storage_root).expanduser().resolve() if args.pdf_storage_root else None\n    posters=Path(args.poster_storage_root).expanduser().resolve() if args.poster_storage_root else None\n    app=create_postgres_app(load_v1_settings(values),load_config(args.config),pdf_storage_root=root,poster_storage_root=posters)\n    uvicorn.run(app,host=getattr(args,'host','127.0.0.1'),port=args.port,workers=1,reload=False,\n                proxy_headers=bool(proxies),forwarded_allow_ips=proxies)\n    return 0\n\n\ndef postgres_worker(args):\n    from .durable_worker import PostgresQueue,execute_claim\n    values,settings=_values(args.env_file, 'framework-worker')\n    configuration=load_config(args.config)\n    if values.get('APP_ENV')=='production':\n        from .deployment import require_live_configuration\n        require_live_configuration(configuration)\n    engine=create_app_engine(settings)\n    stop=Event()\n    storage=None\n    poster_storage=None\n    for signum in (signal.SIGTERM,signal.SIGINT):signal.signal(signum,lambda *_:stop.set())\n    try:\n        _ready(engine,settings)\n        if configuration.context_preparation is not None:\n            with unit_of_work(engine) as c:\n                if check_extension(c)['revision']!='AF005':raise ConfigurationError('Neo4j evidence preparation requires AF005.')\n        store=PostgresStore(engine,configuration)\n        queue=PostgresQueue(store)\n        if configuration.pdf_extraction is not None:\n            from .documents import open_document_storage\n            from .postgres_schema import check_document_extension\n            from .a02 import build_postgres_agents\n            if not args.pdf_storage_root:raise ConfigurationError('Registered PDF extraction requires a dedicated PDF storage root.')\n            with unit_of_work(engine) as c:check_document_extension(c)\n            storage=open_document_storage(Path(args.pdf_storage_root).expanduser().resolve())\n            if configuration.roles['A04_A05'].kind=='registered_poster':\n                from .poster_review import open_poster_storage\n                if not args.poster_storage_root:raise ConfigurationError('Registered poster inspection requires the existing image storage root.')\n                poster_storage=open_poster_storage(Path(args.poster_storage_root).expanduser().resolve())\n            agents=build_postgres_agents(configuration,store,storage,api_key=values.get('A02_QWEN_API_KEY'),poster_storage=poster_storage)\n            if configuration.pdf_extraction.mode=='mock':print('SYNTHETIC A02 MOCK: manual-only fixture candidates, no Qwen call.',file=sys.stderr)\n        else:agents=build_agents(configuration)  # Only worker initializes role factories.\n        print(json.dumps({'event':'framework_worker_ready','pdf_extraction_mode':configuration.pdf_extraction.mode if configuration.pdf_extraction else None}),flush=True)\n        while not stop.is_set():\n            try:\n                recovered=queue.recover_expired()\n                claim=queue.claim_next()\n                outcome=execute_claim(queue,claim,agents,stop=stop) if claim else 'idle'\n                if claim or recovered or args.once:\n                    print(json.dumps({'event':'framework_worker_cycle','outcome':outcome,'recovered':len(recovered)}),flush=True)\n                if args.once:return 1 if outcome in ('failed','outcome_unknown','database_unavailable','authority_lost') else 0\n            except (PersistenceError,AuthError):\n                print(json.dumps({'event':'framework_worker_database_or_authority_unavailable'}),flush=True)\n                if args.once:return 1\n            stop.wait(1)\n        return 0\n    finally:\n        if poster_storage is not None:poster_storage.close()\n        if storage is not None:storage.close()\n        engine.dispose()\n\n\ndef postgres_migrate(args):\n    from backend.migrations.configuration import load_migration_settings\n    from .postgres_schema import migrate\n    values=read_environment_file(Path(args.env_file))\n    settings=load_migration_settings(values)\n    try:result=migrate(settings,target=args.revision)\n    except Exception:\n        raise PersistenceError('FRAMEWORK_MIGRATION_UNCONFIRMED',\n            'Migration failed or its commit was not confirmed. Reconcile the schema before retrying.',outcome='commit_unknown') from None\n    print(json.dumps(result));return 0\n\n\ndef initialize_pdf_storage(args):\n    from backend.app.storage.local import StorageError\n    from .documents import initialize_document_storage\n    from .ports import AdapterFailure\n    try:initialize_document_storage(Path(args.root).expanduser().resolve())\n    except (StorageError,OSError):\n        raise AdapterFailure('PDF_STORAGE_INITIALIZATION_FAILED',\n            'Use a new dedicated local PDF storage directory on a supported filesystem.') from None\n    print(json.dumps({'storage':'framework_pdf','initialized':True}));return 0\n","sha256":"54de9b8bf2b703285a3a591df521ab056fbf81fe87d9316d86b9a4a755ffd472"},"backend/agent_framework/postgres_schema.py":{"text":"\"\"\"Explicit owner migration and read-only extension preflight; never on import.\"\"\"\nfrom hashlib import sha256\nimport json\nfrom pathlib import Path\n\nfrom sqlalchemy import text\n\nfrom backend.app.persistence.database import PersistenceError\nfrom backend.app.persistence.schema_inventory import _STRUCTURE_QUERIES,validate_schema\n\nDDL = Path(__file__).with_name('AF001.sql')\nDOCUMENT_DDL = Path(__file__).with_name('AF002.sql')\nCRITERIA_DDL = Path(__file__).with_name('AF003.sql')\nTEXT_DDL = Path(__file__).with_name('AF004.sql')\nGRAPH_DDL = Path(__file__).with_name('AF005.sql')\nGRAPH_TABLES = ('graph_state','graph_outbox','evidence_contexts')\nTABLES = ('schema_version', 'runs', 'jobs', 'steps', 'approvals', 'events')\nDOCUMENT_TABLES = ('document_versions',)\nCRITERIA_TABLES = ('criteria_versions','criteria_approval_bindings')\nMIGRATIONS={'AF001':(DDL,TABLES),'AF002':(DOCUMENT_DDL,DOCUMENT_TABLES),'AF003':(CRITERIA_DDL,CRITERIA_TABLES),'AF004':(TEXT_DDL,()),'AF005':(GRAPH_DDL,GRAPH_TABLES)}\nUPDATES = {'runs': ('snapshot_json','updated_at'),\n           'jobs': ('state','attempt_no','worker_token','lease_expires_at','heartbeat_at','finished_at','error_json'),\n           'steps': ('state','record_json','output_json','output_sha256'),\n           'graph_state': ('revision','applied_revision','lease_token','lease_expires_at','available_at','attempt_no','error_json','synced_at'),\n           'graph_outbox': ('processed_at',)}\n\n\ndef _structure(connection):\n    connection.exec_driver_sql('SET LOCAL search_path = pg_catalog, public')\n    return {name: [list(row) for row in connection.exec_driver_sql(\n        sql.replace(\"'public'\", \"'agent_framework'\")).all()]\n        for name, sql in _STRUCTURE_QUERIES.items()}\n\n\ndef _ddl_digest(revision):\n    items=list(MIGRATIONS)\n    return sha256(b'\\0'.join(MIGRATIONS[name][0].read_bytes() for name in items[:items.index(revision)+1])).hexdigest()\n\n\ndef _tables(revision):\n    names=list(MIGRATIONS)\n    return tuple(table for name in names[:names.index(revision)+1] for table in MIGRATIONS[name][1])\n\n\ndef check_extension(connection):\n    try:\n        row = connection.exec_driver_sql('SELECT revision, ddl_sha256, structure_json FROM agent_framework.schema_version').one()\n        expected = {revision:_ddl_digest(revision) for revision in MIGRATIONS}\n        if row[0] not in expected or row[1] != expected[row[0]] or row[2] != _structure(connection):\n            raise ValueError()\n    except Exception:\n        raise PersistenceError('FRAMEWORK_SCHEMA_NOT_READY',\n            'Apply and verify the explicit framework extension before starting this profile.') from None\n    return {'revision':row[0],'schema':'agent_framework','public_schema':'M008 unchanged'}\n\n\ndef check_document_extension(connection):\n    result=check_extension(connection)\n    if result['revision'] not in ('AF002','AF003','AF004','AF005'):\n        raise PersistenceError('FRAMEWORK_DOCUMENT_SCHEMA_NOT_READY',\n                               'Apply the explicit AF002 extension before enabling PDF registration.')\n    return result\n\n\ndef check_criteria_extension(connection):\n    result=check_extension(connection)\n    if result['revision'] not in ('AF003','AF004','AF005'):\n        raise PersistenceError('FRAMEWORK_CRITERIA_SCHEMA_NOT_READY','Apply AF003 explicitly before criteria revision/approval commands.')\n    return result\n\n\ndef check_app_permissions(connection):\n    \"\"\"The extension must not turn the app into a schema owner or log editor.\"\"\"\n    forbidden=connection.exec_driver_sql(\"\"\"SELECT\n      has_schema_privilege(current_user,'agent_framework','CREATE') OR\n      has_table_privilege(current_user,'agent_framework.schema_version','INSERT') OR\n      has_table_privilege(current_user,'agent_framework.approvals','UPDATE') OR\n      has_table_privilege(current_user,'agent_framework.events','UPDATE') OR\n      has_table_privilege(current_user,'agent_framework.steps','DELETE') OR\n      has_table_privilege(current_user,'agent_framework.runs','DELETE')\"\"\").scalar_one()\n    revision=connection.exec_driver_sql('SELECT revision FROM agent_framework.schema_version').scalar_one()\n    tables=_tables(revision)\n    for table in tables:\n        if table in DOCUMENT_TABLES+CRITERIA_TABLES+('evidence_contexts',):\n            forbidden=forbidden or connection.execute(text(\"SELECT has_table_privilege(current_user,:table,'UPDATE') OR has_table_privilege(current_user,:table,'DELETE')\"),{'table':'agent_framework.'+table}).scalar_one()\n    required=all(connection.execute(text(\"SELECT has_table_privilege(current_user,:table,'SELECT')\"),\n        {'table':'agent_framework.'+name}).scalar_one() for name in tables)\n    columns=connection.exec_driver_sql(\"SELECT table_name,column_name FROM information_schema.columns WHERE table_schema='agent_framework'\").all()\n    columns_match=all(connection.execute(text(\"SELECT has_column_privilege(current_user,:table,:column,'UPDATE')\"),\n        {'table':'agent_framework.'+name,'column':column}).scalar_one()==(column in UPDATES.get(name,()))\n        for name,column in columns)\n    tables_match=all(connection.execute(text(\"SELECT has_table_privilege(current_user,:table,'INSERT')\"),\n        {'table':'agent_framework.'+name}).scalar_one()==(name!='schema_version') for name in tables)\n    if forbidden or not required or not columns_match or not tables_match:\n        raise PersistenceError('FRAMEWORK_PRIVILEGES_INVALID','Restricted extension permissions are required.')\n\n\ndef migrate(settings, *, target='AF001'):\n    if target not in MIGRATIONS:raise ValueError('Unsupported framework revision')\n    from backend.migrations.configuration import create_migration_engine, validate_migration_connection\n    engine = create_migration_engine(settings)\n    try:\n        with engine.begin() as connection:\n            validate_migration_connection(connection, settings)\n            connection.exec_driver_sql(\"SET LOCAL lock_timeout='2s'\")\n            connection.exec_driver_sql(\"SET LOCAL statement_timeout='60s'\")\n            connection.exec_driver_sql(\"SELECT pg_advisory_xact_lock(hashtextextended(current_database() || ':cc-schema-v1',0))\")\n            if connection.exec_driver_sql('SELECT version_num FROM public.alembic_version').scalars().all() != ['M008']:\n                raise ValueError('M008 must be applied first')\n            validate_schema(connection,app_user=settings.app_user)\n            names=list(MIGRATIONS);current=-1\n            if connection.exec_driver_sql(\"SELECT to_regnamespace('agent_framework')\").scalar_one() is not None:\n                result=check_extension(connection)\n                current=names.index(result['revision'])\n                if current\u003e=names.index(target):return result\n            app = connection.dialect.identifier_preparer.quote(settings.app_user)\n            for revision in names[current+1:names.index(target)+1]:\n                ddl,tables=MIGRATIONS[revision]\n                connection.exec_driver_sql(ddl.read_text(encoding='utf-8'))\n                connection.exec_driver_sql(f'GRANT USAGE ON SCHEMA agent_framework TO {app}')\n                for table in tables:\n                    connection.exec_driver_sql(f'REVOKE ALL ON agent_framework.{table} FROM PUBLIC')\n                    connection.exec_driver_sql(f'GRANT SELECT ON agent_framework.{table} TO {app}')\n                    if table!='schema_version':connection.exec_driver_sql(f'GRANT INSERT ON agent_framework.{table} TO {app}')\n                    if table in UPDATES:\n                        connection.exec_driver_sql(f'GRANT UPDATE ({\",\".join(UPDATES[table])}) ON agent_framework.{table} TO {app}')\n            structure = _structure(connection)\n            digest=_ddl_digest(target)\n            connection.execute(text('INSERT INTO agent_framework.schema_version(revision,ddl_sha256,structure_json) '\n                'VALUES(:revision,:hash,CAST(:structure AS jsonb)) ON CONFLICT(singleton) DO UPDATE '\n                'SET revision=excluded.revision,ddl_sha256=excluded.ddl_sha256,structure_json=excluded.structure_json'),\n                {'revision':target,'hash':digest, 'structure':json.dumps(structure)})\n            return check_extension(connection)\n    finally:\n        engine.dispose()\n","sha256":"442ea863b34136ee786aa5ddbe21248b76e41eb053aca5d67d3fd5de38063ce8"},"backend/agent_framework/qualifier_rules.py":{"text":"\"\"\"A06 allowance rules: settle only what code can settle from a criterion's own qualifier quotes.\n\nSorting is by the source's wording, never by meaning:\n- needs a person: a poster alone cannot settle it, so an exact match still goes to review;\n- format only: every sentence either grants named format differences or only keeps the value,\n  so those differences are removed before comparing and a mismatch is a failure;\n- anything else: wording code does not recognize may still allow another value, so a mismatch\n  goes to review. An unknown sentence never becomes a pass or a failure on its own.\n\"\"\"\nfrom __future__ import annotations\n\nimport re\n\n# A poster alone cannot settle these: a person decides even on an exact match.\n_NEEDS_PERSON = re.compile(r\"예외|제외|금지|다만|별도|증빙|담당자|취지\")\n# A human-added criterion may carry its allowance in the text instead of structured quotes.\n_HUMAN_ALLOWANCE = re.compile(r\"허용|예외|또는|줄바꿈|공백\")\n_FORMAT_WORDS = {\"공백\", \"줄바꿈\", \"쉼표\", \"대소문자\"}\n_LABEL = re.compile(r\"허용\\s*범위\\s*:\")\n_SENTENCE_BREAK = re.compile(r\"[.\\n]\")\n# Only recognized endings grant anything: '허용할 수 없다' or '허용 안됨' must never read as an allowance.\n_GRANTED = r\"(.+?)(?:은|는|을|를|도)?\\s*허용\"\n_GRANT = re.compile(_GRANTED + r\"(?:한다|합니다|함|된다|됩니다|됨|\\s*가능(?:하다|합니다|함)?|할\\s*수\\s*있다)?\")\n_GRANT_AND_MORE = re.compile(_GRANTED + r\"(?:하되|하고|하나|하지만|하며)\\s+(.+)\")\n_ITEM_BREAK = re.compile(r\"[·,/]|(?\u003c=\\S)[와과]\\s|\\s및\\s|\\s(?:또는|혹은)\\s|(?\u003c=\\S)(?:이나|나)\\s\")\n# A sentence that only holds the value as written cannot allow another value.\n_KEEPS_VALUE = re.compile(r\"(?:표기한다|표기해야\\s*한다|유지한다|유지해야\\s*한다|바꾸지\\s*않는다|변경하지\\s*않는다\"\n                          r\"|누락하지\\s*않는다|생략하지\\s*않는다|남긴다|동일해야\\s*한다)$\")\n_MAY_ALLOW_MORE = re.compile(r\"또는|혹은|거나|도\\s*되|달라도|로도|자유|가능|인정|무방|수\\s*있|괜찮\")\n\n\ndef qualifier_text(criterion) -\u003e str:\n    details = criterion.details\n    if details is None:\n        return \"\"\n    quotes = [qualifier.quote for qualifier in details.qualifiers]\n    if not quotes and criterion.human_added and _HUMAN_ALLOWANCE.search(criterion.text):\n        quotes = [criterion.text]\n    return \"\\n\".join(quotes)\n\n\ndef needs_person(qualifier: str) -\u003e bool:\n    return bool(_NEEDS_PERSON.search(qualifier))\n\n\ndef _keeps_value(sentence: str) -\u003e bool:\n    return bool(_KEEPS_VALUE.search(sentence)) and not _MAY_ALLOW_MORE.search(sentence)\n\n\ndef _allowances(qualifier: str) -\u003e tuple[set[str], bool]:\n    \"\"\"The format differences the source positively allows, and whether it may allow anything else.\"\"\"\n    allowed, other = set(), False\n    for sentence in _SENTENCE_BREAK.split(_LABEL.sub(\" \", qualifier)):\n        sentence = sentence.strip()\n        if not sentence:\n            continue\n        more = _GRANT_AND_MORE.fullmatch(sentence)\n        grant = more or _GRANT.fullmatch(sentence)\n        if grant is None:\n            if \"허용\" in sentence:  # A refusal or unknown wording: compare exactly and let a person decide.\n                return set(), True\n            other = other or not _keeps_value(sentence)\n            continue\n        other = other or bool(more and not _keeps_value(more.group(2)))\n        for item in _ITEM_BREAK.split(grant.group(1)):\n            words = re.sub(r\"\\s*차이$\", \"\", item.strip()).split()\n            if words and words[-1].removesuffix(\"의\") in _FORMAT_WORDS:\n                allowed.add(words[-1].removesuffix(\"의\"))\n            elif words:\n                other = True\n    return allowed, other\n\n\ndef format_free(value: str, qualifier: str) -\u003e str:\n    \"\"\"Remove only the differences the source positively allows; never interpret meaning.\"\"\"\n    allowed, _ = _allowances(qualifier)\n    if \"공백\" in allowed:\n        value = re.sub(r\"\\s+\", \"\", value)\n    elif \"줄바꿈\" in allowed:\n        value = re.sub(r\"\\s*\\n\\s*\", \" \", value)\n    if \"쉼표\" in allowed:\n        value = value.replace(\",\", \"\")\n    if \"대소문자\" in allowed:\n        value = value.casefold()\n    return value\n\n\ndef may_reject(qualifier: str) -\u003e bool:\n    \"\"\"A mismatch is a confirmed failure only when the source allows nothing but format differences.\"\"\"\n    allowed, other = _allowances(qualifier)\n    # A line break can split a word, which a line-break-only comparison cannot tell from a wrong value.\n    return bool(allowed) and not other and (\"공백\" in allowed or \"줄바꿈\" not in allowed)\n","sha256":"1aaeb88450ec9e6851c089f7b1a01d8bab6c5eb6cb7a8b2347248ab378d5b99f"},"backend/agent_framework/requirement_text.py":{"text":"\"\"\"Immutable UTF-8 requirement inputs; no normalization or model inference.\"\"\"\nfrom .ports import AdapterFailure\n\nMAX_TEXT_CHARACTERS=60000\n\n\ndef inspect_text(raw):\n    try:\n        if not isinstance(raw,bytes):raise ValueError()\n        text=raw.decode('utf-8')\n        if not text.strip() or text.startswith('\\ufeff'):raise ValueError()\n        if len(text)\u003eMAX_TEXT_CHARACTERS:\n            raise AdapterFailure('REQUIREMENT_TEXT_TOO_LARGE','Requirement text exceeds the character limit.')\n        if any((ord(c)\u003c32 and c not in '\\r\\n\\t') or ord(c)==127 for c in text):raise ValueError()\n    except (ValueError,UnicodeError):\n        raise AdapterFailure('REQUIREMENT_TEXT_INVALID','A nonblank UTF-8 requirement source is required.') from None\n    return 1\n\n\ndef inspect_requirement(raw,media_type,limits=None):\n    if media_type=='text/plain':return inspect_text(raw)\n    if media_type!='application/pdf':raise AdapterFailure('FILE_MEDIA_TYPE_MISMATCH','Unsupported requirement source.')\n    from .files import inspect_document\n    return inspect_document(raw,limits)\n","sha256":"1d4b0a500758729035062ff752c36957c2070f21c652a48cae09d1834f4266cd"},"backend/agent_framework/requirements_presentation.py":{"text":"\"\"\"Project source-validated model paragraphs into the existing review brief DTO.\"\"\"\nfrom backend.app.documents.conditions import render_condition\nfrom backend.app.security.errors import AuthError\n\n\ndef present_requirements(snapshot):\n    draft=snapshot.criteria\n    if draft is None or draft.extraction is None:\n        raise AuthError('REQUIREMENTS_NOT_READY',409)\n    if draft.extraction.policy!='a02-semantic-v4':\n        raise AuthError('REQUIREMENTS_PRESENTATION_NOT_AVAILABLE',409)\n    pending=set(draft.extraction.unresolved_criterion_ids)\n    notes=[];conditions=[];grouped={}\n    for index,item in enumerate(draft.criteria,1):\n        source=item.source\n        if item.criterion_id in pending:\n            notes.append({'criterion_id':item.criterion_id,'page':source.page,'source':source.quote})\n            continue\n        display=item.details.presentation if item.details is not None else None\n        if display is None:raise AuthError('REQUIREMENTS_PRESENTATION_NOT_AVAILABLE',409)\n        label,value=display.label.strip(),display.value.strip()\n        inspection='\\n'.join(dict.fromkeys(q.quote for q in item.details.qualifiers))\n        if len(inspection)\u003e1200:raise AuthError('REQUIREMENTS_PRESENTATION_TOO_LONG',422)\n        entry={'label':label,'requirement':value,'level':'필수' if item.required else '명시 없음',\n            'inspection':inspection,'type':'visual' if item.details.target=='poster_visual' else 'information',\n            'page':source.page,'source':source.quote,'source_kind':'a02_qwen',\n            'source_references':[{'source_id':f'p{source.page}-s{index}','page':source.page,'source':source.quote[:350]}],\n            'criterion_ids':[item.criterion_id]}\n        entry['text']=render_condition(entry)\n        if len(entry['text'])\u003e500:raise AuthError('REQUIREMENTS_PRESENTATION_TOO_LONG',422)\n        # Group only identical model paragraphs with the same target/source.\n        # Keep every underlying criterion and citation (e.g. a complete date\n        # range or width/height chosen together), never distinct venue values.\n        key=(entry['text'],item.details.target,source.block_id,source.quote)\n        if key in grouped:\n            existing=grouped[key]\n            existing['criterion_ids'].append(item.criterion_id)\n            existing['source_references'].extend(entry['source_references'])\n            existing['inspection']='\\n'.join(dict.fromkeys(filter(None,[existing['inspection'],inspection])))\n            if len(existing['inspection'])\u003e1200:raise AuthError('REQUIREMENTS_PRESENTATION_TOO_LONG',422)\n            continue\n        grouped[key]=entry\n        conditions.append(entry)\n    if len(conditions)\u003e100 or len('\\n\\n'.join(c['text'] for c in conditions))\u003e6000:\n        raise AuthError('REQUIREMENTS_PRESENTATION_TOO_LONG',422)\n    return {'conditions':conditions,'pending':notes,'page_count':len(draft.extraction.sources),\n        'warnings':(['확인 중인 항목은 검수 입력에서 분리했습니다.'] if notes else []),\n        'framework':{'run_id':snapshot.context.run_id,'document_version_id':snapshot.context.document_version_id,\n            'policy':draft.extraction.policy,'synthetic':draft.synthetic},'approved':False}\n","sha256":"6f6a5788fa5fdf095c8b8f4e4da47c95be3688732e670de96a490632a9051966"},"backend/agent_framework/runtime.py":{"text":"\"\"\"Development-only, in-memory LangGraph workflow.\n\nAll runs and approvals disappear when this Workflow instance is discarded or the\nprocess exits. This is an integration scaffold, not a durable worker, an identity\nprovider, or evidence that a real model/database was executed. The service that\nadopts it must implement authorization and persistence at its own boundary.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom datetime import datetime, timezone\nimport re\nfrom threading import RLock\nfrom time import perf_counter_ns\nfrom typing import Any, TypeVar, TypedDict\n\nfrom langgraph.graph import END, START, StateGraph\nfrom pydantic import BaseModel\n\nfrom .contracts import (\n    Approval, AssetRef, Context, CriteriaDraft, DocumentRef, EvidenceBundle,\n    ExtractRequest, FrameworkError, InspectionResult, InspectRequest, ReportDraft,\n    ReportRequest, RunSnapshot, StepRecord, StepTimeline, ValidatedResult, ValidateRequest,\n)\nfrom .ports import AdapterFailure, Agents\nfrom .human_review import validate_human_reviews\nfrom .invocation import ROLE_CONTRACTS, InvocationFailure, invoke_role\nfrom .validation import (\n    validate_draft,\n)\n\nT = TypeVar('T', bound=BaseModel)\n_EXCEPTION_BLOCKERS = frozenset({\n    'missing_observation', 'missing_expected_value', 'missing_requirement_evidence', 'missing_citation',\n    'uncertain_observation', 'unsupported_criterion', 'context_incomplete',\n    'numeric_observation_invalid', 'verdict_conflict',\n})\n\n\ndef _boundary(contract: type[T], value: Any) -\u003e T:\n    \"\"\"Revalidate even model_construct/model_copy values; do not trust frozen models.\"\"\"\n    try:\n        if isinstance(value, BaseModel):\n            if not isinstance(value, contract):\n                raise ValueError('unexpected contract type')\n            value = value.model_dump(mode='python')\n        return contract.model_validate(value).model_copy(deep=True)\n    except (ValueError, TypeError) as exc:\n        raise ValueError(f'invalid {contract.__name__} contract') from exc\n\n\ndef _copy(value: T) -\u003e T:\n    return value.model_copy(deep=True)\n\n\nclass _GraphState(TypedDict):\n    run_id: str\n\n\n@dataclass\nclass _Run:\n    document: DocumentRef\n    asset: AssetRef | None\n    snapshot: RunSnapshot\n    lock: Any = field(default_factory=RLock)\n    # Commands keep lock for the entire graph; readers never wait on adapters.\n    view_lock: Any = field(default_factory=RLock)\n    child_run_id: str | None = None\n\n\nclass Workflow:\n    \"\"\"Synchronous adapters behind replaceable contracts and real LangGraph nodes.\n\n    Different runs may execute concurrently. A per-run lock serializes approvals;\n    repeated or stale commands raise ValueError and leave existing runs unchanged.\n    Adapter/output failures close the affected run; no adapter is auto-retried.\n    \"\"\"\n\n    persistence = 'memory_only'\n\n    def __init__(self, agents: Agents, profile: str = 'development'):\n        if profile not in ('development', 'test'):\n            raise ValueError('Workflow supports development/test only; memory is not production persistence')\n        self.agents = agents\n        self.profile = profile\n        self._runs: dict[str, _Run] = {}\n        self._registry_lock = RLock()\n        extraction = StateGraph(_GraphState)\n        extraction.add_node('A02', self._extract)\n        extraction.add_edge(START, 'A02')\n        extraction.add_edge('A02', END)\n        self._extraction_graph = extraction.compile()\n        review = StateGraph(_GraphState)\n        nodes = [('A04_A05', self._inspect),\n                 ('A06', self._validate), ('A07', self._report)]\n        for name, fn in nodes:\n            review.add_node(name, fn)\n        for left, right in zip([START] + [name for name, _ in nodes],\n                               [name for name, _ in nodes] + [END]):\n            review.add_edge(left, right)\n        self._review_graph = review.compile()\n\n    def _record(self, run_id: str) -\u003e _Run:\n        with self._registry_lock:\n            record = self._runs.get(run_id)\n        if record is None:\n            raise KeyError('unknown run; this runtime has no persistent storage')\n        return record\n\n    def _save(self, record: _Run, **updates: Any) -\u003e None:\n        with record.view_lock:\n            record.snapshot = _boundary(RunSnapshot, record.snapshot.model_copy(update=updates))\n\n    @staticmethod\n    def _step_error(exc: Exception) -\u003e FrameworkError:\n        # AdapterFailure is an explicitly safe error channel, but execution\n        # telemetry only needs a bounded code; never echo arbitrary messages.\n        code = exc.code if isinstance(exc, AdapterFailure) else 'ADAPTER_FAILED'\n        if not isinstance(code, str) or re.fullmatch(r'[A-Za-z][A-Za-z0-9_]{0,95}', code) is None:\n            code = 'ADAPTER_FAILED'\n        unknown = isinstance(exc, AdapterFailure) and exc.outcome_unknown is True\n        return FrameworkError(code=code,\n            message='The role did not produce an accepted result. Inspect the adapter in your development environment.',\n            retryable=isinstance(exc, AdapterFailure) and exc.retryable is True,\n            outcome_unknown=unknown)\n\n    def _run_stage(self, record: _Run, role: str, field_name: str, request_factory,\n                   **final_updates: Any) -\u003e None:\n        \"\"\"Record a whole role boundary, including request/result validation.\n\n        Only the command owner writes. Result, terminal timing, and run state\n        become visible atomically. Approval wait time is not adapter duration.\n        \"\"\"\n        started = datetime.now(timezone.utc)\n        clock = perf_counter_ns()\n        step = StepRecord(ordinal=len(record.snapshot.step_records) + 1, role=role,\n                          status='running', recorded_at=started, started_at=started,\n                          synthetic=record.snapshot.synthetic)\n        self._save(record, step_records=record.snapshot.step_records + (step,))\n        try:\n            request = request_factory()\n            adapter = getattr(self.agents, ROLE_CONTRACTS[role][0])\n            result = invoke_role(role, adapter, request)\n            # Build a prospective snapshot before changing state. A malformed\n            # output must never leave a completed marker or partially stored result.\n            synthetic = record.snapshot.synthetic or result.synthetic\n            result = _boundary(type(result), result.model_copy(update={'synthetic': synthetic}))\n            updates = {field_name: result, 'synthetic': synthetic,\n                       'stages': record.snapshot.stages + (role,), **final_updates}\n            if role == 'A06':\n                updates['machine_verdict'] = result.verdict\n            with record.view_lock:\n                _boundary(RunSnapshot, record.snapshot.model_copy(update=updates))\n                terminal = step.model_copy(update={'status': 'completed', 'synthetic': synthetic,\n                    'finished_at': max(started, datetime.now(timezone.utc)),\n                    'duration_ms': max(0, perf_counter_ns() - clock) / 1_000_000})\n                self._save(record, **updates,\n                           step_records=record.snapshot.step_records[:-1] + (terminal,))\n        except Exception as exc:\n            error = self._step_error(exc)\n            terminal = step.model_copy(update={\n                'status': 'outcome_unknown' if error.outcome_unknown else 'failed',\n                'finished_at': max(started, datetime.now(timezone.utc)),\n                'duration_ms': max(0, perf_counter_ns() - clock) / 1_000_000,\n                'error': error})\n            with record.view_lock:\n                self._save(record, step_records=record.snapshot.step_records[:-1] + (terminal,))\n                self._failed(record, exc)\n            raise\n\n    def _failed(self, record: _Run, exc: Exception) -\u003e RunSnapshot:\n        if isinstance(exc, InvocationFailure):\n            # Keep the public workflow failure category stable while standalone\n            # role callers receive the more specific shared boundary code.\n            error = FrameworkError(code='contract_violation',\n                message='The stage failed. Inspect the adapter contract before an explicit new run.')\n        elif isinstance(exc, AdapterFailure):\n            error = self._step_error(exc)\n        else:\n            # Do not include arbitrary provider errors or invalid payloads in output.\n            error = FrameworkError(code='contract_violation' if isinstance(exc, ValueError) else 'adapter_failed',\n                                   message='The stage failed. Inspect the adapter contract before an explicit new run.')\n        self._save(record, execution_status='outcome_unknown' if error.outcome_unknown else 'failed', error=error)\n        return _copy(record.snapshot)\n\n    def start(self, context: Context, document: DocumentRef, asset: AssetRef | None = None, *, defer=False) -\u003e RunSnapshot:\n        context = _boundary(Context, context)\n        document = _boundary(DocumentRef, document)\n        asset = _boundary(AssetRef, asset) if asset is not None else None\n        if context.parent_run_id is not None:\n            raise ValueError('use rereview to create a child run')\n        self._input_scope(context, document, asset)\n        record = _Run(document, asset, RunSnapshot(context=context, profile=self.profile,\n            synthetic=False, execution_status='queued' if defer else 'extracting', stages=('A01',)))\n        # Reserve the run before calling an adapter. Readers may observe its\n        # explicit extracting state, while competing commands remain serialized.\n        with record.lock:\n            with self._registry_lock:\n                if context.run_id in self._runs:\n                    raise ValueError('run_id already exists')\n                self._runs[context.run_id] = record\n            if defer:\n                return _copy(record.snapshot)\n            try:\n                self._extraction_graph.invoke({'run_id': context.run_id}, {'recursion_limit': 8})\n            except Exception as exc:\n                return self._failed(record, exc)\n            return _copy(record.snapshot)\n\n    @staticmethod\n    def _input_scope(context: Context, document: DocumentRef, asset: AssetRef | None) -\u003e None:\n        if context.document_version_id != document.document_version_id:\n            raise ValueError('document version differs from context')\n        if context.asset_version_id != (asset.asset_version_id if asset else None):\n            raise ValueError('asset version differs from context')\n\n    def get(self, run_id: str) -\u003e RunSnapshot:\n        record = self._record(run_id)\n        with record.view_lock:\n            return _copy(record.snapshot)\n\n    def get_steps(self, run_id: str) -\u003e StepTimeline:\n        record = self._record(run_id)\n        with record.view_lock:\n            state = record.snapshot\n            return _copy(StepTimeline(context=state.context, profile=state.profile,\n                                     execution_status=state.execution_status, records=state.step_records))\n\n    def restore(self, snapshot: RunSnapshot, document: DocumentRef, asset: AssetRef | None,\n                *, child_run_id: str | None = None) -\u003e None:\n        \"\"\"Load a trusted durable snapshot without invoking any adapter.\n\n        The caller owns DB authorization/transactions. This method only enforces\n        contract isolation and fixed input scope; it is not an import API.\n        \"\"\"\n        snapshot = _boundary(RunSnapshot, snapshot)\n        document = _boundary(DocumentRef, document)\n        asset = _boundary(AssetRef, asset) if asset is not None else None\n        self._input_scope(snapshot.context, document, asset)\n        if snapshot.criteria is not None:\n            validate_draft(snapshot.context, document, snapshot.criteria)\n        with self._registry_lock:\n            if snapshot.context.run_id in self._runs:\n                raise ValueError('run_id already exists')\n            self._runs[snapshot.context.run_id] = _Run(document, asset, snapshot, child_run_id=child_run_id)\n\n    def approve(self, run_id: str, approval: Approval, *, defer=False) -\u003e RunSnapshot:\n        approval = _boundary(Approval, approval)\n        record = self._record(run_id)\n        with record.lock:\n            state = record.snapshot\n            if approval.context != state.context or approval.actor_id != state.context.actor_id:\n                raise ValueError('approval actor/context does not match the exact run snapshot')\n            if any(item.decision == approval.decision for item in state.approvals):\n                raise ValueError('approval already recorded')\n            decision = approval.decision\n            if approval.approved_criteria_version_id is not None:\n                raise ValueError('use the immutable criteria review approval endpoint')\n            if decision == 'approve_criteria':\n                if record.asset is None:\n                    raise ValueError('PDF-only criteria supplementation and approval are not enabled yet')\n                if state.execution_status != 'waiting_criteria' or state.criteria is None:\n                    raise ValueError('criteria approval is not available')\n                from .context import freeze_approved_context\n                evidence=freeze_approved_context(state.context,state.criteria.criteria,synthetic=state.synthetic)\n                self._save(record, approvals=state.approvals + (approval,), evidence=evidence, execution_status='queued' if defer else 'reviewing')\n                if defer:\n                    return _copy(record.snapshot)\n                try:\n                    self._review_graph.invoke({'run_id': run_id}, {'recursion_limit': 12})\n                except Exception as exc:\n                    return self._failed(record, exc)\n            else:\n                if state.execution_status != 'waiting_review' or state.validated is None or state.report is None:\n                    raise ValueError('review approval is not available')\n                validate_human_reviews(state,approval)\n                if decision == 'approve_changes':\n                    self._save(record, execution_status='waiting_revision', human_decision='changes_approved',\n                               approvals=state.approvals + (approval,))\n                elif decision == 'approve_final':\n                    self._save(record, execution_status='completed', human_decision='final_approved',\n                               approvals=state.approvals + (approval,))\n                elif decision == 'approve_exception':\n                    self._exception_scope(state, approval)\n                    self._save(record, execution_status='completed', human_decision='exception_approved',\n                               approvals=state.approvals + (approval,))\n            return _copy(record.snapshot)\n\n    @staticmethod\n    def _exception_scope(state: RunSnapshot, approval: Approval) -\u003e None:\n        if state.criteria is None or state.validated is None or state.evidence is None:\n            raise ValueError('validated evidence is required for an exception')\n        if state.evidence.status != 'complete':\n            raise ValueError('incomplete context cannot be approved as an exception')\n        if any(_EXCEPTION_BLOCKERS.intersection(item.issues) for item in state.validated.items):\n            raise ValueError('unknown or unsupported evidence cannot be approved as an exception')\n        # Custom A06 adapters cannot silently turn new uncertainty codes into an\n        # exception path. New eligible issue codes require a shared policy change.\n        if any(item.verdict == 'review' or set(item.issues) - {'value_mismatch'}\n               for item in state.validated.items):\n            raise ValueError('unknown or unsupported evidence cannot be approved as an exception')\n        ids = set(approval.criterion_ids)\n        criteria = {item.criterion_id: item for item in state.criteria.criteria}\n        if len(ids) != len(approval.criterion_ids) or not ids or ids - criteria.keys():\n            raise ValueError('exception targets must be unique existing criteria')\n        required = {item.criterion_id for item in state.validated.items\n                    if criteria[item.criterion_id].required and item.verdict != 'pass'}\n        if not required or not required.issubset(ids):\n            raise ValueError('exception must cover every non-pass required criterion')\n\n    def rereview(self, parent_run_id: str, new_context: Context, asset: AssetRef) -\u003e RunSnapshot:\n        new_context = _boundary(Context, new_context)\n        asset = _boundary(AssetRef, asset)\n        parent = self._record(parent_run_id)\n        with parent.lock:\n            old = parent.snapshot\n            if old.execution_status != 'waiting_revision' or old.human_decision != 'changes_approved':\n                raise ValueError('an approved change request is required before rereview')\n            if parent.child_run_id is not None:\n                raise ValueError('this change request already has a child run')\n            if (new_context.parent_run_id != parent_run_id or new_context.run_id == parent_run_id\n                    or new_context.project_id != old.context.project_id\n                    or new_context.document_version_id != old.context.document_version_id\n                    or new_context.criteria_version_id != old.context.criteria_version_id\n                    or asset.asset_version_id == parent.asset.asset_version_id):\n                raise ValueError('rereview requires the same project/document/criteria and a new run/asset version')\n            self._input_scope(new_context, parent.document, asset)\n            if old.criteria is None:\n                raise ValueError('parent has no reusable criteria draft')\n            draft = _boundary(CriteriaDraft, old.criteria.model_copy(update={'context': new_context}))\n            validate_draft(new_context, parent.document, draft)\n            child = _Run(_copy(parent.document), asset, RunSnapshot(context=new_context, profile=self.profile,\n                synthetic=old.synthetic, execution_status='waiting_criteria', criteria=draft,\n                baseline=old.baseline,\n                stages=('A08', 'A01', 'A02_draft_reused'),\n                step_records=(StepRecord(ordinal=1, role='A02', status='reused',\n                    recorded_at=datetime.now(timezone.utc), source_run_id=parent_run_id,\n                    synthetic=old.synthetic),)))\n            with self._registry_lock:\n                if new_context.run_id in self._runs:\n                    raise ValueError('run_id already exists')\n                self._runs[new_context.run_id] = child\n                parent.child_run_id = new_context.run_id\n            return _copy(child.snapshot)\n\n    def _extract(self, state: _GraphState) -\u003e dict:\n        record = self._record(state['run_id'])\n        self._run_stage(record, 'A02', 'criteria', lambda: ExtractRequest(\n            context=_copy(record.snapshot.context), document=_copy(record.document),\n            synthetic=record.snapshot.synthetic), execution_status='waiting_criteria')\n        return {}\n\n    def _inspect_request(self, record: _Run) -\u003e InspectRequest:\n        return InspectRequest(context=_copy(record.snapshot.context), criteria=_copy(record.snapshot.criteria).criteria,\n                              synthetic=record.snapshot.synthetic,\n                              asset=_copy(record.asset), evidence=_copy(record.snapshot.evidence))\n\n    def _inspect(self, state: _GraphState) -\u003e dict:\n        record = self._record(state['run_id'])\n        self._run_stage(record, 'A04_A05', 'inspection', lambda: self._inspect_request(record))\n        return {}\n\n    def _validate(self, state: _GraphState) -\u003e dict:\n        record = self._record(state['run_id'])\n        self._run_stage(record, 'A06', 'validated', lambda: ValidateRequest(\n            **self._inspect_request(record).model_dump(), inspection=_copy(record.snapshot.inspection)))\n        return {}\n\n    def _report(self, state: _GraphState) -\u003e dict:\n        record = self._record(state['run_id'])\n        self._run_stage(record, 'A07', 'report', lambda: ReportRequest(\n            context=_copy(record.snapshot.context), validated=_copy(record.snapshot.validated),\n            synthetic=record.snapshot.synthetic, evidence=_copy(record.snapshot.evidence)),\n            execution_status='waiting_review')\n        return {}\n","sha256":"8293748e651f8371c9901690e3d82ee2a3ddfa46db702e6fdf0c44e938a48a9f"},"backend/agent_framework/validation.py":{"text":"\"\"\"A06 reference policy and boundary checks; these do not establish model accuracy.\"\"\"\nfrom decimal import Decimal, InvalidOperation\nfrom hashlib import sha256\nimport re\n\nfrom .contracts import (Context, CriteriaDraft, DocumentRef, EvidenceBundle,\n                        InspectRequest, InspectionResult, ReportDraft, ReportRequest,\n                        ValidateRequest, ValidatedItem, ValidatedResult)\nfrom .qualifier_rules import format_free, may_reject, needs_person, qualifier_text\n\n\ndef ensure_context(expected: Context, result) -\u003e None:\n    if result.context != expected:\n        raise ValueError(\"CONTEXT_MISMATCH: project/run/version snapshot changed\")\n\n\ndef _unique(values, label):\n    values = tuple(values)\n    if len(set(values)) != len(values):\n        raise ValueError(f\"DUPLICATE_{label}\")\n\n\ndef _criteria(context, criteria):\n    _unique((c.criterion_id for c in criteria), \"CRITERION\")\n    for criterion in criteria:\n        source = criterion.source\n        if source.document_version_id != context.document_version_id:\n            raise ValueError(\"CRITERION_DOCUMENT_MISMATCH\")\n        if sha256(source.quote.encode(\"utf-8\")).hexdigest() != source.source_hash:\n            raise ValueError(\"SOURCE_HASH_MISMATCH\")\n        if criterion.details is not None:\n            details=criterion.details\n            for reference in details.qualifiers+((details.expected_source,) if details.expected_source is not None else ()):\n                if (reference.document_version_id!=context.document_version_id or reference.page!=source.page\n                        or reference.block_id!=source.block_id or reference.quote not in source.quote\n                        or not reference.quote.strip() or sha256(reference.quote.encode()).hexdigest()!=reference.source_hash):\n                    raise ValueError('DETAILS_SOURCE_MISMATCH')\n            if (details.expected_source is not None and details.expected_source.quote!=criterion.expected\n                    and details.normalized_expected!=criterion.expected):\n                raise ValueError('DETAILS_EXPECTED_MISMATCH')\n            if criterion.expected and not criterion.human_added and details.expected_source is None:\n                raise ValueError('DETAILS_EXPECTED_SOURCE_MISSING')\n            if details.normalized_expected is not None:\n                from .a02_semantic import verify_normalized_date\n                from .ports import AdapterFailure\n                try:verify_normalized_date(details.expected_source.quote if details.expected_source is not None else criterion.expected,\n                    details.normalized_expected,details.field,source.quote)\n                except AdapterFailure:raise ValueError('DETAILS_NORMALIZED_VALUE_INVALID') from None\n        value=criterion.value_source\n        if value is not None:\n            if not criterion.human_added or not value.reference.strip() or not value.quote.strip():\n                raise ValueError('VALUE_SOURCE_INVALID')\n            if sha256(value.quote.encode()).hexdigest()!=value.quote_sha256:\n                raise ValueError('VALUE_SOURCE_HASH_MISMATCH')\n            if criterion.expected and criterion.expected not in value.quote:\n                raise ValueError('VALUE_SOURCE_EXPECTED_UNGROUNDED')\n            if criterion.unit is not None and (not criterion.unit.strip() or criterion.unit not in value.quote):\n                raise ValueError('VALUE_SOURCE_UNIT_UNGROUNDED')\n\n\ndef validate_draft(context: Context, document: DocumentRef, draft: CriteriaDraft) -\u003e None:\n    ensure_context(context, draft)\n    if document.document_version_id != context.document_version_id:\n        raise ValueError(\"DOCUMENT_VERSION_MISMATCH\")\n    _criteria(context, draft.criteria)\n    if any(c.source.page \u003e document.page_count for c in draft.criteria):\n        raise ValueError(\"SOURCE_PAGE_OUT_OF_RANGE\")\n    if draft.extraction is not None:\n        from .a02 import validate_trace\n        validate_trace(document,draft)\n\n\ndef validate_evidence_envelope(context: Context, bundle: EvidenceBundle) -\u003e None:\n    \"\"\"Validate self-contained provenance without claiming source authenticity.\n\n    Historical context may cite an older document in the same project. Current\n    requirements and approved exceptions must reference this document, and an\n    exception must also apply to this asset version. This cannot prove actual\n    permission, approval validity, database freshness or source-file contents.\n    \"\"\"\n    ensure_context(context, bundle)\n    _unique((e.evidence_id for e in bundle.evidence), \"EVIDENCE
