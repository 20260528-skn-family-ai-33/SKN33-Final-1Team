Verdict | None = None\n\n    @field_validator(\"input\")\n    @classmethod\n    def portable_relative_path(cls, value):\n        if (\"\\\\\" in value or PurePosixPath(value).is_absolute()\n                or PureWindowsPath(value).drive or PureWindowsPath(value).root):\n            raise ValueError(\"fixture paths must be relative and use forward slashes\")\n        return value\n\n    @model_validator(mode=\"after\")\n    def one_expectation(self):\n        if self.expected_error is not None and self.expected_verdict is not None:\n            raise ValueError(\"choose an error or verdict expectation\")\n        return self\n\n\nclass RoleCheckSuite(Contract):\n    role: RoleId\n    cases: tuple[RoleCheckCase, ...] = Field(min_length=1, max_length=100)\n\n    @model_validator(mode=\"after\")\n    def consistent_cases(self):\n        if len({case.id for case in self.cases}) != len(self.cases):\n            raise ValueError(\"case IDs must be unique\")\n        if self.role not in {\"A06\", \"A07\"} and any(case.expected_verdict for case in self.cases):\n            raise ValueError(\"aggregate verdict expectations are available only for A06 and A07\")\n        return self\n\n\nclass CheckSuiteError(ValueError):\n    \"\"\"Invalid suite declarations, never an adapter execution failure.\"\"\"\n\n\n@dataclass(frozen=True)\nclass PreparedCase:\n    spec: RoleCheckCase\n    request: BaseModel\n    path: Path\n    request_sha256: str\n\n\n@dataclass(frozen=True)\nclass PreparedSuite:\n    suite: RoleCheckSuite\n    cases: tuple[PreparedCase, ...]\n    path: Path\n\n\ndef _unique_object(pairs):\n    result = {}\n    for key, value in pairs:\n        if key in result:\n            raise ValueError(\"duplicate JSON key\")\n        result[key] = value\n    return result\n\n\ndef _invalid_constant(_value):\n    raise ValueError(\"nonstandard JSON constant\")\n\n\ndef _read_json(path):\n    raw = path.read_bytes()\n    value = json.loads(raw.decode(\"utf-8-sig\"), object_pairs_hook=_unique_object,\n                       parse_constant=_invalid_constant)\n    return value, sha256(raw).hexdigest()\n\n\ndef load_suite(path: str | Path, role: str) -\u003e PreparedSuite:\n    \"\"\"Preflight every request schema before any configured code is loaded.\n\nExpected errors describe invocation/boundary errors, not malformed JSON or\nmissing files. Relative fixture paths resolve from the suite's own directory.\n\"\"\"\n    path = Path(path).resolve()\n    try:\n        value, _digest = _read_json(path)\n        suite = RoleCheckSuite.model_validate(value)\n        if suite.role != role:\n            raise ValueError(\"suite and selected role differ\")\n    except UnicodeError:\n        raise\n    except (ValueError, TypeError):\n        raise CheckSuiteError(\"Invalid role check suite\") from None\n    request_type = ROLE_CONTRACTS[role][2]\n    prepared = []\n    for case in suite.cases:\n        fixture = (path.parent / case.input).resolve()\n        try:\n            value, digest = _read_json(fixture)\n            request = request_type.model_validate(value)\n        except UnicodeError:\n            raise\n        except (ValueError, TypeError):\n            raise InvocationFailure(\"CONTRACT_INVALID\", \"A suite fixture does not match the role request contract.\") from None\n        prepared.append(PreparedCase(case, request, fixture, digest))\n    return PreparedSuite(suite, tuple(prepared), path)\n\n\ndef run_checks(prepared: PreparedSuite, configuration: TeamConfiguration) -\u003e dict:\n    \"\"\"Initialize one role once, then check each fixture through invoke_role.\n\nOnly summaries/hashes are returned, never raw prompts, evidence or provider\nexception messages. Contract acceptance does not establish semantic accuracy.\n\"\"\"\n    role = prepared.suite.role\n    adapter = build_role(configuration, role)\n    binding = configuration.roles[role]\n    results = []\n    stopped = False\n    outputs_checked = 0\n    for case in prepared.cases:\n        item = {\"id\": case.spec.id, \"request_sha256\": case.request_sha256}\n        if stopped:\n            results.append({**item, \"status\": \"skipped\", \"reason\": \"PRIOR_OUTCOME_UNKNOWN\"})\n            continue\n        try:\n            output = invoke_role(role, adapter, case.request,\n                                 require_synthetic=binding.kind == \"synthetic\")\n        except Exception as exc:\n            structured = isinstance(exc, AdapterFailure)\n            code = exc.code if structured and isinstance(exc.code, str) else \"ADAPTER_FAILED\"\n            if not re.fullmatch(r\"[A-Za-z][A-Za-z0-9_]{1,80}\", code):\n                code = \"ADAPTER_FAILED\"\n                structured = False\n            unknown = bool(exc.outcome_unknown) if isinstance(exc, AdapterFailure) else False\n            matched = structured and not unknown and case.spec.expected_error == code\n            item.update(status=\"passed\" if matched else \"failed\",\n                        outcome=\"expected_rejection\" if matched else \"error\",\n                        error={\"code\": code,\n                               \"retryable\": bool(exc.retryable) if isinstance(exc, AdapterFailure) else False,\n                               \"outcome_unknown\": unknown})\n            stopped = unknown\n        else:\n            outputs_checked += 1\n            verdict = getattr(output, \"verdict\", None)\n            matched = (case.spec.expected_error is None\n                       and (case.spec.expected_verdict is None or case.spec.expected_verdict == verdict))\n            serialized = json.dumps(output.model_dump(mode=\"json\"), sort_keys=True,\n                                    ensure_ascii=False, allow_nan=False).encode(\"utf-8\")\n            item.update(status=\"passed\" if matched else \"failed\", outcome=\"accepted_output\",\n                        synthetic=output.synthetic, output_sha256=sha256(serialized).hexdigest())\n            if verdict is not None:\n                item[\"machine_verdict\"] = verdict\n            if not matched:\n                item[\"reason\"] = \"EXPECTED_ERROR_NOT_RAISED\" if case.spec.expected_error else \"VERDICT_MISMATCH\"\n        results.append(item)\n    counts = {status: sum(item[\"status\"] == status for item in results)\n              for status in (\"passed\", \"failed\", \"skipped\")}\n    return {\"contract_version\": CONTRACT_VERSION, \"check\": \"role_contract_suite\", \"role\": role,\n            \"profile\": configuration.profile, \"adapter_kind\": binding.kind,\n            \"passed\": counts[\"passed\"] == len(results), \"stopped_on_outcome_unknown\": stopped,\n            \"summary\": {\"total\": len(results), **counts, \"contract_outputs_checked\": outputs_checked},\n            \"cases\": results, \"connection_verified\": False, \"production_ready\": False,\n            \"notice\": \"Fixture contract checks only; not model accuracy, source authenticity, database connectivity or authenticated approval verification.\"}\n","sha256":"1846a8c6b986f872e7a6072a28eb7b4b8413bde325fa91d1f2c144fd82c430dc"},"backend/agent_framework/cli.py":{"text":"\"\"\"Explicit development commands; never starts product services or migrations.\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport importlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport sys\nimport tempfile\n\nfrom pydantic import ValidationError\nfrom backend.app.config import ConfigurationError\nfrom backend.app.persistence.database import PersistenceError\n\nfrom .contracts import (\n    CONTRACT_TYPES, Approval, FrameworkError,\n)\nfrom .ports import AdapterFailure, Agents\nfrom .invocation import ROLE_CONTRACTS, InvocationFailure, invoke_role\nfrom .checks import CheckSuiteError\nfrom .flow_checks import FlowCaseError\n\n\nclass _ConfigError(ValueError):\n    pass\n\n\ndef _load_configuration(path):\n    from .composition import load_config\n    try:\n        return load_config(path)\n    except (ValueError, TypeError) as exc:\n        raise _ConfigError(\"Invalid team configuration\") from exc\n\n\ndef _emit(payload, output=None):\n    # stdout is a JSON transport and may be a legacy-codepage Windows pipe.\n    # Unicode escapes preserve all values; explicit files remain readable UTF-8.\n    rendered = json.dumps(payload, ensure_ascii=not bool(output), indent=2, allow_nan=False) + \"\\n\"\n    if output:\n        # An explicit output path authorizes this file only. Missing parent\n        # directories are reported instead of silently creating another tree.\n        path = Path(output)\n        temporary = None\n        try:\n            with tempfile.NamedTemporaryFile(mode=\"w\", encoding=\"utf-8\", dir=path.parent,\n                    prefix=\".framework-\", suffix=\".tmp\", delete=False) as stream:\n                temporary = Path(stream.name)\n                stream.write(rendered)\n            os.replace(temporary, path)\n        finally:\n            if temporary is not None:\n                temporary.unlink(missing_ok=True)\n    else:\n        sys.stdout.write(rendered)\n\n\ndef _error(code, message, *, retryable=False, outcome_unknown=False):\n    error = FrameworkError(code=code, message=message, retryable=retryable, outcome_unknown=outcome_unknown)\n    _emit({\"error\": error.model_dump(mode=\"json\")})\n\n\ndef _factory(reference):\n    if not re.fullmatch(r\"[A-Za-z_]\\w*(?:\\.[A-Za-z_]\\w*)*:[A-Za-z_]\\w*\", reference):\n        raise AdapterFailure(\"INVALID_FACTORY\", \"Use an importable module:callable factory.\")\n    module_name, callable_name = reference.split(\":\", 1)\n    # Loading code is permitted only by this explicit CLI option. No factory\n    # name is accepted from the untrusted role request JSON.\n    factory = getattr(importlib.import_module(module_name), callable_name, None)\n    if not callable(factory):\n        raise AdapterFailure(\"INVALID_FACTORY\", \"The named factory is not callable.\")\n    agents = factory()\n    if not isinstance(agents, Agents):\n        raise AdapterFailure(\"INVALID_FACTORY\", \"The factory must return an Agents instance.\")\n    return agents\n\n\ndef _role(args):\n    if not args.synthetic and not args.factory and not args.config:\n        _error(\"ADAPTER_NOT_CONFIGURED\", \"Choose --synthetic, --config, or an explicit --factory module:callable.\")\n        return 2\n    if args.scenario and not args.synthetic:\n        _error(\"INVALID_ARGUMENT\", \"--scenario is only available with --synthetic.\")\n        return 2\n    port_name, _method_name, request_type, _result_type = ROLE_CONTRACTS[args.role]\n    request = request_type.model_validate_json(Path(args.input).read_text(encoding=\"utf-8\"))\n    require_synthetic = args.synthetic\n    if args.synthetic:\n        from .adapters.synthetic import make_agents\n\n        agents = make_agents(scenario=args.scenario or \"pass\")\n        adapter = getattr(agents, port_name)\n        print(\"SYNTHETIC DEVELOPMENT FIXTURE: no real model, PostgreSQL, Neo4j, or MCP call.\", file=sys.stderr)\n    elif args.config:\n        from .composition import build_role\n        configuration = _load_configuration(args.config)\n        adapter = build_role(configuration, args.role)\n        require_synthetic = configuration.roles[args.role].kind == \"synthetic\"\n        print(\"EXPLICIT ROLE CONFIGURATION: initializing the selected role only.\", file=sys.stderr)\n    else:\n        print(\"EXPLICIT DEVELOPER FACTORY: loading trusted local adapter code.\", file=sys.stderr)\n        agents = _factory(args.factory)\n        adapter = getattr(agents, port_name)\n    result = invoke_role(args.role, adapter, request, require_synthetic=require_synthetic)\n    if result.synthetic:\n        print(\"SYNTHETIC INPUT/OUTPUT: fixture provenance is preserved through the shared boundary.\", file=sys.stderr)\n    _emit(result.model_dump(mode=\"json\"), args.output)\n    return 0\n\n\ndef _demo(args):\n    from .adapters.synthetic import make_agents, sample_inputs\n    from .runtime import Workflow\n\n    print(\"SYNTHETIC DEVELOPMENT DEMO: approvals are scripted test inputs; storage is in memory only.\", file=sys.stderr)\n    workflow = Workflow(make_agents(scenario=\"pass\"), profile=\"development\")\n    context, document, asset = sample_inputs()\n    steps = []\n\n    def record(action, snapshot):\n        steps.append({\"action\": action, \"run_id\": snapshot.context.run_id,\n            \"execution_status\": snapshot.execution_status, \"machine_verdict\": snapshot.machine_verdict,\n            \"human_decision\": snapshot.human_decision, \"synthetic\": snapshot.synthetic})\n        if snapshot.error:\n            raise AdapterFailure(snapshot.error.code, snapshot.error.message,\n                retryable=snapshot.error.retryable, outcome_unknown=snapshot.error.outcome_unknown)\n        return snapshot\n\n    record(\"start\", workflow.start(context, document, asset))\n    record(\"approve_criteria\", workflow.approve(context.run_id,\n        Approval(context=context, actor_id=context.actor_id, decision=\"approve_criteria\")))\n    record(\"approve_changes\", workflow.approve(context.run_id,\n        Approval(context=context, actor_id=context.actor_id, decision=\"approve_changes\",\n                 reason=\"합성 개발 예제: 수정본 전체 재검수 흐름을 확인합니다.\")))\n    revised_context, _document, revised_asset = sample_inputs(\n        run_id=\"demo-run-2\", asset_version_id=\"poster-v2\", parent_run_id=context.run_id)\n    record(\"rereview\", workflow.rereview(context.run_id, revised_context, revised_asset))\n    record(\"approve_revised_criteria\", workflow.approve(revised_context.run_id,\n        Approval(context=revised_context, actor_id=revised_context.actor_id, decision=\"approve_criteria\")))\n    record(\"approve_final\", workflow.approve(revised_context.run_id,\n        Approval(context=revised_context, actor_id=revised_context.actor_id, decision=\"approve_final\")))\n    _emit({\"profile\": \"development\", \"synthetic\": True, \"storage\": \"memory\",\n        \"notice\": \"Scripted fixture approvals, not authenticated human decisions or real model results.\",\n        \"steps\": steps, \"runs\": [workflow.get(context.run_id).model_dump(mode=\"json\"),\n                                  workflow.get(revised_context.run_id).model_dump(mode=\"json\")]}, args.output)\n    return 0\n\n\ndef _schemas(args):\n    contracts = CONTRACT_TYPES\n    if args.include_configuration:\n        from .composition import RoleBinding, TeamConfiguration\n        contracts = (*contracts, RoleBinding, TeamConfiguration)\n    if args.include_checks:\n        from .checks import RoleCheckCase, RoleCheckSuite\n        from .flow_checks import FlowCheckCase\n        contracts = (*contracts, RoleCheckCase, RoleCheckSuite, FlowCheckCase)\n    schemas = {contract.__name__: contract.model_json_schema() for contract in contracts}\n    if args.output_dir:\n        directory = Path(args.output_dir)\n        directory.mkdir(parents=True, exist_ok=True)\n        for name, schema in schemas.items():\n            _emit(schema, directory / f\"{name}.schema.json\")\n        _emit({\"schema_count\": len(schemas), \"output_dir\": str(directory)})\n    else:\n        _emit(schemas)\n    return 0\n\n\ndef _doctor(args):\n    from .composition import describe_configuration\n    configuration = _load_configuration(args.config)\n    _emit({**describe_configuration(configuration), \"check\": \"configuration_only\",\n           \"factory_imports_performed\": False, \"role_calls_performed\": False,\n           \"notice\": \"Declarations only; adapter import, model, database and file connectivity are not verified.\"}, args.output)\n    return 0\n\n\ndef _check(args):\n    from .checks import load_suite, run_checks\n\n    configuration = _load_configuration(args.config)\n    prepared = load_suite(args.cases, args.role)\n    protected = {prepared.path, Path(args.config).resolve(), *(case.path for case in prepared.cases)}\n    if args.output and Path(args.output).resolve() in protected:\n        _error(\"INVALID_ARGUMENT\", \"The report must not overwrite its configuration, suite or request fixtures.\")\n        return 2\n    print(\"EXPLICIT ROLE CHECK: initializes only the selected adapter; each fixture is invoked once, without retries.\", file=sys.stderr)\n    report = run_checks(prepared, configuration)\n    # A failed check is itself a valid report. Preflight/setup errors use the\n    # normal error path and leave a previous report untouched.\n    _emit(report, args.output)\n    return 0 if report[\"passed\"] else 1\n\n\ndef _serve(args):\n    from .api import create_app\n    import uvicorn\n    configuration = _load_configuration(args.config)\n    print(\"DEVELOPMENT API: loopback only, no authentication, memory-only state; factories load trusted local code.\", file=sys.stderr)\n    app = create_app(configuration=configuration)\n    uvicorn.run(app, host=\"127.0.0.1\", port=args.port, workers=1, reload=False)\n    return 0\n\n\ndef _check_flow(args):\n    from .flow_checks import load_flow_case, run_flow_check\n\n    configuration = _load_configuration(args.config)\n    case = load_flow_case(args.case)\n    protected = {Path(args.config).resolve(), Path(args.case).resolve()}\n    if args.output:\n        output = Path(args.output)\n        if output.resolve() in protected or (output.exists() and any(output.samefile(p) for p in protected)):\n            _error(\"INVALID_ARGUMENT\", \"The report must not overwrite its configuration or workflow fixture.\")\n            return 2\n        if not output.parent.is_dir() or output.is_dir():\n            _error(\"FILE_UNAVAILABLE\", \"The output parent must exist and the report must be a file.\")\n            return 2\n    print(\"EXPLICIT WORKFLOW CHECK: initializes all configured roles; approvals are scripted test inputs. \"\n          \"Adapters run once per stage, without retries.\", file=sys.stderr)\n    report = run_flow_check(case, configuration)\n    _emit(report, args.output)\n    return 0 if report[\"passed\"] else 1\n\n\ndef _port(value):\n    port = int(value)\n    if not 1 \u003c= port \u003c= 65535:\n        raise argparse.ArgumentTypeError(\"port must be between 1 and 65535\")\n    return port\n\n\ndef parser():\n    cli = argparse.ArgumentParser(description=\"Creative Checker agent framework development commands\")\n    commands = cli.add_subparsers(dest=\"command\", required=True)\n    demo = commands.add_parser(\"demo\", help=\"run a labelled synthetic approval and re-review example\")\n    demo.add_argument(\"--output\", help=\"write JSON to this file instead of stdout\")\n    demo.set_defaults(handler=_demo)\n    role = commands.add_parser(\"role\", help=\"execute one role against its JSON request contract\")\n    role.add_argument(\"role\", choices=tuple(ROLE_CONTRACTS))\n    role.add_argument(\"--input\", required=True, help=\"request JSON file\")\n    role.add_argument(\"--output\", help=\"response JSON file; parent directory must exist\")\n    adapters = role.add_mutually_exclusive_group()\n    adapters.add_argument(\"--synthetic\", action=\"store_true\", help=\"explicitly use labelled development fixtures\")\n    adapters.add_argument(\"--factory\", help=\"trusted importable module:callable returning Agents; called with no arguments\")\n    adapters.add_argument(\"--config\", help=\"trusted team configuration JSON; initializes only the selected role\")\n    role.add_argument(\"--scenario\", choices=(\"pass\", \"fail\", \"review\", \"stale\", \"unavailable\"),\n                      help=\"synthetic scenario name, default: pass\")\n    role.set_defaults(handler=_role)\n    schema = commands.add_parser(\"schema\", help=\"export the current versioned JSON contracts\")\n    schema.add_argument(\"--output-dir\", help=\"write one NAME.schema.json file per contract\")\n    schema.add_argument(\"--include-configuration\", action=\"store_true\", help=\"also include role binding and team configuration schemas\")\n    schema.add_argument(\"--include-checks\", action=\"store_true\", help=\"also include role check suite schemas\")\n    schema.set_defaults(handler=_schemas)\n    doctor = commands.add_parser(\"doctor\", help=\"validate and describe role configuration without loading any factory\")\n    doctor.add_argument(\"--config\", required=True, help=\"team configuration JSON\")\n    doctor.add_argument(\"--output\", help=\"write diagnostics JSON; parent directory must exist\")\n    doctor.set_defaults(handler=_doctor)\n    check = commands.add_parser(\"check\", help=\"check one configured role against a local suite of request fixtures\")\n    check.add_argument(\"role\", choices=tuple(ROLE_CONTRACTS))\n    check.add_argument(\"--config\", required=True, help=\"trusted team configuration; only the selected role is initialized\")\n    check.add_argument(\"--cases\", required=True, help=\"suite JSON; fixture paths are relative to this file\")\n    check.add_argument(\"--output\", help=\"write summary JSON, including failed checks; parent directory must exist\")\n    check.set_defaults(handler=_check)\n    flow = commands.add_parser(\"check-flow\", help=\"rehearse configured criteria approval, review, report and re-review\")\n    flow.add_argument(\"--config\", required=True, help=\"trusted team configuration; initializes all roles\")\n    flow.add_argument(\"--case\", required=True, help=\"workflow fixture JSON with original/revised file references and expected verdicts\")\n    flow.add_argument(\"--output\", help=\"write a summary report, including failures; parent directory must exist\")\n    flow.set_defaults(handler=_check_flow)\n    serve = commands.add_parser(\"serve\", help=\"start the configured development API on loopback; never starts product services\")\n    serve.add_argument(\"--config\", required=True, help=\"explicit trusted team configuration JSON\")\n    serve.add_argument(\"--port\", type=_port, default=8012)\n    serve.set_defaults(handler=_serve)\n    from .postgres_commands import postgres_check,postgres_serve,postgres_worker,postgres_migrate,initialize_pdf_storage\n    pdf_init=commands.add_parser('init-pdf-storage',help='explicitly initialize a NEW dedicated PDF directory; never reuse legacy image storage')\n    pdf_init.add_argument('--root',required=True)\n    pdf_init.set_defaults(handler=initialize_pdf_storage)\n    for name,handler,help_text in (\n        ('postgres-check',postgres_check,'read-only existing M008 and framework extension preflight'),\n        ('postgres-serve',postgres_serve,'start authenticated PostgreSQL framework API; never executes models'),\n        ('worker',postgres_worker,'run the separate fenced framework role worker'),\n        ('migrate-postgres',postgres_migrate,'explicit owner-only additive framework migration in an existing M008 DB')):\n        command=commands.add_parser(name,help=help_text)\n        command.add_argument('--env-file',required=True,help='explicit app-only env file; migration uses a separate owner-only file')\n        if name in ('postgres-serve','worker'):\n            command.add_argument('--config',required=True,help='fixed trusted team adapter configuration')\n        if name=='postgres-serve':\n            command.add_argument('--port',type=_port,default=8012)\n            command.add_argument('--host',choices=('127.0.0.1','0.0.0.0'),default='127.0.0.1',help='Use 0.0.0.0 only inside a container with a loopback-only published host port.')\n            command.add_argument('--pdf-storage-root',help='existing dedicated PDF root initialized with init-pdf-storage; requires AF002')\n            command.add_argument('--poster-storage-root',help='existing M008 image storage; registered poster reviews require AF003')\n        if name=='migrate-postgres':command.add_argument('--revision',choices=('AF001','AF002','AF003','AF004','AF005'),default='AF001')\n        if name=='worker':\n            command.add_argument('--once',action='store_true',help='recover expired claims and execute at most one queued phase')\n            command.add_argument('--pdf-storage-root',help='existing dedicated PDF storage; required by registered_pdf A02 configuration')\n            command.add_argument('--poster-storage-root',help='existing M008 image storage; required by registered_poster inspector')\n        command.set_defaults(handler=handler)\n    from .graph_commands import graph_command\n    for name in ('graph-init','graph-projector','graph-rebuild','graph-check'):\n        command=commands.add_parser(name,help='Explicit framework graph operation; never migrates a database')\n        command.add_argument('--env-file',required=True)\n        if name=='graph-projector':command.add_argument('--once',action='store_true')\n        if name=='graph-rebuild':\n            from uuid import UUID\n            command.add_argument('--project-id',type=UUID,required=True)\n        command.set_defaults(handler=graph_command)\n    from .graph_monitor import monitor_command,monitor_status_command\n    command=commands.add_parser('graph-monitor',help='Read-only sync lag/failure observations; no repairs or external alerts')\n    command.add_argument('--env-file',required=True)\n    command.add_argument('--once',action='store_true')\n    command.add_argument('--state-file')\n    command.add_argument('--interval',type=int,default=15)\n    command.add_argument('--lag-seconds',type=int,default=120)\n    command.add_argument('--failure-threshold',type=int,default=3)\n    from uuid import UUID\n    command.add_argument('--project-id',type=UUID,help='Optional operator-only observation scope; default is all projected projects')\n    command.set_defaults(handler=monitor_command)\n    command=commands.add_parser('graph-monitor-status',help='Read monitor snapshot freshness without connecting to business databases')\n    command.add_argument('--state-file',required=True)\n    command.add_argument('--max-age',type=int,default=60)\n    command.set_defaults(handler=monitor_status_command)\n    from .graph_recovery import recovery_command,recovery_status_command\n    command=commands.add_parser('graph-recovery',help='Confirm project projection loss and enqueue source-verified recovery; never initializes schemas')\n    command.add_argument('--env-file',required=True)\n    command.add_argument('--state-file')\n    command.add_argument('--once',action='store_true')\n    command.add_argument('--project-id',type=UUID,help='Optional operator-only project scope')\n    command.set_defaults(handler=recovery_command)\n    command=commands.add_parser('graph-recovery-status',help='Read recovery snapshot without writing database records')\n    command.add_argument('--state-file',required=True)\n    command.add_argument('--max-age',type=int,default=120)\n    command.set_defaults(handler=recovery_status_command)\n    return cli\n\n\ndef main(argv=None):\n    args = parser().parse_args(argv)\n    try:\n        return args.handler(args)\n    except _ConfigError:\n        _error(\"CONFIG_INVALID\", \"Team configuration must declare all roles and use supported role settings.\")\n        return 2\n    except CheckSuiteError:\n        _error(\"CHECK_SUITE_INVALID\", \"The suite must declare the selected role, unique cases and supported expectations.\")\n        return 2\n    except FlowCaseError:\n        _error(\"FLOW_CASE_INVALID\", \"The workflow fixture must use fixed document/criteria and a new child run/poster version.\")\n        return 2\n    except ConfigurationError:\n        _error('POSTGRES_CONFIGURATION_INVALID','Use an explicit app-only or migration-only environment file for the selected action.')\n        return 2\n    except PersistenceError as exc:\n        _error(exc.code,'The PostgreSQL operation was not confirmed. Inspect readiness before any explicit retry.',outcome_unknown=exc.outcome=='commit_unknown')\n        return 1\n    except ValidationError:\n        _error(\"CONTRACT_INVALID\", \"Input or adapter output does not match the versioned JSON contract.\")\n        return 2\n    except (OSError, UnicodeError):\n        _error(\"FILE_UNAVAILABLE\", \"The requested input or output file could not be read or written.\")\n        return 2\n    except AdapterFailure as exc:\n        _error(exc.code, exc.message, retryable=exc.retryable, outcome_unknown=exc.outcome_unknown)\n        return 2 if isinstance(exc, InvocationFailure) and exc.code == \"CONTRACT_INVALID\" else 1\n    except (NotImplementedError, AttributeError):\n        _error(\"ADAPTER_NOT_IMPLEMENTED\", \"The adapter or factory is incomplete; no successful result was produced.\")\n        return 1\n    except Exception:\n        # Do not leak model responses, credentials, local paths, or tracebacks.\n        _error(\"ADAPTER_FAILED\", \"The selected command or adapter failed; inspect it in your development environment.\")\n        return 1\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n","sha256":"283d99ecc5863fe8a42ac4a031ec9148caa93dce2635d8afa54163ec1d17fb5d"},"backend/agent_framework/composition.py":{"text":"\"\"\"Explicit local developer configuration for independent role adapters.\n\nLoading and describing configuration never imports a configured factory. Building\nan adapter does execute trusted local code; it is not a connectivity check.\nBusiness requests cannot select or change this configuration.\n\"\"\"\nfrom __future__ import annotations\n\nimport importlib\nimport inspect\nimport json\nfrom pathlib import Path\nfrom typing import Annotated, Literal\n\nfrom pydantic import Field, model_validator,model_serializer\n\nfrom .contracts import Contract, ValidateRequest, ValidatedResult\nfrom .ports import AdapterFailure, Agents\nfrom .a02_configuration import PDFExtractionConfiguration\n\nRoleId = Literal[\"A02\", \"A04_A05\", \"A06\", \"A07\"]\nBindingKind = Literal[\"synthetic\", \"reference\", \"factory\", \"unconfigured\", \"registered_pdf\", \"registered_poster\"]\nScenario = Literal[\"pass\", \"fail\", \"review\", \"stale\", \"unavailable\"]\nFactoryRef = Annotated[str, Field(pattern=r\"^[A-Za-z_][A-Za-z0-9_]*(?:\\.[A-Za-z_][A-Za-z0-9_]*)*:[A-Za-z_][A-Za-z0-9_]*$\")]\nROLE_PORTS = {\n    \"A02\": (\"extractor\", \"extract\"),\n    \"A04_A05\": (\"inspector\", \"inspect\"),\n    \"A06\": (\"validator\", \"validate\"),\n    \"A07\": (\"reporter\", \"report\"),\n}\n\n\nclass RoleBinding(Contract):\n    kind: BindingKind\n    factory: FactoryRef | None = None\n    scenario: Scenario | None = None\n\n    @model_validator(mode=\"after\")\n    def options_match_kind(self):\n        if self.kind in (\"factory\",\"registered_poster\") and self.factory is None:\n            raise ValueError(\"factory binding requires module:callable\")\n        if self.kind not in (\"factory\",\"registered_poster\") and self.factory is not None:\n            raise ValueError(\"factory is only allowed for a factory binding\")\n        if self.kind != \"synthetic\" and self.scenario is not None:\n            raise ValueError(\"scenario is only allowed for a synthetic binding\")\n        return self\n\n\nclass ContextPreparation(Contract):\n    mode: Literal['neo4j_rag'] = 'neo4j_rag'\n    policy: Literal['af-approved-sources-v1'] = 'af-approved-sources-v1'\n\n\nclass TeamConfiguration(Contract):\n    profile: Literal[\"development\", \"test\"] = \"development\"\n    roles: dict[RoleId, RoleBinding]\n    pdf_extraction: PDFExtractionConfiguration | None = None\n    context_preparation: ContextPreparation | None = None\n\n    @model_serializer(mode='wrap')\n    def preserve_legacy_wire_shape(self,handler):\n        data=handler(self)\n        if self.pdf_extraction is None:data.pop('pdf_extraction',None)\n        if self.context_preparation is None:data.pop('context_preparation',None)\n        return data\n\n    @model_validator(mode=\"after\")\n    def complete_roles(self):\n        if set(self.roles) != set(ROLE_PORTS):\n            raise ValueError(\"configuration must explicitly declare all four roles\")\n        if any(binding.kind == \"reference\" and role != \"A06\" for role, binding in self.roles.items()):\n            raise ValueError(\"reference binding is available only for A06\")\n        registered=[role for role,binding in self.roles.items() if binding.kind=='registered_pdf']\n        if registered and registered!=['A02']:\n            raise ValueError('registered_pdf is available only for A02')\n        if bool(registered)!=(self.pdf_extraction is not None):\n            raise ValueError('registered_pdf requires an explicit PDF extraction configuration')\n        if any(role!='A04_A05' and binding.kind=='registered_poster' for role,binding in self.roles.items()):\n            raise ValueError('registered_poster is only for A04_A05')\n        if self.roles['A04_A05'].kind=='registered_poster' and not registered:\n            raise ValueError('registered_poster requires the registered PDF baseline profile')\n        if self.context_preparation is not None and self.roles['A04_A05'].kind!='registered_poster':\n            raise ValueError('Neo4j context preparation requires a registered approved poster baseline')\n        return self\n\n\ndef _configuration(value: TeamConfiguration) -\u003e TeamConfiguration:\n    # Frozen models still contain a mutable dict; model_copy/model_construct also\n    # bypass validation. Revalidate before imports or developer-code execution.\n    if not isinstance(value, TeamConfiguration):\n        raise ValueError(\"expected a TeamConfiguration\")\n    return TeamConfiguration.model_validate(value.model_dump(mode=\"python\"))\n\n\ndef _unique_object(pairs):\n    values = {}\n    for key, value in pairs:\n        if key in values:\n            raise ValueError(\"duplicate configuration key\")\n        values[key] = value\n    return values\n\n\ndef _invalid_constant(_value):\n    raise ValueError(\"configuration must contain standard JSON values\")\n\n\ndef load_config(path: str | Path) -\u003e TeamConfiguration:\n    \"\"\"Parse a local config without importing modules or creating adapters.\"\"\"\n    value = json.loads(Path(path).read_text(encoding=\"utf-8-sig\"),\n                       object_pairs_hook=_unique_object, parse_constant=_invalid_constant)\n    return TeamConfiguration.model_validate(value)\n\n\nclass _UnconfiguredRole:\n    def __init__(self, role: str):\n        self.role = role\n\n    def _missing(self, _request):\n        raise AdapterFailure(\"ADAPTER_NOT_CONFIGURED\", \"The selected role has no configured adapter.\")\n\n    extract = inspect = validate = report = _missing\n\n\nclass _SyntheticValidator:\n    \"\"\"Reference validation with explicit fixture provenance; no observations invented.\"\"\"\n    def validate(self, request: ValidateRequest) -\u003e ValidatedResult:\n        from .validation import ReferenceValidator\n\n        result = ReferenceValidator().validate(request)\n        return result.model_copy(update={\"synthetic\": True})\n\n\ndef _asynchronous(value) -\u003e bool:\n    return any(inspect.iscoroutinefunction(candidate) or inspect.isasyncgenfunction(candidate)\n               for candidate in (value, getattr(value, \"__call__\", None)))\n\n\ndef _validate_adapter(adapter, role: str):\n    if inspect.isclass(adapter) or isinstance(adapter, Agents) or inspect.isawaitable(adapter) or inspect.isasyncgen(adapter):\n        if inspect.iscoroutine(adapter):\n            adapter.close()\n        raise AdapterFailure(\"INVALID_ROLE_ADAPTER\", \"A role factory must return a synchronous role adapter instance.\")\n    method = getattr(adapter, ROLE_PORTS[role][1], None)\n    if not callable(method) or _asynchronous(method):\n        raise AdapterFailure(\"INVALID_ROLE_ADAPTER\", \"The role adapter must implement its synchronous request method.\")\n    try:\n        inspect.signature(method).bind(object())\n    except (TypeError, ValueError):\n        raise AdapterFailure(\"INVALID_ROLE_ADAPTER\", \"The role method must accept one request argument.\") from None\n    return adapter\n\n\ndef _from_factory(reference: str, role: str):\n    module_name, name = reference.split(\":\", 1)\n    try:\n        factory = getattr(importlib.import_module(module_name), name, None)\n        if not callable(factory) or _asynchronous(factory):\n            raise AdapterFailure(\"INVALID_FACTORY\", \"The configured factory must be callable and synchronous.\")\n        try:\n            inspect.signature(factory).bind()\n        except (TypeError, ValueError):\n            raise AdapterFailure(\"INVALID_FACTORY\", \"The configured factory must accept zero arguments.\") from None\n        return _validate_adapter(factory(), role)\n    except AdapterFailure:\n        raise\n    except Exception:\n        raise AdapterFailure(\"ADAPTER_FACTORY_FAILED\", \"The configured role factory could not be initialized.\") from None\n\n\ndef _build_role(config: TeamConfiguration, role: str):\n    if role not in ROLE_PORTS:\n        raise ValueError(\"unknown framework role\")\n    binding = config.roles[role]\n    if binding.kind in ('registered_pdf','registered_poster'):\n        raise AdapterFailure('ADAPTER_CONTEXT_REQUIRED','Registered PDFs require the PostgreSQL worker and dedicated PDF storage.')\n    if binding.kind == \"unconfigured\":\n        return _UnconfiguredRole(role)\n    if binding.kind == \"reference\":\n        from .validation import ReferenceValidator\n\n        return ReferenceValidator()\n    if binding.kind == \"synthetic\":\n        if role == \"A06\":\n            return _SyntheticValidator()\n        from .adapters.synthetic import SyntheticAdapters\n\n        return SyntheticAdapters(scenario=binding.scenario or \"pass\")\n    return _from_factory(binding.factory, role)\n\n\ndef build_role(config: TeamConfiguration, role: str):\n    \"\"\"Initialize only the selected role; other factories are never imported.\"\"\"\n    return _build_role(_configuration(config), role)\n\n\ndef build_agents(config: TeamConfiguration) -\u003e Agents:\n    \"\"\"Explicitly initialize all roles. An error aborts assembly without fallback.\"\"\"\n    checked = _configuration(config)\n    return Agents(**{port: _build_role(checked, role) for role, (port, _method) in ROLE_PORTS.items()})\n\n\ndef describe_configuration(config: TeamConfiguration) -\u003e dict:\n    \"\"\"Declarations only. This function never imports or runs configured code.\"\"\"\n    checked = _configuration(config)\n    roles = {}\n    for role in ROLE_PORTS:\n        binding = checked.roles[role]\n        item = {\"kind\": binding.kind, \"connection_verified\": False}\n        if binding.factory is not None:\n            item[\"factory\"] = binding.factory\n        if binding.kind == \"synthetic\":\n            item[\"scenario\"] = binding.scenario or \"pass\"\n        if binding.kind=='registered_pdf':\n            item['mode']=checked.pdf_extraction.mode\n            item['model']='mock-line-fixture-v1' if checked.pdf_extraction.mode=='mock' else checked.pdf_extraction.model\n            item['requires_context']='PostgreSQL worker and dedicated PDF storage'\n        roles[role] = item\n    result = {\"contract_version\": checked.contract_version, \"profile\": checked.profile,\n              \"connection_verified\": False, \"roles\": roles}\n    if checked.context_preparation is not None:\n        result['context_preparation']={'mode':checked.context_preparation.mode,\n            'policy':checked.context_preparation.policy,'requires_schema':'AF005','connection_verified':False}\n    return result\n\n\ndef poster_review_configuration_blockers(config: TeamConfiguration) -\u003e list[str]:\n    \"\"\"Check declarations only; never import factories or verify worker/model access.\"\"\"\n    checked = _configuration(config)\n\n    # shortcut: known stubs only; extend exclusions when adding framework stub factories.\n    def real_factory(binding):\n        module, _, name = (binding.factory or '').partition(':')\n        return (bool(module) and module.split('.')[0] not in ('examples', 'tests')\n                and module not in ('backend.agent_framework.adapters.templates',\n                                   'backend.agent_framework.adapters.synthetic')\n                and name not in ('QwenAdapterStub', '_UnconfiguredRole', '_SyntheticValidator'))\n\n    pdf = checked.pdf_extraction\n    inspector, validator, reporter = (checked.roles[role] for role in ('A04_A05', 'A06', 'A07'))\n    return [code for ready, code in (\n        (checked.roles['A02'].kind == 'registered_pdf' and pdf is not None\n         and pdf.mode == 'qwen' and pdf.structuring == 'semantic' and pdf.presentation,\n         'A02_QWEN_NOT_CONFIGURED'),\n        (inspector.kind == 'registered_poster' and real_factory(inspector), 'A04_A05_POSTER_NOT_CONFIGURED'),\n        (validator.kind == 'reference' or validator.kind == 'factory' and real_factory(validator),\n         'A06_VALIDATOR_NOT_CONFIGURED'),\n        (reporter.kind == 'factory' and real_factory(reporter), 'A07_REPORTER_NOT_CONFIGURED'),\n    ) if not ready]\n\n\ndef describe_agents(agents: Agents) -\u003e dict:\n    \"\"\"Describe exact known adapters; a custom type is never proof of connectivity.\"\"\"\n    from .adapters.synthetic import SyntheticAdapters\n    from .adapters.templates import QwenAdapterStub\n    from .validation import ReferenceValidator\n\n    kinds = {SyntheticAdapters: \"synthetic\", _SyntheticValidator: \"synthetic\",\n             ReferenceValidator: \"reference\", _UnconfiguredRole: \"unconfigured\",\n             QwenAdapterStub: \"unconfigured\"}\n    return {role: {\"kind\": kinds.get(type(getattr(agents, port)), \"custom\"),\n                   \"connection_verified\": False}\n            for role, (port, _method) in ROLE_PORTS.items()}\n","sha256":"cd58a7f3e777471ab2cb4fd3d75d667a705192283d29f1de6dc9b357fcde8738"},"backend/agent_framework/context.py":{"text":"\"\"\"Freeze approved provenance; no search role, database, model or network call.\n\nPG -\u003e Neo4j -\u003e PG context preparation is a separate integration task. This\nfunction only freezes the sources already present in the approved criteria.\n\"\"\"\nfrom hashlib import sha256\nimport json\n\nfrom .contracts import Context, Criterion, Evidence, EvidenceBundle\nfrom .validation import _criteria, validate_evidence\n\n\ndef freeze_approved_context(\n    context: Context, criteria: tuple[Criterion, ...], *, synthetic: bool = False,\n) -\u003e EvidenceBundle:\n    _criteria(context, criteria)\n    snapshot = json.dumps({\n        'context': context.model_dump(mode='json'),\n        'criteria': [criterion.model_dump(mode='json') for criterion in criteria],\n    }, sort_keys=True, ensure_ascii=False).encode()\n    bundle = EvidenceBundle(\n        context=context, context_id='approved-' + sha256(snapshot).hexdigest(),\n        status='complete', synthetic=synthetic,\n        evidence=tuple(Evidence(\n            evidence_id='criterion-' + sha256(criterion.criterion_id.encode()).hexdigest(),\n            project_id=context.project_id, kind='current_requirement',\n            criterion_ids=(criterion.criterion_id,),\n            source_record_id=criterion.source.block_id, source=criterion.source,\n            value_source=criterion.value_source,\n        ) for criterion in criteria),\n        warnings=('Approved-criteria context only; no PostgreSQL/Neo4j relationship lookup was executed.',),\n    )\n    validate_evidence(context, criteria, bundle)\n    return bundle\n","sha256":"b2d2c95c7fc489f85f3f061420b540cda002fd5ddf8258f3a15c31a171205c89"},"backend/agent_framework/contracts.py":{"text":"\"\"\"Versioned JSON contracts shared by agents, adapters, fixtures and API clients.\"\"\"\nfrom __future__ import annotations\n\nfrom typing import Annotated, Literal\n\nfrom pydantic import AwareDatetime, BaseModel, ConfigDict, Field, model_validator,model_serializer\n\nIdentifier = Annotated[str, Field(min_length=1, max_length=160, pattern=r\"^[A-Za-z0-9][A-Za-z0-9_.:-]*$\")]\nHash = Annotated[str, Field(pattern=r\"^[a-f0-9]{64}$\")]\nVerdict = Literal[\"pass\", \"fail\", \"review\"]\nObservationStatus = Literal[\"observed\", \"absent\", \"unreadable\", \"not_checked\", \"unknown\"]\nExecutionStatus = Literal[\"queued\", \"extracting\", \"reviewing\", \"waiting_criteria\", \"waiting_asset\", \"waiting_review\",\n                          \"waiting_revision\", \"completed\", \"failed\", \"outcome_unknown\"]\n\n\nclass Contract(BaseModel):\n    model_config = ConfigDict(extra=\"forbid\", frozen=True)\n    contract_version: Literal[\"3.0.0\"] = \"3.0.0\"\n\n\nclass Context(Contract):\n    project_id: Identifier\n    run_id: Identifier\n    actor_id: Identifier\n    document_version_id: Identifier\n    criteria_version_id: Identifier\n    asset_version_id: Identifier | None = None\n    parent_run_id: Identifier | None = None\n\n\nclass DocumentRef(Contract):\n    file_id: Identifier\n    document_version_id: Identifier\n    sha256: Hash\n    media_type: Literal[\"application/pdf\",\"text/plain\"] = \"application/pdf\"\n    page_count: int = Field(ge=1)\n\n    @model_validator(mode='after')\n    def logical_text_block(self):\n        if self.media_type=='text/plain' and self.page_count!=1:raise ValueError('free input has one logical source block')\n        return self\n\n\nclass AssetRef(Contract):\n    file_id: Identifier\n    asset_version_id: Identifier\n    sha256: Hash\n    media_type: Literal[\"image/png\", \"image/jpeg\", \"image/webp\"] = \"image/png\"\n    width: int = Field(gt=0)\n    height: int = Field(gt=0)\n\n\nclass SourceRef(Contract):\n    document_version_id: Identifier\n    page: int = Field(ge=1)\n    block_id: Identifier\n    quote: str = Field(min_length=1)\n    source_hash: Hash\n\n\nclass CriteriaValueSource(Contract):\n    record_id: Identifier\n    purpose: Literal['human_review','synthetic_test']\n    reference: str = Field(min_length=1,max_length=500)\n    quote: str = Field(min_length=1,max_length=4000)\n    quote_sha256: Hash\n    submitted_by: Identifier\n    submitted_at: AwareDatetime\n    synthetic: bool\n\n    @model_validator(mode='after')\n    def keep_test_provenance(self):\n        if self.purpose=='synthetic_test' and not self.synthetic:raise ValueError('test provenance cannot lose its synthetic label')\n        return self\n\n\nclass RequirementPresentation(Contract):\n    label: str = Field(min_length=1,max_length=80,pattern=r'^[^:\\r\\n]+$')\n    value: str = Field(min_length=1,max_length=400)\n\n\nclass RequirementDetails(Contract):\n    \"\"\"Source-grounded compilation metadata, not semantic approval.\"\"\"\n    compiler: Literal['literal-requirements-v1','qwen-semantic-v1'] = 'literal-requirements-v1'\n    target: Literal['poster_text','poster_visual','file_metadata','delivery','unspecified']\n    field: str = Field(pattern=r'^[a-z][a-z0-9_]{0,63}$')\n    expected_source: SourceRef | None = None\n    normalized_expected: str | None = Field(default=None,max_length=100)\n    presentation: RequirementPresentation | None = None\n    qualifiers: tuple[SourceRef,...] = ()\n    origin: Literal['selected_source','model_structured','retained_unresolved_source'] = 'selected_source'\n\n    @model_validator(mode='after')\n    def field_matches_target(self):\n        scopes={'poster_text':{'wording','title_phrase','event_name','year','event_date','start_date','end_date','event_period','weekday','venue','viewing_hours'},\n            'poster_visual':{'visual_requirements','logo','visual_color','composition','imagery'},'file_metadata':{'pixel_width','pixel_height','file_format','color_mode'},\n            'delivery':{'quantity'},'unspecified':{'unspecified'}}\n        known={field:target for target,fields in scopes.items() for field in fields}\n        if self.field in known and known[self.field]!=self.target:raise ValueError('requirement field does not match its target')\n        return self\n\n    @model_serializer(mode='wrap')\n    def preserve_legacy_details(self,handler):\n        data=handler(self)\n        if self.normalized_expected is None:data.pop('normalized_expected',None)\n        if self.presentation is None:data.pop('presentation',None)\n        return data\n\n\nclass Criterion(Contract):\n    criterion_id: Identifier\n    text: str = Field(min_length=1)\n    kind: Literal[\"text\", \"number\", \"visual\", \"unsupported\"]\n    expected: str = Field(description=(\n        \"Text equals/contains comparisons need a non-whitespace expected value. \"\n        \"Blank expectations remain unresolved (review) and cannot pass.\"\n    ))\n    operator: Literal[\"equals\", \"contains\", \"gte\", \"lte\", \"present\", \"manual\"]\n    unit: str | None = None\n    required: bool = True\n    source: SourceRef\n    human_added: bool = False\n    value_source: CriteriaValueSource | None = None\n    details: RequirementDetails | None = None\n\n    @model_serializer(mode='wrap')\n    def preserve_legacy_value_shape(self,handler):\n        data=handler(self)\n        if self.value_source is None:data.pop('value_source',None)\n        if self.details is None:data.pop('details',None)\n        return data\n\n\nclass RoleRequest(Contract):\n    # Preserve provenance even when only a previous draft's criteria are passed on.\n    synthetic: bool = False\n\n\nclass ExtractRequest(RoleRequest):\n    context: Context\n    document: DocumentRef\n\n\nclass PDFTextSource(Contract):\n    page: int = Field(ge=1,le=50,strict=True)\n    block_id: Identifier\n    text: str = Field(min_length=1,max_length=60000)\n    text_sha256: Hash\n\n\nclass ExtractionTrace(Contract):\n    mode: Literal['mock','qwen']\n    model: str = Field(min_length=1,max_length=200)\n    parser: str = Field(min_length=1,max_length=100)\n    policy: Literal['a02-text-v1','a02-source-compile-v2','a02-semantic-v3','a02-semantic-v4'] = 'a02-text-v1'\n    input_kind: Literal['pdf','free_text'] = 'pdf'\n    document_sha256: Hash\n    prompt_sha256: Hash\n    response_sha256: Hash\n    sources: tuple[PDFTextSource,...] = Field(min_length=1,max_length=50)\n    unresolved_criterion_ids: tuple[Identifier,...] = ()\n\n    @model_serializer(mode='wrap')\n    def preserve_legacy_trace(self,handler):\n        data=handler(self)\n        if self.input_kind=='pdf':data.pop('input_kind',None)\n        return data\n\n\nclass CriteriaDraft(Contract):\n    context: Context\n    criteria: tuple[Criterion, ...] = Field(min_length=1)\n    warnings: tuple[str, ...] = ()\n    synthetic: bool = False\n    extraction: ExtractionTrace | None = None\n\n    @model_serializer(mode='wrap')\n    def preserve_legacy_wire_shape(self,handler):\n        data=handler(self)\n        if self.extraction is None:data.pop('extraction',None)\n        return data\n\n\nclass Evidence(Contract):\n    evidence_id: Identifier\n    project_id: Identifier\n    kind: Literal[\"current_requirement\", \"approved_exception\", \"historical_context\"]\n    criterion_ids: tuple[Identifier, ...] = Field(min_length=1)\n    source_record_id: Identifier\n    source: SourceRef\n    approval_id: Identifier | None = None\n    # Exception eligibility must be checked by the common context preparation service.\n    applicable_asset_version_id: Identifier | None = None\n    value_source: CriteriaValueSource | None = None\n\n    @model_serializer(mode='wrap')\n    def preserve_legacy_value_shape(self,handler):\n        data=handler(self)\n        if self.value_source is None:data.pop('value_source',None)\n        return data\n\n    @model_validator(mode=\"after\")\n    def exception_has_scope(self):\n        if self.kind == \"approved_exception\" and (not self.approval_id or not self.applicable_asset_version_id):\n            raise ValueError(\"approved_exception requires approval_id and asset scope\")\n        return self\n\n\nclass EvidenceBundle(Contract):\n    context: Context\n    context_id: Identifier\n    status: Literal[\"complete\", \"empty\", \"stale\", \"unavailable\"]\n    evidence: tuple[Evidence, ...] = ()\n    warnings: tuple[str, ...] = ()\n    postgres_revision: int = Field(default=0, ge=0)\n    graph_revision: int | None = Field(default=None, ge=0)\n    synthetic: bool = False\n\n\nclass InspectRequest(RoleRequest):\n    context: Context\n    criteria: tuple[Criterion, ...] = Field(min_length=1)\n    asset: AssetRef\n    evidence: EvidenceBundle\n\n\nclass ImageEvidence(Contract):\n    asset_version_id: Identifier\n    asset_hash: Hash\n    # Normalized x1,y1,x2,y2; absence means no localization claim.\n    bbox: tuple[float, float, float, float] | None = None\n\n    @model_validator(mode=\"after\")\n    def valid_box(self):\n        if self.bbox is not None:\n            x1, y1, x2, y2 = self.bbox\n            if not (0 \u003c= x1 \u003c x2 \u003c= 1 and 0 \u003c= y1 \u003c y2 \u003c= 1):\n                raise ValueError(\"bbox must be finite normalized x1,y1,x2,y2\")\n        return self\n\n\nclass Observation(Contract):\n    criterion_id: Identifier\n    observed: str\n    observation_status: ObservationStatus = \"unknown\"\n    observed_unit: str | None = None\n    verdict: Verdict\n    image: ImageEvidence\n    evidence_ids: tuple[Identifier, ...] = ()\n    uncertainty: str | None = None\n\n\nclass InspectionResult(Contract):\n    context: Context\n    observations: tuple[Observation, ...]\n    synthetic: bool = False\n\n\nclass ValidateRequest(RoleRequest):\n    context: Context\n    criteria: tuple[Criterion, ...] = Field(min_length=1)\n    asset: AssetRef\n    evidence: EvidenceBundle\n    inspection: InspectionResult\n\n\nclass ValidatedItem(Contract):\n    criterion_id: Identifier\n    criterion_text: str\n    kind: Literal[\"text\", \"number\", \"visual\", \"unsupported\"]\n    operator: Literal[\"equals\", \"contains\", \"gte\", \"lte\", \"present\", \"manual\"]\n    required: bool\n    expected: str\n    expected_unit: str | None = None\n    observed: str | None = None\n    observed_unit: str | None = None\n    observation_status: ObservationStatus = \"unknown\"\n    comparison_expected: str | None = None\n    comparison_observed: str | None = None\n    comparison_unit: str | None = None\n    image: ImageEvidence | None = None\n    evidence_ids: tuple[Identifier, ...] = ()\n    verdict: Verdict\n    issues: tuple[str, ...] = ()\n\n\nclass ValidatedResult(Contract):\n    context: Context\n    verdict: Verdict\n    items: tuple[ValidatedItem, ...] = Field(min_length=1)\n    limitations: tuple[str, ...] = ()\n    synthetic: bool = False\n\n\nclass ReportRequest(RoleRequest):\n    context: Context\n    validated: ValidatedResult\n    evidence: EvidenceBundle\n\n\nclass ReportDraft(Contract):\n    context: Context\n    verdict: Verdict\n    summary: str = Field(min_length=1)\n    evidence_ids: tuple[Identifier, ...] = ()\n    change_requests: tuple[str, ...] = ()\n    synthetic: bool = False\n    polish_status: Literal['failed','outcome_unknown'] | None = None\n\n    @model_serializer(mode='wrap')\n    def preserve_legacy_polish_shape(self,handler):\n        data=handler(self)\n        if self.polish_status is None:data.pop('polish_status',None)\n        return data\n\n\nclass FrameworkError(Contract):\n    code: str\n    message: str\n    retryable: bool = False\n    outcome_unknown: bool = False\n\n\nclass HumanReview(Contract):\n    criterion_id: Identifier\n    verdict: Literal['pass','fail']\n    observed: str = Field(strict=True,min_length=1,max_length=4000)\n    reference: str = Field(strict=True,min_length=1,max_length=1000)\n    reason: str = Field(strict=True,min_length=1,max_length=4000)\n    checked_asset: bool = Field(strict=True)\n\n    @model_validator(mode='after')\n    def verified_review(self):\n        if not self.checked_asset or not all(v.strip() for v in (self.observed,self.reference,self.reason)):\n            raise ValueError('direct asset inspection and nonblank evidence are required')\n        return self\n\n\nclass Approval(Contract):\n    context: Context\n    actor_id: Identifier\n    decision: Literal[\"approve_criteria\", \"approve_changes\", \"approve_final\", \"approve_exception\"]\n    reason: str = \"\"\n    criterion_ids: tuple[Identifier, ...] = ()\n    approved_criteria_version_id: Identifier | None = None\n    criteria_sha256: Hash | None = None\n    human_reviews: tuple[HumanReview,...] = Field(default=(),max_length=128)\n\n    @model_serializer(mode='wrap')\n    def preserve_legacy_target_shape(self,handler):\n        data=handler(self)\n        if self.approved_criteria_version_id is None:\n            data.pop('approved_criteria_version_id',None);data.pop('criteria_sha256',None)\n        if not self.human_reviews:data.pop('human_reviews',None)\n        return data\n\n    @model_validator(mode=\"after\")\n    def scoped_exception(self):\n        if self.human_reviews:\n            if self.decision not in ('approve_final','approve_changes') or not self.reason.strip():\n                raise ValueError('human reviews require a final/change approval and reason')\n            if len({r.criterion_id for r in self.human_reviews})!=len(self.human_reviews):\n                raise ValueError('duplicate human review')\n        if (self.approved_criteria_version_id is None)!=(self.criteria_sha256 is None):\n            raise ValueError('criteria approval target requires both version and hash')\n        if self.approved_criteria_version_id is not None and self.decision!='approve_criteria':\n            raise ValueError('criteria target is only for criteria approval')\n        if self.decision in (\"approve_changes\", \"approve_exception\") and not self.reason.strip():\n            raise ValueError(\"a reason is required\")\n        if self.decision == \"approve_exception\" and not self.criterion_ids:\n            raise ValueError(\"exception approval requires criterion_ids\")\n        return self\n\n\nclass StepRecord(Contract):\n    \"\"\"One role boundary, including validation; never a raw provider payload.\"\"\"\n    ordinal: int = Field(ge=1, strict=True)\n    role: Literal[\"A02\", \"A04_A05\", \"A06\", \"A07\"]\n    status: Literal[\"running\", \"completed\", \"failed\", \"outcome_unknown\", \"reused\"]\n    recorded_at: AwareDatetime\n    started_at: AwareDatetime | None = None\n    finished_at: AwareDatetime | None = None\n    duration_ms: float | None = Field(default=None, ge=0, allow_inf_nan=False)\n    error: FrameworkError | None = None\n    synthetic: bool = False\n    source_run_id: Identifier | None = None\n\n    @model_validator(mode=\"after\")\n    def consistent_lifecycle(self):\n        if self.status == \"reused\":\n            if (self.role != \"A02\" or self.source_run_id is None or self.started_at is not None\n                    or self.finished_at is not None or self.duration_ms is not None or self.error is not None):\n                raise ValueError(\"reused criteria must name their source without claiming an invocation\")\n            return self\n        if self.source_run_id is not None or self.started_at is None:\n            raise ValueError(\"an invoked step requires a start time and no reuse source\")\n        if self.status == \"running\":\n            if self.finished_at is not None or self.duration_ms is not None or self.error is not None:\n                raise ValueError(\"a running step cannot have a terminal outcome\")\n        else:\n            if (self.finished_at is None or self.finished_at \u003c self.started_at\n                    or self.duration_ms is None and self.status != \"outcome_unknown\"):\n                raise ValueError(\"a finished step requires ordered timestamps and a duration\")\n            failed = self.status in {\"failed\", \"outcome_unknown\"}\n            if failed != (self.error is not None):\n                raise ValueError(\"only failed steps carry an error\")\n            if self.error and self.error.outcome_unknown != (self.status == \"outcome_unknown\"):\n                raise ValueError(\"error ambiguity must match step status\")\n        return self\n\n\nclass StepTimeline(Contract):\n    context: Context\n    profile: Literal[\"development\", \"test\"]\n    storage: Literal[\"memory\", \"postgres\"] = \"memory\"\n    execution_status: ExecutionStatus\n    records: tuple[StepRecord, ...] = ()\n\n\nclass ApprovedBaseline(Contract):\n    source_run_id: Identifier\n    criteria_version_id: Identifier\n    criteria_sha256: Hash\n    approval_id: Identifier\n    document_sha256: Hash\n\n\nclass RunSnapshot(Contract):\n    context: Context\n    profile: Literal[\"development\", \"test\"]\n    synthetic: bool\n    execution_status: ExecutionStatus\n    machine_verdict: Verdict | None = None\n    human_decision: Literal[\"unreviewed\", \"changes_approved\", \"final_approved\", \"exception_approved\"] = \"unreviewed\"\n    criteria: CriteriaDraft | None = None\n    evidence: EvidenceBundle | None = None\n    inspection: InspectionResult | None = None\n    validated: ValidatedResult | None = None\n    report: ReportDraft | None = None\n    approvals: tuple[Approval, ...] = ()\n    stages: tuple[str, ...] = ()\n    step_records: tuple[StepRecord, ...] = ()\n    error: FrameworkError | None = None\n    approved_criteria_version_id: Identifier | None = None\n    baseline: ApprovedBaseline | None = None\n\n    @model_serializer(mode='wrap')\n    def preserve_legacy_approval_shape(self,handler):\n        data=handler(self)\n        if self.approved_criteria_version_id is None:data.pop('approved_criteria_version_id',None)\n        if self.baseline is None:data.pop('baseline',None)\n        return data\n\n\nCONTRACT_TYPES = (Context, DocumentRef, AssetRef, Criterion,CriteriaValueSource, ExtractRequest, CriteriaDraft,PDFTextSource,ExtractionTrace,\n                  EvidenceBundle, InspectRequest, InspectionResult,\n                  ValidateRequest, ValidatedResult, ReportRequest, ReportDraft, HumanReview, Approval,\n                  FrameworkError, StepRecord, StepTimeline, RunSnapshot,ApprovedBaseline)\n","sha256":"3b5c7c25f0122a3450255fbc4ef6ad405d78284440c79e0edf4a6ee9505dc63c"},"backend/agent_framework/criteria_contracts.py":{"text":"\"\"\"Human review commands are separate from untrusted model responses.\"\"\"\nfrom typing import Annotated,Literal\nfrom uuid import UUID\nfrom pydantic import AwareDatetime,Field,model_serializer,model_validator\n\nfrom .contracts import (Approval,Context,Contract,Criterion,CriteriaValueSource,EvidenceBundle,Hash,Identifier,RequirementDetails)\n\nPurpose=Literal['human_review','synthetic_test']\nText=Annotated[str,Field(strict=True,min_length=1,max_length=4000)]\n\n\nclass SupplementInput(Contract):\n    reference: str = Field(strict=True,min_length=1,max_length=500)\n    quote: Text\n\n    @model_validator(mode='after')\n    def not_blank(self):\n        if not self.reference.strip() or not self.quote.strip():raise ValueError('source must be nonblank')\n        return self\n\n\nclass CriterionResolution(Contract):\n    kind: Literal['text','number','visual','unsupported']\n    operator: Literal['equals','contains','gte','lte','present','manual']\n    expected: str = Field(strict=True,max_length=4000)\n    unit: str | None = Field(default=None,strict=True,max_length=80)\n    required: bool = Field(strict=True)\n    target: Literal['poster_text','poster_visual','file_metadata','delivery','unspecified'] | None = None\n    field: str | None = Field(default=None,pattern=r'^[a-z][a-z0-9_]{0,63}$')\n    replacement_text: str | None = Field(default=None,strict=True,min_length=1,max_length=4000)\n\n    @model_validator(mode='after')\n    def consistent_scope(self):\n        if self.replacement_text is not None:\n            if not self.replacement_text.strip() or self.target is None:\n                raise ValueError('a replacement requirement needs text and inspection scope')\n            if self.expected and self.expected not in self.replacement_text or self.unit and self.unit not in self.replacement_text:\n                raise ValueError('replacement requirement must include expected value and unit')\n        if (self.target is None)!=(self.field is None):raise ValueError('target and field must be supplied together')\n        if self.target is not None:\n            RequirementDetails(target=self.target,field=self.field)\n            kinds={'poster_text':{'text','number','unsupported'},'poster_visual':{'visual','unsupported'},\n                'file_metadata':{'text','number','unsupported'},'delivery':{'text','number','unsupported'},'unspecified':{'unsupported'}}\n            if self.kind not in kinds[self.target]:raise ValueError('kind does not match inspection target')\n        return self\n\n    @model_serializer(mode='wrap')\n    def preserve_legacy_scope(self,handler):\n        data=handler(self)\n        if self.target is None:\n            data.pop('target',None);data.pop('field',None)\n        if self.replacement_text is None:data.pop('replacement_text',None)\n        return data\n\n\nclass CriteriaEdit(Contract):\n    criterion_id: Identifier\n    action: Literal['amend','exclude']\n    reason: Text\n    source: SupplementInput\n    resolution: CriterionResolution | None = None\n\n    @model_validator(mode='after')\n    def consistent_edit(self):\n        if not self.reason.strip():raise ValueError('reason must be nonblank')\n        if (self.action=='amend')!=(self.resolution is not None):raise ValueError('only amendments require a resolution')\n        if self.resolution is not None:\n            r=self.resolution\n            if r.replacement_text is not None and r.replacement_text not in self.source.quote:\n                raise ValueError('replacement requirement must occur in supplement')\n            if r.expected and r.expected not in self.source.quote:raise ValueError('expected must occur in supplement')\n            if r.unit is not None and (not r.unit.strip() or r.unit not in self.source.quote):raise ValueError('unit must occur in supplement')\n        return self\n\n\nclass CriteriaVersionRequest(Contract):\n    parent_version_id: UUID | None\n    expected_base_sha256: Hash\n    purpose: Purpose\n    edits: tuple[CriteriaEdit,...] = Field(default=(),max_length=128)\n\n    @model_validator(mode='after')\n    def distinct_edits(self):\n        if len({edit.criterion_id for edit in self.edits})!=len(self.edits):raise ValueError('duplicate edit')\n        return self\n\n\nclass RecordedCriteriaEdit(Contract):\n    criterion_id: Identifier\n    action: Literal['amend','exclude']\n    reason: Text\n    source: CriteriaValueSource\n\n\nclass CriteriaVersion(Contract):\n    criteria_version_id: UUID\n    source_run_id: Identifier\n    context: Context\n    parent_version_id: UUID | None\n    version_no: int = Field(ge=1,strict=True)\n    source_draft_sha256: Hash\n    document_sha256: Hash\n    criteria: tuple[Criterion,...] = Field(min_length=1,max_length=128)\n    exclusions: tuple[RecordedCriteriaEdit,...] = Field(default=(),max_length=128)\n    changes: tuple[RecordedCriteriaEdit,...] = Field(default=(),max_length=128)\n    created_by: Identifier\n    created_at: AwareDatetime\n    purpose: Purpose\n    synthetic: bool\n\n\nclass CriteriaVersionRecord(Contract):\n    version: CriteriaVersion\n    sha256: Hash\n    approval_blockers: dict[str,tuple[str,...]]\n\n\nclass CriteriaApprovalRequest(Contract):\n    criteria_version_id: UUID\n    expected_sha256: Hash\n    purpose: Purpose\n    reason: Text\n    reviewed_all_criteria: bool = Field(strict=True)\n\n    @model_validator(mode='after')\n    def explicit_review(self):\n        if not self.reviewed_all_criteria or not self.reason.strip():raise ValueError('explicit review and reason are required')\n        return self\n\n\nclass CriteriaApprovalRecord(Contract):\n    approval_id: UUID\n    approval: Approval\n    approved_at: AwareDatetime\n    criteria: CriteriaVersionRecord\n    evidence: EvidenceBundle\n    purpose: Purpose\n    synthetic: bool\n","sha256":"f1a499f64bc5cad557acf974820d5309169b5e5694cf15cd2d5d13ea66e65557"},"backend/agent_framework/criteria_review.py":{"text":"\"\"\"Immutable criteria revisions and explicit approvals over the existing DB.\n\nNo model calls or implicit approvals. File checks happen outside DB transactions;\nproject/run locks serialize optimistic version and approval commands.\n\"\"\"\nfrom hashlib import sha256\nfrom uuid import UUID,uuid5,NAMESPACE_URL\n\nfrom sqlalchemy import BigInteger,Boolean,Column,MetaData,String,Table,insert,select,func\nfrom sqlalchemy.dialects.postgresql import JSONB,TIMESTAMP,UUID as PGUUID\n\nfrom backend.app.persistence.transaction import unit_of_work\nfrom backend.app.security.errors import AuthError\nfrom .contracts import Approval,Context,Criterion,CriteriaValueSource,DocumentRef,EvidenceBundle,RunSnapshot,RequirementDetails\nfrom .criteria_contracts import (CriteriaApprovalRecord,CriteriaApprovalRequest,CriteriaVersion,\n    CriteriaVersionRecord,CriteriaVersionRequest,RecordedCriteriaEdit)\nfrom .context import freeze_approved_context\nfrom .documents import versions as documents\nfrom .postgres import approvals,runs,steps,payload,digest\nfrom .validation import _criteria,_number,validate_draft,validate_evidence\n\nmetadata=MetaData(schema='agent_framework')\nversions=Table('criteria_versions',metadata,*(Column(n,t) for n,t in (\n    ('criteria_version_id',PGUUID(as_uuid=True)),('source_run_id',String),('project_id',PGUUID(as_uuid=True)),\n    ('document_id',PGUUID(as_uuid=True)),('document_version_id',PGUUID(as_uuid=True)),('parent_version_id',PGUUID(as_uuid=True)),\n    ('version_no',BigInteger),('request_key',PGUUID(as_uuid=True)),('request_json',JSONB),('request_sha256',String),\n    ('snapshot_json',JSONB),('snapshot_sha256',String),('created_by',PGUUID(as_uuid=True)),('created_at',TIMESTAMP(timezone=True)))))\nbindings=Table('criteria_approval_bindings',metadata,*(Column(n,t) for n,t in (\n    ('approval_id',PGUUID(as_uuid=True)),('source_run_id',String),('project_id',PGUUID(as_uuid=True)),\n    ('criteria_version_id',PGUUID(as_uuid=True)),('criteria_sha256',String),('request_key',PGUUID(as_uuid=True)),\n    ('request_json',JSONB),('request_sha256',String),('evidence_json',JSONB),('synthetic',Boolean))))\n\n\ndef _error(code,status=409):raise AuthError(code,status)\n\n\ndef approval_blockers(criteria):\n    result={}\n    supported={'text':{'equals','contains'},'number':{'equals','gte','lte'},'visual':{'present'}}\n    for criterion in criteria:\n        issues=[]\n        if criterion.operator not in supported.get(criterion.kind,set()):issues.append('unsupported_or_manual_criterion')\n        if not criterion.expected.strip():issues.append('missing_expected_value')\n        if criterion.kind=='number' and criterion.expected.strip():\n            try:\n                _number(criterion.expected,criterion.unit)\n            except ValueError:issues.append('numeric_expected_invalid')\n        if criterion.human_added and criterion.value_source is None:issues.append('missing_value_source')\n        if criterion.details is not None and criterion.details.target=='unspecified':issues.append('missing_inspection_target')\n        if issues:result[criterion.criterion_id]=tuple(issues)\n    return result\n\n\ndef revise_criteria(draft,parent,request,*,version_id,created_by,created_at):\n    \"\"\"Pure revision logic. Preserves the original draft and PDF anchors across versions.\"\"\"\n    originals={c.criterion_id:c for c in draft.criteria}\n    current={c.criterion_id:c for c in (parent.criteria if parent else draft.criteria)}\n    excluded={c.criterion_id:c for c in parent.exclusions} if parent else {}\n    synthetic=draft.synthetic or bool(parent and parent.synthetic) or request.purpose=='synthetic_test'\n    changes=[]\n    for edit in request.edits:\n        if edit.criterion_id not in originals:raise ValueError('unknown criterion')\n        source=CriteriaValueSource(record_id=str(uuid5(NAMESPACE_URL,str(version_id)+':'+edit.criterion_id)),\n            purpose=request.purpose,reference=edit.source.reference,quote=edit.source.quote,\n            quote_sha256=sha256(edit.source.quote.encode()).hexdigest(),submitted_by=str(created_by),\n            submitted_at=created_at,synthetic=synthetic)\n        change=RecordedCriteriaEdit(criterion_id=edit.criterion_id,action=edit.action,reason=edit.reason,source=source)\n        changes.append(change)\n        if edit.action=='exclude':\n            if edit.criterion_id not in current:raise ValueError('criterion is already excluded')\n            current.pop(edit.criterion_id);excluded[edit.criterion_id]=change\n        else:\n            original=originals[edit.criterion_id]\n            previous=current.get(edit.criterion_id,original)\n            details=previous.details\n            scope=({'target':edit.resolution.target,'field':edit.resolution.field} if edit.resolution.target is not None else {})\n            if details is not None or scope:\n                details=RequirementDetails(**((details.model_dump(mode='python') if details is not None else {})|\n                    scope|{'expected_source':None,'normalized_expected':None,'presentation':None}|\n                    ({'qualifiers':()} if edit.resolution.replacement_text is not None else {})))\n            current[edit.criterion_id]=Criterion(**(original.model_dump(mode='python')|\n                edit.resolution.model_dump(mode='python',exclude={'target','field','replacement_text'})|\n                {'text':edit.resolution.replacement_text or previous.text,'human_added':True,'value_source':source,'details':details}))\n            excluded.pop(edit.criterion_id,None)\n    if not current:raise ValueError('cannot exclude all criteria')\n    criteria=tuple(current[cid] for cid in originals if cid in current)\n    context=draft.context.model_copy(update={'criteria_version_id':str(version_id)})\n    _criteria(context,cri
