ss ReportRequest(RoleRequest):\n    context: Context\n    validated: ValidatedResult\n    evidence: EvidenceBundle\n\n\nclass ReportDraft(Contract):\n    context: Context\n    verdict: Verdict\n    summary: str = Field(min_length=1)\n    evidence_ids: tuple[Identifier, ...] = ()\n    change_requests: tuple[str, ...] = ()\n    synthetic: bool = False\n\n\nclass FrameworkError(Contract):\n    code: str\n    message: str\n    retryable: bool = False\n    outcome_unknown: bool = False\n\n\nclass Approval(Contract):\n    context: Context\n    actor_id: Identifier\n    decision: Literal[\"approve_criteria\", \"approve_changes\", \"approve_final\", \"approve_exception\"]\n    reason: str = \"\"\n    criterion_ids: tuple[Identifier, ...] = ()\n\n    @model_validator(mode=\"after\")\n    def scoped_exception(self):\n        if self.decision in (\"approve_changes\", \"approve_exception\") and not self.reason.strip():\n            raise ValueError(\"a reason is required\")\n        if self.decision == \"approve_exception\" and not self.criterion_ids:\n            raise ValueError(\"exception approval requires criterion_ids\")\n        return self\n\n\nclass StepRecord(Contract):\n    \"\"\"One role boundary, including validation; never a raw provider payload.\"\"\"\n    ordinal: int = Field(ge=1, strict=True)\n    role: Literal[\"A02\", \"A04_A05\", \"A06\", \"A07\"]\n    status: Literal[\"running\", \"completed\", \"failed\", \"outcome_unknown\", \"reused\"]\n    recorded_at: AwareDatetime\n    started_at: AwareDatetime | None = None\n    finished_at: AwareDatetime | None = None\n    duration_ms: float | None = Field(default=None, ge=0, allow_inf_nan=False)\n    error: FrameworkError | None = None\n    synthetic: bool = False\n    source_run_id: Identifier | None = None\n\n    @model_validator(mode=\"after\")\n    def consistent_lifecycle(self):\n        if self.status == \"reused\":\n            if (self.role != \"A02\" or self.source_run_id is None or self.started_at is not None\n                    or self.finished_at is not None or self.duration_ms is not None or self.error is not None):\n                raise ValueError(\"reused criteria must name their source without claiming an invocation\")\n            return self\n        if self.source_run_id is not None or self.started_at is None:\n            raise ValueError(\"an invoked step requires a start time and no reuse source\")\n        if self.status == \"running\":\n            if self.finished_at is not None or self.duration_ms is not None or self.error is not None:\n                raise ValueError(\"a running step cannot have a terminal outcome\")\n        else:\n            if (self.finished_at is None or self.finished_at \u003c self.started_at\n                    or self.duration_ms is None and self.status != \"outcome_unknown\"):\n                raise ValueError(\"a finished step requires ordered timestamps and a duration\")\n            failed = self.status in {\"failed\", \"outcome_unknown\"}\n            if failed != (self.error is not None):\n                raise ValueError(\"only failed steps carry an error\")\n            if self.error and self.error.outcome_unknown != (self.status == \"outcome_unknown\"):\n                raise ValueError(\"error ambiguity must match step status\")\n        return self\n\n\nclass StepTimeline(Contract):\n    context: Context\n    profile: Literal[\"development\", \"test\"]\n    storage: Literal[\"memory\", \"postgres\"] = \"memory\"\n    execution_status: ExecutionStatus\n    records: tuple[StepRecord, ...] = ()\n\n\nclass RunSnapshot(Contract):\n    context: Context\n    profile: Literal[\"development\", \"test\"]\n    synthetic: bool\n    execution_status: ExecutionStatus\n    machine_verdict: Verdict | None = None\n    human_decision: Literal[\"unreviewed\", \"changes_approved\", \"final_approved\", \"exception_approved\"] = \"unreviewed\"\n    criteria: CriteriaDraft | None = None\n    evidence: EvidenceBundle | None = None\n    inspection: InspectionResult | None = None\n    validated: ValidatedResult | None = None\n    report: ReportDraft | None = None\n    approvals: tuple[Approval, ...] = ()\n    stages: tuple[str, ...] = ()\n    step_records: tuple[StepRecord, ...] = ()\n    error: FrameworkError | None = None\n\n\nCONTRACT_TYPES = (Context, DocumentRef, AssetRef, Criterion, ExtractRequest, CriteriaDraft,\n                  EvidenceBundle, InspectRequest, InspectionResult,\n                  ValidateRequest, ValidatedResult, ReportRequest, ReportDraft, Approval,\n                  FrameworkError, StepRecord, StepTimeline, RunSnapshot)\n","sha256":"b90b6453db4a2924c6fda087ac06686bdfb499e51ed469f8951554825d496361"},"backend/agent_framework/durable_worker.py":{"text":"\"\"\"Fenced PostgreSQL role worker. Inference never holds a DB transaction.\n\nExpired claims without an in-flight role can resume committed results. A running\nrole marker means a call MAY have happened: never replay it automatically.\n\"\"\"\nfrom dataclasses import dataclass\nfrom datetime import timedelta\nfrom threading import Event, Thread\nfrom time import perf_counter_ns\nfrom uuid import uuid4\nfrom typing import TypedDict\n\nfrom sqlalchemy import select,insert,update,func\nfrom langgraph.graph import StateGraph,START,END\n\nfrom backend.app.persistence.transaction import unit_of_work\nfrom backend.app.persistence.database import PersistenceError\nfrom backend.app.security.errors import AuthError\nfrom backend.app.services.business import table as business_table\nfrom .contracts import (RunSnapshot,StepRecord,FrameworkError,ExtractRequest,\n    InspectRequest,ValidateRequest,ReportRequest)\nfrom .invocation import ROLE_CONTRACTS,InvocationFailure,invoke_role,accept_role_output\nfrom .postgres import runs,jobs,steps,payload,digest\nfrom .runtime import Workflow,_boundary\n\nPHASE_ROLES={'extract':('A02',),'review':('A04_A05','A06','A07')}\nRESULT_FIELDS={'A02':'criteria','A04_A05':'inspection','A06':'validated','A07':'report'}\n\n\ndef stage_request(snapshot,fixed,role):\n    context=snapshot.context\n    if role=='A02':return ExtractRequest(context=context,document=fixed['document'],synthetic=snapshot.synthetic)\n    if role=='A07':return ReportRequest(context=context,validated=snapshot.validated,evidence=snapshot.evidence,synthetic=snapshot.synthetic)\n    request=InspectRequest(context=context,criteria=snapshot.criteria.criteria,asset=fixed['asset'],\n                           evidence=snapshot.evidence,synthetic=snapshot.synthetic)\n    if role=='A04_A05':return request\n    return ValidateRequest(**payload(request),inspection=snapshot.inspection)\n\n\n@dataclass(frozen=True)\nclass Claim:\n    job_id: object\n    run_id: str\n    project_id: object\n    phase: str\n    token: object\n\n\nclass PostgresQueue:\n    def __init__(self,store,*,lease_seconds=90):\n        if type(lease_seconds) is not int or not 1\u003c=lease_seconds\u003c=3600:raise ValueError('invalid lease')\n        self.store,self.engine,self.lease_seconds=store,store.engine,lease_seconds\n\n    def _lock(self,c,claim,*,skip=False):\n        project=business_table('projects')\n        if c.execute(select(project.c.project_id).where(project.c.project_id==claim.project_id)\n                     .with_for_update(key_share=True,skip_locked=skip)).scalar_one_or_none() is None:return None\n        run=c.execute(select(runs).where(runs.c.run_id==claim.run_id).with_for_update(skip_locked=skip)).mappings().one_or_none()\n        job=c.execute(select(jobs).where(jobs.c.job_id==claim.job_id).with_for_update(skip_locked=skip)).mappings().one_or_none()\n        if not run or not job:return None\n        return dict(run),dict(job)\n\n    def _live(self,c,claim,*,authorize=True):\n        rows=self._lock(c,claim)\n        if rows is None:raise AuthError('FRAMEWORK_AUTHORITY_LOST',409)\n        run,job=rows\n        now=c.execute(select(func.clock_timestamp())).scalar_one()\n        if (job['state']!='running' or job['worker_token']!=claim.token or job['lease_expires_at']\u003c=now\n            or run['configuration_sha256']!=self.store.config_hash or run['runtime_sha256']!=self.store.runtime_hash):\n            raise AuthError('FRAMEWORK_AUTHORITY_LOST',409)\n        if authorize:self.store.worker_access(c,run['project_id'],run['actor_id'])\n        return run,job,now\n\n    def claim_next(self):\n        claim=None\n        with unit_of_work(self.engine) as c:\n            candidates=c.execute(select(jobs).join(runs,runs.c.run_id==jobs.c.run_id).where(\n                jobs.c.state=='queued',runs.c.configuration_sha256==self.store.config_hash,\n                runs.c.runtime_sha256==self.store.runtime_hash).order_by(jobs.c.created_at,jobs.c.job_id).limit(64)).mappings().all()\n            for candidate in candidates:\n                candidate=Claim(candidate['job_id'],candidate['run_id'],candidate['project_id'],candidate['phase'],None)\n                locked=self._lock(c,candidate,skip=True)\n                if locked is None:continue\n                run,job=locked\n                if job['state']!='queued':continue\n                now=c.execute(select(func.clock_timestamp())).scalar_one()\n                if job['attempt_no']\u003e=3:\n                    self._close(c,run,job,FrameworkError(code='ATTEMPT_LIMIT_EXCEEDED',message='The safe claim limit was reached.'))\n                    continue\n                try:self.store.worker_access(c,run['project_id'],run['actor_id'])\n                except AuthError:\n                    self._close(c,run,job,FrameworkError(code='FRAMEWORK_ACCESS_REVOKED',message='Project execution access was revoked.'))\n                    continue\n                token=uuid4()\n                c.execute(update(jobs).where(jobs.c.job_id==job['job_id']).values(state='running',attempt_no=job['attempt_no']+1,\n                    worker_token=token,lease_expires_at=now+timedelta(seconds=self.lease_seconds),heartbeat_at=now))\n                snapshot=RunSnapshot.model_validate(run['snapshot_json'])\n                self.store._save(c,snapshot.model_copy(update={'execution_status':'extracting' if job['phase']=='extract' else 'reviewing'}))\n                self.store.event(c,run['run_id'],'job.claimed',phase=job['phase'],attempt=job['attempt_no']+1)\n                claim=Claim(job['job_id'],job['run_id'],job['project_id'],job['phase'],token)\n                break\n        # Only a confirmed commit returns authority to invoke any adapter.\n        return claim\n\n    def heartbeat(self,claim):\n        with unit_of_work(self.engine) as c:\n            _run,_job,now=self._live(c,claim)\n            c.execute(update(jobs).where(jobs.c.job_id==claim.job_id).values(\n                heartbeat_at=now,lease_expires_at=now+timedelta(seconds=self.lease_seconds)))\n\n    def begin_step(self,claim,role):\n        with unit_of_work(self.engine) as c:\n            run,job,now=self._live(c,claim)\n            snapshot=RunSnapshot.model_validate(run['snapshot_json'])\n            completed={s.role for s in snapshot.step_records if s.status in ('completed','reused')}\n            remaining=[r for r in PHASE_ROLES[job['phase']] if r not in completed]\n            if not remaining or remaining[0]!=role:raise AuthError('FRAMEWORK_STAGE_CONFLICT',409)\n            if any(s.status=='running' for s in snapshot.step_records):raise AuthError('FRAMEWORK_CALL_ALREADY_STARTED',409)\n            request=stage_request(snapshot,run['input_json'],role)\n            record=StepRecord(ordinal=len(snapshot.step_records)+1,role=role,status='running',\n                              recorded_at=now,started_at=now,synthetic=snapshot.synthetic)\n            c.execute(insert(steps).values(run_id=run['run_id'],ordinal=record.ordinal,role=role,state='running',\n                                           record_json=payload(record),input_sha256=digest(request)))\n            self.store._save(c,snapshot.model_copy(update={'step_records':snapshot.step_records+(record,)}))\n            self.store.event(c,run['run_id'],'step.started',role=role,ordinal=record.ordinal)\n        return request\n\n    def complete_step(self,claim,role,request,result,duration_ms):\n        with unit_of_work(self.engine) as c:\n            run,job,now=self._live(c,claim)\n            snapshot=RunSnapshot.model_validate(run['snapshot_json'])\n            record=snapshot.step_records[-1]\n            stored=c.execute(select(steps).where(steps.c.run_id==run['run_id'],steps.c.role==role)).mappings().one()\n            if (record.role!=role or record.status!='running' or stored['state']!='running'\n                    or stored['input_sha256']!=digest(request)):raise AuthError('FRAMEWORK_STAGE_CONFLICT',409)\n            result=accept_role_output(role,request,result)\n            synthetic=snapshot.synthetic or result.synthetic\n            result=_boundary(type(result),result.model_copy(update={'synthetic':synthetic}))\n            finished=record.model_copy(update={'status':'completed','finished_at':max(now,record.started_at),\n                                              'duration_ms':duration_ms,'synthetic':synthetic})\n            changes={RESULT_FIELDS[role]:result,'synthetic':synthetic,'stages':snapshot.stages+(role,),\n                     'step_records':snapshot.step_records[:-1]+(finished,)}\n            if role=='A06':changes['machine_verdict']=result.verdict\n            if role in ('A02','A07'):changes['execution_status']='waiting_criteria' if role=='A02' else 'waiting_review'\n            accepted=_boundary(RunSnapshot,snapshot.model_copy(update=changes))\n            c.execute(update(steps).where(steps.c.run_id==run['run_id'],steps.c.role==role).values(state='completed',\n                record_json=payload(finished),output_json=payload(result),output_sha256=digest(result)))\n            self.store._save(c,accepted)\n            self.store.event(c,run['run_id'],'step.completed',role=role,output_sha256=digest(result))\n            if role in ('A02','A07'):self._finish_job(c,job,'completed')\n        return accepted\n\n    def _finish_job(self,c,job,state,*,error=None):\n        c.execute(update(jobs).where(jobs.c.job_id==job['job_id']).values(state=state,worker_token=None,\n            lease_expires_at=None,finished_at=func.clock_timestamp(),error_json=payload(error) if error else None))\n\n    def _close(self,c,run,job,error,*,top_code=None,duration_ms=None):\n        snapshot=RunSnapshot.model_validate(run['snapshot_json'])\n        records=snapshot.step_records\n        if records and records[-1].status=='running':\n            now=c.execute(select(func.clock_timestamp())).scalar_one()\n            record=records[-1]\n            closed=record.model_copy(update={'status':'outcome_unknown' if error.outcome_unknown else 'failed',\n                'finished_at':max(now,record.started_at),\n                'duration_ms':None if error.outcome_unknown else (duration_ms if duration_ms is not None else max(0,(now-record.started_at).total_seconds()*1000)),'error':error})\n            c.execute(update(steps).where(steps.c.run_id==run['run_id'],steps.c.ordinal==record.ordinal).values(\n                state=closed.status,record_json=payload(closed)))\n            records=records[:-1]+(closed,)\n        status='outcome_unknown' if error.outcome_unknown else 'failed'\n        top=error.model_copy(update={'code':top_code}) if top_code else error\n        self.store._save(c,snapshot.model_copy(update={'execution_status':status,'error':top,'step_records':records}))\n        self._finish_job(c,job,status,error=error)\n        self.store.event(c,run['run_id'],'job.'+status,code=error.code)\n\n    def fail(self,claim,exc,*,duration_ms=None):\n        error=Workflow._step_error(exc)\n        if isinstance(exc,AuthError) and exc.code=='FRAMEWORK_ACCESS_REVOKED':\n            error=error.model_copy(update={'code':exc.code})\n        with unit_of_work(self.engine) as c:\n            run,job,_now=self._live(c,claim,authorize=False)\n            self._close(c,run,job,error,top_code='contract_violation' if isinstance(exc,InvocationFailure) else None,duration_ms=duration_ms)\n\n    def recover_expired(self):\n        recovered={}\n        with unit_of_work(self.engine) as c:\n            candidates=c.execute(select(jobs).where(jobs.c.state=='running',jobs.c.lease_expires_at\u003c=func.clock_timestamp())\n                                 .order_by(jobs.c.lease_expires_at).limit(64)).mappings().all()\n            for row in candidates:\n                claim=Claim(row['job_id'],row['run_id'],row['project_id'],row['phase'],row['worker_token'])\n                locked=self._lock(c,claim,skip=True)\n                if locked is None:continue\n                run,job=locked\n                now=c.execute(select(func.clock_timestamp())).scalar_one()\n                if job['state']!='running' or job['lease_expires_at']\u003enow:continue\n                snapshot=RunSnapshot.model_validate(run['snapshot_json'])\n                if any(s.status=='running' for s in snapshot.step_records):\n                    self._close(c,run,job,FrameworkError(code='EXECUTION_OUTCOME_UNKNOWN',\n                        message='A worker stopped after a role dispatch marker. Reconcile before a new run.',outcome_unknown=True))\n                    recovered[run['run_id']]='outcome_unknown'\n                elif job['attempt_no']\u003e=3:\n                    self._close(c,run,job,FrameworkError(code='ATTEMPT_LIMIT_EXCEEDED',message='The safe claim limit was reached.'))\n                    recovered[run['run_id']]='failed'\n                else:\n                    c.execute(update(jobs).where(jobs.c.job_id==job['job_id']).values(state='queued',worker_token=None,lease_expires_at=None))\n                    self.store._save(c,snapshot.model_copy(update={'execution_status':'queued'}))\n                    self.store.event(c,run['run_id'],'job.safely_requeued',attempt=job['attempt_no'])\n                    recovered[run['run_id']]='queued'\n        return recovered\n\n\nclass Lease:\n    def __init__(self,queue,claim,interval):\n        self.queue,self.claim,self.interval=queue,claim,interval\n        self.stop=Event();self.lost=Event();self.thread=Thread(target=self.renew,daemon=True)\n    def renew(self):\n        while not self.stop.wait(self.interval):\n            try:self.queue.heartbeat(self.claim)\n            except Exception:self.lost.set();return\n    def check(self):\n        if self.lost.is_set():raise AuthError('FRAMEWORK_AUTHORITY_LOST',409)\n    def __enter__(self):self.thread.start();return self\n    def __exit__(self,*_):self.stop.set();self.thread.join(timeout=15);self.lost.set()\n\n\nclass _PhaseState(TypedDict):\n    outcome: str\n\n\ndef execute_claim(queue,claim,agents,*,heartbeat_seconds=15,stop=None):\n    \"\"\"LangGraph schedules roles; committed PostgreSQL rows own resume decisions.\n\n    A stop between committed roles safely releases the lease via expiry. No\n    LangGraph checkpoint is claimed to share the business transaction.\n    \"\"\"\n    with Lease(queue,claim,heartbeat_seconds) as authority:\n        def execute_role(role):\n            if stop is not None and stop.is_set():return 'draining'\n            started=None\n            try:\n                authority.check()\n                with unit_of_work(queue.engine) as c:\n                    run,_job,_now=queue._live(c,claim)\n                    snapshot=RunSnapshot.model_validate(run['snapshot_json'])\n                if any(s.role==role and s.status=='completed' for s in snapshot.step_records):return 'continue'\n                request=queue.begin_step(claim,role)\n                started=perf_counter_ns()\n                result=invoke_role(role,getattr(agents,ROLE_CONTRACTS[role][0]),request)\n                duration=max(0,perf_counter_ns()-started)/1_000_000\n                authority.check()\n                queue.complete_step(claim,role,request,result,duration)\n            except PersistenceError:\n                # COMMIT may have succeeded. Do not guess, fail another step, or\n                # call the provider again. The lease/recovery path reconciles it.\n                return 'database_unavailable'\n            except Exception as exc:\n                if isinstance(exc,AuthError) and exc.code=='FRAMEWORK_AUTHORITY_LOST':\n                    return 'authority_lost'\n                try:\n                    queue.fail(claim,exc,duration_ms=max(0,perf_counter_ns()-started)/1_000_000 if started is not None else None)\n                except (AuthError,PersistenceError):return 'authority_lost'\n                return 'outcome_unknown' if getattr(exc,'outcome_unknown',False) else 'failed'\n            return 'continue'\n        graph=StateGraph(_PhaseState)\n        roles=PHASE_ROLES[claim.phase]\n        for role in roles:\n            def node(_state,role=role):return {'outcome':execute_role(role)}\n            graph.add_node(role,node)\n        graph.add_edge(START,roles[0])\n        for index,role in enumerate(roles):\n            following=roles[index+1] if index+1\u003clen(roles) else END\n            graph.add_conditional_edges(role,lambda state:'next' if state['outcome']=='continue' else 'stop',\n                                        {'next':following,'stop':END})\n        result=graph.compile().invoke({'outcome':'continue'},{'recursion_limit':12})\n        return 'completed' if result['outcome']=='continue' else result['outcome']\n","sha256":"c71cd4f22b642a3e980604c1df93db32c1578193fa3a3d2fb69fed1b8809a529"},"backend/agent_framework/files.py":{"text":"\"\"\"Read existing stored media by authorized metadata, then verify actual bytes.\n\nThis module owns no uploads, storage roots, database connections or credentials.\nCatalogs must authorize a trusted caller and bind a file to its immutable version.\nModel adapters receive verified bytes, never an arbitrary request-supplied path.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom hashlib import sha256\nfrom io import BytesIO\nfrom typing import Literal, Protocol\nimport warnings\n\nfrom pydantic import BaseModel, Field\n\nfrom .contracts import AssetRef, Context, Contract, DocumentRef, Hash, Identifier\nfrom .ports import AdapterFailure\n\n\nclass StoredFileMetadata(Contract):\n    \"\"\"Internal catalog result; storage_key is not part of the role request API.\"\"\"\n    file_id: Identifier\n    project_id: Identifier\n    version_id: Identifier\n    kind: Literal[\"pdf\", \"poster\"]\n    storage_key: str = Field(min_length=1, repr=False)\n    media_type: Literal[\"application/pdf\", \"image/png\", \"image/jpeg\", \"image/webp\"]\n    byte_size: int = Field(gt=0, strict=True)\n    sha256: Hash\n    width: int | None = Field(default=None, gt=0, strict=True)\n    height: int | None = Field(default=None, gt=0, strict=True)\n    coordinate_space: Literal[\"encoded\", \"display\"] = \"display\"\n\n\nclass FileCatalog(Protocol):\n    def lookup_document(self, context: Context, reference: DocumentRef) -\u003e StoredFileMetadata: ...\n    def lookup_asset(self, context: Context, reference: AssetRef) -\u003e StoredFileMetadata: ...\n\n\nclass StoredBytes(Protocol):\n    def read(self, metadata: StoredFileMetadata, maximum: int) -\u003e bytes:\n        \"\"\"Read at most maximum + 1 bytes using the existing storage backend.\"\"\"\n        ...\n\n\n@dataclass(frozen=True)\nclass FileLimits:\n    max_document_bytes: int = 20 * 1024 * 1024\n    max_document_pages: int = 50\n    max_asset_bytes: int = 40 * 1024 * 1024\n    max_image_pixels: int = 10_000_000\n    max_image_dimension: int = 8192\n\n    def __post_init__(self):\n        if any(type(value) is not int or value \u003c= 0 for value in vars(self).values()):\n            raise ValueError(\"File limits must be positive integers\")\n\n\n@dataclass(frozen=True)\nclass VerifiedDocument:\n    context: Context\n    reference: DocumentRef\n    content: bytes = field(repr=False)\n    page_count: int\n\n    @property\n    def byte_size(self) -\u003e int:\n        return len(self.content)\n\n\n@dataclass(frozen=True)\nclass VerifiedPoster:\n    context: Context\n    reference: AssetRef\n    content: bytes = field(repr=False)\n    width: int\n    height: int\n    encoded_width: int\n    encoded_height: int\n    exif_orientation: int\n    coordinate_space: Literal[\"encoded\", \"display\"]\n\n    @property\n    def byte_size(self) -\u003e int:\n        return len(self.content)\n\n\ndef _fail(code: str, message: str):\n    raise AdapterFailure(code, message)\n\n\ndef _checked(model, value, *, metadata=False):\n    try:\n        if isinstance(value, BaseModel):\n            if not isinstance(value, model):\n                raise ValueError(\"unexpected contract\")\n            value = value.model_dump(mode=\"python\", warnings=False)\n        return model.model_validate(value).model_copy(deep=True)\n    except (ValueError, TypeError):\n        _fail(\"FILE_METADATA_INVALID\" if metadata else \"CONTRACT_INVALID\",\n              \"The file metadata or reference does not match its contract.\")\n\n\nclass VerifiedFileAccess:\n    \"\"\"Resolve one authorized file/version and verify the bytes actually returned.\n\nConstruction performs no I/O. A catalog must bind an authenticated actor outside\nContext; the actor_id sent in a role request is not proof of authorization.\n\"\"\"\n    def __init__(self, catalog: FileCatalog, reader: StoredBytes, *, limits: FileLimits | None = None):\n        self.catalog, self.reader = catalog, reader\n        self.limits = limits or FileLimits()\n\n    def _metadata(self, context, reference, kind):\n        try:\n            lookup = self.catalog.lookup_document if kind == \"pdf\" else self.catalog.lookup_asset\n            metadata = _checked(StoredFileMetadata, lookup(context.model_copy(deep=True),\n                                                          reference.model_copy(deep=True)), metadata=True)\n        except AdapterFailure:\n            raise\n        except Exception:\n            _fail(\"FILE_UNAVAILABLE\", \"Authorized file metadata could not be resolved.\")\n        if metadata.project_id != context.project_id:\n            _fail(\"FILE_SCOPE_MISMATCH\", \"The file belongs to a different project.\")\n        if metadata.file_id != reference.file_id or metadata.kind != kind:\n            _fail(\"FILE_REFERENCE_MISMATCH\", \"The file does not match the requested media reference.\")\n        version = reference.document_version_id if kind == \"pdf\" else reference.asset_version_id\n        if metadata.version_id != version:\n            _fail(\"FILE_VERSION_MISMATCH\", \"The file is not bound to the requested version.\")\n        if metadata.media_type != reference.media_type:\n            _fail(\"FILE_MEDIA_TYPE_MISMATCH\", \"The stored media type differs from the reference.\")\n        if metadata.sha256 != reference.sha256:\n            _fail(\"FILE_HASH_MISMATCH\", \"The stored hash differs from the reference.\")\n        if kind == \"poster\":\n            if metadata.width is None or metadata.height is None:\n                _fail(\"FILE_METADATA_INVALID\", \"Poster metadata must specify its coordinate dimensions.\")\n            if (metadata.width, metadata.height) != (reference.width, reference.height):\n                _fail(\"IMAGE_DIMENSIONS_MISMATCH\", \"Poster dimensions differ from the reference.\")\n        return metadata\n\n    def _bytes(self, metadata, maximum):\n        if metadata.byte_size \u003e maximum:\n            _fail(\"FILE_TOO_LARGE\", \"The stored file exceeds the configured byte limit.\")\n        try:\n            content = self.reader.read(metadata.model_copy(deep=True), maximum)\n        except AdapterFailure:\n            raise\n        except Exception:\n            _fail(\"FILE_UNAVAILABLE\", \"The stored file could not be read.\")\n        if not isinstance(content, bytes):\n            _fail(\"FILE_FORMAT_INVALID\", \"The storage reader must return immutable bytes.\")\n        if len(content) \u003e maximum:\n            _fail(\"FILE_TOO_LARGE\", \"The file exceeds the configured byte limit.\")\n        if len(content) != metadata.byte_size:\n            _fail(\"FILE_SIZE_MISMATCH\", \"The file length differs from stored metadata.\")\n        if sha256(content).hexdigest() != metadata.sha256:\n            _fail(\"FILE_HASH_MISMATCH\", \"The actual file bytes differ from the stored hash.\")\n        return content\n\n    def read_document(self, context: Context, reference: DocumentRef) -\u003e VerifiedDocument:\n        context, reference = _checked(Context, context), _checked(DocumentRef, reference)\n        if context.document_version_id != reference.document_version_id:\n            _fail(\"DOCUMENT_VERSION_MISMATCH\", \"The document reference differs from the execution context.\")\n        metadata = self._metadata(context, reference, \"pdf\")\n        content = self._bytes(metadata, self.limits.max_document_bytes)\n        if not content.startswith(b\"%PDF-\"):\n            _fail(\"FILE_FORMAT_INVALID\", \"The document is not a readable PDF.\")\n        import pymupdf\n        try:\n            with pymupdf.open(stream=content, filetype=\"pdf\") as document:\n                if document.is_encrypted or document.needs_pass or document.page_count \u003c 1:\n                    _fail(\"FILE_FORMAT_INVALID\", \"An unencrypted PDF with readable pages is required.\")\n                if document.page_count \u003e self.limits.max_document_pages:\n                    _fail(\"FILE_TOO_LARGE\", \"The PDF exceeds the configured page limit.\")\n                count = document.page_count\n                # Load every page's structure without OCR, rendering or inference.\n                for page in document:\n                    if page.rect.is_empty or page.rect.is_infinite:\n                        _fail(\"FILE_FORMAT_INVALID\", \"The PDF contains an invalid page.\")\n        except AdapterFailure:\n            raise\n        except Exception:\n            _fail(\"FILE_FORMAT_INVALID\", \"The PDF container could not be read.\")\n        if count != reference.page_count:\n            _fail(\"PDF_PAGE_COUNT_MISMATCH\", \"The PDF page count differs from the reference.\")\n        return VerifiedDocument(context, reference, content, count)\n\n    def read_asset(self, context: Context, reference: AssetRef) -\u003e VerifiedPoster:\n        context, reference = _checked(Context, context), _checked(AssetRef, reference)\n        if context.asset_version_id != reference.asset_version_id:\n            _fail(\"ASSET_VERSION_MISMATCH\", \"The asset reference differs from the execution context.\")\n        metadata = self._metadata(context, reference, \"poster\")\n        content = self._bytes(metadata, self.limits.max_asset_bytes)\n        from PIL import Image\n\n        try:\n            with warnings.catch_warnings():\n                warnings.simplefilter(\"error\", Image.DecompressionBombWarning)\n                with Image.open(BytesIO(content)) as image:\n                    mime = {\"PNG\": \"image/png\", \"JPEG\": \"image/jpeg\", \"WEBP\": \"image/webp\"}.get(image.format)\n                    if mime is None or getattr(image, \"n_frames\", 1) != 1:\n                        _fail(\"FILE_FORMAT_INVALID\", \"A static PNG, JPEG or WebP poster is required.\")\n                    if mime != reference.media_type:\n                        _fail(\"FILE_MEDIA_TYPE_MISMATCH\", \"The actual image format differs from the reference.\")\n                    encoded_width, encoded_height = image.size\n                    if (min(image.size) \u003c 1 or max(image.size) \u003e self.limits.max_image_dimension\n                            or encoded_width * encoded_height \u003e self.limits.max_image_pixels):\n                        _fail(\"FILE_TOO_LARGE\", \"The poster exceeds the configured pixel limits.\")\n                    image.verify()\n                with Image.open(BytesIO(content)) as image:\n                    image.load()\n                    orientation = image.getexif().get(274, 1)\n                    if type(orientation) is not int or orientation not in range(1, 9):\n                        _fail(\"FILE_FORMAT_INVALID\", \"The poster contains an invalid orientation.\")\n        except AdapterFailure:\n            raise\n        except Exception:\n            _fail(\"FILE_FORMAT_INVALID\", \"The poster image could not be decoded.\")\n        width, height = encoded_width, encoded_height\n        if metadata.coordinate_space == \"display\" and orientation in {5, 6, 7, 8}:\n            width, height = height, width\n        if (width, height) != (reference.width, reference.height):\n            _fail(\"IMAGE_DIMENSIONS_MISMATCH\", \"The actual poster dimensions differ from the reference.\")\n        return VerifiedPoster(context, reference, content, width, height, encoded_width,\n                              encoded_height, orientation, metadata.coordinate_space)\n","sha256":"aac514642877c2df41acb6659fc22ac021b092bb472b5483470ed77330c4871c"},"backend/agent_framework/flow_checks.py":{"text":"\"\"\"Explicit development rehearsal of configured approval/re-review workflows.\n\nApprovals are scripted test inputs. The command may invoke real developer-owned\nadapters if explicitly configured; it never proves authenticated human approval,\nmodel accuracy or production connectivity. No retries, queues or DB writes are\nintroduced here. Workflow state remains in memory.\n\"\"\"\nfrom __future__ import annotations\n\nfrom hashlib import sha256\nimport json\nfrom pathlib import Path\nfrom typing import Literal\n\nfrom pydantic import Field, model_validator\n\nfrom .composition import TeamConfiguration, build_agents, describe_configuration\nfrom .contracts import Approval, AssetRef, Context, Contract, DocumentRef, Identifier, Verdict\nfrom .runtime import Workflow\n\n\nclass FlowCheckCase(Contract):\n    id: Identifier\n    context: Context\n    document: DocumentRef\n    asset: AssetRef\n    revision_context: Context\n    revision_asset: AssetRef\n    expected_initial_verdict: Verdict\n    # Normal final approval requires pass; exception approval is a separate policy.\n    expected_revised_verdict: Literal[\"pass\"] = \"pass\"\n    change_reason: str = Field(min_length=1)\n\n    @model_validator(mode=\"after\")\n    def fixed_scope(self):\n        old, new = self.context, self.revision_context\n        if (old.parent_run_id is not None or new.parent_run_id != old.run_id\n                or old.run_id == new.run_id or old.project_id != new.project_id\n                or old.document_version_id != new.document_version_id\n                or old.criteria_version_id != new.criteria_version_id\n                or self.document.document_version_id != old.document_version_id\n                or old.asset_version_id != self.asset.asset_version_id\n                or new.asset_version_id != self.revision_asset.asset_version_id\n                or self.asset.asset_version_id == self.revision_asset.asset_version_id):\n            raise ValueError(\"a flow check requires fixed document/criteria and a new child run/poster version\")\n        if not self.change_reason.strip():\n            raise ValueError(\"scripted change approval requires a reason\")\n        return self\n\n\nclass FlowCaseError(ValueError):\n    \"\"\"Malformed local test input, detected before any configured factory runs.\"\"\"\n\n\ndef _unique_object(pairs):\n    result = {}\n    for key, value in pairs:\n        if key in result:\n            raise ValueError(\"duplicate JSON key\")\n        result[key] = value\n    return result\n\n\ndef _invalid_constant(_value):\n    raise ValueError(\"nonstandard JSON constant\")\n\n\ndef load_flow_case(path: str | Path) -\u003e FlowCheckCase:\n    try:\n        value = json.loads(Path(path).read_text(encoding=\"utf-8-sig\"),\n                           object_pairs_hook=_unique_object, parse_constant=_invalid_constant)\n        return FlowCheckCase.model_validate(value)\n    except (ValueError, TypeError):\n        raise FlowCaseError(\"The workflow fixture is invalid.\") from None\n\n\ndef _digest(value) -\u003e str:\n    raw = value.model_dump(mode=\"json\") if isinstance(value, Contract) else value\n    return sha256(json.dumps(raw, ensure_ascii=False, sort_keys=True,\n                             separators=(\",\", \":\"), allow_nan=False).encode(\"utf-8\")).hexdigest()\n\n\ndef run_flow_check(case: FlowCheckCase, configuration: TeamConfiguration) -\u003e dict:\n    \"\"\"Run one fixed six-action rehearsal, stopping at the first discrepancy.\n\n    Revalidate copied inputs before importing any factory. Report accepted\n    result hashes and timing/error metadata, never raw media or role payloads.\n    \"\"\"\n    case = FlowCheckCase.model_validate(case.model_dump(mode=\"python\", warnings=False)).model_copy(deep=True)\n    configuration = TeamConfiguration.model_validate(configuration.model_dump(mode=\"python\", warnings=False))\n    workflow = Workflow(build_agents(configuration), profile=configuration.profile)\n    original, revised = case.context, case.revision_context\n    actions = []\n    stopped = False\n    unknown = False\n    parent_snapshot = None\n    roles = (\"A02\", \"A04_A05\", \"A06\", \"A07\")\n\n    def approve(context, decision, **fields):\n        return workflow.approve(context.run_id, Approval(context=context,\n            actor_id=context.actor_id, decision=decision, **fields))\n\n    plan = [\n        (\"start\", original, \"waiting_criteria\", None, \"unreviewed\",\n         lambda: workflow.start(original, case.document, case.asset)),\n        (\"approve_criteria\", original, \"waiting_review\", case.expected_initial_verdict, \"unreviewed\",\n         lambda: approve(original, \"approve_criteria\")),\n        (\"approve_changes\", original, \"waiting_revision\", case.expected_initial_verdict, \"changes_approved\",\n         lambda: approve(original, \"approve_changes\", reason=case.change_reason)),\n        (\"rereview\", revised, \"waiting_criteria\", None, \"unreviewed\",\n         lambda: workflow.rereview(original.run_id, revised, case.revision_asset)),\n        (\"approve_revised_criteria\", revised, \"waiting_review\", case.expected_revised_verdict, \"unreviewed\",\n         lambda: approve(revised, \"approve_criteria\")),\n        (\"approve_final\", revised, \"completed\", case.expected_revised_verdict, \"final_approved\",\n         lambda: approve(revised, \"approve_final\")),\n    ]\n    for action, context, expected_status, expected_verdict, expected_human, execute in plan:\n        item = {\"action\": action, \"run_id\": context.run_id}\n        if stopped:\n            actions.append({**item, \"status\": \"skipped\", \"reason\": \"PRIOR_FLOW_FAILURE\"})\n            continue\n        # Workflow handles adapter failures and sanitizes their errors. Only\n        # local workflow conflicts reach this boundary; never emit their text.\n        try:\n            snapshot = execute()\n        except Exception:\n            actions.append({**item, \"status\": \"failed\", \"reason\": \"WORKFLOW_ACTION_FAILED\"})\n            stopped = True\n            continue\n        records = snapshot.step_records\n        item.update(execution_status=snapshot.execution_status,\n                    machine_verdict=snapshot.machine_verdict, human_decision=snapshot.human_decision,\n                    synthetic=snapshot.synthetic, snapshot_sha256=_digest(snapshot),\n                    records=[record.model_dump(mode=\"json\") for record in records])\n        # Check the real accepted sequence instead of inferring progress from a\n        # successful HTTP/status return or a callback that returned invalid data.\n        expected_roles = roles[:1] if action in {\"start\", \"rereview\"} else roles\n        expected_states = tuple(\"reused\" if context.parent_run_id and role == \"A02\" else \"completed\"\n                                for role in expected_roles)\n        reason = None\n        if snapshot.error is not None:\n            reason = \"STAGE_FAILED\"\n            unknown = snapshot.error.outcome_unknown\n            failed = next((r for r in reversed(records) if r.error is not None), None)\n            error = failed.error if failed else snapshot.error\n            item[\"error\"] = {\"code\": error.code, \"retryable\": error.retryable,\n                             \"outcome_unknown\": error.outcome_unknown}\n        elif snapshot.context != context or snapshot.execution_status != expected_status:\n            reason = \"STATE_MISMATCH\"\n        elif snapshot.machine_verdict != expected_verdict:\n            reason = \"VERDICT_MISMATCH\"\n        elif snapshot.human_decision != expected_human:\n            reason = \"HUMAN_DECISION_MISMATCH\"\n        elif tuple(r.role for r in records) != expected_roles or tuple(r.status for r in records) != expected_states:\n            reason = \"STAGE_SEQUENCE_MISMATCH\"\n        elif context.parent_run_id and records[0].source_run_id != original.run_id:\n            reason = \"REUSE_SOURCE_MISMATCH\"\n        if action == \"approve_changes\":\n            parent_snapshot = snapshot\n        if context.parent_run_id and workflow.get(original.run_id) != parent_snapshot:\n            reason = reason or \"PARENT_CHANGED\"\n        item[\"status\"] = \"failed\" if reason else \"passed\"\n        if reason:\n            item[\"reason\"] = reason\n            stopped = True\n        actions.append(item)\n    counts = {status: sum(a[\"status\"] == status for a in actions)\n              for status in (\"passed\", \"failed\", \"skipped\")}\n    return {\"contract_version\": \"2.0.0\", \"check\": \"configured_workflow\", \"case_id\": case.id,\n            \"case_sha256\": _digest(case), \"configuration_sha256\": _digest(configuration),\n            \"profile\": configuration.profile, \"storage\": \"memory\", \"passed\": not stopped,\n            \"stopped_on_outcome_unknown\": unknown,\n            \"configuration\": describe_configuration(configuration),\n            \"summary\": {\"total\": len(actions), **counts}, \"actions\": actions,\n            \"connection_verified\": False, \"production_ready\": False,\n            \"scripted_approvals\": True,\n            \"notice\": \"Explicit developer rehearsal with scripted approvals. Hashes cover canonical validated JSON. \"\n                      \"Not authenticated human approval, model accuracy, production persistence or connectivity verification.\"}\n","sha256":"3ee95cac65f4d04e53570b63892385263704c169beadf21f132d1548f26fc1ea"},"backend/agent_framework/invocation.py":{"text":"\"\"\"One synchronous contract boundary for standalone roles and workflow stages.\n\nInputs and outputs are copied and revalidated. Providers receive no mutable\nreference to the caller's data or the baseline used for scope validation.\n\"\"\"\nfrom __future__ import annotations\n\nimport inspect\nimport re\nfrom typing import Any\n\nfrom pydantic import BaseModel\n\nfrom .contracts import (\n    CriteriaDraft, ExtractRequest, InspectionResult,\n    InspectRequest, ReportDraft, ReportRequest,\n    ValidateRequest, ValidatedResult,\n)\nfrom .ports import AdapterFailure\nfrom .validation import (\n    _criteria, ensure_context, validate_draft,\n    validate_inspection, validate_report, validate_report_request, validate_validated,\n)\n\n\nROLE_CONTRACTS = {\n    \"A02\": (\"extractor\", \"extract\", ExtractRequest, CriteriaDraft),\n    \"A04_A05\": (\"inspector\", \"inspect\", InspectRequest, InspectionResult),\n    \"A06\": (\"validator\", \"validate\", ValidateRequest, ValidatedResult),\n    \"A07\": (\"reporter\", \"report\", ReportRequest, ReportDraft),\n}\n\n\nclass InvocationFailure(AdapterFailure):\n    \"\"\"A shared boundary rejection, distinguished from provider failures.\"\"\"\n\n\ndef _reject(code: str, message: str) -\u003e None:\n    raise InvocationFailure(code, message)\n\n\ndef _contract(contract: type[BaseModel], value: Any) -\u003e BaseModel:\n    try:\n        if isinstance(value, BaseModel):\n            if not isinstance(value, contract):\n                _reject(\"CONTRACT_INVALID\", \"The value has an unexpected contract type.\")\n            # model_construct/model_copy and even frozen nested models can be\n            # modified without validation, so no incoming BaseModel is trusted.\n            value = value.model_dump(mode=\"python\", warnings=False)\n        return contract.model_validate(value).model_copy(deep=True)\n    except InvocationFailure:\n        raise\n    except (ValueError, TypeError):\n        _reject(\"CONTRACT_INVALID\", \"The value does not match the versioned JSON contract.\")\n\n\ndef _synthetic(value: Any) -\u003e bool:\n    if isinstance(value, dict):\n        return value.get(\"synthetic\") is True or any(_synthetic(item) for item in value.values())\n    if isinstance(value, (list, tuple)):\n        return any(_synthetic(item) for item in value)\n    return False\n\n\ndef _input_policy(role: str, request: BaseModel) -\u003e None:\n    if role == \"A02\":\n        if request.document.document_version_id != request.context.document_version_id:\n            raise ValueError(\"DOCUMENT_VERSION_MISMATCH\")\n    elif role in {\"A04_A05\", \"A06\"}:\n        inspection_request = InspectRequest(context=request.context, criteria=request.criteria,\n            asset=request.asset, evidence=request.evidence, synthetic=request.synthetic)\n        # Empty observations are permitted for A04/A05; this still validates\n        # criteria, approved provenance and the current asset before any call.\n        inspection = (request.inspection if role == \"A06\" else\n                      InspectionResult(context=request.context, observations=()))\n        validate_inspection(inspection_request, inspection)\n    else:\n        validate_report_request(request)\n\n\ndef _output_policy(role: str, request: BaseModel, result: BaseModel) -\u003e None:\n    ensure_context(request.context, result)\n    if role == \"A02\":\n        validate_draft(request.context, request.document, result)\n    else:\n        {\"A04_A05\": validate_inspection,\n         \"A06\": validate_validated, \"A07\": validate_report}[role](request, result)\n\n\ndef _policy(check, *args) -\u003e None:\n    try:\n        check(*args)\n    except ValueError as exc:\n        code = str(exc).split(\":\", 1)[0]\n        if not re.fullmatch(r\"[A-Z][A-Z0-9_]{1,80}\", code):\n            code = \"BOUNDARY_INVALID\"\n        _reject(code, \"The role violates the shared scope, evidence, or verdict policy.\")\n\n\ndef accept_role_output(role: str, request: Any, raw: Any, *, require_synthetic: bool = False) -\u003e BaseModel:\n    \"\"\"Validate an already returned result without invoking any provider again.\"\"\"\n    if role not in ROLE_CONTRACTS:\n        _reject(\"INVALID_ROLE\", \"The selected role is not part of the shared contract.\")\n    _port,_method,request_type,result_type=ROLE_CONTRACTS[role]\n    expected=_contract(request_type,request)\n    _policy(_input_policy,role,expected)\n    result=_contract(result_type,raw)\n    if require_synthetic and not result.synthetic:\n        _reject(\"SYNTHETIC_LABEL_MISSING\", \"Fixture output must explicitly identify itself as synthetic.\")\n    if _synthetic(expected.model_dump(mode=\"python\")) and not result.synthetic:\n        result=result.model_copy(update={\"synthetic\":True},deep=True)\n    _policy(_output_policy,role,expected,result)\n    return result.model_copy(deep=True)\n\n\ndef invoke_role(role: str, adapter: Any, request: Any, *, require_synthetic: bool = False) -\u003e BaseModel:\n    \"\"\"Invoke one role once, validating both sides against an isolated baseline.\n\nThe adapter must expose the synchronous method named by ROLE_CONTRACTS. Raw\ndictionary responses are supported; another role's BaseModel is not. No retry,\nfallback, network request, or persistence is performed by this boundary.\n\"\"\"\n    if role not in ROLE_CONTRACTS:\n        _reject(\"INVALID_ROLE\", \"The selected role is not part of the shared contract.\")\n    _port_name, method_name, request_type, result_type = ROLE_CONTRACTS[role]\n    expected = _contract(request_type, request)\n    _policy(_input_policy, role, expected)\n    method = getattr(adapter, method_name, None)\n    if not callable(method):\n        _reject(\"ADAPTER_NOT_IMPLEMENTED\", \"The selected role does not implement its port.\")\n    if (inspect.iscoroutinefunction(method) or inspect.isasyncgenfunction(method)\n            or inspect.iscoroutinefunction(getattr(method, \"__call__\", None))\n            or inspect.isasyncgenfunction(getattr(method, \"__call__\", None))):\n        _reject(\"ASYNC_ADAPTER_UNSUPPORTED\", \"Role adapters must implement synchronous methods.\")\n    raw = method(expected.model_copy(deep=True))\n    if inspect.isawaitable(raw) or inspect.isasyncgen(raw):\n        # A synchronous wrapper can still return a coroutine. Close native\n        # coroutine objects without starting them or creating a hidden loop.\n        if inspect.iscoroutine(raw):\n            raw.close()\n        _reject(\"ASYNC_ADAPTER_UNSUPPORTED\", \"Role adapters must return a completed synchronous result.\")\n    return accept_role_output(role,expected,raw,require_synthetic=require_synthetic)\n","sha256":"c350cbd6af3410c6a34ee8450aadf80e5b787c1aefec630678e05d7ed2972063"},"backend/agent_framework/ports.py":{"text":"\"\"\"Implement these interfaces without importing another agent's internals or ORM.\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import Protocol, TYPE_CHECKING\n\nfrom .contracts import (CriteriaDraft, ExtractRequest, InspectRequest,\n                        InspectionResult, ReportDraft, ReportRequest,\n                        ValidateRequest, ValidatedResult)\nfrom .contracts import Context, DocumentRef, AssetRef\n\nif TYPE_CHECKING:\n    from .files import VerifiedDocument, VerifiedPoster\n\n\nclass FileAccess(Protocol):\n    def read_document(self, context: Context, reference: DocumentRef) -\u003e VerifiedDocument: ...\n    def read_asset(self, context: Context, reference: AssetRef) -\u003e VerifiedPoster: ...\n\n\nclass Extractor(Protocol):\n    def extract(self, request: ExtractRequest) -\u003e CriteriaDraft: ...\n\n\nclass Inspector(Protocol):\n    def inspect(self, request: InspectRequest) -\u003e InspectionResult: ...\n\n\nclass Validator(Protocol):\n    def validate(self, request: ValidateRequest) -\u003e ValidatedResult: ...\n\n\nclass Reporter(Protocol):\n    def report(self, request: ReportRequest) -\u003e ReportDraft: ...\n\n\n@dataclass(frozen=True)\nclass Agents:\n    extractor: Extractor\n    inspector: Inspector\n    validator: Validator\n    reporter: Reporter\n\n\nclass AdapterFailure(Exception):\n    \"\"\"Safe, structured adapter error. An ambiguous remote call is never retried here.\"\"\"\n    def __init__(self, code: str, message: str, *, retryable=False, outcome_unknown=False):\n        super().__init__(message)\n        self.code, self.message = code, message\n        self.retryable, self.outcome_unknown = retryable, outcome_unknown\n","sha256":"f08368d001f382857c3650f950665167a731cec075751342f97d4fbbcca01831"},"backend/agent_framework/postgres.py":{"text":"\"\"\"M008-backed authenticated command service and durable job/step repository.\n\nUses the existing app Engine, unit_of_work and Authorization. No connection,\nmigration, credentials, model client or worker is opened by construction/import.\n\"\"\"\nfrom datetime import timedelta\nfrom hashlib import sha256\nimport json\nfrom pathlib import Path\nfrom uuid import UUID, uuid4\n\nfrom sqlalchemy import Column, Integer, MetaData, String, Table, select, insert, update, func\nfrom sqlalchemy.dialects.postgresql import JSONB, TIMESTAMP, UUID as PGUUID\n\nfrom backend.app.persistence.transaction import unit_of_work\nfrom backend.app.security.errors import AuthError\nfrom backend.app.services.business import table as business_table\nfrom .contracts import Approval, AssetRef, Context, DocumentRef, RunSnapshot, StepTimeline\nfrom .composition import TeamConfiguration\nfrom .ports import Agents\nfrom .runtime import Workflow, _boundary\n\nmetadata = MetaData(schema='agent_framework')\ndef _table(name, columns):\n    return Table(name, metadata, *(Column(key, kind) for key, kind in columns))\n\nruns = _table('runs', [('run_id',String),('project_id',PGUUID(as_uuid=True)),('actor_id',PGUUID(as_uuid=True)),\n    ('parent_run_id',String),('input_json',JSONB),('input_sha256',String),('configuration_json',JSONB),\n    ('configuration_sha256',String),('runtime_sha256',String),('snapshot_json',JSONB),\n    ('created_at',TIMESTAMP(timezone=True)),('updated_at',TIMESTAMP(timezone=True))])\njobs = _table('jobs', [('job_id',PGUUID(as_uuid=True)),('run_id',String),('project_id',PGUUID(as_uuid=True)),\n    ('phase',String),('state',String),('attempt_no',Integer),('worker_token',PGUUID(as_uuid=True)),\n    ('lease_expires_at',TIMESTAMP(timezone=True)),('heartbeat_at',TIMESTAMP(timezone=True)),\n    ('created_at',TIMESTAMP(timezone=True)),('finished_at',TIMESTAMP(timezone=True)),('error_json',JSONB)])\nsteps = _table('steps', [('run_id',String),('ordinal',Integer),('role',String),('state',String),\n    ('record_json',JSONB),('input_sha256',String),('output_json',JSONB),('output_sha256',String)])\napprovals = _table('approvals', [('approval_id',PGUUID(as_uuid=True)),('run_id',String),('project_id',PGUUID(as_uuid=True)),\n    ('actor_id',PGUUID(as_uuid=True)),('decision',String),('payload_json',JSONB),('payload_sha256',String),\n    ('approved_at',TIMESTAMP(timezone=True))])\nevents = _table('events', [('event_id',PGUUID(as_uuid=True)),('run_id',String),('kind',String),\n    ('metadata_json',JSONB),('recorded_at',TIMESTAMP(timezone=True))])\n\n\ndef payload(value):\n    return value.model_dump(mode='json')\n\n\ndef digest(value):\n    if hasattr(value,'model_dump'): value = payload(value)\n    return sha256(json.dumps(value,sort_keys=True,ensure_ascii=False,separators=(',',':'),\n                             allow_nan=False).encode()).hexdigest()\n\n\ndef runtime_revision():\n    \"\"\"Pin common execution code; team factories must document their own model revisions.\"\"\"\n    root = Path(__file__).parent\n    return sha256(b''.join(p.relative_to(root).as_posix().encode()+b'\\0'+p.read_bytes()\n                          for p in sorted(root.rglob('*.py')))).hexdigest()\n\n\ndef coordinator():\n    # The state-transition path is shared with the memory demo. Deferred commands\n    # must never call a model inside a database transaction.\n    class NoCall:\n        def rejected(self,*_): raise RuntimeError('Adapters execute only in a framework worker')\n        extract = inspect = validate = report = rejected\n    adapter = NoCall()\n    return Workflow(Agents(adapter,adapter,adapter,adapter))\n\n\nclass PostgresStore:\n    def __init__(self, engine, configuration, authorization=None):\n        self.engine = engine\n        self.configuration = TeamConfiguration.model_validate(configuration.model_dump(mode='python',warnings=False))\n        self.config_hash = digest(self.configuration)\n        self.runtime_hash = runtime_revision()\n        self.authorization = authorization\n\n    def event(self,c,run_id,kind,**metadata):\n        c.execute(insert(events).values(event_id=uuid4(),run_id=run_id,kind=kind,metadata_json=metadata))\n\n    def _access(self,c,subject,context,*,write=True):\n        if self.authorization is None: raise AuthError('AUTHENTICATION_REQUIRED',401)\n        if write and str(getattr(subject,'user_id','')) != context.actor_id:\n            raise AuthError('FRAMEWORK_ACTOR_MISMATCH',403)\n        try: pid=UUID(context.project_id); UUID(context.actor_id)\n        except ValueError: raise AuthError('FRAMEWORK_UUID_REQUIRED',422) from None\n        self.authorization.project(c,subject,pid,action='write' if write else 'read')\n\n    @staticmethod\n    def _row(c,run_id,*,lock=False):\n        query=select(runs).where(runs.c.run_id==run_id)\n        row=c.execute(query.with_for_update() if lock else query).mappings().one_or_none()\n        if row is None:raise AuthError('FRAMEWORK_RUN_NOT_FOUND',404)\n        return dict(row)\n\n    def _save(self,c,snapshot):\n        # Revalidate even internally copied snapshots before the durable boundary.\n        snapshot=_boundary(RunSnapshot,snapshot)\n        c.execute(update(runs).where(runs.c.run_id==snapshot.context.run_id).values(\n            snapshot_json=payload(snapshot),updated_at=func.clock_timestamp()))\n\n    def _job(self,c,snapshot,phase):\n        c.execute(insert(jobs).values(job_id=uuid4(),run_id=snapshot.context.run_id,\n            project_id=UUID(snapshot.context.project_id),phase=phase,state='queued',attempt_no=0))\n        self.event(c,snapshot.context.run_id,'job.queued',phase=phase)\n\n    def _create(self,c,snapshot,document,asset,*,phase=None):\n        fixed={'context':payload(snapshot.context),'document':payload(document),'asset':payload(asset)}\n        c.execute(insert(runs).values(run_id=snapshot.context.run_id,project_id=UUID(snapshot.context.project_id),\n            actor_id=UUID(snapshot.context.actor_id),parent_run_id=snapshot.context.parent_run_id,\n            input_json=fixed,input_sha256=digest(fixed),configuration_json=payload(self.configuration),\n            configuration_sha256=self.config_hash,runtime_sha256=self.runtime_hash,snapshot_json=payload(snapshot)))\n        for record in snapshot.step_records:\n            c.execute(insert(steps).values(run_id=snapshot.context.run_id,ordinal=record.ordinal,role=record.role,\n                state=record.status,record_json=payload(record),input_sha256=digest(snapshot.criteria)))\n        self.event(c,snapshot.context.run_id,'run.created',parent_run_id=snapshot.context.parent_run_id)\n        if phase:self._job(c,snapshot,phase)\n\n    def _restore(self,row):\n        flow=coordinator();flow.profile=row['snapshot_json']['profile']\n        flow.restore(RunSnapshot.model_validate(row['snapshot_json']),\n            DocumentRef.model_validate(row['input_json']['document']),AssetRef.model_validate(row['input_json']['asset']))\n        return flow\n\n    def start(self,subject,context,document,asset):\n        context,document,asset=_boundary(Context,context),_boundary(DocumentRef,document),_boundary(AssetRef,asset)\n        fixed={'context':payload(context),'document':payload(document),'asset':payload(asset)}\n        with unit_of_work(self.engine) as c:\n            self._access(c,subject,context)\n            # Project locking serializes same-project admission and UUID collisions.\n            old=c.execute(select(runs).where(runs.c.run_id==context.run_id)).mappings().one_or_none()\n            if old:\n                if (old['project_id']!=UUID(context.project_id) or old['input_sha256']!=digest(fixed)\n                        or old['configuration_sha256']!=self.config_hash or old['runtime_sha256']!=self.runtime_hash):\n                    raise AuthError('FRAMEWORK_IDEMPOTENCY_CONFLICT',409)\n                return RunSnapshot.model_validate(old['snapshot_json'])\n            flow=coordinator();flow.profile=self.configuration.profile\n            snapshot=flow.start(context,document,asset,defer=True)\n            self._create(c,snapshot,document,asset,phase='extract')\n        return snapshot\n\n    def get(self,subject,run_id):\n        with unit_of_work(self.engine) as c:\n            row=self._row(c,run_id)\n            snapshot=RunSnapshot.model_validate(row['snapshot_json'])\n            self._access(c,subject,snapshot.context,write=False)\n        return snapshot\n\n    def get_steps(self,subject,run_id):\n        snapshot=self.get(subject,run_id)\n        return StepTimeline(context=snapshot.context,profile=snapshot.profile,storage='postgres',\n            execution_status=snapshot.execution_status,records=snapshot.step_records)\n\n    def approve(self,subject,run_id,approval):\n        approval=_boundary(Approval,approval)\n        with unit_of_work(self.engine) as c:\n            self._access(c,subject,approval.context)\n            row=self._row(c,run_id,lock=True)\n            if row['project_id']!=UUID(approval.context.project_id):raise AuthError('FRAMEWORK_RUN_NOT_FOUND',404)\n            existing=c.execute(select(approvals).where(approvals.c.run_id==run_id,\n                approvals.c.decision==approval.decision)).mappings().one_or_none()\n            if existing:\n                if existing['payload_sha256']!=digest(approval):raise AuthError('FRAMEWORK_APPROVAL_CONFLICT',409)\n                return RunSnapshot.model_validate(row['snapshot_json'])\n            if (approval.decision=='approve_criteria' and (row['configuration_sha256']!=self.config_hash\n                    or row['runtime_sha256']!=self.runtime_hash)):\n                raise AuthError('FRAMEWORK_CONFIGURATION_CHANGED',409)\n            flow=self._restore(row)\n            snapshot=flow.approve(run_id,approval,defer=True)\n            c.execute(insert(approvals).values(approval_id=uuid4(),run_id=run_id,project_id=row['project_id'],\n                actor_id=UUID(approval.actor_id),decision=approval.decision,payload_json=payload(approval),payload_sha256=digest(approval)))\n            self._save(c,snapshot)\n            self.event(c,run_id,'approval.recorded',decision=approval.decision,actor_id=approval.actor_id)\n            if approval.decision=='approve_criteria':self._job(c,snapshot,'review')\n        return snapshot\n\n    def rereview(self,subject,parent_id,context,asset):\n        context,asset=_boundary(Context,context),_boundary(AssetRef,asset)\n        with unit_of_work(self.engine) as c:\n            self._access(c,subject,context)\n            parent=self._row(c,parent_id,lock=True)\n            if parent['project_id']!=UUID(context.project_id):raise AuthError('FRAMEWORK_RUN_NOT_FOUND',404)\n            document=DocumentRef.model_validate(parent['input_json']['document'])\n            fixed={'context':payload(context),'document':payload(document),'asset':payload(asset)}\n            existing=c.execute(select(runs).where(runs.c.parent_run_id==parent_id)).mappings().one_or_none()\n            if existing:\n                if existing['input_sha256']!=digest(fixed):raise AuthError('FRAMEWORK_REVISION_CONFLICT',409)\n                return RunSnapshot.model_validate(existing['snapshot_json'])\n            flow=self._restore(parent)\n            snapshot=flow.rereview(parent_id,context,asset)\n            self._create(c,snapshot,document,asset)\n        return snapshot\n\n    def approval_history(self,subject,run_id):\n        snapshot=self.get(subject,run_id)\n        with unit_of_work(self.engine) as c:\n            self._access(c,subject,snapshot.context,write=False)\n            rows=c.execute(select(approvals).where(approvals.c.run_id==run_id).order_by(approvals.c.approved_at)).mappings().all()\n            return [{'approval_id':str(r['approval_id']),'approved_at':r['approved_at'].isoformat(),\n                     'approval':r['payload_json']} for r in rows]\n\n    def worker_access(self,c,project_id,actor_id):\n        # A queued command may outlive its login session. Worker rechecks the\n        # existing account, membership and project rather than extending a session.\n        project=c.execute(select(business_table('projects')).where(business_table('projects').c.project_id==project_id)\n                          .with_for_update(key_share=True)).mappings().one_or_none()\n        user=c.execute(select(business_table('users')).where(business_table('users').c.user_id==actor_id)\n                       .with_for_update(read=True)).mappings().one_or_none()\n        members=business_table('project_members')\n        member=c.execute(select(members).where(members.c.project_id==project_id,members.c.user_id==actor_id)\n                         .with_for_update(read=True)).mappings().one_or_none()\n        if (not project or project['business_state']!='active' or not user or not user['is_active']\n                or not member or not member['is_active'] or member['role'] not in ('owner','editor')):\n            raise AuthError('FRAMEWORK_ACCESS_REVOKED',403)\n","sha256":"91debf61b90424ef24105f3a7d1d0ce1cb3b734c99d86aa1d833c5c7e1561707"},"backend/agent_framework/postgres_api.py":{"text":"\"\"\"Fresh framework entrypoint reusing M008 authentication, CSRF and app Engine.\n\nNo OCR/background-task leader, frontend build, model initialization or migration.\nPOST admission/approval only queues work; the separate worker invokes adapters.\n\"\"\"\nfrom contextlib import asynccontextmanager\nfrom dataclasses import replace\n\nfrom fastapi import Request\nfrom starlette.concurrency import run_in_threadpool\n\nfrom backend.app.main import create_app as create_auth_app\nfrom backend.app.persistence.transaction import unit_of_work\nfrom backend.app.security.csrf import developer_allowed\nfrom backend.app.security.errors import AuthError\nfrom backend.app.config import ConfigurationError\nfrom .api import StartRequest,RevisionRequest\nfrom .contracts import Approval,RunSnapshot,StepTimeline\nfrom .postgres import PostgresStore\nfrom .postgres_schema import check_extension,check_app_permissions\n\n\ndef create_postgres_app(settings,configuration,*,engine=None):\n    if settings.environment not in ('development','test'):\n        raise ConfigurationError('The initial framework PostgreSQL profile supports development/test only.')\n    # The existing authentication app deliberately skips all legacy media and\n    # review executors when storage/frontend are unset.\n    settings=replace(settings,storage_root=None,frontend_dist=None,review_pipeline='disabled',\n                     review_executor='background_tasks',review_config_file=None)\n    app=create_auth_app(settings=settings,engine=engine)\n    original=app.router.lifespan_context\n    @asynccontextmanager\n    async def lifespan(current):\n        async with original(current):\n            def prepare():\n                with unit_of_work(current.state.engine) as c:\n                    check_extension(c);check_app_permissions(c)\n                return PostgresStore(current.state.engine,configuration,current.state.authorization)\n            current.state.framework=await run_in_threadpool(prepare)\n            yield\n    app.router.lifespan_context=lifespan\n    app.title='Creative Checker — PostgreSQL agent framework'\n\n    def subject(request):\n        user=app.state.auth.current(request.cookies.get(settings.session_cookie),\n            developer_allowed=developer_allowed(request,settings))\n        if user is None:raise AuthError('AUTHENTICATION_REQUIRED',401)\n        return user\n\n    def invoke(action,*args):\n        try:return action(*args)\n        except ValueError:raise AuthError('FRAMEWORK_CONFLICT',409) from None\n\n    prefix='/api/framework/v1'\n    @app.get(prefix+'/health')\n    def health():\n        return {'storage':'postgres','queue':'agent_framework.jobs','schema':'AF001',\n                'authentication':'existing_M008_session_and_CSRF','adapters_initialized_in_api':False,'production_ready':False}\n    @app.post(prefix+'/runs',response_model=RunSnapshot,status_code=202)\n    def start(request:Request,body:StartRequest):\n        return invoke(app.state.framework.start,subject(request),body.context,body.document,body.asset)\n    @app.get(prefix+'/runs/{run_id}',response_model=RunSnapshot)\n    def read(request:Request,run_id:str):return invoke(app.state.framework.get,subject(request),run_id)\n    @app.get(prefix+'/runs/{run_id}/steps',response_model=StepTimeline)\n    def timeline(request:Request,run_id:str):return invoke(app.state.framework.get_steps,subject(request),run_id)\n    @app.get(prefix+'/runs/{run_id}/approvals')\n    def history(request:Request,run_id:str):return invoke(app.state.framework.approval_history,subject(request),run_id)\n    @app.post(prefix+'/runs/{run_id}/approvals',response_model=RunSnapshot)\n    def approve(request:Request,run_id:str,body:Approval):\n        return invoke(app.state.framework.approve,subject(request),run_id,body)\n    @app.post(prefix+'/runs/{run_id}/revisions',response_model=RunSnapshot,status_code=201)\n    def revise(request:Request,run_id:str,body:RevisionRequest):\n        return invoke(app.state.framework.rereview,subject(request),run_id,body.context,body.asset)\n    return app\n","sha256":"2bed87159cb3b8c383c7bc4cb486ae8d0acf665f434266688e88dfe9557c13ab"},"backend/agent_framework/postgres_commands.py":{"text":"\"\"\"Explicit app/owner separation and framework-only process startup.\"\"\"\nimport json\nfrom pathlib import Path\nimport signal\nfrom threading import Event\n\nfrom backend.app.config import load_settings,read_environment_file,ConfigurationError\nfrom backend.app.persistence.database import create_app_engine,PersistenceError\nfrom backend.app.persistence.schema_inventory import check_schema\nfrom backend.app.persistence.transaction import unit_of_work\nfrom backend.app.security.errors import AuthError\nfrom .composition import load_config,build_agents\nfrom .postgres import PostgresStore\nfrom .postgres_schema import check_extension,check_app_permissions\n\n\ndef _values(filename):\n    # An explicit file is required; never discover or modify the user's .env.\n    values=read_environment_file(Path(filename))\n    if any(values.get(k) for k in ('DB_OWNER_PASSWORD','POSTGRES_PASSWORD')):\n        raise ConfigurationError('Runtime requires app-only credentials.')\n    if values.get('APP_ENV') not in ('development','test'):\n        raise ConfigurationError('Select APP_ENV=development or test explicitly.')\n    settings=load_settings(values)\n    if settings.persistence_mode!='postgres':raise ConfigurationError('Select PostgreSQL explicitly.')\n    return values,settings\n\n\ndef _ready(engine,settings):\n    check_schema(engine,settings)\n    with unit_of_work(engine) as c:\n        result=check_extension(c);check_app_permissions(c);return result\n\n\ndef postgres_check(args):\n    _values_map,settings=_values(args.env_file)\n    engine=create_app_engine(settings)\n    try:print(json.dumps(_ready(engine,settings)));return 0\n    finally:engine.dispose()\n\n\ndef postgres_serve(args):\n    from backend.app.v1_config import load_v1_settings\n    from .postgres_api import create_postgres_app\n    import uvicorn\n    values,_settings=_values(args.env_file)\n    app=create_postgres_app(load_v1_settings(values),load_config(args.config))\n    uvicorn.run(app,host='127.0.0.1',port=args.port,workers=1,reload=False)\n    return 0\n\n\ndef postgres_worker(args):\n    from .durable_worker import PostgresQueue,execute_claim\n    _values_map,settings=_values(args.env_file)\n    configuration=load_config(args.config)\n    engine=create_app_engine(settings)\n    stop=Event()\n    for signum in (signal.SIGTERM,signal.SIGINT):signal.signal(signum,lambda *_:stop.set())\n    try:\n        _ready(engine,settings)\n        store=PostgresStore(engine,configuration)\n        queue=PostgresQueue(store)\n        agents=build_agents(configuration)  # Only worker initializes role factories.\n        print(json.dumps({'event':'framework_worker_ready'}),flush=True)\n        while not stop.is_set():\n            try:\n                recovered=queue.recover_expired()\n                claim=queue.claim_next()\n                outcome=execute_claim(queue,claim,agents,stop=stop) if claim else 'idle'\n                if claim or recovered or args.once:\n                    print(json.dumps({'event':'framework_worker_cycle','outcome':outcome,'recovered':len(recovered)}),flush=True)\n                if args.once:return 1 if outcome in ('failed','outcome_unknown','database_unavailable','authority_lost') else 0\n            except (PersistenceError,AuthError):\n                print(json.dumps({'event':'framework_worker_database_or_authority_unavailable'}),flush=True)\n                if args.once:return 1\n            stop.wait(1)\n        return 0\n    finally:engine.dispose()\n\n\ndef postgres_migrate(args):\n    from backend.migrations.configuration import load_migration_settings\n    from .postgres_schema import migrate\n    values=read_environment_file(Path(args.env_file))\n    settings=load_migration_settings(values)\n    try:result=migrate(settings)\n    except Exception:\n        raise PersistenceError('FRAMEWORK_MIGRATION_UNCONFIRMED',\n            'Migration failed or its commit was not confirmed. Reconcile the schema before retrying.',outcome='commit_unknown') from None\n    print(json.dumps(result));return 0\n","sha256":"d35901c1cedafee38a780f7407315866f8ec53e34057a9ef68ad514a4df95ab9"},"backend/agent_framework/postgres_schema.py":{"text":"\"\"\"Explicit owner migration and read-only extension preflight; never on import.\"\"\"\nfrom hashlib import sha256\nimport json\nfrom pathlib import Path\n\nfrom sqlalchemy import text\n\nfrom backend.app.persistence.database import PersistenceError\nfrom backend.app.persistence.schema_inventory import _STRUCTURE_QUERIES,validate_schema\n\nDDL = Path(__file__).with_name('AF001.sql')\nTABLES = ('schema_version', 'runs', 'jobs', 'steps', 'approvals', 'events')\nUPDATES = {'runs': ('snapshot_json','updated_at'),\n           'jobs': ('state','attempt_no','worker_token','lease_expires_at','heartbeat_at','finished_at','error_json'),\n           'steps': ('state','record_json','output_json','output_sha256')}\n\n\ndef _structure(connection):\n    connection.exec_driver_sql('SET LOCAL search_path = pg_catalog, public')\n    return {name: [list(row) for row in connection.exec_driver_sql(\n        sql.replace(\"'public'\", \"'agent_framework'\")).all()]\n        for name, sql in _STRUCTURE_QUERIES.items()}\n\n\ndef check_extension(connection):\n    try:\n        row = connection.exec_driver_sql('SELECT revision, ddl_sha256, structure_json FROM agent_framework.schema_version').one()\n        if row[0] != 'AF001' or row[1] != sha256(DDL.read_bytes()).hexdigest() or row[2] != _structure(connection):\n            raise ValueError()\n    except Exception:\n        raise PersistenceError('FRAMEWORK_SCHEMA_NOT_READY',\n            'Apply and verify the explicit AF001 extension before starting this profile.') from None\n    return {'revision':'AF001','schema':'agent_framework','public_schema':'M008 unchanged'}\n\n\ndef check_app_permissions(connection):\n    \"\"\"The extension must not turn the app into a schema owner or log editor.\"\"\"\n    forbidden=connection.exec_driver_sql(\"\"\"SELECT\n      has_schema_privilege(current_user,'agent_framework','CREATE') OR\n      has_table_privilege(current_user,'agent_framework.schema_version','INSERT') OR\n      has_table_privilege(current_user,'agent_framework.approvals','UPDATE') OR\n      has_table_privilege(current_user,'agent_framework.events','UPDATE') OR\n      has_table_privilege(current_user,'agent_framework.steps','DELETE') OR\n      has_table_privilege(current_user,'agent_framework.runs','DELETE')\"\"\").scalar_one()\n    required=all(connection.execute(text(\"SELECT has_table_privilege(current_user,:table,'SELECT')\"),\n        {'table':'agent_framework.'+name}).scalar_one() for name in TABLES)\n    columns=connection.exec_driver_sql(\"SELECT table_name,column_name FROM information_schema.columns WHERE table_schema='agent_framework'\").all()\n    columns_match=all(connection.execute(text(\"SELECT has_column_privilege(current_user,:table,:column,'UPDATE')\"),\n        {'table':'agent_framework.'+name,'column':column}).scalar_one()==(column in UPDATES.get(name,()))\n        for name,column in columns)\n    tables_match=all(connection.execute(text(\"SELECT has_table_privilege(current_user,:table,'INSERT')\"),\n        {'table':'agent_framework.'+name}).scalar_one()==(name!='schema_version') for name in TABLES)\n    if forbidden or not required or not columns_match or not tables_match:\n        raise PersistenceError('FRAMEWORK_PRIVILEGES_INVALID','Restricted extension permissions are required.')\n\n\ndef migrate(settings):\n    from backend.migrations.configuration import create_migration_engine, validate_migration_connection\n    engine = create_migration_engine(settings)\n    try:\n        with engine.begin() as connection:\n            validate_migration_connection(connection, settings)\n            connection.exec_driver_sql(\"SET LOCAL lock_timeout='2s'\")\n            connection.exec_driver_sql(\"SET LOCAL statement_timeout='60s'\")\n            connection.exec_driver_sql(\"SELECT pg_advisory_xact_lock(hashtextextended(current_database() || ':cc-schema-v1',0))\")\n            if connection.exec_driver_sql('SELECT version_num FROM public.alembic_version').scalars().all() != ['M008']:\n                raise ValueError('M008 must be applied first')\n            validate_schema(connection,app_user=settings.app_user)\n            if connection.exec_driver_sql(\"SELECT to_regnamespace('agent_framework')\").scalar_one() is not None:\n                return check_extension(connection)\n            connection.exec_driver_sql(DDL.read_text(encoding='utf-8'))\n            app = connection.dialect.identifier_preparer.quote(settings.app_user)\n            connection.exec_driver_sql(f'GRANT USAGE ON SCHEMA agent_framework TO {app}')\n            for table in TABLES:\n                connection.exec_driver_sql(f'REVOKE ALL ON agent_framework.{table} FROM PUBLIC')\n                connection.exec_driver_sql(f'GRANT SELECT ON agent_framework.{table} TO {app}')\n                if table != 'schema_version':\n                    connection.exec_driver_sql(f'GRANT INSERT ON agent_framework.{table} TO {app}')\n            for table, columns in UPDATES.items():\n                connection.exec_driver_sql(f'GRANT UPDATE ({\",\".join(columns)}) ON agent_framework.{table} TO {app}')\n            structure = _structure(connection)\n            connection.execute(text('INSERT INTO agent_framework.schema_version(revision,ddl_sha256,structure_json) '\n                'VALUES(:revision,:hash,CAST(:structure AS jsonb))'),\n                {'revision':'AF001','hash':sha256(DDL.read_bytes()).hexdigest(), 'structure':json.dumps(structure)})\n            return check_extension(connection)\n    finally:\n        engine.dispose()\n","sha256":"83090b5c2792096388241d731c0836642e54220b9101bfd58a0c37ca07583ef3"},"backend/agent_framework/runtime.py":{"text":"\"\"\"Development-only, in-memory LangGraph workflow.\n\nAll runs and approvals disappear when this Workflow instance is discarded or the\nprocess exits. This is an integration scaffold, not a durable worker, an identity\nprovider, or evidence that a real model/database was executed. The service that\nadopts it must implement authorization and persistence at its own boundary.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom datetime import datetime, timezone\nimport re\nfrom threading import RLock\nfrom time import perf_counter_ns\nfrom typing import Any, TypeVar, TypedDict\n\nfrom langgraph.graph import END, START, StateGraph\nfrom pydantic import BaseModel\n\nfrom .contracts import (\n    Approval, AssetRef, Context, CriteriaDraft, DocumentRef, EvidenceBundle,\n    ExtractRequest, FrameworkError, InspectionResult, InspectRequest, ReportDraft,\n    ReportRequest, RunSnapshot, StepRecord, StepTimeline, ValidatedResult, ValidateRequest,\n)\nfrom .ports import AdapterFailure, Agents\nfrom .invocation import ROLE_CONTRACTS, InvocationFailure, invoke_role\nfrom .validation import (\n    validate_draft,\n)\n\nT = TypeVar('T', bound=BaseModel)\n_EXCEPTION_BLOCKERS = frozenset({\n    'missing_observation', 'missing_expected_value', 'missing_requirement
