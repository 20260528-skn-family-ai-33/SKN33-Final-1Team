· 0 output\n\n## Graph Freshness\n- Built from commit: `12b2d369`\n- Run `git rev-parse HEAD` and compare to check if the graph is stale.\n- Run `graphify update .` after code changes (no API cost).\n\n## Community Hubs (Navigation)\n- Evidence and verdict validation\n- Checks relationships\n- Run input contracts\n- Postgres relationships\n- Postgres Api relationships\n- Synthetic data and observations\n- CLI and fixture composition\n- Workflow and human approvals\n- Durable Worker relationships\n\n## God Nodes (most connected - your core abstractions)\n1. `Context` - 53 edges\n2. `Workflow` - 47 edges\n3. `AdapterFailure` - 39 edges\n4. `Contract` - 36 edges\n5. `DocumentRef` - 32 edges\n6. `AssetRef` - 32 edges\n7. `InspectRequest` - 28 edges\n8. `PostgresStore` - 28 edges\n9. `create_app()` - 24 edges\n10. `ExtractRequest` - 23 edges\n\n## Surprising Connections (you probably didn't know these)\n- `CreativeCheckerCatalog` --uses--\u003e `AdapterFailure`  [INFERRED]\n  adapters/project_files.py → ports.py\n- `CreativeCheckerStorageReader` --uses--\u003e `AdapterFailure`  [INFERRED]\n  adapters/project_files.py → ports.py\n- `LegacyPosterCatalog` --uses--\u003e `AdapterFailure`  [INFERRED]\n  adapters/project_files.py → ports.py\n- `LegacyStorageReader` --uses--\u003e `AdapterFailure`  [INFERRED]\n  adapters/project_files.py → ports.py\n- `_same_context()` --uses--\u003e `Context`  [INFERRED]\n  adapters/synthetic.py → contracts.py\n\n## Import Cycles\n- None detected.\n\n## Communities (11 total, 2 thin omitted)\n\n### Community 0 - \"Evidence and verdict validation\"\nCohesion: 0.09\nNodes (37): FileBackedExtractor, FileBackedInspector, QwenAdapterStub, _SyntheticValidator, CriteriaDraft, EvidenceBundle, ExtractRequest, InspectionResult (+29 more)\n\n### Community 1 - \"Checks relationships\"\nCohesion: 0.07\nNodes (32): CheckSuiteError, _invalid_constant(), load_suite(), PreparedCase, PreparedSuite, _read_json(), RoleCheckCase, RoleCheckSuite (+24 more)\n\n### Community 2 - \"Run input contracts\"\nCohesion: 0.08\nNodes (22): _authorize_error(), _creative_key(), CreativeCheckerCatalog, CreativeCheckerStorageReader, _fail(), LegacyPosterCatalog, LegacyStorageReader, _maximum() (+14 more)\n\n### Community 3 - \"Postgres relationships\"\nCohesion: 0.08\nNodes (12): steps(), FrameworkError, StepRecord, StepTimeline, Claim, _PhaseState, PostgresQueue, coordinator() (+4 more)\n\n### Community 4 - \"Postgres Api relationships\"\nCohesion: 0.09\nNodes (24): _invalid_constant(), load_config(), _unique_object(), create_postgres_app(), approve(), history(), invoke(), lifespan() (+16 more)\n\n### Community 5 - \"Synthetic data and observations\"\nCohesion: 0.09\nNodes (17): generate(), main(), role_examples(), _hash(), make_agents(), _same_context(), SyntheticAdapters, source() (+9 more)\n\n### Community 6 - \"CLI and fixture composition\"\nCohesion: 0.11\nNodes (21): create_app(), adapter_status(), approve(), configuration_status(), health(), invoke(), read(), revise() (+13 more)\n\n### Community 7 - \"Workflow and human approvals\"\nCohesion: 0.17\nNodes (10): _demo(), Approval, RunSnapshot, run_flow_check(), approve(), _boundary(), _copy(), _GraphState (+2 more)\n\n### Community 8 - \"Durable Worker relationships\"\nCohesion: 0.16\nNodes (10): execute_claim(), execute_role(), node(), Lease, accept_role_output(), _contract(), invoke_role(), _policy() (+2 more)\n\n## Knowledge Gaps\n- **2 thin communities (\u003c3 nodes) omitted from report** — run `graphify query` to explore isolated nodes.\n\n## Suggested Questions\n_Questions this graph is uniquely positioned to answer:_\n\n- **Why does `Context` connect `Run input contracts` to `Evidence and verdict validation`, `Postgres Api relationships`, `Synthetic data and observations`?**\n  _High betweenness centrality (0.024) - this node is a cross-community bridge._\n- **Are the 16 inferred relationships involving `Workflow` (e.g. with `Approval` and `AssetRef`) actually correct?**\n  _`Workflow` has 16 INFERRED edges - model-reasoned connections that need verification._\n- **Should `Evidence and verdict validation` be split into smaller, more focused modules?**\n  _Cohesion score 0.09272300469483569 - nodes in this community are weakly interconnected._\n- **Why does `Workflow` connect `Workflow and human approvals` to `Evidence and verdict validation`, `Checks relationships`, `Run input contracts`, `Postgres relationships`, `Synthetic data and observations`, `CLI and fixture composition`?**\n  _High betweenness centrality (0.009) - this node is a cross-community bridge._\n- **Should `Checks relationships` be split into smaller, more focused modules?**\n  _Cohesion score 0.06663141195134849 - nodes in this community are weakly interconnected._\n- **Why does `invoke_role()` connect `Durable Worker relationships` to `Evidence and verdict validation`, `CLI and fixture composition`?**\n  _High betweenness centrality (0.006) - this node is a cross-community bridge._\n- **Should `Run input contracts` be split into smaller, more focused modules?**\n  _Cohesion score 0.08087431693989071 - nodes in this community are weakly interconnected._","sha256":"5cc4315e234d0d9356d484223b74656c27320ee2c21458ec6684858de65764be"},"docs/agent-framework/verification-2026-11-02.md":{"text":"\u003e 이전 검증 이력: 이 보고서는 독립 A03 제거·계약 2.0.0 적용 전의 코드와 시험 결과다. 현재 구조와 최신 검증은 [A03 제거 정리](a03-retirement-2026-11-02.md) 및 [담당자 가이드](에이전트_프레임워크_가이드.html)를 따른다.\n\n# 공통 개발 프레임워크 검증 기록\n\n- 날짜: 2026-11-02 (Asia/Seoul)\n- 작업 브랜치: `feat/agent-framework`\n- 시작 커밋: `87a3b9e` (`feat/29-front-v2`에서 분기)\n- 대상: 역할별 독립 개발 계약과 개발용 실행기. 실제 제품 통합 완료 기록이 아니다.\n- 상태: 로컬 작업 파일이며 커밋·푸시하지 않았다.\n\n## 실행한 검사\n\n저장소 루트의 기존 `.venv`를 사용했다. 이번 작업에서 의존성 설치·잠금 파일 갱신은 하지 않았다.\n\n```sh\n.venv/bin/python -m scripts.export_agent_framework\n.venv/bin/python -m pytest tests/agent_framework -q --tb=short\n.venv/bin/python -m backend.agent_framework demo --output /tmp/agent-framework-demo-20261102.json\n.venv/bin/python -m backend.agent_framework role A03 --input examples/agent_framework/A03.json --synthetic --output /tmp/agent-framework-A03-20261102.json\ngit diff --check\n```\n\n결과: **104개 테스트와 9개 하위 테스트 통과**, `git diff --check` 통과.\n\n- 공통 JSON 계약 및 모델 생성 우회 출력 재검증.\n- 잘못된 프로젝트·문서·조건·이미지 버전, 위조 인용·해시, 과거 이력의 현재 관측 사용 차단.\n- 조건 누락·중복·불확실 관측·지원하지 않는 비교·수량 모순·검색 지연/실패 처리.\n- 조건 승인, 수정 요청 승인, 새 버전 전체 재검수, 최종 승인 및 예외 승인 제한.\n- 동시/중복 승인, 새 실행 ID 충돌, 승인 자동 승계 방지.\n- 모델·검색 미설정 및 결과 불명 시 합성 대체·자동 재호출 없음.\n- 모든 역할의 독립 CLI, factory 교체, 합성 입력 표시 전파, 오류 시 기존 출력 파일 보존.\n- FastAPI TestClient를 통한 접수·조회·승인·재검수와 오류 응답. 서버 포트는 열지 않았다.\n- 17개 JSON Schema, 15개 합성 예제 JSON, 개발 OpenAPI의 생성 결과와 저장된 파일 일치.\n\ndemo는 2개 합성 실행에서 6개 동작을 수행했다. 수정 전 실행은 `changes_approved`, 수정 후 실행은 `final_approved`로 끝났으며 두 실행 모두 `synthetic=true`다. 승인자는 스크립트 입력이므로 실제 사용자의 승인 기록으로 사용할 수 없다.\n\n## 검증 범위와 남은 연결\n\n현재 환경에는 `pytest-asyncio` 플러그인이 없어 기존 `asyncio_mode`, `asyncio_default_fixture_loop_scope` 설정에 대한 경고 2개가 발생했다. 이번 검사는 동기 테스트이며 모두 통과했다. 잠금 파일로 새 환경을 설치한 결과로 확대 해석하지 않는다.\n\n실제 Qwen·PDF·이미지 처리, PostgreSQL·Neo4j 쿼리, MCP 전송, 영속 worker 복구, 제품 인증 및 front-v2 API 연결은 이번 검증에 포함하지 않는다. 모델 정확도·검색 품질·배포 완료를 검증한 것이 아니다.\n\n기존 front-v2, `backend/app`, `backend/creative_checker`, 마이그레이션, 실행 스크립트, 의존성 파일은 변경하지 않았다. 업무 DB와 환경설정에 접근하거나 서비스를 기동하지 않았다. 이전에 작성한 계획 MD·HTML은 그대로 보존했다.\n\nUbuntu·Windows용 GitHub Actions 검사를 추가했지만 아직 원격 실행하지 않았다. Windows 장치 실행과 제품 전체 회귀 테스트는 이번 로컬 검증 결과에 포함하지 않는다.\n","sha256":"fedb5eb2faa01c0658451d1ab3527d96c87aac50c9ec052eb9afa9139c2ab8e0"},"docs/agent-framework/기준_보완승인_가이드.md":{"text":"# 기준 보완·승인·재조회\n\n2026-11-03 · 6단계 · `feat/37-a02-pdf-registration`\n\n## 01. 연결한 업무 흐름\n\n**PDF-only A02 초안 → 보완·범위 검토 → 새 기준 버전 → 명시적 승인 → 포스터 대기 → 승인 기준 재조회**를 연결했다. A02 원본 초안·완료 단계·원본 PDF는 덮어쓰지 않는다. 보완과 제외 사유는 새 버전에 보존하고, 승인에는 대상 버전 ID와 정확한 해시를 기록한다.\n\n새 PDF 전용 경로는 승인 후 `waiting_asset`이 된다. 포스터 참조를 만들거나 검수 worker를 자동 접수하지 않는다. 기존 PDF+포스터 실행·승인 경로는 유지하며, 기준 승인과 포스터 최종 승인을 구분한다.\n\n검증은 기존 운영 DB와 분리한 PostgreSQL 17에서 **개발용 보완·승인 입력**으로 수행했다. 실제 클라이언트의 회신이나 사용자의 기준 승인으로 기록하지 않았다. 실제 Qwen 서버 호출은 여전히 0회다. 진행 신호 `1`은 기능 구현 지시이며 승인 API 요청이나 보완 답변이 아니다.\n\n## 02. 원본과 사람의 보완 출처\n\n기준 버전은 원래 A02 실행·PDF 버전·파일 해시·추출 초안 해시와 연결한다. 각 조건의 PDF `source`는 최초 원문 인용을 유지한다. 값을 보완하면 별도의 `value_source`에 다음을 저장한다.\n\n- 제출자가 입력한 출처 설명 `reference`와 회신/확인 문장 `quote`\n- 그 문장의 SHA-256과 서버가 만든 기록 ID\n- 현재 로그인한 제출자 ID와 DB 시각\n- `human_review` 또는 `synthetic_test` 목적, 계승한 `synthetic` 표시\n\n보완값을 PDF에서 추출한 문구로 가장하지 않는다. 기대값과 지정 단위는 보완 인용문에 실제 문자로 포함되어야 한다. 다만 출처 설명과 회신 문장은 제출자가 제공한 진술이다. 서버가 이메일·메신저 원본을 가져오거나 실제 발주자의 신원을 독립적으로 확인한 증거가 아니다.\n\n필요한 조건은 `amend`로 종류·연산자·기대값·단위·필수 여부를 정리한다. 검수 범위에서 제외할 때는 `exclude`와 사유·출처를 남긴다. 제외한 조건을 되살릴 때도 새 버전의 `amend`로 기록한다. 모든 조건을 제외한 빈 기준은 만들 수 없다. 제외 이력이 있으므로 검수 범위 축소를 숨기지 않는다.\n\n모의 추출에서 출발한 기준이나 `synthetic_test` 보완은 이후에도 `synthetic=true`를 유지한다. 요청 목적을 `human_review`로 바꿔도 실모델·실제 발주 승인으로 바뀌지 않는다. 승인 근거 묶음에도 PDF 인용과 보완 출처를 함께 고정한다. PostgreSQL·Neo4j 관계 검색을 실행했다고 표시하지 않는다.\n\n## 03. 저장소와 명시적 AF003 적용\n\n기존 M008 사용자·프로젝트·세션·CSRF와 AF001 실행·단계·승인·이벤트 저장을 재사용한다. AF003은 같은 DB의 `agent_framework` 스키마에 다음 두 테이블을 추가한다.\n\n| 테이블 | 역할 |\n|---|---|\n| `criteria_versions` | 변경 불가능한 기준 버전·부모·보완/제외 이력·본문 스냅샷·해시 |\n| `criteria_approval_bindings` | 기존 AF001 승인 ID와 선택한 기준 버전·해시·고정 근거 묶음 연결 |\n\n기존 public M008 및 AF001·AF002 SQL을 수정하지 않는다. 앱에는 새 테이블의 SELECT·INSERT만 허용하고, UPDATE/DELETE는 DB trigger로도 차단한다. 실제 승인자·승인 시각은 기존 `agent_framework.approvals`에 기록하며 별도 승인 원장을 중복으로 만들지 않는다.\n\nAPI가 시작될 때 자동 마이그레이션하지 않는다. 기존 별도 owner/app 설정을 준비한 개발·검증 환경에서만 아래 명령을 명시적으로 실행한다. 이번 작업으로 운영 DB를 적용한 것은 아니다.\n\n```bash\n.venv/bin/python -m backend.agent_framework migrate-postgres --env-file .runtime/framework-owner.env --revision AF003\n.venv/bin/python -m backend.agent_framework postgres-check --env-file .runtime/framework-app.env\n.venv/bin/python -m backend.agent_framework postgres-serve --env-file .runtime/framework-app.env --config examples/agent_framework/team_config.pdf-mock.json --pdf-storage-root \"$PWD/.runtime/framework-pdf\" --port 8012\n```\n\nM008에 AF003을 처음 적용하면 AF001→AF002→AF003을 순서대로 추가한다. 이미 AF003이면 낮은 revision 요청으로 되돌리지 않는다. 기본 마이그레이션 대상은 이전 호환을 위해 AF001이므로 새 기능에는 `--revision AF003`을 명시한다. AF001/AF002 API는 기존 기능을 유지하고 새 기준 검토 경로는 503으로 비활성화한다.\n\nPDF root는 [PDF 등록 가이드](PDF_등록_버전저장_가이드.html)대로 이미 초기화한 전용 경로를 사용한다. 등록·추출·기준 확정에 같은 app 계정을 사용하며 owner 파일을 API/worker에 넘기지 않는다. 실제 파일 저장 구현은 POSIX 기반이며 Windows 네이티브 백엔드 실행은 아직 미검증이다. HTML·문서 링크는 상대 경로로 열람할 수 있다.\n\n## 04. 보완 버전 API\n\n모든 경로는 `/api/framework/v1` 아래다. 기존 로그인 쿠키·CSRF·허용 Origin을 사용한다. 현재 쓰기 정책은 **해당 A02 실행 생성자이면서 활성 프로젝트 editor/owner인 사용자**다. 다른 사용자에게 승인을 위임하는 정책은 추가하지 않았다. 권한 있는 viewer는 조회할 수 있다.\n\n| 경로 | 용도 |\n|---|---|\n| GET `/runs/{run_id}/criteria-review` | 첫 초안 해시, 최신 보완 버전과 해시, 승인 상태 |\n| POST `/runs/{run_id}/criteria-versions` | 보완·제외를 새 불변 버전으로 저장 |\n| GET `/runs/{run_id}/criteria-versions` | 과거 버전을 포함한 전체 이력 |\n| GET `/runs/{run_id}/criteria-versions/{version_id}` | 특정 버전·해시·승인 차단 사유 조회 |\n\n쓰기에는 `Idempotency-Key` UUID를 보존해 전송한다. 첫 버전은 `parent_version_id=null`, `expected_base_sha256`은 overview의 `source_draft_sha256`이다. 다음 버전은 최신 `criteria_version_id`와 응답의 `sha256`을 부모로 지정한다.\n\n```json\n{\n  \"parent_version_id\": null,\n  \"expected_base_sha256\": \"\u003coverview의 source_draft_sha256\u003e\",\n  \"purpose\": \"human_review\",\n  \"edits\": [\n    {\n      \"criterion_id\": \"\u003c보완할 조건 ID\u003e\",\n      \"action\": \"amend\",\n      \"reason\": \"\u003c확인한 내용과 변경 사유\u003e\",\n      \"source\": {\"reference\": \"\u003c회신을 식별할 설명\u003e\", \"quote\": \"\u003c실제로 받은 확인 문장\u003e\"},\n      \"resolution\": {\"target\": \"poster_text\", \"field\": \"viewing_hours\", \"kind\": \"text\", \"operator\": \"contains\", \"expected\": \"\u003c그 문장에 포함된 확인값\u003e\", \"unit\": null, \"required\": true}\n    }\n  ]\n}\n```\n\n위 꺾쇠 내용은 형식 설명용 자리다. 실제 값을 대신 만들어 제출하지 않는다. 개발 시험에서는 `purpose=synthetic_test`와 명시적인 합성 회신을 사용한다. 제출자·시각·synthetic flag는 요청으로 지정할 수 없고 서버가 정한다. 요청 JSON은 기존 256KiB 제한·중복 키·스키마 검사를 재사용한다. 큰 수정은 새 부모 버전을 지정해 나눠 제출한다.\n\n동일 키·동일 입력은 최초 버전을 반환한다. 같은 키에 다른 내용은 409다. 최신 부모나 해시가 다르면 409로 막아 동시 편집에서 기준이 분기되지 않게 한다. 원문 PDF의 같은 논리 문서에 새 파일 버전이 등록되면 이전 추출을 새로 보완·승인하지 못한다. 새 PDF 버전으로 A02를 다시 접수해야 한다.\n\n`target`과 `field`는 함께 지정한다. 위 예시는 포스터에 적힌 관람시간이며, 다른 조건은 실제 검사 대상과 항목에 맞게 지정해야 한다. 두 필드를 생략하면 현재 버전의 분류를 유지하지만, `target=unspecified`인 조건은 기대값만 채워도 승인할 수 없다. 값만 보완하면 원문 인용과 추가 조건을 유지하며, 날짜·시각 요소·파일 정보 등은 A06의 지원 범위에 따라 확인 필요로 남을 수 있다.\n\n2026-11-05부터 조건 자체가 바뀐 회신은 `resolution.replacement_text`에 전체 조건 문장을 넣는다. 이때 `target`·`field`도 명시해야 한다. 변경 문장 전체가 회신 `source.quote`에 포함되어야 하며, 기대값과 지정 단위도 변경 문장에 있어야 한다. 새 버전의 `text`를 바꾸고 이전 조건의 `qualifiers`를 해제하되, 원본 초안·PDF 인용·과거 버전은 보존한다. 새 문장에도 허용·예외·대안이 있으면 자동 통과시키지 않는다. 이미 승인한 기준은 수정할 수 없으므로 새 추출·보완·승인을 거친다.\n\nfront-v2의 **기준 보완**에서 검사 대상·항목, 보완값, 사유, 회신 출처·원문을 입력한 뒤 **검토한 기준 버전 저장**을 누른다. 저장된 보완 회신과 전체 기준을 확인하고 승인한다. 저장 전에는 이전 버전을 승인할 수 없으며, 저장 요청이 실패하면 입력 내용이 남는다.\n\n조건 전체를 바꿀 때는 **회신에 따라 조건 자체를 변경**을 선택하고 **변경한 전체 조건**을 입력한다. A04·A05에는 현재 조건·기대값과 보완 회신·출처를 함께 전달하므로 원문의 “확인 중”과 확정값을 구분할 수 있다.\n\n### 포스터 검수의 담당자 직접 확인\n\nA06이 `review`로 남긴 날짜·파일 정보·납품·허용 범위·관측 불확실성은 현재 포스터를 직접 확인한 담당자가 판단과 근거를 기록할 수 있다. `POST /runs/{run_id}/approvals`의 기존 `approve_final`·`approve_changes`에 선택 필드 `human_reviews`를 추가한다. 각 기록은 다음 형태이며 승인 전체의 `reason`도 비어 있으면 안 된다.\n\n```json\n{\n  \"criterion_id\": \"\u003c확인한 보류 조건 ID\u003e\",\n  \"verdict\": \"pass\",\n  \"observed\": \"\u003c현재 포스터에서 직접 확인한 내용\u003e\",\n  \"reference\": \"\u003c확인한 위치·자료 출처\u003e\",\n  \"reason\": \"\u003c충족 또는 불충족으로 판단한 이유\u003e\",\n  \"checked_asset\": true\n}\n```\n\n담당자 확인은 기계 판정·관측·보고서를 바꾸지 않는다. 필수 보류 항목을 모두 `pass`로 확인하고 확정 위반이 없어야 최종 승인할 수 있다. `fail`로 확인하면 수정 요청으로 연결한다. 확정 위반, 기준·기대값 누락, 근거 인용 오류, 불완전한 근거 묶음은 이 입력으로 우회할 수 없다. 미검사·판독 불가는 기존 결과를 통과시키는 대신 새로운 직접 확인 내용과 근거가 필요하다. 이전 포스터의 확인 기록은 수정본에 승계하지 않는다.\n\n화면의 **담당자 직접 확인**에서 항목별 판단·확인 내용·위치·사유를 입력하고 현재 포스터를 확인했음을 표시한다. 기존 작성자·프로젝트 권한과 승인 원장을 재사용하며 승인자·DB 시각·실행·포스터 버전과 함께 저장한다. 새 SQL 마이그레이션은 필요 없다. 이 기록은 담당자의 진술이며 외부 자료의 진위를 서버가 독립적으로 증명한 것은 아니다.\n\nA07의 선택적 문장 다듬기에 실패해도 규칙 기반 보고서와 승인 흐름은 유지한다. 보고서의 `polish_status=failed|outcome_unknown`과 안내 문구로 실패를 구분하며, 모델을 자동 재호출하지 않는다. A06 판정과 수정 요청의 근거는 그대로 남는다.\n\n## 05. 명시적 기준 승인과 재조회\n\n| 경로 | 용도 |\n|---|---|\n| POST `/runs/{run_id}/criteria-approvals` | 최신 버전 ID·해시와 검토 의사로 승인 |\n| GET `/runs/{run_id}/criteria-approval` | 승인자·서버 시각·정확한 기준·보완 출처·근거 묶음 재조회 |\n| GET `/runs/{run_id}/approvals` | 기존 승인 이력. 새 기록에도 승인 대상 버전·해시가 포함됨 |\n\n```json\n{\n  \"criteria_version_id\": \"\u003c승인할 최신 기준 UUID\u003e\",\n  \"expected_sha256\": \"\u003c그 기준 응답의 sha256\u003e\",\n  \"purpose\": \"human_review\",\n  \"reason\": \"\u003c원문과 보완 내용을 확인한 근거\u003e\",\n  \"reviewed_all_criteria\": true\n}\n```\n\n이 요청은 사용자의 실제 검토·승인 의사가 있을 때 보낸다. 일반 대화의 `1`이나 기능 실행 성공으로 자동 생성하지 않는다. 빈/공백 기대값, 수동/미지원 조건, 유효하지 않은 숫자가 하나라도 남으면 승인하지 않는다. 버전 응답의 `approval_blockers`를 확인한다. 제외한 범위와 대안·예외·허용치도 원문과 대조해야 하며, 서버의 문자열 검사가 의미 정확도나 범위 완전성을 보증하지는 않는다.\n\n서버는 원본 PDF 무결성과 최신 문서 버전, 현재 계정·프로젝트 권한, 실행/설정, 최신 기준 ID·해시를 다시 확인한다. 승인 기록·대상 연결·근거 스냅샷·실행 상태는 하나의 트랜잭션으로 확정한다. 승인 뒤에는 `waiting_asset`이며 검수 job을 만들지 않는다.\n\n`RunSnapshot.context`와 `criteria`는 최초 A02 실행의 고정 입력·원본 초안이다. 승인 대상은 `approved_criteria_version_id`를 통해 새 버전으로 조회한다. 승인 기록의 `approved_criteria_version_id`와 `criteria_sha256`에도 정확한 대상을 보존한다. `human_decision=unreviewed`는 포스터 최종 승인 상태이며 기준 승인과 다르다.\n\n승인 후 기존 기준을 수정할 수 없다. 바꿀 내용은 새 A02 실행과 기준 승인으로 처리하고 이전 승인 이력은 보존한다. 같은 키와 같은 승인 요청은 기존 승인을 반환한다. 응답을 못 받았으면 새 키로 반복 승인하지 말고 기존 키·대상·해시를 유지해 조회/재전송한다. DB 결과가 불명확하면 503을 반환하며 자동 쓰기 재시도를 하지 않는다.\n\n## 06. 검증과 다음 연결\n\n```bash\n.venv/bin/python -m pytest tests/agent_framework -q\nTEST_DB_ENV_FILE=/absolute/path/to/test-only.env .venv/bin/python -m pytest tests/agent_framework -m db_integration -q\n```\n\n새 무작위 테스트 DB에서 M008→AF003 직접 적용, AF002→AF003 반복 적용, 보완 버전과 출처 저장, 샘플 3종의 개발용 승인과 새 API 인스턴스 재조회, 경쟁 요청, 오래된 버전·변조 PDF·권한 거부, 저장 중단의 rollback, commit 응답 불명 뒤 중복 없는 재전송을 확인했다. 기존 A02·PDF 등록·검수·worker 흐름도 함께 시험했다.\n\n테스트는 한 개의 개발용 조건을 보완하고 나머지 조건의 제외 사유를 명시하는 사례를 포함한다. 실제 포스터의 전체 조건이나 원래 검토표 36개가 승인됐다는 뜻이 아니다. 원본 의뢰서의 관람시간·관람연령·우천 안내 3건은 실제 답변을 받지 않았으며 사람의 기준 승인은 여전히 미완료다. 운영 DB·Qwen 서버·front-v2·원격 CI·실제 Windows 실행은 이 검증 범위가 아니다.\n\n공통 담당 연결 파일은 `criteria_contracts.py`, `criteria_review.py`, `AF003.sql`, `postgres_schema.py`, `postgres_api.py`다. `contracts.py`의 선택적 `value_source`와 승인 대상 필드는 값이 없을 때 기존 JSON에 null 필드를 추가하지 않는다. 공통 최신 JSON Schema를 함께 사용한다.\n\n후속 7단계는 [포스터 검수·재검수 가이드](포스터_검수재검수_가이드.html)에서 이어진다. 승인 기준 버전·해시·원문과 보완 출처를 기존 저장 포스터와 별도 실행에 고정하고 새 입력 확인 후 검수한다. 6단계 자체는 포스터 대기까지이며, 7단계의 합성 관측/승인 시험도 실모델 품질·실제 사람의 결정을 증명하지 않는다.\n","sha256":"ebf4ead97f0f7701f4b7a7381d8b8810f6105325bae344ba49dc047638ff2871"},"docs/agent-framework/포스터_검수재검수_가이드.md":{"text":"# 승인 기준으로 포스터 검수·재검수\n\n2026-11-03 · 7단계 · `feat/37-a02-pdf-registration`\n\n## 01. 이번에 연결한 범위\n\n**AF003 승인 기준 조회 → 기존 저장 포스터 선택 → 새 포스터 실행 → 입력 확인 → A04·A05 → A06 → A07 → 사람 결정 → 수정본 재검수**를 연결했다. 기존 M008 사용자·프로젝트·세션·CSRF·이미지 저장과 AF001 실행·단계·승인·worker를 재사용한다. 새 DB 스키마나 이미지 업로드 경로를 만들지 않았다.\n\n검증은 격리 PostgreSQL과 실제 파일 저장소를 사용했다. 포스터 관측은 명시적 합성 sidecar 공급자이며 Qwen/OCR 결과가 아니다. 실제 Qwen 호출, 클라이언트 회신·기준 승인, 운영 DB 적용, front-v2 화면 연결은 수행하지 않았다. 기본 팀 inspector는 미연결 오류를 내며 가짜 통과를 반환하지 않는다.\n\n이번 단계로 개발용 7단계 연결 시험을 마쳤다. 실제 모델 품질·발주자 승인·제품 통합을 완료했다는 의미는 아니다. 원본 시나리오의 관람시간·관람연령·우천 안내는 여전히 실제 회신 전이다.\n\n## 02. 기준과 포스터 실행의 구분\n\nPDF-only 원본 실행은 `waiting_asset`에서 **승인 기준의 출처 실행**으로 보존한다. 원본 A02 초안·완료 단계·승인 기록을 덮어쓰지 않는다. 포스터마다 별도 실행 ID를 만든다.\n\n새 `RunSnapshot.baseline`에는 다음을 고정한다.\n\n| 필드 | 의미 |\n|---|---|\n| `source_run_id` | 원본 PDF-only A02 실행 |\n| `criteria_version_id` | AF003에서 승인한 정확한 기준 버전 |\n| `criteria_sha256` | 그 기준 본문·출처의 해시 |\n| `approval_id` | 기존 AF001에 저장한 기준 승인 기록 |\n| `document_sha256` | 원본 PDF 파일 해시 |\n\n새 실행의 조건은 최초 A02 초안이 아니라 **승인된 보완 기준**이다. 각 조건의 PDF 인용과 별도 `value_source`를 함께 보존한다. A02 단계는 `reused`와 출처 실행 ID를 기록하며 호출 시간·추론 성공을 만들어 넣지 않는다.\n\n처음 포스터 실행에는 `parent_run_id=null`이다. 수정본만 직전 검수 실행을 부모로 연결한다. 여러 최초 제안물을 같은 승인 기준에 연결할 수 있다. 원본 승인 ID를 참조하는 것과 새 포스터의 승인을 자동 복사하는 것은 다르다. 새 실행에는 승인·검사 결과·근거 묶음이 없고 `waiting_criteria`에서 시작한다.\n\n## 03. 기존 이미지 저장소 재사용\n\n포스터는 기존 제품의 POST `/api/v1/projects/{project_id}/images`로 등록한 `asset_version_id`를 사용한다. 파일 저장·정규화·원본 및 display 해시·좌표계는 기존 `Files`와 `LocalStorage`가 맡는다. 포스터 프로필에서는 front-v2의 `/api/framework/v1/projects/{project_id}/images`도 같은 M008 업로드 핸들러와 저장소를 사용한다. 이미지 조회와 확대에는 해당 버전의 display PNG를 사용한다.\n\n서버는 같은 프로젝트의 `public.asset_versions`와 `stored_files`에서 display PNG 참조를 직접 구성한다. 요청에서 임의 파일 경로·파일 해시·관측 문구를 받지 않는다. 파일 크기·실제 바이트 해시·디코딩·가로세로·display 좌표계를 확인한다. worker는 PDF와 포스터 바이트를 공급자 호출 전과 반환 뒤 다시 확인한다.\n\nPDF root는 별도 초기화한 전용 저장소, poster root는 **기존 M008 이미지 저장소**다. 둘을 섞지 않는다. 프레임워크의 poster root 열기는 초기화·복구·GC·기존 leader 기동을 수행하지 않는다. PDF marker가 있는 root는 포스터 저장소로 거부한다.\n\n기존 제품 제한은 최대 변 길이 8,192, 총 1,000만 화소다. 원본 전시 3,000×3,000과 축제 2,382×3,368은 등록·실제 읽기·해시를 확인했다. 연주회 원본 4,500×4,500은 기존 `IMAGE_LIMIT_EXCEEDED`로 거부된다. 원본을 축소·수정하거나 제한을 풀지 않았다. 원본 포스터에는 모델 판정을 수행하지 않았다.\n\n기존 업로드 한 건은 새로운 asset/version ID와 `version_no=1`을 만든다. 수정본도 이 경로로 등록한 새 ID를 사용하며, 프레임워크의 `parent_run_id`로 검수 이력을 연결한다. 동일 논리 asset의 버전 번호 증가 기능을 새로 구현한 것은 아니다.\n\n## 04. 접수와 승인 API\n\n아래 경로의 접두사는 `/api/framework/v1`이다. 기존 로그인 쿠키·CSRF·허용 Origin과 활성 프로젝트 쓰기 권한을 확인한다. 현재 쓰기 권한은 원본 A02 실행 생성자이면서 프로젝트 editor/owner인 사용자다. viewer 조회와 승인 위임은 구분하며 새로운 위임 정책은 추가하지 않았다.\n\n| 메서드·경로 | 처리 |\n|---|---|\n| GET `/runs/{source_run_id}/criteria-approval` | 정확한 승인 기준·출처·승인 ID 조회 |\n| POST `/runs/{source_run_id}/poster-reviews` | 등록 포스터로 새 실행, `waiting_criteria` |\n| POST `/runs/{poster_run_id}/approvals` | 새 입력 확인 또는 수정 요청/최종 결정 |\n| GET `/runs/{poster_run_id}` | 검수 판정·출처·고정 baseline·승인 이력 조회 |\n| GET `/runs/{poster_run_id}/steps` | A02 재사용 및 A04_A05·A06·A07 단계 조회 |\n| POST `/runs/{poster_run_id}/poster-revisions` | 수정 요청 승인 후 새 포스터 실행 |\n\n포스터 접수와 수정본 접수의 본문은 같다. `Idempotency-Key` UUID를 함께 전송한다.\n\n```json\n{\n  \"criteria_version_id\": \"\u003c조회한 승인 기준 UUID\u003e\",\n  \"expected_criteria_sha256\": \"\u003c승인 기준 응답의 criteria.sha256\u003e\",\n  \"asset_version_id\": \"\u003c기존 이미지 업로드가 반환한 UUID\u003e\"\n}\n```\n\n꺾쇠 값은 설명용이다. 실제 기준·포스터를 선택해 채우며 관측값·run/actor ID·파일 경로는 제출하지 않는다. 동일 키·동일 입력의 재전송은 기존 실행을 반환한다. 같은 키에 다른 포스터나 해시는 409다. 접수 응답이 불명확하면 기존 키를 유지해 재조회/재전송한다. DB 결과 불명은 503이며 자동으로 새 실행을 만들지 않는다.\n\n새 실행 응답의 `context` 그대로 기존 승인 API에 `decision=approve_criteria`를 제출하면 **해당 포스터와 고정 기준의 확인**을 기록하고 검수 job을 만든다. AF003 기준 승인을 다시 만들거나 다른 기준으로 바꾸지 않는다. 실제 사용자의 확인 의사 없이 이 요청을 자동 전송하지 않는다. 테스트에서만 명시적 합성 결정 입력을 사용한다.\n\nworker는 A04_A05→A06→A07을 수행하고 `waiting_review`에서 멈춘다. 기계 `pass`만 일반 `approve_final`이 가능하다. `fail/review`는 실행 실패와 다르며 자동 최종 승인하지 않는다. A06는 독립 관측값과 기대값을 대조하므로 공급자가 잘못 `pass`를 낸 날짜 오류도 `value_mismatch`로 차단한다. 빈 기대값·불확실 관측 방어는 기존 정책을 유지한다.\n\n수정할 경우 기존 실행에 `approve_changes`를 기록하고 새 포스터 ID로 `/poster-revisions`를 호출한다. 수정 요청 승인 전·같은 포스터 ID·두 번째 자식 생성은 거부한다. 자식은 같은 baseline, 새 run/asset ID, 빈 승인 이력으로 시작하며 새 입력 확인 후 A04_A05·A06·A07을 다시 수행한다. 고정 기준이 있는 실행은 임의 문맥을 받는 구형 `/revisions`로 우회할 수 없다.\n\n같은 논리 PDF의 새 버전이 등록되면 이전 기준의 신규 접수·대기 job은 오래된 문서로 차단한다. 문서/기준 변경은 새 A02→새 기준 승인 흐름을 거친다. 모델 호출 이후 권한·기준이 바뀌면 결과를 성공으로 저장하지 않는다. 완료 단계는 안전한 lease 만료 뒤 재사용하고 결과 불명 호출은 자동 반복하지 않는다.\n\n## 05. 담당자 연결 위치\n\n| 위치 | 담당 작업 |\n|---|---|\n| `backend/agent_framework/adapters/team_a04_a05.py` | `create_inspector()`가 반환할 실제 검사 객체 |\n| `inspect_poster(request, poster)` | 동기식 메서드. 검증된 `VerifiedPoster.content`와 display 크기/좌표계, 승인 조건·근거로 `InspectionResult` 반환 |\n| `team_config.poster-review.template.json` | A04_A05 `registered_poster`와 신뢰하는 Python factory 선택 |\n| `backend/agent_framework/poster_review.py` | 공통 권한·파일 읽기·기준 고정·접수/수정본 및 결정적 A07 보고 |\n| `backend/agent_framework/a02.py` | 등록 PDF 공급자와 등록 포스터 검사기 조립 |\n| `tests/agent_framework/test_poster_postgres_integration.py` | 실파일·PostgreSQL·worker 관통 시험 |\n\nfactory는 팀이 배포한 설정으로만 지정한다. HTTP 요청으로 factory나 모델 관측을 교체할 수 없다. 비동기 factory/메서드는 이 동기 포트에서 거부한다. 팀은 모델명·revision·추론 설정을 별도로 고정해야 한다. 공통 `runtime_sha256`은 프레임워크 Python 코드만 고정하므로 외부 factory/가중치 revision을 대신하지 않는다.\n\n포스터 검사기는 worker의 CC_QWEN_BASE_URL에 연결한다. A06이 관측값을 검증하면 팀 A07 보고기가 조건별 설명과 수정 요청을 만든다. 선택적인 모델 문장 다듬기가 실패해도 검증된 판정과 근거는 보고서에 남는다.\n\n## 06. 실행과 테스트\n\n프로젝트 루트에서 실행한다. 의존성 정본은 `pyproject.toml`·`uv.lock`이며 설치는 [프레임워크 안내](README.md)를 따른다. 이번 단계는 새 의존성을 추가하지 않았다. AF003이 명시적으로 적용된 개발 DB, app 전용 설정 파일, 기존 PDF와 이미지 root를 준비한다. owner 설정은 worker/API에 넘기지 않는다.\n\nfront-v2의 PDF·직접 입력 검수에는 아래 통합 설정을 API와 worker 양쪽에 지정한다. `worker-config.poster.example.json`은 실제 A04·A05와 A07 구현, Qwen 의미 추출·문단 출력을 지정한다. PDF 전용 `worker-config.example.json`과 개발용 mock template은 전체 검수용으로 사용하지 않는다. 직접 입력 저장에는 AF004 이상이 필요하며, 기존 스키마를 자동으로 변경하지 않는다.\n\n두 프로세스는 같은 DB, 전용 원문 저장소, 초기화된 M008 이미지 저장소를 사용한다. worker 전용 env에 CC_QWEN_BASE_URL을 지정하고 인증이 필요한 서버라면 A02_QWEN_API_KEY와 CC_QWEN_API_KEY를 설정한다. 예제의 A02 endpoint와 이 주소는 같은 모델 서버를 가리켜야 한다.\n\n```bash\nuv run python -m backend.agent_framework postgres-serve --env-file .runtime/framework-app.env --config deploy/qwen-a02/worker-config.poster.example.json --pdf-storage-root /absolute/existing/framework-pdf --poster-storage-root /absolute/existing/m008-images --port 8012\nuv run python -m backend.agent_framework worker --env-file .runtime/framework-worker.env --config deploy/qwen-a02/worker-config.poster.example.json --pdf-storage-root /absolute/existing/framework-pdf --poster-storage-root /absolute/existing/m008-images\n```\n\nWindows·Mac의 Docker Desktop에서는 같은 설정 파일을 scripts/framework_desktop.py의 api·worker에 넘긴다. --volume에는 기존 PDF 볼륨, --poster-volume과 --poster-subdir에는 M008 이미지 저장소를 지정한다. 호스트 터널 주소는 컨테이너에서 host.docker.internal로 변환된다.\n\n```text\npython scripts/framework_desktop.py api --env-file .runtime/framework-app.env --config deploy/qwen-a02/worker-config.poster.example.json --volume EXISTING_DOCUMENT_VOLUME --poster-volume EXISTING_IMAGE_VOLUME --poster-subdir images\npython scripts/framework_desktop.py worker --env-file .runtime/framework-worker.env --config deploy/qwen-a02/worker-config.poster.example.json --volume EXISTING_DOCUMENT_VOLUME --poster-volume EXISTING_IMAGE_VOLUME --poster-subdir images\n```\n\n위 볼륨 이름과 이미지 하위 경로는 기존 저장소의 실제 값으로 바꾼다. API와 worker에는 같은 이미지 빌드·설정·볼륨을 사용한다. front-v2의 `FRAMEWORK_API_PROXY_TARGET`은 해당 API 주소를 가리킨다.\n\n모델 서버는 이미지 입력을 받아야 한다. 기존 `deploy/qwen-a02/server.json`은 텍스트 전용 설정으로 유지한다. 포스터용 `server-poster.json`은 같은 모델·revision·포트·GPU 제한을 사용하면서 `language_model_only`만 false로 바꾼다. RunPod의 기존 환경에서 다음 명령으로 설정을 확인한다.\n\n```bash\npython deploy/qwen-a02/server.py plan --config deploy/qwen-a02/server-poster.json\npython deploy/qwen-a02/server.py check --config deploy/qwen-a02/server-poster.json\n```\n\n실제 전환은 기존 작업과 서버 종료 시점을 확인한 뒤 `serve --config deploy/qwen-a02/server-poster.json`으로 수행한다. 설정 파일 추가는 서버 재시작·가중치 다운로드·실모델 검증을 뜻하지 않는다. 이미지 인코더를 적재할 때의 GPU 메모리와 실제 이미지 추론은 전환 환경에서 확인해야 한다.\n\n입력 화면에서 요구사항을 저장할 프로젝트를 선택한다. 직접 입력은 **검수 항목 확인하기**를 누르면 텍스트 원문 저장과 A02 추출을 거쳐 기준 검토 화면으로 이동한다. PDF는 분석 후 **PDF 검수 기준 확인하기**를 누른다. PDF 문구에 내용을 추가하거나 편집한 경우 두 동작을 구분한다.\n\n- **원문 기준 승인하기**: 기존 PDF 실행에서 기준 보완·제외와 변경 사유·회신 출처를 기록하고 새 기준 버전을 승인한다.\n- **입력문으로 새 기준 분석**: 입력란 전체를 별도의 텍스트 원문으로 저장해 다시 분석한다. 원래 PDF와 실행 이력은 보존하며, PDF 출처나 이전 승인을 새 입력에 자동으로 붙이지 않는다.\n\n포스터와 기준 검토 영역에서 원문과 기대값을 확인해 기준 버전을 저장하고 승인한다. 보완이 필요한 항목이 있으면 승인이 차단된다. 담당자가 제외하기로 결정한 항목은 사유를 입력해 새 기준 버전에 기록한다. 포스터를 등록한 뒤 기준과 이미지를 확인하고 검수를 시작한다. 두 입력 경로 모두 A04·A05 → A06 → A07을 거친다.\n\n결과 화면은 기존 front-v2의 항목 목록·포스터·상세 근거를 3열로 표시한다. **보고서·담당자 승인**을 누르면 A07 보고서와 수정 요청, 담당자 확인·승인 화면으로 전환된다. **기준 다시 확인하기**에서는 승인된 기준과 원문을 읽기 전용으로 확인한다. 결과 JSON 저장에는 화면 표시용 데이터가 아니라 원래 실행 결과를 담는다.\n\n보고서에서 수정 요청을 승인하면 새 이미지를 자식 실행으로 접수할 수 있다. 자식도 같은 승인 기준으로 검수를 다시 시작해야 한다. 화면 주소의 실행 ID로 새로고침 후에도 결과 화면에서 보고서와 승인 상태를 다시 열 수 있다. 과거 `/api/reviews` 결과 조회는 유지하지만 새 검수는 그 경로로 접수하지 않는다.\n\n`/api/framework/v1/health`의 `poster_review_ready`는 역할 설정과 저장소 준비 여부이며 `poster_review_blockers`에는 누락 사유 코드가 담긴다. 화면은 이 값을 확인해 미설정 상태의 검수 접수를 막고, 직접 입력에는 `free_text_registration`도 확인한다. 이 값은 worker 가동이나 모델 서버의 이미지 추론 성공을 보증하지 않는다. 실제 실행에서는 단계 기록과 오류도 확인한다.\n\n브라우저 검사는 격리 PostgreSQL 17, 프런트 의존성, Playwright 브라우저가 필요하다. frontend에서 npm run build로 기본 화면을 빌드한다. 기존 db_integration 환경에서 FRAMEWORK_BROWSER_NODE에 Node 실행 파일, FRAMEWORK_BROWSER_CHANNEL에 chrome 또는 msedge를 지정한 뒤 다음 명령을 실행한다. 모델의 HTTP 응답만 시험용으로 대체한다.\n\n```bash\npython -m pytest -m db_integration tests/agent_framework/test_front_v2_poster_integration.py\n```\n\n\nAPI와 worker의 구성·공통 코드 revision은 같아야 한다. 코드/구성 변경 전에 접수한 job은 새 worker가 조용히 다른 설정으로 실행하지 않는다. 이전 코드를 유지해 처리하거나 새 입력을 접수하는 정책을 정한다. 승인된 원본 PDF 실행을 새 포스터 프로필로 재사용할 때는 역할 factory가 달라도 저장된 A02 단계·기준·PDF 해시를 재검증한다.\n\nHTML은 Mac·Windows에서 상대 경로로 읽는다. Python 명령은 `uv run python` 형식을 쓸 수 있지만 파일 저장소는 POSIX 기반이며 **Windows 네이티브 백엔드 실행은 미검증**이다. Windows에서 `C:\\...`로 경로만 바꾸면 저장소 호환이 보장된다고 설명하지 않는다.\n\n```bash\nuv run pytest tests/agent_framework -q\nTEST_DB_ENV_FILE=/absolute/path/to/test-only.env uv run pytest tests/agent_framework -m db_integration -q\n```\n\nDB 테스트 설정은 [PostgreSQL 실행 가이드](에이전트_프레임워크_PostgreSQL_실행가이드.html)를 따른다. 테스트 전용 서버에서만 무작위 DB를 만들고 제거한다. 환경 파일의 암호는 Git에 올리지 않는다. CI의 PostgreSQL job도 이 전체 DB 테스트 묶음을 실행하도록 수정했으며 원격 CI 실행 결과는 아직 확인하지 않았다.\n\n## 07. 시험 자료와 판정의 한계\n\n[시험 포스터 12장](../poster-baselines/2026-11-03/workflow/poster-tests/index.html)은 새 SVG 코드로 만든 개발 자료다. 원본 전시·연주회·축제 포스터를 편집하지 않았다. 사례별 제목·날짜·필수 안내 3개 조건만 명시적으로 보완하고 다른 조건은 제외 사유를 기록한 **합성 승인 기준**을 사용한다. 원래 검토표 36개가 실제 승인됐다는 뜻이 아니다.\n\n| 시험 | 독립 sidecar 관측 | 확인한 배선 결과 |\n|---|---|---|\n| 정상 | 제목·날짜·안내가 일치 | pass → 합성 최종 결정 저장 |\n| 날짜 오류 | 2099-01-16, 기준은 2099-01-15 | 공급자가 pass를 주장해도 A06 fail, 일반 최종 승인 차단 |\n| 안내 누락 | 명시적으로 확인한 부재 sentinel | fail, 일반 최종 승인 차단 |\n| 수정본 | 정상 필드 + 구분 가능한 새 이미지 바이트 | 수정 요청 승인 → 새 실행 확인 → 전체 재검사 → pass |\n\nsidecar는 실제 저장된 display 이미지 해시로 관측값을 찾으며 기대값을 복사하지 않는다. 하지만 테스트가 미리 설정한 값이며 OCR/모델 측정·실제 원본 포스터 정답·일반화 성능이 아니다. `synthetic=true` 계보를 승인·출처·근거·결과에 유지한다. 실제 사람 승인 0건, 실제 모델 호출 0회다.\n\n무결성 실패, PDF 교체 후 대기 job 차단, CSRF·권한, 접수/수정본 중복, 완료 검사 재사용, 별도 worker 프로세스, 새 API 인스턴스 재조회를 함께 검증했다. 자세한 현재 수치는 [7단계 검증 기록](../poster-baselines/2026-11-03/workflow/07_검증기록.json)을 따른다.\n","sha256":"68eb540dc9fbc164a152f7037a5a7c6f3aa185c60d41bdc8ba80012cf9f06643"},"docs/planning/pdf-qwen-rag-workflow-plan-2026-11-02.md":{"text":"# PDF·Qwen 에이전트 프레임워크 전체 계획\n\n2026-11-02 갱신 · 독립 A03 폐기 반영 · 구현과 목표 구분\n\n## 01. 기준 문서와 적용 범위\n\n정본은 [프로젝트 통합문서 20261102 정리본](../agent-framework/reference/프로젝트_통합문서_20261102.html)이다. 10/30 역할 결정과 11/02 정정을 반영한다. 독립 A03 검색·근거 에이전트는 폐기하고 A04·A05는 동일 Qwen3.5-4B를 사용하는 통합 검사로 연결한다. 별도 OCR 주·보조·fallback, VectorDB·임베딩·벡터 인덱스는 포함하지 않는다.\n\n첫 제품 연결 범위는 PDF 한 개와 포스터다. 최신 통합문서의 최종 제품 범위에는 숏폼 영상도 포함되지만 이 프레임워크 단계에서 영상·DOCX/HWPX 처리를 모두 구현하지 않는다. 데스크톱 front-v2 디자인을 유지한다. 기존 업로드·DB·사용자·프로젝트·인증·권한을 재사용한다.\n\n이전 계획의 A03 담당·RetrieveRequest·retriever factory·A03부터 재검수 표기는 이번 문서로 대체한다. 검색 보조 기능의 유지는 폐기된 에이전트를 다시 만들라는 뜻이 아니다.\n\n## 02. 목표 업무 흐름\n\n프로젝트 접근 확인 → PDF·포스터 제출 → A02 조건 초안·원문 근거 → 사람이 기준 확정 → 실행 입력·근거 고정 → A04_A05 통합 검사 → A06 결과 검증 → A07 보고 → 사람의 결과 확인.\n\n- 수정이 없고 pass이면 최종 승인으로 직접 이동한다. 세 종류의 승인이 모든 실행에서 세 번 승인해야 한다는 뜻은 아니다.\n- 수정할 때만 위치·현재 상태·바꿀 기준이 있는 수정 요청을 승인하고 제작자가 새 산출물을 제출한다.\n- A08은 새 실행·부모 연결·새 산출물 버전을 만들고 초안만 재사용한다. 새 실행에서 기준을 재승인한 뒤 조건 전체를 다시 검사한다.\n- 문서·조건 변경은 A02 새 추출·기준 확정이 필요하다. 부모 승인·최종 승인·과거 pass를 새 버전에 자동 승계하지 않는다.\n- review·필수 근거 확인 불가는 최종/예외 승인을 차단한다. 제한적인 fail 예외는 완전한 근거·확정 value_mismatch·대상 버전·사유·권한 요건을 확인한다. 기계 판정은 보존한다.\n\n## 03. 역할과 공통 책임\n\n| 구분 | 책임 | 입력 → 출력 | 구현 주체 |\n|---|---|---|---|\n| A01 공통 실행 | 단계 전환·승인 대기·실패·작업 소유권 | 접수·상태·명령 → RunSnapshot | 공통 프레임워크 |\n| A02 PDF 조건 추출 | 전체 문서 처리·조건·출처·누락 경고 | ExtractRequest → CriteriaDraft | 모델 담당 |\n| 공통 입력·근거 준비 | 승인 조건·원문·문맥 고정, 후속 관계 조회 | Context + 승인 criteria → EvidenceBundle | 공통 준비 함수·서비스 |\n| A04_A05 통합 검사 | 현재 포스터 문구·객체·로고·배치 관측 | InspectRequest → InspectionResult | 통합 검사 담당 |\n| A06 결과 검증 | 조건 누락·인용·버전·수치·판정 검증 | ValidateRequest → ValidatedResult | 공통 참조 검증기 |\n| A07 보고 | 검증 판정 보존·수정 요청 초안 | ReportRequest → ReportDraft | 보고 담당 |\n| A08 공통 재검수 | 새 실행·초안 재사용·조건 재승인 | 부모·새 산출물 → 새 RunSnapshot | 공통 프레임워크 |\n\n현재 구성 가능한 역할은 네 개다. A01·A08과 입력 준비는 모델 factory가 아니다. 번호를 다시 매기지 않는다. 별도 GraphDB 에이전트가 필요한지는 팀 논의 사항이며 현재 구현에 임의로 추가하지 않는다.\n\n## 04. 근거·관계 조회와 RAG의 위치\n\n최신 통합문서 13.2에서 채택한 조회 순서는 **PostgreSQL → Neo4j → PostgreSQL → 근거 묶음 고정**이다. 이를 검사 전 공통 문맥 준비 기능으로 둔다.\n\n1. PostgreSQL에서 현재 사용자·프로젝트 권한, 승인 기준 전체, 문서·산출물 버전과 원문을 확인한다.\n2. Neo4j에서 동일 범위의 조건·원문·승인 예외·수정 이력 관계를 탐색한다. 관계는 원본을 가리키는 연결이며 권한의 정본이 아니다.\n3. 반환된 원본 ID를 PostgreSQL에서 다시 읽어 권한·현재 버전·예외 효력·범위를 검증한다.\n4. 허용된 근거와 문맥·조회 정책·revision·한계·인용을 고정해 검사와 보고 입력으로 전달한다.\n\n승인 조건 전체가 검사 대상이다. 검색 top-k로 조건을 제외하거나 과거 판정으로 현재 관측을 대신하지 않는다. 외부 자료 안의 명령문은 자료이며 실행 권한·시스템 규칙·승인 정책을 바꾸지 못한다.\n\n근거는 현재 요구조건, 승인 예외, 과거 문맥을 구분한다. 다른 프로젝트·문서·산출물 버전, 만료·철회된 예외, 존재하지 않는 인용·변조 해시는 거부한다. empty·stale·unavailable과 조회 실패를 정상 검색 성공으로 숨기지 않는다. DB 장애를 창작물 위반으로 판단하지 않는다. SQL fallback과 Neo4j projection/outbox의 동등성·순서·재시도 정책은 실제 연결 시 별도로 확정하고 검증한다.\n\n현재 구현의 `freeze_approved_context`는 **승인 조건에 이미 포함된 출처를 복사하는 순수 함수**다. PostgreSQL·Neo4j 조회를 실행하지 않는다. `EvidenceBundle.status=complete`와 warnings는 승인 기준 출처 묶음의 범위를 나타낸다. 실제 관계 조회·RAG가 완성됐다는 뜻이 아니다. 후속 조회 서비스는 이 고정 경계를 확장하되 독립 A03 역할·factory·worker 단계로 되살리지 않는다.\n\n## 05. 현재 구현과 남은 연결\n\n| 분야 | 현재 코드가 제공하는 것 | 남은 실제 연결 |\n|---|---|---|\n| 계약·설정 | 계약 2.0.0, 네 역할, 입력·응답 재검증 | 팀별 모델 revision·프롬프트·정책 관리 |\n| 파일 접근 | 기존 저장소 재사용, 실제 바이트·버전·해시·MIME·페이지·치수 검증 | 인증된 제품 경계에서 FileAccess 주입 |\n| 조건·검사·보고 | typed port, 미설정 모델 stub, 합성 사례 | 실제 PDF/Qwen 추출·포스터 검사·보고 |\n| 근거 문맥 | 승인 출처 고정, 인용·현재 버전·범위 검증 | PostgreSQL→Neo4j→PostgreSQL 공통 조회 |\n| 실행·승인 저장 | M008 재사용 AF001 스키마·API·worker·명시적 마이그레이션 | 대상 환경 배포·백업·복구 수용 시험 |\n| 재검수 | 초안 재사용·기준 재승인·새 실행·전체 검사 | 제품의 수정 요청 상세·전후 비교 UX |\n| 프론트 | 기존 front-v2 보존 | 새 프레임워크의 인증 API·이력·비교 화면 연결 |\n\n정적 HTML·합성 테스트·개발 DB 검증을 실모델 정확도나 운영 배포 증거로 해석하지 않는다. 이전 보고서의 시험 건수는 그 시점의 이력이며 이번 변경의 검증 결과는 별도 기록한다.\n\n## 06. 영속 실행 구조\n\nAPI는 기존 세션·CSRF·프로젝트 권한을 확인해 접수·조회·승인만 처리한다. 역할 factory는 독립 worker가 초기화한다. 기존 OCR leader·worker와 다른 프레임워크 실행 경로를 사용한다. 기존 front-v2를 다시 만들지 않는다.\n\n첫 phase는 A02다. 기준 승인 시 승인 기록·기준 출처 묶음·검수 작업을 함께 저장한다. 다음 phase는 **A04_A05 → A06 → A07**이다. A03 작업이나 숨은 검색 역할 단계는 없다. 각 역할의 입력 해시·출력·상태·시각·소요 시간·오류와 승인 기록을 PostgreSQL에 보존한다.\n\n완료 단계는 동일 입력·설정·코드 revision에서만 재사용한다. worker는 모델 호출 중 DB 트랜잭션을 잡지 않는다. lease·heartbeat·fencing token·현재 권한 재확인으로 중복 선점과 오래된 결과 반영을 막는다. 호출 여부가 불명확하면 outcome_unknown으로 끝내고 자동 중복 호출하지 않는다. LangGraph checkpoint와 업무 DB가 자동으로 한 트랜잭션이라고 가정하지 않는다.\n\n승인 대기는 worker lease를 유지하지 않는다. 같은 승인·수정본 접수는 멱등 처리하고 다른 내용의 충돌은 거부한다. 최종 승인과 실행 완료·모델 pass는 서로 다른 상태다.\n\nAF001은 기존 public M008 스키마를 보존하는 추가 스키마다. 자동 마이그레이션하지 않는다. 미배포 개발 AF001에서 A03 허용 역할을 제거했다. 이전 해시를 이미 적용한 환경은 명시적인 후속 마이그레이션과 저장 실행 처리 정책이 필요하며 readiness 검사를 우회하지 않는다.\n\n## 07. 버전·권한·계약 전환\n\n문서·기준·산출물·설정·공통 코드 revision·근거 문맥을 실행별로 고정한다. 실제 모델 담당자는 모델·프롬프트·전처리·timeout을 추가로 기록한다. 승인 대상은 해당 실행·기준·산출물 버전이다.\n\n계약은 1.0.0에서 2.0.0으로 변경한다. A03 설정 키·RetrieveRequest·retriever port/factory를 제거했고 EvidenceBundle의 retrieval_id는 context_id로 변경한다. 이전 JSON·설정은 새 template과 fixture로 교체한다. 저장된 구버전 실행을 임의 변환하거나 새 코드로 자동 재개하지 않는다. HTTP 경로 `/api/framework/v1`은 별개 버전이다.\n\nAPI의 actor_id가 로그인 증거를 대신하지 않는다. worker도 현재 계정·프로젝트 접근을 재확인한다. 파일 전체 SHA-256과 인용문 해시를 혼동하지 않는다. raw 공급자 응답·원문·비밀번호를 오류 로그나 공유 fixture에 넣지 않는다.\n\n## 08. 다음 구현 순서와 완료 기준\n\n| 순서 | 작업 | 확인할 증거 |\n|---|---|---|\n| 1 | 최신 문서·네 역할 계약·흐름도 정렬 | A03 설정·factory·실행 단계 없음, 네 역할 예제·검사 |\n| 2 | A02 실제 PDF/Qwen 연결 | 전체 처리 범위·조건·원문·누락 경고와 파일 검증 |\n| 3 | 공통 관계 문맥 준비 | 허용 범위 PG→Neo4j→PG 실제 조회, 오류·지연·인용 검증 |\n| 4 | 통합 Qwen 검사·A06·보고 | 승인 조건 전체의 관측·이미지 근거·판정·한계 |\n| 5 | 기존 front-v2 API 연결 | 기준 승인·진행·결과·수정본·전후 비교·최종 승인 |\n| 6 | 통합 수용 시험 | 실사용자 권한·영속 기록·재시작·중복·장애·복구 |\n\n모델 담당자는 공통 port에 맞춘 어댑터·factory·독립 테스트·의존성을 제출하고 공통 담당자는 계약·입력 준비·DB·승인·worker를 관리한다. 실행법과 수정 파일은 [담당자 가이드](../agent-framework/에이전트_프레임워크_가이드.html), DB 적용법은 [PostgreSQL 가이드](../agent-framework/에이전트_프레임워크_PostgreSQL_실행가이드.html)를 따른다.\n\n## 09. 검증과 아직 확인하지 않은 범위\n\n회귀는 계약·파일 해시·인용·조건 누락·관측 불확실·다른 버전·승인 분기·재검수·중복·호출 결과 불명을 확인한다. 폐기한 역할의 설정/CLI 거부와 기준 승인 시 입력 고정을 직접 검사한다. PostgreSQL 시험은 임시 전용 DB에서 실행·단계·승인 저장과 worker 복구를 확인한다.\n\n실제 모델 평가에서는 조건 추출 완전성·위반 탐지·잘못 통과·보류·인용 정확도·관계 근거 적합성을 구분한다. 사람이 검증하지 않은 합성/개발 데이터의 지표를 정답셋 성능으로 표시하지 않는다.\n\nNeo4j 공통 조회, 실제 Qwen 모델, MCP 통신, 운영 DB 마이그레이션·운영 배포, front-v2 전체 연결, 실제 Windows 장치 렌더링·실행은 각각 별도 검증 대상이다. 이 문서는 해당 완료를 주장하지 않는다.\n","sha256":"cda87d125aa0b0341f2f013c944b628e3a51c3d8adcb1832dd94892c06202463"},"examples/agent_framework/README.md":{"text":"\u003e 현재 계약은 3.0.0이다. 관측 상태·단위와 A06 상세 결과를 포함한다. [A06 계약 가이드](../../docs/agent-framework/a06-contract-v3.md)에 따라 새 예제와 설정으로 전환한다. 구버전 실행은 자동 변환·재개하지 않는다. 승인 출처는 공통 context.py에서 고정하며 외부 관계 조회는 아직 실행하지 않는다.\n\n# 합성 에이전트 계약 예제\n\n이 폴더의 JSON은 실제 PDF, 포스터, 모델, PostgreSQL, Neo4j 실행 결과가 아닙니다.\n파일 ID와 SHA-256도 **합성 참조 문자열**을 나타냅니다. 원본 미디어 파일은 제공하지 않습니다.\n모든 역할 출력의 `synthetic`은 `true`이며 모델 정확도나 배포 완료 증거로 사용할 수 없습니다.\n\n| 역할 | 요청 JSON | 응답 JSON | 계약 |\n|---|---|---|---|\n| A02 조건 추출 | `A02.json` | `A02.output.json` | ExtractRequest → CriteriaDraft |\n| A04/A05 통합 검사 | `A04_A05.json` | `A04_A05.output.json` | InspectRequest → InspectionResult |\n| A06 코드 검증 | `A06.json` | `A06.output.json` | ValidateRequest → ValidatedResult |\n| A07 보고서 | `A07.json` | `A07.output.json` | ReportRequest → ReportDraft |\n\n기본 예제는 `MORNING CUP` 정확문구와 딸기 `3개` 조건을 사용합니다.\n`scenarios/`에는 `pass`, `fail`, `review`, `stale`, `unavailable`의 A06 검증 결과가 있습니다.\n`stale`과 `unavailable`에서는 합성 검사기가 충족을 주장해도 검색 근거가 불완전하므로 코드 검증이 `review`로 남깁니다.\n\n저장소 루트에서 같은 JSON을 다시 생성할 수 있습니다. 외부 서비스에 접속하지 않습니다.\n\n```sh\npython -m backend.agent_framework.adapters.generate_examples\n```\n\n`custom_adapter.py`는 팀별 어댑터 팩터리의 연결 위치만 보여 줍니다. 구현하지 않은 메서드는\n`ADAPTER_NOT_CONFIGURED`를 반환하며 합성 결과로 대체하지 않습니다. 실제 서비스를 연결할 때는\n각 메서드의 입력·출력 계약과 현재 버전·출처·인용 검증을 유지해야 합니다.\n\n## 팀별 역할 설정\n\n- `team_config.template.json`: A02·A04_A05·A07은 미설정, A06은 참조 검증기입니다. 팀 연결용으로 복사해 사용합니다.\n- `team_config.synthetic.json`: 합성 역할과 A06 참조 검증기를 명시적으로 조합합니다. 실제 모델·DB 연결을 하지 않습니다.\n- `team_adapters.py`: 역할별 `create_extractor`, `create_inspector`, `create_validator`, `create_reporter` factory의 시작점입니다. 모델·검색 stub은 호출 시 `ADAPTER_NOT_CONFIGURED`로 실패합니다.\n\n설정 파일에는 네 역할을 모두 선언하고, 역할 하나의 binding을 다음처럼 바꿉니다. 아래는 `roles.A04_A05`의 값이며 완전한 설정 파일이 아닙니다.\n\n```json\n{\n  \"kind\": \"factory\",\n  \"factory\": \"examples.agent_framework.team_adapters:create_inspector\"\n}\n```\n\n역할별 factory는 인자 없이 **단일 역할 어댑터**를 반환합니다. 기존 `custom_adapter:make_agents`와 CLI의 `--factory`는 `Agents` 전체를 반환하는 별도 경로로 유지됩니다. factory import·생성자는 부작용 없이 작성하고, 클라이언트는 역할 메서드에서 필요할 때 초기화합니다. 여러 실행이 인스턴스를 공유할 수 있으므로 클라이언트 초기화·호출 동시 접근도 담당자가 관리합니다. 미구현·연결 실패를 합성 데이터로 대체하지 않습니다.\n\nmacOS:\n\n```sh\n.venv/bin/python -m backend.agent_framework doctor --config examples/agent_framework/team_config.synthetic.json\n.venv/bin/python -m backend.agent_framework role A04_A05 --input examples/agent_framework/A04_A05.json --config examples/agent_framework/team_config.synthetic.json\n.venv/bin/python -m backend.agent_framework serve --config examples/agent_framework/team_config.synthetic.json --port 8012\n```\n\nWindows PowerShell에서는 위의 실행 파일을 `.\\.venv\\Scripts\\python.exe`로 바꾸고 동일한 인자를 사용합니다.\n\n`doctor`는 설정 검사·설명만 하며 설정된 모듈의 import, factory·역할 호출, 접속 검증은 하지 않습니다. `role --config`는 선택한 역할만 생성합니다. `serve --config`는 동일 구성으로 개발 API를 열며 loopback `127.0.0.1`, 단일 worker, 인증 없음, 메모리 저장 범위입니다. 시작만으로 검수·승인을 실행하지 않습니다. `GET /api/framework/v1/configuration`에서 구성 선언과 초기화 상태를 확인할 수 있으며 실제 연결 검증은 별개입니다.\n\n공통 CLI·실행기 호출은 같은 계약 검증을 적용하고 중첩 합성 입력의 표시를 결과까지 유지합니다. 자세한 소유 범위·계약 규칙은 [개발 가이드](../../docs/agent-framework/README.md)를 따릅니다. 개발 정본은 루트 `backend/agent_framework`, `docs/agent-framework`, `tests/agent_framework`이며 `share/에이전트_흐름도`는 수정 대상이 아닌 배포 사본입니다.\n\n## 여러 예제의 계약 검사\n\n`checks/`의 역할별 `*.suite.json`과 요청 fixture는 `python -m scripts.export_agent_framework`로 생성합니다. 네 역할에 총 17개 사례가 있으며 A06/A07의 정상 `fail`·`review` 판정과 범위 위반 거부도 구분합니다.\n\n```sh\n.venv/bin/python -m backend.agent_framework check A07 --config examples/agent_framework/team_config.synthetic.json --cases examples/agent_framework/checks/A07.suite.json\n```\n\nWindows PowerShell에서는 실행 파일을 `.\\.venv\\Scripts\\python.exe`로 바꿉니다. 입력 경로는 suite 파일 기준의 상대 경로입니다. `--output \u003c파일\u003e`로 결과 요약을 저장할 수 있으며 종료 코드는 기대 일치 0, 검사 실패 1, 잘못된 입력·설정 2입니다. 결과 불명은 실패로 남기고 나머지 사례를 중단하며 자동 재시도하지 않습니다.\n\n이 fixture에는 실제 미디어 파일이 없습니다. 실모델·검색 어댑터를 검사할 때는 자기 개발 입력과 기대값을 가진 별도 suite를 만듭니다. 보고서의 `passed`는 선언한 기대와의 일치이며 모델 정확도나 DB 연결 성공 인증이 아닙니다. 세부 규격은 [개발 가이드의 역할별 계약 검사](../../docs/agent-framework/README.md#역할별-계약-검사-묶음-실행)를 참고하세요.\n\n## 실제 파일 바이트 연결 예제\n\n`python -m examples.agent_framework.file_access_demo`는 실행할 때 PDF·PNG를 생성하고, 기존 `services.store_file`·`LocalStorage`와 격리 SQLite의 기존 모델로 등록·조회합니다. 실제 바이트 해시·페이지·치수 및 변경된 해시 참조 거부를 확인합니다. 생성 테스트 미디어이며 운영 DB·사용자 업로드·Qwen·Neo4j를 사용하지 않습니다.\n\n## 단계별 실행 기록\n\n`python -m backend.agent_framework demo`의 `runs[].step_records`에서 역할별 상태·UTC 시작/종료 시각·소요 시간을 확인합니다. 재검수의 A02는 `reused`와 부모 실행 ID로 표시되며 모델을 다시 실행한 기록이 아닙니다.\n\n같은 `Workflow` 객체의 `get_steps(run_id)` 또는 개발 API `GET /api/framework/v1/runs/{run_id}/steps`로 실행 중인 역할도 조회할 수 있습니다. 시작·승인 POST는 여전히 동기식입니다. 오류 시 후속 역할을 실행하지 않으며 결과 불명과 일반 실패를 구분합니다. 예제는 합성 어댑터와 테스트 승인을 사용하고 기록은 메모리에만 남습니다. 별도로 실행한 CLI와 API 프로세스는 기록을 공유하지 않습니다.\n\n## 설정한 역할의 전체 흐름 검사\n\n```sh\n.venv/bin/python -m backend.agent_framework check-flow --config examples/agent_framework/team_config.synthetic.json --case examples/agent_framework/workflow.synthetic.json\n.venv/bin/python -m examples.agent_framework.file_flow_demo\n```\n\nWindows는 실행 파일을 `.\\.venv\\Scripts\\python.exe`로 바꿉니다. `check-flow`는 네 역할을 구성해 테스트 조건 승인→검사·보고→수정 승인→수정본 재검수→최종 승인을 확인합니다. `--output 보고서.json`으로 요약을 저장하며 전체 기대 일치 0, 실패·결과 불명·불일치 1, 입력·설정 오류 2를 반환합니다. 오류·기대 불일치 뒤에는 나머지 동작을 건너뜁니다.\n\n`workflow.synthetic.json`은 실제 미디어가 없는 합성 참조입니다. 담당자 구성에는 별도 개발 사례의 PDF·포스터 ID·버전·해시와 기대 판정을 입력합니다. `file_flow_demo`는 생성 PDF와 실제 PNG 두 버전을 기존 저장소에 넣고, 파일 검증 후 PDF 텍스트·픽셀 테스트 콜백으로 최초 불합격→수정본 통과를 확인합니다. Qwen·Neo4j 호출은 없으며 임시 SQLite·파일은 종료 후 정리됩니다. 모든 승인은 테스트 값이고 실행 기록은 메모리에만 남습니다.\n\n자세한 사례 계약과 보고서 규격은 [전체 흐름 검증 안내](../../docs/agent-framework/README.md#설정한-어댑터의-전체-흐름-검증)를 참고하세요.\n\n파일 접근용 `VerifiedFileAccess`, 기존 저장소 어댑터, `FileBackedExtractor/FileBackedInspector` 연결 방법은 [개발 가이드](../../docs/agent-framework/README.md#기존-저장소의-pdf포스터-읽기)에 있습니다. 테스트 fixture의 합성 참조를 실파일 ID로 자동 변환하지 않습니다. macOS는 `.venv/bin/python`, Windows는 `.\\.venv\\Scripts\\python.exe`로 실행합니다.\n","sha256":"5024db537a5f9c0ce51ce8569545e0733f90ae30e624493ad5ca0f75114704c8"},"examples/agent_framework/file_flow_demo.py":{"text":"\"\"\"Configured full-flow demo using generated real files and fixture callbacks.\n\nExplicit execution only. Uses isolated SQLite, existing store_file/LocalStorage,\nPDF text extraction and a deterministic pixel counter, not Qwen or RAG. The\nContextVar is a scoped dependency seam for this demo's local factories only.\nImporting this module creates no files, database connections or model clients.\n\"\"\"\nfrom __future__ import annotations\n\nfrom contextvars import ContextVar\nfrom hashlib import sha256\nfrom io import BytesIO\nimport json\nfrom pathlib import Path\nfrom tempfile import TemporaryDirectory\n\n_files = ContextVar(\"file_flow_demo_access\")\n\n\ndef _extract(request, document):\n    import pymupdf\n    from backend.agent_framework.contracts import CriteriaDraft, Criterion, SourceRef\n\n    with pymupdf.open(stream=document.content, filetype=\"pdf\") as pdf:\n        quote = pdf[0].get_text().strip()\n    if quote != \"Display exactly 3 green marks.\":\n        raise ValueError(\"unexpected generated fixture\")\n    source = SourceRef(document_version_id=request.document.document_version_id,\n        page=1, block_id=\"generated-line-1\", quote=quote, source_hash=sha256(quote.encode()).hexdigest())\n    return CriteriaDraft(context=request.context, synthetic=True,\n        warnings=(\"Generated fixture; PDF text extraction and pixel counting, not Qwen inference.\",),\n        criteria=(Criterion(criterion_id=\"green-marks\", text=quote, kind=\"number\", expected=\"3\",\n                            operator=\"equals\", unit=\"개\", source=source),))\n\n\ndef _inspect(request, poster):\n    from PIL import Image\n    from backend.agent_framework.contracts import ImageEvidence, InspectionResult, Observation\n\n    with Image.open(BytesIO(poster.content)) as image:\n        image = image.convert(\"RGB\")\n        count = sum(image.getpixel((x, 12)) == (49, 91, 72) for x in (8, 16, 24))\n    criterion = request.criteria[0]\n    citations = tuple(e.evidence_id for e in request.evidence.evidence if criterion.criterion_id in e.criterion_ids)\n    return InspectionResult(context=request.context, synthetic=True, observations=(Observation(\n        criterion_id=criterion.criterion_id, observed=str(count), verdict=\"pass\" if count == 3 else \"fail\",\n        observation_status=\"observed\", observed_unit=\"개\",\n        evidence_ids=citations, image=ImageEvidence(asset_version_id=request.asset.asset_version_id,\n            asset_hash=request.asset.sha256, bbox=(0, 0, 1, 1))),))\n\n\ndef create_extractor():\n    from backend.agent_framework.adapters.file_backed import FileBackedExtractor\n    return FileBackedExtractor(_files.get(), _extract)\n\n\ndef create_inspector():\n    from backend.agent_framework.adapters.file_backed import FileBackedInspector\n    return FileBackedInspector(_files.get(), _inspect)\n\n\ndef run_demo():\n    import pymupdf\n    from PIL import Image\n    from backend.creative_checker.database import Base, create_engine, session_factory\n    from backend.creative_checker.models import Asset, AssetVersion, Document, Membership, Project, User, new_id\n    from backend.creative_checker.tool_records import ToolCall  # noqa: F401 — complete existing metadata\n    from backend.creative_checker.services import commit, store_file\n    from backend.creative_checker.storage import LocalStorage\n    from backend.agent_framework.adapters.project_files import CreativeCheckerCatalog, CreativeCheckerStorageReader\n    from backend.agent_framework.composition import RoleBinding, TeamConfiguration, load_config\n    from backend.agent_framework.contracts import AssetRef, Context, DocumentRef\n    from backend.agent_framework.files import VerifiedFileAccess\n    from backend.agent_framework.flow_checks import FlowCheckCase, load_flow_case, run_flow_check\n\n    with pymupdf.open() as pdf:\n        pdf.new_page().insert_text((36, 60), \"Display exactly 3 green marks.\")\n        pdf_bytes = pdf.tobytes()\n\n    def poster_bytes(count):\n        stream = BytesIO()\n        with Image.new(\"RGB\", (32, 24), \"white\") as image:\n            for x in (8, 16, 24)[:count]:\n                image.putpixel((x, 12), (49, 91, 72))\n            image.save(stream, format=\"PNG\")\n        return stream.getvalue()\n\n    engine = create_engine(\"sqlite://\")\n    try:\n        Base.metadata.create_all(engine)  # Isolated demo DB only; never product startup.\n        sessions = session_factory(engine)\n        with TemporaryDirectory(prefix=\"cc-file-flow-\") as temporary:\n            root = Path(temporary)\n            storage = LocalStorage(root / \"files\")\n            with sessions() as db:\n                user = User(id=new_id(), email=\"flow-fixture@example.test\", name=\"Flow fixture\",\n                            password_hash=\"disabled-demo-account\", active=True)\n                db.add(user); db.flush()\n                project = Project(id=new_id(), name=\"Isolated flow fixture\", created_by=user.id)\n                db.add(project); db.flush()\n                db.add(Membership(project_id=project.id, user_id=user.id, role=\"editor\"))\n                document_file = store_file(db, storage, project, user, \"requirements.pdf\", pdf_bytes, \"application/pdf\")\n                document = Document(id=new_id(), project_id=project.id, version=1,\n                    file_id=document_file.id, filename=\"requirements.pdf\", created_by=user.id)\n                asset = Asset(id=new_id(), project_id=project.id, name=\"Green marks\", kind=\"poster\", created_by=user.id)\n                db.add_all([document, asset]); db.flush()\n                versions = []\n                for index, count in enumerate((2, 3), 1):\n                    file = store_file(db, storage, project, user, f\"poster-v{index}.png\", poster_bytes(count), \"image/png\")\n                    version = AssetVersion(id=new_id(), project_id=project.id, asset_id=asset.id, version=index,\n                        file_id=file.id, filename=f\"poster-v{index}.png\", created_by=user.id,\n                        media_metadata={\"actual_mime\": \"image/png\", \"width\": 32, \"height\": 24})\n                    db.add(version); db.flush()\n                    versions.append(AssetRef(file_id=file.id, asset_version_id=version.id,\n                                             sha256=file.sha256, width=32, height=24))\n                context = Context(project_id=project.id, actor_id=user.id, run_id=\"generated-flow-1\",\n                    document_version_id=document.id, criteria_version_id=\"generated-criteria\",\n                    asset_version_id=versions[0].asset_version_id)\n                revised = context.model_copy(update={\"run_id\": \"generated-flow-2\", \"parent_run_id\": context.run_id,\n                                                     \"asset_version_id\": versions[1].asset_version_id})\n                case = FlowCheckCase(id=\"generated-file-flow\", context=context,\n                    document=DocumentRef(file_id=document_file.id, document_version_id=document.id,\n                        sha256=document_file.sha256, page_count=1), asset=versions[0],\n                    revision_context=revised, revision_asset=versions[1], expected_initial_verdict=\"fail\",\n                    change_reason=\"Generated fixture: replace two marks with three, then review the entire new version.\")\n                actor = user.id\n                commit(db)\n            access = VerifiedFileAccess(CreativeCheckerCatalog(sessions, actor), CreativeCheckerStorageReader(storage))\n            module = \"examples.agent_framework.file_flow_demo\"\n            config = TeamConfiguration(roles={\n                \"A02\": RoleBinding(kind=\"factory\", factory=f\"{module}:create_extractor\"),\n                \"A04_A05\": RoleBinding(kind=\"factory\", factory=f\"{module}:create_inspector\"),\n                \"A06\": RoleBinding(kind=\"reference\"), \"A07\": RoleBinding(kind=\"synthetic\"),\n            })\n            (root / \"config.json\").write_text(config.model_dump_json(), encoding=\"utf-8\")\n            (root / \"workflow.json\").write_text(case.model_dump_json(), encoding=\"utf-8\")\n            # Use the importable module's dependency scope even when invoked via -m.\n            import importlib\n            factories = importlib.import_module(module)\n            token = factories._files.set(access)\n            try:\n                report = run_flow_check(load_flow_case(root / \"workflow.json\"), load_config(root / \"config.json\"))\n            finally:\n                factories._files.reset(token)\n            return {\"generated_test_media\": True, \"database\": \"isolated SQLite\", \"model_calls\": 0,\n                    \"operational_database_checked\": False, \"workflow\": report,\n                    \"notice\": \"Existing storage reads and deterministic PDF/pixel fixture callbacks; no Qwen, Neo4j or authenticated human approval.\"}\n    finally:\n        engine.dispose()\n\n\nif __name__ == \"__main__\":\n    result = run_demo()\n    print(json.dumps(result, ensure_ascii=True, indent=2))\n    raise SystemExit(0 if result[\"workflow\"][\"passed\"] else 1)\n","sha256":"67f22e63bce20e1fde94e462057fb73fda102a5fac286c46320c28d50b5c3aeb"},"examples/agent_framework/team_adapters.py":{"text":"\"\"\"Independent team-owned role factories; intentionally no real model or DB I/O.\n\nEach zero-argument factory returns one adapter, not an Agents collection. Keep\nimports and constructors free of network/database/model loading. A teammate may\ncreate a client lazily inside the role method after implementing its contract.\nInstances can be shared between runs: guard mutable state and client concurrency.\nUntil implemented, these seams raise ADAPTER_NOT_CONFIGURED and never substitute\nsynthetic fixtures. Real implementations must preserve nested synthetic flags.\n\"\"\"\nfrom __future__ import annotations\n\nfrom backend.agent_framework.adapters.templates import (\n    QwenAdapterStub,\n)\nfrom backend.agent_framework.contracts import (\n    CriteriaDraft,\n    EvidenceBundle,\n    ExtractRequest,\n    InspectRequest,\n    InspectionResult,\n    ReportDraft,\n    ReportRequest,\n)\nfrom backend.agent_framework.ports import Extractor, Inspector, Reporter, Validator\nfrom backend.agent_framework.validation import ReferenceValidator\n\n\nclass TeamPDFExtractor(QwenAdapterStub):\n    \"\"\"A02 owner: implement PDF-to-criteria extraction with source provenance.\"\"\"\n\n    def extract(self, request: ExtractRequest) -\u003e CriteriaDraft:\n        # Replace this body with your implementation; preserve the request scope.\n        return super().extract(request)\n\n\nclass TeamPosterInspector(QwenAdapterStub):\n    \"\"\"A04/A05 owner: inspect this poster version against all approved criteria.\"\"\"\n\n    def inspect(self, request: InspectRequest) -\u003e InspectionResult:\n        # Historical evidence must not be presented as current observations.\n        return super().inspect(request)\n\n\nclass TeamReportWriter(QwenAdapterStub):\n    \"\"\"A07 owner: explain the validated verdict without changing that verdict.\"\"\"\n\n    def report(self, request: ReportRequest) -\u003e ReportDraft:\n        # Preserve validated citations and limitations in the returned report.\n        return super().report(request)\n\n\ndef create_extractor() -\u003e Extractor:\n    return TeamPDFExtractor()\n\n\ndef create_inspector() -\u003e Inspector:\n    return TeamPosterInspector()\n\n\ndef create_validator() -\u003e Validator:\n    \"\"\"Reference code validation only; no model or source-authenticity proof.\"\"\"\n    return ReferenceValidator()\n\n\ndef create_reporter() -\u003e Reporter:\n    return TeamReportWriter()\n","sha256":"838016173e17eed40382fe4ea6d9025b1e8633e87b480fe4b4e2e7c5b637dc8a"},"examples/agent_framework/team_config.synthetic.json":{"text":"{\n  \"contract_version\": \"3.0.0\",\n  \"profile\": \"development\",\n  \"roles\": {\n    \"A02\": {\n      \"contract_version\": \"3.0.0\",\n      \"kind\": \"synthetic\"\n    },\n    \"A04_A05\": {\n      \"contract_version\": \"3.0.0\",\n      \"kind\": \"synthetic\"\n    },\n    \"A06\": {\n      \"contract_version\": \"3.0.0\",\n      \"kind\": \"reference\"\n    },\n    \"A07\": {\n      \"contract_version\": \"3.0.0\",\n      \"kind\": \"synthetic\"\n    }\n  }\n}\n","sha256":"5dc7029245675fd331e6cddd3a8c18f09af58b5f2261e49cdbd6b9eb122b9e5e"},"examples/agent_framework/team_config.template.json":{"text":"{\n  \"contract_version\": \"3.0.0\",\n  \"profile\": \"development\",\n  \"roles\": {\n    \"A02\": {\n      \"contract_version\": \"3.0.0\",\n      \"kind\": \"unconfigured\"\n    },\n    \"A04_A05\": {\n      \"contract_version\": \"3.0.0\",\n      \"kind\": \"unconfigured\"\n    },\n    \"A06\": {\n      \"contract_version\": \"3.0.0\",\n      \"kind\": \"reference\"\n    },\n    \"A07\": {\n      \"contract_version\": \"3.0.0\",\n      \"kind\": \"unconfigured\"\n    }\n  }\n}\n","sha256":"00d95e1d44532a2953a6827781483133565fbe003f4b4a0b06b405c464e6affe"},"examples/agent_framework/workflow.synthetic.json":{"text":"{\n  \"contract_version\": \"3.0.0\",\n  \"id\": \"synthetic-approval-rereview\",\n  \"context\": {\n    \"contract_version\": \"3.0.0\",\n    \"project_id\": \"synthetic-project\",\n    \"run_id\": \"demo-run-1\",\n    \"actor_id\": \"synthetic-reviewer\",\n    \"document_version_id\": \"document-v1\",\n    \"criteria_version_id\": \"criteria-v1\",\n    \"asset_version_id\": \"poster-v1\",\n    \"parent_run_id\": null\n  },\n  \"document\": {\n    \"contract_version\": \"3.0.0\",\n    \"file_id\": \"synthetic-pdf-reference\",\n    \"document_version_id\": \"document-v1\",\n    \"sha256\": \"dbf21f8e6c7c3af1c860ae8b58a157066944aa6feced8abb0a1d19e5b5230ce1\",\n    \"media_type\": \"application/pdf\",\n    \"page_count\": 1\n  },\n  \"asset\": {\n    \"contract_version\": \"3.0.0\",\n    \"file_id\": \"synthetic-poster-v1\",\n    \"asset_version_id\": \"poster-v1\",\n    \"sha256\": \"3cc920b3991a50e0558d753bb4429fa2ddd31ceeb3268a9c286e5d2b9c62c511\",\n    \"media_type\": \"image/png\",\n    \"width\": 1200,\n    \"height\": 1600\n  },\n  \"revision_context\": {\n    \"contract_version\": \"3.0.0\",\n    \"project_id\": \"synthetic-project\",\n    \"run_id\": \"demo-run-2\",\n    \"actor_id\": \"synthetic-reviewer\",\n    \"document_version_id\": \"document-v1\",\n    \"criteria_version_id\": \"criteria-v1\",\n    \"asset_version_id\": \"poster-v2\",\n    \"parent_run_id\": \"demo-run-1\"\n  },\n  \"revision_asset\": {\n    \"contract_version\": \"3.0.0\",\n    \"file_id\": \"synthetic-poster-v2\",\n    \"asset_version_id\": \"poster-v2\",\n    \"sha256\": \"35fce4fe4d9d1fd6d94a211cb5399c3ed15e9564b59e369ca80b921f3a07cf9f\",\n    \"media_type\": \"image/png\",\n    \"width\": 1200,\n    \"height\": 1600\n  },\n  \"expected_initial_verdict\": \"pass\",\n  \"expected_revised_verdict\": \"pass\",\n  \"change_reason\": \"합성 개발 입력: 수정 승인과 새 버전의 전체 재검수를 확인합니다.\"\n}\n","sha256":"32011be087e32eabf062303f5c623b127047bb21eed01e8655343174dcf8af9a"},"scripts/framework_desktop.py":{"text":"\"\"\"Mac/Windows host launcher for a shared Linux framework runtime.\n\nHost needs Python + Docker Desktop; native Windows POSIX-storage emulation is\nnot attempted. Real payloads stay in a Linux named volume, never an NTFS bind.\nNo DB bootstrap/migration, image build, storage init or SSH key copying is implicit.\n\"\"\"\nimport argparse\nfrom contextlib import contextmanager\nimport json\nimport os\nfrom pathlib import Path,PurePosixPath\nimport re\nimport subprocess\nimport sys\nimport tempfile\nfrom urllib.parse import urlsplit,urlunsplit\n\nROOT=Path(__file__).resolve().parents[1]\nsys.path.insert(0,str(ROOT))\nfrom backend.environment_source import select_service_values,service_file_values\n\nIMAGE='creative-checker-framework:local'\nVOLUME='cc-framework-data'\n\n\ndef name(value):\n    if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]{0,100}',value):raise argparse.ArgumentTypeError('Use a Docker name, not a host filesystem path.')\n    return value\n\n\ndef read_env(path):\n    values={}\n    for raw in Path(path).read_text(encoding='utf-8-sig').splitlines():\n        line=raw.strip()\n        if not line or line.startswith('#'):continue\n        key,sep,value=line.partition('=')\n        if not sep or not re.fullmatch(r'[A-Z][A-Z0-9_]*',key) or key in values:raise ValueError('ENV_FORMAT_INVALID')\n        values[key]=value\n    return values\n\n\ndef mapped_endpoint(value):\n    url=urlsplit(value)\n    if url.hostname not in ('localhost','127.0.0.1','::1'):return value\n    if url.username or url.password:raise ValueError('ENDPOINT_CREDENTIALS_FORBIDDEN')\n    host='host.docker.internal'+(':'+str(url.port) if url.port else '')\n    return urlunsplit((url.scheme,host,url.path,url.query,url.fragment))\n\n\ndef write_private(path,raw):\n    with Path(path).open('x',encoding='utf-8',newline='\\n') as stream:stream.write(raw)\n    Path(path).chmod(0o600)\n\n\n@contextmanager\ndef settings(args):\n    values=read_env(args.env_file)\n    if args.action!='migrate':values=service_file_values(values)\n    if args.action!='migrate' and any(values.get(k) for k in ('DB_OWNER_PASSWORD','POSTGRES_PASSWORD')):\n        raise ValueError('APP_CREDENTIALS_ONLY')\n    if args.action in ('api','worker'):\n        # Apply the same role allowlist before writing the mounted file.\n        # Filtering only inside the container would leave other roles' secrets readable.\n        role='v1' if args.action=='api' else 'framework-worker'\n        values=select_service_values(role,values)\n    if values.get('CC_NEO4J_URI'):\n        values['CC_NEO4J_URI']=mapped_endpoint(values['CC_NEO4J_URI'])\n    if values.get('CC_QWEN_BASE_URL'):\n        values['CC_QWEN_BASE_URL']=mapped_endpoint(values['CC_QWEN_BASE_URL'])\n    if values.get('DB_HOST') in ('localhost','127.0.0.1','::1'):values['DB_HOST']='host.docker.internal'\n    config=None\n    if args.action in ('api','worker'):\n        config=json.loads(Path(args.config).read_text(encoding='utf-8-sig'))\n        if not isinstance(config,dict) or not isinstance(config.get('roles'),dict):raise ValueError('TEAM_CONFIG_INVALID')\n        pdf=config.get('pdf_extraction')\n        if pdf is not None and not isinstance(pdf,dict):raise ValueError('TEAM_CONFIG_INVALID')\n        if pdf and pdf.get('mode')=='qwen':pdf['endpoint']=mapped_endpoint(pdf['endpoint'])\n        inspector=config['roles'].get('A04_A05')\n        if not isinstance(inspector,dict):raise ValueError('TEAM_CONFIG_INVALID')\n        if inspector.get('kind')=='registered_poster' and not args.poster_volume:\n            raise ValueError('EXISTING_POSTER_VOLUME_REQUIRED')\n    with tempfile.TemporaryDirectory(prefix='cc-framework-desktop-') as directory:\n        folder=Path(directory)\n        write_private(folder/'app.env',''.join(k+'='+v+'\\n' for k,v in values.items()))\n        if config is not None:write_private(folder/'team.json',json.dumps(config,ensure_ascii=False,indent=2)+'\\n')\n        yield folder\n\n\ndef mount_file(source,target):\n    # Separate argv tokens preserve Windows drive letters, spaces and Korean.\n    return ['--volume',str(Path(source).resolve())+':'+target+':ro']\n\n\ndef docker_command(args,folder=None):\n    if args.action=='build':\n        return ['docker','build','--file',str(ROOT/'deploy/agent-framework/Dockerfile'),'--tag',args.image,str(ROOT)]\n    base=['docker','run','--rm','--init']\n    if sys.platform.startswith('linux'):base+=['--add-host','host.docker.internal:host-gateway']\n    if args.container_name:base+=['--name',args.container_name]\n    if args.network:base+=['--network',args.network]\n    if args.action in ('init-pdf','api','worker'):base+=['--volume',args.volume+':/data']\n    if args.action=='init-pdf':return base+[args.image,'init-pdf-storage','--root','/data/pdf']\n    if args.action=='demo':return base+[args.image,'demo']\n    base+=mount_file(folder/'app.env','/run/framework/app.env')\n    if args.action in ('api','worker'):base+=mount_file(folder/'team.json','/run/framework/team.json')\n    if args.action=='api':base+=['--publish',f'127.0.0.1:{args.port}:8012']\n    if args.poster_volume:\n        parts=PurePosixPath(args.poster_subdir)\n        if parts.is_absolute() or '..' in parts.parts or '\\\\' in args.poster_subdir:raise ValueError('POSTER_SUBDIR_INVALID')\n        base+=['--volume',args.poster_volume+':/poster']\n    action={'api':'postgres-serve','check':'postgres-check','migrate':'migrate-postgres'}.get(args.action,args.action)\n    base+=[args.image,action,'--env-file','/run/framework/app.env']\n    if args.action=='migrate':base+=['--revision',args.revision]\n    if args.action in ('api','worker'):\n        base+=['--config','/run/framework/team.json','--pdf-storage-root','/data/pdf']\n        if args.poster_volume:base+=['--poster-storage-root',str(PurePosixPath('/poster')/args.poster_subdir)]\n    if args.action=='api':base+=['--host','0.0.0.0','--port','8012']\n    if args.action in ('worker','graph-projector') and args.once:base+=['--once']\n    if args.action=='graph-rebuild':base+=['--project-id',str(args.project_id)]\n    return base\n\n\ndef ssh_command(args):\n    if not re.fullmatch(r'[A-Za-z0-9_.:-]+',args.ssh_host) or args.ssh_host.startswith('-'):raise ValueError('SSH_HOST_INVALID')\n    if not re.fullmatch(r'[A-Za-z0-9_-]+',args.ssh_user):raise ValueError('SSH_USER_INVALID')\n    return ['ssh','-N','-o','ExitOnForwardFailure=yes','-o','ServerAliveInterval=30',\n        '-L',f'127.0.0.1:{args.local_port}:127.0.0.1:{args.remote_port}',\n        '-p',str(args.ssh_port),'-i',str(Path(args.identity).expanduser()),args.ssh_user+'@'+args.ssh_host]\n\n\ndef parser():\n    p=argparse.ArgumentParser(description=__doc__)\n    p.add_argument('action',choices=('doctor','build','demo','init-config','init-pdf','check','api','worker','migrate','tunnel','graph-init','graph-projector','graph-rebuild','graph-check'))\n    p.add_argument('--image',default=IMAGE)\n    p.add_argument('--project-id')\n    p.add_argument('--volume',type=name,default=VOLUME)\n    p.add_argument('--poster-volume',type=name)\n    p.add_argument('--poster-subdir',default='images')\n    p.add_argument('--network',type=name)\n    p.add_argument('--container-name',type=name)\n    p.add_argument('--env-file',type=Path)\n    p.add_argument('--config',type=Path,default=ROOT/'examples/agent_framework/team_config.pdf-mock.json')\n    p.add_argument('--port',type=int,default=8012)\n    p.add_argument('--once',action='store_true')\n    p.add_argument('--revision',choices=('AF001','AF002','AF003','AF004','AF005'),default='AF003')\n    p.add_argument('--ssh-host')\n    p.add_argument('--ssh-user',default='root')\n    p.add_argument('--ssh-port',type=int,default=20719)\n    p.add_argument('--identity',default=str(Path.home()/'.ssh/id_ed25519'))\n    p.add_argument('--local-port',type=int,default=18015)\n    p.add_argument('--remote-port',type=int,default=8015)\n    return p\n\n\ndef main(argv=None):\n    p=parser();args=p.parse_args(argv)\n    for value in (args.port,args.ssh_port,args.local_port,args.remote_port):\n        if not 1\u003c=value\u003c=65535:p.error('Port must be between 1 and 65535.')\n    if args.action in ('check','api','worker','migrate','graph-init','graph-projector','graph-rebuild','graph-check') and args.env_file is None:p.error('--env-file is required.')\n    if args.action=='tunnel' and not args.ssh_host:p.error('--ssh-host is required.')\n    try:\n        if args.action=='init-config':\n            target=args.env_file or ROOT/'.runtime/framework-desktop.env'\n            target.parent.mkdir(parents=True,exist_ok=True)\n            write_private(target,(ROOT/'deploy/agent-framework/app.env.example').read_text(encoding='utf-8'))\n            print(json.dumps({'created':str(target),'existing_env_overwritten':False}));return 0\n        if args.action=='doctor':\n            result=subprocess.run(['docker','info','--format','{{.OSType}}'],capture_output=True,text=True,timeout=20)\n            if result.returncode or result.stdout.strip()!='linux':raise ValueError('DOCKER_LINUX_ENGINE_REQUIRED')\n            print(json.dumps({'docker_engine':'linux','host_platform':sys.platform,'storage':'Linux named volume','model_server_verified':False}));return 0\n        if args.action=='tunnel':return subprocess.run(ssh_command(args),shell=False).returncode\n        if args.action in ('build','demo','init-pdf'):return subprocess.run(docker_command(args),cwd=ROOT,shell=False).returncode\n        with settings(args) as folder:return subprocess.run(docker_command(args,folder),cwd=ROOT,shell=False).returncode\n    except KeyboardInterrupt:return 130\n    except (OSError,ValueError,subprocess.SubprocessError) as error:\n        # Never echo settings, secret values, subprocess output or argv.\n        code=str(error) if isinstance(error,ValueError) else type(error).__name__\n        print(json.dumps({'error':code}),file=sys.stderr);return 2\n\n\nif __name__=='__main__':raise SystemExit(main())\n","sha256":"1399e3874f130ecd22525827b4f13eef571d92c66746306162d4db9c9661ecba"}}</script><script>
(() => {
  'use strict';
  const sources=JSON.parse(document.getElementById('source-data').textContent);
  const paths=Object.keys(sources), select=document.getElementById('file'), code=document.getElementById('code');
  for(const path of paths){const option=document.createElement('option');option.value=path;option.textContent=path;select.append(option);}
  const requested=new URLSearchParams(location.search).get('file'), path=requested===null?paths[0]:requested;
  if(!Object.prototype.hasOwnProperty.call(sources,path)){
    const error=document.getElementById('error');error.hidden=false;error.textContent='묶음에 포함되지 않은 파일입니다. 목록에서 파일을 선택해 주세요.';code.hidden=true;select.selectedIndex=-1;
  }else{
    select.value=path;document.getElementById('path').textContent=path;document.getElementById('hash').textContent='SHA-256 · '+sources[path].sha256;
    const lines=sources[path].text.replace(/\r\n/g,'\n').split('\n');if(lines[lines.length-1]==='')lines.pop();
    const fragment=document.createDocumentFragment();
    lines.forEach((text,index)=>{const line=document.createElement('div'),number=document.createElement('a'),content=document.createElement('span');line.id='L'+(index+1);line.className='line';number.className='number';number.href='#'+line.id;number.textContent=String(index+1);number.setAttribute('aria-label',String(index+1)+'번째 줄');content.className='text';content.textContent=text||' ';line.append(number,content);fragment.append(line);});code.append(fragment);
  }
  select.addEventListener('change',()=>{if(Object.prototype.hasOwnProperty.call(sources,select.value))location.href='source.html?file='+encodeURIComponent(select.value)+'#L1';});
  function focusLine(){for(const line of code.querySelectorAll('.selected'))line.classList.remove('selected');if(!/^#L[1-9][0-9]*$/.test(location.hash))return;const line=document.getElementById(location.hash.slice(1));if(line){line.classList.add('selected');line.scrollIntoView({block:'center'});}}
  window.addEventListener('hashchange',focusLine);requestAnimationFrame(focusLine);
})();
</script></body></html>
