</main><script type="application/json" id="source-data">{"backend/agent_framework/AF001.sql":{"text":"-- Additive extension in the EXISTING M008 database. Public tables are unchanged.\nCREATE SCHEMA agent_framework;\nREVOKE ALL ON SCHEMA agent_framework FROM PUBLIC;\nCREATE TABLE agent_framework.schema_version (\n  singleton boolean PRIMARY KEY DEFAULT true CHECK (singleton),\n  revision text NOT NULL, ddl_sha256 varchar(64) NOT NULL,\n  structure_json jsonb NOT NULL\n);\nCREATE TABLE agent_framework.runs (\n  run_id varchar(160) PRIMARY KEY,\n  project_id uuid NOT NULL REFERENCES public.projects(project_id),\n  actor_id uuid NOT NULL REFERENCES public.users(user_id),\n  parent_run_id varchar(160),\n  input_json jsonb NOT NULL, input_sha256 varchar(64) NOT NULL,\n  configuration_json jsonb NOT NULL, configuration_sha256 varchar(64) NOT NULL,\n  runtime_sha256 varchar(64) NOT NULL,\n  snapshot_json jsonb NOT NULL,\n  created_at timestamptz NOT NULL DEFAULT clock_timestamp(),\n  updated_at timestamptz NOT NULL DEFAULT clock_timestamp(),\n  UNIQUE(run_id, project_id), UNIQUE(parent_run_id),\n  FOREIGN KEY(parent_run_id, project_id) REFERENCES agent_framework.runs(run_id, project_id)\n);\nCREATE TABLE agent_framework.jobs (\n  job_id uuid PRIMARY KEY, run_id varchar(160) NOT NULL,\n  project_id uuid NOT NULL,\n  phase text NOT NULL CHECK(phase IN ('extract','review')),\n  state text NOT NULL CHECK(state IN ('queued','running','completed','failed','outcome_unknown')),\n  attempt_no integer NOT NULL DEFAULT 0 CHECK(attempt_no BETWEEN 0 AND 3),\n  worker_token uuid, lease_expires_at timestamptz, heartbeat_at timestamptz,\n  created_at timestamptz NOT NULL DEFAULT clock_timestamp(),\n  finished_at timestamptz, error_json jsonb,\n  UNIQUE(run_id,phase),\n  FOREIGN KEY(run_id,project_id) REFERENCES agent_framework.runs(run_id,project_id),\n  CHECK((state='running' AND worker_token IS NOT NULL AND lease_expires_at IS NOT NULL)\n     OR (state\u003c\u003e'running' AND worker_token IS NULL AND lease_expires_at IS NULL))\n);\nCREATE INDEX jobs_ready ON agent_framework.jobs(created_at,job_id) WHERE state='queued';\nCREATE INDEX jobs_expired ON agent_framework.jobs(lease_expires_at) WHERE state='running';\nCREATE TABLE agent_framework.steps (\n  run_id varchar(160) NOT NULL REFERENCES agent_framework.runs(run_id),\n  ordinal integer NOT NULL CHECK(ordinal\u003e0),\n  role text NOT NULL CHECK(role IN ('A02','A04_A05','A06','A07')),\n  state text NOT NULL CHECK(state IN ('running','completed','failed','outcome_unknown','reused')),\n  record_json jsonb NOT NULL, input_sha256 varchar(64) NOT NULL,\n  output_json jsonb, output_sha256 varchar(64),\n  PRIMARY KEY(run_id,ordinal), UNIQUE(run_id,role),\n  CHECK((state='completed' AND output_json IS NOT NULL AND output_sha256 IS NOT NULL)\n     OR (state\u003c\u003e'completed' AND output_json IS NULL AND output_sha256 IS NULL))\n);\nCREATE TABLE agent_framework.approvals (\n  approval_id uuid PRIMARY KEY, run_id varchar(160) NOT NULL,\n  project_id uuid NOT NULL, actor_id uuid NOT NULL REFERENCES public.users(user_id),\n  decision text NOT NULL CHECK(decision IN ('approve_criteria','approve_changes','approve_final','approve_exception')),\n  payload_json jsonb NOT NULL, payload_sha256 varchar(64) NOT NULL,\n  approved_at timestamptz NOT NULL DEFAULT clock_timestamp(),\n  UNIQUE(run_id,decision),\n  FOREIGN KEY(run_id,project_id) REFERENCES agent_framework.runs(run_id,project_id)\n);\nCREATE TABLE agent_framework.events (\n  event_id uuid PRIMARY KEY, run_id varchar(160) NOT NULL REFERENCES agent_framework.runs(run_id),\n  kind text NOT NULL, metadata_json jsonb NOT NULL DEFAULT '{}',\n  recorded_at timestamptz NOT NULL DEFAULT clock_timestamp()\n);\nCREATE FUNCTION agent_framework.sealed_step() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF OLD.state \u003c\u003e 'running' THEN RAISE EXCEPTION 'Completed step records are immutable'; END IF;\n  IF NEW.state = 'running' THEN RAISE EXCEPTION 'A running step can only be closed'; END IF;\n  RETURN NEW;\nEND $$;\nREVOKE ALL ON FUNCTION agent_framework.sealed_step() FROM PUBLIC;\nCREATE TRIGGER sealed_step BEFORE UPDATE ON agent_framework.steps\nFOR EACH ROW EXECUTE FUNCTION agent_framework.sealed_step();\n","sha256":"2ea1dbedbe49a10478210e4ba4decd6134f6dec654938404bcf569797235276b"},"backend/agent_framework/__init__.py":{"text":"\"\"\"Independent-development scaffold; not the production review executor.\"\"\"\n\nCONTRACT_VERSION = \"2.0.0\"\n","sha256":"55c3bb7eea0f3b4202a71cc390650f90f732434bdef60a32d67b6a7a2b84cc53"},"backend/agent_framework/__main__.py":{"text":"\"\"\"Run the developer CLI without importing the product application.\"\"\"\nfrom .cli import main\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n","sha256":"fb2d181351fd041a5dd6a36600de816234886105df0333fd7c06f079e47bc6e5"},"backend/agent_framework/adapters/__init__.py":{"text":"\"\"\"Opt-in synthetic fixtures and explicit, unconfigured production adapter seams.\n\nImporting this package performs no network, database, filesystem or model work.\n\"\"\"\n\n","sha256":"ca0b3ee9e346a27efcf15d9d17e00a6de20f7878d7e00b19fb1ba10648db4d9a"},"backend/agent_framework/adapters/file_backed.py":{"text":"\"\"\"Give model callbacks verified existing files without changing role JSON APIs.\"\"\"\nfrom __future__ import annotations\n\nfrom collections.abc import Callable\n\nfrom ..contracts import CriteriaDraft, ExtractRequest, InspectionResult, InspectRequest\nfrom ..files import VerifiedDocument, VerifiedPoster\nfrom ..ports import FileAccess\n\n\nclass FileBackedExtractor:\n    def __init__(self, files: FileAccess,\n                 extract: Callable[[ExtractRequest, VerifiedDocument], CriteriaDraft]):\n        self.files, self.extract_document = files, extract\n\n    def extract(self, request: ExtractRequest) -\u003e CriteriaDraft:\n        document = self.files.read_document(request.context, request.document)\n        return self.extract_document(request, document)\n\n\nclass FileBackedInspector:\n    def __init__(self, files: FileAccess,\n                 inspect: Callable[[InspectRequest, VerifiedPoster], InspectionResult]):\n        self.files, self.inspect_poster = files, inspect\n\n    def inspect(self, request: InspectRequest) -\u003e InspectionResult:\n        poster = self.files.read_asset(request.context, request.asset)\n        return self.inspect_poster(request, poster)\n","sha256":"ef571ea09e7a2aba71d2920575e160971e1b057071b9800a1e2f59beadc8ef1a"},"backend/agent_framework/adapters/generate_examples.py":{"text":"\"\"\"Rebuild deterministic synthetic role JSON fixtures without external services.\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nfrom pathlib import Path\n\nfrom ..contracts import ExtractRequest, InspectRequest, ReportRequest, ValidateRequest\nfrom .synthetic import SCENARIOS, make_agents, sample_inputs\n\n\ndef role_examples(scenario=\"pass\"):\n    context, document, asset = sample_inputs()\n    agents = make_agents(scenario)\n    extract_input = ExtractRequest(context=context, document=document, synthetic=True)\n    criteria = agents.extractor.extract(extract_input)\n    from ..context import freeze_approved_context\n    evidence = freeze_approved_context(context,criteria.criteria,synthetic=True)\n    if scenario in {\"stale\",\"unavailable\"}:\n        evidence = evidence.model_copy(update={\"status\":scenario, \"postgres_revision\": 2 if scenario==\"stale\" else 0, \"graph_revision\": 1 if scenario==\"stale\" else None, \"evidence\":() if scenario==\"unavailable\" else evidence.evidence})\n    inspect_input = InspectRequest(context=context, criteria=criteria.criteria, asset=asset, evidence=evidence, synthetic=True)\n    observations = agents.inspector.inspect(inspect_input)\n    validate_input = ValidateRequest(context=context, criteria=criteria.criteria, asset=asset, evidence=evidence, inspection=observations, synthetic=True)\n    validated = agents.validator.validate(validate_input)\n    report_input = ReportRequest(context=context, validated=validated, evidence=evidence, synthetic=True)\n    report = agents.reporter.report(report_input)\n    return {\n        \"A02\": (extract_input, criteria),\n        \"A04_A05\": (inspect_input, observations), \"A06\": (validate_input, validated),\n        \"A07\": (report_input, report),\n    }\n\n\ndef generate(destination: Path) -\u003e tuple[Path, ...]:\n    destination.mkdir(parents=True, exist_ok=True)\n    files = []\n    for role, (request, response) in role_examples().items():\n        for suffix, payload in ((\"\", request), (\".output\", response)):\n            file = destination / f\"{role}{suffix}.json\"\n            file.write_text(payload.model_dump_json(indent=2) + \"\\n\", encoding=\"utf-8\")\n            files.append(file)\n    scenarios = destination / \"scenarios\"\n    scenarios.mkdir(exist_ok=True)\n    for scenario in SCENARIOS:\n        validated = role_examples(scenario)[\"A06\"][1]\n        file = scenarios / f\"{scenario}.validated.json\"\n        file.write_text(validated.model_dump_json(indent=2) + \"\\n\", encoding=\"utf-8\")\n        files.append(file)\n    return tuple(files)\n\n\ndef main(argv=None):\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\"--output\", type=Path, default=Path(__file__).resolve().parents[3] / \"examples\" / \"agent_framework\")\n    args = parser.parse_args(argv)\n    paths = generate(args.output)\n    print(f\"Generated {len(paths)} synthetic JSON examples in {args.output}\")\n\n\nif __name__ == \"__main__\":\n    main()\n","sha256":"f4ab0dc3bfa4c3f1f9ea4597b21514d6227660b6e83971e4c7bc2422e2b7d9b3"},"backend/agent_framework/adapters/project_files.py":{"text":"\"\"\"Read adapters for existing product catalogs and storage implementations.\n\nConstructors do not initialize stores or open a database. Authentication belongs\nto the embedding application: bind a trusted identity, never an actor ID copied\nfrom an unauthenticated request. Lookups recheck current account/project access.\nThese adapters do not upload files, migrate schemas or combine the two products.\n\"\"\"\nfrom __future__ import annotations\n\nfrom uuid import UUID\n\nfrom ..contracts import AssetRef, Context, DocumentRef\nfrom ..files import StoredFileMetadata\nfrom ..ports import AdapterFailure\n\n\ndef _fail(code):\n    messages = {\n        \"FILE_ACCESS_DENIED\": \"The bound identity cannot access this file.\",\n        \"FILE_REFERENCE_MISMATCH\": \"The file is not linked to the requested project and version.\",\n        \"FILE_METADATA_INVALID\": \"The registered file metadata is inconsistent.\",\n        \"FILE_SOURCE_UNSUPPORTED\": \"This catalog does not support the requested file source.\",\n        \"FILE_UNAVAILABLE\": \"The registered file is unavailable.\",\n        \"FILE_STORAGE_UNAVAILABLE\": \"The existing file service could not complete the read.\",\n        \"FILE_INTEGRITY_MISMATCH\": \"The stored bytes do not match their registered metadata.\",\n    }\n    raise AdapterFailure(code, messages[code])\n\n\ndef _authorize_error(error):\n    status = getattr(error, \"status_code\", getattr(error, \"status\", None))\n    if status in (401, 403, 404):\n        _fail(\"FILE_ACCESS_DENIED\")\n    if status == 422:\n        _fail(\"FILE_REFERENCE_MISMATCH\")\n    _fail(\"FILE_STORAGE_UNAVAILABLE\")\n\n\ndef _positive_integer(value):\n    if type(value) is not int or value \u003c= 0:\n        _fail(\"FILE_METADATA_INVALID\")\n    return value\n\n\ndef _maximum(value):\n    if type(value) is not int or value \u003c 0:\n        _fail(\"FILE_METADATA_INVALID\")\n    return value\n\n\ndef _creative_key(storage_key, project_id):\n    from backend.creative_checker.storage import validate_key\n\n    try:\n        checked = validate_key(storage_key)\n    except (ValueError, TypeError):\n        _fail(\"FILE_METADATA_INVALID\")\n    if not checked.startswith(str(project_id) + \"/\"):\n        _fail(\"FILE_REFERENCE_MISMATCH\")\n    return checked\n\n\nclass CreativeCheckerCatalog:\n    \"\"\"Reuse the separate cc_* product's version rows and access services.\n\n    session_factory must provide a fresh owned SQLAlchemy session. The caller\n    binds an already authenticated user ID; this is not a login/session service.\n    Reads use no_autoflush and never commit. Existing archived-project read rules\n    are retained, and old versions remain addressable when explicitly requested.\n    \"\"\"\n\n    def __init__(self, session_factory, actor_id: str):\n        self.session_factory = session_factory\n        self.actor_id = actor_id\n\n    def _lookup(self, context, reference, kind):\n        from fastapi import HTTPException\n        from backend.creative_checker import services\n        from backend.creative_checker.models import Asset, AssetVersion, Document, FileRecord, User\n\n        if context.actor_id != self.actor_id:\n            _fail(\"FILE_ACCESS_DENIED\")\n        version_id = reference.document_version_id if kind == \"pdf\" else reference.asset_version_id\n        expected = context.document_version_id if kind == \"pdf\" else context.asset_version_id\n        if expected != version_id:\n            _fail(\"FILE_REFERENCE_MISMATCH\")\n        try:\n            with self.session_factory() as db:\n                with db.no_autoflush:\n                    user = db.get(User, self.actor_id, populate_existing=True)\n                    if user is None or not user.active:\n                        _fail(\"FILE_ACCESS_DENIED\")\n                    model = Document if kind == \"pdf\" else AssetVersion\n                    version, project, _role = services.object_access(db, model, version_id, user)\n                    if (version.id != version_id or project.id != context.project_id\n                            or version.project_id != project.id or version.file_id != reference.file_id):\n                        _fail(\"FILE_REFERENCE_MISMATCH\")\n                    file, file_project, _role = services.object_access(db, FileRecord, version.file_id, user)\n                    if file.id != reference.file_id or file.project_id != project.id or file_project.id != project.id:\n                        _fail(\"FILE_REFERENCE_MISMATCH\")\n                    width = height = None\n                    if kind == \"pdf\":\n                        if file.media_type != \"application/pdf\":\n                            _fail(\"FILE_SOURCE_UNSUPPORTED\")\n                    else:\n                        asset, asset_project, _role = services.object_access(db, Asset, version.asset_id, user)\n                        if asset.project_id != project.id or asset_project.id != project.id:\n                            _fail(\"FILE_REFERENCE_MISMATCH\")\n                        if asset.kind != \"poster\" or file.media_type not in {\"image/png\", \"image/jpeg\", \"image/webp\"}:\n                            _fail(\"FILE_SOURCE_UNSUPPORTED\")\n                        measurements = version.media_metadata\n                        if not isinstance(measurements, dict) or measurements.get(\"actual_mime\") != file.media_type:\n                            _fail(\"FILE_METADATA_INVALID\")\n                        # Existing inspect_media records EXIF-oriented dimensions.\n                        width = _positive_integer(measurements.get(\"width\"))\n                        height = _positive_integer(measurements.get(\"height\"))\n                    return StoredFileMetadata(\n                        file_id=file.id, project_id=file.project_id, version_id=version.id,\n                        kind=kind, storage_key=_creative_key(file.storage_key, project.id),\n                        media_type=file.media_type, byte_size=_positive_integer(file.size),\n                        sha256=file.sha256, width=width, height=height, coordinate_space=\"display\",\n                    )\n        except AdapterFailure:\n            raise\n        except HTTPException as error:\n            _authorize_error(error)\n        except (ValueError, TypeError, KeyError):\n            _fail(\"FILE_METADATA_INVALID\")\n        except Exception:\n            _fail(\"FILE_STORAGE_UNAVAILABLE\")\n\n    def lookup_document(self, context: Context, reference: DocumentRef) -\u003e StoredFileMetadata:\n        # cc_documents.id identifies a particular immutable document version;\n        # its integer version column is not the framework's version identifier.\n        return self._lookup(context, reference, \"pdf\")\n\n    def lookup_asset(self, context: Context, reference: AssetRef) -\u003e StoredFileMetadata:\n        return self._lookup(context, reference, \"poster\")\n\n\nclass CreativeCheckerStorageReader:\n    \"\"\"Read through an already created LocalStorage/S3Storage instance.\"\"\"\n\n    def __init__(self, storage):\n        self.storage = storage\n\n    def read(self, metadata: StoredFileMetadata, maximum: int) -\u003e bytes:\n        try:\n            maximum = _maximum(maximum)\n            key = _creative_key(metadata.storage_key, metadata.project_id)\n            # Existing read uses an inclusive end offset, so this asks for at\n            # most maximum + 1 bytes without normalizing or replacing originals.\n            raw = self.storage.read(key, 0, maximum)\n            if not isinstance(raw, bytes) or len(raw) \u003e maximum + 1:\n                _fail(\"FILE_STORAGE_UNAVAILABLE\")\n            return raw\n        except AdapterFailure:\n            raise\n        except FileNotFoundError:\n            _fail(\"FILE_UNAVAILABLE\")\n        except Exception:\n            _fail(\"FILE_STORAGE_UNAVAILABLE\")\n\n\nclass LegacyPosterCatalog:\n    \"\"\"Reuse M008 image metadata without adding a PDF schema or new storage.\n\n    authorization and subject are the existing authenticated application objects.\n    File IDs select original versus display bytes explicitly; their hashes and\n    dimensions are never mixed. Original dimensions describe encoded pixels.\n    \"\"\"\n\n    def __init__(self, engine, authorization, subject, developer_allowed=False):\n        self.engine = engine\n        self.authorization = authorization\n        self.subject = subject\n        self.developer_allowed = developer_allowed\n\n    def lookup_document(self, context: Context, reference: DocumentRef) -\u003e StoredFileMetadata:\n        _fail(\"FILE_SOURCE_UNSUPPORTED\")\n\n    def lookup_asset(self, context: Context, reference: AssetRef) -\u003e StoredFileMetadata:\n        from backend.app.security.errors import AuthError\n        from backend.app.storage.local import key\n\n        if context.actor_id != str(getattr(self.subject, \"user_id\", \"\")):\n            _fail(\"FILE_ACCESS_DENIED\")\n        if context.asset_version_id != reference.asset_version_id:\n            _fail(\"FILE_REFERENCE_MISMATCH\")\n        try:\n            pid, aid, fid = UUID(context.project_id), UUID(reference.asset_version_id), UUID(reference.file_id)\n            with self.engine.connect() as connection:\n                options = {\"expected_project\": pid, \"developer_allowed\": self.developer_allowed}\n                image = self.authorization.resource(connection, self.subject, \"asset_versions\", aid, **options)\n                if str(image[\"project_id\"]) != context.project_id or str(image[\"asset_version_id\"]) != reference.asset_version_id:\n                    _fail(\"FILE_REFERENCE_MISMATCH\")\n                if fid == image[\"original_file_id\"]:\n                    representation = \"original\"\n                elif fid == image[\"display_file_id\"]:\n                    representation = \"display\"\n                else:\n                    _fail(\"FILE_REFERENCE_MISMATCH\")\n                file = self.authorization.resource(connection, self.subject, \"stored_files\", fid, **options)\n                if str(file[\"project_id\"]) != context.project_id or str(file[\"file_id\"]) != reference.file_id:\n                    _fail(\"FILE_REFERENCE_MISMATCH\")\n                if file[\"state\"] != \"stored\":\n                    _fail(\"FILE_UNAVAILABLE\")\n                if (file[\"storage_backend\"] != \"local\" or file[\"storage_key\"] != key(pid, fid)\n                        or file[\"file_role\"] != representation + \"_image\"):\n                    _fail(\"FILE_METADATA_INVALID\")\n                if representation == \"original\":\n                    if file[\"sha256\"] != image[\"original_sha256\"] or file[\"parent_file_id\"] is not None:\n                        _fail(\"FILE_METADATA_INVALID\")\n                    if file[\"detected_mime\"] not in {\"image/png\", \"image/jpeg\", \"image/webp\"}:\n                        _fail(\"FILE_SOURCE_UNSUPPORTED\")\n                elif file[\"detected_mime\"] != \"image/png\" or file[\"parent_file_id\"] != image[\"original_file_id\"]:\n                    _fail(\"FILE_METADATA_INVALID\")\n                return StoredFileMetadata(\n                    file_id=reference.file_id, project_id=context.project_id, version_id=reference.asset_version_id,\n                    kind=\"poster\", storage_key=file[\"storage_key\"], media_type=file[\"detected_mime\"],\n                    byte_size=_positive_integer(file[\"byte_size\"]), sha256=file[\"sha256\"],\n                    width=_positive_integer(image[representation + \"_width\"]),\n                    height=_positive_integer(image[representation + \"_height\"]),\n                    coordinate_space=\"encoded\" if representation == \"original\" else \"display\",\n                )\n        except AdapterFailure:\n            raise\n        except AuthError as error:\n            _authorize_error(error)\n        except (ValueError, TypeError, KeyError):\n            _fail(\"FILE_METADATA_INVALID\")\n        except Exception:\n            _fail(\"FILE_STORAGE_UNAVAILABLE\")\n\n\nclass LegacyStorageReader:\n    \"\"\"Use the existing M008 verified stream; storage lifetime stays with the app.\"\"\"\n\n    def __init__(self, storage):\n        self.storage = storage\n\n    def read(self, metadata: StoredFileMetadata, maximum: int) -\u003e bytes:\n        from backend.app.storage.local import StorageError, key\n\n        try:\n            maximum = _maximum(maximum)\n            if metadata.storage_key != key(metadata.project_id, metadata.file_id):\n                _fail(\"FILE_REFERENCE_MISMATCH\")\n            with self.storage.verified(metadata.storage_key, metadata.byte_size, metadata.sha256) as stream:\n                raw = stream.read(maximum + 1)\n            if not isinstance(raw, bytes) or len(raw) \u003e maximum + 1:\n                _fail(\"FILE_STORAGE_UNAVAILABLE\")\n            return raw\n        except AdapterFailure:\n            raise\n        except FileNotFoundError:\n            _fail(\"FILE_UNAVAILABLE\")\n        except StorageError as error:\n            _fail(\"FILE_INTEGRITY_MISMATCH\" if error.code == \"STORAGE_CORRUPT\" else \"FILE_STORAGE_UNAVAILABLE\")\n        except Exception:\n            _fail(\"FILE_STORAGE_UNAVAILABLE\")\n","sha256":"cf2329e6eaac5998a6cc6f9ec1e650f8c5f627966f158ac5f985af3323ff0578"},"backend/agent_framework/adapters/synthetic.py":{"text":"\"\"\"Deterministic protocol fixtures. These never inspect a real PDF or poster.\n\nThe fixture file IDs and hashes describe synthetic marker strings, not files.\nOnly an explicit choice of this adapter enables synthetic behavior; production\nadapter failures must never fall back to this module.\n\"\"\"\nfrom __future__ import annotations\n\nimport hashlib\nfrom typing import Literal\n\nfrom ..contracts import (\n    AssetRef, Context, CriteriaDraft, Criterion, DocumentRef, Evidence,\n    EvidenceBundle, ExtractRequest, ImageEvidence, InspectRequest,\n    InspectionResult, Observation, ReportDraft, ReportRequest,\n    SourceRef,\n)\nfrom ..ports import AdapterFailure, Agents\n\nScenario = Literal[\"pass\", \"fail\", \"review\", \"stale\", \"unavailable\"]\nSCENARIOS = (\"pass\", \"fail\", \"review\", \"stale\", \"unavailable\")\nSYNTHETIC_NOTICE = \"합성 계약 예제입니다. 실제 PDF·포스터·모델·DB를 읽거나 실행하지 않았습니다.\"\nDOCUMENT_MARKER = \"SYNTHETIC DOCUMENT REFERENCE; no PDF bytes exist; document-v1\"\n\n\ndef _hash(text: str) -\u003e str:\n    return hashlib.sha256(text.encode(\"utf-8\")).hexdigest()\n\n\ndef sample_inputs(\n    run_id: str = \"demo-run-1\",\n    asset_version_id: str = \"poster-v1\",\n    parent_run_id: str | None = None,\n) -\u003e tuple[Context, DocumentRef, AssetRef]:\n    \"\"\"Return clearly synthetic references, without opening or creating files.\"\"\"\n    context = Context(\n        project_id=\"synthetic-project\", run_id=run_id, actor_id=\"synthetic-reviewer\",\n        document_version_id=\"document-v1\", criteria_version_id=\"criteria-v1\",\n        asset_version_id=asset_version_id, parent_run_id=parent_run_id,\n    )\n    document = DocumentRef(\n        file_id=\"synthetic-pdf-reference\", document_version_id=context.document_version_id,\n        sha256=_hash(DOCUMENT_MARKER), page_count=1,\n    )\n    asset = AssetRef(\n        file_id=f\"synthetic-{asset_version_id}\", asset_version_id=asset_version_id,\n        sha256=_hash(f\"SYNTHETIC POSTER REFERENCE; no image bytes exist; {asset_version_id}\"),\n        width=1200, height=1600,\n    )\n    return context, document, asset\n\n\ndef _same_context(left: Context, right: Context) -\u003e None:\n    if left != right:\n        raise AdapterFailure(\"CONTEXT_MISMATCH\", \"합성 예제의 실행 컨텍스트가 일치하지 않습니다.\")\n\n\nclass SyntheticAdapters:\n    \"\"\"One stateless fixture implements A02, A04/A05 and A07 ports.\"\"\"\n\n    def __init__(self, scenario: Scenario = \"pass\"):\n        if scenario not in SCENARIOS:\n            raise ValueError(f\"scenario must be one of {', '.join(SCENARIOS)}\")\n        self.scenario = scenario\n\n    def extract(self, request: ExtractRequest) -\u003e CriteriaDraft:\n        if request.context.document_version_id != request.document.document_version_id:\n            raise AdapterFailure(\"CONTEXT_MISMATCH\", \"문서 버전이 추출 실행 컨텍스트와 다릅니다.\")\n        text_quote = \"포스터에는 MORNING CUP 문구를 정확히 표시해야 합니다.\"\n        number_quote = \"포스터에는 딸기 3개가 표시되어야 합니다.\"\n\n        def source(block_id: str, quote: str) -\u003e SourceRef:\n            return SourceRef(\n                document_version_id=request.document.document_version_id,\n                page=1, block_id=block_id, quote=quote, source_hash=_hash(quote),\n            )\n\n        return CriteriaDraft(\n            context=request.context,\n            criteria=(\n                Criterion(\n                    criterion_id=\"requirement-text\", text=text_quote, kind=\"text\",\n                    expected=\"MORNING CUP\", operator=\"equals\",\n                    source=source(\"synthetic-page-1-block-1\", text_quote),\n                ),\n                Criterion(\n                    criterion_id=\"requirement-number\", text=number_quote, kind=\"number\",\n                    expected=\"3\", operator=\"equals\", unit=\"개\",\n                    source=source(\"synthetic-page-1-block-2\", number_quote),\n                ),\n            ),\n            warnings=(SYNTHETIC_NOTICE, \"파일 해시는 실제 파일이 아닌 합성 참조 문자열의 SHA-256입니다.\"),\n            synthetic=True,\n        )\n\n    def inspect(self, request: InspectRequest) -\u003e InspectionResult:\n        _same_context(request.context, request.evidence.context)\n        if request.context.asset_version_id != request.asset.asset_version_id:\n            raise AdapterFailure(\"CONTEXT_MISMATCH\", \"포스터 버전이 검사 실행 컨텍스트와 다릅니다.\")\n        observations = []\n        for index, criterion in enumerate(request.criteria):\n            citations = tuple(\n                evidence.evidence_id for evidence in request.evidence.evidence\n                if evidence.kind == \"current_requirement\" and criterion.criterion_id in evidence.criterion_ids\n            )\n            observed, verdict, uncertainty = criterion.expected, \"pass\", None\n            if criterion.kind == \"unsupported\" or criterion.operator == \"manual\":\n                observed, verdict, uncertainty = \"\", \"review\", \"합성 예제: 수동 확인 조건입니다.\"\n            elif self.scenario == \"review\":\n                observed, verdict, uncertainty = \"\", \"review\", \"합성 예제: 현재 포스터의 관측이 불명확합니다.\"\n            elif self.scenario == \"fail\" and criterion.kind == \"number\":\n                observed, verdict = \"2\", \"fail\"\n            observations.append(Observation(\n                criterion_id=criterion.criterion_id, observed=observed, verdict=verdict,\n                image=ImageEvidence(\n                    asset_version_id=request.asset.asset_version_id, asset_hash=request.asset.sha256,\n                    bbox=(0.08, 0.08, 0.88, 0.24) if index % 2 == 0 else (0.12, 0.35, 0.78, 0.82),\n                ),\n                evidence_ids=citations, uncertainty=uncertainty,\n            ))\n        return InspectionResult(context=request.context, observations=tuple(observations), synthetic=True)\n\n    def report(self, request: ReportRequest) -\u003e ReportDraft:\n        _same_context(request.context, request.validated.context)\n        _same_context(request.context, request.evidence.context)\n        verdict = request.validated.verdict\n        validated_ids = {item.criterion_id for item in request.validated.items}\n        citations = tuple(\n            evidence.evidence_id for evidence in request.evidence.evidence\n            if evidence.kind == \"current_requirement\" and validated_ids.intersection(evidence.criterion_ids)\n        )\n        lines = [SYNTHETIC_NOTICE, f\"기계 판정: {verdict}\"]\n        changes = []\n        for item in request.validated.items:\n            issues = \", \".join(item.issues)\n            lines.append(f\"{item.criterion_id}: {item.verdict}\" + (f\" ({issues})\" if issues else \"\"))\n            if item.verdict != \"pass\":\n                action = \"수정 확인\" if item.verdict == \"fail\" else \"근거와 관측 확인\"\n                changes.append(f\"{item.criterion_id}: {action}이 필요합니다.\")\n        return ReportDraft(\n            context=request.context, verdict=verdict, summary=\"\\n\".join(lines),\n            evidence_ids=citations, change_requests=tuple(changes), synthetic=True,\n        )\n\n\ndef make_agents(scenario: Scenario = \"pass\") -\u003e Agents:\n    \"\"\"Explicit synthetic composition; validation is the shared reference code.\"\"\"\n    from ..validation import ReferenceValidator\n\n    adapters = SyntheticAdapters(scenario)\n    return Agents(\n        extractor=adapters, inspector=adapters,\n        validator=ReferenceValidator(), reporter=adapters,\n    )\n\n","sha256":"06d64bb2419e55cc7451d0100bbc0a95075954c5ab0acc24612714d04e906c06"},"backend/agent_framework/adapters/templates.py":{"text":"\"\"\"Unconfigured adapter seams. These intentionally never return synthetic results.\"\"\"\nfrom __future__ import annotations\n\nfrom ..contracts import (\n    CriteriaDraft, EvidenceBundle, ExtractRequest, InspectRequest,\n    InspectionResult, ReportDraft, ReportRequest,\n)\nfrom ..ports import AdapterFailure\n\n\nclass QwenAdapterStub:\n    \"\"\"Implement Qwen3.5-4B calls outside the framework; no client is created here.\n\n    A02 must preserve PDF source provenance. A04/A05 must use the current poster\n    and approved criteria. A07 must preserve the validated verdict and citations.\n    Return synthetic=False only after a real configured execution.\n    \"\"\"\n\n    def extract(self, request: ExtractRequest) -\u003e CriteriaDraft:\n        raise AdapterFailure(\"ADAPTER_NOT_CONFIGURED\", \"A02 Qwen PDF 추출 어댑터를 구현하고 연결해야 합니다.\")\n\n    def inspect(self, request: InspectRequest) -\u003e InspectionResult:\n        raise AdapterFailure(\"ADAPTER_NOT_CONFIGURED\", \"A04/A05 Qwen 포스터 검사 어댑터를 구현하고 연결해야 합니다.\")\n\n    def report(self, request: ReportRequest) -\u003e ReportDraft:\n        raise AdapterFailure(\"ADAPTER_NOT_CONFIGURED\", \"A07 Qwen 보고서 어댑터를 구현하고 연결해야 합니다.\")\n\n","sha256":"00e6c2904d25ac09d372c0f5d1890246bbfb99d74ec3592188c3e8980d7b7591"},"backend/agent_framework/api.py":{"text":"\"\"\"Loopback-only development API contract. Never mounted into the product API.\n\nThis service has no authentication or durable storage. IDs supplied in requests\nare test context, not proof of identity. Bind to 127.0.0.1, never a shared host.\n\"\"\"\nfrom fastapi import FastAPI, HTTPException\n\nfrom .composition import TeamConfiguration, build_agents, describe_agents, describe_configuration\nfrom .contracts import Approval, AssetRef, Context, Contract, DocumentRef, RunSnapshot, StepTimeline\nfrom .ports import Agents\nfrom .runtime import Workflow\n\n\nclass StartRequest(Contract):\n    context: Context\n    document: DocumentRef\n    asset: AssetRef\n\n\nclass RevisionRequest(Contract):\n    context: Context\n    asset: AssetRef\n\n\ndef create_app(agents: Agents | None = None, *, profile: str | None = None,\n               configuration: TeamConfiguration | None = None) -\u003e FastAPI:\n    if configuration is not None:\n        if agents is not None:\n            raise ValueError(\"Choose explicit agents or a team configuration, not both\")\n        configuration = TeamConfiguration.model_validate(configuration.model_dump(warnings=False))\n        if profile is not None and profile != configuration.profile:\n            raise ValueError(\"profile differs from the team configuration\")\n        profile = configuration.profile\n        agents = build_agents(configuration)\n    profile = \"development\" if profile is None else profile\n    if agents is None:\n        from .adapters.synthetic import make_agents\n        agents = make_agents()\n    workflow = Workflow(agents, profile=profile)\n    app = FastAPI(title=\"Creative Checker — Development Framework\",\n                  version=\"2.0.0\",\n                  description=\"Development only. In-memory state, synthetic default adapters, no authentication. \"\n                              \"Not the front-v2/M008 production API. Bind to loopback only.\")\n    app.state.workflow = workflow\n\n    def adapter_status():\n        roles = describe_agents(agents)\n        kinds = {details[\"kind\"] for details in roles.values()} - {\"reference\"}\n        aggregate = next(iter(kinds)) if len(kinds) == 1 else \"mixed\"\n        return {\"default_adapters\": aggregate, \"roles\": roles, \"connection_verified\": False}\n\n    @app.middleware(\"http\")\n    async def development_boundary(request, call_next):\n        # Host headers are not authentication; reject obvious accidental exposure.\n        from starlette.responses import JSONResponse\n        host = request.url.hostname\n        if host not in {\"127.0.0.1\", \"localhost\", \"::1\", \"testserver\"}:\n            return JSONResponse(status_code=403, content={\"code\": \"DEVELOPMENT_LOOPBACK_ONLY\"})\n        response = await call_next(request)\n        response.headers[\"X-Creative-Checker-Profile\"] = profile\n        response.headers[\"Cache-Control\"] = \"no-store\"\n        return response\n\n    def invoke(action, *args):\n        try:\n            return action(*args)\n        except KeyError as exc:\n            raise HTTPException(404, detail={\"code\": \"RUN_NOT_FOUND\"}) from exc\n        except ValueError as exc:\n            raise HTTPException(409, detail={\"code\": \"WORKFLOW_CONFLICT\", \"message\": str(exc)}) from exc\n\n    prefix = \"/api/framework/v1\"\n\n    @app.get(prefix + \"/health\")\n    def health():\n        return {\"contract_version\": \"2.0.0\", \"profile\": profile, \"storage\": \"memory\",\n                \"authenticated\": False, \"production_ready\": False,\n                **adapter_status()}\n\n    @app.get(prefix + \"/configuration\")\n    def configuration_status():\n        return {\"profile\": profile, \"storage\": \"memory\", \"production_ready\": False,\n                \"declared\": describe_configuration(configuration) if configuration is not None else None,\n                \"initialized\": adapter_status(),\n                \"notice\": \"Configuration declarations and adapter type classification only; no model/database connectivity verification.\"}\n\n    @app.post(prefix + \"/runs\", response_model=RunSnapshot, status_code=201)\n    def start(request: StartRequest):\n        return invoke(workflow.start, request.context, request.document, request.asset)\n\n    @app.get(prefix + \"/runs/{run_id}\", response_model=RunSnapshot)\n    def read(run_id: str):\n        return invoke(workflow.get, run_id)\n\n    @app.get(prefix + \"/runs/{run_id}/steps\", response_model=StepTimeline)\n    def steps(run_id: str):\n        return invoke(workflow.get_steps, run_id)\n\n    @app.post(prefix + \"/runs/{run_id}/approvals\", response_model=RunSnapshot)\n    def approve(run_id: str, request: Approval):\n        return invoke(workflow.approve, run_id, request)\n\n    @app.post(prefix + \"/runs/{run_id}/revisions\", response_model=RunSnapshot, status_code=201)\n    def revise(run_id: str, request: RevisionRequest):\n        return invoke(workflow.rereview, run_id, request.context, request.asset)\n\n    return app\n","sha256":"bba1865a11834521d04c020fdbf2198125d387167ec9118e0acf934959dd368a"},"backend/agent_framework/checks.py":{"text":"\"\"\"Explicit, sequential fixture checks for a single developer-owned adapter.\n\nSuites are local test inputs, not business requests or connectivity proofs.\nAll fixture files are parsed before importing a factory. Each case is called at\nmost once; an unknown outcome stops the suite without retrying the adapter.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom hashlib import sha256\nimport json\nfrom pathlib import Path, PurePosixPath, PureWindowsPath\nimport re\nfrom typing import Annotated\n\nfrom pydantic import BaseModel, Field, field_validator, model_validator\n\nfrom .composition import RoleId, TeamConfiguration, build_role\nfrom .contracts import Contract, Identifier, Verdict\nfrom .invocation import ROLE_CONTRACTS, InvocationFailure, invoke_role\nfrom .ports import AdapterFailure\n\n\nErrorCode = Annotated[str, Field(pattern=r\"^[A-Za-z][A-Za-z0-9_]{1,80}$\")]\n\n\nclass RoleCheckCase(Contract):\n    id: Identifier\n    input: str = Field(min_length=1)\n    expected_error: ErrorCode | None = None\n    expected_verdict: Verdict | None = None\n\n    @field_validator(\"input\")\n    @classmethod\n    def portable_relative_path(cls, value):\n        if (\"\\\\\" in value or PurePosixPath(value).is_absolute()\n                or PureWindowsPath(value).drive or PureWindowsPath(value).root):\n            raise ValueError(\"fixture paths must be relative and use forward slashes\")\n        return value\n\n    @model_validator(mode=\"after\")\n    def one_expectation(self):\n        if self.expected_error is not None and self.expected_verdict is not None:\n            raise ValueError(\"choose an error or verdict expectation\")\n        return self\n\n\nclass RoleCheckSuite(Contract):\n    role: RoleId\n    cases: tuple[RoleCheckCase, ...] = Field(min_length=1, max_length=100)\n\n    @model_validator(mode=\"after\")\n    def consistent_cases(self):\n        if len({case.id for case in self.cases}) != len(self.cases):\n            raise ValueError(\"case IDs must be unique\")\n        if self.role not in {\"A06\", \"A07\"} and any(case.expected_verdict for case in self.cases):\n            raise ValueError(\"aggregate verdict expectations are available only for A06 and A07\")\n        return self\n\n\nclass CheckSuiteError(ValueError):\n    \"\"\"Invalid suite declarations, never an adapter execution failure.\"\"\"\n\n\n@dataclass(frozen=True)\nclass PreparedCase:\n    spec: RoleCheckCase\n    request: BaseModel\n    path: Path\n    request_sha256: str\n\n\n@dataclass(frozen=True)\nclass PreparedSuite:\n    suite: RoleCheckSuite\n    cases: tuple[PreparedCase, ...]\n    path: Path\n\n\ndef _unique_object(pairs):\n    result = {}\n    for key, value in pairs:\n        if key in result:\n            raise ValueError(\"duplicate JSON key\")\n        result[key] = value\n    return result\n\n\ndef _invalid_constant(_value):\n    raise ValueError(\"nonstandard JSON constant\")\n\n\ndef _read_json(path):\n    raw = path.read_bytes()\n    value = json.loads(raw.decode(\"utf-8-sig\"), object_pairs_hook=_unique_object,\n                       parse_constant=_invalid_constant)\n    return value, sha256(raw).hexdigest()\n\n\ndef load_suite(path: str | Path, role: str) -\u003e PreparedSuite:\n    \"\"\"Preflight every request schema before any configured code is loaded.\n\nExpected errors describe invocation/boundary errors, not malformed JSON or\nmissing files. Relative fixture paths resolve from the suite's own directory.\n\"\"\"\n    path = Path(path).resolve()\n    try:\n        value, _digest = _read_json(path)\n        suite = RoleCheckSuite.model_validate(value)\n        if suite.role != role:\n            raise ValueError(\"suite and selected role differ\")\n    except UnicodeError:\n        raise\n    except (ValueError, TypeError):\n        raise CheckSuiteError(\"Invalid role check suite\") from None\n    request_type = ROLE_CONTRACTS[role][2]\n    prepared = []\n    for case in suite.cases:\n        fixture = (path.parent / case.input).resolve()\n        try:\n            value, digest = _read_json(fixture)\n            request = request_type.model_validate(value)\n        except UnicodeError:\n            raise\n        except (ValueError, TypeError):\n            raise InvocationFailure(\"CONTRACT_INVALID\", \"A suite fixture does not match the role request contract.\") from None\n        prepared.append(PreparedCase(case, request, fixture, digest))\n    return PreparedSuite(suite, tuple(prepared), path)\n\n\ndef run_checks(prepared: PreparedSuite, configuration: TeamConfiguration) -\u003e dict:\n    \"\"\"Initialize one role once, then check each fixture through invoke_role.\n\nOnly summaries/hashes are returned, never raw prompts, evidence or provider\nexception messages. Contract acceptance does not establish semantic accuracy.\n\"\"\"\n    role = prepared.suite.role\n    adapter = build_role(configuration, role)\n    binding = configuration.roles[role]\n    results = []\n    stopped = False\n    outputs_checked = 0\n    for case in prepared.cases:\n        item = {\"id\": case.spec.id, \"request_sha256\": case.request_sha256}\n        if stopped:\n            results.append({**item, \"status\": \"skipped\", \"reason\": \"PRIOR_OUTCOME_UNKNOWN\"})\n            continue\n        try:\n            output = invoke_role(role, adapter, case.request,\n                                 require_synthetic=binding.kind == \"synthetic\")\n        except Exception as exc:\n            structured = isinstance(exc, AdapterFailure)\n            code = exc.code if structured and isinstance(exc.code, str) else \"ADAPTER_FAILED\"\n            if not re.fullmatch(r\"[A-Za-z][A-Za-z0-9_]{1,80}\", code):\n                code = \"ADAPTER_FAILED\"\n                structured = False\n            unknown = bool(exc.outcome_unknown) if isinstance(exc, AdapterFailure) else False\n            matched = structured and not unknown and case.spec.expected_error == code\n            item.update(status=\"passed\" if matched else \"failed\",\n                        outcome=\"expected_rejection\" if matched else \"error\",\n                        error={\"code\": code,\n                               \"retryable\": bool(exc.retryable) if isinstance(exc, AdapterFailure) else False,\n                               \"outcome_unknown\": unknown})\n            stopped = unknown\n        else:\n            outputs_checked += 1\n            verdict = getattr(output, \"verdict\", None)\n            matched = (case.spec.expected_error is None\n                       and (case.spec.expected_verdict is None or case.spec.expected_verdict == verdict))\n            serialized = json.dumps(output.model_dump(mode=\"json\"), sort_keys=True,\n                                    ensure_ascii=False, allow_nan=False).encode(\"utf-8\")\n            item.update(status=\"passed\" if matched else \"failed\", outcome=\"accepted_output\",\n                        synthetic=output.synthetic, output_sha256=sha256(serialized).hexdigest())\n            if verdict is not None:\n                item[\"machine_verdict\"] = verdict\n            if not matched:\n                item[\"reason\"] = \"EXPECTED_ERROR_NOT_RAISED\" if case.spec.expected_error else \"VERDICT_MISMATCH\"\n        results.append(item)\n    counts = {status: sum(item[\"status\"] == status for item in results)\n              for status in (\"passed\", \"failed\", \"skipped\")}\n    return {\"contract_version\": \"2.0.0\", \"check\": \"role_contract_suite\", \"role\": role,\n            \"profile\": configuration.profile, \"adapter_kind\": binding.kind,\n            \"passed\": counts[\"passed\"] == len(results), \"stopped_on_outcome_unknown\": stopped,\n            \"summary\": {\"total\": len(results), **counts, \"contract_outputs_checked\": outputs_checked},\n            \"cases\": results, \"connection_verified\": False, \"production_ready\": False,\n            \"notice\": \"Fixture contract checks only; not model accuracy, source authenticity, database connectivity or authenticated approval verification.\"}\n","sha256":"80aa735d8e209b6641565a6c51fdb0047b949648f131d8c9bd5090d30aeff7ed"},"backend/agent_framework/cli.py":{"text":"\"\"\"Explicit development commands; never starts product services or migrations.\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport importlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport sys\nimport tempfile\n\nfrom pydantic import ValidationError\nfrom backend.app.config import ConfigurationError\nfrom backend.app.persistence.database import PersistenceError\n\nfrom .contracts import (\n    CONTRACT_TYPES, Approval, FrameworkError,\n)\nfrom .ports import AdapterFailure, Agents\nfrom .invocation import ROLE_CONTRACTS, InvocationFailure, invoke_role\nfrom .checks import CheckSuiteError\nfrom .flow_checks import FlowCaseError\n\n\nclass _ConfigError(ValueError):\n    pass\n\n\ndef _load_configuration(path):\n    from .composition import load_config\n    try:\n        return load_config(path)\n    except (ValueError, TypeError) as exc:\n        raise _ConfigError(\"Invalid team configuration\") from exc\n\n\ndef _emit(payload, output=None):\n    # stdout is a JSON transport and may be a legacy-codepage Windows pipe.\n    # Unicode escapes preserve all values; explicit files remain readable UTF-8.\n    rendered = json.dumps(payload, ensure_ascii=not bool(output), indent=2, allow_nan=False) + \"\\n\"\n    if output:\n        # An explicit output path authorizes this file only. Missing parent\n        # directories are reported instead of silently creating another tree.\n        path = Path(output)\n        temporary = None\n        try:\n            with tempfile.NamedTemporaryFile(mode=\"w\", encoding=\"utf-8\", dir=path.parent,\n                    prefix=\".framework-\", suffix=\".tmp\", delete=False) as stream:\n                temporary = Path(stream.name)\n                stream.write(rendered)\n            os.replace(temporary, path)\n        finally:\n            if temporary is not None:\n                temporary.unlink(missing_ok=True)\n    else:\n        sys.stdout.write(rendered)\n\n\ndef _error(code, message, *, retryable=False, outcome_unknown=False):\n    error = FrameworkError(code=code, message=message, retryable=retryable, outcome_unknown=outcome_unknown)\n    _emit({\"error\": error.model_dump(mode=\"json\")})\n\n\ndef _factory(reference):\n    if not re.fullmatch(r\"[A-Za-z_]\\w*(?:\\.[A-Za-z_]\\w*)*:[A-Za-z_]\\w*\", reference):\n        raise AdapterFailure(\"INVALID_FACTORY\", \"Use an importable module:callable factory.\")\n    module_name, callable_name = reference.split(\":\", 1)\n    # Loading code is permitted only by this explicit CLI option. No factory\n    # name is accepted from the untrusted role request JSON.\n    factory = getattr(importlib.import_module(module_name), callable_name, None)\n    if not callable(factory):\n        raise AdapterFailure(\"INVALID_FACTORY\", \"The named factory is not callable.\")\n    agents = factory()\n    if not isinstance(agents, Agents):\n        raise AdapterFailure(\"INVALID_FACTORY\", \"The factory must return an Agents instance.\")\n    return agents\n\n\ndef _role(args):\n    if not args.synthetic and not args.factory and not args.config:\n        _error(\"ADAPTER_NOT_CONFIGURED\", \"Choose --synthetic, --config, or an explicit --factory module:callable.\")\n        return 2\n    if args.scenario and not args.synthetic:\n        _error(\"INVALID_ARGUMENT\", \"--scenario is only available with --synthetic.\")\n        return 2\n    port_name, _method_name, request_type, _result_type = ROLE_CONTRACTS[args.role]\n    request = request_type.model_validate_json(Path(args.input).read_text(encoding=\"utf-8\"))\n    require_synthetic = args.synthetic\n    if args.synthetic:\n        from .adapters.synthetic import make_agents\n\n        agents = make_agents(scenario=args.scenario or \"pass\")\n        adapter = getattr(agents, port_name)\n        print(\"SYNTHETIC DEVELOPMENT FIXTURE: no real model, PostgreSQL, Neo4j, or MCP call.\", file=sys.stderr)\n    elif args.config:\n        from .composition import build_role\n        configuration = _load_configuration(args.config)\n        adapter = build_role(configuration, args.role)\n        require_synthetic = configuration.roles[args.role].kind == \"synthetic\"\n        print(\"EXPLICIT ROLE CONFIGURATION: initializing the selected role only.\", file=sys.stderr)\n    else:\n        print(\"EXPLICIT DEVELOPER FACTORY: loading trusted local adapter code.\", file=sys.stderr)\n        agents = _factory(args.factory)\n        adapter = getattr(agents, port_name)\n    result = invoke_role(args.role, adapter, request, require_synthetic=require_synthetic)\n    if result.synthetic:\n        print(\"SYNTHETIC INPUT/OUTPUT: fixture provenance is preserved through the shared boundary.\", file=sys.stderr)\n    _emit(result.model_dump(mode=\"json\"), args.output)\n    return 0\n\n\ndef _demo(args):\n    from .adapters.synthetic import make_agents, sample_inputs\n    from .runtime import Workflow\n\n    print(\"SYNTHETIC DEVELOPMENT DEMO: approvals are scripted test inputs; storage is in memory only.\", file=sys.stderr)\n    workflow = Workflow(make_agents(scenario=\"pass\"), profile=\"development\")\n    context, document, asset = sample_inputs()\n    steps = []\n\n    def record(action, snapshot):\n        steps.append({\"action\": action, \"run_id\": snapshot.context.run_id,\n            \"execution_status\": snapshot.execution_status, \"machine_verdict\": snapshot.machine_verdict,\n            \"human_decision\": snapshot.human_decision, \"synthetic\": snapshot.synthetic})\n        if snapshot.error:\n            raise AdapterFailure(snapshot.error.code, snapshot.error.message,\n                retryable=snapshot.error.retryable, outcome_unknown=snapshot.error.outcome_unknown)\n        return snapshot\n\n    record(\"start\", workflow.start(context, document, asset))\n    record(\"approve_criteria\", workflow.approve(context.run_id,\n        Approval(context=context, actor_id=context.actor_id, decision=\"approve_criteria\")))\n    record(\"approve_changes\", workflow.approve(context.run_id,\n        Approval(context=context, actor_id=context.actor_id, decision=\"approve_changes\",\n                 reason=\"합성 개발 예제: 수정본 전체 재검수 흐름을 확인합니다.\")))\n    revised_context, _document, revised_asset = sample_inputs(\n        run_id=\"demo-run-2\", asset_version_id=\"poster-v2\", parent_run_id=context.run_id)\n    record(\"rereview\", workflow.rereview(context.run_id, revised_context, revised_asset))\n    record(\"approve_revised_criteria\", workflow.approve(revised_context.run_id,\n        Approval(context=revised_context, actor_id=revised_context.actor_id, decision=\"approve_criteria\")))\n    record(\"approve_final\", workflow.approve(revised_context.run_id,\n        Approval(context=revised_context, actor_id=revised_context.actor_id, decision=\"approve_final\")))\n    _emit({\"profile\": \"development\", \"synthetic\": True, \"storage\": \"memory\",\n        \"notice\": \"Scripted fixture approvals, not authenticated human decisions or real model results.\",\n        \"steps\": steps, \"runs\": [workflow.get(context.run_id).model_dump(mode=\"json\"),\n                                  workflow.get(revised_context.run_id).model_dump(mode=\"json\")]}, args.output)\n    return 0\n\n\ndef _schemas(args):\n    contracts = CONTRACT_TYPES\n    if args.include_configuration:\n        from .composition import RoleBinding, TeamConfiguration\n        contracts = (*contracts, RoleBinding, TeamConfiguration)\n    if args.include_checks:\n        from .checks import RoleCheckCase, RoleCheckSuite\n        from .flow_checks import FlowCheckCase\n        contracts = (*contracts, RoleCheckCase, RoleCheckSuite, FlowCheckCase)\n    schemas = {contract.__name__: contract.model_json_schema() for contract in contracts}\n    if args.output_dir:\n        directory = Path(args.output_dir)\n        directory.mkdir(parents=True, exist_ok=True)\n        for name, schema in schemas.items():\n            _emit(schema, directory / f\"{name}.schema.json\")\n        _emit({\"schema_count\": len(schemas), \"output_dir\": str(directory)})\n    else:\n        _emit(schemas)\n    return 0\n\n\ndef _doctor(args):\n    from .composition import describe_configuration\n    configuration = _load_configuration(args.config)\n    _emit({**describe_configuration(configuration), \"check\": \"configuration_only\",\n           \"factory_imports_performed\": False, \"role_calls_performed\": False,\n           \"notice\": \"Declarations only; adapter import, model, database and file connectivity are not verified.\"}, args.output)\n    return 0\n\n\ndef _check(args):\n    from .checks import load_suite, run_checks\n\n    configuration = _load_configuration(args.config)\n    prepared = load_suite(args.cases, args.role)\n    protected = {prepared.path, Path(args.config).resolve(), *(case.path for case in prepared.cases)}\n    if args.output and Path(args.output).resolve() in protected:\n        _error(\"INVALID_ARGUMENT\", \"The report must not overwrite its configuration, suite or request fixtures.\")\n        return 2\n    print(\"EXPLICIT ROLE CHECK: initializes only the selected adapter; each fixture is invoked once, without retries.\", file=sys.stderr)\n    report = run_checks(prepared, configuration)\n    # A failed check is itself a valid report. Preflight/setup errors use the\n    # normal error path and leave a previous report untouched.\n    _emit(report, args.output)\n    return 0 if report[\"passed\"] else 1\n\n\ndef _serve(args):\n    from .api import create_app\n    import uvicorn\n    configuration = _load_configuration(args.config)\n    print(\"DEVELOPMENT API: loopback only, no authentication, memory-only state; factories load trusted local code.\", file=sys.stderr)\n    app = create_app(configuration=configuration)\n    uvicorn.run(app, host=\"127.0.0.1\", port=args.port, workers=1, reload=False)\n    return 0\n\n\ndef _check_flow(args):\n    from .flow_checks import load_flow_case, run_flow_check\n\n    configuration = _load_configuration(args.config)\n    case = load_flow_case(args.case)\n    protected = {Path(args.config).resolve(), Path(args.case).resolve()}\n    if args.output:\n        output = Path(args.output)\n        if output.resolve() in protected or (output.exists() and any(output.samefile(p) for p in protected)):\n            _error(\"INVALID_ARGUMENT\", \"The report must not overwrite its configuration or workflow fixture.\")\n            return 2\n        if not output.parent.is_dir() or output.is_dir():\n            _error(\"FILE_UNAVAILABLE\", \"The output parent must exist and the report must be a file.\")\n            return 2\n    print(\"EXPLICIT WORKFLOW CHECK: initializes all configured roles; approvals are scripted test inputs. \"\n          \"Adapters run once per stage, without retries.\", file=sys.stderr)\n    report = run_flow_check(case, configuration)\n    _emit(report, args.output)\n    return 0 if report[\"passed\"] else 1\n\n\ndef _port(value):\n    port = int(value)\n    if not 1 \u003c= port \u003c= 65535:\n        raise argparse.ArgumentTypeError(\"port must be between 1 and 65535\")\n    return port\n\n\ndef parser():\n    cli = argparse.ArgumentParser(description=\"Creative Checker agent framework development commands\")\n    commands = cli.add_subparsers(dest=\"command\", required=True)\n    demo = commands.add_parser(\"demo\", help=\"run a labelled synthetic approval and re-review example\")\n    demo.add_argument(\"--output\", help=\"write JSON to this file instead of stdout\")\n    demo.set_defaults(handler=_demo)\n    role = commands.add_parser(\"role\", help=\"execute one role against its JSON request contract\")\n    role.add_argument(\"role\", choices=tuple(ROLE_CONTRACTS))\n    role.add_argument(\"--input\", required=True, help=\"request JSON file\")\n    role.add_argument(\"--output\", help=\"response JSON file; parent directory must exist\")\n    adapters = role.add_mutually_exclusive_group()\n    adapters.add_argument(\"--synthetic\", action=\"store_true\", help=\"explicitly use labelled development fixtures\")\n    adapters.add_argument(\"--factory\", help=\"trusted importable module:callable returning Agents; called with no arguments\")\n    adapters.add_argument(\"--config\", help=\"trusted team configuration JSON; initializes only the selected role\")\n    role.add_argument(\"--scenario\", choices=(\"pass\", \"fail\", \"review\", \"stale\", \"unavailable\"),\n                      help=\"synthetic scenario name, default: pass\")\n    role.set_defaults(handler=_role)\n    schema = commands.add_parser(\"schema\", help=\"export the current versioned JSON contracts\")\n    schema.add_argument(\"--output-dir\", help=\"write one NAME.schema.json file per contract\")\n    schema.add_argument(\"--include-configuration\", action=\"store_true\", help=\"also include role binding and team configuration schemas\")\n    schema.add_argument(\"--include-checks\", action=\"store_true\", help=\"also include role check suite schemas\")\n    schema.set_defaults(handler=_schemas)\n    doctor = commands.add_parser(\"doctor\", help=\"validate and describe role configuration without loading any factory\")\n    doctor.add_argument(\"--config\", required=True, help=\"team configuration JSON\")\n    doctor.add_argument(\"--output\", help=\"write diagnostics JSON; parent directory must exist\")\n    doctor.set_defaults(handler=_doctor)\n    check = commands.add_parser(\"check\", help=\"check one configured role against a local suite of request fixtures\")\n    check.add_argument(\"role\", choices=tuple(ROLE_CONTRACTS))\n    check.add_argument(\"--config\", required=True, help=\"trusted team configuration; only the selected role is initialized\")\n    check.add_argument(\"--cases\", required=True, help=\"suite JSON; fixture paths are relative to this file\")\n    check.add_argument(\"--output\", help=\"write summary JSON, including failed checks; parent directory must exist\")\n    check.set_defaults(handler=_check)\n    flow = commands.add_parser(\"check-flow\", help=\"rehearse configured criteria approval, review, report and re-review\")\n    flow.add_argument(\"--config\", required=True, help=\"trusted team configuration; initializes all roles\")\n    flow.add_argument(\"--case\", required=True, help=\"workflow fixture JSON with original/revised file references and expected verdicts\")\n    flow.add_argument(\"--output\", help=\"write a summary report, including failures; parent directory must exist\")\n    flow.set_defaults(handler=_check_flow)\n    serve = commands.add_parser(\"serve\", help=\"start the configured development API on loopback; never starts product services\")\n    serve.add_argument(\"--config\", required=True, help=\"explicit trusted team configuration JSON\")\n    serve.add_argument(\"--port\", type=_port, default=8012)\n    serve.set_defaults(handler=_serve)\n    from .postgres_commands import postgres_check,postgres_serve,postgres_worker,postgres_migrate\n    for name,handler,help_text in (\n        ('postgres-check',postgres_check,'read-only existing M008 and AF001 extension preflight'),\n        ('postgres-serve',postgres_serve,'start authenticated PostgreSQL framework API; never executes models'),\n        ('worker',postgres_worker,'run the separate fenced framework role worker'),\n        ('migrate-postgres',postgres_migrate,'explicit owner-only additive AF001 migration in an existing M008 DB')):\n        command=commands.add_parser(name,help=help_text)\n        command.add_argument('--env-file',required=True,help='explicit app-only env file; migration uses a separate owner-only file')\n        if name in ('postgres-serve','worker'):\n            command.add_argument('--config',required=True,help='fixed trusted team adapter configuration')\n        if name=='postgres-serve':command.add_argument('--port',type=_port,default=8012)\n        if name=='worker':command.add_argument('--once',action='store_true',help='recover expired claims and execute at most one queued phase')\n        command.set_defaults(handler=handler)\n    return cli\n\n\ndef main(argv=None):\n    args = parser().parse_args(argv)\n    try:\n        return args.handler(args)\n    except _ConfigError:\n        _error(\"CONFIG_INVALID\", \"Team configuration must declare all roles and use supported role settings.\")\n        return 2\n    except CheckSuiteError:\n        _error(\"CHECK_SUITE_INVALID\", \"The suite must declare the selected role, unique cases and supported expectations.\")\n        return 2\n    except FlowCaseError:\n        _error(\"FLOW_CASE_INVALID\", \"The workflow fixture must use fixed document/criteria and a new child run/poster version.\")\n        return 2\n    except ConfigurationError:\n        _error('POSTGRES_CONFIGURATION_INVALID','Use an explicit app-only or migration-only environment file for the selected action.')\n        return 2\n    except PersistenceError as exc:\n        _error(exc.code,'The PostgreSQL operation was not confirmed. Inspect readiness before any explicit retry.',outcome_unknown=exc.outcome=='commit_unknown')\n        return 1\n    except ValidationError:\n        _error(\"CONTRACT_INVALID\", \"Input or adapter output does not match the versioned JSON contract.\")\n        return 2\n    except (OSError, UnicodeError):\n        _error(\"FILE_UNAVAILABLE\", \"The requested input or output file could not be read or written.\")\n        return 2\n    except AdapterFailure as exc:\n        _error(exc.code, exc.message, retryable=exc.retryable, outcome_unknown=exc.outcome_unknown)\n        return 2 if isinstance(exc, InvocationFailure) and exc.code == \"CONTRACT_INVALID\" else 1\n    except (NotImplementedError, AttributeError):\n        _error(\"ADAPTER_NOT_IMPLEMENTED\", \"The adapter or factory is incomplete; no successful result was produced.\")\n        return 1\n    except Exception:\n        # Do not leak model responses, credentials, local paths, or tracebacks.\n        _error(\"ADAPTER_FAILED\", \"The selected command or adapter failed; inspect it in your development environment.\")\n        return 1\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n","sha256":"42108824220a09b5b9792f216f2b7aa9f89c59c5823027b4d1cc7ab008240fef"},"backend/agent_framework/composition.py":{"text":"\"\"\"Explicit local developer configuration for independent role adapters.\n\nLoading and describing configuration never imports a configured factory. Building\nan adapter does execute trusted local code; it is not a connectivity check.\nBusiness requests cannot select or change this configuration.\n\"\"\"\nfrom __future__ import annotations\n\nimport importlib\nimport inspect\nimport json\nfrom pathlib import Path\nfrom typing import Annotated, Literal\n\nfrom pydantic import Field, model_validator\n\nfrom .contracts import Contract, ValidateRequest, ValidatedResult\nfrom .ports import AdapterFailure, Agents\n\nRoleId = Literal[\"A02\", \"A04_A05\", \"A06\", \"A07\"]\nBindingKind = Literal[\"synthetic\", \"reference\", \"factory\", \"unconfigured\"]\nScenario = Literal[\"pass\", \"fail\", \"review\", \"stale\", \"unavailable\"]\nFactoryRef = Annotated[str, Field(pattern=r\"^[A-Za-z_][A-Za-z0-9_]*(?:\\.[A-Za-z_][A-Za-z0-9_]*)*:[A-Za-z_][A-Za-z0-9_]*$\")]\nROLE_PORTS = {\n    \"A02\": (\"extractor\", \"extract\"),\n    \"A04_A05\": (\"inspector\", \"inspect\"),\n    \"A06\": (\"validator\", \"validate\"),\n    \"A07\": (\"reporter\", \"report\"),\n}\n\n\nclass RoleBinding(Contract):\n    kind: BindingKind\n    factory: FactoryRef | None = None\n    scenario: Scenario | None = None\n\n    @model_validator(mode=\"after\")\n    def options_match_kind(self):\n        if self.kind == \"factory\" and self.factory is None:\n            raise ValueError(\"factory binding requires module:callable\")\n        if self.kind != \"factory\" and self.factory is not None:\n            raise ValueError(\"factory is only allowed for a factory binding\")\n        if self.kind != \"synthetic\" and self.scenario is not None:\n            raise ValueError(\"scenario is only allowed for a synthetic binding\")\n        return self\n\n\nclass TeamConfiguration(Contract):\n    profile: Literal[\"development\", \"test\"] = \"development\"\n    roles: dict[RoleId, RoleBinding]\n\n    @model_validator(mode=\"after\")\n    def complete_roles(self):\n        if set(self.roles) != set(ROLE_PORTS):\n            raise ValueError(\"configuration must explicitly declare all four roles\")\n        if any(binding.kind == \"reference\" and role != \"A06\" for role, binding in self.roles.items()):\n            raise ValueError(\"reference binding is available only for A06\")\n        return self\n\n\ndef _configuration(value: TeamConfiguration) -\u003e TeamConfiguration:\n    # Frozen models still contain a mutable dict; model_copy/model_construct also\n    # bypass validation. Revalidate before imports or developer-code execution.\n    if not isinstance(value, TeamConfiguration):\n        raise ValueError(\"expected a TeamConfiguration\")\n    return TeamConfiguration.model_validate(value.model_dump(mode=\"python\"))\n\n\ndef _unique_object(pairs):\n    values = {}\n    for key, value in pairs:\n        if key in values:\n            raise ValueError(\"duplicate configuration key\")\n        values[key] = value\n    return values\n\n\ndef _invalid_constant(_value):\n    raise ValueError(\"configuration must contain standard JSON values\")\n\n\ndef load_config(path: str | Path) -\u003e TeamConfiguration:\n    \"\"\"Parse a local config without importing modules or creating adapters.\"\"\"\n    value = json.loads(Path(path).read_text(encoding=\"utf-8-sig\"),\n                       object_pairs_hook=_unique_object, parse_constant=_invalid_constant)\n    return TeamConfiguration.model_validate(value)\n\n\nclass _UnconfiguredRole:\n    def __init__(self, role: str):\n        self.role = role\n\n    def _missing(self, _request):\n        raise AdapterFailure(\"ADAPTER_NOT_CONFIGURED\", \"The selected role has no configured adapter.\")\n\n    extract = inspect = validate = report = _missing\n\n\nclass _SyntheticValidator:\n    \"\"\"Reference validation with explicit fixture provenance; no observations invented.\"\"\"\n    def validate(self, request: ValidateRequest) -\u003e ValidatedResult:\n        from .validation import ReferenceValidator\n\n        result = ReferenceValidator().validate(request)\n        return result.model_copy(update={\"synthetic\": True})\n\n\ndef _asynchronous(value) -\u003e bool:\n    return any(inspect.iscoroutinefunction(candidate) or inspect.isasyncgenfunction(candidate)\n               for candidate in (value, getattr(value, \"__call__\", None)))\n\n\ndef _validate_adapter(adapter, role: str):\n    if inspect.isclass(adapter) or isinstance(adapter, Agents) or inspect.isawaitable(adapter) or inspect.isasyncgen(adapter):\n        if inspect.iscoroutine(adapter):\n            adapter.close()\n        raise AdapterFailure(\"INVALID_ROLE_ADAPTER\", \"A role factory must return a synchronous role adapter instance.\")\n    method = getattr(adapter, ROLE_PORTS[role][1], None)\n    if not callable(method) or _asynchronous(method):\n        raise AdapterFailure(\"INVALID_ROLE_ADAPTER\", \"The role adapter must implement its synchronous request method.\")\n    try:\n        inspect.signature(method).bind(object())\n    except (TypeError, ValueError):\n        raise AdapterFailure(\"INVALID_ROLE_ADAPTER\", \"The role method must accept one request argument.\") from None\n    return adapter\n\n\ndef _from_factory(reference: str, role: str):\n    module_name, name = reference.split(\":\", 1)\n    try:\n        factory = getattr(importlib.import_module(module_name), name, None)\n        if not callable(factory) or _asynchronous(factory):\n            raise AdapterFailure(\"INVALID_FACTORY\", \"The configured factory must be callable and synchronous.\")\n        try:\n            inspect.signature(factory).bind()\n        except (TypeError, ValueError):\n            raise AdapterFailure(\"INVALID_FACTORY\", \"The configured factory must accept zero arguments.\") from None\n        return _validate_adapter(factory(), role)\n    except AdapterFailure:\n        raise\n    except Exception:\n        raise AdapterFailure(\"ADAPTER_FACTORY_FAILED\", \"The configured role factory could not be initialized.\") from None\n\n\ndef _build_role(config: TeamConfiguration, role: str):\n    if role not in ROLE_PORTS:\n        raise ValueError(\"unknown framework role\")\n    binding = config.roles[role]\n    if binding.kind == \"unconfigured\":\n        return _UnconfiguredRole(role)\n    if binding.kind == \"reference\":\n        from .validation import ReferenceValidator\n\n        return ReferenceValidator()\n    if binding.kind == \"synthetic\":\n        if role == \"A06\":\n            return _SyntheticValidator()\n        from .adapters.synthetic import SyntheticAdapters\n\n        return SyntheticAdapters(scenario=binding.scenario or \"pass\")\n    return _from_factory(binding.factory, role)\n\n\ndef build_role(config: TeamConfiguration, role: str):\n    \"\"\"Initialize only the selected role; other factories are never imported.\"\"\"\n    return _build_role(_configuration(config), role)\n\n\ndef build_agents(config: TeamConfiguration) -\u003e Agents:\n    \"\"\"Explicitly initialize all roles. An error aborts assembly without fallback.\"\"\"\n    checked = _configuration(config)\n    return Agents(**{port: _build_role(checked, role) for role, (port, _method) in ROLE_PORTS.items()})\n\n\ndef describe_configuration(config: TeamConfiguration) -\u003e dict:\n    \"\"\"Declarations only. This function never imports or runs configured code.\"\"\"\n    checked = _configuration(config)\n    roles = {}\n    for role in ROLE_PORTS:\n        binding = checked.roles[role]\n        item = {\"kind\": binding.kind, \"connection_verified\": False}\n        if binding.factory is not None:\n            item[\"factory\"] = binding.factory\n        if binding.kind == \"synthetic\":\n            item[\"scenario\"] = binding.scenario or \"pass\"\n        roles[role] = item\n    return {\"contract_version\": checked.contract_version, \"profile\": checked.profile,\n            \"connection_verified\": False, \"roles\": roles}\n\n\ndef describe_agents(agents: Agents) -\u003e dict:\n    \"\"\"Describe exact known adapters; a custom type is never proof of connectivity.\"\"\"\n    from .adapters.synthetic import SyntheticAdapters\n    from .adapters.templates import QwenAdapterStub\n    from .validation import ReferenceValidator\n\n    kinds = {SyntheticAdapters: \"synthetic\", _SyntheticValidator: \"synthetic\",\n             ReferenceValidator: \"reference\", _UnconfiguredRole: \"unconfigured\",\n             QwenAdapterStub: \"unconfigured\"}\n    return {role: {\"kind\": kinds.get(type(getattr(agents, port)), \"custom\"),\n                   \"connection_verified\": False}\n            for role, (port, _method) in ROLE_PORTS.items()}\n","sha256":"16b2c03c31e74c966e48e0884f9da7edd4439783a97d8d8ae301c75e1e335914"},"backend/agent_framework/context.py":{"text":"\"\"\"Freeze approved provenance; no search role, database, model or network call.\n\nPG -\u003e Neo4j -\u003e PG context preparation is a separate integration task. This\nfunction only freezes the sources already present in the approved criteria.\n\"\"\"\nfrom hashlib import sha256\nimport json\n\nfrom .contracts import Context, Criterion, Evidence, EvidenceBundle\nfrom .validation import _criteria, validate_evidence\n\n\ndef freeze_approved_context(\n    context: Context, criteria: tuple[Criterion, ...], *, synthetic: bool = False,\n) -\u003e EvidenceBundle:\n    _criteria(context, criteria)\n    snapshot = json.dumps({\n        'context': context.model_dump(mode='json'),\n        'criteria': [criterion.model_dump(mode='json') for criterion in criteria],\n    }, sort_keys=True, ensure_ascii=False).encode()\n    bundle = EvidenceBundle(\n        context=context, context_id='approved-' + sha256(snapshot).hexdigest(),\n        status='complete', synthetic=synthetic,\n        evidence=tuple(Evidence(\n            evidence_id='criterion-' + sha256(criterion.criterion_id.encode()).hexdigest(),\n            project_id=context.project_id, kind='current_requirement',\n            criterion_ids=(criterion.criterion_id,),\n            source_record_id=criterion.source.block_id, source=criterion.source,\n        ) for criterion in criteria),\n        warnings=('Approved-criteria context only; no PostgreSQL/Neo4j relationship lookup was executed.',),\n    )\n    validate_evidence(context, criteria, bundle)\n    return bundle\n","sha256":"72739e1ae0a94b7ecb25f812ea94e355e711746b6eda849c4860e10c7cac8ab4"},"backend/agent_framework/contracts.py":{"text":"\"\"\"Versioned JSON contracts shared by agents, adapters, fixtures and API clients.\"\"\"\nfrom __future__ import annotations\n\nfrom typing import Annotated, Literal\n\nfrom pydantic import AwareDatetime, BaseModel, ConfigDict, Field, model_validator\n\nIdentifier = Annotated[str, Field(min_length=1, max_length=160, pattern=r\"^[A-Za-z0-9][A-Za-z0-9_.:-]*$\")]\nHash = Annotated[str, Field(pattern=r\"^[a-f0-9]{64}$\")]\nVerdict = Literal[\"pass\", \"fail\", \"review\"]\nExecutionStatus = Literal[\"queued\", \"extracting\", \"reviewing\", \"waiting_criteria\", \"waiting_review\",\n                          \"waiting_revision\", \"completed\", \"failed\", \"outcome_unknown\"]\n\n\nclass Contract(BaseModel):\n    model_config = ConfigDict(extra=\"forbid\", frozen=True)\n    contract_version: Literal[\"2.0.0\"] = \"2.0.0\"\n\n\nclass Context(Contract):\n    project_id: Identifier\n    run_id: Identifier\n    actor_id: Identifier\n    document_version_id: Identifier\n    criteria_version_id: Identifier\n    asset_version_id: Identifier | None = None\n    parent_run_id: Identifier | None = None\n\n\nclass DocumentRef(Contract):\n    file_id: Identifier\n    document_version_id: Identifier\n    sha256: Hash\n    media_type: Literal[\"application/pdf\"] = \"application/pdf\"\n    page_count: int = Field(ge=1)\n\n\nclass AssetRef(Contract):\n    file_id: Identifier\n    asset_version_id: Identifier\n    sha256: Hash\n    media_type: Literal[\"image/png\", \"image/jpeg\", \"image/webp\"] = \"image/png\"\n    width: int = Field(gt=0)\n    height: int = Field(gt=0)\n\n\nclass SourceRef(Contract):\n    document_version_id: Identifier\n    page: int = Field(ge=1)\n    block_id: Identifier\n    quote: str = Field(min_length=1)\n    source_hash: Hash\n\n\nclass Criterion(Contract):\n    criterion_id: Identifier\n    text: str = Field(min_length=1)\n    kind: Literal[\"text\", \"number\", \"visual\", \"unsupported\"]\n    expected: str = Field(description=(\n        \"Text equals/contains comparisons need a non-whitespace expected value. \"\n        \"Blank expectations remain unresolved (review) and cannot pass.\"\n    ))\n    operator: Literal[\"equals\", \"contains\", \"gte\", \"lte\", \"present\", \"manual\"]\n    unit: str | None = None\n    required: bool = True\n    source: SourceRef\n    human_added: bool = False\n\n\nclass RoleRequest(Contract):\n    # Preserve provenance even when only a previous draft's criteria are passed on.\n    synthetic: bool = False\n\n\nclass ExtractRequest(RoleRequest):\n    context: Context\n    document: DocumentRef\n\n\nclass CriteriaDraft(Contract):\n    context: Context\n    criteria: tuple[Criterion, ...] = Field(min_length=1)\n    warnings: tuple[str, ...] = ()\n    synthetic: bool = False\n\n\nclass Evidence(Contract):\n    evidence_id: Identifier\n    project_id: Identifier\n    kind: Literal[\"current_requirement\", \"approved_exception\", \"historical_context\"]\n    criterion_ids: tuple[Identifier, ...] = Field(min_length=1)\n    source_record_id: Identifier\n    source: SourceRef\n    approval_id: Identifier | None = None\n    # Exception eligibility must be checked by the common context preparation service.\n    applicable_asset_version_id: Identifier | None = None\n\n    @model_validator(mode=\"after\")\n    def exception_has_scope(self):\n        if self.kind == \"approved_exception\" and (not self.approval_id or not self.applicable_asset_version_id):\n            raise ValueError(\"approved_exception requires approval_id and asset scope\")\n        return self\n\n\nclass EvidenceBundle(Contract):\n    context: Context\n    context_id: Identifier\n    status: Literal[\"complete\", \"empty\", \"stale\", \"unavailable\"]\n    evidence: tuple[Evidence, ...] = ()\n    warnings: tuple[str, ...] = ()\n    postgres_revision: int = Field(default=0, ge=0)\n    graph_revision: int | None = Field(default=None, ge=0)\n    synthetic: bool = False\n\n\nclass InspectRequest(RoleRequest):\n    context: Context\n    criteria: tuple[Criterion, ...] = Field(min_length=1)\n    asset: AssetRef\n    evidence: EvidenceBundle\n\n\nclass ImageEvidence(Contract):\n    asset_version_id: Identifier\n    asset_hash: Hash\n    # Normalized x1,y1,x2,y2; absence means no localization claim.\n    bbox: tuple[float, float, float, float] | None = None\n\n    @model_validator(mode=\"after\")\n    def valid_box(self):\n        if self.bbox is not None:\n            x1, y1, x2, y2 = self.bbox\n            if not (0 \u003c= x1 \u003c x2 \u003c= 1 and 0 \u003c= y1 \u003c y2 \u003c= 1):\n                raise ValueError(\"bbox must be finite normalized x1,y1,x2,y2\")\n        return self\n\n\nclass Observation(Contract):\n    criterion_id: Identifier\n    observed: str\n    verdict: Verdict\n    image: ImageEvidence\n    evidence_ids: tuple[Identifier, ...] = ()\n    uncertainty: str | None = None\n\n\nclass InspectionResult(Contract):\n    context: Context\n    observations: tuple[Observation, ...]\n    synthetic: bool = False\n\n\nclass ValidateRequest(RoleRequest):\n    context: Context\n    criteria: tuple[Criterion, ...] = Field(min_length=1)\n    asset: AssetRef\n    evidence: EvidenceBundle\n    inspection: InspectionResult\n\n\nclass ValidatedItem(Contract):\n    criterion_id: Identifier\n    verdict: Verdict\n    issues: tuple[str, ...] = ()\n\n\nclass ValidatedResult(Contract):\n    context: Context\n    verdict: Verdict\n    items: tuple[ValidatedItem, ...] = Field(min_length=1)\n    limitations: tuple[str, ...] = ()\n    synthetic: bool = False\n\n\ncla
