.11\nNodes (21): create_app(), adapter_status(), approve(), configuration_status(), health(), invoke(), read(), revise() (+13 more)\n\n### Community 7 - \"Workflow and human approvals\"\nCohesion: 0.17\nNodes (10): _demo(), Approval, RunSnapshot, run_flow_check(), approve(), _boundary(), _copy(), _GraphState (+2 more)\n\n### Community 8 - \"Durable Worker relationships\"\nCohesion: 0.16\nNodes (10): execute_claim(), execute_role(), node(), Lease, accept_role_output(), _contract(), invoke_role(), _policy() (+2 more)\n\n## Knowledge Gaps\n- **2 thin communities (\u003c3 nodes) omitted from report** — run `graphify query` to explore isolated nodes.\n\n## Suggested Questions\n_Questions this graph is uniquely positioned to answer:_\n\n- **Why does `Context` connect `Run input contracts` to `Evidence and verdict validation`, `Postgres Api relationships`, `Synthetic data and observations`?**\n  _High betweenness centrality (0.024) - this node is a cross-community bridge._\n- **Are the 16 inferred relationships involving `Workflow` (e.g. with `Approval` and `AssetRef`) actually correct?**\n  _`Workflow` has 16 INFERRED edges - model-reasoned connections that need verification._\n- **Should `Evidence and verdict validation` be split into smaller, more focused modules?**\n  _Cohesion score 0.09272300469483569 - nodes in this community are weakly interconnected._\n- **Why does `Workflow` connect `Workflow and human approvals` to `Evidence and verdict validation`, `Checks relationships`, `Run input contracts`, `Postgres relationships`, `Synthetic data and observations`, `CLI and fixture composition`?**\n  _High betweenness centrality (0.009) - this node is a cross-community bridge._\n- **Should `Checks relationships` be split into smaller, more focused modules?**\n  _Cohesion score 0.06663141195134849 - nodes in this community are weakly interconnected._\n- **Why does `invoke_role()` connect `Durable Worker relationships` to `Evidence and verdict validation`, `CLI and fixture composition`?**\n  _High betweenness centrality (0.006) - this node is a cross-community bridge._\n- **Should `Run input contracts` be split into smaller, more focused modules?**\n  _Cohesion score 0.08087431693989071 - nodes in this community are weakly interconnected._","sha256":"5cc4315e234d0d9356d484223b74656c27320ee2c21458ec6684858de65764be"},"docs/agent-framework/verification-2026-11-02.md":{"text":"\u003e 이전 검증 이력: 이 보고서는 독립 A03 제거·계약 2.0.0 적용 전의 코드와 시험 결과다. 현재 구조와 최신 검증은 [A03 제거 정리](a03-retirement-2026-11-02.md) 및 [담당자 가이드](에이전트_프레임워크_가이드.html)를 따른다.\n\n# 공통 개발 프레임워크 검증 기록\n\n- 날짜: 2026-11-02 (Asia/Seoul)\n- 작업 브랜치: `feat/agent-framework`\n- 시작 커밋: `87a3b9e` (`feat/29-front-v2`에서 분기)\n- 대상: 역할별 독립 개발 계약과 개발용 실행기. 실제 제품 통합 완료 기록이 아니다.\n- 상태: 로컬 작업 파일이며 커밋·푸시하지 않았다.\n\n## 실행한 검사\n\n저장소 루트의 기존 `.venv`를 사용했다. 이번 작업에서 의존성 설치·잠금 파일 갱신은 하지 않았다.\n\n```sh\n.venv/bin/python -m scripts.export_agent_framework\n.venv/bin/python -m pytest tests/agent_framework -q --tb=short\n.venv/bin/python -m backend.agent_framework demo --output /tmp/agent-framework-demo-20261102.json\n.venv/bin/python -m backend.agent_framework role A03 --input examples/agent_framework/A03.json --synthetic --output /tmp/agent-framework-A03-20261102.json\ngit diff --check\n```\n\n결과: **104개 테스트와 9개 하위 테스트 통과**, `git diff --check` 통과.\n\n- 공통 JSON 계약 및 모델 생성 우회 출력 재검증.\n- 잘못된 프로젝트·문서·조건·이미지 버전, 위조 인용·해시, 과거 이력의 현재 관측 사용 차단.\n- 조건 누락·중복·불확실 관측·지원하지 않는 비교·수량 모순·검색 지연/실패 처리.\n- 조건 승인, 수정 요청 승인, 새 버전 전체 재검수, 최종 승인 및 예외 승인 제한.\n- 동시/중복 승인, 새 실행 ID 충돌, 승인 자동 승계 방지.\n- 모델·검색 미설정 및 결과 불명 시 합성 대체·자동 재호출 없음.\n- 모든 역할의 독립 CLI, factory 교체, 합성 입력 표시 전파, 오류 시 기존 출력 파일 보존.\n- FastAPI TestClient를 통한 접수·조회·승인·재검수와 오류 응답. 서버 포트는 열지 않았다.\n- 17개 JSON Schema, 15개 합성 예제 JSON, 개발 OpenAPI의 생성 결과와 저장된 파일 일치.\n\ndemo는 2개 합성 실행에서 6개 동작을 수행했다. 수정 전 실행은 `changes_approved`, 수정 후 실행은 `final_approved`로 끝났으며 두 실행 모두 `synthetic=true`다. 승인자는 스크립트 입력이므로 실제 사용자의 승인 기록으로 사용할 수 없다.\n\n## 검증 범위와 남은 연결\n\n현재 환경에는 `pytest-asyncio` 플러그인이 없어 기존 `asyncio_mode`, `asyncio_default_fixture_loop_scope` 설정에 대한 경고 2개가 발생했다. 이번 검사는 동기 테스트이며 모두 통과했다. 잠금 파일로 새 환경을 설치한 결과로 확대 해석하지 않는다.\n\n실제 Qwen·PDF·이미지 처리, PostgreSQL·Neo4j 쿼리, MCP 전송, 영속 worker 복구, 제품 인증 및 front-v2 API 연결은 이번 검증에 포함하지 않는다. 모델 정확도·검색 품질·배포 완료를 검증한 것이 아니다.\n\n기존 front-v2, `backend/app`, `backend/creative_checker`, 마이그레이션, 실행 스크립트, 의존성 파일은 변경하지 않았다. 업무 DB와 환경설정에 접근하거나 서비스를 기동하지 않았다. 이전에 작성한 계획 MD·HTML은 그대로 보존했다.\n\nUbuntu·Windows용 GitHub Actions 검사를 추가했지만 아직 원격 실행하지 않았다. Windows 장치 실행과 제품 전체 회귀 테스트는 이번 로컬 검증 결과에 포함하지 않는다.\n","sha256":"fedb5eb2faa01c0658451d1ab3527d96c87aac50c9ec052eb9afa9139c2ab8e0"},"docs/planning/pdf-qwen-rag-workflow-plan-2026-11-02.md":{"text":"# PDF·Qwen 에이전트 프레임워크 전체 계획\n\n2026-11-02 갱신 · 독립 A03 폐기 반영 · 구현과 목표 구분\n\n## 01. 기준 문서와 적용 범위\n\n정본은 [프로젝트 통합문서 20261102 정리본](../agent-framework/reference/프로젝트_통합문서_20261102.html)이다. 10/30 역할 결정과 11/02 정정을 반영한다. 독립 A03 검색·근거 에이전트는 폐기하고 A04·A05는 동일 Qwen3.5-4B를 사용하는 통합 검사로 연결한다. 별도 OCR 주·보조·fallback, VectorDB·임베딩·벡터 인덱스는 포함하지 않는다.\n\n첫 제품 연결 범위는 PDF 한 개와 포스터다. 최신 통합문서의 최종 제품 범위에는 숏폼 영상도 포함되지만 이 프레임워크 단계에서 영상·DOCX/HWPX 처리를 모두 구현하지 않는다. 데스크톱 front-v2 디자인을 유지한다. 기존 업로드·DB·사용자·프로젝트·인증·권한을 재사용한다.\n\n이전 계획의 A03 담당·RetrieveRequest·retriever factory·A03부터 재검수 표기는 이번 문서로 대체한다. 검색 보조 기능의 유지는 폐기된 에이전트를 다시 만들라는 뜻이 아니다.\n\n## 02. 목표 업무 흐름\n\n프로젝트 접근 확인 → PDF·포스터 제출 → A02 조건 초안·원문 근거 → 사람이 기준 확정 → 실행 입력·근거 고정 → A04_A05 통합 검사 → A06 결과 검증 → A07 보고 → 사람의 결과 확인.\n\n- 수정이 없고 pass이면 최종 승인으로 직접 이동한다. 세 종류의 승인이 모든 실행에서 세 번 승인해야 한다는 뜻은 아니다.\n- 수정할 때만 위치·현재 상태·바꿀 기준이 있는 수정 요청을 승인하고 제작자가 새 산출물을 제출한다.\n- A08은 새 실행·부모 연결·새 산출물 버전을 만들고 초안만 재사용한다. 새 실행에서 기준을 재승인한 뒤 조건 전체를 다시 검사한다.\n- 문서·조건 변경은 A02 새 추출·기준 확정이 필요하다. 부모 승인·최종 승인·과거 pass를 새 버전에 자동 승계하지 않는다.\n- review·필수 근거 확인 불가는 최종/예외 승인을 차단한다. 제한적인 fail 예외는 완전한 근거·확정 value_mismatch·대상 버전·사유·권한 요건을 확인한다. 기계 판정은 보존한다.\n\n## 03. 역할과 공통 책임\n\n| 구분 | 책임 | 입력 → 출력 | 구현 주체 |\n|---|---|---|---|\n| A01 공통 실행 | 단계 전환·승인 대기·실패·작업 소유권 | 접수·상태·명령 → RunSnapshot | 공통 프레임워크 |\n| A02 PDF 조건 추출 | 전체 문서 처리·조건·출처·누락 경고 | ExtractRequest → CriteriaDraft | 모델 담당 |\n| 공통 입력·근거 준비 | 승인 조건·원문·문맥 고정, 후속 관계 조회 | Context + 승인 criteria → EvidenceBundle | 공통 준비 함수·서비스 |\n| A04_A05 통합 검사 | 현재 포스터 문구·객체·로고·배치 관측 | InspectRequest → InspectionResult | 통합 검사 담당 |\n| A06 결과 검증 | 조건 누락·인용·버전·수치·판정 검증 | ValidateRequest → ValidatedResult | 공통 참조 검증기 |\n| A07 보고 | 검증 판정 보존·수정 요청 초안 | ReportRequest → ReportDraft | 보고 담당 |\n| A08 공통 재검수 | 새 실행·초안 재사용·조건 재승인 | 부모·새 산출물 → 새 RunSnapshot | 공통 프레임워크 |\n\n현재 구성 가능한 역할은 네 개다. A01·A08과 입력 준비는 모델 factory가 아니다. 번호를 다시 매기지 않는다. 별도 GraphDB 에이전트가 필요한지는 팀 논의 사항이며 현재 구현에 임의로 추가하지 않는다.\n\n## 04. 근거·관계 조회와 RAG의 위치\n\n최신 통합문서 13.2에서 채택한 조회 순서는 **PostgreSQL → Neo4j → PostgreSQL → 근거 묶음 고정**이다. 이를 검사 전 공통 문맥 준비 기능으로 둔다.\n\n1. PostgreSQL에서 현재 사용자·프로젝트 권한, 승인 기준 전체, 문서·산출물 버전과 원문을 확인한다.\n2. Neo4j에서 동일 범위의 조건·원문·승인 예외·수정 이력 관계를 탐색한다. 관계는 원본을 가리키는 연결이며 권한의 정본이 아니다.\n3. 반환된 원본 ID를 PostgreSQL에서 다시 읽어 권한·현재 버전·예외 효력·범위를 검증한다.\n4. 허용된 근거와 문맥·조회 정책·revision·한계·인용을 고정해 검사와 보고 입력으로 전달한다.\n\n승인 조건 전체가 검사 대상이다. 검색 top-k로 조건을 제외하거나 과거 판정으로 현재 관측을 대신하지 않는다. 외부 자료 안의 명령문은 자료이며 실행 권한·시스템 규칙·승인 정책을 바꾸지 못한다.\n\n근거는 현재 요구조건, 승인 예외, 과거 문맥을 구분한다. 다른 프로젝트·문서·산출물 버전, 만료·철회된 예외, 존재하지 않는 인용·변조 해시는 거부한다. empty·stale·unavailable과 조회 실패를 정상 검색 성공으로 숨기지 않는다. DB 장애를 창작물 위반으로 판단하지 않는다. SQL fallback과 Neo4j projection/outbox의 동등성·순서·재시도 정책은 실제 연결 시 별도로 확정하고 검증한다.\n\n현재 구현의 `freeze_approved_context`는 **승인 조건에 이미 포함된 출처를 복사하는 순수 함수**다. PostgreSQL·Neo4j 조회를 실행하지 않는다. `EvidenceBundle.status=complete`와 warnings는 승인 기준 출처 묶음의 범위를 나타낸다. 실제 관계 조회·RAG가 완성됐다는 뜻이 아니다. 후속 조회 서비스는 이 고정 경계를 확장하되 독립 A03 역할·factory·worker 단계로 되살리지 않는다.\n\n## 05. 현재 구현과 남은 연결\n\n| 분야 | 현재 코드가 제공하는 것 | 남은 실제 연결 |\n|---|---|---|\n| 계약·설정 | 계약 2.0.0, 네 역할, 입력·응답 재검증 | 팀별 모델 revision·프롬프트·정책 관리 |\n| 파일 접근 | 기존 저장소 재사용, 실제 바이트·버전·해시·MIME·페이지·치수 검증 | 인증된 제품 경계에서 FileAccess 주입 |\n| 조건·검사·보고 | typed port, 미설정 모델 stub, 합성 사례 | 실제 PDF/Qwen 추출·포스터 검사·보고 |\n| 근거 문맥 | 승인 출처 고정, 인용·현재 버전·범위 검증 | PostgreSQL→Neo4j→PostgreSQL 공통 조회 |\n| 실행·승인 저장 | M008 재사용 AF001 스키마·API·worker·명시적 마이그레이션 | 대상 환경 배포·백업·복구 수용 시험 |\n| 재검수 | 초안 재사용·기준 재승인·새 실행·전체 검사 | 제품의 수정 요청 상세·전후 비교 UX |\n| 프론트 | 기존 front-v2 보존 | 새 프레임워크의 인증 API·이력·비교 화면 연결 |\n\n정적 HTML·합성 테스트·개발 DB 검증을 실모델 정확도나 운영 배포 증거로 해석하지 않는다. 이전 보고서의 시험 건수는 그 시점의 이력이며 이번 변경의 검증 결과는 별도 기록한다.\n\n## 06. 영속 실행 구조\n\nAPI는 기존 세션·CSRF·프로젝트 권한을 확인해 접수·조회·승인만 처리한다. 역할 factory는 독립 worker가 초기화한다. 기존 OCR leader·worker와 다른 프레임워크 실행 경로를 사용한다. 기존 front-v2를 다시 만들지 않는다.\n\n첫 phase는 A02다. 기준 승인 시 승인 기록·기준 출처 묶음·검수 작업을 함께 저장한다. 다음 phase는 **A04_A05 → A06 → A07**이다. A03 작업이나 숨은 검색 역할 단계는 없다. 각 역할의 입력 해시·출력·상태·시각·소요 시간·오류와 승인 기록을 PostgreSQL에 보존한다.\n\n완료 단계는 동일 입력·설정·코드 revision에서만 재사용한다. worker는 모델 호출 중 DB 트랜잭션을 잡지 않는다. lease·heartbeat·fencing token·현재 권한 재확인으로 중복 선점과 오래된 결과 반영을 막는다. 호출 여부가 불명확하면 outcome_unknown으로 끝내고 자동 중복 호출하지 않는다. LangGraph checkpoint와 업무 DB가 자동으로 한 트랜잭션이라고 가정하지 않는다.\n\n승인 대기는 worker lease를 유지하지 않는다. 같은 승인·수정본 접수는 멱등 처리하고 다른 내용의 충돌은 거부한다. 최종 승인과 실행 완료·모델 pass는 서로 다른 상태다.\n\nAF001은 기존 public M008 스키마를 보존하는 추가 스키마다. 자동 마이그레이션하지 않는다. 미배포 개발 AF001에서 A03 허용 역할을 제거했다. 이전 해시를 이미 적용한 환경은 명시적인 후속 마이그레이션과 저장 실행 처리 정책이 필요하며 readiness 검사를 우회하지 않는다.\n\n## 07. 버전·권한·계약 전환\n\n문서·기준·산출물·설정·공통 코드 revision·근거 문맥을 실행별로 고정한다. 실제 모델 담당자는 모델·프롬프트·전처리·timeout을 추가로 기록한다. 승인 대상은 해당 실행·기준·산출물 버전이다.\n\n계약은 1.0.0에서 2.0.0으로 변경한다. A03 설정 키·RetrieveRequest·retriever port/factory를 제거했고 EvidenceBundle의 retrieval_id는 context_id로 변경한다. 이전 JSON·설정은 새 template과 fixture로 교체한다. 저장된 구버전 실행을 임의 변환하거나 새 코드로 자동 재개하지 않는다. HTTP 경로 `/api/framework/v1`은 별개 버전이다.\n\nAPI의 actor_id가 로그인 증거를 대신하지 않는다. worker도 현재 계정·프로젝트 접근을 재확인한다. 파일 전체 SHA-256과 인용문 해시를 혼동하지 않는다. raw 공급자 응답·원문·비밀번호를 오류 로그나 공유 fixture에 넣지 않는다.\n\n## 08. 다음 구현 순서와 완료 기준\n\n| 순서 | 작업 | 확인할 증거 |\n|---|---|---|\n| 1 | 최신 문서·네 역할 계약·흐름도 정렬 | A03 설정·factory·실행 단계 없음, 네 역할 예제·검사 |\n| 2 | A02 실제 PDF/Qwen 연결 | 전체 처리 범위·조건·원문·누락 경고와 파일 검증 |\n| 3 | 공통 관계 문맥 준비 | 허용 범위 PG→Neo4j→PG 실제 조회, 오류·지연·인용 검증 |\n| 4 | 통합 Qwen 검사·A06·보고 | 승인 조건 전체의 관측·이미지 근거·판정·한계 |\n| 5 | 기존 front-v2 API 연결 | 기준 승인·진행·결과·수정본·전후 비교·최종 승인 |\n| 6 | 통합 수용 시험 | 실사용자 권한·영속 기록·재시작·중복·장애·복구 |\n\n모델 담당자는 공통 port에 맞춘 어댑터·factory·독립 테스트·의존성을 제출하고 공통 담당자는 계약·입력 준비·DB·승인·worker를 관리한다. 실행법과 수정 파일은 [담당자 가이드](../agent-framework/에이전트_프레임워크_가이드.html), DB 적용법은 [PostgreSQL 가이드](../agent-framework/에이전트_프레임워크_PostgreSQL_실행가이드.html)를 따른다.\n\n## 09. 검증과 아직 확인하지 않은 범위\n\n회귀는 계약·파일 해시·인용·조건 누락·관측 불확실·다른 버전·승인 분기·재검수·중복·호출 결과 불명을 확인한다. 폐기한 역할의 설정/CLI 거부와 기준 승인 시 입력 고정을 직접 검사한다. PostgreSQL 시험은 임시 전용 DB에서 실행·단계·승인 저장과 worker 복구를 확인한다.\n\n실제 모델 평가에서는 조건 추출 완전성·위반 탐지·잘못 통과·보류·인용 정확도·관계 근거 적합성을 구분한다. 사람이 검증하지 않은 합성/개발 데이터의 지표를 정답셋 성능으로 표시하지 않는다.\n\nNeo4j 공통 조회, 실제 Qwen 모델, MCP 통신, 운영 DB 마이그레이션·운영 배포, front-v2 전체 연결, 실제 Windows 장치 렌더링·실행은 각각 별도 검증 대상이다. 이 문서는 해당 완료를 주장하지 않는다.\n","sha256":"cda87d125aa0b0341f2f013c944b628e3a51c3d8adcb1832dd94892c06202463"},"examples/agent_framework/README.md":{"text":"\u003e 현재 계약은 2.0.0이다. 독립 A03·RetrieveRequest·retriever factory는 제거했다. 승인 출처는 공통 context.py에서 고정하며 외부 관계 조회는 아직 실행하지 않는다.\n\n# 합성 에이전트 계약 예제\n\n이 폴더의 JSON은 실제 PDF, 포스터, 모델, PostgreSQL, Neo4j 실행 결과가 아닙니다.\n파일 ID와 SHA-256도 **합성 참조 문자열**을 나타냅니다. 원본 미디어 파일은 제공하지 않습니다.\n모든 역할 출력의 `synthetic`은 `true`이며 모델 정확도나 배포 완료 증거로 사용할 수 없습니다.\n\n| 역할 | 요청 JSON | 응답 JSON | 계약 |\n|---|---|---|---|\n| A02 조건 추출 | `A02.json` | `A02.output.json` | ExtractRequest → CriteriaDraft |\n| A04/A05 통합 검사 | `A04_A05.json` | `A04_A05.output.json` | InspectRequest → InspectionResult |\n| A06 코드 검증 | `A06.json` | `A06.output.json` | ValidateRequest → ValidatedResult |\n| A07 보고서 | `A07.json` | `A07.output.json` | ReportRequest → ReportDraft |\n\n기본 예제는 `MORNING CUP` 정확문구와 딸기 `3개` 조건을 사용합니다.\n`scenarios/`에는 `pass`, `fail`, `review`, `stale`, `unavailable`의 A06 검증 결과가 있습니다.\n`stale`과 `unavailable`에서는 합성 검사기가 충족을 주장해도 검색 근거가 불완전하므로 코드 검증이 `review`로 남깁니다.\n\n저장소 루트에서 같은 JSON을 다시 생성할 수 있습니다. 외부 서비스에 접속하지 않습니다.\n\n```sh\npython -m backend.agent_framework.adapters.generate_examples\n```\n\n`custom_adapter.py`는 팀별 어댑터 팩터리의 연결 위치만 보여 줍니다. 구현하지 않은 메서드는\n`ADAPTER_NOT_CONFIGURED`를 반환하며 합성 결과로 대체하지 않습니다. 실제 서비스를 연결할 때는\n각 메서드의 입력·출력 계약과 현재 버전·출처·인용 검증을 유지해야 합니다.\n\n## 팀별 역할 설정\n\n- `team_config.template.json`: A02·A04_A05·A07은 미설정, A06은 참조 검증기입니다. 팀 연결용으로 복사해 사용합니다.\n- `team_config.synthetic.json`: 합성 역할과 A06 참조 검증기를 명시적으로 조합합니다. 실제 모델·DB 연결을 하지 않습니다.\n- `team_adapters.py`: 역할별 `create_extractor`, `create_inspector`, `create_validator`, `create_reporter` factory의 시작점입니다. 모델·검색 stub은 호출 시 `ADAPTER_NOT_CONFIGURED`로 실패합니다.\n\n설정 파일에는 네 역할을 모두 선언하고, 역할 하나의 binding을 다음처럼 바꿉니다. 아래는 `roles.A04_A05`의 값이며 완전한 설정 파일이 아닙니다.\n\n```json\n{\n  \"kind\": \"factory\",\n  \"factory\": \"examples.agent_framework.team_adapters:create_inspector\"\n}\n```\n\n역할별 factory는 인자 없이 **단일 역할 어댑터**를 반환합니다. 기존 `custom_adapter:make_agents`와 CLI의 `--factory`는 `Agents` 전체를 반환하는 별도 경로로 유지됩니다. factory import·생성자는 부작용 없이 작성하고, 클라이언트는 역할 메서드에서 필요할 때 초기화합니다. 여러 실행이 인스턴스를 공유할 수 있으므로 클라이언트 초기화·호출 동시 접근도 담당자가 관리합니다. 미구현·연결 실패를 합성 데이터로 대체하지 않습니다.\n\nmacOS:\n\n```sh\n.venv/bin/python -m backend.agent_framework doctor --config examples/agent_framework/team_config.synthetic.json\n.venv/bin/python -m backend.agent_framework role A04_A05 --input examples/agent_framework/A04_A05.json --config examples/agent_framework/team_config.synthetic.json\n.venv/bin/python -m backend.agent_framework serve --config examples/agent_framework/team_config.synthetic.json --port 8012\n```\n\nWindows PowerShell에서는 위의 실행 파일을 `.\\.venv\\Scripts\\python.exe`로 바꾸고 동일한 인자를 사용합니다.\n\n`doctor`는 설정 검사·설명만 하며 설정된 모듈의 import, factory·역할 호출, 접속 검증은 하지 않습니다. `role --config`는 선택한 역할만 생성합니다. `serve --config`는 동일 구성으로 개발 API를 열며 loopback `127.0.0.1`, 단일 worker, 인증 없음, 메모리 저장 범위입니다. 시작만으로 검수·승인을 실행하지 않습니다. `GET /api/framework/v1/configuration`에서 구성 선언과 초기화 상태를 확인할 수 있으며 실제 연결 검증은 별개입니다.\n\n공통 CLI·실행기 호출은 같은 계약 검증을 적용하고 중첩 합성 입력의 표시를 결과까지 유지합니다. 자세한 소유 범위·계약 규칙은 [개발 가이드](../../docs/agent-framework/README.md)를 따릅니다. 개발 정본은 루트 `backend/agent_framework`, `docs/agent-framework`, `tests/agent_framework`이며 `share/에이전트_흐름도`는 수정 대상이 아닌 배포 사본입니다.\n\n## 여러 예제의 계약 검사\n\n`checks/`의 역할별 `*.suite.json`과 요청 fixture는 `python -m scripts.export_agent_framework`로 생성합니다. 네 역할에 총 17개 사례가 있으며 A06/A07의 정상 `fail`·`review` 판정과 범위 위반 거부도 구분합니다.\n\n```sh\n.venv/bin/python -m backend.agent_framework check A07 --config examples/agent_framework/team_config.synthetic.json --cases examples/agent_framework/checks/A07.suite.json\n```\n\nWindows PowerShell에서는 실행 파일을 `.\\.venv\\Scripts\\python.exe`로 바꿉니다. 입력 경로는 suite 파일 기준의 상대 경로입니다. `--output \u003c파일\u003e`로 결과 요약을 저장할 수 있으며 종료 코드는 기대 일치 0, 검사 실패 1, 잘못된 입력·설정 2입니다. 결과 불명은 실패로 남기고 나머지 사례를 중단하며 자동 재시도하지 않습니다.\n\n이 fixture에는 실제 미디어 파일이 없습니다. 실모델·검색 어댑터를 검사할 때는 자기 개발 입력과 기대값을 가진 별도 suite를 만듭니다. 보고서의 `passed`는 선언한 기대와의 일치이며 모델 정확도나 DB 연결 성공 인증이 아닙니다. 세부 규격은 [개발 가이드의 역할별 계약 검사](../../docs/agent-framework/README.md#역할별-계약-검사-묶음-실행)를 참고하세요.\n\n## 실제 파일 바이트 연결 예제\n\n`python -m examples.agent_framework.file_access_demo`는 실행할 때 PDF·PNG를 생성하고, 기존 `services.store_file`·`LocalStorage`와 격리 SQLite의 기존 모델로 등록·조회합니다. 실제 바이트 해시·페이지·치수 및 변경된 해시 참조 거부를 확인합니다. 생성 테스트 미디어이며 운영 DB·사용자 업로드·Qwen·Neo4j를 사용하지 않습니다.\n\n## 단계별 실행 기록\n\n`python -m backend.agent_framework demo`의 `runs[].step_records`에서 역할별 상태·UTC 시작/종료 시각·소요 시간을 확인합니다. 재검수의 A02는 `reused`와 부모 실행 ID로 표시되며 모델을 다시 실행한 기록이 아닙니다.\n\n같은 `Workflow` 객체의 `get_steps(run_id)` 또는 개발 API `GET /api/framework/v1/runs/{run_id}/steps`로 실행 중인 역할도 조회할 수 있습니다. 시작·승인 POST는 여전히 동기식입니다. 오류 시 후속 역할을 실행하지 않으며 결과 불명과 일반 실패를 구분합니다. 예제는 합성 어댑터와 테스트 승인을 사용하고 기록은 메모리에만 남습니다. 별도로 실행한 CLI와 API 프로세스는 기록을 공유하지 않습니다.\n\n## 설정한 역할의 전체 흐름 검사\n\n```sh\n.venv/bin/python -m backend.agent_framework check-flow --config examples/agent_framework/team_config.synthetic.json --case examples/agent_framework/workflow.synthetic.json\n.venv/bin/python -m examples.agent_framework.file_flow_demo\n```\n\nWindows는 실행 파일을 `.\\.venv\\Scripts\\python.exe`로 바꿉니다. `check-flow`는 네 역할을 구성해 테스트 조건 승인→검사·보고→수정 승인→수정본 재검수→최종 승인을 확인합니다. `--output 보고서.json`으로 요약을 저장하며 전체 기대 일치 0, 실패·결과 불명·불일치 1, 입력·설정 오류 2를 반환합니다. 오류·기대 불일치 뒤에는 나머지 동작을 건너뜁니다.\n\n`workflow.synthetic.json`은 실제 미디어가 없는 합성 참조입니다. 담당자 구성에는 별도 개발 사례의 PDF·포스터 ID·버전·해시와 기대 판정을 입력합니다. `file_flow_demo`는 생성 PDF와 실제 PNG 두 버전을 기존 저장소에 넣고, 파일 검증 후 PDF 텍스트·픽셀 테스트 콜백으로 최초 불합격→수정본 통과를 확인합니다. Qwen·Neo4j 호출은 없으며 임시 SQLite·파일은 종료 후 정리됩니다. 모든 승인은 테스트 값이고 실행 기록은 메모리에만 남습니다.\n\n자세한 사례 계약과 보고서 규격은 [전체 흐름 검증 안내](../../docs/agent-framework/README.md#설정한-어댑터의-전체-흐름-검증)를 참고하세요.\n\n파일 접근용 `VerifiedFileAccess`, 기존 저장소 어댑터, `FileBackedExtractor/FileBackedInspector` 연결 방법은 [개발 가이드](../../docs/agent-framework/README.md#기존-저장소의-pdf포스터-읽기)에 있습니다. 테스트 fixture의 합성 참조를 실파일 ID로 자동 변환하지 않습니다. macOS는 `.venv/bin/python`, Windows는 `.\\.venv\\Scripts\\python.exe`로 실행합니다.\n","sha256":"46ff9426abe88b0aad9d782f6f57b6dbadd5c2db05cf83ccddbc9b4822bc45c8"},"examples/agent_framework/file_flow_demo.py":{"text":"\"\"\"Configured full-flow demo using generated real files and fixture callbacks.\n\nExplicit execution only. Uses isolated SQLite, existing store_file/LocalStorage,\nPDF text extraction and a deterministic pixel counter, not Qwen or RAG. The\nContextVar is a scoped dependency seam for this demo's local factories only.\nImporting this module creates no files, database connections or model clients.\n\"\"\"\nfrom __future__ import annotations\n\nfrom contextvars import ContextVar\nfrom hashlib import sha256\nfrom io import BytesIO\nimport json\nfrom pathlib import Path\nfrom tempfile import TemporaryDirectory\n\n_files = ContextVar(\"file_flow_demo_access\")\n\n\ndef _extract(request, document):\n    import pymupdf\n    from backend.agent_framework.contracts import CriteriaDraft, Criterion, SourceRef\n\n    with pymupdf.open(stream=document.content, filetype=\"pdf\") as pdf:\n        quote = pdf[0].get_text().strip()\n    if quote != \"Display exactly 3 green marks.\":\n        raise ValueError(\"unexpected generated fixture\")\n    source = SourceRef(document_version_id=request.document.document_version_id,\n        page=1, block_id=\"generated-line-1\", quote=quote, source_hash=sha256(quote.encode()).hexdigest())\n    return CriteriaDraft(context=request.context, synthetic=True,\n        warnings=(\"Generated fixture; PDF text extraction and pixel counting, not Qwen inference.\",),\n        criteria=(Criterion(criterion_id=\"green-marks\", text=quote, kind=\"number\", expected=\"3\",\n                            operator=\"equals\", unit=\"개\", source=source),))\n\n\ndef _inspect(request, poster):\n    from PIL import Image\n    from backend.agent_framework.contracts import ImageEvidence, InspectionResult, Observation\n\n    with Image.open(BytesIO(poster.content)) as image:\n        image = image.convert(\"RGB\")\n        count = sum(image.getpixel((x, 12)) == (49, 91, 72) for x in (8, 16, 24))\n    criterion = request.criteria[0]\n    citations = tuple(e.evidence_id for e in request.evidence.evidence if criterion.criterion_id in e.criterion_ids)\n    return InspectionResult(context=request.context, synthetic=True, observations=(Observation(\n        criterion_id=criterion.criterion_id, observed=str(count), verdict=\"pass\" if count == 3 else \"fail\",\n        evidence_ids=citations, image=ImageEvidence(asset_version_id=request.asset.asset_version_id,\n            asset_hash=request.asset.sha256, bbox=(0, 0, 1, 1))),))\n\n\ndef create_extractor():\n    from backend.agent_framework.adapters.file_backed import FileBackedExtractor\n    return FileBackedExtractor(_files.get(), _extract)\n\n\ndef create_inspector():\n    from backend.agent_framework.adapters.file_backed import FileBackedInspector\n    return FileBackedInspector(_files.get(), _inspect)\n\n\ndef run_demo():\n    import pymupdf\n    from PIL import Image\n    from backend.creative_checker.database import Base, create_engine, session_factory\n    from backend.creative_checker.models import Asset, AssetVersion, Document, Membership, Project, User, new_id\n    from backend.creative_checker.tool_records import ToolCall  # noqa: F401 — complete existing metadata\n    from backend.creative_checker.services import commit, store_file\n    from backend.creative_checker.storage import LocalStorage\n    from backend.agent_framework.adapters.project_files import CreativeCheckerCatalog, CreativeCheckerStorageReader\n    from backend.agent_framework.composition import RoleBinding, TeamConfiguration, load_config\n    from backend.agent_framework.contracts import AssetRef, Context, DocumentRef\n    from backend.agent_framework.files import VerifiedFileAccess\n    from backend.agent_framework.flow_checks import FlowCheckCase, load_flow_case, run_flow_check\n\n    with pymupdf.open() as pdf:\n        pdf.new_page().insert_text((36, 60), \"Display exactly 3 green marks.\")\n        pdf_bytes = pdf.tobytes()\n\n    def poster_bytes(count):\n        stream = BytesIO()\n        with Image.new(\"RGB\", (32, 24), \"white\") as image:\n            for x in (8, 16, 24)[:count]:\n                image.putpixel((x, 12), (49, 91, 72))\n            image.save(stream, format=\"PNG\")\n        return stream.getvalue()\n\n    engine = create_engine(\"sqlite://\")\n    try:\n        Base.metadata.create_all(engine)  # Isolated demo DB only; never product startup.\n        sessions = session_factory(engine)\n        with TemporaryDirectory(prefix=\"cc-file-flow-\") as temporary:\n            root = Path(temporary)\n            storage = LocalStorage(root / \"files\")\n            with sessions() as db:\n                user = User(id=new_id(), email=\"flow-fixture@example.test\", name=\"Flow fixture\",\n                            password_hash=\"disabled-demo-account\", active=True)\n                db.add(user); db.flush()\n                project = Project(id=new_id(), name=\"Isolated flow fixture\", created_by=user.id)\n                db.add(project); db.flush()\n                db.add(Membership(project_id=project.id, user_id=user.id, role=\"editor\"))\n                document_file = store_file(db, storage, project, user, \"requirements.pdf\", pdf_bytes, \"application/pdf\")\n                document = Document(id=new_id(), project_id=project.id, version=1,\n                    file_id=document_file.id, filename=\"requirements.pdf\", created_by=user.id)\n                asset = Asset(id=new_id(), project_id=project.id, name=\"Green marks\", kind=\"poster\", created_by=user.id)\n                db.add_all([document, asset]); db.flush()\n                versions = []\n                for index, count in enumerate((2, 3), 1):\n                    file = store_file(db, storage, project, user, f\"poster-v{index}.png\", poster_bytes(count), \"image/png\")\n                    version = AssetVersion(id=new_id(), project_id=project.id, asset_id=asset.id, version=index,\n                        file_id=file.id, filename=f\"poster-v{index}.png\", created_by=user.id,\n                        media_metadata={\"actual_mime\": \"image/png\", \"width\": 32, \"height\": 24})\n                    db.add(version); db.flush()\n                    versions.append(AssetRef(file_id=file.id, asset_version_id=version.id,\n                                             sha256=file.sha256, width=32, height=24))\n                context = Context(project_id=project.id, actor_id=user.id, run_id=\"generated-flow-1\",\n                    document_version_id=document.id, criteria_version_id=\"generated-criteria\",\n                    asset_version_id=versions[0].asset_version_id)\n                revised = context.model_copy(update={\"run_id\": \"generated-flow-2\", \"parent_run_id\": context.run_id,\n                                                     \"asset_version_id\": versions[1].asset_version_id})\n                case = FlowCheckCase(id=\"generated-file-flow\", context=context,\n                    document=DocumentRef(file_id=document_file.id, document_version_id=document.id,\n                        sha256=document_file.sha256, page_count=1), asset=versions[0],\n                    revision_context=revised, revision_asset=versions[1], expected_initial_verdict=\"fail\",\n                    change_reason=\"Generated fixture: replace two marks with three, then review the entire new version.\")\n                actor = user.id\n                commit(db)\n            access = VerifiedFileAccess(CreativeCheckerCatalog(sessions, actor), CreativeCheckerStorageReader(storage))\n            module = \"examples.agent_framework.file_flow_demo\"\n            config = TeamConfiguration(roles={\n                \"A02\": RoleBinding(kind=\"factory\", factory=f\"{module}:create_extractor\"),\n                \"A04_A05\": RoleBinding(kind=\"factory\", factory=f\"{module}:create_inspector\"),\n                \"A06\": RoleBinding(kind=\"reference\"), \"A07\": RoleBinding(kind=\"synthetic\"),\n            })\n            (root / \"config.json\").write_text(config.model_dump_json(), encoding=\"utf-8\")\n            (root / \"workflow.json\").write_text(case.model_dump_json(), encoding=\"utf-8\")\n            # Use the importable module's dependency scope even when invoked via -m.\n            import importlib\n            factories = importlib.import_module(module)\n            token = factories._files.set(access)\n            try:\n                report = run_flow_check(load_flow_case(root / \"workflow.json\"), load_config(root / \"config.json\"))\n            finally:\n                factories._files.reset(token)\n            return {\"generated_test_media\": True, \"database\": \"isolated SQLite\", \"model_calls\": 0,\n                    \"operational_database_checked\": False, \"workflow\": report,\n                    \"notice\": \"Existing storage reads and deterministic PDF/pixel fixture callbacks; no Qwen, Neo4j or authenticated human approval.\"}\n    finally:\n        engine.dispose()\n\n\nif __name__ == \"__main__\":\n    result = run_demo()\n    print(json.dumps(result, ensure_ascii=True, indent=2))\n    raise SystemExit(0 if result[\"workflow\"][\"passed\"] else 1)\n","sha256":"f02903888287d1a86a8647494f2b662a5b718e056c78a5d207476fc6a087dd28"},"examples/agent_framework/team_adapters.py":{"text":"\"\"\"Independent team-owned role factories; intentionally no real model or DB I/O.\n\nEach zero-argument factory returns one adapter, not an Agents collection. Keep\nimports and constructors free of network/database/model loading. A teammate may\ncreate a client lazily inside the role method after implementing its contract.\nInstances can be shared between runs: guard mutable state and client concurrency.\nUntil implemented, these seams raise ADAPTER_NOT_CONFIGURED and never substitute\nsynthetic fixtures. Real implementations must preserve nested synthetic flags.\n\"\"\"\nfrom __future__ import annotations\n\nfrom backend.agent_framework.adapters.templates import (\n    QwenAdapterStub,\n)\nfrom backend.agent_framework.contracts import (\n    CriteriaDraft,\n    EvidenceBundle,\n    ExtractRequest,\n    InspectRequest,\n    InspectionResult,\n    ReportDraft,\n    ReportRequest,\n)\nfrom backend.agent_framework.ports import Extractor, Inspector, Reporter, Validator\nfrom backend.agent_framework.validation import ReferenceValidator\n\n\nclass TeamPDFExtractor(QwenAdapterStub):\n    \"\"\"A02 owner: implement PDF-to-criteria extraction with source provenance.\"\"\"\n\n    def extract(self, request: ExtractRequest) -\u003e CriteriaDraft:\n        # Replace this body with your implementation; preserve the request scope.\n        return super().extract(request)\n\n\nclass TeamPosterInspector(QwenAdapterStub):\n    \"\"\"A04/A05 owner: inspect this poster version against all approved criteria.\"\"\"\n\n    def inspect(self, request: InspectRequest) -\u003e InspectionResult:\n        # Historical evidence must not be presented as current observations.\n        return super().inspect(request)\n\n\nclass TeamReportWriter(QwenAdapterStub):\n    \"\"\"A07 owner: explain the validated verdict without changing that verdict.\"\"\"\n\n    def report(self, request: ReportRequest) -\u003e ReportDraft:\n        # Preserve validated citations and limitations in the returned report.\n        return super().report(request)\n\n\ndef create_extractor() -\u003e Extractor:\n    return TeamPDFExtractor()\n\n\ndef create_inspector() -\u003e Inspector:\n    return TeamPosterInspector()\n\n\ndef create_validator() -\u003e Validator:\n    \"\"\"Reference code validation only; no model or source-authenticity proof.\"\"\"\n    return ReferenceValidator()\n\n\ndef create_reporter() -\u003e Reporter:\n    return TeamReportWriter()\n","sha256":"838016173e17eed40382fe4ea6d9025b1e8633e87b480fe4b4e2e7c5b637dc8a"},"examples/agent_framework/team_config.synthetic.json":{"text":"{\n  \"contract_version\": \"2.0.0\",\n  \"profile\": \"development\",\n  \"roles\": {\n    \"A02\": {\n      \"contract_version\": \"2.0.0\",\n      \"kind\": \"synthetic\"\n    },\n    \"A04_A05\": {\n      \"contract_version\": \"2.0.0\",\n      \"kind\": \"synthetic\"\n    },\n    \"A06\": {\n      \"contract_version\": \"2.0.0\",\n      \"kind\": \"reference\"\n    },\n    \"A07\": {\n      \"contract_version\": \"2.0.0\",\n      \"kind\": \"synthetic\"\n    }\n  }\n}\n","sha256":"3a7c5ce12457414cc4839b4c2723de856f0d3c5d88a7c153d1233d79f554f7d6"},"examples/agent_framework/team_config.template.json":{"text":"{\n  \"contract_version\": \"2.0.0\",\n  \"profile\": \"development\",\n  \"roles\": {\n    \"A02\": {\n      \"contract_version\": \"2.0.0\",\n      \"kind\": \"unconfigured\"\n    },\n    \"A04_A05\": {\n      \"contract_version\": \"2.0.0\",\n      \"kind\": \"unconfigured\"\n    },\n    \"A06\": {\n      \"contract_version\": \"2.0.0\",\n      \"kind\": \"reference\"\n    },\n    \"A07\": {\n      \"contract_version\": \"2.0.0\",\n      \"kind\": \"unconfigured\"\n    }\n  }\n}\n","sha256":"b25028abe8913cc178c36319686cfbfb5678a08d4d0f9892c031d0b5d875881f"},"examples/agent_framework/workflow.synthetic.json":{"text":"{\n  \"contract_version\": \"2.0.0\",\n  \"id\": \"synthetic-approval-rereview\",\n  \"context\": {\n    \"contract_version\": \"2.0.0\",\n    \"project_id\": \"synthetic-project\",\n    \"run_id\": \"demo-run-1\",\n    \"actor_id\": \"synthetic-reviewer\",\n    \"document_version_id\": \"document-v1\",\n    \"criteria_version_id\": \"criteria-v1\",\n    \"asset_version_id\": \"poster-v1\",\n    \"parent_run_id\": null\n  },\n  \"document\": {\n    \"contract_version\": \"2.0.0\",\n    \"file_id\": \"synthetic-pdf-reference\",\n    \"document_version_id\": \"document-v1\",\n    \"sha256\": \"dbf21f8e6c7c3af1c860ae8b58a157066944aa6feced8abb0a1d19e5b5230ce1\",\n    \"media_type\": \"application/pdf\",\n    \"page_count\": 1\n  },\n  \"asset\": {\n    \"contract_version\": \"2.0.0\",\n    \"file_id\": \"synthetic-poster-v1\",\n    \"asset_version_id\": \"poster-v1\",\n    \"sha256\": \"3cc920b3991a50e0558d753bb4429fa2ddd31ceeb3268a9c286e5d2b9c62c511\",\n    \"media_type\": \"image/png\",\n    \"width\": 1200,\n    \"height\": 1600\n  },\n  \"revision_context\": {\n    \"contract_version\": \"2.0.0\",\n    \"project_id\": \"synthetic-project\",\n    \"run_id\": \"demo-run-2\",\n    \"actor_id\": \"synthetic-reviewer\",\n    \"document_version_id\": \"document-v1\",\n    \"criteria_version_id\": \"criteria-v1\",\n    \"asset_version_id\": \"poster-v2\",\n    \"parent_run_id\": \"demo-run-1\"\n  },\n  \"revision_asset\": {\n    \"contract_version\": \"2.0.0\",\n    \"file_id\": \"synthetic-poster-v2\",\n    \"asset_version_id\": \"poster-v2\",\n    \"sha256\": \"35fce4fe4d9d1fd6d94a211cb5399c3ed15e9564b59e369ca80b921f3a07cf9f\",\n    \"media_type\": \"image/png\",\n    \"width\": 1200,\n    \"height\": 1600\n  },\n  \"expected_initial_verdict\": \"pass\",\n  \"expected_revised_verdict\": \"pass\",\n  \"change_reason\": \"합성 개발 입력: 수정 승인과 새 버전의 전체 재검수를 확인합니다.\"\n}\n","sha256":"973a61f6012eebc6a3265306fb04ead7a778826ae52154dca4fd4514b68f8a51"}}</script><script>
(() => {
  'use strict';
  const sources=JSON.parse(document.getElementById('source-data').textContent);
  const paths=Object.keys(sources), select=document.getElementById('file'), code=document.getElementById('code');
  for(const path of paths){const option=document.createElement('option');option.value=path;option.textContent=path;select.append(option);}
  const requested=new URLSearchParams(location.search).get('file'), path=requested===null?paths[0]:requested;
  if(!Object.prototype.hasOwnProperty.call(sources,path)){
    const error=document.getElementById('error');error.hidden=false;error.textContent='묶음에 포함되지 않은 파일입니다. 목록에서 파일을 선택해 주세요.';code.hidden=true;select.selectedIndex=-1;
  }else{
    select.value=path;document.getElementById('path').textContent=path;document.getElementById('hash').textContent='SHA-256 · '+sources[path].sha256;
    const lines=sources[path].text.replace(/\r\n/g,'\n').split('\n');if(lines[lines.length-1]==='')lines.pop();
    const fragment=document.createDocumentFragment();
    lines.forEach((text,index)=>{const line=document.createElement('div'),number=document.createElement('a'),content=document.createElement('span');line.id='L'+(index+1);line.className='line';number.className='number';number.href='#'+line.id;number.textContent=String(index+1);number.setAttribute('aria-label',String(index+1)+'번째 줄');content.className='text';content.textContent=text||' ';line.append(number,content);fragment.append(line);});code.append(fragment);
  }
  select.addEventListener('change',()=>{if(Object.prototype.hasOwnProperty.call(sources,select.value))location.href='source.html?file='+encodeURIComponent(select.value)+'#L1';});
  function focusLine(){for(const line of code.querySelectorAll('.selected'))line.classList.remove('selected');if(!/^#L[1-9][0-9]*$/.test(location.hash))return;const line=document.getElementById(location.hash.slice(1));if(line){line.classList.add('selected');line.scrollIntoView({block:'center'});}}
  window.addEventListener('hashchange',focusLine);requestAnimationFrame(focusLine);
})();
</script></body></html>
