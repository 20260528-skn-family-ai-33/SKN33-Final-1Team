ed=self.graph.read_projection(str(pid))\n                if observed['revision']!=revision or observed['unmanaged'] or content_hash(observed['nodes'],observed['edges'])!=content_hash(nodes,edges):\n                    raise GraphUnavailable('GRAPH_DELIVERY_NOT_CONFIRMED')\n        except Exception:\n            self.last_outcome='deferred'\n            with unit_of_work(self.engine) as c:\n                c.execute(text('UPDATE agent_framework.graph_state SET lease_token=NULL,lease_expires_at=NULL,'\n                    'attempt_no=attempt_no+1,error_json=CAST(:e AS jsonb),available_at=clock_timestamp()+'\n                    'make_interval(secs=\u003eLEAST(300,power(2,LEAST(attempt_no+1,8))::integer)) '\n                    'WHERE project_id=:p AND lease_token=:t AND lease_expires_at\u003eclock_timestamp()'),\n                    {'p':pid,'t':token,'e':'{\"code\":\"GRAPH_SYNC_UNAVAILABLE\"}'})\n            return True\n        with unit_of_work(self.engine) as c:\n            live=c.execute(text('UPDATE agent_framework.graph_state SET applied_revision=GREATEST(applied_revision,:r),'\n                'lease_token=NULL,lease_expires_at=NULL,attempt_no=0,error_json=NULL,synced_at=clock_timestamp(),'\n                'available_at=clock_timestamp() WHERE project_id=:p AND lease_token=:t '\n                'AND lease_expires_at\u003eclock_timestamp() RETURNING project_id'),{'p':pid,'t':token,'r':revision}).scalar_one_or_none()\n            if live is not None:\n                c.execute(text('UPDATE agent_framework.graph_outbox SET processed_at=clock_timestamp() '\n                    'WHERE project_id=:p AND revision\u003c=:r AND processed_at IS NULL'),{'p':pid,'r':revision})\n            self.last_outcome='synced' if live is not None else 'authority_lost'\n        return True\n\n\ndef graph_status(c,project_id):\n    row=c.execute(text('SELECT revision,applied_revision,attempt_no,error_json,synced_at '\n        'FROM agent_framework.graph_state WHERE project_id=:p'),{'p':UUID(str(project_id))}).mappings().one_or_none()\n    if row is None:return {'status':'not_projected','required_revision':0,'applied_revision':None}\n    return {'status':'error' if row['error_json'] else 'synced' if row['applied_revision']==row['revision'] else 'pending',\n        'required_revision':row['revision'],'applied_revision':row['applied_revision'],\n        'attempt_no':row['attempt_no'],'error':row['error_json'],'synced_at':row['synced_at']}\n\n\ndef criteria_impact(c,project_id,version_id,criterion_id):\n    \"\"\"Authoritative bounded relationship query; criterion IDs are version-scoped strings, not UUIDs.\"\"\"\n    from .criteria_contracts import CriteriaVersion\n    from .postgres import digest\n    pid=UUID(str(project_id));vid=UUID(str(version_id))\n    row=c.execute(text('SELECT snapshot_json,snapshot_sha256 FROM agent_framework.criteria_versions '\n        'WHERE project_id=:p AND criteria_version_id=:v'),{'p':pid,'v':vid}).mappings().one_or_none()\n    if row is None or digest(row['snapshot_json'])!=row['snapshot_sha256']:\n        raise AuthError('RESOURCE_NOT_FOUND',404)\n    version=CriteriaVersion.model_validate(row['snapshot_json'])\n    if criterion_id not in {item.criterion_id for item in version.criteria}:raise AuthError('RESOURCE_NOT_FOUND',404)\n    rows=c.execute(text(\"SELECT run_id,parent_run_id,snapshot_json-\u003e\u003e'execution_status' AS status FROM agent_framework.runs \"\n        \"WHERE project_id=:p AND (input_json-\u003e'baseline'-\u003e\u003e'criteria_version_id'=:v OR \"\n        \"snapshot_json-\u003e\u003e'approved_criteria_version_id'=:v) ORDER BY created_at,run_id LIMIT 501\"),{'p':pid,'v':str(vid)}).mappings().all()\n    ids=[r['run_id'] for r in rows[:500]]\n    approvals=c.execute(text('SELECT approval_id,run_id,decision FROM agent_framework.approvals '\n        'WHERE project_id=:p ORDER BY approved_at,approval_id'),{'p':pid}).mappings().all()\n    return {'criteria_version_id':str(vid),'criterion_id':criterion_id,'runs':[dict(r) for r in rows[:500]],\n        'approvals':[{'approval_id':str(r['approval_id']),'run_id':r['run_id'],'decision':r['decision']}\n                     for r in approvals if r['run_id'] in ids], 'truncated':len(rows)\u003e500,'backend':'postgresql'}\n","sha256":"8e765a14d507f214835f2aa587138935c5a524040df894adeabfde91b9fd3596"},"backend/agent_framework/graph_recovery.py":{"text":"\"\"\"Conservative, project-scoped recovery requests. PG business history stays sealed.\n\nConfirm the same anomaly twice, revalidate PG under its row lock, then enqueue an\nauditable AF005 outbox revision. The existing projection worker does the rebuild.\nNo PG transaction is held during Neo4j I/O, and unmanaged graph links are refused.\n\"\"\"\nfrom dataclasses import dataclass\nfrom datetime import datetime,timezone\nimport json\nfrom pathlib import Path\nimport signal\nfrom threading import Event\nfrom uuid import UUID\n\nfrom sqlalchemy import text\nfrom backend.app.persistence.database import create_app_engine\nfrom backend.app.persistence.transaction import unit_of_work\nfrom .postgres import digest\nfrom .graph_projection import project_snapshot,mark_project_changed\nfrom .graph_store import FrameworkGraph,GraphUnavailable\nfrom .graph_monitor import save_snapshot,load_snapshot\nfrom .postgres_commands import _values,_ready\n\nFORMAT='af-graph-recovery-v1'\n\n\n@dataclass(frozen=True)\nclass RecoveryPolicy:\n    confirmation_seconds:int=30\n    cooldown_seconds:int=300\n    max_per_hour:int=3\n    batch_size:int=5\n\n    def __post_init__(self):\n        if any(type(v) is not int or v\u003c1 for v in (self.confirmation_seconds,self.cooldown_seconds,self.max_per_hour,self.batch_size)):\n            raise ValueError('Invalid recovery policy')\n\n\ndef content_hash(nodes,edges):\n    return digest({'nodes':sorted(nodes,key=lambda n:n['key']),\n        'edges':sorted(edges,key=lambda e:(e['source'],e['target'],e['kind']))})\n\n\ndef validate_source(c,pid):\n    \"\"\"Only repair from internally consistent registered-document history.\"\"\"\n    docs={str(r['document_version_id']):r for r in c.execute(text('SELECT document_version_id,sha256 FROM '\n        'agent_framework.document_versions WHERE project_id=:p'),{'p':pid}).mappings()}\n    runs={r['run_id']:r for r in c.execute(text('SELECT run_id,input_json,input_sha256,snapshot_json FROM '\n        'agent_framework.runs WHERE project_id=:p'),{'p':pid}).mappings()}\n    for row in runs.values():\n        raw=row['input_json'];context=row['snapshot_json'].get('context',{});doc=raw.get('document') or {}\n        if (digest(raw)!=row['input_sha256'] or context.get('project_id')!=str(pid) or context.get('run_id')!=row['run_id']\n                or doc.get('document_version_id') not in docs or docs[doc['document_version_id']]['sha256']!=doc.get('sha256')):\n            raise ValueError('SOURCE_INTEGRITY_INVALID')\n    for row in c.execute(text('SELECT s.output_json,s.output_sha256 FROM agent_framework.steps s '\n            'JOIN agent_framework.runs r ON r.run_id=s.run_id WHERE r.project_id=:p'),{'p':pid}).mappings():\n        if row['output_json'] is not None and digest(row['output_json'])!=row['output_sha256']:\n            raise ValueError('SOURCE_INTEGRITY_INVALID')\n    versions={str(r['criteria_version_id']):r for r in c.execute(text('SELECT * FROM agent_framework.criteria_versions '\n        'WHERE project_id=:p'),{'p':pid}).mappings()}\n    for vid,row in versions.items():\n        raw=row['snapshot_json']\n        if (digest(raw)!=row['snapshot_sha256'] or digest({'actor_id':str(row['created_by']),'request':row['request_json']})!=row['request_sha256']\n                or raw.get('criteria_version_id')!=vid or raw.get('source_run_id')!=row['source_run_id']\n                or raw.get('document_sha256')!=docs[str(row['document_version_id'])]['sha256']):\n            raise ValueError('SOURCE_INTEGRITY_INVALID')\n    for row in c.execute(text('SELECT payload_json,payload_sha256 FROM agent_framework.approvals WHERE project_id=:p'),{'p':pid}).mappings():\n        if digest(row['payload_json'])!=row['payload_sha256']:raise ValueError('SOURCE_INTEGRITY_INVALID')\n    for row in c.execute(text('SELECT b.*,a.run_id AS approval_run,a.project_id AS approval_project,a.actor_id AS approval_actor,a.payload_json AS approval_payload,a.decision '\n            'FROM agent_framework.criteria_approval_bindings b JOIN agent_framework.approvals a '\n            'ON a.approval_id=b.approval_id WHERE b.project_id=:p'),{'p':pid}).mappings():\n        if (row['criteria_sha256']!=versions[str(row['criteria_version_id'])]['snapshot_sha256']\n                or digest({'actor_id':str(row['approval_actor']),'request':row['request_json']})!=row['request_sha256'] or row['approval_project']!=pid\n                or row['approval_run']!=row['source_run_id'] or row['decision']!='approve_criteria'\n                or row['approval_payload'].get('approved_criteria_version_id')!=str(row['criteria_version_id'])\n                or row['approval_payload'].get('criteria_sha256')!=row['criteria_sha256']):\n            raise ValueError('SOURCE_INTEGRITY_INVALID')\n    for row in c.execute(text('SELECT e.*,r.input_sha256 AS run_input FROM agent_framework.evidence_contexts e '\n            'JOIN agent_framework.runs r ON r.run_id=e.run_id WHERE r.project_id=:p'),{'p':pid}).mappings():\n        if digest(row['context_json'])!=row['context_sha256'] or row['input_sha256']!=row['run_input']:\n            raise ValueError('SOURCE_INTEGRITY_INVALID')\n\n\ndef authority(c,pid,*,lock=False):\n    row=c.execute(text('SELECT revision,applied_revision,lease_expires_at\u003eclock_timestamp() AS busy '\n        'FROM agent_framework.graph_state WHERE project_id=:p'+(' FOR UPDATE' if lock else '')),{'p':pid}).mappings().one_or_none()\n    if row is None:return None\n    nodes,edges=project_snapshot(c,pid)\n    return dict(row)|{'hash':content_hash(nodes,edges)}\n\n\ndef eligible(pg,observed):\n    if observed['unmanaged']:return 'manual_review','UNMANAGED_GRAPH_RELATIONSHIPS'\n    revision=observed['revision']\n    if revision is not None and revision\u003epg['revision']:return 'manual_review','GRAPH_AHEAD_OF_AUTHORITY'\n    same=content_hash(observed['nodes'],observed['edges'])==pg['hash']\n    if revision==pg['revision'] and same:return 'consistent','MATCHED'\n    if pg['revision']\u003epg['applied_revision'] and revision!=pg['revision']:\n        return 'pending','NORMAL_DELIVERY_PENDING'\n    return 'observing','PROJECTION_MISSING' if revision is None else 'PROJECTION_MISMATCH'\n\n\nclass Recovery:\n    def __init__(self,engine,graph,policy=None):self.engine,self.graph,self.policy=engine,graph,policy or RecoveryPolicy()\n\n    def inspect(self,project_id,previous=None,*,now=None):\n        now=now or datetime.now(timezone.utc);pid=UUID(str(project_id));previous=previous or {}\n        action={'project_id':str(pid)}\n        with self.engine.connect().execution_options(isolation_level='REPEATABLE READ') as c:\n            with c.begin():\n                c.execute(text('SET TRANSACTION READ ONLY'));pg=authority(c,pid)\n        if pg is None:return action|{'status':'manual_review','reason':'UNKNOWN_PROJECT'},None\n        if pg['busy']:return action|{'status':'pending','reason':'PROJECTION_LEASE_ACTIVE'},None\n        try:observed=self.graph.read_projection(str(pid))\n        except GraphUnavailable as error:return action|{'status':'unavailable','reason':error.code},None\n        status,reason=eligible(pg,observed)\n        if status!='observing':return action|{'status':status,'reason':reason},None\n        fingerprint=digest({'revision':pg['revision'],'expected':pg['hash'],\n            'observed':content_hash(observed['nodes'],observed['edges']),'graph_revision':observed['revision']})\n        candidate={'fingerprint':fingerprint,'since':now.isoformat()}\n        if previous.get('fingerprint')!=fingerprint:return action|{'status':status,'reason':reason},candidate\n        try:age=(now-datetime.fromisoformat(previous['since'])).total_seconds()\n        except (ValueError,KeyError,TypeError):age=-1\n        if age\u003cself.policy.confirmation_seconds:return action|{'status':'observing','reason':reason},previous if age\u003e=0 else candidate\n        # Recheck authority after graph I/O. The lock also serializes recovery processes.\n        with unit_of_work(self.engine) as c:\n            current=authority(c,pid,lock=True)\n            if current is None or current['revision']!=pg['revision'] or current['applied_revision']!=pg['applied_revision'] or current['hash']!=pg['hash'] or current['busy']:\n                return action|{'status':'pending','reason':'AUTHORITY_CHANGED'},None\n            budget=c.execute(text(\"SELECT count(*) FILTER(WHERE created_at\u003eclock_timestamp()-interval '1 hour') AS count,\"\n                \"EXTRACT(EPOCH FROM (clock_timestamp()-max(created_at))) AS elapsed FROM agent_framework.graph_outbox \"\n                \"WHERE project_id=:p AND kind='graph.recovery_requested'\"),{'p':pid}).mappings().one()\n            if budget['count']\u003e=self.policy.max_per_hour:return action|{'status':'manual_review','reason':'RECOVERY_RATE_LIMIT'},previous\n            if budget['elapsed'] is not None and float(budget['elapsed'])\u003cself.policy.cooldown_seconds:\n                return action|{'status':'cooldown','reason':'RECOVERY_COOLDOWN'},previous\n            try:validate_source(c,pid)\n            except (ValueError,KeyError,TypeError):return action|{'status':'manual_review','reason':'SOURCE_INTEGRITY_INVALID'},None\n            record={'project_id':str(pid),'reason':reason,'confirmed_revision':pg['revision'],\n                'expected_sha256':pg['hash'],'observed_sha256':content_hash(observed['nodes'],observed['edges'])}\n            mark_project_changed(c,pid,'graph.recovery_requested',json.dumps(record,sort_keys=True))\n        return action|{'status':'requested','reason':reason,'previous_revision':pg['revision']},None\n\n    def cycle(self,previous=None,*,now=None,project_id=None):\n        previous=previous or {};now=now or datetime.now(timezone.utc)\n        # Keyset scan across every known PG project. Unknown Neo4j projects are never enumerated.\n        cursor=previous.get('cursor')\n        try:cursor=UUID(cursor) if cursor else UUID(int=0)\n        except (ValueError,TypeError):cursor=UUID(int=0)\n        with self.engine.connect() as c:\n            if project_id is not None:\n                selected=[str(p) for p in c.execute(text('SELECT project_id FROM agent_framework.graph_state WHERE project_id=:p'),{'p':UUID(str(project_id))}).scalars()]\n            else:\n                selected=[str(p) for p in c.execute(text('SELECT project_id FROM agent_framework.graph_state '\n                    'WHERE project_id\u003e:cursor ORDER BY project_id LIMIT :limit'),{'cursor':cursor,'limit':self.policy.batch_size}).scalars()]\n                if not selected:\n                    selected=[str(p) for p in c.execute(text('SELECT project_id FROM agent_framework.graph_state '\n                        'ORDER BY project_id LIMIT :limit'),{'limit':self.policy.batch_size}).scalars()]\n        candidates=dict(previous.get('candidates',{}));issues=dict(previous.get('issues',{}));actions=[]\n        for pid in selected:\n            try:action,candidate=self.inspect(pid,candidates.get(pid),now=now)\n            except Exception:action,candidate={'project_id':pid,'status':'unavailable','reason':'RECOVERY_CHECK_UNAVAILABLE'},None\n            actions.append(action)\n            if candidate:candidates[pid]=candidate\n            else:candidates.pop(pid,None)\n            if action['status'] in ('consistent','pending'):issues.pop(pid,None)\n            else:issues[pid]=action\n        state='critical' if any(a['status']=='manual_review' for a in issues.values()) else 'warning' if issues else 'healthy'\n        return {'format':FORMAT,'observed_at':now.isoformat(),'state':state,'automatic_repair':True,\n            'policy':self.policy.__dict__,'actions':actions,'issues':issues,'candidates':candidates,\n            'cursor':selected[-1] if selected else '', 'truncated':False}\n\n\ndef recovery_command(args):\n    values,settings=_values(args.env_file,'framework-projection');engine=create_app_engine(settings)\n    graph=FrameworkGraph(values.get('CC_NEO4J_URI',''),values.get('CC_NEO4J_USER','neo4j'),values.get('CC_NEO4J_PASSWORD',''))\n    stop=Event();previous={};signature=None\n    try:\n        if _ready(engine,settings)['revision']!='AF005':raise ValueError('AF005 required')\n        if args.state_file:previous,_=load_snapshot(args.state_file,max_age=86400,expected_format=FORMAT)\n        for name in (signal.SIGINT,signal.SIGTERM):signal.signal(name,lambda *_:stop.set())\n        recovery=Recovery(engine,graph)\n        while not stop.is_set():\n            try:value=recovery.cycle(previous,project_id=args.project_id)\n            except Exception:value={'format':FORMAT,'observed_at':datetime.now(timezone.utc).isoformat(),\n                'state':'critical','automatic_repair':True,'reason':'RECOVERY_AUTHORITY_UNAVAILABLE',\n                'candidates':previous.get('candidates',{}),'issues':previous.get('issues',{})}\n            if args.state_file:save_snapshot(args.state_file,value)\n            if args.once:\n                print(json.dumps(value),flush=True);return 0 if value['state']=='healthy' else 1\n            new=json.dumps([value['state'],value.get('issues'),value.get('reason')],sort_keys=True)\n            if new!=signature:\n                print(json.dumps({'event':'framework_graph_recovery_changed','state':value['state'],\n                    'actions':value.get('actions',[]),'reason':value.get('reason')}),flush=True);signature=new\n            previous=value;stop.wait(15)\n        return 0\n    finally:graph.close();engine.dispose()\n\n\ndef recovery_status_command(args):\n    value,fresh=load_snapshot(args.state_file,max_age=args.max_age,expected_format=FORMAT)\n    print(json.dumps(value),flush=True);return 0 if fresh else 1\n","sha256":"0d0f58dc4c91bc0367621cc2d056c3502471a5725ce260272a4e57cfe2f3f7eb"},"backend/agent_framework/graph_store.py":{"text":"\"\"\"Fixed, parameterized queries over a disposable AF-only Neo4j projection.\"\"\"\nimport os\nfrom datetime import datetime, timezone\n\n\nclass GraphUnavailable(RuntimeError):\n    def __init__(self, code='GRAPH_UNAVAILABLE'):\n        self.code = code\n        super().__init__('The framework relationship projection is unavailable.')\n\n\nclass FrameworkGraph:\n    def __init__(self, uri=None, user=None, password=None):\n        self.uri = uri if uri is not None else os.environ.get('CC_NEO4J_URI', '')\n        self.user = user if user is not None else os.environ.get('CC_NEO4J_USER', 'neo4j')\n        self._password = password if password is not None else os.environ.get('CC_NEO4J_PASSWORD', '')\n        self._driver = None\n        self._schema_ready = False\n\n    def close(self):\n        if self._driver is not None:\n            self._driver.close()\n\n    def _session(self):\n        if not self.uri or not self._password:\n            raise GraphUnavailable('GRAPH_NOT_CONFIGURED')\n        if self._driver is None:\n            from neo4j import GraphDatabase\n            self._driver = GraphDatabase.driver(self.uri, auth=(self.user, self._password),\n                connection_timeout=5, connection_acquisition_timeout=5,\n                max_transaction_retry_time=5, max_connection_pool_size=4)\n        return self._driver.session(database='neo4j')\n\n    def initialize(self):\n        try:\n            with self._session() as session:\n                session.run('CREATE CONSTRAINT af_entity_identity IF NOT EXISTS '\n                    'FOR (n:AFEntity) REQUIRE (n.project_id,n.entity_key) IS UNIQUE').consume()\n                session.run('CREATE CONSTRAINT af_projection_identity IF NOT EXISTS '\n                    'FOR (n:AFProjection) REQUIRE n.project_id IS UNIQUE').consume()\n            self._schema_ready = True\n        except Exception:\n            raise GraphUnavailable() from None\n\n    def _check_schema(self):\n        if self._schema_ready:return\n        with self._session() as session:\n            row=session.run('SHOW CONSTRAINTS YIELD name WHERE name IN $names RETURN collect(name) AS names',\n                names=['af_entity_identity','af_projection_identity']).single()\n        if not row or set(row['names'])!={'af_entity_identity','af_projection_identity'}:\n            raise GraphUnavailable('GRAPH_SCHEMA_NOT_READY')\n        self._schema_ready=True\n\n    def check(self):\n        \"\"\"Authenticated, read-only schema/connectivity probe. Never initializes.\"\"\"\n        try:\n            self._check_schema()\n            with self._session() as session:\n                row=session.run('RETURN 1 AS ready').single()\n                if not row or row['ready']!=1:raise GraphUnavailable()\n        except GraphUnavailable:raise\n        except Exception:raise GraphUnavailable() from None\n\n    def projection_revisions(self,project_ids):\n        \"\"\"Bounded monitoring query; never enumerates or modifies foreign graphs.\"\"\"\n        if len(project_ids)\u003e500:raise GraphUnavailable('GRAPH_RESULT_LIMIT')\n        try:\n            from neo4j import Query\n            self._check_schema()\n            with self._session() as session:\n                rows=session.run(Query('UNWIND $ids AS id OPTIONAL MATCH(p:AFProjection {project_id:id}) '\n                    'RETURN id AS project_id,p.revision AS revision',timeout=5),ids=project_ids)\n                return {r['project_id']:r['revision'] for r in rows}\n        except GraphUnavailable:raise\n        except Exception:raise GraphUnavailable() from None\n\n    @staticmethod\n    def _unmanaged(tx,project_id):\n        row=tx.run('MATCH(n:AFEntity {project_id:$pid}) '\n            'OPTIONAL MATCH(n)-[r]-(other) '\n            'WITH n,r,other WHERE size(labels(n))\u003c\u003e1 OR '\n            '(r IS NOT NULL AND (type(r)\u003c\u003e\"AF_RELATION\" OR NOT other:AFEntity OR '\n            'other.project_id IS NULL OR other.project_id\u003c\u003e$pid)) RETURN count(*) AS count',pid=project_id).single()\n        return bool(row['count'])\n\n    def read_projection(self,project_id):\n        def read(tx):\n            root=tx.run('MATCH(p:AFProjection {project_id:$pid}) RETURN p.revision AS revision',pid=project_id).single()\n            nodes=list(tx.run('MATCH(n:AFEntity {project_id:$pid}) '\n                'RETURN n.entity_key AS key,properties(n) AS properties ORDER BY key LIMIT 10001',pid=project_id))\n            edges=list(tx.run('MATCH(a:AFEntity {project_id:$pid})-[r:AF_RELATION]-\u003e(b:AFEntity {project_id:$pid}) '\n                'RETURN a.entity_key AS source,b.entity_key AS target,r.kind AS kind '\n                'ORDER BY source,target,kind LIMIT 20001',pid=project_id))\n            if len(nodes)\u003e10000 or len(edges)\u003e20000:raise GraphUnavailable('GRAPH_RESULT_LIMIT')\n            return {'revision':root['revision'] if root else None,\n                'nodes':[{'key':r['key'],**{k:v for k,v in r['properties'].items() if k not in ('entity_key','project_id')}} for r in nodes],\n                'edges':[dict(r) for r in edges],'unmanaged':self._unmanaged(tx,project_id)}\n        try:\n            self._check_schema()\n            with self._session() as session:return session.execute_read(read)\n        except GraphUnavailable:raise\n        except Exception:raise GraphUnavailable() from None\n\n    def replace_project(self, project_id, nodes, edges, revision):\n        keys = {n['key'] for n in nodes}\n        if len(keys) != len(nodes) or any(e['source'] not in keys or e['target'] not in keys for e in edges):\n            raise ValueError('Invalid projection identities')\n        # Only our scalar properties can enter the graph; no raw model text or credentials.\n        prepared = [{'key': n['key'], 'properties': {k:v for k,v in n.items()\n            if k != 'key' and isinstance(v, (str,int,bool))}} for n in nodes]\n        def write(tx):\n            row = tx.run('MERGE (p:AFProjection {project_id:$pid}) ON CREATE SET p.revision=-1 '\n                'SET p.lock_revision=p.revision RETURN p.revision AS revision', pid=project_id).single()\n            if row['revision'] \u003e= revision:\n                return False\n            if self._unmanaged(tx,project_id):raise GraphUnavailable('GRAPH_UNMANAGED_RELATIONSHIPS')\n            tx.run('MATCH (n:AFEntity {project_id:$pid}) DETACH DELETE n',pid=project_id).consume()\n            tx.run('UNWIND $nodes AS row CREATE (n:AFEntity {project_id:$pid,entity_key:row.key}) '\n                'SET n += row.properties',pid=project_id,nodes=prepared).consume()\n            tx.run('UNWIND $edges AS e MATCH (a:AFEntity {project_id:$pid,entity_key:e.source}) '\n                'MATCH (b:AFEntity {project_id:$pid,entity_key:e.target}) '\n                'CREATE (a)-[:AF_RELATION {kind:e.kind}]-\u003e(b)',pid=project_id,edges=edges).consume()\n            tx.run('MATCH (p:AFProjection {project_id:$pid}) SET p.revision=$revision,p.synced_at=$at',\n                pid=project_id,revision=revision,at=datetime.now(timezone.utc).isoformat()).consume()\n            return True\n        try:\n            self._check_schema()\n            with self._session() as session:\n                return session.execute_write(write)\n        except GraphUnavailable:raise\n        except Exception:\n            raise GraphUnavailable() from None\n\n    def approved_sources(self, project_id, criteria_version_id):\n        def read(tx):\n            state = tx.run('MATCH (p:AFProjection {project_id:$pid}) RETURN p.revision AS revision',pid=project_id).single()\n            if state is None:\n                raise GraphUnavailable('GRAPH_NOT_PROJECTED')\n            rows = list(tx.run('MATCH (v:AFEntity {project_id:$pid,entity_key:$version,approved:true}) '\n                '-[:AF_RELATION {kind:\"contains\"}]-\u003e(c:AFEntity {project_id:$pid}) '\n                '-[:AF_RELATION {kind:\"sourced_from\"}]-\u003e(s:AFEntity {project_id:$pid}) '\n                'RETURN c.criterion_id AS criterion_id,s.entity_key AS source_key,s.source_hash AS source_hash '\n                'ORDER BY criterion_id,source_key LIMIT 1001',pid=project_id,version='criteria:'+criteria_version_id))\n            if len(rows)\u003e1000:\n                raise GraphUnavailable('GRAPH_RESULT_LIMIT')\n            runs=list(tx.run('MATCH (r:AFEntity {project_id:$pid,kind:\"run\"}) '\n                '-[:AF_RELATION {kind:\"applies\"}]-\u003e(:AFEntity {project_id:$pid,entity_key:$version}) '\n                'RETURN r.entity_key AS key ORDER BY key LIMIT 501',pid=project_id,version='criteria:'+criteria_version_id))\n            run_keys=[row['key'] for row in runs[:500]]\n            approvals=list(tx.run('MATCH (a:AFEntity {project_id:$pid,kind:\"approval\"}) '\n                '-[:AF_RELATION {kind:\"approves\"}]-\u003e(r:AFEntity {project_id:$pid,kind:\"run\"}) '\n                'WHERE r.entity_key IN $keys RETURN DISTINCT a.entity_key AS key ORDER BY key LIMIT 1001',\n                pid=project_id,keys=run_keys))\n            return {'revision':state['revision'],'sources':[dict(row) for row in rows],\n                'relations':{'run_ids':[key.removeprefix('run:') for key in run_keys],\n                    'approval_ids':[row['key'].removeprefix('approval:') for row in approvals[:1000]],\n                    'truncated':len(runs)\u003e500 or len(approvals)\u003e1000}}\n        try:\n            self._check_schema()\n            with self._session() as session:\n                return session.execute_read(read)\n        except GraphUnavailable:\n            raise\n        except Exception:\n            raise GraphUnavailable() from None\n","sha256":"b3e65efaa92d7df9f45953649e1424261b9dcea1087e5a9ebff52bee0b61fcf1"},"backend/agent_framework/human_review.py":{"text":"\"\"\"Human observations supplement a completed review; machine evidence stays immutable.\"\"\"\n\nHUMAN_REVIEW_ISSUES=frozenset({\n    'typed_attribute_review_required','qualifier_interpretation_required','normalized_value_review_required',\n    'date_comparison_review_required','uncertain_observation','missing_observation','unreadable_observation',\n    'observation_status_unknown','observation_not_checked','model_review','verdict_conflict',\n    'numeric_observation_invalid','unit_mismatch',\n})\n\n\ndef can_review(issues):\n    return bool(issues) and set(issues)\u003c=HUMAN_REVIEW_ISSUES\n\n\ndef validate_human_reviews(state,approval):\n    items={item.criterion_id:item for item in state.validated.items}\n    if approval.human_reviews:\n        if state.context.asset_version_id is None or state.evidence is None or state.evidence.status!='complete':\n            raise ValueError('human review requires the exact asset and complete criterion evidence')\n        for review in approval.human_reviews:\n            item=items.get(review.criterion_id)\n            if item is None or item.verdict!='review' or not can_review(item.issues):\n                raise ValueError('human review cannot override a confirmed verdict or unresolved criterion evidence')\n            if not any(e.kind=='current_requirement' and item.criterion_id in e.criterion_ids for e in state.evidence.evidence):\n                raise ValueError('human review requires current requirement evidence')\n    if approval.decision=='approve_final':\n        required=[item for item in items.values() if item.required]\n        passed={r.criterion_id for r in approval.human_reviews if r.verdict=='pass'}\n        if (not required or any(item.verdict=='fail' for item in required)\n                or any(r.verdict=='fail' for r in approval.human_reviews)\n                or any(item.verdict=='review' and item.criterion_id not in passed for item in required)):\n            raise ValueError('final approval requires a pass or evidenced human review of every pending required item')\n","sha256":"57aefe849f70921df7a3b0bc14c970d51f1ae86f634abd36c555f4693b0b95ca"},"backend/agent_framework/invocation.py":{"text":"\"\"\"One synchronous contract boundary for standalone roles and workflow stages.\n\nInputs and outputs are copied and revalidated. Providers receive no mutable\nreference to the caller's data or the baseline used for scope validation.\n\"\"\"\nfrom __future__ import annotations\n\nimport inspect\nimport re\nfrom typing import Any\n\nfrom pydantic import BaseModel\n\nfrom .contracts import (\n    CriteriaDraft, ExtractRequest, InspectionResult,\n    InspectRequest, ReportDraft, ReportRequest,\n    ValidateRequest, ValidatedResult,\n)\nfrom .ports import AdapterFailure\nfrom .validation import (\n    _criteria, ensure_context, validate_draft,\n    validate_inspection, validate_report, validate_report_request, validate_validated,\n)\n\n\nROLE_CONTRACTS = {\n    \"A02\": (\"extractor\", \"extract\", ExtractRequest, CriteriaDraft),\n    \"A04_A05\": (\"inspector\", \"inspect\", InspectRequest, InspectionResult),\n    \"A06\": (\"validator\", \"validate\", ValidateRequest, ValidatedResult),\n    \"A07\": (\"reporter\", \"report\", ReportRequest, ReportDraft),\n}\n\n\nclass InvocationFailure(AdapterFailure):\n    \"\"\"A shared boundary rejection, distinguished from provider failures.\"\"\"\n\n\ndef _reject(code: str, message: str) -\u003e None:\n    raise InvocationFailure(code, message)\n\n\ndef _contract(contract: type[BaseModel], value: Any) -\u003e BaseModel:\n    try:\n        if isinstance(value, BaseModel):\n            if not isinstance(value, contract):\n                _reject(\"CONTRACT_INVALID\", \"The value has an unexpected contract type.\")\n            # model_construct/model_copy and even frozen nested models can be\n            # modified without validation, so no incoming BaseModel is trusted.\n            value = value.model_dump(mode=\"python\", warnings=False)\n        return contract.model_validate(value).model_copy(deep=True)\n    except InvocationFailure:\n        raise\n    except (ValueError, TypeError):\n        _reject(\"CONTRACT_INVALID\", \"The value does not match the versioned JSON contract.\")\n\n\ndef _synthetic(value: Any) -\u003e bool:\n    if isinstance(value, dict):\n        return value.get(\"synthetic\") is True or any(_synthetic(item) for item in value.values())\n    if isinstance(value, (list, tuple)):\n        return any(_synthetic(item) for item in value)\n    return False\n\n\ndef _input_policy(role: str, request: BaseModel) -\u003e None:\n    if role == \"A02\":\n        if request.document.document_version_id != request.context.document_version_id:\n            raise ValueError(\"DOCUMENT_VERSION_MISMATCH\")\n    elif role in {\"A04_A05\", \"A06\"}:\n        inspection_request = InspectRequest(context=request.context, criteria=request.criteria,\n            asset=request.asset, evidence=request.evidence, synthetic=request.synthetic)\n        # Empty observations are permitted for A04/A05; this still validates\n        # criteria, approved provenance and the current asset before any call.\n        inspection = (request.inspection if role == \"A06\" else\n                      InspectionResult(context=request.context, observations=()))\n        validate_inspection(inspection_request, inspection)\n    else:\n        validate_report_request(request)\n\n\ndef _output_policy(role: str, request: BaseModel, result: BaseModel) -\u003e None:\n    ensure_context(request.context, result)\n    if role == \"A02\":\n        validate_draft(request.context, request.document, result)\n    else:\n        {\"A04_A05\": validate_inspection,\n         \"A06\": validate_validated, \"A07\": validate_report}[role](request, result)\n\n\ndef _policy(check, *args) -\u003e None:\n    try:\n        check(*args)\n    except ValueError as exc:\n        code = str(exc).split(\":\", 1)[0]\n        if not re.fullmatch(r\"[A-Z][A-Z0-9_]{1,80}\", code):\n            code = \"BOUNDARY_INVALID\"\n        _reject(code, \"The role violates the shared scope, evidence, or verdict policy.\")\n\n\ndef accept_role_output(role: str, request: Any, raw: Any, *, require_synthetic: bool = False) -\u003e BaseModel:\n    \"\"\"Validate an already returned result without invoking any provider again.\"\"\"\n    if role not in ROLE_CONTRACTS:\n        _reject(\"INVALID_ROLE\", \"The selected role is not part of the shared contract.\")\n    _port,_method,request_type,result_type=ROLE_CONTRACTS[role]\n    expected=_contract(request_type,request)\n    _policy(_input_policy,role,expected)\n    result=_contract(result_type,raw)\n    if require_synthetic and not result.synthetic:\n        _reject(\"SYNTHETIC_LABEL_MISSING\", \"Fixture output must explicitly identify itself as synthetic.\")\n    if _synthetic(expected.model_dump(mode=\"python\")) and not result.synthetic:\n        result=result.model_copy(update={\"synthetic\":True},deep=True)\n    _policy(_output_policy,role,expected,result)\n    return result.model_copy(deep=True)\n\n\ndef invoke_role(role: str, adapter: Any, request: Any, *, require_synthetic: bool = False) -\u003e BaseModel:\n    \"\"\"Invoke one role once, validating both sides against an isolated baseline.\n\nThe adapter must expose the synchronous method named by ROLE_CONTRACTS. Raw\ndictionary responses are supported; another role's BaseModel is not. No retry,\nfallback, network request, or persistence is performed by this boundary.\n\"\"\"\n    if role not in ROLE_CONTRACTS:\n        _reject(\"INVALID_ROLE\", \"The selected role is not part of the shared contract.\")\n    _port_name, method_name, request_type, result_type = ROLE_CONTRACTS[role]\n    expected = _contract(request_type, request)\n    _policy(_input_policy, role, expected)\n    method = getattr(adapter, method_name, None)\n    if not callable(method):\n        _reject(\"ADAPTER_NOT_IMPLEMENTED\", \"The selected role does not implement its port.\")\n    if (inspect.iscoroutinefunction(method) or inspect.isasyncgenfunction(method)\n            or inspect.iscoroutinefunction(getattr(method, \"__call__\", None))\n            or inspect.isasyncgenfunction(getattr(method, \"__call__\", None))):\n        _reject(\"ASYNC_ADAPTER_UNSUPPORTED\", \"Role adapters must implement synchronous methods.\")\n    raw = method(expected.model_copy(deep=True))\n    if inspect.isawaitable(raw) or inspect.isasyncgen(raw):\n        # A synchronous wrapper can still return a coroutine. Close native\n        # coroutine objects without starting them or creating a hidden loop.\n        if inspect.iscoroutine(raw):\n            raw.close()\n        _reject(\"ASYNC_ADAPTER_UNSUPPORTED\", \"Role adapters must return a completed synchronous result.\")\n    return accept_role_output(role,expected,raw,require_synthetic=require_synthetic)\n","sha256":"c350cbd6af3410c6a34ee8450aadf80e5b787c1aefec630678e05d7ed2972063"},"backend/agent_framework/mcp_server.py":{"text":"\"\"\"Development MCP tools over the in-memory Workflow; approvals are never exposed.\n\nAgents and MCP clients may read run state and submit admission/rereview commands.\nEvery state transition is still checked by Workflow. Human approval decisions\nstay on the HTTP API, so a model can never approve criteria, changes or finals.\nPostgresStore binding needs a service subject/authorization design and is follow-up.\n\"\"\"\nfrom __future__ import annotations\n\nimport asyncio\nfrom datetime import timedelta\nimport hmac\nimport inspect\nimport json\nimport os\nfrom typing import Any\n\nimport httpx\nfrom pydantic import ValidationError\n\nfrom .contracts import AssetRef, Context, DocumentRef, RunSnapshot\nfrom .runtime import Workflow\n\nTOOL_NAMES = ('get_run', 'get_steps', 'get_approval_history', 'start_run', 'request_rereview')\n\n\ndef overview(snapshot: RunSnapshot) -\u003e dict:\n    \"\"\"Compact run view for model context: no source quotes, hashes or file bytes.\"\"\"\n    criteria = snapshot.criteria.criteria if snapshot.criteria else ()\n    return {\n        'run_id': snapshot.context.run_id, 'parent_run_id': snapshot.context.parent_run_id,\n        'project_id': snapshot.context.project_id, 'asset_version_id': snapshot.context.asset_version_id,\n        'execution_status': snapshot.execution_status, 'machine_verdict': snapshot.machine_verdict,\n        'human_decision': snapshot.human_decision, 'synthetic': snapshot.synthetic,\n        'criteria': [{'criterion_id': c.criterion_id, 'text': c.text, 'required': c.required} for c in criteria],\n        'validated_items': [{'criterion_id': i.criterion_id, 'verdict': i.verdict, 'issues': list(i.issues)}\n                            for i in (snapshot.validated.items if snapshot.validated else ())],\n        'report': snapshot.report and {'summary': snapshot.report.summary,\n                                       'change_requests': list(snapshot.report.change_requests)},\n        'approvals': [a.decision for a in snapshot.approvals],\n        'stages': list(snapshot.stages),\n        'error': snapshot.error and {'code': snapshot.error.code, 'message': snapshot.error.message},\n    }\n\n\ndef _failed(code: str, message: str) -\u003e dict:\n    return {'state': 'failed', 'error': {'code': code, 'message': message}}\n\n\nclass FrameworkTools:\n    \"\"\"Named tool capabilities; also usable in-process as a tool client.\"\"\"\n\n    def __init__(self, workflow: Workflow):\n        self.workflow = workflow\n\n    def get_run(self, run_id: str) -\u003e dict:\n        \"\"\"Compact run state: status, verdicts, report and approval decisions.\"\"\"\n        return overview(self.workflow.get(run_id))\n\n    def get_steps(self, run_id: str) -\u003e dict:\n        \"\"\"Role step records (A02, A04_A05, A06, A07) without source text.\"\"\"\n        return self.workflow.get_steps(run_id).model_dump(mode='json')\n\n    def get_approval_history(self, run_id: str) -\u003e list:\n        \"\"\"Recorded human approval decisions for a run (read only).\"\"\"\n        return [{'decision': a.decision, 'actor_id': a.actor_id, 'reason': a.reason,\n                 'criterion_ids': list(a.criterion_ids)} for a in self.workflow.get(run_id).approvals]\n\n    def start_run(self, context: dict, document: dict, asset: dict) -\u003e dict:\n        \"\"\"Admit a new run; Workflow validates versions and run uniqueness.\"\"\"\n        return overview(self.workflow.start(Context.model_validate(context), DocumentRef.model_validate(document),\n                                            AssetRef.model_validate(asset)))\n\n    def request_rereview(self, parent_run_id: str, context: dict, asset: dict) -\u003e dict:\n        \"\"\"Create a child run after an approved change request and a new asset version.\"\"\"\n        return overview(self.workflow.rereview(parent_run_id, Context.model_validate(context),\n                                               AssetRef.model_validate(asset)))\n\n    def call(self, name: str, arguments: dict) -\u003e dict:\n        \"\"\"Receipt boundary shared by MCP and in-process callers.\"\"\"\n        if name not in TOOL_NAMES:\n            return _failed('UNKNOWN_TOOL', 'This tool is not exposed.')\n        try:\n            return {'state': 'completed', 'result': getattr(self, name)(**arguments)}\n        except TypeError:\n            return _failed('INVALID_ARGUMENTS', 'Tool arguments do not match the tool signature.')\n        except KeyError:\n            return _failed('RUN_NOT_FOUND', 'The run does not exist in this runtime.')\n        except ValidationError:\n            return _failed('INVALID_INPUT', 'Tool input does not match the framework contract.')\n        except ValueError as exc:\n            # Workflow conflict messages are framework-authored, never provider text.\n            return _failed('WORKFLOW_CONFLICT', str(exc))\n\n\nclass BearerMiddleware:\n    def __init__(self, app, token: str):\n        self.app, self.token = app, token\n\n    async def __call__(self, scope, receive, send):\n        if scope['type'] == 'http':\n            supplied = dict(scope.get('headers', [])).get(b'authorization', b'')\n            if not hmac.compare_digest(supplied, b'Bearer ' + self.token.encode()):\n                from starlette.responses import JSONResponse\n                await JSONResponse({'error': 'unauthorized'}, status_code=401)(scope, receive, send)\n                return\n        await self.app(scope, receive, send)\n\n\ndef _receipt_tool(tools: FrameworkTools, name: str):\n    \"\"\"MCP tool with the method's signature and docstring that returns a receipt.\"\"\"\n    method = getattr(tools, name)\n\n    def tool(**arguments) -\u003e dict:\n        return tools.call(name, arguments)\n    tool.__signature__ = inspect.signature(method).replace(return_annotation=dict)\n    tool.__doc__ = method.__doc__\n    return tool\n\n\ndef create_mcp_app(workflow: Workflow, *, token: str, host: str = '127.0.0.1'):\n    from mcp.server.fastmcp import FastMCP\n    from mcp.server.transport_security import TransportSecuritySettings\n\n    if not isinstance(token, str) or len(token) \u003c 32:\n        raise ValueError('MCP token must contain at least 32 characters')\n    server = FastMCP('creative-checker-agent-framework', stateless_http=True, json_response=True,\n        transport_security=TransportSecuritySettings(allowed_hosts=[host, f'{host}:*', '127.0.0.1', '127.0.0.1:*',\n                                                                     'localhost', 'localhost:*'], allowed_origins=[]))\n    tools = FrameworkTools(workflow)\n    for name in TOOL_NAMES:\n        server.add_tool(_receipt_tool(tools, name), name=name)\n    return BearerMiddleware(server.streamable_http_app(), token)\n\n\ndef create_development_app():\n    \"\"\"uvicorn factory: synthetic adapters, memory state, loopback only.\"\"\"\n    from .adapters.synthetic import make_agents\n    return create_mcp_app(Workflow(make_agents()), token=os.environ.get('AGENT_FRAMEWORK_MCP_TOKEN', ''))\n\n\nclass McpToolError(RuntimeError):\n    \"\"\"The MCP server reported a tool exception or no result; a write's outcome is unknown.\"\"\"\n\n\nasync def call_tool(url: str, token: str, name: str, arguments: dict, *, timeout: float = 60) -\u003e dict:\n    from mcp import ClientSession\n    from mcp.client.streamable_http import streamable_http_client\n\n    async with httpx.AsyncClient(headers={'Authorization': f'Bearer {token}'}, follow_redirects=False,\n                                 timeout=httpx.Timeout(timeout, connect=10)) as http:\n        async with streamable_http_client(url, http_client=http) as (read, write, _):\n            async with ClientSession(read, write, read_timeout_seconds=timedelta(seconds=timeout)) as session:\n                await session.initialize()\n                response = await session.call_tool(name, arguments)\n    # Interpret after the sessions close; raising inside them wraps the error in ExceptionGroups.\n    # isError means the tool raised, possibly after a write was applied.\n    if not response.isError:\n        if response.structuredContent is not None:\n            return response.structuredContent\n        for content in response.content:\n            if content.type == 'text':\n                return json.loads(content.text)\n    raise McpToolError('MCP tool raised or returned no result; the outcome is unknown.')\n\n\nclass McpToolClient:\n    \"\"\"Synchronous tool client for agents. Transport errors propagate to the agent loop.\"\"\"\n\n    def __init__(self, url: str, token: str, *, timeout: float = 60):\n        self.url, self.token, self.timeout = url, token, timeout\n\n    def call(self, name: str, arguments: dict[str, Any]) -\u003e dict:\n        try:\n            return asyncio.run(call_tool(self.url, self.token, name, arguments, timeout=self.timeout))\n        except BaseExceptionGroup as group:\n            # anyio task groups wrap transport errors (e.g. a 401); surface a single cause.\n            error: BaseException = group\n            while isinstance(error, BaseExceptionGroup) and len(error.exceptions) == 1:\n                error = error.exceptions[0]\n            raise error if error is not group else group from None\n","sha256":"8cc01e27f6185f6651a97a6a8cf2508ad1cb2e6bd1db53850ae5adabd0e5eb26"},"backend/agent_framework/my_tasks.py":{"text":"\"\"\"Owner-scoped queue controls and reversible, append-only history visibility.\n\nAF001–AF005 are shared with older workers: cancellation uses the existing failed\nterminal state plus USER_CANCELLED, exposed as cancelled by this view. No schema\nchange, deletion, retry, approval or model call is performed here.\n\"\"\"\nfrom pydantic import StrictBool\nfrom sqlalchemy import select, exists, func, and_, or_\n\nfrom backend.app.persistence.transaction import unit_of_work\nfrom backend.app.security.errors import AuthError\nfrom backend.app.services.business import table\nfrom .contracts import Contract, FrameworkError, RunSnapshot\nfrom .postgres import runs, jobs, events\n\nCANCELLED = 'USER_CANCELLED'\nFINISHED = ('completed', 'failed')\nVISIBILITY_EVENT = 'history.visibility_changed'\n\n\nclass HistoryVisibility(Contract):\n    hidden: StrictBool\n\n\nclass MyTasks:\n    def __init__(self, store):\n        self.store = store\n\n    @staticmethod\n    def _hidden(actor_id):\n        latest = (select(events.c.metadata_json['hidden'].as_boolean())\n                  .where(events.c.run_id == runs.c.run_id,\n                         events.c.kind == VISIBILITY_EVENT,\n                         events.c.metadata_json['actor_id'].as_string() == str(actor_id))\n                  .order_by(events.c.recorded_at.desc(), events.c.event_id.desc()).limit(1)\n                  .correlate(runs).scalar_subquery())\n        return func.coalesce(latest, False)\n\n    def list(self, subject, *, visibility='visible', limit=30, before=None):\n        members, projects = table('project_members'), table('projects')\n        hidden = self._hidden(subject.user_id)\n        pending = exists(select(jobs.c.job_id).where(jobs.c.run_id == runs.c.run_id,\n                         jobs.c.state.in_(('queued', 'running')))).correlate(runs)\n        queued = exists(select(jobs.c.job_id).where(jobs.c.run_id == runs.c.run_id,\n                        jobs.c.state == 'queued')).correlate(runs)\n        query = (select(runs.c.run_id, runs.c.project_id, runs.c.snapshot_json,\n                        runs.c.created_at, projects.c.name.label('project_name'),\n                        members.c.role, hidden.label('hidden'), pending.label('pending'),\n                        queued.label('queued'))\n                 .join(projects, projects.c.project_id == runs.c.project_id)\n                 .join(members, and_(members.c.project_id == runs.c.project_id,\n                                    members.c.user_id == subject.user_id))\n                 .where(runs.c.actor_id == subject.user_id, members.c.is_active,\n                        members.c.role.in_(('owner', 'editor', 'viewer'))))\n        with unit_of_work(self.store.engine) as c:\n            self.store.authorization.identity(c, subject, developer_allowed=False)\n            if before:\n                anchor = c.execute(query.where(runs.c.run_id == before)).mappings().one_or_none()\n                if anchor is None:\n                    raise AuthError('FRAMEWORK_TASK_CURSOR_INVALID', 422)\n                query = query.where(or_(runs.c.created_at \u003c anchor['created_at'],\n                    and_(runs.c.created_at == anchor['created_at'], runs.c.run_id \u003c before)))\n            if visibility != 'all':\n                query = query.where(hidden == (visibility == 'hidden'))\n            rows = c.execute(query.order_by(runs.c.created_at.desc(), runs.c.run_id.desc())\n                             .limit(limit + 1)).mappings().all()\n            items = []\n            for row in rows[:limit]:\n                snapshot = row['snapshot_json']\n                code = (snapshot.get('error') or {}).get('code')\n                state = 'cancelled' if code == CANCELLED else snapshot['execution_status']\n                items.append(dict(run_id=row['run_id'], project_id=str(row['project_id']),\n                    project_name=row['project_name'], created_at=row['created_at'].isoformat(),\n                    state=state, kind='poster' if snapshot.get('baseline') else 'document',\n                    error_code=code, hidden=row['hidden'],\n                    can_cancel=row['queued'] and snapshot['execution_status'] == 'queued'\n                               and row['role'] in ('owner', 'editor'),\n                    can_hide=not row['pending'] and snapshot['execution_status'] in FINISHED))\n            return dict(items=items, has_more=len(rows) \u003e limit,\n                        next_cursor=items[-1]['run_id'] if len(rows) \u003e limit else None)\n\n    def _owned_locked(self, c, subject, run_id, *, write):\n        row = self.store._row(c, run_id)\n        # Do not disclose someone else's run even to another project owner.\n        if row['actor_id'] != subject.user_id:\n            raise AuthError('FRAMEWORK_RUN_NOT_FOUND', 404)\n        project = table('projects')\n        # Same project -\u003e run -\u003e job lock order as claim_next and recovery.\n        c.execute(select(project.c.project_id).where(project.c.project_id == row['project_id'])\n                  .with_for_update(key_share=True))\n        self.store.authorization.project(c, subject, row['project_id'],\n                                         action='write' if write else 'read', allow_archived=True)\n        return self.store._row(c, run_id, lock=True)\n\n    def cancel(self, subject, run_id):\n        from .durable_worker import PostgresQueue\n        with unit_of_work(self.store.engine) as c:\n            row = self._owned_locked(c, subject, run_id, write=True)\n            snapshot = RunSnapshot.model_validate(row['snapshot_json'])\n            if snapshot.error and snapshot.error.code == CANCELLED:\n                return snapshot  # Idempotent retry after a lost HTTP response.\n            active = c.execute(select(jobs).where(jobs.c.run_id == run_id,\n                               jobs.c.state.in_(('queued', 'running'))).with_for_update()).mappings().all()\n            if (snapshot.execution_status != 'queued' or len(active) != 1\n                    or active[0]['state'] != 'queued'\n                    or any(step.status == 'running' for step in snapshot.step_records)):\n                raise AuthError('FRAMEWORK_TASK_NOT_QUEUED', 409)\n            PostgresQueue(self.store)._close(c, row, dict(active[0]),\n                FrameworkError(code=CANCELLED, message='요청자가 대기 작업을 취소했습니다.'))\n            self.store.event(c, run_id, 'job.cancelled', actor_id=str(subject.user_id),\n                             phase=active[0]['phase'])\n            return RunSnapshot.model_validate(self.store._row(c, run_id)['snapshot_json'])\n\n    def visibility(self, subject, run_id, hidden):\n        with unit_of_work(self.store.engine) as c:\n            row = self._owned_locked(c, subject, run_id, write=False)\n            active = c.execute(select(jobs.c.job_id).where(jobs.c.run_id == run_id,\n                               jobs.c.state.in_(('queued', 'running')))).first()\n            if hidden and (active or row['snapshot_json']['execution_status'] not in FINISHED):\n                raise AuthError('FRAMEWORK_TASK_NOT_FINISHED', 409)\n            current = c.execute(select(self._hidden(subject.user_id)).select_from(runs)\n                                .where(runs.c.run_id == run_id)).scalar_one()\n            if current != hidden:\n                self.store.event(c, run_id, VISIBILITY_EVENT, actor_id=str(subject.user_id), hidden=hidden)\n            return dict(run_id=run_id, hidden=hidden)\n","sha256":"bec9fdbb423e8e3d338b8009f78145b7bbf3ce6ef3fbb8f6d4ca6a89fb2ee6b0"},"backend/agent_framework/ports.py":{"text":"\"\"\"Implement these interfaces without importing another agent's internals or ORM.\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import Protocol, TYPE_CHECKING\n\nfrom .contracts import (CriteriaDraft, ExtractRequest, InspectRequest,\n                        InspectionResult, ReportDraft, ReportRequest,\n                        ValidateRequest, ValidatedResult)\nfrom .contracts import Context, DocumentRef, AssetRef\n\nif TYPE_CHECKING:\n    from .files import VerifiedDocument, VerifiedPoster\n\n\nclass FileAccess(Protocol):\n    def read_document(self, context: Context, reference: DocumentRef) -\u003e VerifiedDocument: ...\n    def read_asset(self, context: Context, reference: AssetRef) -\u003e VerifiedPoster: ...\n\n\nclass Extractor(Protocol):\n    def extract(self, request: ExtractRequest) -\u003e CriteriaDraft: ...\n\n\nclass Inspector(Protocol):\n    def inspect(self, request: InspectRequest) -\u003e InspectionResult: ...\n\n\nclass Validator(Protocol):\n    def validate(self, request: ValidateRequest) -\u003e ValidatedResult: ...\n\n\nclass Reporter(Protocol):\n    def report(self, request: ReportRequest) -\u003e ReportDraft: ...\n\n\n@dataclass(frozen=True)\nclass Agents:\n    extractor: Extractor\n    inspector: Inspector\n    validator: Validator\n    reporter: Reporter\n\n\nclass AdapterFailure(Exception):\n    \"\"\"Safe, structured adapter error. An ambiguous remote call is never retried here.\"\"\"\n    def __init__(self, code: str, message: str, *, retryable=False, outcome_unknown=False):\n        super().__init__(message)\n        self.code, self.message = code, message\n        self.retryable, self.outcome_unknown = retryable, outcome_unknown\n","sha256":"f08368d001f382857c3650f950665167a731cec075751342f97d4fbbcca01831"},"backend/agent_framework/poster_review.py":{"text":"\"\"\"Bind approved criteria to existing M008 poster files, never caller observations.\n\nThe first poster and each revision require a fresh explicit criteria confirmation.\nNo source approval or final decision is copied to a new poster run.\n\"\"\"\nimport importlib\nimport inspect\nfrom uuid import UUID,uuid5,NAMESPACE_URL\nfrom datetime import datetime,timezone\n\nfrom sqlalchemy import select\n\nfrom backend.app.persistence.transaction import unit_of_work\nfrom backend.app.security.errors import AuthError\nfrom backend.app.services.business import table\nfrom backend.app.storage.local import LocalStorage,StorageError,key\nfrom .contracts import (Contract,Hash,AssetRef,Context,DocumentRef,ApprovedBaseline,CriteriaDraft,\n    RunSnapshot,StepRecord,ReportDraft)\nfrom .criteria_review import PostgresCriteriaReview\nfrom .adapters.project_files import LegacyStorageReader\nfrom .files import StoredFileMetadata,VerifiedFileAccess\nfrom .context import freeze_approved_context\nfrom .ports import AdapterFailure\nfrom .postgres import runs,coordinator,payload,digest\n\n\nclass PosterReviewRequest(Contract):\n    criteria_version_id: UUID\n    expected_criteria_sha256: Hash\n    asset_version_id: UUID\n\n\ndef open_poster_storage(root):\n    storage=LocalStorage(root)\n    try:\n        try:\n            with storage.read('framework-pdf-marker'):raise StorageError('POSTER_ROOT_MUST_NOT_BE_PDF')\n        except FileNotFoundError:pass\n        storage.start(shared=True)\n        return storage\n    except BaseException:\n        storage.close();raise\n\n\ndef poster_metadata(c,pid,version_id):\n    images=table('asset_versions');files=table('stored_files')\n    image=c.execute(select(images).where(images.c.project_id==pid,images.c.asset_version_id==version_id)).mappings().one_or_none()\n    if image is None:raise AuthError('RESOURCE_NOT_FOUND',404)\n    file=c.execute(select(files).where(files.c.project_id==pid,files.c.file_id==image['display_file_id'])).mappings().one_or_none()\n    if (file is None or file['state']!='stored' or file['storage_backend']!='local' or file['file_role']!='display_image'\n            or file['parent_file_id']!=image['original_file_id'] or file['detected_mime']!='image/png'\n            or file['storage_key']!=key(pid,file['file_id'])):\n        raise AuthError('POSTER_FILE_UNAVAILABLE',503)\n    reference=AssetRef(file_id=str(file['file_id']),asset_version_id=str(version_id),sha256=file['sha256'],\n        media_type='image/png',width=image['display_width'],height=image['display_height'])\n    metadata=StoredFileMetadata(file_id=reference.file_id,project_id=str(pid),version_id=str(version_id),kind='poster',\n        storage_key=file['storage_key'],media_type=reference.media_type,byte_size=file['byte_size'],sha256=reference.sha256,\n        width=reference.width,height=reference.height,coordinate_space='display')\n    return reference,metadata\n\n\nclass _PosterCatalog:\n    def __init__(self,store,subject=None):self.store,self.subject=store,subject\n    def lookup_asset(self,context,reference):\n        if context.asset_version_id!=reference.asset_version_id:raise AdapterFailure('FILE_REFERENCE_MISMATCH','Poster version differs.')\n        with unit_of_work(self.store.engine) as c:\n            if self.subject is None:self.store.worker_access(c,UUID(context.project_id),UUID(context.actor_id))\n            else:self.store._access(c,self.subject,context,write=False)\n            expected,metadata=poster_metadata(c,UUID(context.project_id),UUID(context.asset_version_id))\n            if expected!=reference:raise AdapterFailure('FILE_REFERENCE_MISMATCH','Poster metadata differs.')\n            return metadata\n\n\ndef read_registered_poster(store,storage,context,reference,subject=None):\n    return VerifiedFileAccess(_PosterCatalog(store,subject),LegacyStorageReader(storage)).read_asset(context,reference)\n\n\ndef validate_pinned_review(store,c,row):\n    fixed=row['input_json'];raw=fixed.get('baseline')\n    if raw is None:return\n    baseline=ApprovedBaseline.model_validate(raw);snapshot=RunSnapshot.model_validate(row['snapshot_json'])\n    if (snapshot.baseline!=baseline or snapshot.criteria is None or fixed['context']!=payload(snapshot.context)):\n        raise AuthError('POSTER_BASELINE_MISMATCH',409)\n    source=store._row(c,baseline.source_run_id);source_snapshot=RunSnapshot.model_validate(source['snapshot_json'])\n    if source['project_id']!=row['project_id'] or source['actor_id']!=row['actor_id']:\n        raise AuthError('POSTER_BASELINE_MISMATCH',409)\n    service=PostgresCriteriaReview(store)\n    approved=service._approved(c,baseline.source_run_id)\n    version=approved.criteria.version\n    service._source(c,source,source_snapshot,require_current_runtime=False)\n    doc=DocumentRef.model_validate(fixed['document']);asset=AssetRef.model_validate(fixed['asset'])\n    if (str(version.criteria_version_id)!=baseline.criteria_version_id or approved.criteria.sha256!=baseline.criteria_sha256\n            or str(approved.approval_id)!=baseline.approval_id or version.document_sha256!=baseline.document_sha256\n            or source_snapshot.approved_criteria_version_id!=baseline.criteria_version_id\n            or snapshot.context.criteria_version_id!=baseline.criteria_version_id\n            or snapshot.context.document_version_id!=version.context.document_version_id\n            or doc.document_version_id!=version.context.document_version_id or doc.sha256!=baseline.document_sha256\n            or snapshot.criteria.context!=snapshot.context or snapshot.criteria.criteria!=version.criteria\n            or snapshot.context.asset_version_id!=asset.asset_version_id\n            or (approved.synthetic and not snapshot.synthetic)):\n        raise AuthError('POSTER_BASELINE_MISMATCH',409)\n    expected,_=poster_metadata(c,row['project_id'],UUID(asset.asset_version_id))\n    if expected!=asset:raise AuthError('POSTER_ASSET_MISMATCH',409)\n    if snapshot.evidence is not None:\n        expected_evidence=freeze_approved_context(snapshot.context,version.criteria,synthetic=snapshot.evidence.synthetic)\n        if snapshot.evidence.context_id.startswith('rag-'):\n            from .evidence_context import check_stored\n            check_stored(c,row,snapshot,expected_evidence)\n            return\n        if snapshot.evidence!=expected_evidence or (approved.synthetic and not snapshot.evidence.synthetic):\n            raise AuthError('POSTER_BASELINE_MISMATCH',409)\n\n\nclass PostgresPosterReviews:\n    def __init__(self,store,criteria_review,poster_storage):\n        self.store,self.criteria,self.storage=store,criteria_review,poster_storage\n\n    def preflight(self,subject,run_id):\n        with unit_of_work(self.store.engine) as c:\n            row=self.store._row(c,run_id);snapshot=RunSnapshot.model_validate(row['snapshot_json'])\n            self.store._access(c,subject,snapshot.context)\n\n    @staticmethod\n    def _pin(approved):\n        return ApprovedBaseline(source_run_id=approved.criteria.version.source_run_id,\n            criteria_version_id=str(approved.criteria.version.criteria_version_id),criteria_sha256=approved.criteria.sha256,\n            approval_id=str(approved.approval_id),document_sha256=approved.criteria.version.document_sha256)\n\n    @staticmethod\n    def _check_request(approved,request):\n        if (str(request.criteria_version_id)!=str(approved.criteria.version.criteria_version_id)\n                or request.expected_criteria_sha256!=approved.criteria.sha256):raise AuthError('CRITERIA_VERSION_CONFLICT',409)\n\n    def _verify_files(self,subject,source_id,request):\n        self.criteria._verify_file(subject,source_id)\n        approved=self.criteria.approved(subject,source_id);self._check_request(approved,request)\n        with unit_of_work(self.store.engine) as c:\n            context=approved.criteria.version.context\n            self.store._access(c,subject,context)\n            reference,_=poster_metadata(c,UUID(context.project_id),request.asset_version_id)\n        context=context.model_copy(update={'asset_version_id':reference.asset_version_id})\n        read_registered_poster(self.store,self.storage,context,reference,subject)\n\n    def create(self,subject,source_run_id,request_key,request,*,parent_run_id=None):\n        request=PosterReviewRequest.model_validate(request.model_dump(mode='python'))\n        self.preflight(subject,parent_run_id or source_run_id)\n        self._verify_files(subject,source_run_id,request)\n        with unit_of_work(self.store.engine) as c:\n            source,source_snapshot=self.criteria._open(c,subject,source_run_id,write=True)\n            approved=self.criteria._approved(c,source_run_id);self._check_request(approved,request)\n            self.criteria._source(c,source,source_snapshot,require_current_runtime=False)\n            baseline=self._pin(approved);version=approved.criteria.version\n            asset,_=poster_metadata(c,source['project_id'],request.asset_version_id)\n            document=DocumentRef.model_validate(source['input_json']['document'])\n            run_id=str(uuid5(NAMESPACE_URL,'creative-checker-poster:'+(parent_run_id or source_run_id)+':'+str(request_key)))\n            context=Context(project_id=str(source['project_id']),actor_id=str(subject.user_id),run_id=run_id,\n                document_version_id=document.document_version_id,criteria_version_id=baseline.criteria_version_id,\n                asset_version_id=asset.asset_version_id,parent_run_id=parent_run_id)\n            fixed={'context':payload(context),'document':payload(document),'asset':payload(asset),'baseline':payload(baseline)}\n            old=c.execute(select(runs).where(runs.c.run_id==run_id)).mappings().one_or_none()\n            if old is not None:\n                if (old['input_sha256']!=digest(fixed) or old['configuration_sha256']!=self.store.config_hash\n                        or old['runtime_sha256']!=self.store.runtime_hash):raise AuthError('FRAMEWORK_IDEMPOTENCY_CONFLICT',409)\n                validate_pinned_review(self.store,c,old)\n                return RunSnapshot.model_validate(old['snapshot_json'])\n            if parent_run_id:\n                parent=self.store._row(c,parent_run_id,lock=True)\n                self.store._access(c,subject,RunSnapshot.model_validate(parent['snapshot_json']).context)\n                validate_pinned_review(self.store,c,parent)\n                if parent['input_json'].get('baseline')!=payload(baseline):raise AuthError('POSTER_BASELINE_MISMATCH',409)\n                if c.execute(select(runs.c.run_id).where(runs.c.parent_run_id==parent_run_id)).first():\n                    raise AuthError('FRAMEWORK_REVISION_CONFLICT',409)\n                parent_snapshot=RunSnapshot.model_validate(parent['snapshot_json'])\n                if parent_snapshot.execution_status!='waiting_revision' or parent_snapshot.human_decision!='changes_approved':\n                    raise AuthError('POSTER_CHANGE_APPROVAL_REQUIRED',409)\n                if context.asset_version_id==parent_snapshot.context.asset_version_id:\n                    raise AuthError('POSTER_NEW_ASSET_REQUIRED',409)\n                flow=self.store._restore(parent)\n                snapshot=flow.rereview(parent_run_id,context,asset)\n            else:\n                draft=CriteriaDraft(context=context,criteria=version.criteria,synthetic=approved.synthetic,\n                    warnings=('Approved version reused; a fresh poster-input confirmation is required.',))\n                snapshot=RunSnapshot(context=context,profile=self.store.configuration.profile,synthetic=approved.synthetic,\n                    execution_status='waiting_criteria',criteria=draft,baseline=baseline,stages=('A01','A02_approved_version_reused'),\n                    step_records=(StepRecord(ordinal=1,role='A02',status='reused',recorded_at=datetime.now(timezone.utc),\n                        source_run_id=source_run_id,synthetic=approved.synthetic),))\n            self.store._create(c,snapshot,document,asset)\n            self.store.event(c,source_run_id,'poster.review_created',poster_run_id=run_id,criteria_sha256=baseline.criteria_sha256)\n            return snapshot\n\n    def revise(self,subject,parent_id,request_key,request):\n        with unit_of_work(self.store.engine) as c:\n            parent=self.store._row(c,parent_id);snapshot=RunSnapshot.model_validate(parent['snapshot_json'])\n            self.store._access(c,subject,snapshot.context)\n            if snapshot.baseline is None:raise AuthError('POSTER_BASELINE_REQUIRED',409)\n        return self.create(subject,snapshot.baseline.source_run_id,request_key,request,parent_run_id=parent_id)\n\n\ndef build_poster_callback(reference):\n    try:\n        from .composition import _asynchronous\n        module,name=reference.split(':',1);factory=getattr(importlib.import_module(module),name)\n        if not callable(factory) or _asynchronous(factory):raise ValueError()\n        inspect.signature(factory).bind();callback=factory();method=getattr(callback,'inspect_poster',None)\n        if inspect.isclass(callback) or not callable(method) or _asynchronous(method):raise ValueError()\n        inspect.signature(method).bind(object(),object())\n        return callback\n    except Exception:raise AdapterFailure('POSTER_FACTORY_INVALID','The trusted factory must implement synchronous inspect_poster(request, poster).') from None\n\n\nclass RegisteredPosterInspector:\n    def __init__(self,store,poster_storage,read_pdf,callback):\n        self.store,self.storage,self.read_pdf,self.callback=store,poster_storage,read_pdf,callback\n    def inspect(self,request):\n        from .contracts import ExtractRequest\n        with unit_of_work(self.store.engine) as c:\n            row=self.store._row(c,request.context.run_id)\n            if row['input_json'].get('baseline') is None:\n                raise AdapterFailure('POSTER_BASELINE_REQUIRED','Registered poster inspection requires an approved version binding.')\n            validate_pinned_review(self.store,c,row)\n            document=DocumentRef.model_validate(row['input_json']['document'])\n        pdf_request=ExtractRequest(context=request.context,document=document,synthetic=request.synthetic)\n        self.read_pdf(pdf_request)\n        poster=read_registered_poster(self.store,self.storage,request.context,request.asset)\n        result=self.callback.inspect_poster(request,poster)\n        # A provider can be slow. Recheck stored bytes after it returns, outside\n        # transactions, so a changed file cannot produce a successful stage.\n        self.read_pdf(pdf_request)\n        read_registered_poster(self.store,self.storage,request.context,request.asset)\n        return result\n\n\nclass GroundedReporter:\n    def report(self,request):\n        items=request.validated.items\n        return ReportDraft(context=request.context,verdict=request.validated.verdict,\n            summary='검증된 기계 판정: '+request.validated.verdict+'. 조건 '+str(len(items))+'개. 실제 사람의 최종 승인은 별도입니다.',\n            evidence_ids=tuple(e.evidence_id for e in request.evidence.evidence),\n            change_requests=tuple(item.criterion_id+': '+', '.join(item.issues) for item in items if item.verdict!='pass'),\n            synthetic=request.synthetic or request.validated.synthetic or request.evidence.synthetic)\n\n\ndef make_reporter():return GroundedReporter()\n","sha256":"3edeb72c9cc74a7adc27a018abbdfa745e0b900931acf822d629b88d70637fae"},"backend/agent_framework/postgres.py":{"text":"\"\"\"M008-backed authenticated command service and durable job/step repository.\n\nUses the existing app Engine, unit_of_work and Authorization. No connection,\nmigration, credentials, model client or worker is opened by construction/import.\n\"\"\"\nfrom datetime import timedelta\nfrom hashlib import sha256\nimport json\nfrom pathlib import Path\nfrom uuid import UUID, uuid4,uuid5,NAMESPACE_URL\n\nfrom sqlalchemy import Column, Integer, MetaData, String, Table, select, insert, update, func\nfrom sqlalchemy.dialects.postgresql import JSONB, TIMESTAMP, UUID as PGUUID\n\nfrom backend.app.persistence.transaction import unit_of_work\nfrom backend.app.security.errors import AuthError\nfrom backend.app.services.business import table as business_table\nfrom .contracts import Approval, AssetRef, Context, DocumentRef, RunSnapshot, StepTimeline\nfrom .composition import TeamConfiguration\nfrom .ports import Agents\nfrom .runtime import Workflow, _boundary\n\nmetadata = MetaData(schema='agent_framework')\ndef _table(name, columns):\n    return Table(name, metadata, *(Column(key, kind) for key, kind in columns))\n\nruns = _table('runs', [('run_id',String),('project_id',PGUUID(as_uuid=True)),('actor_id',PGUUID(as_uuid=True)),\n    ('parent_run_id',String),('input_json',JSONB),('input_sha256',String),('configuration_json',JSONB),\n    ('configuration_sha256',String),('runtime_sha256',String),('snapshot_json',JSONB),\n    ('created_at',TIMESTAMP(timezone=True)),('updated_at',TIMESTAMP(timezone=True))])\njobs = _table('jobs', [('job_id',PGUUID(as_uuid=True)),('run_id',String),('project_id',PGUUID(as_uuid=True)),\n    ('phase',String),('state',String),('attempt_no',Integer),('worker_token',PGUUID(as_uuid=True)),\n    ('lease_expires_at',TIMESTAMP(timezone=True)),('heartbeat_at',TIMESTAMP(timezone=True)),\n    ('created_at',TIMESTAMP(timezone=True)),('finished_at',TIMESTAMP(timezone=True)),('error_json',JSONB)])\nsteps = _table('steps', [('run_id',String),('ordinal',Integer),('role',String),('state',String),\n    ('record_json',JSONB),('input_sha256',String),('output_json',JSONB),('output_sha256',String)])\napprovals = _table('approvals', [('approval_id',PGUUID(as_uuid=True)),('run_id',String),('project_id',PGUUID(as_uuid=True)),\n    ('actor_id',PGUUID(as_uuid=True)),('decision',String),('payload_json',JSONB),('payload_sha256',String),\n    ('approved_at',TIMESTAMP(timezone=True))])\nevents = _table('events', [('event_id',PGUUID(as_uuid=True)),('run_id',String),('kind',String),\n    ('metadata_json',JSONB),('recorded_at',TIMESTAMP(timezone=True))])\n\n\ndef payload(value):\n    return value.model_dump(mode='json')\n\n\ndef digest(value):\n    if hasattr(value,'model_dump'): value = payload(value)\n    return sha256(json.dumps(value,sort_keys=True,ensure_ascii=False,separators=(',',':'),\n                             allow_nan=False).encode()).hexdigest()\n\n\ndef runtime_revision():\n    \"\"\"Pin common execution code; team factories must document their own model revisions.\"\"\"\n    root = Path(__file__).parent\n    return sha256(b''.join(p.relative_to(root).as_posix().encode()+b'\\0'+p.read_bytes()\n                          for p in sorted(root.rglob('*.py')))).hexdigest()\n\n\ndef coordinator():\n    # The state-transition path is shared with the memory demo. Deferred commands\n    # must never call a model inside a database transaction.\n    class NoCall:\n        def rejected(self,*_): raise RuntimeError('Adapters execute only in a framework worker')\n        extract = inspect = validate = report = rejected\n    adapter = NoCall()\n    return Workflow(Agents(adapter,adapter,adapter,adapter))\n\n\nclass PostgresStore:\n    def __init__(self, engine, configuration, authorization=None):\n        self.engine = engine\n        self.configuration = TeamConfiguration.model_validate(configuration.model_dump(mode='python',warnings=False))\n        self.config_hash = digest(self.configuration)\n        self.runtime_hash = runtime_revision()\n        self.authorization = authorization\n\n    def event(self,c,run_id,kind,**metadata):\n        c.execute(insert(events).values(event_id=uuid4(),run_id=run_id,kind=kind,metadata_json=metadata))\n        from .graph_projection import GRAPH_EVENTS,mark_project_changed\n        if kind in GRAPH_EVENTS:\n            pid=c.execute(select(runs.c.project_id).where(runs.c.run_id==run_id)).scalar_one()\n            mark_project_changed(c,pid,kind,run_id)\n\n    def _access(self,c,subject,context,*,write=True):\n        if self.authorization is None: raise AuthError('AUTHENTICATION_REQUIRED',401)\n        if write and str(getattr(subject,'user_id','')) != context.actor_id:\n            raise AuthError('FRAMEWORK_ACTOR_MISMATCH',403)\n        try: pid=UUID(context.project_id); UUID(context.actor_id)\n        except ValueError: raise AuthError('FRAMEWORK_UUID_REQUIRED',422) from None\n        self.authorization.project(c,subject,pid,action='write' if write else 'read')\n\n    @staticmethod\n    def _row(c,run_id,*,lock=False):\n        query=select(runs).where(runs.c.run_id==run_id)\n        row=c.execute(query.with_for_update() if lock else query).mappings().one_or_none()\n        if row is None:raise AuthError('FRAMEWORK_RUN_NOT_FOUND',404)\n        return dict(row)\n\n    def _save(self,c,snapshot):\n        # Revalidate even internally copied snapshots before the durable boundary.\n        snapshot=_boundary(RunSnapshot,snapshot)\n        c.execute(update(runs).where(runs.c.run_id==snapshot.context.run_id).values(\n            snapshot_json=payload(snapshot),updated_at=func.clock_timestamp()))\n\n    def _job(self,c,snapshot,phase):\n        c.execute(insert(jobs).values(job_id=uuid4(),run_id=snapshot.context.run_id,\n            project_id=UUID(snapshot.context.project_id),phase=phase,state='queued',attempt_no=0))\n        self.event(c,snapshot.context.run_id,'job.queued',phase=phase)\n\n    def _create(self,c,snapshot,document,asset,*,phase=None):\n        fixed={'context':payload(snapshot.context),'document':payload(document),'asset':payload(asset) if asset else None}\n        if snapshot.baseline is not None:fixed['baseline']=payload(snapshot.baseline)\n        c.execute(insert(runs).values(run_id=snapshot.context.run_id,project_id=UUID(snapshot.context.project_id),\n            actor_id=UUID(snapshot.context.actor_id),parent_run_id=snapshot.context.parent_run_id,\n            input_json=fixed,input_sha256=digest(fixed),configuration_json=payload(self.configuration),\n            configuration_sha256=self.config_hash,runtime_sha256=self.runtime_hash,snapshot_json=payload(snapshot)))\n        for record in snapshot.step_records:\n            c.execute(insert(steps).values(run_id=snapshot.context.run_id,ordinal=record.ordinal,role=record.role,\n                state=record.status,record_json=payload(record),input_sha256=digest(snapshot.criteria)))\n        self.event(c,snapshot.context.run_id,'run.created',parent_run_id=snapshot.context.parent_run_id)\n        if phase:self._job(c,snapshot,phase)\n\n    def _restore(self,row):\n        flow=coordinator();flow.profile=row['snapshot_json']['profile']\n        flow.restore(RunSnapshot.model_validate(row['snapshot_json']),\n            DocumentRef.model_validate(row['input_json']['document']),\n            AssetRef.model_validate(row['input_json']['asset']) if row['input_json']['asset'] else None)\n        return flow\n\n    def start(self,subject,context,document,asset):\n        context,document=_boundary(Context,context),_boundary(DocumentRef,document)\n        asset=_boundary(AssetRef,asset) if asset is not None else None\n        if asset is not None and self.configuration.roles['A04_A05'].kind=='registered_poster':\n            raise AuthError('USE_POSTER_REVIEW_ENDPOINT',409)\n        fixed={'context':payload(context),'document':payload(document),'asset':payload(asset) if asset else None}\n        with unit_of_work(self.engine) as c:\n            self._access(c,subject,context)\n            # Project locking serializes same-project admission and UUID collisions.\n            old=c.execute(select(runs).where(runs.c.run_id==context.run_id)).mappings().one_or_none()\n            if old:\n                if (old['project_id']!=UUID(context.project_id) or old['input_sha256']!=digest(fixed)\n                        or old['configuration_sha256']!=self.config_hash or old['
