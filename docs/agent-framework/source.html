gent_framework/team_config.synthetic.json\n.venv/bin/python -m backend.agent_framework role A03 --input examples/agent_framework/A03.json --config examples/agent_framework/team_config.synthetic.json\n.venv/bin/python -m backend.agent_framework serve --config examples/agent_framework/team_config.synthetic.json --port 8012\n```\n\nWindows PowerShell의 같은 역할 실행 예:\n\n```powershell\n.\\.venv\\Scripts\\python.exe -m backend.agent_framework role A03 --input examples/agent_framework/A03.json --config examples/agent_framework/team_config.synthetic.json\n```\n\n- `doctor`는 JSON 구문·계약·역할 구성을 검사하고 선언 내용을 출력한다. 설정된 모듈을 import하거나 factory·역할 메서드를 호출하지 않는다. 파일명에 적은 모듈의 존재, 실제 메서드, 모델·DB 연결은 검증하지 않는다.\n- `role --config`는 선택한 역할만 생성하고 호출한다. 다른 역할의 factory는 import·실행하지 않으므로 팀원은 자기 역할만 독립 개발할 수 있다. 공통 호출 경계에서 CLI와 실행기에 같은 요청·응답 검증을 적용한다. 요청 안의 조건·근거·관측 등 중첩 데이터가 합성이면 전체 결과에도 합성 표시가 전파된다.\n- `serve --config`는 같은 설정 파일로 다섯 역할을 조합해 개발 API를 연다. 서버 시작만으로 검수 실행·승인을 만들지 않는다. `127.0.0.1`, 단일 worker, 인증 없음, 메모리 저장 범위이며 종료하면 실행 기록이 사라진다. 구성 조회는 `GET /api/framework/v1/configuration`에서 선언과 초기화 상태를 구분해 확인한다. `connection_verified: false`는 실제 외부 연결을 검증하지 않았다는 뜻이다.\n\n팀 연결을 시작할 때는 `team_config.template.json`을 복사하고 담당 역할만 `factory`로 바꾼다. 합성 구성은 개발 테스트를 위해 명시적으로 선택하며 미구현 역할의 자동 대체용이 아니다. 실제 연결에 필요한 비밀정보는 팀의 별도 설정 방식으로 관리하고 공유 JSON에 넣지 않는다.\n\n### factory와 어댑터 구현 경계\n\nfactory 모듈 import와 생성자는 연결 정보만 준비하고 네트워크·DB 접속·모델 로드를 하지 않도록 작성한다. 클라이언트가 필요하면 역할 메서드에서 처음 사용할 때 생성한다. `doctor`는 개발 코드를 실행하지 않지만 `role`과 `serve`는 신뢰된 로컬 factory 코드를 실행한다. 사용자 작성 factory의 부작용까지 공통 프레임워크가 차단하는 것은 아니다.\n\n서버의 어댑터 인스턴스는 여러 실행이 공유할 수 있다. 지연 생성 클라이언트와 변경 가능한 상태의 동시 접근, 모델 호출 제한, timeout, 오류 분류는 역할 담당자가 관리한다. 실제 호출 결과가 불명확하면 `AdapterFailure(..., outcome_unknown=True)`로 보고하며 합성 성공이나 자동 재호출로 바꾸지 않는다.\n\n검사 대상 버전·인용·기계 판정·사람 승인은 기존 계약을 그대로 유지한다. 중첩 합성 표시가 없는 출력, 메서드 존재, 설정 초기화 성공만으로 실제 추론·검색·영속 저장·제품 통합 완료를 주장하지 않는다.\n\n## 역할별 계약 검사 묶음 실행\n\n`check`는 팀원이 연결한 역할 하나에 여러 요청 예제를 순서대로 넣고, 공통 계약 검증과 기대 결과를 비교한다. `doctor`는 설정만 검사하고, `role`은 단건 출력을 반환하며, `check`는 **검사 묶음의 요약 보고서**를 반환한다. 설정 파일의 다른 역할은 초기화하지 않는다.\n\nmacOS에서 A06의 통과·불합격·확인 필요·오래된 검색·검색 불가 예제 다섯 개를 검사한다.\n\n```sh\n.venv/bin/python -m backend.agent_framework check A06 --config examples/agent_framework/team_config.synthetic.json --cases examples/agent_framework/checks/A06.suite.json\n```\n\nWindows PowerShell:\n\n```powershell\n.\\.venv\\Scripts\\python.exe -m backend.agent_framework check A06 --config examples/agent_framework/team_config.synthetic.json --cases examples/agent_framework/checks/A06.suite.json\n```\n\n자기 역할을 연결할 때는 `team_config.template.json`을 복사해 해당 역할의 factory를 지정하고, `checks/A03.suite.json` 같은 예제 묶음을 복사해 실제 개발 입력으로 바꾼다. **기본 fixture의 PDF·포스터는 합성 참조이므로 실제 미디어 파일을 읽는 어댑터의 실행 입력으로 사용할 수 없다.** 파일·모델·DB 접근은 연결한 어댑터가 수행하며, 프레임워크는 대신 접속하거나 성공 결과로 대체하지 않는다.\n\n묶음 파일 형식:\n\n```json\n{\n  \"contract_version\": \"1.0.0\",\n  \"role\": \"A06\",\n  \"cases\": [\n    {\"id\": \"normal\", \"input\": \"inputs/normal.json\", \"expected_verdict\": \"pass\"},\n    {\"id\": \"violation\", \"input\": \"inputs/violation.json\", \"expected_verdict\": \"fail\"},\n    {\"id\": \"wrong-scope\", \"input\": \"inputs/wrong-scope.json\", \"expected_error\": \"CONTEXT_MISMATCH\"}\n  ]\n}\n```\n\n- 입력 경로는 실행 위치가 아닌 **묶음 JSON 파일이 있는 폴더 기준**이다. `/` 구분자를 사용하며 절대 경로·Windows 드라이브 경로는 넣지 않는다. UTF-8 BOM도 읽는다.\n- 케이스 ID는 중복 없이 1–100개다. 전체 입력 파일의 JSON·요청 스키마를 먼저 확인한 뒤 선택한 factory를 한 번 생성한다. 잘못된 JSON·누락 파일은 `expected_error`로 성공 처리할 수 없다.\n- 기대값을 생략하면 공통 계약을 통과한 출력을 기대한다. A06·A07에만 `expected_verdict`를 지정할 수 있다. 정상적인 `fail`·`review` 출력은 어댑터 오류가 아니다.\n- `expected_error`는 구조화된 `AdapterFailure` 또는 공통 호출 경계의 정확한 오류 코드와 비교한다. 임의 예외의 상세 메시지는 보고서에 내보내지 않으며 정상적인 기대 오류로도 처리하지 않는다.\n- 각 케이스는 한 번만 호출한다. `retryable=true`여도 재호출하지 않는다. `outcome_unknown=true`이면 해당 케이스는 실패하고 남은 케이스는 `skipped`로 남긴다.\n- 보고서에는 사례별 통과/실패/건너뜀, 입력 파일 해시, 계약을 통과한 출력의 해시·합성 표시·판정 또는 검색 상태를 남긴다. 원문·프롬프트·모델 출력 전체는 포함하지 않는다.\n- 최상위 `passed`는 선언한 기대와의 일치 여부다. `summary.contract_outputs_checked`는 실제로 계약 검증을 통과한 출력 수이며, 예상한 오류만 확인한 경우에는 0일 수 있다. 실제 모델 정확도·근거 진위·DB 연결·승인 검증을 뜻하지 않는다.\n- 종료 코드는 모두 기대 일치 `0`, 불일치/역할 실패/결과 불명 `1`, 입력·설정 오류 `2`다. `--output \u003c파일\u003e`은 실패 결과도 보고서로 저장한다. 입력 확인·초기화 실패 때는 기존 보고서를 유지하며, 설정·묶음·입력 파일 자체를 출력으로 덮어쓸 수 없다.\n\n기본 제공 묶음은 A02 2개, A03 2개, A04/A05 2개, A06 5개, A07 6개로 총 17개 사례다. 범위가 잘못된 입력 거부도 포함한다. 묶음과 스키마는 `python -m scripts.export_agent_framework`로 재생성하며, 검사 스키마만 확인하려면 `python -m backend.agent_framework schema --include-checks`를 사용한다.\n\nA07 단독 호출도 근거의 프로젝트·현재 문서·예외 산출물 범위, 인용 해시, 중복 ID, 검색 revision 모순을 보고서 어댑터 호출 전에 검사한다. `ReportRequest`에는 전체 조건 원문·필수 여부·현재 관측이 없으므로 A06의 전체 판단을 다시 검증하지 않는다. 실제 원문 진위·권한·예외 승인 유효성은 각 실서비스 구현의 책임이다.\n\n## 기존 저장소의 PDF·포스터 읽기\n\n`ports.FileAccess`는 `read_document(context, DocumentRef)`와 `read_asset(context, AssetRef)`를 제공한다. 구현인 `VerifiedFileAccess`에는 **권한·버전 메타데이터 조회 카탈로그**와 **기존 저장소 바이트 리더**를 주입한다. 새로운 업로드 디렉터리, 운영 테이블 또는 마이그레이션을 만들지 않는다. 생성자는 I/O를 수행하지 않는다.\n\n| 기존 경로 | 재사용하는 정보·코드 | 지원 범위 |\n|---|---|---|\n| `backend/creative_checker` | `cc_documents`, `cc_asset_versions`, `cc_files`, `object_access/project_access`, 기존 `LocalStorage/S3Storage.read` | PDF와 PNG/JPEG/WebP 포스터 |\n| `backend/app` M008 | `asset_versions`, `stored_files`, `Authorization.resource`, 기존 `LocalStorage.verified` | 포스터 원본 또는 표시 이미지 |\n\nM008의 PDF 추출 API는 PDF 바이트를 추출기에 전달하지만 문서 버전·파일로 보존하는 경로가 아니다. 따라서 `LegacyPosterCatalog.lookup_document`는 `FILE_SOURCE_UNSUPPORTED`로 거부한다. 별도 `creative_checker` 경로의 PDF 기록을 M008 기록으로 가장하거나 두 DB의 ID를 임의로 연결하지 않는다.\n\n재구축 경로 연결 예:\n\n```python\nfrom backend.agent_framework.files import VerifiedFileAccess\nfrom backend.agent_framework.adapters.project_files import (\n    CreativeCheckerCatalog, CreativeCheckerStorageReader,\n)\nfrom backend.agent_framework.adapters.file_backed import FileBackedExtractor, FileBackedInspector\n\n# 기존 앱이 소유한 sessions, storage, 인증이 확인된 identity를 주입한다.\nfiles = VerifiedFileAccess(\n    CreativeCheckerCatalog(sessions, actor_id=authenticated_user.id),\n    CreativeCheckerStorageReader(storage),\n)\nextractor = FileBackedExtractor(files, extract_with_qwen)\ninspector = FileBackedInspector(files, inspect_with_qwen)\n```\n\n`extract_with_qwen(request, verified_document)`와 `inspect_with_qwen(request, verified_poster)`는 담당자가 구현할 동기 콜백이다. 검증된 `.content` 바이트를 사용하고 기존 `CriteriaDraft`·`InspectionResult`를 반환한다. 파일 읽기·검증이 실패하면 콜백은 호출되지 않는다. 기존 `invoke_role`, CLI `role/check`, Workflow의 응답·출처 검증은 그대로 적용된다. 파일을 읽었다는 이유로 `synthetic` 표시를 지우지 않는다.\n\nM008에서 기존 인증 주체·권한 서비스·engine·storage를 이미 갖고 있다면 다음을 주입한다.\n\n```python\nfrom backend.agent_framework.adapters.project_files import LegacyPosterCatalog, LegacyStorageReader\n\nfiles = VerifiedFileAccess(\n    LegacyPosterCatalog(engine, authorization, subject, developer_allowed=False),\n    LegacyStorageReader(storage),\n)\n```\n\n`Context.actor_id`는 요청 필드이며 로그인 증거가 아니다. 카탈로그는 외부에서 인증한 주체를 바인딩하고 요청 주체 일치와 현재 계정·프로젝트 접근을 확인한다. 재구축 연결부의 `actor_id` 주입은 세션 인증을 새로 수행하지 않으므로 **인증된 API/worker 호출 경계에서 생성**해야 한다. 서로 다른 사용자에게 하나의 고정 사용자 카탈로그를 공유하지 않는다. 프레임워크의 인증 없는 개발 API에 운영 파일 접근을 자동으로 마운트하지 않는다.\n\n버전·파일 매핑:\n\n- PDF의 `document_version_id`는 `cc_documents.id`다. 정수 `version`이나 `file_id`와 다르며 해당 행의 `file_id`와 요청 파일이 일치해야 한다. `page_count`는 실제 PDF로 검사한다.\n- 재구축 포스터의 `asset_version_id`는 `cc_asset_versions.id`다. 치수는 기존 `media_metadata`와 동일하게 EXIF 방향 적용 후 값을 사용한다.\n- M008의 `asset_version_id`는 `asset_versions.asset_version_id`다. 원본 `file_id`는 원본 해시·MIME·원본 치수를, 표시 `file_id`는 표시 PNG 해시·치수를 사용한다. 두 표현을 섞지 않는다.\n- `VerifiedPoster.coordinate_space`는 `encoded`(저장 바이트의 픽셀 방향) 또는 `display`(EXIF 적용 방향)다. `encoded_width/encoded_height`, `exif_orientation`도 제공한다. `.content`는 변환하지 않은 원본 바이트이며 출력 좌표가 display라면 소비 모델도 같은 EXIF 방향을 적용해야 한다.\n\n검증 순서는 요청 계약·문맥 → 현재 접근 권한 → 프로젝트·파일·버전 연결 → 저장된 MIME·크기·해시·치수 → 실제 바이트 크기와 SHA-256 → PDF/이미지 해독 및 페이지·치수 비교다. 인용문 해시가 아닌 **파일 전체 바이트의 SHA-256**을 비교한다. 실패 시 `AdapterFailure`로 종료하며 경로·원문·공급자 예외 메시지를 노출하지 않는다.\n\n기본 한도는 PDF 20MiB·50페이지, 포스터 40MiB·1,000만 픽셀·한 변 8,192px이다. 포스터 40MiB는 기존 M008의 정규화 표시 PNG 한도를 수용하며 기존 업로드 제한을 완화하는 설정이 아니다. 암호화 PDF, 다중 프레임 이미지, 형식 위조, 해시·크기·페이지·치수 불일치는 거부한다. `FileLimits`로 호출자에게 더 작은 한도를 적용할 수 있다.\n\n### 실제 파일 바이트로 확인하는 독립 예제\n\nmacOS:\n\n```sh\n.venv/bin/python -m examples.agent_framework.file_access_demo\n```\n\nWindows PowerShell:\n\n```powershell\n.\\.venv\\Scripts\\python.exe -m examples.agent_framework.file_access_demo\n```\n\n이 예제는 생성한 실제 PDF·PNG를 **기존 `services.store_file`과 `LocalStorage`**에 저장하고, 격리된 메모리 SQLite의 기존 모델로 연결한 뒤 파일 접근 포트로 읽는다. 정상 해시·페이지·치수를 확인하고 잘못된 해시 참조를 거부한다. 임시 저장소는 실행 후 정리된다. 사용자 파일·운영 DB·`.env`를 읽거나 변경하지 않고, Qwen·Neo4j를 호출하지 않는다. 생성 파일과 테스트 사용자이므로 결과를 실모델 평가·제품 인증 검증으로 해석하지 않는다.\n\nM008의 기존 로컬 저장소는 POSIX 디렉터리 기능을 사용하므로 해당 저장소 실행은 macOS/Linux 대상이다. Windows용 새 저장소를 만들지 않았으며, Windows에서는 재구축의 기존 LocalStorage 기반 예제를 사용한다. 실제 Windows 실행은 별도 검증 대상이다.\n","sha256":"fe9df5839ba823259922ae5990e0c7420dff4ef9eb16f9296074d79e9e3b4ee9"},"docs/agent-framework/graphify-out/GRAPH_REPORT.md":{"text":"# Creative Checker — Graphify AST audit\n\n\u003e **Static code relationships only.** This graph does not demonstrate real Qwen execution,\n\u003e PostgreSQL/Neo4j connectivity, durable workers, or production deployment.\n\u003e The separate clickable business flow is a curated workflow illustration, not this AST graph.\n\n- Tool: official `graphifyy==0.9.100`; directed build, community detection and native HTML exporter.\n- Corpus: **19 Python files**, 11,180 words, exclusively `backend/agent_framework/**/*.py`.\n- Git baseline: `26b6df9affa10779dc003fc36fc1b896fe5b594a`. The files are current working-tree sources; their SHA-256 values are recorded in `source-manifest.json`.\n- Raw AST: **324 nodes / 1281 edges**.\n- Native directed graph: **346 nodes / 1205 edges / 8 communities**.\n- **Integrity limits:** raw dangling endpoints 78, missing endpoints 0, self-loops 1, same-endpoint directed edges collapsed 76.\n- Build added **22 implicit/external placeholder nodes**. These have no extracted in-scope definition; they are not deployment components.\n- The native view has collapsed parallel relations. **`extraction.json` retains every raw relationship and source location**; `diagnostics.json` and `diagnostics.txt` retain the official diagnostic.\n- Raw edge confidence: `{'EXTRACTED': 1066, 'INFERRED': 215}`. `INFERRED` edges are extractor resolution inferences, not verified runtime calls.\n- Source direction, confidence, `_origin` and location metadata are retained as emitted by Graphify. AST name resolution can be incomplete or ambiguous.\n- AST extraction model tokens: **0 input / 0 output**. No semantic extraction or model API call. Host-agent reasoning/labeling tokens were **not separately measured**; this is not a zero-cost claim for the whole conversation.\n- Token-reduction benchmark not run: the requested scope is the flow/code graph artifact, not a compression experiment.\n- `graph.html` uses the official renderer with only its pinned vis-network dependency embedded after SRI verification. **No automatic external HTML resources remain in a static audit. Browser rendering was not tested here.**\n- Graphify detected this small corpus as fitting in one context; graph generation proceeded because the user explicitly requested it.\n- Rebuild script: `scripts/build_agent_code_graph.py`. A disposable environment and asset cache are required; project dependencies and user profiles were not changed.\n- These outputs are written into the working tree; no ignore, commit or push operation was performed.\n\n- Portable sharing: source metadata uses repository-relative paths; the extractor path is package-relative. Nodes, edges and diagnostic counts are unchanged.\n\n## Raw diagnostic\n\n```text\n[graphify] MultiDiGraph edge-collapse diagnostic\ninput: \u003cin-memory\u003e\ninput_stage: provided JSON (normal graph.json is post-build)\neffective_directed: \u003cdirect-call\u003e\nnodes: 324\nunverified_code_nodes: 0\nraw_edges: 1281\nvalid_candidate_edges: 1203\nmissing_endpoint_edges: 0\ndangling_endpoint_edges: 78\nexternal_reference_edges: 0\nself_loop_edges: 1\nexact_duplicate_edges: 0\ndirected_unique_endpoint_pairs: 1127\ndirected_same_endpoint_collapsed_edges: 76\nundirected_unique_endpoint_pairs: 1126\nundirected_same_endpoint_collapsed_edges: 77\nsame_endpoint_group_count: 71\nrelation_variant_groups: 65\nsource_file_variant_groups: 0\nsource_location_variant_groups: 1\ncontext_variant_groups: 5\npost_build_graph_type: DiGraph\npost_build_edges: 1205\nproducer_suppression_sites: 12\nproducer_suppression_examples:\n  - L1830 seen_ids arity=unknown\n  - L2393 seen_ids arity=unknown\n  - L2395 seen_doc_refs arity=unknown\n  - L3062 seen_ids arity=unknown\n  - L3209 seen_ids arity=unknown\n  - L4350 seen_keys arity=unknown\n  - L4536 seen_keys arity=unknown\n  - L8160 seen_ids arity=unknown\nexamples:\n  - adapters_synthetic_sample_inputs -\u003e contracts_context edges=3 relations=['calls', 'references', 'uses'] locations=['L30', 'L34', 'L36'] contexts=['', 'call', 'generic_arg']\n  - adapters_synthetic_sample_inputs -\u003e contracts_documentref edges=3 relations=['calls', 'references', 'uses'] locations=['L30', 'L34', 'L41'] contexts=['', 'call', 'generic_arg']\n  - adapters_synthetic_sample_inputs -\u003e contracts_assetref edges=3 relations=['calls', 'references', 'uses'] locations=['L30', 'L34', 'L45'] contexts=['', 'call', 'generic_arg']\n  - adapters_synthetic_make_agents -\u003e ports_agents edges=3 relations=['calls', 'references', 'uses'] locations=['L174', 'L179'] contexts=['', 'call', 'return_type']\n  - composition_build_agents -\u003e ports_agents edges=3 relations=['calls', 'references', 'uses'] locations=['L170', 'L173'] contexts=['', 'call', 'return_type']\nnote: normal graph.json is post-build; raw producer loss must be measured earlier.\n```\n\n---\n\n# Graph Report - agent_framework  (2026-11-02)\n\n## Corpus Check\n- Corpus is ~11,180 words - fits in a single context window. You may not need a graph.\n\n## Summary\n- 346 nodes · 1205 eativeCheckerStorageReader, _fail(), LegacyPosterCatalog, LegacyStorageReader, _maximum() (+18 more)\n\n### Community 2 - \"Checks relationships\"\nCohesion: 0.06\nNodes (32): make_agents(), CheckSuiteError, _invalid_constant(), load_suite(), PreparedCase, PreparedSuite, _read_json(), RoleCheckCase (+24 more)\n\n### Community 3 - \"Workflow and human approvals\"\nCohesion: 0.12\nNodes (13): _demo(), record(), Approval, FrameworkError, RunSnapshot, StepRecord, run_flow_check(), approve() (+5 more)\n\n### Community 4 - \"CLI and fixture composition\"\nCohesion: 0.09\nNodes (26): create_app(), adapter_status(), approve(), configuration_status(), health(), invoke(), read(), revise() (+18 more)\n\n### Community 5 - \"Evidence and verdict validation\"\nCohesion: 0.15\nNodes (22): _SyntheticValidator, ValidatedItem, ValidatedResult, _contract(), _input_policy(), invoke_role(), _output_policy(), _policy() (+14 more)\n\n## Knowledge Gaps\n- **2 thin communities (\u003c3 nodes) omitted from report** — run `graphify query` to explore isolated nodes.\n\n## Suggested Questions\n_Questions this graph is uniquely positioned to answer:_\n\n- **Why does `SyntheticAdapters` connect `Synthetic data and observations` to `Checks relationships`?**\n  _High betweenness centrality (0.007) - this node is a cross-community bridge._\n- **Are the 17 inferred relationships involving `Workflow` (e.g. with `Approval` and `AssetRef`) actually correct?**\n  _`Workflow` has 17 INFERRED edges - model-reasoned connections that need verification._\n- **Should `Synthetic data and observations` be split into smaller, more focused modules?**\n  _Cohesion score 0.07777777777777778 - nodes in this community are weakly interconnected._\n- **Why does `Workflow` connect `Workflow and human approvals` to `Synthetic data and observations`, `Run input contracts`, `Checks relationships`, `CLI and fixture composition`?**\n  _High betweenness centrality (0.006) - this node is a cross-community bridge._\n- **Should `Run input contracts` be split into smaller, more focused modules?**\n  _Cohesion score 0.0733162830349531 - nodes in this community are weakly interconnected._\n- **Why does `invoke_role()` connect `Evidence and verdict validation` to `CLI and fixture composition`?**\n  _High betweenness centrality (0.005) - this node is a cross-community bridge._\n- **Should `Checks relationships` be split into smaller, more focused modules?**\n  _Cohesion score 0.06286748077792854 - nodes in this community are weakly interconnected._","sha256":"defa7369e3ac60e4549225ef6ff1f895acda4befb1853a722f035822249decd8"},"docs/agent-framework/verification-2026-11-02.md":{"text":"# 공통 개발 프레임워크 검증 기록\n\n- 날짜: 2026-11-02 (Asia/Seoul)\n- 작업 브랜치: `feat/agent-framework`\n- 시작 커밋: `87a3b9e` (`feat/29-front-v2`에서 분기)\n- 대상: 역할별 독립 개발 계약과 개발용 실행기. 실제 제품 통합 완료 기록이 아니다.\n- 상태: 로컬 작업 파일이며 커밋·푸시하지 않았다.\n\n## 실행한 검사\n\n저장소 루트의 기존 `.venv`를 사용했다. 이번 작업에서 의존성 설치·잠금 파일 갱신은 하지 않았다.\n\n```sh\n.venv/bin/python -m scripts.export_agent_framework\n.venv/bin/python -m pytest tests/agent_framework -q --tb=short\n.venv/bin/python -m backend.agent_framework demo --output /tmp/agent-framework-demo-20261102.json\n.venv/bin/python -m backend.agent_framework role A03 --input examples/agent_framework/A03.json --synthetic --output /tmp/agent-framework-A03-20261102.json\ngit diff --check\n```\n\n결과: **104개 테스트와 9개 하위 테스트 통과**, `git diff --check` 통과.\n\n- 공통 JSON 계약 및 모델 생성 우회 출력 재검증.\n- 잘못된 프로젝트·문서·조건·이미지 버전, 위조 인용·해시, 과거 이력의 현재 관측 사용 차단.\n- 조건 누락·중복·불확실 관측·지원하지 않는 비교·수량 모순·검색 지연/실패 처리.\n- 조건 승인, 수정 요청 승인, 새 버전 전체 재검수, 최종 승인 및 예외 승인 제한.\n- 동시/중복 승인, 새 실행 ID 충돌, 승인 자동 승계 방지.\n- 모델·검색 미설정 및 결과 불명 시 합성 대체·자동 재호출 없음.\n- 모든 역할의 독립 CLI, factory 교체, 합성 입력 표시 전파, 오류 시 기존 출력 파일 보존.\n- FastAPI TestClient를 통한 접수·조회·승인·재검수와 오류 응답. 서버 포트는 열지 않았다.\n- 17개 JSON Schema, 15개 합성 예제 JSON, 개발 OpenAPI의 생성 결과와 저장된 파일 일치.\n\ndemo는 2개 합성 실행에서 6개 동작을 수행했다. 수정 전 실행은 `changes_approved`, 수정 후 실행은 `final_approved`로 끝났으며 두 실행 모두 `synthetic=true`다. 승인자는 스크립트 입력이므로 실제 사용자의 승인 기록으로 사용할 수 없다.\n\n## 검증 범위와 남은 연결\n\n현재 환경에는 `pytest-asyncio` 플러그인이 없어 기존 `asyncio_mode`, `asyncio_default_fixture_loop_scope` 설정에 대한 경고 2개가 발생했다. 이번 검사는 동기 테스트이며 모두 통과했다. 잠금 파일로 새 환경을 설치한 결과로 확대 해석하지 않는다.\n\n실제 Qwen·PDF·이미지 처리, PostgreSQL·Neo4j 쿼리, MCP 전송, 영속 worker 복구, 제품 인증 및 front-v2 API 연결은 이번 검증에 포함하지 않는다. 모델 정확도·검색 품질·배포 완료를 검증한 것이 아니다.\n\n기존 front-v2, `backend/app`, `backend/creative_checker`, 마이그레이션, 실행 스크립트, 의존성 파일은 변경하지 않았다. 업무 DB와 환경설정에 접근하거나 서비스를 기동하지 않았다. 이전에 작성한 계획 MD·HTML은 그대로 보존했다.\n\nUbuntu·Windows용 GitHub Actions 검사를 추가했지만 아직 원격 실행하지 않았다. Windows 장치 실행과 제품 전체 회귀 테스트는 이번 로컬 검증 결과에 포함하지 않는다.\n","sha256":"736ee986c1e267c2eda2d12e335c710fed9c2ec20776f15ef70a6fcf27d270c4"},"docs/planning/pdf-qwen-rag-workflow-plan-2026-11-02.md":{"text":"# Creative Checker — PDF·Qwen·PostgreSQL·Neo4j RAG 구현 계획\n\n- 작성일: 2026-11-02 (Asia/Seoul)\n- 상태: **계획 문서 — 실제 통합 구현·배포 완료를 의미하지 않음**\n- 코드 조사 기준: `feat/29-front-v2`, `376946f`\n- 1차 대상: **데스크톱 웹 / PDF 기준 문서 / 포스터 이미지**\n- 최종 사용자 결정: **벡터DB 제외, PostgreSQL·Neo4j 기반 근거 검색과 RAG 유지**\n- 모델 결정: **Qwen3.5-4B. PaddleOCR는 기본·보조·실패 시 대체 경로 모두 사용하지 않음.**\n\n## 1. 목표와 범위\n\n기존 front-v2의 디자인과 기존 PostgreSQL 데이터를 유지하면서 다음 업무를 실제 서비스 흐름으로 연결한다.\n\n\u003e PDF 등록 → 조건 추출 → 사람의 조건 승인 → 포스터 등록 → 근거 검색 → 검사 → 결과 검증 → 보고서 → 수정 요청 승인 → 수정본 전체 재검수 → 최종 승인\n\n### 포함 범위\n\n| 구분 | 1차 범위 |\n|---|---|\n| 문서 | PDF만 등록·읽기·조건 추출·원문 대조 |\n| 산출물 | PNG·JPEG·WEBP 포스터 및 수정 버전 |\n| 문서 이해·이미지 검사·보고 | Qwen3.5-4B |\n| 업무 원본 | 기존 PostgreSQL의 사용자·프로젝트·파일·검수 이력 보존 및 필요한 구조 확장 |\n| 관계 검색 | Neo4j에서 조건·원문·예외·수정·승인 관계 탐색 |\n| RAG | 조회한 근거를 Qwen 입력에 제공하고 생성 결과의 출처·버전을 검증 |\n| 실행 | LangGraph의 역할별 진행과 PostgreSQL의 영속 작업·단계 기록 |\n| 도구 호출 | 실제 MCP 클라이언트·서버 연결. 단순 내부 함수 호출을 MCP 실행으로 표시하지 않음 |\n| 사람의 결정 | 조건 승인, 수정 요청 승인, 최종·예외 승인 |\n| 재검수 | 새 버전의 새 실행 생성, 승인 조건 전체 재검사, 이전 실행과 비교 |\n| 화면 | 기존 front-v2 유지, 데스크톱에서 검수·비교·승인·이력 연결 |\n\n### 이번 범위에서 제외\n\n- DOCX·HWPX 등 PDF 이외 문서 형식.\n- 영상·음성 검수, 모바일·태블릿 전용 화면.\n- PaddleOCR, EasyOCR 등 추가 OCR 모델과 실패 시 자동 대체 경로.\n- Qdrant·pgvector·Neo4j 벡터 인덱스, 임베딩 모델 및 벡터 검색.\n- SigLIP·별도 로고 모델·추가 학습을 필수로 요구하는 경로.\n- 자유로운 Text2SQL/Text2Cypher, 범용 챗봇, 자동 외부 메시지 발송.\n- 클라우드 신규 자원 생성·운영 배포를 1차 연결의 선행 조건으로 삼는 작업.\n\n기존 연구 코드·실험 결과·모델 캐시는 삭제하지 않는다. 제품 실행 경로와 역사 자료를 구분한다.\n\n## 2. 현재 상태와 통합 방향\n\n다음은 조사 당시 코드와 기존 검증 자료의 구분이다. 독립 경로의 구현을 현재 기본 웹의 동작으로 합쳐 표현하지 않는다.\n\n| 구성 | 현재 확인한 내용 | 통합에서 할 일 |\n|---|---|---|\n| 기본 웹 | `backend.app.api`와 M008 PostgreSQL 저장·조회, BackgroundTasks 검수 실행 | 새 작업은 영속 worker로 연결 |\n| M008 worker | 작업 선점, 실행 권한 만료, heartbeat, 중복 실행 방지·복구 코드 | PDF·Qwen 역할 실행을 수용하도록 확장 |\n| 별도 rebuild | LangGraph, Qwen, MCP, 사람 승인, Neo4j outbox 코드 | 기존 사용자·프로젝트·인증·데이터 계약으로 이식 |\n| Neo4j | 별도 경로의 관계·영향 조회 및 동기화 코드 | 제품의 실제 원본 데이터·버전·권한과 연결 |\n| A03/RAG | 현재 제품 경로에 근거 검색부터 모델 입력까지의 통합이 필요 | 검색 도구, 근거 묶음, 인용 검증 신규 구성 |\n| front-v2 | 기존 검수 UI와 이미지 확대·근거 표시 | 상태·비교·승인·재검수 API 연결 |\n\n**기존 M008를 업무 데이터의 기준으로 유지한다.** 별도 rebuild의 `cc_*` 사용자·프로젝트·실행 테이블을 그대로 생성하여 같은 업무를 이중 저장하지 않는다. 기존 작업 선점·실행 권한 규칙을 확장하고, 하나의 worker 체계가 새 워크플로를 처리한다.\n\n현재 `PRODUCT.md`의 `A03/RAG/VectorDB 제외`는 최신 사용자 결정과 다르다. 실제 구현 착수 시 이를 **벡터DB 제외 / A03 근거 검색 및 RAG 유지 / PDF·Qwen 전용**으로 수정한다. 이 계획 문서 작성만으로 기존 제품 문서나 코드가 수정된 것으로 간주하지 않는다.\n\n## 3. 전체 구조\n\n```mermaid\nflowchart TD\n    UI[기존 front-v2 데스크톱 화면] \u003c--\u003e API[FastAPI · 인증 · 권한 · 접수 · 승인]\n    API \u003c--\u003e PG[(PostgreSQL 업무 원본)]\n    PG --\u003e QUEUE[영속 작업 큐]\n    QUEUE --\u003e WORKER[CPU worker · LangGraph]\n    WORKER \u003c--\u003e TOOLS[MCP 도구 · 문서 · 추론 · 근거]\n    TOOLS \u003c--\u003e QWEN[Qwen3.5-4B 모델 서비스]\n    WORKER --\u003e RETRIEVE[A03 근거 검색]\n    RETRIEVE \u003c--\u003e PG\n    RETRIEVE \u003c--\u003e GRAPH[(Neo4j 관계 검색)]\n    PG --\u003e OUTBOX[트랜잭션 outbox]\n    OUTBOX --\u003e GRAPH\n    WORKER --\u003e PG\n```\n\n- PostgreSQL: 실제 업무 원본, 승인·버전·권한·실행 결과의 최종 기준.\n- Neo4j: PostgreSQL에서 재구축할 수 있는 관계 표현. 모델이 만들어 낸 관계를 사람의 승인 관계로 취급하지 않는다.\n- LangGraph: 단계 전환·분기·재진입을 담당하는 실행 구조. GraphDB와 다른 구성요소다.\n- MCP: 작업별 입력·출력과 호출 기록을 남기는 도구 연결. 모든 DB 내부 함수를 반드시 MCP로 우회시킬 필요는 없다.\n- Qwen: PDF 내용을 읽고 조건을 구조화하며, 현재 포스터를 관측하고 검증 결과를 설명한다.\n\n초기 검증은 기존 로컬 환경을 기준으로 한다. 로컬 Qwen과 원격 Qwen은 동일한 모델 어댑터 계약으로 연결하되, 별도 모델 선택 UI를 제품 화면에 노출하지 않는다. 초기 GPU 추론 동시 실행은 1개를 기준으로 검증하고 실제 지연·메모리 측정 후 조정한다.\n\n## 4. 에이전트 역할과 계약\n\n기존 A01~A08 번호를 유지하고 A04·A05는 통합한다. 따라서 실제 역할은 7개다. 모든 역할이 별도의 LLM이나 GPU 프로세스일 필요는 없다.\n\n| 역할 | 실행 방식 | 입력 | 출력·책임 |\n|---|---|---|---|\n| A01 조정 | 코드·LangGraph | 프로젝트, 문서·조건·산출물 버전, 사용자 요청 | 실행 스냅샷, 작업 배정, 상태 전환, 대기·실패·재개 |\n| A02 조건 추출 | Qwen | 현재 PDF 전체 페이지·텍스트 | 조건 ID·유형·기대값·필수 여부·예외·원문 출처의 초안 |\n| A03 근거 검색 | SQL·Cypher 도구 | 고정 버전, 대상 조건, 조회 목적 | 원문·관계·유효한 예외·과거 이력이 구분된 근거 묶음 |\n| A04·A05 통합 검사 | Qwen + 파일 도구 | 승인 조건 전체, 현재 포스터, 허용된 검색 근거 | 현재 관측값, 조건별 판정 초안, 이미지 근거·불확실성 |\n| A06 검증 | 코드 | 조건·관측·출처·검색 스냅샷 | 누락·모순·잘못된 인용 차단, 검증 결과·기계 판정 |\n| A07 보고 | Qwen | A06 결과와 검증된 근거 | 항목별 설명, 보고서, 수정 요청 초안 |\n| A08 재검수 연결 | 코드·LangGraph | 승인된 수정 요청, 새 산출물 버전 | 이전 실행과 연결된 새 실행, A03부터 전체 재검수 |\n\n### 공통 경계\n\n- 모델은 사람의 승인 상태를 만들거나 변경하지 않는다.\n- A03는 승인된 검사 조건을 검색 결과 일부로 대체하지 않는다.\n- A07은 A06의 판정을 다시 결정하지 않는다.\n- A08의 변경 영향 조회는 설명과 우선순위에 사용한다. 1차 구현에서는 검사 생략에 사용하지 않는다.\n- RAG는 현재 포스터 관측을 대신하지 않는다. 과거의 통과·개수·문구가 이번 이미지의 사실을 증명하지 않는다.\n\n## 5. PDF·Qwen 처리\n\n### PDF 읽기\n\n1. 파일 내용이 PDF인지, 손상·암호화·크기·페이지 제한에 해당하는지 검사한다.\n2. 페이지별 이미지와 사용 가능한 PDF 텍스트를 준비한다. 렌더링·텍스트 파싱 라이브러리는 파일 전처리 도구다.\n3. Qwen이 페이지 내용을 읽고 페이지·블록 단위 기록을 만든다. 스캔 페이지도 별도 OCR 모델로 넘기지 않는다.\n4. 전체 페이지의 처리·실패·누락 목록을 기록한다. 긴 PDF는 구간을 나누되 문서 전체 처리 여부를 보존한다.\n5. Qwen이 조건을 구조화하고, 코드가 원문 인용·조건 ID·형식을 검사한다.\n6. 사람이 PDF 원문과 추출 조건을 대조하고 수정·승인한다.\n\nPDF 전체 읽기를 검색 top-k 결과로 대체하지 않는다. 읽을 수 없는 페이지나 구간 간 해석 충돌은 누락·확인 필요로 보여 준다. 처리 실패는 재시도 또는 확인 필요로 기록하며 PaddleOCR로 전환하지 않는다.\n\n### 조건 데이터\n\n조건에는 최소 다음 정보를 둔다.\n\n```text\ncriterion_id\ndocument_version_id / criteria_version_id\ntext / kind / expected / operator / unit\nrequired / target_scope\nsource: page / block_id / quote / source_hash\nexceptions / group_relation / supported / limitations\n```\n\n사람의 수정은 추출 초안과 구분하여 수정자·수정 내용·시각을 남긴다. 사람이 보충한 조건을 모델이 원문에서 그대로 추출한 조건으로 표시하지 않는다.\n\n파일·페이지·해상도 제한은 기존 제품 제한과 Qwen 실측을 기준으로 구현 계약에서 확정한다. 제한을 초과한 PDF를 일부만 읽고 전체 처리 완료로 표시하지 않는다.\n\n## 6. PostgreSQL·Neo4j 기반 RAG\n\n### 조회 순서\n\n1. 서버가 사용자·프로젝트 권한을 확인한다.\n2. 실행에 고정된 승인 조건과 연결 원문을 PostgreSQL에서 직접 조회한다.\n3. 관련 정의·상호참조가 필요하면 해당 프로젝트·문서 버전 내에서 키워드 검색한다.\n4. Neo4j에서 근거 연결, 예외, 이전 수정·재검수, 변경 영향을 조회한다.\n5. 반환된 원본 ID의 본문·권한·버전·승인 유효성을 PostgreSQL에서 다시 확인한다.\n6. 근거 묶음을 저장하고 Qwen의 검사·보고 입력에 제공한다.\n7. 생성한 설명의 인용 ID·원문·적용 범위를 검증한다.\n\n초기에는 매개변수가 정해진 SQL·Cypher 템플릿을 사용한다. 사용자나 모델이 생성한 임의 쿼리를 실행하지 않는다. 벡터 인덱스·임베딩 모델은 추가하지 않는다.\n\n### 초기 검색 도구\n\n| 도구 | 목적 |\n|---|---|\n| 조건 원문 조회 | 조건을 만든 원문 조항·페이지·확정 버전 확인 |\n| 적용 예외 조회 | 승인 여부·적용 대상·기간·철회 여부 확인 |\n| 이전 검수 근거 조회 | 지정한 과거 실행의 판정·수정 사유 확인 |\n| 변경 영향 조회 | 변경한 기준과 연결된 산출물·검수·승인 확인 |\n| 문서 키워드 검색 | 해당 문서의 정의·관련 조항·추가 설명 탐색 |\n\n자유로운 질문 응답 화면은 1차 필수 범위가 아니다. 우선 검수·보고에 필요한 업무 조회를 완성한다.\n\n### 근거 묶음 계약\n\n```text\nretrieval_id / purpose / policy_version\nproject_id / run_id\ndocument_version_id / criteria_version_id / asset_version_id\nstatus / coverage / warnings\npostgres_revision / graph_revision / source_backend\nquery_template / parameters / retrieved_at\nevidence[]:\n  evidence_id / kind / source_record_id / source_version\n  page / block_id / quote / source_hash\n  criterion_ids / approval_id / validity_scope\nrelationships[]\nbundle_hash\n```\n\n근거 종류는 다음처럼 구분한다.\n\n- `current_requirement`: 현재 승인 조건과 원문.\n- `current_observation`: 이번 산출물에서 관측한 문구·객체·좌표. A03가 과거 이력에서 만들어 넣지 않는다.\n- `approved_exception`: 명시적으로 승인되고 현재 대상에 적용되는 예외.\n- `historical_context`: 과거 조건·검수·수정·승인 이력.\n\n검사 모델에는 과거 판정을 기본 관측 근거로 제공하지 않는다. 보고서에는 과거 이력을 별도 맥락으로 사용할 수 있으나 현재 판정과 구분한다.\n\n### 동기화·실패 처리\n\n| 상황 | 처리 |\n|---|---|\n| 정상 조회 | 조회 버전과 근거를 고정하여 사용 |\n| 검색 결과 없음 | 해당 범위에서 찾지 못했다고 표시. 충족·예외 부재의 증명으로 사용하지 않음 |\n| 그래프 동기화 지연 | 요구 revision과 적용 revision을 기록하고 지연 상태 표시 |\n| Neo4j 장애 | PostgreSQL에서 동일 의미를 재현할 수 있는 조회만 대체, 대체 여부 기록 |\n| 필수 정의·적용 예외 확인 불가 | 영향받는 조건을 확인 필요로 처리 |\n| 선택적인 과거 이력 조회 실패 | 현재 원문·이미지 검사 진행 가능, 이력 조회 한계 표시 |\n| 다른 프로젝트·잘못된 버전·철회 근거 | 모델 입력에서 제외하고 검증 오류 기록 |\n\n검색한 문서 안의 명령문은 자료로 취급한다. 시스템 지시·도구 권한·승인 규칙을 변경할 수 없다.\n\n## 7. 승인·수정·재검수 흐름\n\n```mermaid\nflowchart TD\n    D[PDF 등록 · A02 조건 추출] --\u003e C[사람: 조건 수정·승인]\n    C --\u003e P[포스터 버전 등록]\n    P --\u003e A[A01 실행 스냅샷 확정]\n    A --\u003e R[A03 근거 검색]\n    R --\u003e I[A04·A05 통합 검사]\n    I --\u003e V[A06 검증]\n    V --\u003e B[A07 보고서·수정 요청 초안]\n    B --\u003e H{사람 검토}\n    H --\u003e|수정 요청 승인| N[수정본 등록]\n    N --\u003e RE[A08 새 실행 생성]\n    RE --\u003e A\n    H --\u003e|최종·예외 승인| F[대상 버전의 승인 이력 확정]\n```\n\n### 세 승인 지점\n\n1. **조건 승인:** 사람이 원문과 추출 초안을 확인하여 검사 기준 버전을 확정한다.\n2. **수정 요청 승인:** 모델의 초안을 사람이 확정한다. 외부 발송은 별도 범위이며 자동으로 수행하지 않는다.\n3. **최종·예외 승인:** 현재 실행·조건·포스터 버전에 대해 사람이 결정한다.\n\n예외 승인에는 사유·대상 조건·승인자·시각·원래 판정을 남긴다. 과거 실행의 예외 승인을 새 버전에 자동 승계하지 않는다. 프로젝트 정책 예외가 있다면 적용 범위를 별도로 검증한다.\n\n새 PDF나 수정 포스터는 기존 파일·조건·결과를 덮어쓰지 않는다. 새 버전과 새 실행을 만들고 이전 실행 ID·수정 요청 ID를 연결한다. 최종 승인 API는 대상 버전과 현재 상태를 다시 확인한다.\n\n### 세 가지 상태를 분리\n\n| 종류 | 의미 |\n|---|---|\n| 실행 상태 | 접수·대기·처리·대기 중단·완료·실패·취소·결과 확인 불가 |\n| 기계 판정 | `pass / fail / review` |\n| 사람 결정 | 미검토·수정 요청 승인·최종 승인·예외 승인 |\n\n필수 조건의 확실한 위반이 있으면 전체 `fail`, 확실한 위반 없이 불확실·미지원·실패가 남으면 `review`, 모든 적용 필수 조건을 충분히 검사해 충족한 경우만 `pass`로 집계한다. 권장 조건과 조건 그룹은 별도 정책으로 처리한다.\n\n## 8. 실행·저장·복구 설계\n\n### 단일 실행 소유자\n\n- API는 접수·조회·승인만 처리한다.\n- 새 워크플로는 PostgreSQL 작업 큐를 통해 worker가 실행한다.\n- 기존 BackgroundTasks와 rebuild worker가 같은 새 작업을 중복 실행하지 않도록 한다.\n- 문서 추출처럼 아직 산출물·승인 조건이 없는 작업은 공통 작업 계약으로 수용한다.\n- 실행 권한은 작업 선점·lease·heartbeat·token 확인으로 관리한다.\n\n### 단계 저장과 재개\n\n단계는 `execution_id + node + ordinal + input_hash`로 구분한다. 단계 결과, 업무 변경, 감사 이벤트, outbox 이벤트를 같은 업무 트랜잭션에서 확정한다.\n\nLangGraph 체크포인트와 업무 DB 커밋이 자동으로 하나의 트랜잭션이 된다고 가정하지 않는다. 재진입 시 업무 DB의 완료 기록을 확인하고 완료된 결과를 재사용한다. 검색 단계도 당시 근거 스냅샷을 재사용하며 임의로 최신 자료를 섞지 않는다.\n\n모델 호출에는 요청 식별자와 결과 기록을 남긴다. 호출 후 통신이 끊겨 실행 여부를 모르면 자동으로 다시 보내지 않는다. 확인 가능한 기존 작업 결과를 조회하거나 `outcome_unknown`으로 남기고 명시적 복구 절차를 제공한다.\n\n승인 대기 중에는 GPU 작업이나 실행 lease를 유지하지 않는다. 승인 기록을 저장한 뒤 재개 작업을 등록한다. 실행 권한을 잃은 worker는 늦게 받은 결과를 확정하지 못하게 한다.\n\n### 실행 재현 정보\n\n- 원문 PDF·포스터 파일 해시와 버전.\n- 승인 조건·그룹·적용 예외 스냅샷.\n- 모델명, 실제 확인 가능한 모델 revision/가중치 식별자, 미확인 여부.\n- 프롬프트·스키마·전처리·판정·검색 정책 버전.\n- 근거 묶음 해시, Neo4j revision, 도구 요청·응답·오류 기록.\n- 부모 실행, 수정 요청, 사람 승인 연결.\n\n## 9. DB 확장과 데이터 보존\n\n기존 사용자·프로젝트·멤버십·파일·산출물·조건·검수 이력을 재사용한다. 실제 마이그레이션 번호와 테이블명은 착수 시 현재 migration head를 확인하여 확정한다.\n\n확장이 필요한 논리 항목:\n\n1. PDF 원문 버전·페이지/블록·추출 초안·조건 출처 연결.\n2. 사람의 조건 확정·수정 이력.\n3. 공통 작업·단계 실행·시도·모델 호출 기록.\n4. 검색 실행·근거 스냅샷·인용 연결.\n5. 수정 요청·재검수 연결·최종/예외 승인.\n6. PostgreSQL outbox·Neo4j 반영 revision·실패 재시도 기록.\n\n변경은 명시적인 추가 마이그레이션으로 관리한다. 권한·스키마 inventory·백업/복원 검증도 함께 갱신한다. 앱 시작 시 임의 `create_all`이나 자동 마이그레이션으로 운영 DB를 바꾸지 않는다.\n\n검증 순서는 격리 DB에 마이그레이션 적용 → 기존 데이터 복제본의 호환성·조회 확인 → 백업·복구 확인 → 대상 DB 적용 순서로 잡는다. 과거 기록에 존재하지 않았던 승인·근거·모델 실행 정보를 만들어 채우지 않는다.\n\n## 10. API와 front-v2 연결\n\n기존 인증·프로젝트 권한·CSRF 정책을 사용한다. 새 경로 이름은 기존 API와 충돌하지 않도록 구현 계약에서 확정하며, 아래는 필요한 기능 목록이다.\n\n| API 기능 | 핵심 계약 |\n|---|---|\n| 프로젝트 조회·선택 | 현재 사용자가 접근 가능한 범위만 반환 |\n| PDF 등록·상태 조회 | 파일 검증, 새 문서 버전, 비동기 작업 ID |\n| 조건 초안 수정·승인 | 기대 revision, 원문 출처, 수정자, 불변 승인 버전 |\n| 포스터·수정본 등록 | 새 버전, 부모 버전, 파일 해시 |\n| 검수 실행·상태·취소·복구 | 고정 입력, 멱등키, 단계 상태, 명확한 오류 |\n| 근거·원문·보고 조회 | 프로젝트 권한, 출처 위치, 조회 버전 |\n| 수정 요청 작성·승인 | 대상 실행·조건, 사람의 확정 기록 |\n| 재검수 접수 | 부모 실행·수정 요청·새 버전 연결 |\n| 최종·예외 승인 | 현재 대상 확인, 원판정 보존, 사유·승인자 |\n| 이력·관계·비교 조회 | 과거/현재 버전 구분, 동기화 상태 |\n\nfront-v2의 디자인 토큰·레이아웃·이미지 확대·근거 표시를 유지한다. 새로운 디자인 시안이나 랜딩 페이지 교체는 수행하지 않는다.\n\n화면에 연결할 기능:\n\n- **PDF·포스터 등록:** 파일 제한, 현재 기준과 산출물 버전 표시.\n- **조건 승인:** PDF 원문과 조건을 대조하고 수정·승인.\n- **검수 진행:** 실제 완료 단계·실패·재시도 상태 표시. 추정 진행률 생성 금지.\n- **검수 결과:** 조건별 기대값·현재 관측·이미지 영역·원문 근거·한계 표시.\n- **버전 비교:** 이전/수정 포스터, 수정 요청, 판정 변경 대조.\n- **승인·재검수:** 수정 요청 승인, 수정본 전체 재검수, 최종·예외 승인.\n- **이력·관계:** 어떤 원문·조건·버전·실행·사람 결정으로 이어졌는지 확인.\n\n제품 화면에는 내부 모델 선택·개발용 도구 설명 대신 사용자가 업무 판단에 필요한 상태·근거·승인 범위를 표시한다. 기존 기록의 조회 접근도 보존한다.\n\n## 11. 구현 단계와 완료 기준\n\n| 단계 | 작업 | 완료 기준 |\n|---|---|---|\n| 1. 기준·계약 정리 | PDF/Qwen/RAG 최신 결정, 역할·입출력·상태·권한 확정 | 제품 문서·API·DB 계약의 모순 해소 |\n| 2. 저장·실행 기반 | 기존 DB 확장, worker·LangGraph, 단계 기록·복구 | 중복 요청·재시작·권한 상실 시 중복 확정 차단 |\n| 3. PDF·조건 승인 | PDF 처리, Qwen 추출, 원문 대조·수정·승인 | 전체 처리 범위와 조건 출처가 연결됨 |\n| 4. A03·RAG | PostgreSQL 조회, Neo4j projection, 근거 묶음·인용 검증 | 실제 조회 근거가 모델 입력·결과까지 연결됨 |\n| 5. 검사·보고 | Qwen 포스터 검사, A06, A07 | 조건 전체의 결과·관측·근거·한계 조회 가능 |\n| 6. 승인·재검수·화면 | 수정 요청, 새 버전 전체 검사, 비교, 최종·예외 승인 | 기존 front-v2에서 업무 전체 수행 가능 |\n| 7. 통합 검증 | 실제 모델 E2E, 권한·장애·복구·데이터 보존 | 실행 ID·로그·DB 기록으로 결과 재현 가능 |\n\n처음 관통시킬 실행은 **PDF 1건 → 사람의 조건 승인 → 포스터 1건 → 실제 근거 검색 → Qwen 검사 → 근거가 표시된 보고서**다. 이 흐름에 수정 요청·수정본·전체 재검수·최종 승인을 연결한다.\n\n계약 확정 후 PDF/Qwen 어댑터와 근거 검색 도구는 병렬 구현할 수 있다. 데이터 마이그레이션·실행기·공통 계약은 한 담당 경로에서 관리하여 충돌을 줄인다. 기간과 병렬 실행 수는 첫 관통 흐름의 실측 후 결정한다.\n\n## 12. 검증 계획\n\n### 기능·권한·버전\n\n- PDF 이외 파일, 손상·암호화 PDF, 제한 초과 입력 처리.\n- 조건 승인 전 검사 차단, 권한 없는 승인 차단.\n- 다른 프로젝트의 파일·조건·근거·승인 접근 차단.\n- 진행 중 기준 변경 시 기존 실행의 스냅샷 유지.\n- 새 산출물/조건 버전에 과거 승인 자동 승계 금지.\n- 수정 요청 승인 후 새 버전 전체 재검수·최종 승인.\n- 예외 승인 후 원래 기계 판정·대상 조건·사유 보존.\n\n### RAG·관계 정합성\n\n- 조건 ID 기반 원문 조회와 문서 버전 일치.\n- 검색 누락·빈 결과·장애·동기화 지연을 각각 구분.\n- 만료·철회·대상 불일치 예외 차단.\n- 존재하지 않는 근거 ID, 변조된 인용, 과거 판정의 현재 관측 오용 차단.\n- PostgreSQL 대체 조회와 Neo4j의 동등 근거 집합 비교.\n- outbox 중복·역순·재시도·전체 재구축 검증.\n- 검색 결과가 필수 검사 조건을 줄이지 않는지 검증.\n\n### 모델·판정\n\n- 잘린 JSON, 조건 누락·중복, 근거 부족을 정상 통과로 처리하지 않음.\n- 기대 수량과 관측 수량이 다른데 통과시키는 모순 차단.\n- 객체별 위치·중복·가림·검사 범위를 기록하고 불확실성을 표시.\n- 정확 문구·날짜·금액·수량 등 조건 유형별 결과를 분리 평가.\n- 현재 조건의 확실한 위반과 불확실 조건이 함께 있어도 위반을 숨기지 않음.\n- 보고서가 원래 판정·숫자·승인 사실을 임의 변경하지 않음.\n\n기존 98조건 비교는 사람 검증이 완료된 정답셋이 아니다. 사람이 원문·이미지·기대값·판정을 확인하고, 원본 포스터 그룹이 겹치지 않는 별도 평가셋을 사용한다. 조건 추출 완전성, 검색 근거 적합성, 위반 탐지, 잘못 통과, 보류, 인용 정확도를 하나의 정확도로 합치지 않는다.\n\n수량 비교 코드가 모델의 잘못된 시각 관측 자체를 보장해서 고칠 수는 없다. 근거 좌표가 존재한다는 사실과 그 관측이 정확하다는 사실도 구분한다.\n\n### 실행 복구\n\n- 중복 접수·승인 요청의 멱등성.\n- worker 종료 후 단계 재개와 완료 단계 재사용.\n- lease를 잃은 worker의 결과 반영 차단.\n- 모델 호출 결과 불명 시 자동 중복 호출 차단.\n- 검색·모델·DB 장애를 실제 실패로 표시.\n- 승인 대기 중 재시작 후 기록·대상 버전 복원.\n\n### 최종 E2E 완료 기준\n\n실제 PDF·포스터와 실제 Qwen을 사용해 다음을 브라우저에서 수행하고 로그·DB 기록·원문/근거 ID를 남긴다.\n\n1. PDF 등록과 Qwen 조건 추출.\n2. 사람이 원문을 대조하고 조건 승인.\n3. 포스터 등록과 PostgreSQL·Neo4j 근거 검색.\n4. Qwen 검사, A06 검증, A07 보고서 생성.\n5. 수정 요청 작성과 사람의 승인.\n6. 수정 포스터 새 버전 등록과 조건 전체 재검수.\n7. 이전/현재 결과 비교와 최종 승인.\n8. 서버 재시작 후 동일 실행·버전·근거·승인 기록 조회.\n\nDB/mock 테스트, 실제 모델 테스트, 브라우저 업무 테스트를 따로 기록한다. 실제 모델이 준비되지 않았을 때 합성 응답을 실모델 성공으로 표시하지 않는다.\n\n## 13. 산출물과 완료 보고\n\n실제 구현을 진행할 때 다음 산출물을 남긴다.\n\n- 최신 제품 기준과 역할·API·데이터 계약.\n- 기존 데이터 보존을 검증한 마이그레이션·스키마·권한 변경.\n- PDF/Qwen 어댑터, A03 검색·근거 계약, A06 판정 검증.\n- worker·LangGraph·MCP 실행 및 복구 경로.\n- front-v2의 승인·비교·재검수 연결.\n- Windows/macOS 실행 안내와 비밀정보 없는 설정 예시.\n- 테스트 결과, 실제 실행 ID, 알려진 한계, 미검증 사항.\n\n계획 문서와 설계 그림은 실행 완료 증거가 아니다. 구현·DB 적용·실모델 E2E·배포 상태는 각각 별도로 보고한다. 커밋·푸시는 별도 지시 범위에 따른다.\n\n## 14. 근거와 후속 정합성 작업\n\n참조한 채팅 (작성자의 로컬 Codex 기록이며 공유 파일에는 포함되지 않음):\n\n- 벡터·Graph 보고서 — 기록 ID `01a15bde-c9b5-75f1-90be-047782ddca96`\n- 최종 모델 비교 결과 정리 — 기록 ID `01a18a2d-9a65-76c1-acc9-7adde20686ea`\n- 모델 최종 분석 — 기록 ID `01a17c65-83b7-7392-b71d-9a7147075eef`\n\n현재 코드·문서와의 주요 대조 대상:\n\n- `PRODUCT.md`: RAG 제외·문서 형식·모델 역할을 최신 합의로 갱신할 대상.\n- `backend/app/api.py`, `backend/app/web_postgres.py`: 현재 기본 웹과 PostgreSQL 연결.\n- `backend/app/worker.py`, `backend/app/execution/queue.py`: 기존 작업 선점·lease·복구 기반.\n- `backend/creative_checker/orchestration.py`: 별도 LangGraph 흐름의 재사용 후보.\n- `backend/creative_checker/tools.py`: 실제 MCP 도구 연결의 재사용 후보.\n- `backend/creative_checker/graph.py`, `projection.py`: 관계 조회·outbox 재사용 후보.\n- `docs/postgresql-web-integration-2026-10-30.md`, `docs/rebuild/status.md`: 검증 범위와 미완료 상태 구분.\n\n기술 참고:\n\n- [Neo4j GraphRAG: 검색기·모델 연결과 벡터 없는 조회](https://neo4j.com/docs/neo4j-graphrag-python/current/user_guide_rag.html)\n- [LangGraph: 사람 입력을 기다리는 중단·재개](https://docs.langchain.com/oss/python/langgraph/interrupts)\n\n이 문서는 최신 사용자 합의를 기준으로 한 계획이다. 과거 문서의 벡터 검색·PaddleOCR·DOCX/HWPX·영상 구성을 현재 구현 범위로 다시 포함하지 않는다.\n","sha256":"c2b0ced39cde5f8b8aa5335d784beaf8e093c3173e005264430f8762ab1e93e6"},"examples/agent_framework/README.md":{"text":"# 합성 에이전트 계약 예제\n\n이 폴더의 JSON은 실제 PDF, 포스터, 모델, PostgreSQL, Neo4j 실행 결과가 아닙니다.\n파일 ID와 SHA-256도 **합성 참조 문자열**을 나타냅니다. 원본 미디어 파일은 제공하지 않습니다.\n모든 역할 출력의 `synthetic`은 `true`이며 모델 정확도나 배포 완료 증거로 사용할 수 없습니다.\n\n| 역할 | 요청 JSON | 응답 JSON | 계약 |\n|---|---|---|---|\n| A02 조건 추출 | `A02.json` | `A02.output.json` | ExtractRequest → CriteriaDraft |\n| A03 근거 검색 | `A03.json` | `A03.output.json` | RetrieveRequest → EvidenceBundle |\n| A04/A05 통합 검사 | `A04_A05.json` | `A04_A05.output.json` | InspectRequest → InspectionResult |\n| A06 코드 검증 | `A06.json` | `A06.output.json` | ValidateRequest → ValidatedResult |\n| A07 보고서 | `A07.json` | `A07.output.json` | ReportRequest → ReportDraft |\n\n기본 예제는 `MORNING CUP` 정확문구와 딸기 `3개` 조건을 사용합니다.\n`scenarios/`에는 `pass`, `fail`, `review`, `stale`, `unavailable`의 A06 검증 결과가 있습니다.\n`stale`과 `unavailable`에서는 합성 검사기가 충족을 주장해도 검색 근거가 불완전하므로 코드 검증이 `review`로 남깁니다.\n\n저장소 루트에서 같은 JSON을 다시 생성할 수 있습니다. 외부 서비스에 접속하지 않습니다.\n\n```sh\npython -m backend.agent_framework.adapters.generate_examples\n```\n\n`custom_adapter.py`는 팀별 어댑터 팩터리의 연결 위치만 보여 줍니다. 구현하지 않은 메서드는\n`ADAPTER_NOT_CONFIGURED`를 반환하며 합성 결과로 대체하지 않습니다. 실제 서비스를 연결할 때는\n각 메서드의 입력·출력 계약과 현재 버전·출처·인용 검증을 유지해야 합니다.\n\n## 팀별 역할 설정\n\n- `team_config.template.json`: A02·A03·A04_A05·A07은 미설정, A06은 참조 검증기입니다. 팀 연결용으로 복사해 사용합니다.\n- `team_config.synthetic.json`: 합성 역할과 A06 참조 검증기를 명시적으로 조합합니다. 실제 모델·DB 연결을 하지 않습니다.\n- `team_adapters.py`: 역할별 `create_extractor`, `create_retriever`, `create_inspector`, `create_validator`, `create_reporter` factory의 시작점입니다. 모델·검색 stub은 호출 시 `ADAPTER_NOT_CONFIGURED`로 실패합니다.\n\n설정 파일에는 다섯 역할을 모두 선언하고, 역할 하나의 binding을 다음처럼 바꿉니다. 아래는 `roles.A03`의 값이며 완전한 설정 파일이 아닙니다.\n\n```json\n{\n  \"kind\": \"factory\",\n  \"factory\": \"examples.agent_framework.team_adapters:create_retriever\"\n}\n```\n\n역할별 factory는 인자 없이 **단일 역할 어댑터**를 반환합니다. 기존 `custom_adapter:make_agents`와 CLI의 `--factory`는 `Agents` 전체를 반환하는 별도 경로로 유지됩니다. factory import·생성자는 부작용 없이 작성하고, 클라이언트는 역할 메서드에서 필요할 때 초기화합니다. 여러 실행이 인스턴스를 공유할 수 있으므로 클라이언트 초기화·호출 동시 접근도 담당자가 관리합니다. 미구현·연결 실패를 합성 데이터로 대체하지 않습니다.\n\nmacOS:\n\n```sh\n.venv/bin/python -m backend.agent_framework doctor --config examples/agent_framework/team_config.synthetic.json\n.venv/bin/python -m backend.agent_framework role A03 --input examples/agent_framework/A03.json --config examples/agent_framework/team_config.synthetic.json\n.venv/bin/python -m backend.agent_framework serve --config examples/agent_framework/team_config.synthetic.json --port 8012\n```\n\nWindows PowerShell에서는 위의 실행 파일을 `.\\.venv\\Scripts\\python.exe`로 바꾸고 동일한 인자를 사용합니다.\n\n`doctor`는 설정 검사·설명만 하며 설정된 모듈의 import, factory·역할 호출, 접속 검증은 하지 않습니다. `role --config`는 선택한 역할만 생성합니다. `serve --config`는 동일 구성으로 개발 API를 열며 loopback `127.0.0.1`, 단일 worker, 인증 없음, 메모리 저장 범위입니다. 시작만으로 검수·승인을 실행하지 않습니다. `GET /api/framework/v1/configuration`에서 구성 선언과 초기화 상태를 확인할 수 있으며 실제 연결 검증은 별개입니다.\n\n공통 CLI·실행기 호출은 같은 계약 검증을 적용하고 중첩 합성 입력의 표시를 결과까지 유지합니다. 자세한 소유 범위·계약 규칙은 [개발 가이드](../../docs/agent-framework/README.md)를 따릅니다. 개발 정본은 루트 `backend/agent_framework`, `docs/agent-framework`, `tests/agent_framework`이며 `share/에이전트_흐름도`는 수정 대상이 아닌 배포 사본입니다.\n\n## 여러 예제의 계약 검사\n\n`checks/`의 역할별 `*.suite.json`과 요청 fixture는 `python -m scripts.export_agent_framework`로 생성합니다. 다섯 역할에 총 17개 사례가 있으며 A06/A07의 정상 `fail`·`review` 판정과 범위 위반 거부도 구분합니다.\n\n```sh\n.venv/bin/python -m backend.agent_framework check A07 --config examples/agent_framework/team_config.synthetic.json --cases examples/agent_framework/checks/A07.suite.json\n```\n\nWindows PowerShell에서는 실행 파일을 `.\\.venv\\Scripts\\python.exe`로 바꿉니다. 입력 경로는 suite 파일 기준의 상대 경로입니다. `--output \u003c파일\u003e`로 결과 요약을 저장할 수 있으며 종료 코드는 기대 일치 0, 검사 실패 1, 잘못된 입력·설정 2입니다. 결과 불명은 실패로 남기고 나머지 사례를 중단하며 자동 재시도하지 않습니다.\n\n이 fixture에는 실제 미디어 파일이 없습니다. 실모델·검색 어댑터를 검사할 때는 자기 개발 입력과 기대값을 가진 별도 suite를 만듭니다. 보고서의 `passed`는 선언한 기대와의 일치이며 모델 정확도나 DB 연결 성공 인증이 아닙니다. 세부 규격은 [개발 가이드의 역할별 계약 검사](../../docs/agent-framework/README.md#역할별-계약-검사-묶음-실행)를 참고하세요.\n\n## 실제 파일 바이트 연결 예제\n\n`python -m examples.agent_framework.file_access_demo`는 실행할 때 PDF·PNG를 생성하고, 기존 `services.store_file`·`LocalStorage`와 격리 SQLite의 기존 모델로 등록·조회합니다. 실제 바이트 해시·페이지·치수 및 변경된 해시 참조 거부를 확인합니다. 생성 테스트 미디어이며 운영 DB·사용자 업로드·Qwen·Neo4j를 사용하지 않습니다.\n\n## 단계별 실행 기록\n\n`python -m backend.agent_framework demo`의 `runs[].step_records`에서 역할별 상태·UTC 시작/종료 시각·소요 시간을 확인합니다. 재검수의 A02는 `reused`와 부모 실행 ID로 표시되며 모델을 다시 실행한 기록이 아닙니다.\n\n같은 `Workflow` 객체의 `get_steps(run_id)` 또는 개발 API `GET /api/framework/v1/runs/{run_id}/steps`로 실행 중인 역할도 조회할 수 있습니다. 시작·승인 POST는 여전히 동기식입니다. 오류 시 후속 역할을 실행하지 않으며 결과 불명과 일반 실패를 구분합니다. 예제는 합성 어댑터와 테스트 승인을 사용하고 기록은 메모리에만 남습니다. 별도로 실행한 CLI와 API 프로세스는 기록을 공유하지 않습니다.\n\n## 설정한 역할의 전체 흐름 검사\n\n```sh\n.venv/bin/python -m backend.agent_framework check-flow --config examples/agent_framework/team_config.synthetic.json --case examples/agent_framework/workflow.synthetic.json\n.venv/bin/python -m examples.agent_framework.file_flow_demo\n```\n\nWindows는 실행 파일을 `.\\.venv\\Scripts\\python.exe`로 바꿉니다. `check-flow`는 다섯 역할을 구성해 테스트 조건 승인→검사·보고→수정 승인→수정본 재검수→최종 승인을 확인합니다. `--output 보고서.json`으로 요약을 저장하며 전체 기대 일치 0, 실패·결과 불명·불일치 1, 입력·설정 오류 2를 반환합니다. 오류·기대 불일치 뒤에는 나머지 동작을 건너뜁니다.\n\n`workflow.synthetic.json`은 실제 미디어가 없는 합성 참조입니다. 담당자 구성에는 별도 개발 사례의 PDF·포스터 ID·버전·해시와 기대 판정을 입력합니다. `file_flow_demo`는 생성 PDF와 실제 PNG 두 버전을 기존 저장소에 넣고, 파일 검증 후 PDF 텍스트·픽셀 테스트 콜백으로 최초 불합격→수정본 통과를 확인합니다. Qwen·Neo4j 호출은 없으며 임시 SQLite·파일은 종료 후 정리됩니다. 모든 승인은 테스트 값이고 실행 기록은 메모리에만 남습니다.\n\n자세한 사례 계약과 보고서 규격은 [전체 흐름 검증 안내](../../docs/agent-framework/README.md#설정한-어댑터의-전체-흐름-검증)를 참고하세요.\n\n파일 접근용 `VerifiedFileAccess`, 기존 저장소 어댑터, `FileBackedExtractor/FileBackedInspector` 연결 방법은 [개발 가이드](../../docs/agent-framework/README.md#기존-저장소의-pdf포스터-읽기)에 있습니다. 테스트 fixture의 합성 참조를 실파일 ID로 자동 변환하지 않습니다. macOS는 `.venv/bin/python`, Windows는 `.\\.venv\\Scripts\\python.exe`로 실행합니다.\n","sha256":"0384ccdab7141cb73abeb0618e0a55cd6e7aef6b94744ef7c07253ce9148b5d2"},"examples/agent_framework/file_flow_demo.py":{"text":"\"\"\"Configured full-flow demo using generated real files and fixture callbacks.\n\nExplicit execution only. Uses isolated SQLite, existing store_file/LocalStorage,\nPDF text extraction and a deterministic pixel counter, not Qwen or RAG. The\nContextVar is a scoped dependency seam for this demo's local factories only.\nImporting this module creates no files, database connections or model clients.\n\"\"\"\nfrom __future__ import annotations\n\nfrom contextvars import ContextVar\nfrom hashlib import sha256\nfrom io import BytesIO\nimport json\nfrom pathlib import Path\nfrom tempfile import TemporaryDirectory\n\n_files = ContextVar(\"file_flow_demo_access\")\n\n\ndef _extract(request, document):\n    import pymupdf\n    from backend.agent_framework.contracts import CriteriaDraft, Criterion, SourceRef\n\n    with pymupdf.open(stream=document.content, filetype=\"pdf\") as pdf:\n        quote = pdf[0].get_text().strip()\n    if quote != \"Display exactly 3 green marks.\":\n        raise ValueError(\"unexpected generated fixture\")\n    source = SourceRef(document_version_id=request.document.document_version_id,\n        page=1, block_id=\"generated-line-1\", quote=quote, source_hash=sha256(quote.encode()).hexdigest())\n    return CriteriaDraft(context=request.context, synthetic=True,\n        warnings=(\"Generated fixture; PDF text extraction and pixel counting, not Qwen inference.\",),\n        criteria=(Criterion(criterion_id=\"green-marks\", text=quote, kind=\"number\", expected=\"3\",\n                            operator=\"equals\", unit=\"개\", source=source),))\n\n\ndef _inspect(request, poster):\n    from PIL import Image\n    from backend.agent_framework.contracts import ImageEvidence, InspectionResult, Observation\n\n    with Image.open(BytesIO(poster.content)) as image:\n        image = image.convert(\"RGB\")\n        count = sum(image.getpixel((x, 12)) == (49, 91, 72) for x in (8, 16, 24))\n    criterion = request.criteria[0]\n    citations = tuple(e.evidence_id for e in request.evidence.evidence if criterion.criterion_id in e.criterion_ids)\n    return InspectionResult(context=request.context, synthetic=True, observations=(Observation(\n        criterion_id=criterion.criterion_id, observed=str(count), verdict=\"pass\" if count == 3 else \"fail\",\n        evidence_ids=citations, image=ImageEvidence(asset_version_id=request.asset.asset_version_id,\n            asset_hash=request.asset.sha256, bbox=(0, 0, 1, 1))),))\n\n\ndef create_extractor():\n    from backend.agent_framework.adapters.file_backed import FileBackedExtractor\n    return FileBackedExtractor(_files.get(), _extract)\n\n\ndef create_inspector():\n    from backend.agent_framework.adapters.file_backed import FileBackedInspector\n    return FileBackedInspector(_files.get(), _inspect)\n\n\ndef run_demo():\n    import pymupdf\n    from PIL import Image\n    from backend.creative_checker.database import Base, create_engine, session_factory\n    from backend.creative_checker.models import Asset, AssetVersion, Document, Membership, Project, User, new_id\n    from backend.creative_checker.tool_records import ToolCall  # noqa: F401 — complete existing metadata\n    from backend.creative_checker.services import commit, store_file\n    from backend.creative_checker.storage import LocalStorage\n    from backend.agent_framework.adapters.project_files import CreativeCheckerCatalog, CreativeCheckerStorageReader\n    from backend.agent_framework.composition import RoleBinding, TeamConfiguration, load_config\n    from backend.agent_framework.contracts import AssetRef, Context, DocumentRef\n    from backend.agent_framework.files import VerifiedFileAccess\n    from backend.agent_framework.flow_checks import FlowCheckCase, load_flow_case, run_flow_check\n\n    with pymupdf.open() as pdf:\n        pdf.new_page().insert_text((36, 60), \"Display exactly 3 green marks.\")\n        pdf_bytes = pdf.tobytes()\n\n    def poster_bytes(count):\n        stream = BytesIO()\n        with Image.new(\"RGB\", (32, 24), \"white\") as image:\n            for x in (8, 16, 24)[:count]:\n                image.putpixel((x, 12), (49, 91, 72))\n            image.save(stream, format=\"PNG\")\n        return stream.getvalue()\n\n    engine = create_engine(\"sqlite://\")\n    try:\n        Base.metadata.create_all(engine)  # Isolated demo DB only; never product startup.\n        sessions = session_factory(engine)\n        with TemporaryDirectory(prefix=\"cc-file-flow-\") as temporary:\n            root = Path(temporary)\n            storage = LocalStorage(root / \"files\")\n            with sessions() as db:\n                user = User(id=new_id(), email=\"flow-fixture@example.test\", name=\"Flow fixture\",\n                            password_hash=\"disabled-demo-account\", active=True)\n                db.add(user); db.flush()\n                project = Project(id=new_id(), name=\"Isolated flow fixture\", created_by=user.id)\n                db.add(project); db.flush()\n                db.add(Membership(project_id=project.id, user_id=user.id, role=\"editor\"))\n                document_file = store_file(db, storage, project, user, \"requirements.pdf\", pdf_bytes, \"application/pdf\")\n                document = Document(id=new_id(), project_id=project.id, version=1,\n                    file_id=document_file.id, filename=\"requirements.pdf\", created_by=user.id)\n                asset = Asset(id=new_id(), project_id=project.id, name=\"Green marks\", kind=\"poster\", created_by=user.id)\n                db.add_all([document, asset]); db.flush()\n                versions = []\n                for index, count in enumerate((2, 3), 1):\n                    file = store_file(db, storage, project, user, f\"poster-v{index}.png\", poster_bytes(count), \"image/png\")\n                    version = AssetVersion(id=new_id(), project_id=project.id, asset_id=asset.id, version=index,\n                        file_id=file.id, filename=f\"poster-v{index}.png\", created_by=user.id,\n                        media_metadata={\"actual_mime\": \"image/png\", \"width\": 32, \"height\": 24})\n                    db.add(version); db.flush()\n                    versions.append(AssetRef(file_id=file.id, asset_version_id=version.id,\n                                             sha256=file.sha256, width=32, height=24))\n                context = Context(project_id=project.id, actor_id=user.id, run_id=\"generated-flow-1\",\n                    document_version_id=document.id, criteria_version_id=\"generated-criteria\",\n                    asset_version_id=versions[0].asset_version_id)\n                revised = context.model_copy(update={\"run_id\": \"generated-flow-2\", \"parent_run_id\": context.run_id,\n                                                     \"asset_version_id\": versions[1].asset_version_id})\n                case = FlowCheckCase(id=\"generated-file-flow\", context=context,\n                    document=DocumentRef(file_id=document_file.id, document_version_id=document.id,\n                        sha256=document_file.sha256, page_count=1), asset=versions[0],\n                    revision_context=revised, revision_asset=versions[1], expected_initial_verdict=\"fail\",\n                    change_reason=\"Generated fixture: replace two marks with three, then review the entire new version.\")\n                actor = user.id\n                commit(db)\n            access = VerifiedFileAccess(CreativeCheckerCatalog(sessions, actor), CreativeCheckerStorageReader(storage))\n            module = \"examples.agent_framework.file_flow_demo\"\n            config = TeamConfiguration(roles={\n                \"A02\": RoleBinding(kind=\"factory\", factory=f\"{module}:create_extractor\"),\n                \"A03\": RoleBinding(kind=\"synthetic\"),\n                \"A04_A05\": RoleBinding(kind=\"factory\", factory=f\"{module}:create_inspector\"),\n                \"A06\": RoleBinding(kind=\"reference\"), \"A07\": RoleBinding(kind=\"synthetic\"),\n            })\n            (root / \"config.json\").write_text(config.model_dump_json(), encoding=\"utf-8\")\n            (root / \"workflow.json\").write_text(case.model_dump_json(), encoding=\"utf-8\")\n            # Use the importable module's dependency scope even when invoked via -m.\n            import importlib\n            factories = importlib.import_module(module)\n            token = factories._files.set(access)\n            try:\n                report = run_flow_check(load_flow_case(root / \"workflow.json\"), load_config(root / \"config.json\"))\n            finally:\n                factories._files.reset(token)\n            return {\"generated_test_media\": True, \"database\": \"isolated SQLite\", \"model_calls\": 0,\n                    \"operational_database_checked\": False, \"workflow\": report,\n                    \"notice\": \"Existing storage reads and deterministic PDF/pixel fixture callbacks; no Qwen, Neo4j or authenticated human approval.\"}\n    finally:\n        engine.dispose()\n\n\nif __name__ == \"__main__\":\n    result = run_demo()\n    print(json.dumps(result, ensure_ascii=False, indent=2))\n    raise SystemExit(0 if result[\"workflow\"][\"passed\"] else 1)\n","sha256":"c1b2a528362fb14c3eb8ddc0458e927f8418ebd44838da1c2f1794a76892c534"},"examples/agent_framework/team_adapters.py":{"text":"\"\"\"Independent team-owned role factories; intentionally no real model or DB I/O.\n\nEach zero-argument factory returns one adapter, not an Agents collection. Keep\nimports and constructors free of network/database/model loading. A teammate may\ncreate a client lazily inside the role method after implementing its contract.\nInstances can be shared between runs: guard mutable state and client concurrency.\nUntil implemented, these seams raise ADAPTER_NOT_CONFIGURED and never substitute\nsynthetic fixtures. Real implementations must preserve nested synthetic flags.\n\"\"\"\nfrom __future__ import annotations\n\nfrom backend.agent_framework.adapters.templates import (\n    PostgresNeo4jRetrieverStub,\n    QwenAdapterStub,\n)\nfrom backend.agent_framework.contracts import (\n    CriteriaDraft,\n    EvidenceBundle,\n    ExtractRequest,\n    InspectRequest,\n    InspectionResult,\n    ReportDraft,\n    ReportRequest,\n    RetrieveRequest,\n)\nfrom backend.agent_framework.ports import Extractor, Inspector, Reporter, Retriever, Validator\nfrom backend.agent_framework.validation import ReferenceValidator\n\n\nclass TeamPDFExtractor(QwenAdapterStub):\n    \"\"\"A02 owner: implement PDF-to-criteria extraction with source provenance.\"\"\"\n\n    def extract(self, request: ExtractRequest) -\u003e CriteriaDraft:\n        # Replace this body with your implementation; preserve the request scope.\n        return super().extract(request)\n\n\nclass TeamEvidenceRetriever(PostgresNeo4jRetrieverStub):\n    \"\"\"A03 owner: implement PostgreSQL/Neo4j evidence retrieval and freshness.\"\"\"\n\n    def retrieve(self, request: RetrieveRequest) -\u003e EvidenceBundle:\n        # Keep permission/version filters and unavailable results explicit.\n        return super().retrieve(request)\n\n\nclass TeamPosterInspector(QwenAdapterStub):\n    \"\"\"A04/A05 owner: inspect this poster version against all approved criteria.\"\"\"\n\n    def inspect(self, request: InspectRequest) -\u003e InspectionResult:\n        # Historical evidence must not be presented as current observations.\n        return super().inspect(request)\n\n\nclass TeamReportWriter(QwenAdapterStub):\n    \"\"\"A07 owner: explain the validated verdict without changing that verdict.\"\"\"\n\n    def report(self, request: ReportRequest) -\u003e ReportDraft:\n        # Preserve validated citations and limitations in the returned report.\n        return super().report(request)\n\n\ndef create_extractor() -\u003e Extractor:\n    return TeamPDFExtractor()\n\n\ndef create_retriever() -\u003e Retriever:\n    return TeamEvidenceRetriever()\n\n\ndef create_inspector() -\u003e Inspector:\n    return TeamPosterInspector()\n\n\ndef create_validator() -\u003e Validator:\n    \"\"\"Reference code validation only; no model or source-authenticity proof.\"\"\"\n    return ReferenceValidator()\n\n\ndef create_reporter() -\u003e Reporter:\n    return TeamReportWriter()\n","sha256":"980892625093b38f38639f817abfd6e953bdfc57c83d40d802b03944ba4d66df"},"examples/agent_framework/team_config.synthetic.json":{"text":"{\n  \"contract_version\": \"1.0.0\",\n  \"profile\": \"development\",\n  \"roles\": {\n    \"A02\": {\n      \"contract_version\": \"1.0.0\",\n      \"kind\": \"synthetic\"\n    },\n    \"A03\": {\n      \"contract_version\": \"1.0.0\",\n      \"kind\": \"synthetic\"\n    },\n    \"A04_A05\": {\n      \"contract_version\": \"1.0.0\",\n      \"kind\": \"synthetic\"\n    },\n    \"A06\": {\n      \"contract_version\": \"1.0.0\",\n      \"kind\": \"reference\"\n    },\n    \"A07\": {\n      \"contract_version\": \"1.0.0\",\n      \"kind\": \"synthetic\"\n    }\n  }\n}\n","sha256":"87cb8fd3ae30fa1d3124b693fe6d7215bcb819f177188183d42a9832677f4635"},"examples/agent_framework/team_config.template.json":{"text":"{\n  \"contract_version\": \"1.0.0\",\n  \"profile\": \"development\",\n  \"roles\": {\n    \"A02\": {\n      \"contract_version\": \"1.0.0\",\n      \"kind\": \"unconfigured\"\n    },\n    \"A03\": {\n      \"contract_version\": \"1.0.0\",\n      \"kind\": \"unconfigured\"\n    },\n    \"A04_A05\": {\n      \"contract_version\": \"1.0.0\",\n      \"kind\": \"unconfigured\"\n    },\n    \"A06\": {\n      \"contract_version\": \"1.0.0\",\n      \"kind\": \"reference\"\n    },\n    \"A07\": {\n      \"contract_version\": \"1.0.0\",\n      \"kind\": \"unconfigured\"\n    }\n  }\n}\n","sha256":"b73fe5595ae733622776dee7f2e4453657a0afb5fc86a067b141329fb42d5219"},"examples/agent_framework/workflow.synthetic.json":{"text":"{\n  \"contract_version\": \"1.0.0\",\n  \"id\": \"synthetic-approval-rereview\",\n  \"context\": {\n    \"contract_version\": \"1.0.0\",\n    \"project_id\": \"synthetic-project\",\n    \"run_id\": \"demo-run-1\",\n    \"actor_id\": \"synthetic-reviewer\",\n    \"document_version_id\": \"document-v1\",\n    \"criteria_version_id\": \"criteria-v1\",\n    \"asset_version_id\": \"poster-v1\",\n    \"parent_run_id\": null\n  },\n  \"document\": {\n    \"contract_version\": \"1.0.0\",\n    \"file_id\": \"synthetic-pdf-reference\",\n    \"document_version_id\": \"document-v1\",\n    \"sha256\": \"dbf21f8e6c7c3af1c860ae8b58a157066944aa6feced8abb0a1d19e5b5230ce1\",\n    \"media_type\": \"application/pdf\",\n    \"page_count\": 1\n  },\n  \"asset\": {\n    \"contract_version\": \"1.0.0\",\n    \"file_id\": \"synthetic-poster-v1\",\n    \"asset_version_id\": \"poster-v1\",\n    \"sha256\": \"3cc920b3991a50e0558d753bb4429fa2ddd31ceeb3268a9c286e5d2b9c62c511\",\n    \"media_type\": \"image/png\",\n    \"width\": 1200,\n    \"height\": 1600\n  },\n  \"revision_context\": {\n    \"contract_version\": \"1.0.0\",\n    \"project_id\": \"synthetic-project\",\n    \"run_id\": \"demo-run-2\",\n    \"actor_id\": \"synthetic-reviewer\",\n    \"document_version_id\": \"document-v1\",\n    \"criteria_version_id\": \"criteria-v1\",\n    \"asset_version_id\": \"poster-v2\",\n    \"parent_run_id\": \"demo-run-1\"\n  },\n  \"revision_asset\": {\n    \"contract_version\": \"1.0.0\",\n    \"file_id\": \"synthetic-poster-v2\",\n    \"asset_version_id\": \"poster-v2\",\n    \"sha256\": \"35fce4fe4d9d1fd6d94a211cb5399c3ed15e9564b59e369ca80b921f3a07cf9f\",\n    \"media_type\": \"image/png\",\n    \"width\": 1200,\n    \"height\": 1600\n  },\n  \"expected_initial_verdict\": \"pass\",\n  \"expected_revised_verdict\": \"pass\",\n  \"change_reason\": \"합성 개발 입력: 수정 승인과 새 버전의 전체 재검수를 확인합니다.\"\n}\n","sha256":"427f68a225c04f98edf1ba7966cc9da21ccbc312bb27db5d632e16ec99258c9e"}}</script><script>
(() => {
  'use strict';
  const sources=JSON.parse(document.getElementById('source-data').textContent);
  const paths=Object.keys(sources), select=document.getElementById('file'), code=document.getElementById('code');
  for(const path of paths){const option=document.createElement('option');option.value=path;option.textContent=path;select.append(option);}
  const requested=new URLSearchParams(location.search).get('file'), path=requested===null?paths[0]:requested;
  if(!Object.prototype.hasOwnProperty.call(sources,path)){
    const error=document.getElementById('error');error.hidden=false;error.textContent='묶음에 포함되지 않은 파일입니다. 목록에서 파일을 선택해 주세요.';code.hidden=true;select.selectedIndex=-1;
  }else{
    select.value=path;document.getElementById('path').textContent=path;document.getElementById('hash').textContent='SHA-256 · '+sources[path].sha256;
    const lines=sources[path].text.replace(/\r\n/g,'\n').split('\n');if(lines[lines.length-1]==='')lines.pop();
    const fragment=document.createDocumentFragment();
    lines.forEach((text,index)=>{const line=document.createElement('div'),number=document.createElement('a'),content=document.createElement('span');line.id='L'+(index+1);line.className='line';number.className='number';number.href='#'+line.id;number.textContent=String(index+1);number.setAttribute('aria-label',String(index+1)+'번째 줄');content.className='text';content.textContent=text||' ';line.append(number,content);fragment.append(line);});code.append(fragment);
  }
  select.addEventListener('change',()=>{if(Object.prototype.hasOwnProperty.call(sources,select.value))location.href='source.html?file='+encodeURIComponent(select.value)+'#L1';});
  function focusLine(){for(const line of code.querySelectorAll('.selected'))line.classList.remove('selected');if(!/^#L[1-9][0-9]*$/.test(location.hash))return;const line=document.getElementById(location.hash.slice(1));if(line){line.classList.add('selected');line.scrollIntoView({block:'center'});}}
  window.addEventListener('hashchange',focusLine);requestAnimationFrame(focusLine);
})();
</script></body></html>
