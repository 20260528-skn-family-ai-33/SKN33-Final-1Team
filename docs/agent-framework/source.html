type='application/pdf'):\n    if not isinstance(value,str): raise AuthError('PDF_FILENAME_INVALID',422)\n    value=unicodedata.normalize('NFC',value)\n    suffix='.txt' if media_type=='text/plain' else '.pdf'\n    if (not 1\u003c=len(value)\u003c=255 or value!=value.strip() or not value.lower().endswith(suffix)\n            or re.search(r'[/\\\\\\x00-\\x1f\\x7f\\ud800-\\udfff]',value)):\n        raise AuthError('PDF_FILENAME_INVALID',422)\n    return value\n\n\ndef _dto(row):\n    return RegisteredDocument(document_id=row['document_id'],project_id=row['project_id'],\n        version_no=row['version_no'],previous_version_id=row['previous_version_id'],\n        original_name=row['original_name'],byte_size=row['byte_size'],created_by=row['created_by'],\n        created_at=row['created_at'],document=DocumentRef(file_id=str(row['file_id']),\n            document_version_id=str(row['document_version_id']),sha256=row['sha256'],page_count=row['page_count'],media_type=row['media_type']))\n\n\nclass PostgresDocuments:\n    def __init__(self,engine,authorization,storage):\n        self.engine,self.authorization,self.storage=engine,authorization,storage\n        self.limits=FileLimits()\n\n    def preflight(self,subject,dev,pid,document_id=None,previous_version_id=None):\n        if (document_id is None)!=(previous_version_id is None):\n            raise AuthError('DOCUMENT_PREVIOUS_VERSION_REQUIRED',422)\n        try:\n            with unit_of_work(self.engine) as c:\n                self.authorization.project(c,subject,pid,action='write',developer_allowed=dev)\n                if document_id is not None:\n                    old=c.execute(select(versions).where(versions.c.project_id==pid,\n                        versions.c.document_id==document_id,\n                        versions.c.document_version_id==previous_version_id)).mappings().one_or_none()\n                    if old is None:raise AuthError('RESOURCE_NOT_FOUND',404)\n        except PersistenceError:raise AuthError('DATABASE_UNAVAILABLE',503) from None\n\n    def _get(self,subject,dev,pid,version_id):\n        with unit_of_work(self.engine) as c:\n            self.authorization.project(c,subject,pid,developer_allowed=dev)\n            row=c.execute(select(versions).where(versions.c.project_id==pid,\n                versions.c.document_version_id==version_id)).mappings().one_or_none()\n            if row is None:raise AuthError('RESOURCE_NOT_FOUND',404)\n            return dict(row)\n\n    def get(self,subject,dev,pid,version_id):\n        try:return _dto(self._get(subject,dev,pid,version_id))\n        except PersistenceError:raise AuthError('DATABASE_UNAVAILABLE',503) from None\n\n    def history(self,subject,dev,pid,document_id):\n        try:\n            with unit_of_work(self.engine) as c:\n                self.authorization.project(c,subject,pid,developer_allowed=dev)\n                rows=c.execute(select(versions).where(versions.c.project_id==pid,\n                    versions.c.document_id==document_id).order_by(versions.c.version_no)).mappings().all()\n                if not rows:raise AuthError('RESOURCE_NOT_FOUND',404)\n                return [_dto(r) for r in rows]\n        except PersistenceError:raise AuthError('DATABASE_UNAVAILABLE',503) from None\n\n    def content(self,subject,dev,pid,version_id):\n        try:\n            row=self._get(subject,dev,pid,version_id)\n            with self.storage.verified(row['storage_key'],row['byte_size'],row['sha256']) as stream:\n                raw=stream.read(self.limits.max_document_bytes+1)\n            if (len(raw)!=row['byte_size'] or sha256(raw).hexdigest()!=row['sha256']\n                    or inspect_requirement(raw,row['media_type'],self.limits)!=row['page_count']):\n                raise AuthError('PDF_INTEGRITY_MISMATCH',503)\n            return _dto(row),raw\n        except PersistenceError:raise AuthError('DATABASE_UNAVAILABLE',503) from None\n        except (StorageError,OSError,AdapterFailure):raise AuthError('PDF_INTEGRITY_MISMATCH',503) from None\n\n    def catalog(self,subject,dev,pid,version_id):\n        row=self._get(subject,dev,pid,version_id)\n        return StoredFileMetadata(file_id=str(row['file_id']),project_id=str(pid),\n            version_id=str(version_id),kind='text' if row['media_type']=='text/plain' else 'pdf',storage_key=row['storage_key'],\n            media_type=row['media_type'],byte_size=row['byte_size'],sha256=row['sha256'])\n\n    def _intent(self,op,pid,actor,request_key,input_hash,name,count,raw,document_id,previous,media_type='application/pdf'):\n        journal_version='af-text-journal-v1' if media_type=='text/plain' else 'af-pdf-journal-v1'\n        operation='register_text' if media_type=='text/plain' else 'register_pdf'\n        try:\n            with self.storage.read('operations/'+str(op)+'/journal.json') as stream:\n                data=stream.read(65537)\n            if len(data)\u003e65536:raise StorageError('PDF_JOURNAL_INVALID')\n            try:intent=loads(data)\n            except AuthError:raise StorageError('PDF_JOURNAL_INVALID') from None\n        except FileNotFoundError:\n            file_id=uuid4()\n            intent={'contract_version':journal_version,'operation_id':str(op),\n                'operation':operation,'project_id':str(pid),'actor_id':str(actor),\n                'request_key':str(request_key),'input_sha256':input_hash,\n                'document_id':str(document_id or uuid4()),'previous_version_id':str(previous) if previous else None,\n                'document_version_id':str(uuid4()),'original_name':name,'page_count':count,\n                'phase':'planned','db_outcome':'not_started','files':[{\n                    'file_id':str(file_id),'project_id':str(pid),'storage_key':key(pid,file_id),\n                    'byte_size':str(len(raw)),'sha256':sha256(raw).hexdigest()}]}\n            if media_type!='application/pdf':intent['media_type']=media_type\n            self.storage.journal(intent)\n        try:\n            if (intent['contract_version']!=journal_version or intent['operation_id']!=str(op)\n                    or intent['operation']!=operation or intent['project_id']!=str(pid)\n                    or intent.get('media_type','application/pdf')!=media_type):\n                raise StorageError('PDF_JOURNAL_INVALID')\n            if intent['actor_id']!=str(actor) or intent['input_sha256']!=input_hash:\n                raise AuthError('DOCUMENT_IDEMPOTENCY_CONFLICT',409)\n            item=intent['files'][0]\n            if (len(intent['files'])!=1 or intent['request_key']!=str(request_key)\n                    or intent['original_name']!=name or intent['page_count']!=count\n                    or intent['previous_version_id']!=(str(previous) if previous else None)\n                    or document_id is not None and intent['document_id']!=str(document_id)\n                    or item['project_id']!=str(pid) or item['storage_key']!=key(pid,item['file_id'])\n                    or item['byte_size']!=str(len(raw)) or item['sha256']!=sha256(raw).hexdigest()):\n                raise StorageError('PDF_JOURNAL_INVALID')\n            UUID(intent['document_id']);UUID(intent['document_version_id'])\n        except (KeyError,TypeError,ValueError,IndexError):raise StorageError('PDF_JOURNAL_INVALID') from None\n        return intent\n\n    def _publish(self,intent,raw):\n        item=intent['files'][0];target=item['storage_key']\n        try:\n            with self.storage.verified(target,len(raw),item['sha256']):pass\n            return\n        except FileNotFoundError:pass\n        except StorageError:\n            # A crash may leave this operation's staging/publication hardlink.\n            # publish verifies that both names address the same inode and bytes.\n            with self.storage.read(target,links=2):pass\n            self.storage.publish(intent['operation_id'],item)\n            return\n        stage='staging/'+intent['operation_id']+'/'+item['file_id']\n        try:\n            with self.storage.read(stage) as stream:\n                if stream.read(len(raw)+1)!=raw:raise StorageError('PDF_STAGING_CONFLICT')\n        except FileNotFoundError:self.storage.write_new(stage,raw)\n        self.storage.publish(intent['operation_id'],item)\n\n    @staticmethod\n    def _matches(row,intent):\n        item=intent['files'][0]\n        expected={\n            'document_version_id':intent['document_version_id'],'document_id':intent['document_id'],\n            'project_id':intent['project_id'],'previous_version_id':intent['previous_version_id'],\n            'created_by':intent['actor_id'],'request_key':intent['request_key'],\n            'input_sha256':intent['input_sha256'],'original_name':intent['original_name'],\n            'page_count':str(intent['page_count']),'file_id':item['file_id'],\n            'byte_size':item['byte_size'],'sha256':item['sha256'],'storage_key':item['storage_key'],\n            'media_type':intent.get('media_type','application/pdf'),\n        }\n        return all((str(row[k]) if row[k] is not None else None)==v for k,v in expected.items())\n\n    def _persist(self,subject,dev,intent):\n        pid=UUID(intent['project_id']);op=UUID(intent['operation_id'])\n        with unit_of_work(self.engine) as c:\n            self.authorization.project(c,subject,pid,action='write',developer_allowed=dev)\n            c.exec_driver_sql('SELECT pg_advisory_xact_lock(%s)',(operation_key(op),))\n            if c.exec_driver_sql('SELECT pg_is_in_recovery()').scalar_one():raise AuthError('DATABASE_UNAVAILABLE',503)\n            old=c.execute(select(versions).where(versions.c.project_id==pid,\n                versions.c.request_key==UUID(intent['request_key']))).mappings().one_or_none()\n            if old:\n                if not self._matches(old,intent):raise AuthError('DOCUMENT_IDEMPOTENCY_CONFLICT',409)\n                return dict(old)\n            doc_id=UUID(intent['document_id']);previous=intent['previous_version_id']\n            latest=c.execute(select(versions).where(versions.c.project_id==pid,\n                versions.c.document_id==doc_id).order_by(versions.c.version_no.desc()).limit(1)).mappings().one_or_none()\n            if previous:\n                if latest is None:raise AuthError('RESOURCE_NOT_FOUND',404)\n                if str(latest['document_version_id'])!=previous:raise AuthError('DOCUMENT_VERSION_CONFLICT',409)\n            elif latest is not None:raise AuthError('DOCUMENT_VERSION_CONFLICT',409)\n            number=latest['version_no']+1 if latest else 1\n            if number\u003e9223372036854775807:raise AuthError('DOCUMENT_VERSION_CONFLICT',409)\n            item=intent['files'][0]\n            row=c.execute(insert(versions).values(document_version_id=UUID(intent['document_version_id']),\n                document_id=doc_id,project_id=pid,version_no=number,\n                previous_version_id=UUID(previous) if previous else None,file_id=UUID(item['file_id']),\n                storage_key=item['storage_key'],original_name=intent['original_name'],media_type=intent.get('media_type','application/pdf'),\n                byte_size=int(item['byte_size']),sha256=item['sha256'],page_count=intent['page_count'],\n                created_by=subject.user_id,request_key=UUID(intent['request_key']),input_sha256=intent['input_sha256']\n            ).returning(versions)).mappings().one()\n            from .graph_projection import mark_project_changed\n            mark_project_changed(c,pid,'document.registered',row['document_version_id'])\n            return dict(row)\n\n    def _reconcile(self,intent):\n        # Read-only reconciliation on a new primary connection, never a write retry.\n        with unit_of_work(self.engine) as c:\n            if c.exec_driver_sql('SELECT pg_is_in_recovery()').scalar_one():return None\n            if not c.exec_driver_sql('SELECT pg_try_advisory_xact_lock(%s)',\n                    (operation_key(intent['operation_id']),)).scalar_one():return None\n            row=c.execute(select(versions).where(versions.c.project_id==UUID(intent['project_id']),\n                versions.c.request_key==UUID(intent['request_key']))).mappings().one_or_none()\n            return dict(row) if row and self._matches(row,intent) else None\n\n    def register(self,subject,dev,pid,request_key,raw,*,filename='document.pdf',document_id=None,previous_version_id=None,media_type='application/pdf'):\n        self.preflight(subject,dev,pid,document_id,previous_version_id)\n        if media_type not in ('application/pdf','text/plain'):raise AuthError('UNSUPPORTED_MEDIA_TYPE',415)\n        if media_type=='text/plain':\n            from .postgres_schema import check_extension\n            with unit_of_work(self.engine) as c:\n                if check_extension(c)['revision'] not in ('AF004','AF005'):raise AuthError('FRAMEWORK_TEXT_SCHEMA_NOT_READY',503)\n        name=_name(filename,media_type)\n        try:count=inspect_requirement(raw,media_type,self.limits)\n        except AdapterFailure as e:raise AuthError(e.code,413 if e.code=='FILE_TOO_LARGE' else 422) from None\n        fixed={'project_id':str(pid),'actor_id':str(subject.user_id),'sha256':sha256(raw).hexdigest(),\n            'byte_size':len(raw),'page_count':count,'filename':name,'document_id':str(document_id) if document_id else None,\n            'previous_version_id':str(previous_version_id) if previous_version_id else None}\n        if media_type!='application/pdf':fixed['media_type']=media_type\n        fingerprint=sha256(json.dumps(fixed,sort_keys=True,ensure_ascii=False).encode()).hexdigest()\n        op=uuid5(NAMESPACE_URL,('creative-checker-text:' if media_type=='text/plain' else 'creative-checker-pdf:')+str(pid)+':'+str(request_key))\n        try:\n            with self.storage.lock('operation-'+str(op)):\n                intent=self._intent(op,pid,subject.user_id,request_key,fingerprint,name,count,raw,document_id,previous_version_id,media_type)\n                self._publish(intent,raw)\n                intent.update(phase='finalized',db_outcome='unconfirmed');self.storage.journal(intent)\n                try:row=self._persist(subject,dev,intent)\n                except PersistenceError:\n                    row=self._reconcile(intent)\n                    if row is None:raise AuthError('DOCUMENT_UPLOAD_OUTCOME_UNCONFIRMED',503) from None\n                intent['db_outcome']='committed';self.storage.journal(intent)\n                # Recheck the session/project at the final response boundary.\n                return self.get(subject,dev,pid,row['document_version_id'])\n        except PersistenceError:raise AuthError('DOCUMENT_UPLOAD_OUTCOME_UNCONFIRMED',503) from None\n        except (StorageError,OSError):raise AuthError('DOCUMENT_STORAGE_UNAVAILABLE',503) from None\n\n\nclass RegisteredProjectCatalog:\n    \"\"\"Worker-facing catalog; binds an authenticated identity, not request actor IDs.\"\"\"\n    def __init__(self,documents,subject,*,developer_allowed=False):\n        self.documents,self.subject,self.dev=documents,subject,developer_allowed\n        from .adapters.project_files import LegacyPosterCatalog\n        self.posters=LegacyPosterCatalog(documents.engine,documents.authorization,subject,developer_allowed)\n\n    def lookup_document(self,context,reference):\n        from .adapters.project_files import _authorize_error\n        if context.actor_id!=str(self.subject.user_id):raise AdapterFailure('FILE_ACCESS_DENIED','The bound identity cannot access this file.')\n        if context.document_version_id!=reference.document_version_id:\n            raise AdapterFailure('FILE_REFERENCE_MISMATCH','The document version does not match.')\n        try:return self.documents.catalog(self.subject,self.dev,UUID(context.project_id),UUID(reference.document_version_id))\n        except AuthError as e:_authorize_error(e)\n        except (PersistenceError,ValueError):raise AdapterFailure('FILE_STORAGE_UNAVAILABLE','Document metadata could not be read.') from None\n\n    def lookup_asset(self,context,reference):return self.posters.lookup_asset(context,reference)\n","sha256":"8ff7352ea247be75f4b954cd9442938cf154886e4c37471bb6180b640b1a3194"},"backend/agent_framework/durable_worker.py":{"text":"\"\"\"Fenced PostgreSQL role worker. Inference never holds a DB transaction.\n\nExpired claims without an in-flight role can resume committed results. A running\nrole marker means a call MAY have happened: never replay it automatically.\n\"\"\"\nfrom dataclasses import dataclass\nfrom datetime import timedelta\nfrom threading import Event, Thread\nfrom time import perf_counter_ns\nfrom uuid import uuid4\nfrom typing import TypedDict\n\nfrom sqlalchemy import select,insert,update,func\nfrom langgraph.graph import StateGraph,START,END\n\nfrom backend.app.persistence.transaction import unit_of_work\nfrom backend.app.persistence.database import PersistenceError\nfrom backend.app.security.errors import AuthError\nfrom backend.app.services.business import table as business_table\nfrom .contracts import (RunSnapshot,StepRecord,FrameworkError,ExtractRequest,\n    InspectRequest,ValidateRequest,ReportRequest)\nfrom .invocation import ROLE_CONTRACTS,InvocationFailure,invoke_role,accept_role_output\nfrom .postgres import runs,jobs,steps,payload,digest\nfrom .runtime import Workflow,_boundary\n\nPHASE_ROLES={'extract':('A02',),'review':('A04_A05','A06','A07')}\nRESULT_FIELDS={'A02':'criteria','A04_A05':'inspection','A06':'validated','A07':'report'}\n\n\ndef stage_request(snapshot,fixed,role):\n    context=snapshot.context\n    if role=='A02':return ExtractRequest(context=context,document=fixed['document'],synthetic=snapshot.synthetic)\n    if role=='A07':return ReportRequest(context=context,validated=snapshot.validated,evidence=snapshot.evidence,synthetic=snapshot.synthetic)\n    request=InspectRequest(context=context,criteria=snapshot.criteria.criteria,asset=fixed['asset'],\n                           evidence=snapshot.evidence,synthetic=snapshot.synthetic)\n    if role=='A04_A05':return request\n    return ValidateRequest(**payload(request),inspection=snapshot.inspection)\n\n\n@dataclass(frozen=True)\nclass Claim:\n    job_id: object\n    run_id: str\n    project_id: object\n    phase: str\n    token: object\n\n\nclass PostgresQueue:\n    def __init__(self,store,*,lease_seconds=90,graph=None):\n        if type(lease_seconds) is not int or not 1\u003c=lease_seconds\u003c=3600:raise ValueError('invalid lease')\n        self.store,self.engine,self.lease_seconds=store,store.engine,lease_seconds\n        self.graph=graph\n\n    def _lock(self,c,claim,*,skip=False):\n        project=business_table('projects')\n        if c.execute(select(project.c.project_id).where(project.c.project_id==claim.project_id)\n                     .with_for_update(key_share=True,skip_locked=skip)).scalar_one_or_none() is None:return None\n        run=c.execute(select(runs).where(runs.c.run_id==claim.run_id).with_for_update(skip_locked=skip)).mappings().one_or_none()\n        job=c.execute(select(jobs).where(jobs.c.job_id==claim.job_id).with_for_update(skip_locked=skip)).mappings().one_or_none()\n        if not run or not job:return None\n        return dict(run),dict(job)\n\n    def _live(self,c,claim,*,authorize=True):\n        rows=self._lock(c,claim)\n        if rows is None:raise AuthError('FRAMEWORK_AUTHORITY_LOST',409)\n        run,job=rows\n        now=c.execute(select(func.clock_timestamp())).scalar_one()\n        if (job['state']!='running' or job['worker_token']!=claim.token or job['lease_expires_at']\u003c=now\n            or run['configuration_sha256']!=self.store.config_hash or run['runtime_sha256']!=self.store.runtime_hash):\n            raise AuthError('FRAMEWORK_AUTHORITY_LOST',409)\n        if authorize:\n            self.store.worker_access(c,run['project_id'],run['actor_id'])\n            if run['input_json'].get('baseline') is not None:\n                from .poster_review import validate_pinned_review\n                validate_pinned_review(self.store,c,run)\n        return run,job,now\n\n    def claim_next(self):\n        claim=None\n        with unit_of_work(self.engine) as c:\n            candidates=c.execute(select(jobs).join(runs,runs.c.run_id==jobs.c.run_id).where(\n                jobs.c.state=='queued',runs.c.configuration_sha256==self.store.config_hash,\n                runs.c.runtime_sha256==self.store.runtime_hash).order_by(jobs.c.created_at,jobs.c.job_id).limit(64)).mappings().all()\n            for candidate in candidates:\n                candidate=Claim(candidate['job_id'],candidate['run_id'],candidate['project_id'],candidate['phase'],None)\n                locked=self._lock(c,candidate,skip=True)\n                if locked is None:continue\n                run,job=locked\n                if job['state']!='queued':continue\n                now=c.execute(select(func.clock_timestamp())).scalar_one()\n                if job['attempt_no']\u003e=3:\n                    self._close(c,run,job,FrameworkError(code='ATTEMPT_LIMIT_EXCEEDED',message='The safe claim limit was reached.'))\n                    continue\n                try:\n                    self.store.worker_access(c,run['project_id'],run['actor_id'])\n                    if run['input_json'].get('baseline') is not None:\n                        from .poster_review import validate_pinned_review\n                        validate_pinned_review(self.store,c,run)\n                except AuthError as error:\n                    self._close(c,run,job,FrameworkError(code=error.code,message='Project access or the pinned input is no longer valid.'))\n                    continue\n                token=uuid4()\n                c.execute(update(jobs).where(jobs.c.job_id==job['job_id']).values(state='running',attempt_no=job['attempt_no']+1,\n                    worker_token=token,lease_expires_at=now+timedelta(seconds=self.lease_seconds),heartbeat_at=now))\n                snapshot=RunSnapshot.model_validate(run['snapshot_json'])\n                self.store._save(c,snapshot.model_copy(update={'execution_status':'extracting' if job['phase']=='extract' else 'reviewing'}))\n                self.store.event(c,run['run_id'],'job.claimed',phase=job['phase'],attempt=job['attempt_no']+1)\n                claim=Claim(job['job_id'],job['run_id'],job['project_id'],job['phase'],token)\n                break\n        # Only a confirmed commit returns authority to invoke any adapter.\n        return claim\n\n    def heartbeat(self,claim):\n        with unit_of_work(self.engine) as c:\n            _run,_job,now=self._live(c,claim)\n            c.execute(update(jobs).where(jobs.c.job_id==claim.job_id).values(\n                heartbeat_at=now,lease_expires_at=now+timedelta(seconds=self.lease_seconds)))\n\n    def begin_step(self,claim,role):\n        with unit_of_work(self.engine) as c:\n            run,job,now=self._live(c,claim)\n            snapshot=RunSnapshot.model_validate(run['snapshot_json'])\n            completed={s.role for s in snapshot.step_records if s.status in ('completed','reused')}\n            remaining=[r for r in PHASE_ROLES[job['phase']] if r not in completed]\n            if not remaining or remaining[0]!=role:raise AuthError('FRAMEWORK_STAGE_CONFLICT',409)\n            if any(s.status=='running' for s in snapshot.step_records):raise AuthError('FRAMEWORK_CALL_ALREADY_STARTED',409)\n            if role=='A04_A05' and self.store.configuration.context_preparation is not None:\n                from .evidence_context import stored\n                if stored(c,claim.run_id) is None:raise AuthError('EVIDENCE_CONTEXT_NOT_READY',409)\n            request=stage_request(snapshot,run['input_json'],role)\n            record=StepRecord(ordinal=len(snapshot.step_records)+1,role=role,status='running',\n                              recorded_at=now,started_at=now,synthetic=snapshot.synthetic)\n            c.execute(insert(steps).values(run_id=run['run_id'],ordinal=record.ordinal,role=role,state='running',\n                                           record_json=payload(record),input_sha256=digest(request)))\n            self.store._save(c,snapshot.model_copy(update={'step_records':snapshot.step_records+(record,)}))\n            self.store.event(c,run['run_id'],'step.started',role=role,ordinal=record.ordinal)\n        return request\n\n    def complete_step(self,claim,role,request,result,duration_ms):\n        with unit_of_work(self.engine) as c:\n            run,job,now=self._live(c,claim)\n            snapshot=RunSnapshot.model_validate(run['snapshot_json'])\n            record=snapshot.step_records[-1]\n            stored=c.execute(select(steps).where(steps.c.run_id==run['run_id'],steps.c.role==role)).mappings().one()\n            if (record.role!=role or record.status!='running' or stored['state']!='running'\n                    or stored['input_sha256']!=digest(request)):raise AuthError('FRAMEWORK_STAGE_CONFLICT',409)\n            result=accept_role_output(role,request,result)\n            if role=='A02' and self.store.configuration.pdf_extraction is not None:\n                settings=self.store.configuration.pdf_extraction;trace=result.extraction\n                expected_model='mock-line-fixture-v1' if settings.mode=='mock' else settings.model\n                expected_policy=('a02-text-v1' if settings.mode=='mock' else\n                    ('a02-semantic-v4' if settings.presentation else 'a02-semantic-v3') if settings.structuring=='semantic' else 'a02-source-compile-v2')\n                if (trace is None or trace.mode!=settings.mode or trace.model!=expected_model\n                        or trace.policy!=expected_policy\n                        or trace.parser!=('utf8-source-v1' if request.document.media_type=='text/plain' else 'pymupdf-'+settings.parser_version)\n                        or sum(len(s.text) for s in trace.sources)\u003esettings.max_text_chars):\n                    raise ValueError(' 'outcome_unknown' if error.outcome_unknown else 'failed',\n                'finished_at':max(now,record.started_at),\n                'duration_ms':None if error.outcome_unknown else (duration_ms if duration_ms is not None else max(0,(now-record.started_at).total_seconds()*1000)),'error':error})\n            c.execute(update(steps).where(steps.c.run_id==run['run_id'],steps.c.ordinal==record.ordinal).values(\n                state=closed.status,record_json=payload(closed)))\n            records=records[:-1]+(closed,)\n        status='outcome_unknown' if error.outcome_unknown else 'failed'\n        top=error.model_copy(update={'code':top_code}) if top_code else error\n        self.store._save(c,snapshot.model_copy(update={'execution_status':status,'error':top,'step_records':records}))\n        self._finish_job(c,job,status,error=error)\n        self.store.event(c,run['run_id'],'job.'+status,code=error.code)\n\n    def fail(self,claim,exc,*,duration_ms=None):\n        error=Workflow._step_error(exc)\n        if isinstance(exc,AuthError) and exc.code=='FRAMEWORK_ACCESS_REVOKED':\n            error=error.model_copy(update={'code':exc.code})\n        with unit_of_work(self.engine) as c:\n            run,job,_now=self._live(c,claim,authorize=False)\n            self._close(c,run,job,error,top_code='contract_violation' if isinstance(exc,InvocationFailure) else None,duration_ms=duration_ms)\n\n    def recover_expired(self):\n        recovered={}\n        with unit_of_work(self.engine) as c:\n            candidates=c.execute(select(jobs).where(jobs.c.state=='running',jobs.c.lease_expires_at\u003c=func.clock_timestamp())\n                                 .order_by(jobs.c.lease_expires_at).limit(64)).mappings().all()\n            for row in candidates:\n                claim=Claim(row['job_id'],row['run_id'],row['project_id'],row['phase'],row['worker_token'])\n                locked=self._lock(c,claim,skip=True)\n                if locked is None:continue\n                run,j tr\n\n\ndef execute_claim(queue,claim,agents,*,heartbeat_seconds=15,stop=None):\n    \"\"\"LangGraph schedules roles; committed PostgreSQL rows own resume decisions.\n\n    A stop between committed roles safely releases the lease via expiry. No\n    LangGraph checkpoint is claimed to share the business transaction.\n    \"\"\"\n    with Lease(queue,claim,heartbeat_seconds) as authority:\n        def execute_role(role):\n            if stop is not None and stop.is_set():return 'draining'\n            started=None\n            try:\n                authority.check()\n                with unit_of_work(queue.engine) as c:\n                    run,_job,_now=queue._live(c,claim)\n                    snapshot=RunSnapshot.model_validate(run['snapshot_json'])\n                if any(s.role==role and s.status=='completed' for s in snapshot.step_records):return 'continue'\n                if role=='A04_A05':\n                    from .evidence_context import prepare_for_claim\n                    prepare_for_claim(queue,claim)\n                request=queue.begin_step(claim,role)\n                started=perf_counter_ns()\n                result=invoke_role(role,getattr(agents,ROLE_CONTRACTS[role][0]),request)\n                duration=max(0,perf_counter_ns()-started)/1_000_000\n                authority.check()\n                queue.complete_step(claim,role,request,result,duration)\n            except PersistenceError:\n                # COMMIT may have succeeded. Do not guess, fail another step, or\n                # call the provider again. The lease/recovery path reconciles it.\n                return 'database_unavailable'\n            except Exception as exc:\n                if isinstance(exc,AuthError) and exc.code=='FRAMEWORK_AUTHORITY_LOST':\n                    return 'authority_lost'\n                try:\n                    queue.fail(claim,exc,duration_ms=max(0,perf_counter_ns()-started)/1_000_000 if started is not None else None)\n                except (AuthError,PersistenceError):return 'authority_lost'\n                return 'outcome_unknown' if getattr(exc,'outcome_unknown',False) else 'failed'\n            return 'continue'\n        graph=StateGraph(_PhaseState)\n        roles=PHASE_ROLES[claim.phase]\n        for role in roles:\n            def node(_state,role=role):return {'outcome':execute_role(role)}\n            graph.add_node(role,node)\n        graph.add_edge(START,roles[0])\n        for index,role in enumerate(roles):\n            following=roles[index+1] if index+1\u003clen(roles) else END\n            graph.add_conditional_edges(role,lambda state:'next' if state['outcome']=='continue' else 'stop',\n                                        {'next':following,'stop':END})\n        result=graph.compile().invoke({'outcome':'continue'},{'recursion_limit':12})\n        return 'completed' if result['outcome']=='continue' else result['outcome']\n","sha256":"6b1d3a0928780024427582ebadb9b34c1180a269451c3bf4f4abf71ee4610b31"},"backend/agent_framework/evidence_context.py":{"text":"\"\"\"PG -\u003e fixed Neo4j query -\u003e PG revalidation -\u003e immutable 3.0.0 evidence.\n\nOnly approved original/value sources enter model input in this policy. Relationship\nhistory is an audit query, never a substitute for observations or a new approval.\n\"\"\"\nimport json\nfrom time import perf_counter\nfrom uuid import UUID\n\nfrom sqlalchemy import text\nfrom backend.app.persistence.transaction import unit_of_work\nfrom backend.app.security.errors import AuthError\nfrom .contracts import EvidenceBundle,RunSnapshot\nfrom .context import freeze_approved_context\nfrom .postgres import digest,payload\nfrom .graph_projection import source_rows\nfrom .graph_store import FrameworkGraph,GraphUnavailable\n\nPOLICY='af-approved-sources-v1'\n\n\ndef enabled(configuration):\n    return configuration.context_preparation is not None\n\n\ndef stored(c,run_id):\n    return c.execute(text('SELECT input_sha256,context_json,context_sha256,trace_json '\n        'FROM agent_framework.evidence_contexts WHERE run_id=:r'),{'r':run_id}).mappings().one_or_none()\n\n\ndef check_stored(c,row,snapshot,base):\n    record=stored(c,row['run_id'])\n    if (record is None or record['input_sha256']!=row['input_sha256']\n            or digest(record['context_json'])!=record['context_sha256']):\n        raise AuthError('EVIDENCE_CONTEXT_INTEGRITY_INVALID',503)\n    bundle=EvidenceBundle.model_validate(record['context_json'])\n    if (snapshot.evidence!=bundle or bundle.context!=base.context or bundle.evidence!=base.evidence\n            or bundle.synthetic!=base.synthetic or record['trace_json'].get('policy')!=POLICY):\n        raise AuthError('EVIDENCE_CONTEXT_INTEGRITY_INVALID',503)\n    from .validation import validate_evidence\n    validate_evidence(snapshot.context,snapshot.criteria.criteria,bundle)\n    return record\n\n\ndef _authoritative(c,queue,claim):\n    from .criteria_review import PostgresCriteriaReview\n    row,_job,_now=queue._live(c,claim)\n    snapshot=RunSnapshot.model_validate(row['snapshot_json'])\n    baseline=row['input_json'].get('baseline')\n    if baseline is None:raise AuthError('APPROVED_BASELINE_REQUIRED',409)\n    approved=PostgresCriteriaReview(queue.store)._approved(c,baseline['source_run_id'])\n    criteria=approved.criteria.version.criteria\n    base=freeze_approved_context(snapshot.context,criteria,synthetic=snapshot.synthetic)\n    state=c.execute(text('SELECT revision FROM agent_framework.graph_state WHERE project_id=:p'),\n        {'p':claim.project_id}).scalar_one_or_none()\n    if state is None:raise AuthError('FRAMEWORK_GRAPH_SCHEMA_NOT_READY',503)\n    return row,snapshot,base,state,source_rows(baseline['criteria_version_id'],[payload(x) for x in criteria])\n\n\ndef prepare_for_claim(queue,claim):\n    if not enabled(queue.store.configuration):return\n    started=perf_counter()\n    with unit_of_work(queue.engine) as c:\n        row,snapshot,base,revision,expected=_authoritative(c,queue,claim)\n        if snapshot.evidence and snapshot.evidence.context_id.startswith('rag-'):\n            check_stored(c,row,snapshot,base)\n            return\n        if any(s.status=='running' for s in snapshot.step_records):raise AuthError('FRAMEWORK_CALL_ALREADY_STARTED',409)\n        version_id=snapshot.context.criteria_version_id\n    own=queue.graph is None;graph=queue.graph or FrameworkGraph()\n    observed=None;backend='neo4j';fallback=None;graph_relations=None\n    try:\n        result=graph.approved_sources(str(claim.project_id),version_id)\n        observed=result['revision']\n        if observed!=revision:raise GraphUnavailable('GRAPH_REVISION_MISMATCH')\n        if result['sources']!=expected:raise GraphUnavailable('GRAPH_SOURCE_MISMATCH')\n        graph_relations=result.get('relations')\n    except GraphUnavailable as error:\n        backend='postgresql';fallback=error.code\n    finally:\n        if own:graph.close()\n    # No PG transaction was open while the derived store was queried.\n    with unit_of_work(queue.engine) as c:\n        row,snapshot,confirmed,current_revision,current_sources=_authoritative(c,queue,claim)\n        if snapshot.evidence and snapshot.evidence.context_id.startswith('rag-'):\n            check_stored(c,row,snapshot,confirmed);return\n        if confirmed!=base or current_sources!=expected:\n            raise AuthError('EVIDENCE_SOURCE_CHANGED',409)\n        if current_revision!=revision:\n            backend='postgresql';fallback='POSTGRES_REVISION_CHANGED'\n        revision=current_revision\n        from .graph_projection import criteria_impact\n        history=criteria_impact(c,claim.project_id,version_id,confirmed.evidence[0].criterion_ids[0])\n        relations={'run_ids':sorted(r['run_id'] for r in history['runs']),\n            'approval_ids':sorted(r['approval_id'] for r in history['approvals']),\n            'truncated':history['truncated']}\n        if backend=='neo4j' and graph_relations!=relations:\n            backend='postgresql';fallback='GRAPH_RELATION_MISMATCH'\n        # SQL fallback is restricted to precisely the same approved-source relation.\n        trace={'policy':POLICY,'backend':backend,'fallback_reason':fallback,\n            'required_revision':revision,'observed_graph_revision':observed,\n            'source_keys':current_sources,'baseline_sha256':digest(row['input_json']['baseline']),\n            'relations':relations,\n            'elapsed_ms':round((perf_counter()-started)*1000,3)}\n        identity={'input':row['input_sha256'],'revision':revision,'sources':current_sources,'policy':POLICY}\n        bundle=confirmed.model_copy(update={'context_id':'rag-'+digest(identity),\n            'postgres_revision':revision,'graph_revision':observed if backend=='neo4j' else None,\n            'warnings':('Approved original/value sources only; historical decisions are not model evidence.',)+\n                ((f'PostgreSQL equivalent-query fallback: {fallback}',) if fallback else ())})\n        bundle=EvidenceBundle.model_validate(payload(bundle))\n        c.execute(text('INSERT INTO agent_framework.evidence_contexts '\n            '(run_id,input_sha256,context_json,context_sha256,trace_json) '\n            'VALUES(:r,:i,CAST(:c AS jsonb),:h,CAST(:t AS jsonb))'),\n            {'r':claim.run_id,'i':row['input_sha256'],'c':json.dumps(payload(bundle)),\n             'h':digest(bundle),'t':json.dumps(trace)})\n        queue.store._save(c,snapshot.model_copy(update={'evidence':bundle}))\n        queue.store.event(c,claim.run_id,'context.prepared',backend=backend,context_sha256=digest(bundle))\n\n\ndef read_context(store,subject,run_id):\n    with unit_of_work(store.engine) as c:\n        row=store._row(c,run_id);snapshot=RunSnapshot.model_validate(row['snapshot_json'])\n        store._access(c,subject,snapshot.context,write=False)\n        from .graph_projection import installed\n        if not installed(c):raise AuthError('FRAMEWORK_GRAPH_SCHEMA_NOT_READY',503)\n        record=stored(c,run_id)\n        if record is None:raise AuthError('EVIDENCE_CONTEXT_NOT_READY',409)\n        from .poster_review import validate_pinned_review\n        validate_pinned_review(store,c,row)\n        return {'evidence':record['context_json'],'sha256':record['context_sha256'],'retrieval':record['trace_json']}\n","sha256":"2cb66ab019a0314cc323175130d4671d72d60f9ce7f77d46abd8e1a354bef92f"},"backend/agent_framework/files.py":{"text":"\"\"\"Read existing stored media by authorized metadata, then verify actual bytes.\n\nThis module owns no uploads, storage roots, database connections or credentials.\nCatalogs must authorize a trusted caller and bind a file to its immutable version.\nModel adapters receive verified bytes, never an arbitrary request-supplied path.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom hashlib import sha256\nfrom io import BytesIO\nfrom typing import Literal, Protocol\nimport warnings\n\nfrom pydantic import BaseModel, Field\n\nfrom .contracts import AssetRef, Context, Contract, DocumentRef, Hash, Identifier\nfrom .ports import AdapterFailure\n\n\nclass StoredFileMetadata(Contract):\n    \"\"\"Internal catalog result; storage_key is not part of the role request API.\"\"\"\n    file_id: Identifier\n    project_id: Identifier\n    version_id: Identifier\n    kind: Literal[\"pdf\", \"text\", \"poster\"]\n    storage_key: str = Field(min_length=1, repr=False)\n    media_type: Literal[\"application/pdf\", \"text/plain\", \"image/png\", \"image/jpeg\", \"image/webp\"]\n    byte_size: int = Field(gt=0, strict=True)\n    sha256: Hash\n    width: int | None = Field(default=None, gt=0, strict=True)\n    height: int | None = Field(default=None, gt=0, strict=True)\n    coordinate_space: Literal[\"encoded\", \"display\"] = \"display\"\n\n\nclass FileCatalog(Protocol):\n    def lookup_document(self, context: Context, reference: DocumentRef) -\u003e StoredFileMetadata: ...\n    def lookup_asset(self, context: Context, reference: AssetRef) -\u003e StoredFileMetadata: ...\n\n\nclass StoredBytes(Protocol):\n    def read(self, metadata: StoredFileMetadata, maximum: int) -\u003e bytes:\n        \"\"\"Read at most maximum + 1 bytes using the existing storage backend.\"\"\"\n        ...\n\n\n@dataclass(frozen=True)\nclass FileLimits:\n    max_document_bytes: int = 20 * 1024 * 1024\n    max_document_pages: int = 50\n    max_asset_bytes: int = 40 * 1024 * 1024\n    max_image_pixels: int = 10_000_000\n    max_image_dimension: int = 8192\n\n    def __post_init__(self):\n        if any(type(value) is not int or value \u003c= 0 for value in vars(self).values()):\n            raise ValueError(\"File limits must be positive integers\")\n\n\n@dataclass(frozen=True)\nclass VerifiedDocument:\n    context: Context\n    reference: DocumentRef\n    content: bytes = field(repr=False)\n    page_count: int\n\n    @property\n    def byte_size(self) -\u003e int:\n        return len(self.content)\n\n\n@dataclass(frozen=True)\nclass VerifiedPoster:\n    context: Context\n    reference: AssetRef\n    content: bytes = field(repr=False)\n    width: int\n    height: int\n    encoded_width: int\n    encoded_height: int\n    exif_orientation: int\n    coordinate_space: Literal[\"encoded\", \"display\"]\n\n    @property\n    def byte_size(self) -\u003e int:\n        return len(self.content)\n\n\ndef _fail(code: str, message: str):\n    raise AdapterFailure(code, message)\n\n\ndef _checked(model, value, *, metadata=False):\n    try:\n        if isinstance(value, BaseModel):\n            if not isinstance(value, model):\n                raise ValueError(\"unexpected contract\")\n            value = value.model_dump(mode=\"python\", warnings=False)\n        return model.model_validate(value).model_copy(deep=True)\n    except (ValueError, TypeError):\n        _fail(\"FILE_METADATA_INVALID\" if metadata else \"CONTRACT_INVALID\",\n              \"The file metadata or reference does not match its contract.\")\n\n\ndef inspect_document(content: bytes, limits: FileLimits | None = None) -\u003e int:\n    \"\"\"Shared upload/read PDF container check; no OCR, model, rendering or writes.\"\"\"\n    limits = limits or FileLimits()\n    if not isinstance(content, bytes) or not content.startswith(b\"%PDF-\"):\n        _fail(\"FILE_FORMAT_INVALID\", \"The document is not a readable PDF.\")\n    if len(content) \u003e limits.max_document_bytes:\n        _fail(\"FILE_TOO_LARGE\", \"The PDF exceeds the configured byte limit.\")\n    import pymupdf\n    try:\n        with pymupdf.open(stream=content, filetype=\"pdf\") as document:\n            if document.is_encrypted or document.needs_pass or document.page_count \u003c 1:\n                _fail(\"FILE_FORMAT_INVALID\", \"An unencrypted PDF with readable pages is required.\")\n            if document.page_count \u003e limits.max_document_pages:\n                _fail(\"FILE_TOO_LARGE\", \"The PDF exceeds the configured page limit.\")\n            count = document.page_count\n            for page in document:\n                if page.rect.is_empty or page.rect.is_infinite:\n                    _fail(\"FILE_FORMAT_INVALID\", \"The PDF contains an invalid page.\")\n    except AdapterFailure:\n        raise\n    except Exception:\n        _fail(\"FILE_FORMAT_INVALID\", \"The PDF container could not be read.\")\n    return count\n\n\nclass VerifiedFileAccess:\n    \"\"\"Resolve one authorized file/version and verify the bytes actually returned.\n\nConstruction performs no I/O. A catalog must bind an authenticated actor outside\nContext; the actor_id sent in a role request is not proof of authorization.\n\"\"\"\n    def __init__(self, catalog: FileCatalog, reader: StoredBytes, *, limits: FileLimits | None = None):\n        self.catalog, self.reader = catalog, reader\n        self.limits = limits or FileLimits()\n\n    def _metadata(self, context, reference, kind):\n        try:\n            lookup = self.catalog.lookup_document if kind in (\"pdf\",\"text\") else self.catalog.lookup_asset\n            metadata = _checked(StoredFileMetadata, lookup(context.model_copy(deep=True),\n                                                          reference.model_copy(deep=True)), metadata=True)\n        except AdapterFailure:\n            raise\n        except Exception:\n            _fail(\"FILE_UNAVAILABLE\", \"Authorized file metadata could not be resolved.\")\n        if metadata.project_id != context.project_id:\n            _fail(\"FILE_SCOPE_MISMATCH\", \"The file belongs to a different project.\")\n        if metadata.file_id != reference.file_id or metadata.kind != kind:\n            _fail(\"FILE_REFERENCE_MISMATCH\", \"The file does not match the requested media reference.\")\n        version = reference.document_version_id if kind in (\"pdf\",\"text\") else reference.asset_version_id\n        if metadata.version_id != version:\n            _fail(\"FILE_VERSION_MISMATCH\", \"The file is not bound to the requested version.\")\n        if metadata.media_type != reference.media_type:\n            _fail(\"FILE_MEDIA_TYPE_MISMATCH\", \"The stored media type differs from the reference.\")\n        if metadata.sha256 != reference.sha256:\n            _fail(\"FILE_HASH_MISMATCH\", \"The stored hash differs from the reference.\")\n        if kind == \"poster\":\n            if metadata.width is None or metadata.height is None:\n                _fail(\"FILE_METADATA_INVALID\", \"Poster metadata must specify its coordinate dimensions.\")\n            if (metadata.width, metadata.height) != (reference.width, reference.height):\n                _fail(\"IMAGE_DIMENSIONS_MISMATCH\", \"Poster dimensions differ from the reference.\")\n        return metadata\n\n    def _bytes(self, metadata, maximum):\n        if metadata.byte_size \u003e maximum:\n            _fail(\"FILE_TOO_LARGE\", \"The stored file exceeds the configured byte limit.\")\n        try:\n            content = self.reader.read(metadata.model_copy(deep=True), maximum)\n        except AdapterFailure:\n            raise\n        except Exception:\n            _fail(\"FILE_UNAVAILABLE\", \"The stored file could not be read.\")\n        if not isinstance(content, bytes):\n            _fail(\"FILE_FORMAT_INVALID\", \"The storage reader must return immutable bytes.\")\n        if len(content) \u003e maximum:\n            _fail(\"FILE_TOO_LARGE\", \"The file exceeds the configured byte limit.\")\n        if len(content) != metadata.byte_size:\n            _fail(\"FILE_SIZE_MISMATCH\", \"The file length differs from stored metadata.\")\n        if sha256(content).hexdigest() != metadata.sha256:\n            _fail(\"FILE_HASH_MISMATCH\", \"The actual file bytes differ from the stored hash.\")\n        return content\n\n    def read_document(self, context: Context, reference: DocumentRef) -\u003e VerifiedDocument:\n        context, reference = _checked(Context, context), _checked(DocumentRef, reference)\n        if context.document_version_id != reference.document_version_id:\n            _fail(\"DOCUMENT_VERSION_MISMATCH\", \"The document reference differs from the execution context.\")\n        metadata = self._metadata(context, reference, \"text\" if reference.media_type=='text/plain' else \"pdf\")\n        content = self._bytes(metadata, self.limits.max_document_bytes)\n        from .requirement_text import inspect_requirement\n        count = inspect_requirement(content,reference.media_type,self.limits)\n        if count != reference.page_count:\n            _fail(\"PDF_PAGE_COUNT_MISMATCH\", \"The PDF page count differs from the reference.\")\n        return VerifiedDocument(context, reference, content, count)\n\n    def read_asset(self, context: Context, reference: AssetRef) -\u003e VerifiedPoster:\n        context, reference = _checked(Context, context), _checked(AssetRef, reference)\n        if context.asset_version_id != reference.asset_version_id:\n            _fail(\"ASSET_VERSION_MISMATCH\", \"The asset reference differs from the execution context.\")\n        metadata = self._metadata(context, reference, \"poster\")\n        content = self._bytes(metadata, self.limits.max_asset_bytes)\n        from PIL import Image\n\n        try:\n            with warnings.catch_warnings():\n                warnings.simplefilter(\"error\", Image.DecompressionBombWarning)\n                with Image.open(BytesIO(content)) as image:\n                    mime = {\"PNG\": \"image/png\", \"JPEG\": \"image/jpeg\", \"WEBP\": \"image/webp\"}.get(image.format)\n                    if mime is None or getattr(image, \"n_frames\", 1) != 1:\n                        _fail(\"FILE_FORMAT_INVALID\", \"A static PNG, JPEG or WebP poster is required.\")\n                    if mime != reference.media_type:\n                        _fail(\"FILE_MEDIA_TYPE_MISMATCH\", \"The actual image format differs from the reference.\")\n                    encoded_width, encoded_height = image.size\n                    if (min(image.size) \u003c 1 or max(image.size) \u003e self.limits.max_image_dimension\n                            or encoded_width * encoded_height \u003e self.limits.max_image_pixels):\n                        _fail(\"FILE_TOO_LARGE\", \"The poster exceeds the configured pixel limits.\")\n                    image.verify()\n                with Image.open(BytesIO(content)) as image:\n                    image.load()\n                    orientation = image.getexif().get(274, 1)\n                    if type(orientation) is not int or orientation not in range(1, 9):\n                        _fail(\"FILE_FORMAT_INVALID\", \"The poster contains an invalid orientation.\")\n        except AdapterFailure:\n            raise\n        except Exception:\n            _fail(\"FILE_FORMAT_INVALID\", \"The poster image could not be decoded.\")\n        width, height = encoded_width, encoded_height\n        if metadata.coordinate_space == \"display\" and orientation in {5, 6, 7, 8}:\n            width, height = height, width\n        if (width, height) != (reference.width, reference.height):\n            _fail(\"IMAGE_DIMENSIONS_MISMATCH\", \"The actual poster dimensions differ from the reference.\")\n        return VerifiedPoster(context, reference, content, width, height, encoded_width,\n                              encoded_height, orientation, metadata.coordinate_space)\n","sha256":"a2a245ca02b4a7dc6d4c82c1277137e980a80280e4e1212dfb7e8f751a465c49"},"backend/agent_framework/flow_checks.py":{"text":"\"\"\"Explicit development rehearsal of configured approval/re-review workflows.\n\nApprovals are scripted test inputs. The command may invoke real developer-owned\nadapters if explicitly configured; it never proves authenticated human approval,\nmodel accuracy or production connectivity. No retries, queues or DB writes are\nintroduced here. Workflow state remains in memory.\n\"\"\"\nfrom __future__ import annotations\n\nfrom hashlib import sha256\nimport json\nfrom pathlib import Path\nfrom typing import Literal\n\nfrom pydantic import Field, model_validator\n\nfrom . import CONTRACT_VERSION\nfrom .composition import TeamConfiguration, build_agents, describe_configuration\nfrom .contracts import Approval, AssetRef, Context, Contract, DocumentRef, Identifier, Verdict\nfrom .runtime import Workflow\n\n\nclass FlowCheckCase(Contract):\n    id: Identifier\n    context: Context\n    document: DocumentRef\n    asset: AssetRef\n    revision_context: Context\n    revision_asset: AssetRef\n    expected_initial_verdict: Verdict\n    # Normal final approval requires pass; exception approval is a separate policy.\n    expected_revised_verdict: Literal[\"pass\"] = \"pass\"\n    change_reason: str = Field(min_length=1)\n\n    @model_validator(mode=\"after\")\n    def fixed_scope(self):\n        old, new = self.context, self.revision_context\n        if (old.parent_run_id is not None or new.parent_run_id != old.run_id\n                or old.run_id == new.run_id or old.project_id != new.project_id\n                or old.document_version_id != new.document_version_id\n                or old.criteria_version_id != new.criteria_version_id\n                or self.document.document_version_id != old.document_version_id\n                or old.asset_version_id != self.asset.asset_version_id\n                or new.asset_version_id != self.revision_asset.asset_version_id\n                or self.asset.asset_version_id == self.revision_asset.asset_version_id):\n            raise ValueError(\"a flow check requires fixed document/criteria and a new child run/poster version\")\n        if not self.change_reason.strip():\n            raise ValueError(\"scripted change approval requires a reason\")\n        return self\n\n\nclass FlowCaseError(ValueError):\n    \"\"\"Malformed local test input, detected before any configured factory runs.\"\"\"\n\n\ndef _unique_object(pairs):\n    result = {}\n    for key, value in pairs:\n        if key in result:\n            raise ValueError(\"duplicate JSON key\")\n        result[key] = value\n    return result\n\n\ndef _invalid_constant(_value):\n    raise ValueError(\"nonstandard JSON constant\")\n\n\ndef load_flow_case(path: str | Path) -\u003e FlowCheckCase:\n    try:\n        value = json.loads(Path(path).read_text(encoding=\"utf-8-sig\"),\n                           object_pairs_hook=_unique_object, parse_constant=_invalid_constant)\n        return FlowCheckCase.model_validate(value)\n    except (ValueError, TypeError):\n        raise FlowCaseError(\"The workflow fixture is invalid.\") from None\n\n\ndef _digest(value) -\u003e str:\n    raw = value.model_dump(mode=\"json\") if isinstance(value, Contract) else value\n    return sha256(json.dumps(raw, ensure_ascii=False, sort_keys=True,\n                             separators=(\",\", \":\"), allow_nan=False).encode(\"utf-8\")).hexdigest()\n\n\ndef run_flow_check(case: FlowCheckCase, configuration: TeamConfiguration) -\u003e dict:\n    \"\"\"Run one fixed six-action rehearsal, stopping at the first discrepancy.\n\n    Revalidate copied inputs before importing any factory. Report accepted\n    result hashes and timing/error metadata, never raw media or role payloads.\n    \"\"\"\n    case = FlowCheckCase.model_validate(case.model_dump(mode=\"python\", warnings=False)).model_copy(deep=True)\n    configuration = TeamConfiguration.model_validate(configuration.model_dump(mode=\"python\", warnings=False))\n    workflow = Workflow(build_agents(configuration), profile=configuration.profile)\n    original, revised = case.context, case.revision_context\n    actions = []\n    stopped = False\n    unknown = False\n    parent_snapshot = None\n    roles = (\"A02\", \"A04_A05\", \"A06\", \"A07\")\n\n    def approve(context, decision, **fields):\n        return workflow.approve(context.run_id, Approval(context=context,\n            actor_id=context.actor_id, decision=decision, **fields))\n\n    plan = [\n        (\"start\", original, \"waiting_criteria\", None, \"unreviewed\",\n         lambda: workflow.start(original, case.document, case.asset)),\n        (\"approve_criteria\", original, \"waiting_review\", case.expected_initial_verdict, \"unreviewed\",\n         lambda: approve(original, \"approve_criteria\")),\n        (\"approve_changes\", original, \"waiting_revision\", case.expected_initial_verdict, \"changes_approved\",\n         lambda: approve(original, \"approve_changes\", reason=case.change_reason)),\n        (\"rereview\", revised, \"waiting_criteria\", None, \"unreviewed\",\n         lambda: workflow.rereview(original.run_id, revised, case.revision_asset)),\n        (\"approve_revised_criteria\", revised, \"waiting_review\", case.expected_revised_verdict, \"unreviewed\",\n         lambda: approve(revised, \"approve_criteria\")),\n        (\"approve_final\", revised, \"completed\", case.expected_revised_verdict, \"final_approved\",\n         lambda: approve(revised, \"approve_final\")),\n    ]\n    for action, context, expected_status, expected_verdict, expected_human, execute in plan:\n        item = {\"action\": action, \"run_id\": context.run_id}\n        if stopped:\n            actions.append({**item, \"status\": \"skipped\", \"reason\": \"PRIOR_FLOW_FAILURE\"})\n            continue\n        # Workflow handles adapter failures and sanitizes their errors. Only\n        # local workflow conflicts reach this boundary; never emit their text.\n        try:\n            snapshot = execute()\n        except Exception:\n            actions.append({**item, \"status\": \"failed\", \"reason\": \"WORKFLOW_ACTION_FAILED\"})\n            stopped = True\n            continue\n        records = snapshot.step_records\n        item.update(execution_status=snapshot.execution_status,\n                    machine_verdict=snapshot.machine_verdict, human_decision=snapshot.human_decision,\n                    synthetic=snapshot.synthetic, snapshot_sha256=_digest(snapshot),\n                    records=[record.model_dump(mode=\"json\") for record in records])\n        # Check the real accepted sequence instead of inferring progress from a\n        # successful HTTP/status return or a callback that returned invalid data.\n        expected_roles = roles[:1] if action in {\"start\", \"rereview\"} else roles\n        expected_states = tuple(\"reused\" if context.parent_run_id and role == \"A02\" else \"completed\"\n                                for role in expected_roles)\n        reason = None\n        if snapshot.error is not None:\n            reason = \"STAGE_FAILED\"\n            unknown = snapshot.error.outcome_unknown\n            failed = next((r for r in reversed(records) if r.error is not None), None)\n            error = failed.error if failed else snapshot.error\n            item[\"error\"] = {\"code\": error.code, \"retryable\": error.retryable,\n                             \"outcome_unknown\": error.outcome_unknown}\n        elif snapshot.context != context or snapshot.execution_status != expected_status:\n            reason = \"STATE_MISMATCH\"\n        elif snapshot.machine_verdict != expected_verdict:\n            reason = \"VERDICT_MISMATCH\"\n        elif snapshot.human_decision != expected_human:\n            reason = \"HUMAN_DECISION_MISMATCH\"\n        elif tuple(r.role for r in records) != expected_roles or tuple(r.status for r in records) != expected_states:\n            reason = \"STAGE_SEQUENCE_MISMATCH\"\n        elif context.parent_run_id and records[0].source_run_id != original.run_id:\n            reason = \"REUSE_SOURCE_MISMATCH\"\n        if action == \"approve_changes\":\n            parent_snapshot = snapshot\n        if context.parent_run_id and workflow.get(original.run_id) != parent_snapshot:\n            reason = reason or \"PARENT_CHANGED\"\n        item[\"status\"] = \"failed\" if reason else \"passed\"\n        if reason:\n            item[\"reason\"] = reason\n            stopped = True\n        actions.append(item)\n    counts = {status: sum(a[\"status\"] == status for a in actions)\n              for status in (\"passed\", \"failed\", \"skipped\")}\n    return {\"contract_version\": CONTRACT_VERSION, \"check\": \"configured_workflow\", \"case_id\": case.id,\n            \"case_sha256\": _digest(case), \"configuration_sha256\": _digest(configuration),\n            \"profile\": configuration.profile, \"storage\": \"memory\", \"passed\": not stopped,\n            \"stopped_on_outcome_unknown\": unknown,\n            \"configuration\": describe_configuration(configuration),\n            \"summary\": {\"total\": len(actions), **counts}, \"actions\": actions,\n            \"connection_verified\": False, \"production_ready\": False,\n            \"scripted_approvals\": True,\n            \"notice\": \"Explicit developer rehearsal with scripted approvals. Hashes cover canonical validated JSON. \"\n                      \"Not authenticated human approval, model accuracy, production persistence or connectivity verification.\"}\n","sha256":"f01505bf1d3987eec47e3d97b73aca5a1cdeaee2aa189c2b87cb1eafc28ca5ec"},"backend/agent_framework/graph_commands.py":{"text":"\"\"\"Explicit graph administration/delivery. Never starts or migrates either database.\"\"\"\nimport json\nfrom threading import Event\nimport signal\nfrom uuid import UUID\nfrom sqlalchemy import text\n\nfrom backend.app.persistence.database import create_app_engine\nfrom backend.app.persistence.transaction import unit_of_work\nfrom backend.app.config import ConfigurationError\nfrom .postgres_commands import _values,_ready\nfrom .graph_store import FrameworkGraph,GraphUnavailable\nfrom .graph_projection import ProjectionWorker,mark_project_changed,installed,graph_status\n\n\ndef graph_command(args):\n    values,settings=_values(args.env_file,'framework-projection')\n    graph=FrameworkGraph(values.get('CC_NEO4J_URI',''),values.get('CC_NEO4J_USER','neo4j'),values.get('CC_NEO4J_PASSWORD',''))\n    engine=None\n    try:\n        if args.command=='graph-init':\n            graph.initialize();print(json.dumps({'graph':'AFProjection','initialized':True}));return 0\n        engine=create_app_engine(settings)\n        readiness=_ready(engine,settings)\n        with unit_of_work(engine) as c:\n            if not installed(c):raise ConfigurationError('Apply AF005 explicitly before graph commands.')\n            if args.command=='graph-rebuild':\n                # One explicit project only. The public record is not modified.\n                found=c.execute(text('SELECT project_id FROM public.projects WHERE project_id=:p'),{'p':args.project_id}).scalar_one_or_none()\n                if found is None:raise ConfigurationError('Project does not exist.')\n                mark_project_changed(c,args.project_id,'graph.rebuild_requested',args.project_id)\n                result=graph_status(c,args.project_id)\n                print(json.dumps({'project_id':str(args.project_id),'status':result['status'],'required_revision':result['required_revision']}));return 0\n        if args.command=='graph-check':\n            graph.check()\n            print(json.dumps({'postgres':'ready','neo4j':'ready','schema':readiness['revision'],\n                'read_only':True}));return 0\n        stop=Event()\n        for name in (signal.SIGINT,signal.SIGTERM):signal.signal(name,lambda *_:stop.set())\n        worker=ProjectionWorker(engine,graph)\n        while not stop.is_set():\n            delivered=worker.deliver_one()\n            if args.once or delivered:print(json.dumps({'event':'framework_projection_cycle','processed':delivered,'outcome':worker.last_outcome}),flush=True)\n            if args.once:return 1 if worker.last_outcome in ('deferred','authority_lost') else 0\n            stop.wait(1)\n        return 0\n    except GraphUnavailable as error:\n        print(json.dumps({'error':{'code':error.code,'message':'The framework graph operation was not confirmed.'}}));return 1\n    finally:\n        graph.close()\n        if engine is not None:engine.dispose()\n","sha256":"521f61c968d0d9dd5e4d6e1b86cff2922f815cd50d957c06d56ec463e1b2469a"},"backend/agent_framework/graph_monitor.py":{"text":"\"\"\"Read-only projection observations and local state-change logs.\n\nNo graph repair, schema migration, model retry, approval or external notification.\nThe only persistent writes are the monitor's own atomic JSON snapshot.\n\"\"\"\nfrom dataclasses import dataclass\nfrom datetime import datetime,timezone\nimport json\nimport os\nfrom pathlib import Path\nimport signal\nfrom threading import Event\nfrom time import monotonic\nfrom uuid import UUID,uuid4\n\nfrom sqlalchemy import text\nfrom backend.app.persistence.database import create_app_engine\nfrom .graph_store import FrameworkGraph,GraphUnavailable\nfrom .postgres_commands import _values,_ready\n\nFORMAT='af-graph-monitor-v1'\n\n\n@dataclass(frozen=True)\nclass MonitorPolicy:\n    lag_seconds:int=120\n    failure_threshold:int=3\n    interval_seconds:int=15\n\n    def __post_init__(self):\n        if any(type(v) is not int or not 1\u003c=v\u003c=3600 for v in (self.lag_seconds,self.failure_threshold,self.interval_seconds)):\n            raise ValueError('Invalid monitor policy')\n\n\ndef read_metrics(engine,*,project_id=None):\n    params={'project':UUID(str(project_id))} if project_id is not None else {}\n    scope='WHERE s.project_id=:project' if project_id is not None else ''\n    with engine.connect().execution_options(isolation_level='REPEATABLE READ') as c:\n        with c.begin():\n            c.execute(text('SET TRANSACTION READ ONLY'))\n            rows=c.execute(text('SELECT s.project_id,s.revision,s.applied_revision,s.attempt_no,'\n                's.error_json IS NOT NULL AS has_error, '\n                '(SELECT count(*) FROM agent_framework.graph_outbox o WHERE o.project_id=s.project_id '\n                'AND o.processed_at IS NULL) AS pending_events, '\n                '(SELECT GREATEST(0,EXTRACT(EPOCH FROM (CURRENT_TIMESTAMP-min(o.created_at)))) '\n                'FROM agent_framework.graph_outbox o WHERE o.project_id=s.project_id '\n                'AND o.processed_at IS NULL) AS oldest_pending_seconds '\n                'FROM agent_framework.graph_state s '+scope+' ORDER BY s.project_id LIMIT 501'),params).mappings().all()\n            fallback_scope='AND r.project_id=:project' if project_id is not None else ''\n            fallbacks=c.execute(text(\"SELECT count(*) AS total,count(*) FILTER(WHERE e.trace_json-\u003e\u003e'backend'='postgresql') AS fallbacks \"\n                \"FROM agent_framework.evidence_contexts e JOIN agent_framework.runs r ON r.run_id=e.run_id \"\n                \"WHERE e.created_at\u003e=CURRENT_TIMESTAMP-interval '15 minutes' \"+fallback_scope),params).one()\n    projects=[{'project_id':str(r['project_id']),'required_revision':r['revision'],\n        'applied_revision':r['applied_revision'],'consecutive_failures':r['attempt_no'],\n        'has_error':r['has_error'],'pending_events':r['pending_events'],\n        'oldest_pending_seconds':round(float(r['oldest_pending_seconds'] or 0),3)} for r in rows[:500]]\n    return {'projects':projects,'truncated':len(rows)\u003e500,\n        'recent_contexts':fallbacks.total,'recent_sql_fallbacks':fallbacks.fallbacks}\n\n\ndef classify(metrics,revisions,policy,*,graph_available=True):\n    alerts=[]\n    def alert(code,severity,project=None):\n        item={'code':code,'severity':severity}\n        if project is not None:item['project_id']=project['project_id']\n        alerts.append(item)\n    if not graph_available:alert('NEO4J_UNAVAILABLE','critical')\n    if metrics['truncated']:alert('MONITOR_SCOPE_TRUNCATED','warning')\n    for p in metrics['projects']:\n        pending=p['required_revision']\u003ep['applied_revision'] or p['pending_events']\u003e0\n        if p['consecutive_failures']\u003e=policy.failure_threshold:alert('CONSECUTIVE_SYNC_FAILURES','critical',p)\n        if pending and p['oldest_pending_seconds']\u003e=policy.lag_seconds:alert('SYNC_LAGGING','warning',p)\n        if pending and not p['pending_events']:alert('PENDING_REVISION_WITHOUT_OUTBOX','critical',p)\n        if graph_available:\n            revision=revisions.get(p['project_id'])\n            p['observed_graph_revision']=revision\n            if p['applied_revision']\u003e0 and revision is None:alert('GRAPH_PROJECTION_MISSING','critical',p)\n            elif revision is not None and revision\u003cp['applied_revision']:alert('GRAPH_BEHIND_CONFIRMED_REVISION','critical',p)\n            # A newer graph can be a normal concurrent delivery after our PG snapshot.\n    if metrics['recent_sql_fallbacks']\u003e=3 and metrics['recent_sql_fallbacks']/max(1,metrics['recent_contexts'])\u003e=0.5:\n        alert('FREQUENT_SQL_FALLBACK','warning')\n    state='critical' if any(a['severity']=='critical' for a in alerts) else 'warning' if alerts else 'healthy'\n    return state,sorted(alerts,key=lambda a:(a['code'],a.get('project_id','')))\n\n\ndef observe(engine,graph,policy,*,project_id=None):\n    try:\n        metrics=read_metrics(engine,project_id=project_id)\n    except Exception:\n        return snapshot('critical',[{'code':'POSTGRES_UNAVAILABLE','severity':'critical'}],policy,\n            {'postgres':'unavailable','neo4j':'not_checked'},None)\n    graph_available=True\n    try:revisions=graph.projection_revisions([p['project_id'] for p in metrics['projects']])\n    except GraphUnavailable:graph_available=False;revisions={}\n    state,alerts=classify(metrics,revisions,policy,graph_available=graph_available)\n    return snapshot(state,alerts,policy,{'postgres':'ready','neo4j':'ready' if graph_available else 'unavailable'},metrics)\n\n\ndef snapshot(state,alerts,policy,dependencies,metrics):\n    return {'format':FORMAT,'observed_at':datetime.now(timezone.utc).isoformat(),'state':state,\n        'policy':{'lag_seconds':policy.lag_seconds,'failure_threshold':policy.failure_threshold,\n            'interval_seconds':policy.interval_seconds},'dependencies':dependencies,'alerts':alerts,\n        'metrics':metrics,'read_only':True,'automatic_repair':False}\n\n\ndef save_snapshot(path,value):\n    path=Path(path);path.parent.mkdir(parents=True,exist_ok=True)\n    temporary=path.with_name(path.name+'.'+uuid4().hex+'.tmp')\n    try:\n        with temporary.open('x',encoding='utf-8') as f:json.dump(value,f,ensure_ascii=False)\n        temporary.chmod(0o600);os.replace(temporary,path)\n    finally:temporary.unlink(missing_ok=True)\n\n\ndef load_snapshot(path,*,max_age=60,now=None,expected_format=FORMAT):\n    now=now or datetime.now(timezone.utc)\n    try:\n        value=json.loads(Path(path).read_text(encoding='utf-8'))\n        if not isinstance(value,dict) or value.get('format')!=expected_format or value.get('state') not in ('healthy','warning','critical'):\n            raise ValueError()\n        age=(now-datetime.fromisoformat(value['observed_at'])).total_seconds()\n        if not 0\u003c=age\u003c=max_age:raise ValueError()\n        return value,True\n    except (OSError,ValueError,TypeError,KeyError):\n        return {'format':expected_format,'state':'unknown','alerts':[{'code':'MONITOR_SNAPSHOT_STALE_OR_MISSING','severity':'critical'}],\n            'read_only':True,'automatic_repair':False},False\n\n\nclass Transitions:\n    def __init__(self):self.previous=None;self.last_heartbeat=monotonic()\n    def event(self,value):\n        signature=json.dumps([value['state'],value['alerts']],sort_keys=True)\n        if signature!=self.previous:\n            self.previous=signature;self.last_heartbeat=monotonic()\n            return {'event':'framework_graph_monitor_changed','state':value['state'],\n                'alerts':value['alerts'],'observed_at':value['observed_at']}\n        if monotonic()-self.last_heartbeat\u003e=300:\n            self.last_heartbeat=monotonic()\n            return {'event':'framework_graph_monitor_heartbeat','state':value['state'],'observed_at':value['observed_at']}\n        return None\n\n\ndef monitor_command(args):\n    values,settings=_values(args.env_file,'framework-projection')\n    policy=MonitorPolicy(args.lag_seconds,args.failure_threshold,args.interval)\n    engine=create_app_engine(settings)\n    graph=FrameworkGraph(values.get('CC_NEO4J_URI',''),values.get('CC_NEO4J_USER','neo4j'),values.get('CC_NEO4J_PASSWORD',''))\n    stop=Event();transitions=Transitions()\n    try:\n        # No implicit migration: incompatible schemas fail at startup.\n        if _ready(engine,settings)['revision']!='AF005':raise ValueError('AF005 required')\n        for signum in (signal.SIGINT,signal.SIGTERM):signal.signal(signum,lambda *_:stop.set())\n        while not stop.is_set():\n            value=observe(engine,graph,policy,project_id=args.project_id)\n            if args.once:\n                print(json.dumps(value),flush=True);return 0 if value['state']=='healthy' else 1\n            if args.state_file:save_snapshot(args.state_file,value)\n            event=transitions.event(value)\n            if event:print(json.dumps(event),flush=True)\n            stop.wait(policy.interval_seconds)\n        return 0\n    finally:graph.close();engine.dispose()\n\n\ndef monitor_status_command(args):\n    value,fresh=load_snapshot(args.state_file,max_age=args.max_age)\n    print(json.dumps(value),flush=True)\n    # Docker health means the observer loop is alive, independent of the alerts.\n    return 0 if fresh else 1\n","sha256":"a0735d5e96a11a0c92df808848256153fca892205e84880681c3915da59988b8"},"backend/agent_framework/graph_projection.py":{"text":"\"\"\"Transactional AF outbox and fenced delivery without a PG transaction over Neo4j I/O.\"\"\"\nfrom uuid import UUID, uuid4\n\nfrom sqlalchemy import text\nfrom backend.app.persistence.transaction import unit_of_work\nfrom backend.app.security.errors import AuthError\n\nGRAPH_EVENTS = frozenset({'run.created','step.completed','criteria.version_created',\n    'criteria.approved','poster.review_created','approval.recorded','run.failed'})\n\n\ndef installed(c):\n    return c.execute(text(\"SELECT to_regclass('agent_framework.graph_state')\")).scalar_one() is not None\n\n\ndef mark_project_changed(c, project_id, kind, target_id):\n    if not installed(c):\n        return\n    pid=UUID(str(project_id))\n    revision=c.execute(text('INSERT INTO agent_framework.graph_state(project_id,revision) VALUES(:p,1) '\n        'ON CONFLICT(project_id) DO UPDATE SET revision=agent_framework.graph_state.revision+1, '\n        'available_at=CASE WHEN :reset THEN clock_timestamp() ELSE agent_framework.graph_state.available_at END '\n        'RETURNING revision'),{'p':pid,'reset':kind in ('graph.rebuild_requested','graph.recovery_requested')}).scalar_one()\n    c.execute(text('INSERT INTO agent_framework.graph_outbox(event_id,project_id,revision,kind,target_id) '\n        'VALUES(:e,:p,:r,:k,:t)'),{'e':uuid4(),'p':pid,'r':revision,'k':kind,'t':str(target_id)})\n\n\ndef source_rows(version_id, criteria):\n    rows=[]\n    for item in criteria:\n        cid=item['criterion_id']\n        rows.append({'criterion_id':cid,'source_key':f'source:{version_id}:{cid}:document',\n                     'source_hash':item['source']['source_hash']})\n        value=item.get('value_source')\n        if value:\n            rows.append({'criterion_id':cid,'source_key':f'source:{version_id}:{cid}:value',\n                         'source_hash':value['quote_sha256']})\n    return sorted(rows,key=lambda row:(row['criterion_id'],row['source_key']))\n\n\ndef project_snapshot(c, project_id):\n    \"\"\"Caller supplies one repeatable-read PG snapshot, then closes it before graph I/O.\"\"\"\n    pid=UUID(str(project_id));nodes={};edges=set()\n    def node(key,kind,**props):nodes[key]={'key':key,'kind':kind,**props}\n    def edge(a,b,kind):edges.add((a,b,kind))\n    project='project:'+str(pid);node(project,'project')\n    docs=c.execute(text('SELECT document_version_id,document_id,sha256,previous_version_id FROM '\n        'agent_framework.document_versions WHERE project_id=:p'),{'p':pid}).mappings().all()\n    for row in docs:\n        key='document:'+str(row['document_version_id']);node(key,'document_version',sha256=row['sha256'])\n        edge(project,key,'contains')\n        if row['previous_version_id']:edge('document:'+str(row['previous_version_id']),key,'revised_as')\n    versions=c.execute(text('SELECT criteria_version_id,document_version_id,snapshot_json,snapshot_sha256 '\n        'FROM agent_framework.criteria_versions WHERE project_id=:p'),{'p':pid}).mappings().all()\n    bindings=c.execute(text('SELECT criteria_version_id,approval_id,source_run_id FROM '\n        'agent_framework.criteria_approval_bindings WHERE project_id=:p'),{'p':pid}).mappings().all()\n    approved={str(row['criteria_version_id']) for row in bindings}\n    for row in versions:\n        vid=str(row['criteria_version_id']);key='criteria:'+vid\n        raw=row['snapshot_json'];items=raw.get('criteria',[])\n        node(key,'criteria_version',approved=vid in approved,sha256=row['snapshot_sha256'])\n        edge(key,'document:'+str(row['document_version_id']),'based_on')\n        for item in items:\n            ck=f'criterion:{vid}:{item[\"criterion_id\"]}';node(ck,'criterion',criterion_id=item['criterion_id'])\n            edge(key,ck,'contains')\n        for source in source_rows(vid,items):\n            node(source['source_key'],'source',source_hash=source['source_hash'])\n            edge(f'criterion:{vid}:{source[\"criterion_id\"]}',source['source_key'],'sourced_from')\n    runs=c.execute(text('SELECT run_id,parent_run_id,input_json,snapshot_json FROM '\n        'agent_framework.runs WHERE project_id=:p'),{'p':pid}).mappings().all()\n    for row in runs:\n        key='run:'+row['run_id'];snap=row['snapshot_json'];fixed=row['input_json']\n        node(key,'run',state=snap.get('execution_status','unknown'),synthetic=bool(snap.get('synthetic',False)))\n        edge(project,key,'contains')\n        doc=fixed.get('document') or {};edge(key,'document:'+str(doc.get('document_version_id')),'reads')\n        baseline=fixed.get('baseline') or {};vid=baseline.get('criteria_version_id') or snap.get('approved_criteria_version_id')\n        if vid:edge(key,'criteria:'+vid,'applies')\n        asset=fixed.get('asset') or {}\n        if asset:\n            ak='poster:'+asset['asset_version_id'];node(ak,'poster_version',sha256=asset['sha256']);edge(key,ak,'inspects')\n        if row['parent_run_id']:edge('run:'+row['parent_run_id'],key,'reinspected_as')\n    approvals=c.execute(text('SELECT approval_id,run_id,decision FROM agent_framework.approvals '\n        'WHERE project_id=:p'),{'p':pid}).mappings().all()\n    for row in approvals:\n        key='approval:'+str(row['approval_id']);node(key,'approval',decision=row['decision'])\n        edge(key,'run:'+row['run_id'],'approves')\n    for row in bindings:edge('approval:'+str(row['approval_id']),'criteria:'+str(row['criteria_version_id']),'approves')\n    return sorted(nodes.values(),key=lambda n:n['key']),[{'source':a,'target':b,'kind':k}\n        for a,b,k in sorted(edges) if a in nodes and b in nodes]\n\n\nclass ProjectionWorker:\n    def __init__(self,engine,graph,*,lease_seconds=120):\n        self.engine,self.graph,self.lease_seconds=engine,graph,lease_seconds\n        self.last_outcome='idle'\n\n    def deliver_one(self,*,project_id=None):\n        self.last_outcome='idle'\n        token=uuid4()\n        with unit_of_work(self.engine) as c:\n            scope=' AND project_id=:p ' if project_id is not None else ' '\n            row=c.execute(text('SELECT project_id FROM agent_framework.graph_state WHERE revision\u003eapplied_revision '\n                'AND available_at\u003c=clock_timestamp() AND (lease_expires_at IS NULL OR lease_expires_at\u003c=clock_timestamp()) '\n                +scope+'ORDER BY available_at,project_id FOR UPDATE SKIP LOCKED LIMIT 1'),\n                {'p':UUID(str(project_id))} if project_id is not None else {}).mappings().one_or_none()\n            if row is None:return False\n            pid=row['project_id']\n            c.execute(text('UPDATE agent_framework.graph_state SET lease_token=:t,lease_expires_at='\n                \"clock_timestamp()+make_interval(secs=\u003e:s) WHERE project_id=:p\"),{'t':token,'s':self.lease_seconds,'p':pid})\n        try:\n            with self.engine.connect().execution_options(isolation_level='REPEATABLE READ') as c:\n                with c.begin():\n                    c.execute(text('SET TRANSACTION READ ONLY'))\n                    revision=c.execute(text('SELECT revision FROM agent_framework.graph_state WHERE project_id=:p'),{'p':pid}).scalar_one()\n                    nodes,edges=project_snapshot(c,pid)\n            result=self.graph.replace_project(str(pid),nodes,edges,revision)\n            if result is False:\n                from .graph_recovery import content_hash\n                from .graph_store import GraphUnavailable\n                observ
