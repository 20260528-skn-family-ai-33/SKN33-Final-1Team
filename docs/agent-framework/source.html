\")\n    if bundle.status == \"empty\" and bundle.evidence:\n        raise ValueError(\"EMPTY_CONTEXT_HAS_EVIDENCE\")\n    if (bundle.status == \"complete\" and bundle.graph_revision is not None\n            and bundle.graph_revision \u003c bundle.postgres_revision):\n        raise ValueError(\"STALE_GRAPH_MARKED_COMPLETE\")\n    for evidence in bundle.evidence:\n        if evidence.project_id != context.project_id:\n            raise ValueError(\"EVIDENCE_PROJECT_MISMATCH\")\n        if sha256(evidence.source.quote.encode(\"utf-8\")).hexdigest() != evidence.source.source_hash:\n            raise ValueError(\"EVIDENCE_HASH_MISMATCH\")\n        if evidence.value_source is not None:\n            value=evidence.value_source\n            if (not value.quote.strip() or not value.reference.strip()\n                    or sha256(value.quote.encode()).hexdigest()!=value.quote_sha256):\n                raise ValueError('EVIDENCE_VALUE_SOURCE_INVALID')\n        if (evidence.kind == \"current_requirement\"\n                and evidence.source.document_version_id != context.document_version_id):\n            raise ValueError(\"EVIDENCE_SOURCE_MISMATCH\")\n        if evidence.kind == \"approved_exception\":\n            if (evidence.source.document_version_id != context.document_version_id\n                    or evidence.applicable_asset_version_id != context.asset_version_id):\n                raise ValueError(\"EXCEPTION_SCOPE_MISMATCH\")\n\n\ndef validate_evidence(context, criteria_input, bundle: EvidenceBundle) -\u003e None:\n    ensure_context(context, bundle)\n    _criteria(context, criteria_input)\n    validate_evidence_envelope(context, bundle)\n    criteria = {c.criterion_id: c for c in criteria_input}\n    for evidence in bundle.evidence:\n        if not set(evidence.criterion_ids) \u003c= criteria.keys():\n            raise ValueError(\"UNKNOWN_EVIDENCE_CRITERION\")\n        if evidence.kind == \"current_requirement\":\n            if any(evidence.source != criteria[cid].source for cid in evidence.criterion_ids):\n                raise ValueError(\"EVIDENCE_SOURCE_MISMATCH\")\n            if any(evidence.value_source!=criteria[cid].value_source for cid in evidence.criterion_ids):\n                raise ValueError('EVIDENCE_VALUE_SOURCE_MISMATCH')\n\n\ndef validate_inspection(request: InspectRequest, result: InspectionResult) -\u003e None:\n    ensure_context(request.context, result)\n    validate_evidence(request.context, request.criteria, request.evidence)\n    if request.asset.asset_version_id != request.context.asset_version_id:\n        raise ValueError(\"ASSET_VERSION_MISMATCH\")\n    ids = {c.criterion_id for c in request.criteria}\n    evidence = {e.evidence_id: e for e in request.evidence.evidence}\n    _unique((o.criterion_id for o in result.observations), \"OBSERVATION\")\n    for observation in result.observations:\n        if observation.criterion_id not in ids:\n            raise ValueError(\"UNKNOWN_OBSERVATION_CRITERION\")\n        if (observation.image.asset_version_id != request.asset.asset_version_id\n                or observation.image.asset_hash != request.asset.sha256):\n            raise ValueError(\"OBSERVATION_ASSET_MISMATCH\")\n        _unique(observation.evidence_ids, \"CITATION\")\n        for eid in observation.evidence_ids:\n            if eid not in evidence:\n                raise ValueError(\"UNKNOWN_CITATION\")\n            source = evidence[eid]\n            if (source.kind == \"historical_context\"\n                    or observation.criterion_id not in source.criterion_ids):\n                raise ValueError(\"INVALID_OBSERVATION_CITATION\")\n\n\ndef aggregate(criteria, items):\n    required_ids = {c.criterion_id for c in criteria if c.required}\n    verdicts = [i.verdict for i in items if i.criterion_id in required_ids]\n    if \"fail\" in verdicts:\n        return \"fail\"\n    if \"review\" in verdicts or not verdicts:\n        return \"review\"\n    return \"pass\"\n\n\ndef validate_validated(request: ValidateRequest, result: ValidatedResult) -\u003e None:\n    ensure_context(request.context, result)\n    _unique((i.criterion_id for i in result.items), \"VALIDATED_ITEM\")\n    if {i.criterion_id for i in result.items} != {c.criterion_id for c in request.criteria}:\n        raise ValueError(\"VALIDATION_MUST_COVER_ALL_CRITERIA\")\n    if aggregate(request.criteria, result.items) != result.verdict:\n        raise ValueError(\"AGGREGATE_VERDICT_MISMATCH\")\n    # Independent of a team's custom A06 implementation, basic missing-data rules hold.\n    safe = ReferenceValidator().validate(request)\n    safe_items = {i.criterion_id: i for i in safe.items}\n    for item in result.items:\n        expected = safe_items[item.criterion_id]\n        if expected.verdict != \"pass\" and item.verdict == \"pass\":\n            raise ValueError(\"VALIDATOR_UNSUPPORTED_PASS\")\n        if \"missing_expected_value\" in expected.issues and item.verdict != \"review\":\n            raise ValueError(\"VALIDATOR_UNRESOLVED_EXPECTATION\")\n        if expected.verdict == \"review\" and item.verdict != \"review\":\n            raise ValueError(\"VALIDATOR_UNRESOLVED_OBSERVATION\")\n        if expected.verdict == \"pass\" and item.verdict == \"fail\":\n            raise ValueError(\"VALIDATOR_UNSUPPORTED_FAILURE\")\n        if expected.verdict == \"fail\" and item.verdict != \"fail\":\n            raise ValueError(\"VALIDATOR_HID_CONFIRMED_FAILURE\")\n        if not set(expected.issues) \u003c= set(item.issues):\n            raise ValueError(\"VALIDATOR_DROPPED_LIMITATIONS\")\n        if item.verdict == \"pass\" and item.issues:\n            raise ValueError(\"VALIDATOR_UNSUPPORTED_PASS\")\n        if item.model_dump(exclude={\"verdict\", \"issues\"}) != expected.model_dump(exclude={\"verdict\", \"issues\"}):\n            raise ValueError(\"VALIDATOR_CHANGED_EVIDENCE\")\n\n\ndef validate_report_request(request: ReportRequest) -\u003e None:\n    \"\"\"Check supplied A07 provenance before a reporter can consume it.\n\n    Item details allow aggregation and citation checks, but cannot authenticate\n    the approved criteria set or image contents. The A06 boundary must compare\n    those details with the original request before constructing ReportRequest.\n    \"\"\"\n    ensure_context(request.context, request.validated)\n    validate_evidence_envelope(request.context, request.evidence)\n    _unique((item.criterion_id for item in request.validated.items), \"VALIDATED_ITEM\")\n    criteria = {item.criterion_id for item in request.validated.items}\n    for evidence in request.evidence.evidence:\n        if not set(evidence.criterion_ids) \u003c= criteria:\n            raise ValueError(\"UNKNOWN_EVIDENCE_CRITERION\")\n    if aggregate(request.validated.items, request.validated.items) != request.validated.verdict:\n        raise ValueError(\"AGGREGATE_VERDICT_MISMATCH\")\n    evidence_by_id = {e.evidence_id: e for e in request.evidence.evidence}\n    for item in request.validated.items:\n        if item.image and item.image.asset_version_id != request.context.asset_version_id:\n            raise ValueError(\"OBSERVATION_ASSET_MISMATCH\")\n        _unique(item.evidence_ids, \"CITATION\")\n        for eid in item.evidence_ids:\n            if eid not in evidence_by_id:\n                raise ValueError(\"UNKNOWN_CITATION\")\n            source = evidence_by_id[eid]\n            if source.kind == \"historical_context\" or item.criterion_id not in source.criterion_ids:\n                raise ValueError(\"INVALID_OBSERVATION_CITATION\")\n\n\ndef validate_report(request: ReportRequest, result: ReportDraft) -\u003e None:\n    validate_report_request(request)\n    ensure_context(request.context, result)\n    if result.verdict != request.validated.verdict:\n        raise ValueError(\"REPORT_CHANGED_VERDICT\")\n    _unique(result.evidence_ids, \"REPORT_CITATION\")\n    allowed = {e.evidence_id for e in request.evidence.evidence}\n    if not set(result.evidence_ids) \u003c= allowed:\n        raise ValueError(\"UNKNOWN_REPORT_CITATION\")\n    if request.evidence.evidence and not result.evidence_ids:\n        raise ValueError(\"REPORT_CITATION_REQUIRED\")\n\n\n_NUMBER = re.compile(\n    r\"(?P\u003cvalue\u003e[+-]?(?:[0-9]+|[1-9][0-9]{0,2}(?:,[0-9]{3})+)(?:\\.[0-9]+)?)\"\n    r\"(?:[ \\t]*(?P\u003cunit\u003e[A-Za-z가-힣%₩$€£°/²³]+))?\"\n)\n\n\ndef _number(raw: str, declared_unit: str | None) -\u003e tuple[Decimal, str | None]:\n    \"\"\"One decimal and an optional literal unit; never extract digits from prose.\"\"\"\n    match = _NUMBER.fullmatch(raw.strip())\n    if not match or declared_unit is not None and not declared_unit.strip():\n        raise ValueError(\"invalid numeric value or unit\")\n    unit = declared_unit.strip() if declared_unit is not None else None\n    suffix = match[\"unit\"]\n    if suffix and unit and suffix != unit:\n        raise ValueError(\"numeric suffix conflicts with declared unit\")\n    return Decimal(match[\"value\"].replace(\",\", \"\")), suffix or unit\n\n\nclass ReferenceValidator:\n    \"\"\"Code-only A06: validate evidence before comparing an inspector's claims.\n\n    Visual accuracy, source authority and semantic criterion classification still\n    belong to upstream adapters and human criteria approval. No unit conversion,\n    automatic exceptions, semantic matching or group policies are applied here.\n    \"\"\"\n\n    def validate(self, request: ValidateRequest) -\u003e ValidatedResult:\n        validate_inspection(InspectRequest(context=request.context, criteria=request.criteria,\n                                          asset=request.asset, evidence=request.evidence), request.inspection)\n        observations = {o.criterion_id: o for o in request.inspection.observations}\n        evidence = {e.evidence_id: e for e in request.evidence.evidence}\n        items = []\n        for criterion in request.criteria:\n            issues = []\n            qualifier = qualifier_text(criterion)\n            if criterion.details is not None:\n                if criterion.details.target!='poster_text':issues.append('typed_attribute_review_required')\n                if needs_person(qualifier):\n                    issues.append('qualifier_interpretation_required')\n                if criterion.details.normalized_expected is not None:issues.append('normalized_value_review_required')\n                if criterion.details.field in {'start_date','end_date','event_date','event_period'}:\n                    issues.append('date_comparison_review_required')\n            observation = observations.get(criterion.criterion_id)\n            verdict = \"review\"\n            comparison_expected = comparison_observed = comparison_unit = None\n            supported = {\"text\": {\"equals\", \"contains\"}, \"number\": {\"equals\", \"gte\", \"lte\"},\n                         \"visual\": {\"present\"}}\n            if criterion.operator not in supported.get(criterion.kind, set()):\n                issues.append(\"unsupported_criterion\")\n            if not criterion.expected.strip():\n                issues.append(\"missing_expected_value\")\n            if not any(e.kind == \"current_requirement\" and criterion.criterion_id in e.criterion_ids\n                       for e in evidence.values()):\n                issues.append(\"missing_requirement_evidence\")\n            if request.evidence.status != \"complete\":\n                issues.append(\"context_incomplete\")\n            if observation is None:\n                issues.append(\"missing_observation\")\n            else:\n                if not any(evidence[eid].kind == \"current_requirement\" for eid in observation.evidence_ids):\n                    issues.append(\"missing_citation\")\n                if observation.uncertainty:\n                    issues.append(\"uncertain_observation\")\n                status_issue = {\"unknown\": \"observation_status_unknown\", \"unreadable\": \"unreadable_observation\",\n                                \"not_checked\": \"observation_not_checked\"}.get(observation.observation_status)\n                if status_issue:\n                    issues.append(status_issue)\n                if observation.observation_status == \"observed\" and not observation.observed.strip():\n                    issues.append(\"missing_observation\")\n                if observation.verdict == \"review\":\n                    issues.append(\"model_review\")\n\n            if not issues:\n                if observation.observation_status == \"absent\":\n                    if criterion.kind == \"number\":\n                        issues.append(\"missing_observation\")\n                    elif (observation.verdict != \"fail\"\n                          or criterion.expected.strip() and (\n                              observation.observed == criterion.expected\n                              or criterion.kind == \"text\" and criterion.operator == \"contains\"\n                              and criterion.expected in observation.observed)):\n                        issues.append(\"verdict_conflict\")\n                    else:\n                        verdict = \"fail\"\n                        issues.append(\"observed_absence\")\n                elif criterion.kind == \"visual\":\n                    if observation.verdict == \"pass\":\n                        verdict = \"pass\"\n                    else:\n                        issues.append(\"verdict_conflict\")\n                else:\n                    if criterion.kind == \"number\":\n                        try:\n                            expected, expected_unit = _number(criterion.expected, criterion.unit)\n                        except (ValueError, InvalidOperation):\n                            issues.append(\"numeric_expectation_invalid\")\n                        try:\n                            observed, observed_unit = _number(observation.observed, observation.observed_unit)\n                        except (ValueError, InvalidOperation):\n                            issues.append(\"numeric_observation_invalid\")\n                        if not issues:\n                            if expected_unit != observed_unit:\n                                issues.append(\"unit_mismatch\")\n                            else:\n                                comparison_expected, comparison_observed = format(expected, \"f\"), format(observed, \"f\")\n                                comparison_unit = expected_unit\n                                matched = {\"equals\": observed == expected, \"gte\": observed \u003e= expected,\n                                           \"lte\": observed \u003c= expected}[criterion.operator]\n                    else:\n                        comparison_expected, comparison_observed = criterion.expected, observation.observed\n                        wanted, seen = format_free(criterion.expected, qualifier), format_free(observation.observed, qualifier)\n                        matched = wanted == seen if criterion.operator == \"equals\" else wanted in seen\n                    if not issues:\n                        if not matched and qualifier and not may_reject(qualifier):\n                            issues.append(\"qualifier_interpretation_required\")\n                        elif not matched:\n                            verdict = \"fail\"\n                            issues.append(\"value_mismatch\")\n                        elif observation.verdict == \"fail\":\n                            issues.append(\"verdict_conflict\")\n                        else:\n                            verdict = \"pass\"\n\n            items.append(ValidatedItem(\n                criterion_id=criterion.criterion_id, criterion_text=criterion.text, kind=criterion.kind,\n                operator=criterion.operator, required=criterion.required, expected=criterion.expected,\n                expected_unit=criterion.unit, observed=observation.observed if observation else None,\n                observed_unit=observation.observed_unit if observation else None,\n                observation_status=observation.observation_status if observation else \"not_checked\",\n                comparison_expected=comparison_expected, comparison_observed=comparison_observed,\n                comparison_unit=comparison_unit, image=observation.image if observation else None,\n                evidence_ids=observation.evidence_ids if observation else (), verdict=verdict, issues=tuple(issues),\n            ))\n        return ValidatedResult(context=request.context, verdict=aggregate(request.criteria, items),\n                               items=tuple(items),\n                               limitations=(\"Code validation only; visual accuracy and source authority are not independently verified.\",),\n                               synthetic=request.synthetic or request.inspection.synthetic or request.evidence.synthetic)\n","sha256":"59490f5731f5dd27b2e53b83db2ee4d3752fa7795b6349448d603f4fbc0afdc5"},"docs/agent-framework/A02_조건추출_연결가이드.md":{"text":"# A02 요구사항 구조화 · 자유 입력과 PDF\n\n2026-11-04 · `a02-semantic-v3` · `feat/37-a02-pdf-registration`\n\n현재 구현은 아래 Qwen 의미 구조화 절을 따른다. [기준 보완·승인 가이드](기준_보완승인_가이드.html)의 기존 승인 흐름을 유지하며 자유 입력 등록에는 AF004가 추가로 필요하다. 뒤쪽의 5단계 및 v1/v2 점검은 이전 구현의 기록이다.\n\n## 현재 기본 — Qwen 의미 구조화 · 2026-11-04\n\n**자유 입력 또는 텍스트 PDF → 같은 Qwen3.5-4B가 의미·유형·기대값 구조화 → 출처/형식 검증 → 기존 PostgreSQL 초안·단계 저장 → 사람의 기준 보완·승인 → 재조회**로 연결했다. 기본 설정은 `pdf_extraction.structuring=\"semantic\"`, 정책은 `a02-semantic-v3`다. 이 경로에서 `compile_requirements`나 규칙 기반 값 분리를 호출하지 않는다. 이전 규칙 프로필은 기록 재현용 `literal_legacy`로 명시한 경우에만 사용한다. 모델 실패 시 그 프로필로 자동 전환하지 않는다.\n\nQwen은 각 조건의 `target`, `field`, `kind`, `operator`, `expected`, `unit`, 필수/미정 여부, 허용 범위의 출처를 직접 반환한다. 일반적인 필드 외에도 의미 있는 snake_case 항목명을 사용할 수 있다. 알려진 메타데이터 필드에는 숫자/문자 유형을 검증하고, 새 파일 메타데이터 항목은 `custom_` 접두사를 사용한다. 서버는 모델이 고른 값을 임의로 다시 만들지 않는다.\n\n| 입력 예시 | 실제 Qwen 자유 입력 검증에서 생성된 조건 |\n|---|---|\n| 행사명: 김천김밥축제 | `poster_text / event_name`, 값 `김천김밥축제` |\n| 기간: 2026.10.23 ~ 10.25 | `start_date=2026.10.23`, `end_date=10.25`로 분리. 각 조건에 전체 기간 원문을 연결 |\n| 장소: 직지문화공원 | `poster_text / venue`, 값 `직지문화공원` |\n| 김천시 로고가 포함되어야 합니다 | `poster_visual / logo / present`, 값 `김천시 로고` |\n\n`Criterion.details.compiler=\"qwen-semantic-v1\"`, `origin=\"model_structured\"`가 모델의 의미 결정을 표시한다. 코드가 맡는 보조 기능은 JSON 계약·해시·버전·출처 범위·값/단위 근거 검증, 명시적 미정 표현과 누락된 허용 범위의 보존이다. 규칙으로 유지한 검토 항목은 `retained_unresolved_source`로 구분한다. 모든 원문 조건을 빠짐없이 이해했음을 보증하지 않으므로 사람의 대조가 필요하다.\n\n**날짜와 원문:** 일반 문구·숫자·단위는 원문에 그대로 존재해야 한다. 날짜에는 모델이 제안한 `normalized_expected`를 선택적으로 저장한다. ISO 날짜가 비교값으로 반환된 경우에도 원문의 날짜 표기를 `expected_source`에 따로 보존하며, 같은 날짜임을 검증할 수 있을 때만 수용한다. 예: 비교값 `2026-05-14`, 원문 근거 `2026년 5월 14일`. 생략된 연도는 같은 명시적 날짜 범위에서 유일하게 확인될 때만 검증한다. 서버가 현재 연도나 임의의 1월 1일을 만들어 넣지 않는다. 정규화 값이 없으면 원문 값을 유지한다. 날짜·허용 범위의 실제 판정과 파일 메타데이터·시각 검사는 A04·A05/A06 연결 범위이며 현재 지원하지 않는 해석은 `review`로 유지한다.\n\n현재 A06 참조 정책은 날짜 항목을 정규화 값의 유무와 관계없이 `date_comparison_review_required`로 남긴다. `10.25`가 `2027.10.25`의 일부라는 이유만으로 다른 연도의 날짜를 통과시키지 않는다. 날짜 의미 비교를 연결하기 전에는 사람의 검토가 필요하다.\n\n### 저장과 승인 호환성\n\n자유 입력은 UTF-8 원문을 실제 `text/plain` 파일로 보존하고 기존 `agent_framework.document_versions`의 불변 버전·해시·생성자·요청 키를 재사용한다. PDF로 변환하거나 가상의 PDF라고 표시하지 않는다. 자유 입력의 `page_count=1`과 출처 1쪽은 논리적 원문 블록이며, trace의 `input_kind=\"free_text\"`, parser `utf8-source-v1`로 구분한다. PDF는 기존 PyMuPDF 텍스트 경로를 유지한다.\n\n**AF004는 자유 입력 활성화에 필요한 명시적 추가 마이그레이션이다.** 기존 문서 테이블의 매체/크기 CHECK만 텍스트까지 확장한다. 기존 PDF의 20MiB/50쪽 제한·봉인 trigger·FK·앱 권한·public M008은 유지한다. 텍스트는 최대 60,000자/240,000바이트이며 요청 JSON은 기존 256KiB 제한, 실제 모델 입력은 설정의 문자 상한을 함께 적용한다. AF003에서는 새 PDF 의미 추출을 사용할 수 있고 자유 입력 등록은 준비 상태 오류로 거부한다. 기존 DB를 자동으로 업그레이드하지 않는다.\n\n기존 이미지 빌드 → DB 백업 확인 → owner 전용 설정으로 AF004 적용 → API·worker 재시작 순서다. Mac·Windows 모두 기존 Docker Linux 실행기를 사용한다. 현재 앱 env·키·원본 파일·볼륨을 재생성하지 않는다.\n\n```bash\n# Mac · 프로젝트 루트에서. DB 백업을 확인한 뒤 실행.\npython3 scripts/framework_desktop.py build\npython3 scripts/framework_desktop.py migrate --env-file .runtime/framework-owner.env --revision AF004\n```\n\n```powershell\n# Windows PowerShell · 프로젝트 루트에서. DB 백업을 확인한 뒤 실행.\npy -3.12 scripts/framework_desktop.py build\npy -3.12 scripts/framework_desktop.py migrate --env-file .runtime/framework-owner.env --revision AF004\n```\n\n실제 RunPod용 `deploy/qwen-a02/worker-config.example.json`은 의미 구조화와 600초 제한을 사용한다. 이미 만든 `.runtime/team_config.qwen-600s.json`에 `structuring`이 없으면 새 기본값 semantic이 적용된다. 명시적으로 `literal_legacy`를 설정한 파일은 자동 변경하지 않는다. 새 코드·설정은 **새 Idempotency-Key의 새 실행**으로 접수하며 기존 초안·실패·승인을 덮어쓰지 않는다.\n\n### API 사용\n\n모든 경로는 `/api/framework/v1` 아래에 있고 기존 로그인·CSRF·Origin·프로젝트 권한을 요구한다. 요청 키는 전송 전에 보관하며 같은 요청의 재확인에는 같은 키를 사용한다.\n\n| 경로 | 동작 |\n|---|---|\n| POST `/projects/{project_id}/text-documents` | JSON `{\"text\":\"원문\"}`으로 불변 텍스트 버전 등록. 201 |\n| POST `/projects/{project_id}/text-documents/{document_id}/versions?previous_version_id={id}` | 이전 버전을 지정해 새 텍스트 버전 등록. 201 |\n| GET `/projects/{project_id}/document-versions/{version_id}/content` | 원본을 그대로 조회. 텍스트는 text/plain, PDF는 application/pdf |\n| POST `/projects/{project_id}/document-versions/{version_id}/extractions` | 텍스트·PDF 공통 추출 접수. 빈 본문, 새 요청 키. 202 |\n| GET `/runs/{run_id}` | `waiting_criteria`와 미승인 초안·출처·경고 조회 |\n| 기존 `/runs/{run_id}/criteria-versions`, `/criteria-approvals`, `/criteria-approval` | 보완·명시적 승인·승인 결과 재조회. 기존 불변 버전/해시 계약 유지 |\n\n수정된 텍스트가 새 버전으로 등록되면 이전 버전을 새로 승인할 수 없다. 미정·수동 조건은 보완/제외 근거가 필요하며 승인 이후 `waiting_asset`로 멈춘다. 형식이 맞는 초안이 실제 승인이나 포스터 통과를 뜻하지 않는다. 새 details·정규화/매체 필드를 받는 팀원은 갱신한 공유 JSON Schema와 OpenAPI를 사용해야 한다. `details` 없는 기존 JSON과 PDF trace의 직렬화 형태는 유지한다.\n\n### 이번 검증\n\n초기 진단에서는 실제 RunPod Qwen 자유 입력 5개 조건과 기록된 PDF 응답의 조건 13개·미정 1개를 검증했다. 이후 사용자가 새 이미지와 AF004를 기존 DB에 명시적으로 적용하고 API·worker를 재실행했다. 실제 Qwen 호출로 자유 입력 5개·미정 0개, PDF 13개·미정 1개가 기존 PostgreSQL에 저장되어 `waiting_criteria`로 재조회됐다. 두 응답은 `synthetic=false`, 정책은 `a02-semantic-v3`, 반환 항목은 모두 `model_structured`였다. 기준 승인 목록은 비어 있다. 상세 실행 ID·해시·보존 범위는 [실제 연결 검증 기록](A02_실제연결_검증기록_20261104.md)을 따른다.\n\nPDF의 `c013`은 관람시간 값이 없고 확인 중이라는 안내가 있는 미정 항목이다. 원문과 미정 기록을 유지해 사람에게 확인 필요를 알린다. 앞서 안내한 ‘12개 보완 버전 저장’은 작성자의 제안이며 사용자의 제외 결정이나 기획서의 지시가 아니다. 원본 초안 13개는 유지하며 제외 버전과 승인은 접수하지 않았다. 표시 문단 12개와 미정 안내 1개로 나누는 것은 기준 변경·제외·승인이 아니다. 수정·제외는 사람의 명시적 결정 후에만 사유·출처와 함께 새 버전에 기록하고 문서에 없는 필수 조건을 임의 추가하지 않는다. 또한 `파일 1점`, `제목과 안내정보 구분`은 이번 응답에 독립 항목으로 반환되지 않아 원문 대조가 필요하다. 연결·저장 확인과 모든 요구사항의 완전한 추출은 구분한다.\n\n회귀 635개·하위 검사 8개, 격리 PostgreSQL 75개를 통과했다. DB 시험은 가짜 모델 응답·시험용 승인 입력을 사용했으며 실제 Qwen 진단과 구분한다. Mac의 Docker 이미지 빌드도 확인했고 Windows 실기기 실행은 별도 확인 대상이다.\n\n코드 위치: `a02_semantic.py`가 모델의 의미 출력·근거 검증, `requirement_text.py`가 UTF-8 입력 검증, `documents.py`·`AF004.sql`이 기존 저장소 확장이다. 기존 `a02_requirements.py` 값 분리는 명시적 legacy 프로필에서만 실행한다. 검증 명령은 기존 회귀 명령과 `tests/agent_framework/test_a02_semantic.py`, `tests/agent_framework/test_semantic_postgres_integration.py`를 포함한다. DB 테스트는 명시적인 테스트 전용 env와 새 격리 DB에서만 실행한다.\n\n## 이전 정책 — 비교값·대상·미정 항목 구조화\n\n이전 구간 선택 정책은 출처를 검증했지만 의뢰 문장 전체를 비교값으로 고르고, 가로·세로를 구분하지 못하며 미정 관람시간을 빠뜨렸다. 이제 **원문 선택은 Qwen, 명확한 리터럴 분리는 검증 가능한 컴파일 규칙**으로 나눈다. 정책은 `a02-source-compile-v2`, 컴파일러는 `literal-requirements-v1`이다. 원래 모델 응답의 JSON·출처·값 검증을 먼저 통과해야 하며 잘못된 응답을 보정해 성공으로 바꾸지 않는다. 추가 모델 호출이나 OCR fallback도 없다.\n\n| 항목 | 현재 초안에 저장하는 내용 |\n|---|---|\n| 제목의 두 필수 구절 | `수원의 영화`, `수원의 극장`을 각각 분리. 공백·줄바꿈 허용 원문을 보존하고 수동 검토 |\n| 연도·개막일·요일·장소 | `2026`, `2026년 5월 14일`, `목요일`, `열린문화공간 후소 전시실`처럼 원문 값 분리. 허용 범위는 자동으로 단순화하지 않음 |\n| 가로·세로 | `file_metadata / pixel_width`, `file_metadata / pixel_height`로 구분하고 숫자와 단위 분리 |\n| 파일 형식·색상 모드 | `file_format=JPEG`, `color_mode=RGB`. 포스터에 이 문자가 인쇄됐는지 검사하는 조건으로 취급하지 않음 |\n| 납품 파일 수 | `delivery / quantity`. 이미지 속 사물 개수와 구분하고 수동 검토 |\n| 시각 구성·일반 서술 | 완전한 원문을 보존하고 수동 검토. 지시문 일부를 임의의 contains 기대값으로 사용하지 않음 |\n| 원문의 명시적 미정 표현 | 모델이 빠뜨려도 원문 구간을 빈 기대값의 수동 검토 항목으로 유지. `origin=retained_unresolved_source`로 규칙 기반 보존임을 표시 |\n\n`Criterion.details`는 선택적 확장이다. 검사 대상(`target`), 항목명(`field`), 값의 PDF 출처(`expected_source`), 허용 범위 출처(`qualifiers`), 생성 근거(`origin`)를 보존한다. `response_sha256`은 컴파일된 JSON이 아니라 원 Qwen 응답 문자열의 해시를 계속 기록한다. 같은 출처의 동일 선택은 중복 생성하지 않으며 필수/미정 상태가 충돌하는 반복 선택은 거부한다. 알려진 미정 구간을 결과에서 제거하면 공통 역할 검증에서도 거부한다.\n\n기존 `details` 없는 JSON은 같은 형태로 직렬화한다. **새 `details`를 받는 팀원은 갱신한 JSON Schema·OpenAPI를 함께 사용해야 한다.** 기존 PostgreSQL JSON 저장소를 재사용하며 새 스키마 마이그레이션은 필요하지 않다. 사람이 값을 보완하면 새 값의 출처는 기존 보완 기록에 저장하고, 원래 PDF 값의 낡은 `expected_source`는 해제한다. 원문 허용 범위는 보존한다.\n\n**후속 검사와 승인 경계:** 현재 A06 ReferenceValidator에는 파일 메타데이터·납품 대상과 허용 범위를 완전히 평가하는 기능이 없다. 이 경우 `typed_attribute_review_required` 또는 `qualifier_interpretation_required`와 함께 `review`로 처리한다. 형식·색상 모드·크기는 원본 포스터 버전의 파일 메타데이터를 읽는 A04·A05 연결부가 필요하며 UI 미리보기나 모델용 축소 이미지의 값을 사용하면 안 된다. 수동·미정 조건은 보완/제외 근거 없이 승인할 수 없다. 규칙 기반 미정 보존도 전체 의미·누락 탐지를 보장하지 않으며 실제 관람시간을 만들어 넣지 않는다.\n\n**현재 검증:** 실제 Qwen의 새 호출 1회에서 약 71.8초 후 15개 조건·미정 1개가 생성되고 공통 출처 검증을 통과했다. 사용자 DB에는 이 진단 결과를 쓰지 않았다. 별도 PostgreSQL에서 저장·재시작 재조회·미정 기준 승인 거부·기존 포스터 흐름 40개, 회귀 테스트 610개·하위 검사 8개가 통과했다. 기록된 모델 응답을 재사용한 회귀 예제는 가상 PDF의 프로토콜 표본이며 정답·사람 승인·일반 추출 정확도 자료가 아니다. 기존 사용자 실행의 13개 초안과 승인 이력은 보존한다. 새 이미지로 API·worker를 재시작한 다음 새 요청 키로 접수해야 이 정책이 적용된다.\n\n## 이전 실서버 점검 — 원문 구간 선택\n\n2026-11-03 RunPod Qwen의 일반 응답과 실제 PDF 추출 호출을 확인했다. 최초 120초 실행은 결과 불명으로 보존했고, 600초 설정의 새 실행에서는 응답을 받았으나 `A02_UNIT_UNGROUNDED`로 초안 저장을 거부했다. 별도 진단 호출 1회에서 후보 51개의 `unit`이 모두 단위가 아닌 `\"text\"`인 것을 재현했다. 제목·표 머리글 같은 비요구사항도 후보에 섞여 있었다. 진단 응답은 승인·업무 결과로 저장하지 않았다.\n\n단위 규칙을 보완한 다음 실행은 `A02_SOURCE_MISMATCH`로 보존했다. 인용문을 모델이 다시 작성하는 대신, **Qwen이 원문 줄·부분 구간 ID를 선택하고 서버가 정확한 원문을 복사**하는 내부 응답 규약으로 바꿨다. 공백·줄바꿈·날짜 표기를 유사 일치로 보정하지 않으며 기존 출처 검증을 그대로 적용한다.\n\n- `start_line`·`end_line`은 같은 페이지·블록의 앞뒤 순서가 맞는 줄이다. 뒤에 이어지는 허용 범위·예외를 포함해 인용할 수 있다.\n- `expected`·`unit`은 원문 부분의 시작·끝 ID 또는 JSON null이다. **선택한 첫 줄에 속하는 순서가 맞는 구간만 출력 스키마에서 허용**하고 서버가 다시 검사한다. 다른 문장·페이지의 값을 가져오거나 단위를 별칭으로 바꾸면 거부한다.\n- 비교 값 null은 공통 계약의 빈 기대값으로, 단위 null은 공통 계약의 null로 옮긴다. 모델이 명시적으로 선택한 수동 검토·미정 상태이며 잘못된 응답을 몰래 빈 값으로 고치는 동작이 아니다. 여러 줄에 걸친 값이나 복합 허용 조건은 현재 규약에서 수동 검토 대상이다.\n- 미정 조건과 수동 검토는 기대값·단위를 null로 선택해야 한다. 숫자 비교는 단위 없는 숫자 구간을, 단위는 별도의 원문 단어·기호 구간을 선택한다. 종류·연산자·미정 여부의 조합도 출력 스키마와 서버 양쪽에서 검사한다. 예를 들어 ‘3000픽셀’ 전체를 숫자 값으로 넣거나 확인 중인 항목에 값을 붙이면 실패한다.\n- 본문 최대 문자 수 외에 비어 있지 않은 줄 2,048개·부분 구간 8,192개·출력 스키마 약 2MiB 상한을 둔다. 선택 가능한 인용문은 최대 4,000자다. 한도를 넘으면 호출 전에 실패하며 임의로 자르거나 후보를 버리지 않는다.\n- 모델이 선택한 종류·연산자·필수 여부를 유지한다. 파일 형식·색상 모드·수치 규격·시각 조건을 구분하도록 안내하며, 의미·누락·허용 범위를 해석했는지는 사람이 원문과 비교해야 한다.\n\n실제 Qwen 요청은 전송한 전체 프롬프트의 SHA-256과 **모델 원응답 문자열의 SHA-256**을 trace에 기록한다. 서버가 구간을 복사해 만든 JSON의 해시로 원응답 해시를 대체하지 않는다. 기존 mock 정책 지문과 과거 기록도 보존한다. 실제 응답을 사용한 별도 검증과 격리 PostgreSQL의 가짜 HTTP 검증을 구분하며, 이 과정에서 사용자 DB의 실행·승인 기록을 바꾸지 않는다.\n\n최종 구간 선택 규약을 실제 RunPod Qwen에 적용한 별도 1회 검증에서는 약 73.3초 후 전시 의뢰서의 **후보 13개가 공통 역할 경계의 출처·값·단위 검증을 통과**했다. 이는 사용자 worker가 DB에 저장한 결과가 아니라 비공개 로컬 진단 초안이다. 중간 개발 검증에서 발견한 기대값 범위 불일치·미정 기대값 오류도 성공으로 덮어쓰지 않았다. 격리 PostgreSQL에서는 가짜 HTTP 응답의 원응답 해시·정확한 숫자/단위 저장·재시작 조회를 포함한 11개 테스트, 프레임워크·서버 준비·데스크톱 실행기 회귀 테스트 594개와 하위 검사 8개가 통과했다.\n\n**품질 제한:** 실제 응답 13개에는 의뢰 문장 전체를 비교 값으로 선택한 사례, 반복된 규격 후보, 미정인 관람시간을 빠뜨린 문제가 남았다. 원문에 미정 표현이 있는데 미정 후보가 하나도 없으면 `unresolved_source_not_extracted`와 `missing_values_require_client_clarification` 경고를 남긴다. 이 경고는 완전한 누락 탐지나 자동 보완이 아니며, 일부 미정 후보만 누락한 경우까지 보증하지 않는다. 누락을 자동으로 채우거나 기준 승인으로 바꾸지 않는다. 원문과 대조해 종류·비교 값·허용 범위·미정 항목을 보완하기 전에는 이 초안을 승인 기준으로 사용하지 않는다.\n\n코드 변경 후 이미지를 빌드하고 API·worker를 같은 설정으로 재시작한 뒤 **새 Idempotency-Key의 새 실행**으로 확인한다. 실패/결과 불명 실행은 다시 열거나 성공으로 덮어쓰지 않는다. 구조·출처 검증 통과는 추출 품질·누락 없음·사람 승인 완료를 뜻하지 않는다.\n\n## 01. 이번에 연결한 흐름\n\n**기존 프로젝트의 PDF 등록 → PDF-only 추출 접수 → 별도 A02 worker → 원문 출처 검증 → 같은 PostgreSQL에 초안·단계·출처 저장 → 새 API 인스턴스에서 재조회**를 연결했다. 포스터 참조를 만들어 넣지 않으며 `asset_version_id`와 저장된 `asset`은 null이다. 초안 저장 뒤 `waiting_criteria`에서 멈춘다. 이번 단계는 보완 답변·기준 승인·포스터 검수를 실행하지 않는다.\n\n기존 AF001의 `runs`, `jobs`, `steps`와 4단계 AF002 PDF 등록 테이블을 재사용한다. 새로운 public 테이블이나 AF003은 추가하지 않았다. 기존 PDF+포스터 검수·승인·재검수 경로는 회귀 테스트로 함께 확인했다. `front-v2` 화면과 운영 DB는 변경하지 않았다.\n\nQwen 서버 주소가 아직 없으므로 실제 모델 호출·정확도 측정은 하지 않았다. **DB 흐름은 명시적인 mock 설정**, HTTP 프로토콜은 가짜 HTTP transport로 시험했다. 이 결과를 Qwen 추론 성공으로 해석하지 않는다.\n\n## 02. mock과 Qwen의 차이\n\n| 설정 | 동작 | 결과 표시 |\n|---|---|---|\n| `team_config.pdf-mock.json` | 실제 PDF의 일부 요청 문장을 고르는 개발용 선별 규칙. 모델·네트워크·검토표·정답 파일을 사용하지 않음 | `synthetic=true`, `extraction.mode=mock`, 수동 검토 후보 |\n| `team_config.pdf-qwen.example.json` | 명시한 Qwen3.5-4B 호환 endpoint에 한 번 요청. 서버가 준비된 뒤 복사·수정하여 사용 | `extraction.mode=qwen`, 모델 필드는 요청한 모델명 |\n\nmock은 완성된 조건 추출기가 아니다. 문장 일부가 줄바꿈으로 나뉘거나 표·예외·권장 수준이 있으면 정확하게 해석하지 못할 수 있다. 따라서 기대값은 비우고 `unsupported/manual` 후보를 만든다. 기존 검토표의 36개 조건과 일치하는 추출 성능을 주장하지 않는다. 실제 모델이 반환한 문자·숫자·시각 조건도 원문 인용을 대조한 **미승인 초안**이며 의미 정확도·누락 여부는 사람이 확인해야 한다.\n\nQwen 실패 때 mock으로 바꾸거나 JSON 보정 호출을 하지 않는다. 호출 결과가 불명확하면 `outcome_unknown`으로 닫고 자동 재호출하지 않는다. 예시 URL `127.0.0.1:8001`은 실제 구축된 서버 주소가 아니다. 이 작업은 GPU 생성·모델 다운로드·서빙 설치를 수행하지 않았다.\n\n## 03. PDF 입력과 출처 검증\n\n1. worker가 활성 사용자·프로젝트·editor/owner 권한을 다시 확인하고, 등록된 PDF 버전·파일·해시를 조회한다. 기존 작업은 로그인 세션보다 오래 실행될 수 있으므로 새 세션을 만들어 대신하지 않는다.\n2. 기존 LocalStorage에서 실제 원본 바이트를 읽고 크기·SHA-256·페이지 수를 확인한다. 이때 DB 트랜잭션을 닫은 뒤 파일을 읽는다.\n3. PyMuPDF **1.28.2**로 페이지별 텍스트를 원래 추출 순서와 공백 그대로 준비한다. 페이지 한 개를 `p1-text` 같은 블록 한 개로 다룬다. 등록 상한 20MiB·50쪽 외에 모델 입력은 기본 **32,000자**, 설정 최대 60,000자로 제한한다. 초과하면 자르거나 분할 호출하지 않고 실패한다.\n4. 텍스트가 없는 페이지, 읽기 불가능한 문자, 이미지가 포함된 페이지는 첫 텍스트 경로에서 거부한다. 스캔·혼합 이미지 PDF 지원을 완료한 것이 아니며 별도 OCR fallback을 사용하지 않는다. 본문 문자열 확인만으로 표의 시각적 열 관계를 검증했다고 보지 않는다.\n5. 공급자는 actor/project/run/criteria ID나 승인 여부를 반환할 수 없다. Qwen은 서버가 제시한 원문 줄·부분 구간 ID를 선택하며 서버가 원문을 복사하고 고정한 문맥으로 Criterion·SourceRef를 만든다. 복사한 페이지·블록·인용문이 실제 본문과 일치해야 한다.\n6. 조건 문장은 인용문과 같아야 하며 비어 있지 않은 기대값과 지정한 단위는 그 인용문의 문자 부분이어야 한다. 문서에 없는 값·인용문·다른 페이지 출처·모호한 값을 임의로 채우면 실패한다. 문자 포함 검증은 조건의 의미·그룹·예외 해석을 보증하지 않는다.\n7. 초안의 `extraction`에 원문 PDF 해시, 페이지 본문과 해시, parser·정책·prompt hash·응답 hash, 요청 모델, 모의/실제 모드, 미정 조건 ID를 보존한다. 공급자 원시 HTTP 응답·추론 과정·API 키는 저장하지 않는다.\n8. 공통 역할 경계와 DB 저장 직전에도 출처 구조·해시·문맥·설정 모드를 검증한다. 초안·단계 결과·해시·작업 완료는 같은 짧은 DB 트랜잭션으로 확정한다. HTTP 호출 동안 DB 연결이나 실행 행 잠금을 유지하지 않는다.\n\n`CriteriaDraft.extraction`과 `TeamConfiguration.pdf_extraction`은 선택적 확장이다. 기존 어댑터에는 필수로 요구하지 않고 설정/trace가 없는 기존 JSON에는 새 null 필드를 추가하지 않는다. 최신 공통 JSON Schema를 재생성했다. 새 PDF 기능을 사용하는 팀원은 갱신한 계약을 사용해야 한다.\n\n## 04. API와 worker 실행\n\n먼저 [4단계 등록 가이드](PDF_등록_버전저장_가이드.html)에 따라 M008+AF002와 전용 PDF root를 준비한다. 기존 app-only 설정의 허용 host/origin을 실행 주소와 맞춘다. owner 설정은 서버·worker에 넘기지 않는다. 이미 초기화한 root를 다시 초기화하지 않는다.\n\n터미널 A — API:\n\n```bash\n.venv/bin/python -m backend.agent_framework postgres-serve --env-file .runtime/framework-app.env --config examples/agent_framework/team_config.pdf-mock.json --pdf-storage-root \"$PWD/.runtime/framework-pdf\" --port 8012\n```\n\n터미널 B — worker:\n\n```bash\n.venv/bin/python -m backend.agent_framework worker --env-file .runtime/framework-app.env --config examples/agent_framework/team_config.pdf-mock.json --pdf-storage-root \"$PWD/.runtime/framework-pdf\"\n```\n\n`--once`를 붙이면 복구 검사 후 접수된 작업을 최대 한 건 처리하고 종료한다. API와 worker는 같은 신뢰한 설정을 사용한다. 설정·공통 코드 해시가 바뀐 이전 실행은 자동으로 새 설정에서 재개하지 않는다. 기존 기록을 보존하고 변경된 설정으로 새 요청 키·새 실행을 만든다.\n\n| 경로 (`/api/framework/v1` 아래) | 용도 |\n|---|---|\n| POST `/projects/{project_id}/document-versions/{version_id}/extractions` | 등록된 PDF로 A02-only 실행 접수. `202 queued` |\n| GET `/runs/{run_id}` | 상태·CriteriaDraft·출처 trace·오류 재조회 |\n| GET `/runs/{run_id}/steps` | A02 시작·완료·실패·결과 불명 단계 기록 |\n| GET `/runs/{run_id}/approvals` | 이번 단계의 새 PDF 실행에는 빈 승인 목록 |\n\n접수에는 기존 로그인 세션 쿠키, `X-CSRFToken`, `Origin`, `Idempotency-Key` UUID를 사용한다. **본문은 비운다.** 클라이언트 정답·모델 주소·actor/run/criteria ID를 받지 않는다. 서버가 run/criteria ID와 DocumentRef를 만든다. 같은 프로젝트·키·사용자·문서·설정의 재전송은 같은 실행을 돌려준다. 같은 키에 다른 문서·사용자·설정을 넣으면 409다.\n\n기존 이메일 계정 로그인 후 등록된 문서로 접수하는 Python 요청 부분:\n\n```python\nfrom uuid import uuid4\n# client는 기존 세션 쿠키와 허용 Origin을 보유한 httpx.Client다.\ntoken = client.get(\"/api/v1/auth/csrf\").json()[\"csrf_token\"]\nrequest_key = str(uuid4())  # 응답을 못 받으면 같은 키를 보존하여 확인\nresponse = client.post(\n    f\"/api/framework/v1/projects/{project_id}/document-versions/{version_id}/extractions\",\n    headers={\"X-CSRFToken\": token, \"Idempotency-Key\": request_key},\n)\nresponse.raise_for_status()\nrun_id = response.json()[\"context\"][\"run_id\"]\n```\n\n기존 로그인 예제는 [PostgreSQL 가이드](에이전트_프레임워크_PostgreSQL_실행가이드.html)를 따른다. 현재 PDF 전용 초안에 승인 명령을 보내면 409다. 보완·기준 확정·승인 버전 조회는 6단계에서 구현한다. 포스터 없는 상태에서 검수 job을 생성하지 않는다.\n\n## 05. 실제 Qwen 연결 준비\n\n실제 서버가 생기면 Qwen 예시 설정을 로컬 신뢰한 파일로 복사하고 `endpoint`, 요청 모델명, 입력·출력 제한을 맞춘다. 필요한 API 키는 별도 app-only env 파일의 `A02_QWEN_API_KEY`에 두고 Git·채팅·JSON 설정에 넣지 않는다. endpoint는 사용자 업로드에서 받지 않으며 URL에 비밀번호·query·fragment를 넣을 수 없다.\n\n클라이언트는 HTTP redirect·환경 proxy·재시도·형식 보정·대체 모델을 사용하지 않는다. read/write timeout 또는 5xx는 보수적으로 결과 불명으로 기록한다. 완성되지 않은 출력, 과대한 JSON, 중복 키, 스키마·출처 불일치는 실패로 닫는다. 실패 뒤에는 후속 역할을 실행하지 않는다.\n\n요청 경계는 Qwen의 [공식 vLLM API 설명](https://qwen.readthedocs.io/en/latest/deployment/vllm.html)에 맞춘 chat completions 형태다. HTTP 호출과 fake transport 검증에는 [HTTPX 공식 transport 문서](https://www.python-httpx.org/advanced/transports/)를 참고했다. 실제 Qwen3.5-4B 서버의 structured output 지원, 모델 가중치/revision, 시간·정확도는 해당 서버가 준비된 뒤 별도로 확인해야 한다. 응답의 모델명만으로 실제 가중치를 검증했다고 보지 않는다.\n\n## 06. 로컬 확인과 담당 파일\n\nDB 없이 명시한 PDF 한 건으로 mock 배선만 확인:\n\n```bash\n.venv/bin/python -m examples.agent_framework.a02_mock_demo --pdf docs/poster-baselines/2026-11-03/workflow/client-inputs/EXH-NEW004/전시_포스터_제작의뢰서_v0.2.pdf\n```\n\n이 로컬 명령은 UUID를 임의로 만든 개발용 결과이며 DB 등록·운영 인증·실모델 검증이 아니다. `--output`으로 UTF-8 파일을 저장할 수 있고 상위 폴더는 먼저 준비한다. 기존 POSIX LocalStorage 기반 PostgreSQL worker의 Windows 네이티브 실행은 검증하지 않았다. 위 로컬 mock 명령의 Windows 실행도 실제 기기 검증과 구분한다.\n\n| 파일 | 책임 |\n|---|---|\n| `backend/agent_framework/a02.py` | PDF 본문 준비, 모의/실제 공급자, 응답·출처 검증, worker 파일 접근 |\n| `backend/agent_framework/a02_source_selection.py` | 원문 줄·부분 구간 인덱스, 범위에 묶인 출력 스키마, 정확한 인용·값 복사 |\n| `backend/agent_framework/a02_requirements.py` | 검증된 선택의 리터럴 값 분리, 대상·항목명, 허용 범위 보존, 명시적 미정 구간 유지 |\n| `backend/agent_framework/a02_configuration.py` | 신뢰한 모드·모델·endpoint·parser·호출 제한 |\n| `backend/agent_framework/contracts.py` | 선택적 ExtractionTrace·PDFTextSource |\n| `backend/agent_framework/postgres.py` | 서버 ID·등록 PDF 참조 고정·접수·조회 |\n| `backend/agent_framework/durable_worker.py` | lease, 단일 역할 실행, 결과/출처·단계 원자 저장 |\n| `backend/agent_framework/postgres_api.py` | 인증·CSRF 기반 PDF-only 접수 |\n\n```bash\n.venv/bin/python -m pytest tests/agent_framework -q\nTEST_DB_ENV_FILE=/absolute/path/to/test-only.env .venv/bin/python -m pytest tests/agent_framework/test_a02_postgres_integration.py tests/agent_framework/test_pdf_postgres_integration.py tests/agent_framework/test_postgres_integration.py -m db_integration -q\n```\n\n통합 테스트는 격리 PostgreSQL 17에서만 실행하며 무작위 테스트 DB를 만든 뒤 제거한다. 새 API 인스턴스 재조회, 별도 worker CLI 프로세스, 실제 파일 변조, 모호한 공급자 실패 후 자동 재호출 없음, 불법 출처 저장 차단을 확인했다. 실제 모델 품질·사람의 정답 검토·보완 답변·기준 승인·운영 적용·원격 CI는 후속이다.\n","sha256":"e99e21a0cfe1b459b86d6887a3a9c9d0cbd953796a2329253dfab8493fc221c5"},"docs/agent-framework/README.md":{"text":"# 에이전트 공통 개발 프레임워크\n\n각 담당자가 같은 JSON 계약으로 자신의 역할을 단독 개발하고, 합성 입력으로 전체 흐름을 연결하는 개발용 기반이다. `backend/agent_framework`는 기존 제품 앱과 분리되어 있다.\n\n**[내 대기 작업 취소·이력 숨기기](내_작업_관리.md)** — 2026-11-09 AWS_TEST의 사용자별 작업 목록, 대기 취소, 완료·실패 이력 숨김/복원과 데이터 보존·배포 기록이다.\n\n**[전체 검수·Neo4j RAG·AWS HTTPS 배포 준비](AWS_전체검수_HTTPS_배포준비.md)** — 기존 A02 프로필을 보존한 실제 역할 구성과 별도 AWS Compose, RDS TLS·역할별 비밀 파일·RunPod 내부 터널을 준비한다. AWS 자원 생성·실모델 전체 성공·CD 실행과 구분한다.\n\n**[A02 실행·사용 가이드](A02_실행_사용가이드.html)** · [MD](A02_실행_사용가이드.md) — Docker 준비·이미지 빌드·RunPod 확인·SSH·API·worker·프론트를 순서대로 실행한다. Mac·Windows 명령, 이번 전시 PDF와 원본 포스터 경로, 정상 출력·진행률·오류 확인을 한 문서에 모았다. A02 문단 반영과 후속 포스터 검사·승인 범위를 구분한다.\n\n**[Mac·Windows 공통 실행 가이드](Mac_Windows_공통실행_가이드.html)** · [MD](Mac_Windows_공통실행_가이드.md) — 두 OS에서 같은 Python 실행기로 Docker Linux API·worker·저장 볼륨을 사용한다. RunPod SSH 터널과 비밀 설정·DB 접속 방법을 함께 설명한다. Windows 네이티브 POSIX 저장소 실행과 구분한다.\n\n**[담당자별 연결 위치·실행법 HTML](에이전트_프레임워크_가이드.html)** · [Markdown 원본](에이전트_프레임워크_가이드.md) — 역할별 수정 파일·factory·입출력·테스트 명령과 Git 기준 인수 절차를 정리했다.\n\n**[PostgreSQL 실행·승인·worker 가이드](에이전트_프레임워크_PostgreSQL_실행가이드.html)** · [MD](에이전트_프레임워크_PostgreSQL_실행가이드.md) — 기존 M008 DB의 AF001 추가 마이그레이션과 새 API·worker 실행법이다.\n\n**[PDF 등록·버전 저장 실행가이드](PDF_등록_버전저장_가이드.html)** · [MD](PDF_등록_버전저장_가이드.md) — 2026-11-03 4단계 구현. AF002와 전용 PDF 경로를 명시적으로 활성화하면 같은 DB·로그인·프로젝트에서 원본 등록과 재조회가 가능하다. 추출 연결은 아래 5단계 가이드로 이어진다.\n\n**[A02 조건 추출 연결가이드](A02_조건추출_연결가이드.html)** · [MD](A02_조건추출_연결가이드.md) — 현재 기본은 Qwen이 자유 입력·텍스트 PDF의 의미·유형·기대값을 직접 구조화하는 `a02-semantic-v3`다. 기존 worker·PostgreSQL 보완/승인/재조회 흐름을 재사용하며, 자유 입력 저장에는 AF004가 필요하다. 모델 실호출 진단과 격리 DB의 가짜 HTTP 검증을 구분한다.\n\n**[A02 실제 연결 검증 기록](A02_실제연결_검증기록_20261104.md)** — 11/04 사용자 환경에 AF004를 적용한 뒤 실제 Qwen으로 자유 입력 5개·PDF 13개 조건을 추출하고 기존 DB에 저장·재조회했다. 두 실행은 기준 검토 대기 상태이며 관람시간 미정 안내와 원문 누락 검토가 남아 있다. 미정 항목의 제외를 자동 결정하지 않는다. 후속 v4 문단 출력·사용자 화면 확인도 기록했다.\n\n**[A02 → 3. 검수 요구사항 문단 연결](A02_프론트_요구사항_문단연결.html)** · [MD](A02_프론트_요구사항_문단연결.md) — 기존 Qwen이 조건 추출과 화면용 문단을 한 번에 반환하는 v4 프로필이다. 임의 항목·여러 장소·시각 조건·규격을 대상으로 하며, 기존 PostgreSQL 저장·출처와 front-v2 입력을 연결한다. 새 이미지와 명시적인 presentation 프로필이 필요하다.\n\n**[기준 보완·승인 가이드](기준_보완승인_가이드.html)** · [MD](기준_보완승인_가이드.md) — 6단계 AF003 불변 기준 버전·보완 출처·승인 대상 해시·기존 승인 이력·재조회. 개발용 승인 시험이며 실제 클라이언트의 회신/승인은 아니다. 승인 후 포스터 대기 상태에서 멈춘다.\n\n**[포스터 검수·재검수 가이드](포스터_검수재검수_가이드.html)** · [MD](포스터_검수재검수_가이드.md) — 7단계 승인 기준·해시·출처를 기존 저장 이미지와 새 실행에 고정한다. 포스터별 입력 확인·독립 worker·검수/최종 결정·수정본 재확인을 실파일·격리 PostgreSQL·합성 관측으로 검증했다. 실제 모델/클라이언트 승인·front-v2 연결은 후속이다. [개발 시험 포스터 12장](../poster-baselines/2026-11-03/workflow/poster-tests/index.html).\n\n**[Qwen 서버 준비 가이드](Qwen_서버_준비가이드.md)** — 11/03 초기 GPU·서비스·HF 캐시·Git 및 메모리/포트/해시 점검 기록이다. 이후 서버 준비·실제 A02 연결 결과는 위 11/04 실제 연결 검증 기록을 따른다. [초기 점검 기록](qwen-server-preparation-2026-11-03.json).\n\n**[A02 PDF·Qwen·저장·승인 구조 설계](A02_PDF_Qwen_저장승인_구조설계.html)** · [MD](A02_PDF_Qwen_저장승인_구조설계.md) — 모델 서버가 아직 없는 상태에서 정리한 후속 설계안이다. API·worker·GPU 서버 경계, PDF 등록·승인 조회, 구현 순서를 설명하며 실제 연결 완료를 뜻하지 않는다.\n\n**[HTML 업무 흐름 열기](flow.html)** — 노드 선택·검색·확대/이동·기본 검수/재검수/근거 확인 필요 시나리오 탐색을 제공한다. HTML 파일을 브라우저에서 열면 되며 Python이나 서버를 실행할 필요가 없다. 실제 코드의 함수·클래스 관계는 **[Graphify 코드 지도](graphify-out/graph.html)**와 [추출 진단 보고서](graphify-out/GRAPH_REPORT.md)에서 확인한다. 업무 흐름은 코드·계획을 대조해 정리한 설명 그래프이며 실행 모니터가 아니다.\n\n브라우저에서 열 파일은 **`docs/agent-framework/flow.html`**이다. 업무 흐름의 원본은 `flow-data.json`과 빌드 전용 `scripts/templates/agent-flow.html.in`이며 `python -m scripts.build_agent_flow_html`로 단일 HTML을 재생성한다. 이전 `scripts/templates/agent-flow.html` 경로는 완성본으로 이동하는 안내 페이지다. Graphify 코드 지도는 별도 임시 환경의 공식 `graphifyy==0.9.100`으로 생성했다. 프로젝트 의존성에는 추가하지 않았다. 두 HTML은 자동 외부 자원을 로드하지 않도록 만들었으며 정적 구조·JavaScript 문법을 검사했다. 브라우저 렌더링은 미검증이다.\n\n현재 제공하는 것은 Pydantic 계약, 역할 포트, LangGraph 실행, 승인·재검수·파일 접근·CLI다. **기존 M008 인증·PostgreSQL API·독립 worker**가 PDF·자유 입력을 접수하고 Qwen으로 조건·문단을 추출해 front-v2에 전달한다. 기준 버전·승인·자유 입력은 AF001~AF004를 명시적으로 적용한다. 실제 A02 연결과 화면 반영은 11/04에 확인했다.\n\nmain의 A04·A05 검사 어댑터, A06 근거·단위 검증, A07 보고기와 A01·A08 에이전트도 함께 유지한다. **개발용 MCP 서버는 합성 어댑터·메모리 Workflow 위에서 실행되며 PostgreSQL API·worker를 제어하는 운영 MCP 연결과 구분한다.** 전체 포스터 실모델 검사·PostgreSQL/Neo4j 관계 검색·RAG·projection·최종 승인·AWS 배포 완료를 뜻하지 않는다.\n\n현재 공통 계약은 **3.0.0**이다. A02의 원문·의미·문단 필드와 A06의 관측 상태·단위·판정 상세를 함께 보존한다. [A06 계약 가이드](a06-contract-v3.md)와 [A02 실행 가이드](A02_실행_사용가이드.html)를 따른다. 구버전 설정·저장 실행은 자동 변환하지 않으며 원본 기록을 보존한다. [PDF 등록 가이드](PDF_등록_버전저장_가이드.html), [A03 제거 정리](a03-retirement-2026-11-02.md)와 [이전 검증 기록](verification-2026-11-02.md)은 시점을 구분한다.\n\n제품 목표는 **PDF·Qwen3.5-4B·PostgreSQL/Neo4j 근거 검색 및 RAG·데스크톱 front-v2**다. PaddleOCR를 포함한 별도 OCR 대체 경로, 벡터 DB·임베딩·벡터 인덱스를 추가하지 않는다. 실제 어댑터 구현 범위는 [전체 계획](../planning/pdf-qwen-rag-workflow-plan-2026-11-02.md)을 따른다.\n\n## 최신 역할 결정\n\n**독립 A03 검색·근거 에이전트는 폐기했다.** [11월 2일 통합문서](reference/프로젝트_통합문서_20261102.html#section-014)를 따른다. 네 역할(A02·A04_A05·A06·A07)과 공통 A01·A08만 유지한다. 승인 조건 출처는 `context.freeze_approved_context`로 고정하며 이 함수는 외부 조회를 하지 않는다. PostgreSQL→Neo4j→PostgreSQL 관계 조회·RAG는 후속 공통 문맥 준비 기능이고 별도 GraphDB 에이전트 배치는 미확정이다. 새 요청과 설정은 계약 3.0.0을 사용하며 구버전 저장 실행은 자동 변환·재개하지 않는다.\n\n## 설치와 첫 실행\n\n저장소 루트에서 실행한다. Python **3.12 이상, 3.14 미만**과 `uv`가 필요하다. 의존성 정본은 루트 `pyproject.toml`·`uv.lock`이며 개별 에이전트용 requirements를 따로 만들지 않는다.\n\n```sh\nuv sync --locked --group dev\n```\n\n이 명령은 잠금 버전으로 개발 의존성을 동기화한다. 이미 설치된 `.venv`를 사용해도 되지만 잠금 파일과 다른 환경의 결과를 동일한 검증으로 표시하지 않는다.\n\nmacOS:\n\n```sh\n.venv/bin/python -m backend.agent_framework demo\n.venv/bin/python -m pytest tests/agent_framework -q\n```\n\nWindows PowerShell:\n\n```powershell\n.\\.venv\\Scripts\\python.exe -m backend.agent_framework demo\n.\\.venv\\Scripts\\python.exe -m pytest tests/agent_framework -q\n```\n\n`demo`는 **SYNTHETIC** 안내를 stderr에, 결과 JSON을 stdout에 출력한다. 조건 승인 → 검사·보고 → 수정 요청 승인 → 새 포스터 버전 → 조건 재승인 → 전체 재검수 → 최종 승인까지 두 실행을 만든다. 여기서 승인자는 스크립트가 넣은 테스트 값이며 실제 사용자의 승인 증거가 아니다.\n\n콘솔 JSON은 Windows 리디렉션·CI의 CP1252 출력에서도 값이 보존되도록 표준 Unicode escape로 출력한다. JSON을 파싱하면 한글 원문으로 복원된다. 명시적 출력 파일은 UTF-8 한글로 저장한다.\n\n`--output \u003c파일\u003e`로 JSON을 저장할 수 있다. 상위 디렉터리는 미리 존재해야 한다. 합성 참조의 파일 해시는 예제 문자열의 해시이며 실제 PDF·이미지 파일의 해시가 아니다.\n\n## 담당별 입력과 출력\n\n| 역할 | 호출 포트 | 입력 → 출력 | 담당 범위 |\n|---|---|---|---|\n| A01 | `Workflow.start/approve/get` · `agents.RunCoordinator.assess` | 실행 문맥·파일 참조·승인 → `RunSnapshot` / 실행 ID → `CoordinationNote` | 공통 실행·상태 전환·계약 연결, 상태 해석·다음 조치 안내 에이전트 |\n| A02 | `Extractor.extract` | `ExtractRequest` → `CriteriaDraft` | 자유 입력·PDF 조건 구조화·원문 출처 |\n| A04·A05 | `Inspector.inspect` | `InspectRequest` → `InspectionResult` | 현재 포스터 관측·조건별 판정 초안 |\n| A06 | `Validator.validate` | `ValidateRequest` → `ValidatedResult` | 전체 조건 커버리지·관측·인용·판정 검증 |\n| A07 | `Reporter.report` | `ReportRequest` → `ReportDraft` | 검증된 판정의 설명·수정 요청 초안 |\n| A08 | `Workflow.rereview` · `agents.RereviewAgent.request/compare` | 부모 실행·새 문맥·새 산출물 → 새 `RunSnapshot` / `RereviewSummary` | 수정 요청 승인 확인·전체 재검수, 재검수 요청 판단·수정 전후 비교 에이전트 |\n\n소유 파일은 다음처럼 나눈다.\n\n- 공통 기반 담당: `contracts.py`, `ports.py`, `runtime.py`, `validation.py`, `api.py`, CLI, 계약 스키마, 통합 테스트.\n- 개별 담당: 팀 소유 어댑터 모듈과 해당 테스트. 다른 역할의 내부 구현이나 ORM을 직접 import하지 않는다.\n- A01·A08 상태 전환은 공통 기반 담당이 관리한다. DB 스키마·마이그레이션도 통합 담당 한 명이 소유하며 각 역할이 독립 테이블을 임의 생성하지 않는다.\n- front-v2·기존 인증·M008·운영 worker 변경은 별도 제품 통합 작업이다.\n\n## 한 역할만 실행하기\n\n예제 입력·예상 출력은 `examples/agent_framework/`에 있다. 역할 입력은 `A02.json`처럼, 예상 출력은 `A02.output.json`처럼 구분한다.\n\n```sh\n.venv/bin/python -m backend.agent_framework role A04_A05 --input examples/agent_framework/A04_A05.json --synthetic --scenario fail\n.venv/bin/python -m backend.agent_framework role A06 --input examples/agent_framework/A06.json --synthetic\n```\n\nWindows 실행 파일은 `.\\.venv\\Scripts\\python.exe`이며 인자는 동일하다.\n\n`--synthetic` 시나리오는 `pass`, `fail`, `review`, `stale`, `unavailable`다. 시나리오 효과는 해당 역할에 한정된다. 예를 들어 A06는 받은 관측을 검증하므로 `--scenario fail`만 주어 관측을 임의 변경하지 않는다. 연속 시나리오의 검증 결과는 `examples/agent_framework/scenarios/*.validated.json`에 있다.\n\nCLI는 요청·응답 스키마와 공통 역할 검증을 적용한다. `--synthetic`, `--factory`, `--config` 중 어느 것도 지정하지 않으면 `ADAPTER_NOT_CONFIGURED`로 종료한다. 미구현 어댑터를 합성 성공으로 대체하지 않는다.\n\n종료 코드는 정상 계약 출력 `0`, 어댑터·역할 검증 실패 `1`, 입력·파일·설정 오류 `2`다. 기계 판정 `fail/review`도 정상적인 검사 결과이므로 그것만으로 CLI 오류가 되지는 않는다. 역할 처리 오류는 `error` 안에 `FrameworkError` 계약을 담은 JSON으로 반환하며 실패 시 기존 출력 파일을 덮어쓰지 않는다. 명령 인자 사용법 오류는 stderr의 안내를 확인한다.\n\n## 자신의 어댑터 연결\n\n`examples/agent_framework/custom_adapter.py`는 연결 지점 예제다. 기본 상태에서는 실제 서비스를 호출하지 않고 `ADAPTER_NOT_CONFIGURED`를 발생시킨다. 메서드를 구현한 뒤 명시적으로 factory를 선택한다.\n\n```sh\n```\n\n기존 `--factory`의 factory는 인자 없이 호출되며 `ports.Agents`를 반환해야 한다. 아래 역할별 설정의 factory는 단일 역할 어댑터를 반환한다. factory import는 로컬 Python 코드를 실행하므로 팀이 관리하는 신뢰된 모듈만 지정한다. 요청 JSON 안에서는 factory나 모듈을 지정할 수 없다.\n\n각 메서드는 동기식 계약을 따른다. 현재 프레임워크가 async 함수·원격 호출 timeout·재시도·비밀정보 설정을 대신 구현하지 않는다. 원격 호출 결과를 알 수 없으면 `AdapterFailure(..., outcome_unknown=True)`로 반환하고 자동으로 다시 호출하지 않는다. 알려진 오류 메시지만 안전하게 전달한다.\n\n실제 출력은 실행 증거가 있을 때만 `synthetic=False`로 표시한다. 합성 입력이나 이전 단계가 섞인 전체 실행은 계속 `synthetic=True`로 추적된다. 이 플래그 자체가 실제 모델·DB 연결을 증명하지는 않는다.\n\n모든 역할 요청에도 `synthetic` 필드가 있다. 합성 조건 초안의 출처 묶음을 공통 함수로 고정할 때도 이 표시를 유지한다. 같은 어댑터 인스턴스는 여러 실행에서 호출될 수 있으므로 공유 상태의 스레드 안전성과 모델 동시 실행 제한은 해당 구현에서 관리한다.\n\n## 계약에서 지켜야 할 경계\n\n- **ID와 버전:** 프로젝트·실행·문서·조건·산출물 버전은 요청 문맥과 동일해야 한다. ID는 공통 `Identifier` 문자열 규격을 사용하며 모델이 임의 발급·변경하지 않는다. 제품 UUID 매핑은 이후 저장소 어댑터가 맡는다.\n- **원문:** 인용 위치는 1부터 시작하는 페이지와 블록 ID를 사용한다. `SourceRef.source_hash`는 인용문 UTF-8 바이트의 SHA-256이며 파일 해시와 다르다. 참조 검증은 해시 정합성을 확인할 뿐 실제 PDF에 그 문장이 있다는 사실을 증명하지 않는다.\n- **현재 관측:** 이미지 근거는 현재 산출물 버전·파일 해시를 가리킨다. 좌표가 있으면 정규화된 `x1,y1,x2,y2`를 사용한다. 과거 통과나 예외 승인은 현재 이미지 관측이 아니다.\n- **근거:** `current_requirement`, `approved_exception`, `historical_context`를 구분한다. 예외 유효기간·철회·권한 확인은 후속 공통 문맥 준비 서비스의 책임이다. 참조 코드의 범위 검사를 실제 권한 검사로 부르지 않는다.\n- **조건 전체:** 공통 근거 조회가 검사 조건을 줄이면 안 된다. A06는 누락·중복·알 수 없는 ID·근거 부족을 확인하며 잘못된 통과를 차단한다.\n- **텍스트 기대값:** `text`의 `equals`·`contains`에서 기대값이 비어 있거나 공백뿐이면 `missing_expected_value`와 `review`로 남긴다. 누락 값을 문자열 비교로 통과·위반 판정하지 않는다. 필수 조건의 보류는 정상 최종 승인을 차단하고, 미확정 기대값은 예외 승인으로 우회할 수 없다. 값이 있는 기대값은 공백을 제거하지 않고 그대로 비교한다.\n- **판정:** 실행 상태, 기계 판정, 사람 결정을 별도로 기록한다. A07은 A06의 판정을 변경하지 않는다. 예외 승인도 원래 기계 판정을 보존한다.\n- **재검수:** 수정 요청 승인 후 새 실행·산출물 버전을 등록한다. 메모리 예제는 같은 문서·조건 버전의 초안을 재사용한다. AF003 등록 포스터 경로는 승인된 기준 버전·해시·원문/보완 출처를 고정하고, 새 포스터의 입력 확인을 별도로 받는다. 승인 입력·근거를 다시 고정하고 A04_A05·A06·A07을 모두 다시 실행한다. 문서나 기준 버전이 달라지면 새 A02 및 기준 승인이 필요하다. AF003 보완 API와 등록 포스터 경로는 각각 위 전용 가이드를 따른다.\n\n참조 A06는 텍스트·수치 대조와 누락·근거·범위의 기초 정책을 제공한다. 객체를 잘못 센 모델을 자동으로 교정하거나 시각 관측의 정확도를 보장하지 않는다. 복잡한 조건 그룹·정책 예외·문맥 판단은 후속 구현과 평가가 필요하다.\n\n최종 승인은 모든 필수 항목이 기계 판정 `pass`이거나 담당자가 직접 확인한 `human_reviews`의 `pass`여야 한다. 기계 판정은 보존하며 확정 위반·기준 누락·근거 오류는 직접 확인으로 우회할 수 없다. 항목별 확인 내용·위치·사유를 기록하는 절차는 [기준 보완·승인 가이드](기준_보완승인_가이드.md)를 따른다. 개발 참조 정책의 예외 승인은 근거가 완전한 확정 `fail`만 대상으로 하며 `review`나 알 수 없는 검증 사유는 거부한다. 현재 예외 허용 사유는 `value_mismatch`다.\n\nA07의 문장 다듬기는 선택 기능이다. 실패하면 `ReportDraft.polish_status`와 안내 문구를 남기고 규칙 보고서로 검토를 계속한다. A06 판정·근거와 수정 요청은 유지하며 모델을 자동 재호출하지 않는다. 그 외 필수 모델 호출은 연결 전 실패·429를 재시도 가능한 실패, 전송 후 시간 초과·5xx를 결과 불명으로 구분한다. 어느 경우에도 자동 재호출하지 않는다. 모델 응답은 수신 중 크기를 제한하며 압축 응답은 거부한다.\n\n## 개발 API 프로토콜\n\nCLI 없이 팀별 클라이언트를 붙일 때 사용하는 **인증 없는 loopback 개발 API**다. 기존 제품 앱에는 마운트하지 않는다. API 기본 어댑터는 합성이며 health와 snapshot으로 개발 상태를 확인한다.\n\nmacOS 실행 명령:\n\n```sh\n.venv/bin/python -m uvicorn backend.agent_framework.api:create_app --factory --host 127.0.0.1 --port 8012\n```\n\nWindows PowerShell 실행 명령:\n\n```powershell\n.\\.venv\\Scripts\\python.exe -m uvicorn backend.agent_framework.api:create_app --factory --host 127.0.0.1 --port 8012\n```\n\n| 메서드·경로 | JSON 본문·응답 |\n|---|---|\n| `GET /api/framework/v1/health` | 개발 profile·합성 기본값·메모리 저장·인증 없음 |\n| `POST /api/framework/v1/runs` | `{context, document, asset}` → `RunSnapshot` |\n| `GET /api/framework/v1/runs/{run_id}` | 현재 프로세스가 보유한 실행 스냅샷 |\n| `GET /api/framework/v1/runs/{run_id}/steps` | 실행 중에도 조회 가능한 역할별 `StepTimeline` |\n| `POST /api/framework/v1/runs/{run_id}/approvals` | `Approval` → 갱신된 스냅샷 |\n| `POST /api/framework/v1/runs/{run_id}/revisions` | `{context, asset}` → 새 실행 스냅샷 |\n\nAPI를 실행하지 않아도 `examples/agent_framework/openapi.json`으로 계약을 확인할 수 있다. 실행 후에는 `/docs`와 `/openapi.json`을 사용한다. 입력 구조 오류는 422, 없는 실행은 404, 상태·승인 충돌은 409다. 단계 어댑터 실패는 반환된 스냅샷의 `failed/outcome_unknown`과 `error`로 확인한다. HTTP 성공만으로 검수 통과를 판단하지 않는다.\n\n`actor_id`는 테스트 문맥이며 로그인·권한의 증명이 아니다. `127.0.0.1`에만 바인딩한다. Host 검사만으로 외부 노출을 안전하게 만들 수 없다. 메모리 상태를 쓰므로 다중 worker·다중 인스턴스로 실행하지 않는다.\n\n현재 Workflow는 동기식이다. 시작·조건 승인 요청은 해당 역할 실행이 끝난 뒤 반환한다. 실행 명령용 잠금과 조회용 잠금을 분리하여 같은 실행의 GET은 어댑터 종료를 기다리지 않고 일관된 최신 스냅샷을 반환한다. 실행 중 상태는 `extracting` 또는 `reviewing`이며 실제 시작한 역할을 아래 단계 기록으로 확인한다. 제품용 비동기 작업 접수·작업 큐 API는 후속 범위다.\n\n## A01·A08 에이전트와 MCP 도구\n\nA01·A08은 공통 상태 전환 코드 위의 **Qwen3.5-4B 도구 호출 에이전트**다. 모델은 도구를 고르고 설명을 쓰며, 상태 전환·승인·버전 검사는 계속 `Workflow`가 결정한다. 사람 승인을 대신하지 않고 A02~A07 단계 기록에도 포함되지 않는다.\n\n| 구성 | 파일 | 내용 |\n|---|---|---|\n| MCP 서버 | `mcp_server.py` | `get_run`, `get_steps`, `get_approval_history`, `start_run`, `request_rereview`. Bearer 토큰(32자 이상) 필수, **승인 도구 미노출**. `McpToolClient`는 도구 예외·빈 응답을 `McpToolError`(결과 불명)로 올린다 |\n| 도구 호출 루프 | `agents/loop.py` | vLLM OpenAI 호환 API. 턴 수 제한, 쓰기 도구 1회 실행, 결과 불명 쓰기는 `outcome_unknown`으로 남기고 재호출하지 않는다 |\n| A01 `RunCoordinator` | `agents/coordinator.py` | 읽기 도구만 쓴다. 현재 상태에서 허용되는 `next_action`만 받아들인다 |\n| A08 `RereviewAgent` | `agents/rereview.py` | `request`: 재검수 요청 판단(새 문맥·산출물은 코드가 고정), 거절된 요청은 `request_error`로 구분. `compare`: 부모·자식 판정 비교 |\n\n모델 답이 실행 결과·기록과 다르면 `AGENT_ACTION_NOT_ALLOWED`·`AGENT_OUTPUT_INCONSISTENT`로 실패한다. JSON 형식이 틀린 답과 실행하지 않은 도구를 했다고 한 답에만 각각 한 번 정정 기회를 준다. 코드가 검증하는 것은 구조화 필드뿐이다. 사용자용 `summary`는 코드가 실행 사실로 만들고, `model_summary`·`model_blockers`는 **검증하지 않은 모델 문장**이므로 구분해 표시한다.\n\n개발용 MCP 서버(합성 어댑터·메모리 상태, PostgreSQL API·worker와 미연결)는 `AGENT_FRAMEWORK_MCP_TOKEN`을 주고 다음처럼 실행한다. `PostgresStore` 연결은 서비스 계정 권한 설계가 필요한 후속 범위다.\n\n```sh\n.venv/bin/python -m uvicorn backend.agent_framework.mcp_server:create_development_app --factory --host 127.0.0.1 --port 8013\n```\n\n테스트는 두 가지다. `test_agents_mcp.py`는 스크립트 모델과 로컬 HTTP MCP 서버로 검증하며 Qwen을 호출하지 않는다. `test_agents_live.py`(`live_model` 마커, 기본 제외)는 worker와 같은 `CC_QWEN_BASE_URL`·`CC_QWEN_API_KEY`를 프로세스 설정에서 재사용하고 `pytest -m live_model tests/agent_framework/test_agents_live.py`로 실행한다. 별도 테스트 전용 주소·키 변수는 사용하지 않으며 개인 env 파일을 자동 탐색하지 않는다. 공통 주소가 없으면 실모델 검사는 건너뛴다.\n\n2026-11-03 vLLM 0.33.0(`--enable-auto-tool-choice --tool-call-parser qwen3_coder`)의 Qwen3.5-4B로 4개 시나리오가 통과한 것은 당시 기록이다. 11/05 서버 옵션 적용 직후에는 3개 통과·A08 출력 계약 1개 실패였고, [A08 출력 계약 수정·실모델 검증](A08_출력계약_수정검증_20261105.md) 후에는 네 실모델 사례가 모두 통과했다. live 테스트는 프로세스 안 `FrameworkTools`로 도구를 부르므로 Qwen과 HTTP MCP를 묶은 종단 간 검증은 아니며, 합성 시나리오 통과가 실제 업무 정확도를 보장하지 않는다.\n\n## 단계별 실행 기록\n\n`RunSnapshot.step_records`와 `Workflow.get_steps(run_id)`에서 A02, A04_A05, A06, A07의 실행 기록을 확인한다. 개발 API의 `/runs/{run_id}/steps`는 원문·검사 결과 본문 없이 문맥 ID, 실행 상태, 역할별 기록을 반환한다. 기록의 `ordinal`은 해당 실행 안의 1부터 시작하는 순서다.\n\n| 상태 | 의미 |\n|---|---|\n| `running` | 역할 입력 구성·공통 검증·어댑터 호출·출력 검증을 진행 중 |\n| `completed` | 공통 계약과 출처 검증을 통과한 결과를 스냅샷에 반영함 |\n| `failed` | 오류로 종료했으며 후속 역할을 실행하지 않음 |\n| `outcome_unknown` | 외부 호출의 결과가 불명확함. 자동 재시도하지 않음 |\n| `reused` | 재검수에서 부모의 A02 조건 초안을 재사용함. 새 모델 호출이 아님 |\n\n- `recorded_at`, `started_at`, `finished_at`은 UTC 시각이고 `duration_ms`는 단조 시계로 측정한다. 사람의 승인 대기 시간은 역할 소요 시간에 포함하지 않는다. 시스템 시각이 뒤로 바뀌면 종료 시각은 시작보다 앞서지 않게 보정하며 소요 시간은 단조 시계 값을 유지한다.\n- 진행 중에는 종료 시각·소요 시간·오류가 `null`이다. `reused`에는 `source_run_id`만 지정하고 호출 시각·소요 시간을 만들지 않는다.\n- 오류 기록에는 제한된 형식의 코드, 공통 안내, 재시도 가능 여부, 결과 불명 여부만 담는다. 원문, 파일 바이트, 프롬프트, 공급자 예외 문자열은 넣지 않는다. `retryable=true`도 자동 재시도를 뜻하지 않는다.\n- 출력 계약 위반은 단계의 구체적인 코드로 확인한다. 기존 실행 스냅샷의 상위 오류 분류 `contract_violation`은 유지한다.\n- 기존 `stages`는 완료한 흐름 표시로 유지한다. A01/A08 조정과 사람 승인은 모델 역할 호출이 아니므로 단계 호출 기록을 만들지 않으며, 승인 내역은 `approvals`에 남는다. `completed`는 역할 처리 완료이며 기계 판정 `pass`나 최종 사람 승인과 다르다.\n- 부모와 재검수 실행의 기록은 분리된다. 중복·오래된 승인, 중복 실행 ID 거부는 역할을 재호출하거나 기록을 추가하지 않는다.\n- `synthetic`은 합성 자료의 전파 표시다. `false`나 역할 처리 완료만으로 실모델·DB 연결을 증명하지 않는다. 메모리 기록이므로 프로세스 종료 후 복구되지 않으며 시도 재개·영속 감사 로그가 아니다.\n\n기존 CLI 데모에도 각 실행의 `step_records`가 포함된다.\n\n```sh\n.venv/bin/python -m backend.agent_framework demo\n```\n\nWindows에서는 `.\\.venv\\Scripts\\python.exe -m backend.agent_framework demo`를 실행한다. Python에서는 같은 `Workflow` 객체의 `get_steps(run_id)`를 호출하며, API에서는 시작 요청에 사용한 실행 ID로 위 GET 경로를 조회한다. CLI 데모와 별도로 실행한 API 서버는 메모리를 공유하지 않는다. 역할 단독 `role`·`check` 명령은 Workflow 실행을 만들지 않으므로 이 이력에 기록되지 않는다.\n\n## 저장·복구 범위\n\n`demo`, `serve`, `check-flow`의 `Workflow`는 **메모리 개발 도구**이며 종료하면 기록이 사라진다. 새 `postgres-serve`·`worker` 경로는 동일 M008 DB의 `agent_framework` 스키마에 실행·단계·승인·작업·이벤트를 저장한다. 기존 인증과 프로젝트 권한을 재사용하며 승인 대기에는 lease를 유지하지 않는다. 자세한 실행법은 PostgreSQL 가이드를 따른다.\n\n메모리 경로는 중복·오래된 명령을 거부한다. PostgreSQL 경로는 같은 고정 입력·승인의 재전송을 기존 기록으로 반환하고, 완료한 역할 결과를 재사용한다. 역할 시작 표시 전에만 안전한 재선점을 허용하며, 호출 가능성이 있으면 결과 불명으로 닫고 자동 재호출하지 않는다. LangGraph 자체 checkpoint와 업무 DB가 하나의 트랜잭션이라고 가정하지 않고 DB에 확정한 결과를 기준으로 재개한다.\n\nPostgreSQL·Neo4j RAG의 실제 쿼리, projection/outbox, 검색 권한·원문 버전·freshness, 동등한 SQL fallback, MCP 전송 및 모델 실행은 각 담당자가 연결해야 한다. 원문 파일 읽기·해시 검증에는 아래 공통 파일 접근 연결부를 사용한다. 메모리 개발 명령은 기존 DB를 변경하지 않으며 PostgreSQL 명령은 명시적으로 선택한 DB의 AF001 기록을 읽고 쓴다. front-v2 통합은 후속 범위다.\n\n## 설정한 어댑터의 전체 흐름 검증\n\n`check-flow`는 팀 설정의 **네 역할을 모두 초기화**하고 같은 `Workflow`에서 시작 → 조건 승인 → 수정 승인 → 수정본 실행 생성 → 수정본 조건 승인 → 최종 승인 순으로 실행한다. 시작/조건 승인이 각각 추출 및 검사·보고 그래프를 실행한다. 모든 승인은 로컬 개발용 테스트 입력이며 운영 승인 권한을 대신하지 않는다.\n\n프로젝트 루트에서 기본 합성 구성으로 확인한다.\n\n```sh\n.venv/bin/python -m backend.agent_framework check-flow --config examples/agent_framework/team_config.synthetic.json --case examples/agent_framework/workflow.synthetic.json\n```\n\nWindows PowerShell:\n\n```powershell\n.\\.venv\\Scripts\\python.exe -m backend.agent_framework check-flow --config examples/agent_framework/team_config.synthetic.json --case examples/agent_framework/workflow.synthetic.json\n```\n\n`--output 보고서.json`으로 성공·실패 결과를 저장한다. 종료 코드는 전체 기대 일치 `0`, 실행 실패·결과 불명·기대 불일치 `1`, 잘못된 입력·설정 `2`다. 입력 검증과 factory 초기화 실패 시 기존 보고서를 유지하며 설정·사례 파일을 출력으로 덮어쓸 수 없다. 출력 폴더는 미리 생성한다.\n\n담당자의 어댑터를 연결할 때는 자기 팀 구성 JSON의 `factory`를 지정하고, `workflow.synthetic.json`을 별도 사례 파일로 복사해 아래 값을 실제 개발 데이터에 맞춘다. 기본 합성 파일 참조를 실모델 입력으로 사용하지 않는다.\n\n| 필드 | 값 |\n|---|---|\n| `id` | 개발 검사 사례 식별자 |\n| `context`, `document`, `asset` | 최초 실행 문맥과 PDF·포스터 참조 |\n| `revision_context`, `revision_asset` | 부모 ID를 지정한 새 실행과 새 포스터 버전 |\n| `expected_initial_verdict` | 최초 검사에서 기대하는 `pass`·`fail`·`review` |\n| `expected_revised_verdict` | 정상 최종 승인을 위한 `pass` |\n| `change_reason` | 테스트 수정 승인 사유 |\n\n같은 프로젝트·PDF·조건 버전을 유지하고 새 실행 ID·포스터 버전으로 재검수한다. `actor_id`와 파일 권한은 기존 인증 경계에서 주입한 카탈로그와 일치해야 한다. 사례·구성 JSON은 UTF-8 BOM을 허용하고 중복 키·잘못된 계약·버전 연결은 factory 실행 전에 거부한다. 입력에는 파일 시스템 경로나 factory를 넣지 않는다. factory를 초기화하거나 메서드를 호출할 때는 담당 코드가 모델·DB에 접속할 수 있으므로 개발 데이터와 적절한 설정으로 명시적으로 실행한다.\n\n기대 판정·상태·사람 결정·실제 역할 순서 중 하나라도 다르거나 단계 오류가 나면 **이후 동작을 전부 건너뛴다**. 최초 `fail/review`도 선언한 기대와 같으면 수정 승인으로 이어질 수 있지만, 수정본이 `pass`가 아니면 최종 승인을 하지 않는다. 자동 재시도·예외 승인은 수행하지 않는다.\n\n보고서에는 동작별 성공/실패/건너뜀, 실제 상태·기계 판정·테스트 사람 결정, 합성 표시, 역할별 시간·오류 기록, 입력·구성·스냅샷의 SHA-256이 포함된다. 해시는 기본값을 포함한 **검증된 JSON의 정규 직렬화**를 대상으로 하며 입력 파일 바이트의 해시가 아니다. 스냅샷 해시는 당시 시각·소요 시간도 포함하므로 반복 실행 간 같다고 기대하지 않는다. 원문·프롬프트·역할 출력 본문·승인 사유는 보고서에 넣지 않는다. `passed`는 테스트 기대 일치이며 `connection_verified`와 `production_ready`는 계속 `false`다.\n\n기존 파일 저장 기능까지 포함한 별도 예제:\n\n```sh\n.venv/bin/python -m examples.agent_framework.file_flow_demo\n```\n\nWindows에서는 `.\\.venv\\Scripts\\python.exe -m examples.agent_framework.file_flow_demo`를 실행한다. 이 예제는 PDF와 두 포스터를 생성하여 기존 `services.store_file`·`LocalStorage`와 격리 SQLite에 등록한다. 설정 파일의 factory로 `FileBackedExtractor`·`FileBackedInspector`를 조합하고 실제 파일·버전·해시 검증을 거쳐 **초록 표식 2개 불합격 → 3개 수정본 통과 → 테스트 최종 승인**을 확인한다. PDF는 텍스트를 직접 읽고 이미지는 정해진 위치의 픽셀을 세는 테스트 콜백이며 Qwen·Neo4j를 호출하지 않는다. 합성 근거·보고와 테스트 승인을 사용하므로 모든 실행은 `synthetic=true`다. 임시 파일과 DB는 종료 후 정리된다.\n\n`file_flow_demo`의 factory는 예제 실행 안에서 바인딩한 임시 의존성만 사용한다. 외부 팀 설정에 그대로 복사하는 상시 서비스 factory가 아니다. 독립 담당자는 `team_adapters.py`와 파일 접근 가이드에 맞춰 자신의 인증·저장소·모델 클라이언트를 주입한다.\n\n## 테스트·예제·스키마 갱신\n\n```sh\n.venv/bin/python -m pytest tests/agent_framework -q\n.venv/bin/python -m backend.agent_framework schema\n.venv/bin/python -m scripts.export_agent_framework\n```\n\n`scripts/export_agent_framework.py`는 `examples/agent_framework/` 아래 합성 입력·출력, `schemas/*.schema.json`, `openapi.json`을 함께 재생성한다. 실제 모델·DB는 실행하지 않는다. Windows에서는 `.\\.venv\\Scripts\\python.exe -m scripts.export_agent_framework`로 실행한다.\n\n스키마만 별도 디렉터리에 받으려면 `schema --output-dir \u003c디렉터리\u003e`를 사용한다. `CONTRACT_TYPES`의 각 타입에 대해 `NAME.schema.json`을 생성한다. 합성 역할 예제만 재생성하는 명령은 `python -m backend.agent_framework.adapters.generate_examples`다.\n\n공통 회귀에서 보존할 여섯 반례 묶음:\n\n| 반례 | 기대 동작 |\n|---|---|\n| 다른 프로젝트·문서·산출물 버전 | 범위 변경을 거부하고 성공 출력 차단 |\n| 근거 ID·인용 해시 위조, 과거 이력의 현재 관측 사용 | 인용·근거 검증 실패 |\n| 조건 누락·중복, 수량 불일치인데 통과 | 누락은 확인 필요, 확실한 위반은 유지 |\n| 검색 stale/unavailable, 관측 부족 | 확인 필요를 숨기지 않고 정상 통과 차단 |\n| A07 판정 변경, 승인 전 재검수·중복 승인 | 상태·판정 경계에서 거부 |\n| 미설정 어댑터, 모델 호출 결과 불명 | 합성 대체·자동 재호출 없이 명시적 실패/결과 불명 |\n\nCI에는 같은 계약·어댑터·CLI·runtime·API 테스트를 연결한다. 테스트 결과는 합성/계약 검증이며 실모델 정확도·실제 DB 성능·Windows 장치 검증을 대신하지 않는다. Windows 명령은 해당 플랫폼에서 실행한 증거와 별도로 관리한다.\n\n## 계약 변경 규칙\n\n1. 변경 제안에 영향받는 역할·필드·예제·소비자를 적고 공통 기반 담당과 먼저 합의한다.\n2. `contract_version`을 관리한다. 필드 제거·이름/의미/타입 변경은 호환되지 않는 변경으로 취급하고 이전 소비자 처리 방안을 함께 정한다.\n3. 계약을 바꿀 때 JSON Schema, 입력·출력 fixture, 반례, 문서·API 명세를 같이 갱신한다. 생성 파일만 수작업으로 고치지 않는다.\n4. 자기 역할 단독 테스트와 전체 합성 승인·재검수 테스트를 모두 통과시킨다. 인터페이스만 맞는다고 제품 통합 완료로 보고하지 않는다.\n5. 제품의 인증·파일 접근·M008·영속 실행기에 연결할 때에는 공통 통합 담당이 마이그레이션·권한·실행 소유권을 조정한다. 운영 데이터 변경은 이 개발 프레임워크 범위 밖이다.\n\n## 팀 공유 · macOS / Windows\n\nGit으로 받은 팀원은 **[공유 시작 페이지](index.html)**를 Chrome에서 연다. HTML만 열람할 때 Python, 서버, 가상환경은 필요하지 않다. [브라우저용 개발 안내](guide.html)에 두 OS의 실행 명령이 있다.\n\n공유 기준은 Git 저장소다. `share/에이전트_흐름도`와 기존 ZIP은 이전 공유 사본이며 현재 작업의 재배포 대상으로 갱신하지 않는다. 팀원은 루트의 코드·예제·테스트와 `docs/agent-framework`를 사용한다. 문서는 저장소 상대 경로로 연결하며 실제 Windows 장치 실행·렌더링은 별도 검증 대상이다.\n\n코드 근거는 `source.html?file=저장소상대경로#L행번호`로 열어 브라우저에서 해당 행을 표시한다. 내장된 소스 스냅샷이므로 파일 변경 후 아래 명령으로 갱신한다. 전체 계획의 작성자 로컬 채팅은 링크 대신 출처 ID로 남겼다.\n\n```sh\npython -m scripts.build_agent_flow_html\npython -m scripts.build_agent_handoff\npython -c \"from scripts.package_agent_framework import build_pages; build_pages()\"\n```\n\n위 명령은 표준 라이브러리로 업무 흐름·코드 뷰어·담당자 가이드·시작 페이지를 재생성하며 ZIP을 만들지 않는다. `scripts.package_agent_framework`의 전체 실행은 기존 ZIP 제작 기능이므로 현재 Git 공유 절차에 사용하지 않는다. `.env`, 가상환경, 모델 가중치, 업로드·운영 DB 자료는 문서 공유 대상에 포함하지 않는다.\n\nGraphify 관계 지도는 현재 코드의 AST 스냅샷이다. 코드 구조가 바뀌면 별도 환경의 `scripts/build_agent_code_graph.py`로 갱신한다. 원본 문서는 `docs/agent-framework`, 전체 계획은 `docs/planning`에서 관리한다.\n\n## 역할별 팀 설정으로 개발하기\n\n개발 정본은 저장소 루트의 `backend/agent_framework`, `examples/agent_framework`, `tests/agent_framework`, `docs/agent-framework`다. Git에 있는 `share/에이전트_흐름도`와 ZIP은 이전 공유 시점의 사본이다. 사본의 코드를 따로 수정하지 않고 루트 정본을 수정·검증하여 Git으로 공유한다.\n\n각 담당자가 어댑터 하나만 반환하는 factory를 제공하면 공통 설정이 네 역할을 조합한다. A01·A08 실행 조정과 승인 상태는 공통 실행기가 계속 소유한다. 실제 모델·검색·DB·front-v2 제품 연결은 이 설정 기능만으로 구현되지 않는다.\n\n| 설정 파일 | 용도 | 기본 역할 구성 |\n|---|---|---|\n| `examples/agent_framework/team_config.template.json` | 팀이 복사해 연결 위치를 채울 시작점 | A02·A04_A05·A07은 `unconfigured`, A06은 `reference` |\n| `examples/agent_framework/team_config.synthetic.json` | 외부 연결 없이 명시적으로 선택하는 합성 구성 | A02·A04_A05·A07은 `synthetic`, A06은 `reference` |\n\n설정의 `roles`는 `A02`, `A04_A05`, `A06`, `A07`을 빠짐없이 선언한다. `kind`는 `unconfigured`, `synthetic`, `reference`, `factory` 중 하나다. `reference`는 A06에만 허용한다. `factory` 항목은 `kind: factory`일 때만, `scenario` 항목은 `kind: synthetic`일 때만 사용한다. 합성 시나리오는 `pass`, `fail`, `review`, `stale`, `unavailable`이고 생략 시 `pass`다. 설정의 개발 프로필은 `development` 또는 `test`이며 운영 프로필은 없다.\n\n팀 설정의 `roles.A04_A05`만 교체하는 예시는 다음과 같다. 나머지 세 역할의 선언도 설정 파일에 유지해야 한다.\n\n```json\n{\n  \"kind\": \"factory\",\n  \"factory\": \"examples.agent_framework.team_adapters:create_inspector\"\n}\n```\n\n`examples/agent_framework/team_adapters.py`에 `create_extractor`, `create_inspector`, `create_reporter`를 각각 분리했다. 이들은 인자 없는 동기 함수이며 **해당 역할 어댑터 인스턴스 하나**를 반환한다. 선택적으로 `create_validator`를 사용하면 참조 `ReferenceValidator`를 반환한다. 현재 모델·검색 클래스는 미구현 stub이므로 메서드 호출 시 `ADAPTER_NOT_CONFIGURED`로 실패한다. 정상 생성이나 설정 검사 통과가 실제 연결 성공을 뜻하지 않으며 합성 결과로 대체하지 않는다.\n\n기존 `--factory examples.agent_framework.custom_adapter:make_agents`도 유지한다. 이는 `ports.Agents` 전체를 반환하는 기존 경로이고, 설정 파일의 역할별 factory와 반환 규격이 다르다. 요청 JSON에는 factory를 넣지 않는다. 설정은 개발자가 지정한 로컬 파일이며 업무 요청으로 교체하지 않는다.\n\n### 설정 검사, 역할 실행, 개발 서버\n\n저장소 루트에서 실행한다. 아래는 macOS 명령이고 Windows PowerShell에서는 실행 파일만 `.\\.venv\\Scripts\\python.exe`로 바꾸며 나머지 인자는 동일하다.\n\n```sh\n.venv/bin/python -m backend.agent_framework doctor --config examples/agent_framework/team_config.synthetic.json\n.venv/bin/python -m backend.agent_framework serve --config examples/agent_framework/team_config.synthetic.json --port 8012\n```\n\nWindows PowerShell의 같은 역할 실행 예:\n\n```powershell\n```\n\n- `doctor`는 JSON 구문·계약·역할 구성을 검사하고 선언 내용을 출력한다. 설정된 모듈을 import하거나 factory·역할 메서드를 호출하지 않는다. 파일명에 적은 모듈의 존재, 실제 메서드, 모델·DB 연결은 검증하지 않는다.\n- `role --config`는 선택한 역할만 생성하고 호출한다. 다른 역할의 factory는 import·실행하지 않으므로 팀원은 자기 역할만 독립 개발할 수 있다. 공통 호출 경계에서 CLI와 실행기에 같은 요청·응답 검증을 적용한다. 요청 안의 조건·근거·관측 등 중첩 데이터가 합성이면 전체 결과에도 합성 표시가 전파된다.\n- `serve --config`는 같은 설정 파일로 네 역할을 조합해 개발 API를 연다. 서버 시작만으로 검수 실행·승인을 만들지 않는다. `127.0.0.1`, 단일 worker, 인증 없음, 메모리 저장 범위이며 종료하면 실행 기록이 사라진다. 구성 조회는 `GET /api/framework/v1/configuration`에서 선언과 초기화 상태를 구분해 확인한다. `connection_verified: false`는 실제 외부 연결을 검증하지 않았다는 뜻이다.\n\n팀 연결을 시작할 때는 `team_config.template.json`을 복사하고 담당 역할만 `factory`로 바꾼다. 합성 구성은 개발 테스트를 위해 명시적으로 선택하며 미구현 역할의 자동 대체용이 아니다. 실제 연결에 필요한 비밀정보는 팀의 별도 설정 방식으로 관리하고 공유 JSON에 넣지 않는다.\n\n### factory와 어댑터 구현 경계\n\nfactory 모듈 import와 생성자는 연결 정보만 준비하고 네트워크·DB 접속·모델 로드를 하지 않도록 작성한다. 클라이언트가 필요하면 역할 메서드에서 처음 사용할 때 생성한다. `doctor`는 개발 코드를 실행하지 않지만 `role`과 `serve`는 신뢰된 로컬 factory 코드를 실행한다. 사용자 작성 factory의 부작용까지 공통 프레임워크가 차단하는 것은 아니다.\n\n서버의 어댑터 인스턴스는 여러 실행이 공유할 수 있다. 지연 생성 클라이언트와 변경 가능한 상태의 동시 접근, 모델 호출 제한, timeout, 오류 분류는 역할 담당자가 관리한다. 실제 호출 결과가 불명확하면 `AdapterFailure(..., outcome_unknown=True)`로 보고하며 합성 성공이나 자동 재호출로 바꾸지 않는다.\n\n검사 대상 버전·인용·기계 판정·사람 승인은 기존 계약을 그대로 유지한다. 중첩 합성 표시가 없는 출력, 메서드 존재, 설정 초기화 성공만으로 실제 추론·검색·영속 저장·제품 통합 완료를 주장하지 않는다.\n\n## 역할별 계약 검사 묶음 실행\n\n`check`는 팀원이 연결한 역할 하나에 여러 요청 예제를 순서대로 넣고, 공통 계약 검증과 기대 결과를 비교한다. `doctor`는 설정만 검사하고, `role`은 단건 출력을 반환하며, `check`는 **검사 묶음의 요약 보고서**를 반환한다. 설정 파일의 다른 역할은 초기화하지 않는다.\n\nmacOS에서 A06의 통과·불합격·확인 필요·오래된 검색·검색 불가 예제 다섯 개를 검사한다.\n\n```sh\n.venv/bin/python -m backend.agent_framework check A06 --config examples/agent_framework/team_config.synthetic.json --cases examples/agent_framework/checks/A06.suite.json\n```\n\nWindows PowerShell:\n\n```powershell\n.\\.venv\\Scripts\\python.exe -m backend.agent_framework check A06 --config examples/agent_framework/team_config.synthetic.json --cases examples/agent_framework/checks/A06.suite.json\n```\n\n자기 역할을 연결할 때는 `team_config.template.json`을 복사해 해당 역할의 factory를 지정하고, `checks/A04_A05.suite.json` 같은 예제 묶음을 복사해 실제 개발 입력으로 바꾼다. **기본 fixture의 PDF·포스터는 합성 참조이므로 실제 미디어 파일을 읽는 어댑터의 실행 입력으로 사용할 수 없다.** 파일·모델·DB 접근은 연결한 어댑터가 수행하며, 프레임워크는 대신 접속하거나 성공 결과로 대체하지 않는다.\n\n묶음 파일 형식:\n\n```json\n{\n  \"contract_version\": \"2.0.0\",\n  \"role\": \"A06\",\n  \"cases\": [\n    {\"id\": \"normal\", \"input\": \"inputs/normal.json\", \"expected_verdict\": \"pass\"},\n    {\"id\": \"violation\", \"input\": \"inputs/violation.json\", \"expected_verdict\": \"fail\"},\n    {\"id\": \"wrong-scope\", \"input\": \"inputs/wrong-scope.json\", \"expected_error\": \"CONTEXT_MISMATCH\"}\n  ]\n}\n```\n\n- 입력 경로는 실행 위치가 아닌 **묶음 JSON 파일이 있는 폴더 기준**이다. `/` 구분자를 사용하며 절대 경로·Windows 드라이브 경로는 넣지 않는다. UTF-8 BOM도 읽는다.\n- 케이스 ID는 중복 없이 1–100개다. 전체 입력 파일의 JSON·요청 스키마를 먼저 확인한 뒤 선택한 factory를 한 번 생성한다. 잘못된 JSON·누락 파일은 `expected_error`로 성공 처리할 수 없다.\n- 기대값을 생략하면 공통 계약을 통과한 출력을 기대한다. A06·A07에만 `expected_verdict`를 지정할 수 있다. 정상적인 `fail`·`review` 출력은 어댑터 오류가 아니다.\n- `expected_error`는 구조화된 `AdapterFailure` 또는 공통 호출 경계의 정확한 오류 코드와 비교한다. 임의 예외의 상세 메시지는 보고서에 내보내지 않으며 정상적인 기대 오류로도 처리하지 않는다.\n- 각 케이스는 한 번만 호출한다. `retryable=true`여도 재호출하지 않는다. `outcome_unknown=true`이면 해당 케이스는 실패하고 남은 케이스는 `skipped`로 남긴다.\n- 보고서에는 사례별 통과/실패/건너뜀, 입력 파일 해시, 계약을 통과한 출력의 해시·합성 표시·판정 또는 검색 상태를 남긴다. 원문·프롬프트·모델 출력 전체는 포함하지 않는다.\n- 최상위 `passed`는 선언한 기대와의 일치 여부다. `summary.contract_outputs_checked`는 실제로 계약 검증을 통과한 출력 수이며, 예상한 오류만 확인한 경우에는 0일 수 있다. 실제 모델 정확도·근거 진위·DB 연결·승인 검증을 뜻하지 않는다.\n- 종료 코드는 모두 기대 일치 `0`, 불일치/역할 실패/결과 불명 `1`, 입력·설정 오류 `2`다. `--output \u003c파일\u003e`은 실패 결과도 보고서로 저장한다. 입력 확인·초기화 실패 때는 기존 보고서를 유지하며, 설정·묶음·입력 파일 자체를 출력으로 덮어쓸 수 없다.\n\n기본 제공 묶음은 A02 2개, A04/A05 2개, A06 5개, A07 6개로 총 15개 사례다. 범위가 잘못된 입력 거부도 포함한다. 묶음과 스키마는 `python -m scripts.export_agent_framework`로 재생성하며, 검사 스키마만 확인하려면 `python -m backend.agent_framework schema --include-checks`를 사용한다.\n\nA07 단독 호출도 근거의 프로젝트·현재 문서·예외 산출물 범위, 인용 해시, 중복 ID, 검색 revision 모순을 보고서 어댑터 호출 전에 검사한다. `ReportRequest`에는 전체 조건 원문·필수 여부·현재 관측이 없으므로 A06의 전체 판단을 다시 검증하지 않는다. 실제 원문 진위·권한·예외 승인 유효성은 각 실서비스 구현의 책임이다.\n\n## 기존 저장소의 PDF·포스터 읽기\n\n`ports.FileAccess`는 `read_document(context, DocumentRef)`와 `read_asset(context, AssetRef)`를 제공한다. 구현인 `VerifiedFileAccess`에는 **권한·버전 메타데이터 조회 카탈로그**와 **기존 저장소 바이트 리더**를 주입한다. 새로운 업로드 디렉터리, 운영 테이블 또는 마이그레이션을 만들지 않는다. 생성자는 I/O를 수행하지 않는다.\n\n| 기존 경로 | 재사용하는 정보·코드 | 지원 범위 |\n|---|---|---|\n| `backend/creative_checker` | `cc_documents`, `cc_asset_versions`, `cc_files`, `object_access/project_access`, 기존 `LocalStorage/S3Storage.read` | PDF와 PNG/JPEG/WebP 포스터 |\n| `backend/app` M008 | `asset_versions`, `stored_files`, `Authorization.resource`, 기존 `LocalStorage.verified` | 포스터 원본 또는 표시 이미지 |\n\nM008의 PDF 추출 API는 PDF 바이트를 추출기에 전달하지만 문서 버전·파일로 보존하는 경로가 아니다. 따라서 `LegacyPosterCatalog.lookup_document`는 `FILE_SOURCE_UNSUPPORTED`로 거부한다. 별도 `creative_checker` 경로의 PDF 기록을 M008 기록으로 가장하거나 두 DB의 ID를 임의로 연결하지 않는다.\n\n11/03 추가한 AF002 등록 PDF는 `documents.RegisteredProjectCatalog`와 `LegacyStorageReader(pdf_storage)`로 읽는다. 같은 M008 프로젝트·세션에 연결한 별도 문서 버전 기록이며 기존 포스터 catalog를 변경하지 않는다. [PDF 등록·버전 저장 가이드](PDF_등록_버전저장_가이드.html)를 따른다.\n\n재구축 경로 연결 예:\n\n```python\nfrom backend.agent_framework.files import VerifiedFileAccess\nfrom backend.agent_framework.adapters.project_files import (\n    CreativeCheckerCatalog, CreativeCheckerStorageReader,\n)\nfrom backend.agent_framework.adapters.file_backed import FileBackedExtractor, FileBackedInspector\n\n# 기존 앱이 소유한 sessions, storage, 인증이 확인된 identity를 주입한다.\nfiles = VerifiedFileAccess(\n    CreativeCheckerCatalog(sessions, actor_id=authenticated_user.id),\n    CreativeCheckerStorageReader(storage),\n)\nextractor = FileBackedExtractor(files, extract_with_qwen)\ninspector = FileBackedInspector(files, inspect_with_qwen)\n```\n\n`extract_with_qwen(request, verified_document)`와 `inspect_with_qwen(request, verified_poster)`는 담당자가 구현할 동기 콜백이다. 검증된 `.content` 바이트를 사용하고 기존 `CriteriaDraft`·`InspectionResult`를 반환한다. 파일 읽기·검증이 실패하면 콜백은 호출되지 않는다. 기존 `invoke_role`, CLI `role/check`, Workflow의 응답·출처 검증은 그대로 적용된다. 파일을 읽었다는 이유로 `synthetic` 표시를 지우지 않는다.\n\nM008에서 기존 인증 주체·권한 서비스·engine·storage를 이미 갖고 있다면 다음을 주입한다.\n\n```python\nfrom backend.agent_framework.adapters.project_files import LegacyPosterCatalog, LegacyStorageReader\n\nfiles = VerifiedFileAccess(\n    LegacyPosterCatalog(engine, authorization, subject, developer_allowed=False),\n    LegacyStorageReader(storage),\n)\n```\n\n`Context.actor_id`는 요청 필드이며 로그인 증거가 아니다. 카탈로그는 외부에서 인증한 주체를 바인딩하고 요청 주체 일치와 현재 계정·프로젝트 접근을 확인한다. 재구축 연결부의 `actor_id` 주입은 세션 인증을 새로 수행하지 않으므로 **인증된 API/worker 호출 경계에서 생성**해야 한다. 서로 다른 사용자에게 하나의 고정 사용자 카탈로그를 공유하지 않는다. 프레임워크의 인증 없는 개발 API에 운영 파일 접근을 자동으로 마운트하지 않는다.\n\n버전·파일 매핑:\n\n- PDF의 `document_version_id`는 `cc_documents.id`다. 정수 `version`이나 `file_id`와 다르며 해당 행의 `file_id`와 요청 파일이 일치해야 한다. `page_count`는 실제 PDF로 검사한다.\n- 재구축 포스터의 `asset_version_id`는 `cc_asset_versions.id`다. 치수는 기존 `media_metadata`와 동일하게 EXIF 방향 적용 후 값을 사용한다.\n- M008의 `asset_version_id`는 `asset_versions.asset_version_id`다. 원본 `file_id`는 원본 해시·MIME·원본 치수를, 표시 `file_id`는 표시 PNG 해시·치수를 사용한다. 두 표현을 섞지 않는다.\n- `VerifiedPoster.coordinate_space`는 `encoded`(저장 바이트의 픽셀 방향) 또는 `display`(EXIF 적용 방향)다. `encoded_width/encoded_height`, `exif_orientation`도 제공한다. `.content`는 변환하지 않은 원본 바이트이며 출력 좌표가 display라면 소비 모델도 같은 EXIF 방향을 적용해야 한다.\n\n검증 순서는 요청 계약·문맥 → 현재 접근 권한 → 프로젝트·파일·버전 연결 → 저장된 MIME·크기·해시·치수 → 실제 바이트 크기와 SHA-256 → PDF/이미지 해독 및 페이지·치수 비교다. 인용문 해시가 아닌 **파일 전체 바이트의 SHA-256**을 비교한다. 실패 시 `AdapterFailure`로 종료하며 경로·원문·공급자 예외 메시지를 노출하지 않는다.\n\n기본 한도는 PDF 20MiB·50페이지, 포스터 40MiB·1,000만 픽셀·한 변 8,192px이다. 포스터 40MiB는 기존 M008의 정규화 표시 PNG 한도를 수용하며 기존 업로드 제한을 완화하는 설정이 아니다. 암호화 PDF, 다중 프레임 이미지, 형식 위조, 해시·크기·페이지·치수 불일치는 거부한다. `FileLimits`로 호출자에게 더 작은 한도를 적용할 수 있다.\n\n### 실제 파일 바이트로 확인하는 독립 예제\n\nmacOS:\n\n```sh\n.venv/bin/python -m examples.agent_framework.file_access_demo\n```\n\nWindows PowerShell:\n\n```powershell\n.\\.venv\\Scripts\\python.exe -m examples.agent_framework.file_access_demo\n```\n\n이 예제는 생성한 실제 PDF·PNG를 **기존 `services.store_file`과 `LocalStorage`**에 저장하고, 격리된 메모리 SQLite의 기존 모델로 연결한 뒤 파일 접근 포트로 읽는다. 정상 해시·페이지·치수를 확인하고 잘못된 해시 참조를 거부한다. 임시 저장소는 실행 후 정리된다. 사용자 파일·운영 DB·`.env`를 읽거나 변경하지 않고, Qwen·Neo4j를 호출하지 않는다. 생성 파일과 테스트 사용자이므로 결과를 실모델 평가·제품 인증 검증으로 해석하지 않는다.\n\nM008의 기존 로컬 저장소는 POSIX 디렉터리 기능을 사용하므로 해당 저장소 실행은 macOS/Linux 대상이다. Windows용 새 저장소를 만들지 않았으며, Windows에서는 재구축의 기존 LocalStorage 기반 예제를 사용한다. 실제 Windows 실행은 별도 검증 대상이다.\n\n\n## PostgreSQL·Neo4j 원문 근거 RAG — AF005 opt-in\n\n[Neo4j 근거 검색·RAG 연결 가이드](Neo4j_근거검색_RAG_연결가이드.md)를 따른다. `context_preparation`을 명시한 registered_poster 프로필은 A04·A05 직전에 PG→Neo4j→PG 검증으로 원문·보완 출처를 고정하고 A07에도 같은 근거를 전달한다. 역할 계약 3.0.0과 기존 기본 동작은 유지한다. 독립 A03이나 벡터DB는 추가하지 않는다.\n\nAF005는 graph_state·graph_outbox·불변 evidence_contexts를 추가하며 owner 마이그레이션을 명시적으로 선택한다. 새 개발용 Neo4j만 별도 볼륨·57431/57631 포트에 실행한다. graph-init·graph-projector·graph-rebuild 명령은 DB 초기화·운영 모델 호출·사람 승인을 자동 수행하지 않는다. 기존 재구축 cc_* 그래프와 사용자 데이터는 보존한다.\n\n실제 격리 DB 검사와 기존 로컬 DB 적용 범위는 [11/04 Neo4j RAG 구현·검증 기록](Neo4j_RAG_구현검증_20261104.md)을 참고한다. 미승인 전시 PDF는 그대로 유지하며 실제 모델 전체 검수와 합성 연결 시험을 구분한다.\n\n시험 실행은 [Neo4j 개발용·시험용 분리 가이드](Neo4j_개발시험_분리_가이드.md)를 따른다. Mac은 `python3 scripts/framework_graph_test.py`, Windows PowerShell은 `py -3.12 scripts/framework_graph_test.py`로 같은 Linux 시험 컨테이너를 실행한다. 기존 개발 DB·볼륨은 재사용하지 않는다.\n\n개발 Neo4j·동기화 worker의 한 명령 실행·프로세스 재시작·실제 접속 확인은 [자동 실행·재시작 가이드](Neo4j_자동실행_재시작_가이드.md)를 따른다. 기본 설정에서 `python3 scripts/framework_graph_runtime.py up`으로 시작하고 `status`로 확인한다. Windows는 `py -3.12`를 사용한다.\n\n지연·반복 실패·실제 그래프 반영 상태의 지속 감시는 [동기화 감시 가이드](Neo4j_동기화_감시_가이드.md)를 따른다. `framework_graph_runtime.py status`에서 synchronization 요약, `monitor`에서 최신 상세 관측을 확인한다. 감시는 읽기 전용이며 자동 복구·승인·외부 통지는 하지 않는다.\n\n**[Neo4j 프로젝트 자동 복구](Neo4j_프로젝트_자동복구_가이드.md)** — 유실·불일치를 두 번 확인한 뒤 원장을 검증하고 프로젝트별 outbox로 재구축한다. 외부 관계·원장 불일치·앞선 그래프는 자동 덮어쓰기를 차단한다. 기존 monitor는 읽기 전용을 유지한다.\n\n**[Qwen 도구 호출 옵션 적용](Qwen_도구호출_설정_20261105.md)** — A01·A08의 HTTP 400 원인인 서버 옵션을 적용했다. 원격 보존·수동 재실행 방법과 당시 실모델 결과를 기록했다. 후속 [A08 출력 계약 수정](A08_출력계약_수정검증_20261105.md)으로 실모델 네 사례가 모두 통과했다.\n","sha256":"a96cfec680cdbdf2212ec2d7bcb32fc5731404ed3aac166401dc020a7f11cdea"},"docs/agent-framework/a03-retirement-2026-11-02.md":{"text":"# 독립 A03 제거와 최신 문서 정리\n\n2026-11-02 · feat/agent-framework · 현재 작업 트리 · 커밋·push 없음\n\n## 기준과 변경\n\n[프로젝트 통합문서 20261102 정리본](reference/프로젝트_통합문서_20261102.html#section-014)을 정본으로 사용했다. 원본 사본의 SHA-256은 `55cd42fa4f80a2657496c87c1719fe205858d32320495b2b9d6008c2eb5905ce`다.\n\n- 독립 A03 역할·설정 키·포트·factory·단독 CLI·LangGraph/worker 단계·스키마·fixture를 제거했다. 거부 검증용 테스트와 폐기/과거 이력 안내에는 명칭을 남겼다.\n- 현재 네 구성 역할은 A02·A04_A05·A06·A07이다. A01·A08은 공통 실행 코드다.\n- 기준 승인 시 조건의 원문·인용·해시·버전을 EvidenceBundle로 고정한다. 별도 역할 실행 기록·모델·외부 조회를 만들지 않는다. PostgreSQL 경로에서는 승인·고정 스냅샷·검수 접수를 같이 저장한다.\n- 최신 통합문서의 PG→Neo4j→PG 근거 조회는 후속 공통 문맥 준비 기능으로 명시했다. 별도 GraphDB 에이전트 배치는 미확정이다. 현재 함수의 complete는 승인 출처 묶음의 범위이며 관계 조회 완료가 아니다.\n- 변경 없는 pass의 직접 최종 승인, 수정 시에만 수정 요청 승인, 새 실행에서 기준 재승인·전체 검사를 문서·흐름도에 반영했다.\n- 담당자 가이드·PostgreSQL 실행가이드·전체 계획·개발 README·HTML·예제 안내·CI와 두 흐름도를 맞췄다. 기존 공유용 흐름도의 작은 노드·확대/이동·오른쪽 inspector UI를 유지했다.\n- 기존 검증 보고서는 과거 이력으로 표시했고 당시 시험 결과를 현재 결과로 덮어쓰지 않았다. ZIP은 만들지 않았다.\n\n## 계약 전환\n\nJSON 계약은 2.0.0이다. A03 binding·RetrieveRequest·retriever가 없어졌고 EvidenceBundle의 retrieval_id는 context_id, 검증 이슈 retrieval_incomplete는 context_incomplete로 바뀌었다. HTTP 경로 /api/framework/v1은 별도 버전이다. 구버전 JSON/설정은 새 template과 fixture로 교체하며 기존 저장 실행을 새 코드로 자동 변환·재개하지 않는다.\n\n운영 미적용 개발 AF001의 역할 CHECK에서 A03을 제거했다. 이전 해시의 AF001을 이미 적용한 별도 환경은 readiness가 거부한다. 그 환경은 저장 실행을 확인한 후 명시적인 후속 마이그레이션이 필요하다. 운영 DB에는 이번 DDL을 적용하지 않았다.\n\n## 실행 검증\n\n잠금 의존성으로 만든 임시 Python 환경에서 다음을 실행했다.\n\n```sh\npython -m pytest tests/agent_framework -q\npython -m pytest tests/agent_framework/test_postgres_integration.py -m db_integration -q\npython -m backend.agent_framework demo\npython -m backend.agent_framework check-flow --config examples/agent_framework/team_config.synthetic.json --case examples/agent_framework/workflow.synthetic.json\npython -m examples.agent_framework.file_flow_demo\n```\n\n일반 회귀 **414 passed, 8 subtests passed, 16 DB 시험 deselected**. SWIG 라이브러리의 기존 DeprecationWarning 5개가 발생했다. DB 시험은 별도 로컬 PostgreSQL 17.11 컨테이너에서 **16 passed**였다. 기존 M008·인증 fixture가 매번 무작위 creative_checker_test_* DB를 생성·제거했다. 업무 DB·사용자 자료·.env를 사용하거나 변경하지 않았다.\n\nA03 설정 거부, 네 역할 port, 승인 시 근거 고정·문맥 해시, 위조 인용·다른 문서 거부를 직접 검사했다. demo는 부모 A02/A04_A05/A06/A07 완료와 자식 A02 reused + 세 검수 역할 완료를 확인했다. check-flow passed=true. 실제 파일 예제도 임시 PDF·PNG의 검증과 새 버전 재검수를 통과했다. 이 실행들의 승인자는 스크립트 테스트 값이다.\n\nGraphify 지도는 현재 Python 25파일에서 다시 추출했다. 독립 검색 코드 삭제에 따른 노드 감소를 확인한 후 재생성했다. 정적 검사에서 HTML 22개·상대 링크 466개·JavaScript 문법 21건·내장 JSON 7건을 확인했고 오류는 없었다. 두 흐름도에서 A03 노드·역할 필터가 없는지 확인했다. 브라우저 실렌더링과 실제 Windows 장치 실행은 미검증이다.\n\n## 후속 작업\n\n실제 PDF/Qwen·통합 검사·보고 어댑터, 공통 PostgreSQL→Neo4j→PostgreSQL 관계 문맥 준비, front-v2 업무 연결, 운영 DB 적용·배포·백업 복원은 후속 작업이다. 현재 테스트 결과가 이 기능들의 실제 연결·성능·운영 배포를 증명하지 않는다.\n","sha256":"fa1de5fdb1d3718f31fe4a6925d16ee7d3b5242d58f3c7bdc0c8d2c35a2ef0cf"},"docs/agent-framework/graphify-out/GRAPH_REPORT.md":{"text":"# Creative Checker — Graphify AST audit\n\n\u003e **Static code relationships only.** This graph does not demonstrate real Qwen execution,\n\u003e PostgreSQL/Neo4j connectivity, durable workers, or production deployment.\n\u003e The separate clickable business flow is a curated workflow illustration, not this AST graph.\n\n- Tool: official `graphifyy==0.9.100`; directed build, community detection and native HTML exporter.\n- Corpus: **25 Python files**, 13,389 words, exclusively `backend/agent_framework/**/*.py`.\n- Git baseline: `12b2d369da7fbeef49a88aeddcc84ec5703fbf28`. The files are current working-tree sources; their SHA-256 values are recorded in `source-manifest.json`.\n- Raw AST: **404 nodes / 1619 edges**.\n- Native directed graph: **439 nodes / 1527 edges / 11 communities**.\n- **Integrity limits:** raw dangling endpoints 134, missing endpoints 0, self-loops 2, same-endpoint directed edges collapsed 91.\n- Build added **35 implicit/external placeholder nodes**. These have no extracted in-scope definition; they are not deployment components.\n- The native view has collapsed parallel relations. **`extraction.json` retains every raw relationship and source location**; `diagnostics.json` and `diagnosti
