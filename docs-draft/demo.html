<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>동작그만 밑장빼기냐 · 시연 데모 (가상 데이터)</title>
<style>
:root{--paper:#f4f3ee;--card:#fffefb;--ink:#203d34;--muted:#69746b;--line:#dbded3;--accent:#315b48;--soft:#e9eee3;--warm:#f4e9df;--red:#a8321f;--redbg:#fbe9e5;--amber:#8a5a00;--amberbg:#fdf3dc;--green:#1f6b45;--greenbg:#e4f2e9;--gray:#5b645d;--graybg:#eceee9;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.7}
button,select,textarea,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 14px;color:var(--ink)}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #bf7543;outline-offset:2px}
header{max-width:1440px;margin:auto;padding:20px 28px 8px}h1{margin:0;font-size:24px;letter-spacing:-.04em}
.sub{color:var(--muted);font-size:12px}.banner{margin:12px 0;padding:10px 14px;border:1px solid #e9d8ca;background:var(--warm);border-radius:10px;font-size:13px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.roles button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}.steps button{border-radius:50px;font-size:13px}.steps button[aria-current=step]{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps small{opacity:.65;margin-left:4px}
.wrap{max-width:1440px;margin:auto;padding:0 28px 40px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
.panel h2{margin:0 0 4px;font-size:20px;letter-spacing:-.03em}.panel h3{margin:18px 0 8px;font-size:15px}
.hint{border-left:4px solid #74906c;background:#f0f4eb;border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13px}
.toast{padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;border:1px solid}
.toast.ok{background:var(--greenbg);border-color:#b6dcc3;color:var(--green)}.toast.err{background:var(--redbg);border-color:#efc2b9;color:var(--red)}
.toast.stale{background:var(--amberbg);border-color:#ecd69a;color:var(--amber)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#edf0e8;font-size:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid transparent}
.t-ok{background:var(--greenbg);color:var(--green);border-color:#b6dcc3}.t-bad{background:var(--redbg);color:var(--red);border-color:#efc2b9}
.t-warn{background:var(--amberbg);color:var(--amber);border-color:#ecd69a}.t-na{background:var(--graybg);color:var(--gray);border-color:#d5d8d2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.gimg{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}@media(max-width:800px){.gimg{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fafbf7}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}.muted{color:var(--muted);font-size:12px}
blockquote{margin:6px 0;padding:6px 12px;border-left:3px solid #c9d3bd;background:#f6f8f1}
mark{background:#ffe9a8}.img{border:1px solid var(--line);border-radius:12px;background:#fff;max-width:300px}.img svg{display:block;width:100%;height:auto}
.log{max-height:78vh;overflow:auto;position:sticky;top:12px}.log li{padding:7px 0;border-bottom:1px solid var(--line);font-size:12px;list-style:none}.log ul{padding:0;margin:0}
.code{font-weight:700}.c-ok{color:var(--green)}.c-bad{color:var(--red)}.c-stale{color:var(--amber)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px}
ul.bl{padding-left:18px;margin:6px 0}
</style></head><body>
<header>
  <h1>시연 데모 · 딸기라떼 1건</h1>
  <div class="sub">동작그만 밑장빼기냐 · 접수 → 기준 확정 → 검수 → 보완 → 재검수 → 승인·출고 (SC-01~SC-06)</div>
  <div class="banner"><strong>가상 데이터 · 모의 검수.</strong> 실제 OCR·LLM·MCP는 연결되어 있지 않습니다. 판정은 시연용 규칙으로 계산되고, 화면 뒤의 “서버” 검증(권한·해시·STALE_VERSION·차단 조건)은 이 파일 안의 모의 코드로 동작합니다. 파일 해시(SHA-256)는 실제로 계산합니다.</div>
  <div class="bar">
    <span class="muted">현재 사용자</span>
    <span class="roles" id="roles"></span>
    <span style="flex:1"></span>
    <label><input type="checkbox" id="race" checked> 경합 시나리오 포함(새 버전 접수)</label>
    <button class="primary" id="btnPlay">▶ 자동 시연</button>
    <button id="btnReset">↺ 처음부터</button>
  </div>
  <div class="steps" id="steps"></div>
</header>
<div class="wrap">
  <main id="main"></main>
  <aside class="panel log"><h2>서버 이력</h2><div class="muted">모든 동작의 결과와 대상 해시를 기록합니다. 실패도 남깁니다.</div><ul id="log"></ul></aside>
</div>
<script>
'use strict';
/* ---------- util ---------- */
function sha256(msg){
  const rotr=(n,x)=>(x>>>n)|(x<<(32-n));const K=[],H=[];let p=2,c=0;
  while(c<64){let pr=true;for(let i=2;i*i<=p;i++)if(p%i===0){pr=false;break}
    if(pr){if(c<8)H[c]=(Math.pow(p,1/2)%1*4294967296)|0;K[c]=(Math.pow(p,1/3)%1*4294967296)|0;c++}p++}
  const b=Array.from(new TextEncoder().encode(msg));const l=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);
  const hi=Math.floor(l/4294967296),lo=l>>>0;for(let i=3;i>=0;i--)b.push((hi>>>(i*8))&255);for(let i=3;i>=0;i--)b.push((lo>>>(i*8))&255);
  for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(let i=16;i<64;i++){const s0=rotr(7,w[i-15])^rotr(18,w[i-15])^(w[i-15]>>>3),s1=rotr(17,w[i-2])^rotr(19,w[i-2])^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    let[a,bb,cc,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const S1=rotr(6,e)^rotr(11,e)^rotr(25,e),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0,S0=rotr(2,a)^rotr(13,a)^rotr(22,a),mj=(a&bb)^(a&cc)^(bb&cc),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=()=>new Date().toTimeString().slice(0,8);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- 가상 데이터 ---------- */
const ROLES={producer:'제작자 이하나',pm:'PM 김담당',customer:'지정 고객 박고객'};
const REQ=[['p.1','제품명은 “딸기라떼”, 브랜드 표기는 “MORNING CUP”으로 한다.'],
 ['p.2','할인 문구는 30% 할인으로 표기한다.'],
 ['p.3','딸기 토핑은 3개 이상 보이게 한다. 음료 외관은 분홍색 딸기라떼로 표현한다.'],
 ['p.4','게시 기간은 별도 협의한다. (기간 미기재)']];
const ITEMS=[
 {id:'name',label:'상품명',expected:'딸기라떼',src:'의뢰서 p.1',method:'OCR 문구 대조'},
 {id:'discount',label:'할인율',expected:'30% 할인',src:'의뢰서 p.2',method:'OCR 문구 대조'},
 {id:'brand',label:'브랜드 표기',expected:'MORNING CUP',src:'의뢰서 p.1',method:'OCR 문구 대조'},
 {id:'count',label:'딸기 개수',expected:'3개 이상',src:'의뢰서 p.3',method:'객체 개수 검사'},
 {id:'look',label:'음료 외관',expected:'분홍색 딸기라떼',src:'의뢰서 p.3',method:'VLM 시각 관찰'}];
const REQ_FILE='MORNING_CUP_딸기라떼_의뢰서_v2.pdf';
function adSVG(ver,hl){
  const d=ver===1?'20% 할인':'30% 할인';
  const extra=ver===3?'<text x="520" y="70" font-size="22" fill="#a8321f" text-anchor="middle" font-weight="700">NEW</text>':'';
  const box=hl?'<rect x="100" y="462" width="400" height="84" fill="none" stroke="#c0392b" stroke-width="4" stroke-dasharray="10 6"/>':'';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="Malgun Gothic,sans-serif"><rect width="600" height="600" fill="#f8e1e4"/>
<text x="300" y="110" font-size="56" text-anchor="middle" fill="#7a1f3d" font-weight="700">딸기라떼</text>
<path d="M200 170 H400 L370 400 Q300 430 230 400 Z" fill="#f2a1b6" stroke="#7a1f3d" stroke-width="5"/>
<circle cx="260" cy="190" r="26" fill="#d6203f"/><circle cx="305" cy="180" r="26" fill="#d6203f"/><circle cx="350" cy="192" r="26" fill="#d6203f"/>
<text x="300" y="530" font-size="64" text-anchor="middle" fill="#7a1f3d" font-weight="700">${d}</text>
<text x="300" y="575" font-size="26" text-anchor="middle" fill="#7a1f3d">MORNING CUP</text>${extra}${box}</svg>`;
}

/* ---------- 상태 ---------- */
let S,playing=false,DELAY=1100;
function fresh(){return{role:'pm',step:1,revision:1,req:null,imgs:[],crit:{extracted:false,q:null,baseline:null},runs:[],reviews:{},task:null,pkgs:[],clientPkg:null,release:null,audit:[],msg:null}}
S=fresh();

/* ---------- 모의 서버 ---------- */
const PERM={regReq:['pm','producer'],regImg:['producer'],extract:['pm'],answer:['pm'],confirmBaseline:['pm'],runQA:['pm'],review:['pm'],confirmTask:['pm'],submitFix:['producer'],resolveTask:['pm'],prepare:['pm'],approve:['customer'],reject:['customer'],release:['pm'],arrive:['producer']};
const NAMES={regReq:'의뢰서 등록',regImg:'납품 이미지 접수',extract:'기준 추출',answer:'필수 질문 답변',confirmBaseline:'기준 확정',runQA:'검수 실행',review:'담당 검토',confirmTask:'수정 요청 확정',submitFix:'수정본 제출',resolveTask:'해결 확인',prepare:'승인 요청 준비',approve:'내용 승인',reject:'반려',release:'출고 확정',arrive:'새 이미지 접수'};
const ROLE_TEXT={producer:'제작자',pm:'PM(검수 담당)',customer:'지정 고객'};
function log(action,code,detail,hash){S.audit.unshift({t:T(),actor:ROLES[S.role],action,code,detail,hash:hash?hash.slice(0,8):''})}
function fail(act,code,reasons){log(NAMES[act],code,reasons.join(' / '));return S.msg={type:code==='STALE_VERSION'?'stale':'err',code,text:reasons.join(' ')},{ok:false,code,reasons}}
function done(act,detail,hash,extra){log(NAMES[act],'OK',detail,hash);S.msg={type:'ok',code:'OK',text:detail};return Object.assign({ok:true,code:'OK'},extra||{})}
function guard(act){if(!PERM[act].includes(S.role))return fail(act,'FORBIDDEN',[`${ROLE_TEXT[S.role]}에게는 “${NAMES[act]}” 권한이 없습니다. (권한: ${PERM[act].map(r=>ROLE_TEXT[r]).join('·')})`])}
const latestImg=()=>S.imgs[S.imgs.length-1];
const lastRun=()=>S.runs[S.runs.length-1];
const reviewKey=(run,it)=>run.imgVer+':'+it.id;
function effJ(run,it){return(it.judgment==='확인 필요'&&it.execution==='완료'&&S.reviews[reviewKey(run,it)])?'충족':it.judgment}
function isStale(run){const i=latestImg();return !run||!i||run.imgVer!==i.ver||run.baseline!==(S.crit.baseline&&S.crit.baseline.ver)}
function snapshot(){const i=latestImg(),r=lastRun();return{order:'ORD-DEMO-001',revision:S.revision,baseline:S.crit.baseline&&S.crit.baseline.ver,img:i&&{ver:i.ver,sha:i.sha},qa:r&&{id:r.id,img:r.imgVer,items:r.items.map(it=>[it.id,effJ(r,it),it.execution])},task:S.task&&{id:S.task.id,status:S.task.status},notices:['N1:참고']}}
const snapHash=()=>sha256(JSON.stringify(snapshot()));
function blockers(){const b=[],i=latestImg(),r=lastRun();
  if(!i)b.push('필수 파일 누락: 납품 이미지');if(!S.req)b.push('필수 자료 누락: 의뢰서');if(!S.crit.baseline)b.push('활성 기준선 없음');
  if(!r){b.push('검수가 실행되지 않음');}
  else if(isStale(r)){b.push(`오래된 검수 결과: 현재 이미지 v${i.ver} 기준의 재검수가 필요함`);}
  else r.items.forEach(it=>{const j=effJ(r,it);
    if(it.execution!=='완료')b.push(`필수 검사 미실행: ${it.label}`);
    else if(j==='미충족')b.push(`필수 조건 미충족: ${it.label}`);
    else if(j==='확인 필요')b.push(`필수 조건 확인 필요 · 담당 검토 미완료: ${it.label}`)});
  if(S.task&&S.task.status!=='해결 확인')b.push(`미해결 보완 작업: ${S.task.id} (${S.task.status})`);
  return b}
function addImage(ver,by){const svg=adSVG(ver,false);S.imgs.push({ver,svg,sha:sha256(svg),at:T(),by});S.revision++;return latestImg()}
function detect(img){
  const full=img.ver>=2,obs=img.ver===1?'20% 할인':'30% 할인';
  const it=(base,o)=>Object.assign({},base,o);
  const [name,discount,brand,count,look]=ITEMS;
  return[
    it(name,{observed:'딸기라떼',judgment:'충족',execution:'완료',evidence:'OCR 영역 (140,60)–(460,120)'}),
    it(discount,{observed:obs,judgment:obs==='30% 할인'?'충족':'미충족',execution:'완료',evidence:'OCR 영역 (100,462)–(500,546) · 신뢰도 0.97(모의)'}),
    it(brand,{observed:'MORNING CUP',judgment:'충족',execution:'완료',evidence:'OCR 영역 (170,552)–(430,584)'}),
    full?it(count,{observed:'3개',judgment:'충족',execution:'완료',evidence:'객체 3건 · 신뢰도 0.91(모의)'}):it(count,{observed:'—',judgment:'확인 필요',execution:'미실행',evidence:'개수 검사기 미실행'}),
    full?it(look,{observed:'분홍색 음료로 보이나 토핑 일부가 가려져 불확실(모의 VLM)',judgment:'확인 필요',execution:'완료',evidence:'VLM 관찰 · 불확실'}):it(look,{observed:'—',judgment:'확인 필요',execution:'미실행',evidence:'시각 검사기 미실행'})];
}
function agentTrace(img){const full=img.ver>=2;return[
  ['A01 업무 총괄','실행','검수 계획 수립'],['A02 기준 분석','실행','확정 기준 5개 로드'],['A03 근거 검색','실행','원문 조항 연결'],
  ['A04 문구 검수','실행','OCR 모의 호출'],['A05 시각 검수',full?'실행':'미호출',full?'개수·외관 검사(모의)':'이번 run 범위 밖'],
  ['A06 결과 검증','실행','근거·판정 대조'],['A07 보고서','실행','보고서 초안 생성'],['A08 수정 관리',full?'실행':'미호출',full?'이전 지적 해결 여부 대조':'수정 작업 없음']]}

const A={
  regReq(){const g=guard('regReq');if(g)return g;if(S.req)return fail('regReq','DUPLICATE',['의뢰서 v2는 이미 등록되었습니다.']);
    const text=REQ.map(r=>r.join(' ')).join('\n');S.req={name:REQ_FILE,sha:sha256(text),at:T()};return done('regReq',`${REQ_FILE} 등록 · 해시 ${S.req.sha.slice(0,12)}…`,S.req.sha)},
  regImg(){const g=guard('regImg');if(g)return g;if(S.imgs.length)return fail('regImg','DUPLICATE',['이미 접수된 이미지가 있습니다. 새 버전은 수정본 제출로 접수합니다.']);
    const i=addImage(1,ROLES[S.role]);return done('regImg',`납품 이미지 v1 접수 · 해시 ${i.sha.slice(0,12)}… · 발주 revision ${S.revision}`,i.sha)},
  extract(){const g=guard('extract');if(g)return g;if(!S.req)return fail('extract','BLOCKED',['의뢰서가 등록되지 않았습니다. 샘플로 대체하지 않습니다.']);
    S.crit.extracted=true;S.crit.q={text:'게시 기간이 의뢰서에 없습니다. 기간을 확인해 주세요.',answer:null};return done('extract','기준 초안 5개 추출(모의 LLM) · 필수 질문 1건 발생',S.req.sha)},
  answer(val){const g=guard('answer');if(g)return g;if(!val)return fail('answer','VALIDATION',['답변을 선택해 주세요.']);S.crit.q.answer=val;return done('answer',`필수 질문 해소: ${val}`)},
  confirmBaseline(){const g=guard('confirmBaseline');if(g)return g;
    if(!S.crit.extracted)return fail('confirmBaseline','BLOCKED',['추출된 기준 초안이 없습니다.']);
    if(!S.crit.q.answer)return fail('confirmBaseline','BLOCKED',['필수 질문이 남아 있어 확정할 수 없습니다: 게시 기간 확인']);
    S.crit.baseline={ver:1,at:T(),by:ROLES[S.role]};S.revision++;return done('confirmBaseline',`기준 v1 확정 · 발주 revision ${S.revision}`,sha256(JSON.stringify(ITEMS)))},
  runQA(){const g=guard('runQA');if(g)return g;const i=latestImg();
    if(!S.crit.baseline||!i)return fail('runQA','BLOCKED',['확정 기준과 납품 이미지가 필요합니다.']);
    const key=i.sha+'|'+S.crit.baseline.ver;const dup=S.runs.find(r=>r.key===key);
    if(dup){log(NAMES.runQA,'DUPLICATE_REUSED',`같은 키·같은 입력 → 기존 ${dup.id} 사용`,dup.imgSha);S.msg={type:'ok',code:'DUPLICATE_REUSED',text:`같은 입력이라 새 실행을 만들지 않고 기존 ${dup.id}를 사용했습니다.`};return{ok:true,code:'DUPLICATE_REUSED',run:dup}}
    const run={id:'RUN-'+(S.runs.length+1),key,imgVer:i.ver,imgSha:i.sha,baseline:S.crit.baseline.ver,items:detect(i),agents:agentTrace(i),at:T()};S.runs.push(run);
    return done('runQA',`${run.id} 완료 · 이미지 v${i.ver} · 판정과 실행 상태를 분리 기록`,i.sha,{run})},
  review(itemId,note){const g=guard('review');if(g)return g;const r=lastRun();
    if(!r||isStale(r))return fail('review','BLOCKED',['현재 이미지 기준의 검수 결과가 없어 검토할 수 없습니다.']);
    const it=r.items.find(x=>x.id===itemId);if(!it||it.judgment!=='확인 필요'||it.execution!=='완료')return fail('review','INVALID_STATE',['검토 대상이 아닙니다. 미실행 항목은 검사를 실행한 뒤 검토합니다.']);
    if(!note||note.trim().length<5)return fail('review','VALIDATION',['검토 근거를 5자 이상 입력해 주세요.']);
    S.reviews[reviewKey(r,it)]={note:note.trim(),by:ROLES[S.role],at:T()};return done('review',`${it.label}: 확인 필요 → 충족(사람 확인) · “${note.trim()}”`)},
  confirmTask(){const g=guard('confirmTask');if(g)return g;const r=lastRun();const f=r&&r.items.find(x=>x.judgment==='미충족');
    if(!f)return fail('confirmTask','BLOCKED',['근거가 연결된 미충족 지적이 없습니다.']);if(S.task)return fail('confirmTask','DUPLICATE',['같은 지적의 작업이 이미 있습니다.']);
    S.task={id:'TASK-1',target:f.label,status:'확정',assignee:ROLES.producer,due:'2026-10-09',text:`${f.label}: 기준 “${f.expected}” / 관찰 “${f.observed}” → 문구를 기준대로 수정`,run:r.id};
    S.revision+=0;return done('confirmTask',`TASK-1 확정 · 담당 ${S.task.assignee} · 기한 ${S.task.due}`)},
  submitFix(){const g=guard('submitFix');if(g)return g;if(!S.task||S.task.status!=='확정')return fail('submitFix','INVALID_STATE',['제출할 확정된 수정 작업이 없습니다.']);
    const i=addImage(2,ROLES[S.role]);S.task.status='수정 제출';S.task.fixVer=2;return done('submitFix',`수정본 v2 제출 · 해시 ${i.sha.slice(0,12)}… · 제출만으로는 해결 처리되지 않음`,i.sha)},
  resolveTask(){const g=guard('resolveTask');if(g)return g;if(!S.task||S.task.status!=='수정 제출')return fail('resolveTask','INVALID_STATE',['수정 제출 상태의 작업이 없습니다.']);
    const r=lastRun(),d=r&&r.items.find(x=>x.id==='discount');
    if(!r||r.imgVer<S.task.fixVer||isStale(r)||!d||effJ(r,d)!=='충족')return fail('resolveTask','MISSING_EVIDENCE',['재검수 근거가 없어 해결 처리할 수 없습니다. 수정본에 대한 재검수에서 해당 항목이 충족으로 확인되어야 합니다.']);
    S.task.status='해결 확인';S.task.evidence=r.id;return done('resolveTask',`TASK-1 해결 확인 · 근거 ${r.id} · 최종 승인과는 별개`)},
  prepare(){const g=guard('prepare');if(g)return g;const b=blockers();if(b.length)return fail('prepare','BLOCKED',['승인 요청을 준비할 수 없습니다. 아래 차단 사유를 해결해 주세요.']);
    const h=snapHash(),i=latestImg();const pkg={id:'PKG-'+(S.pkgs.length+1),hash:h,imgVer:i.ver,imgSha:i.sha,revision:S.revision,status:'내용 승인 대기',at:T()};
    S.pkgs.push(pkg);S.clientPkg=Object.assign({},pkg);log(NAMES.prepare,'OK',`${pkg.id} 준비 → 내용 승인 대기 · 이미지 v${i.ver} · revision ${S.revision}`,h);S.msg={type:'ok',code:'OK',text:`${pkg.id}를 내용 승인 대기로 전달했습니다. 대상 해시 ${h.slice(0,12)}…`};return{ok:true,code:'OK',pkg}},
  approve(){return decide('approve')},
  reject(reason){return decide('reject',reason)},
  release(){return decide('release')},
  arrive(){const g=guard('arrive');if(g)return g;if(S.imgs.length!==2)return fail('arrive','INVALID_STATE',['시연 조건: 수정본 v2가 접수된 뒤에만 사용할 수 있습니다.']);
    const i=addImage(3,ROLES[S.role]);return done('arrive',`새 이미지 v3 접수(승인 화면은 아직 이전 대상) · 해시 ${i.sha.slice(0,12)}… · revision ${S.revision}`,i.sha)},
  refresh(){S.clientPkg=null;S.msg={type:'ok',code:'OK',text:'화면을 새로 불러왔습니다. 현재 대상 기준으로 다시 확인하세요.'};log('화면 새로고침','OK','최신 대상 다시 조회')}
};
function decide(act,reason){const g=guard(act);if(g)return g;const c=S.clientPkg;
  if(!c)return fail(act,'INVALID_STATE',['열려 있는 승인 패키지가 없습니다.']);
  const pkg=S.pkgs.find(p=>p.id===c.id);
  if(pkg.status==='오래됨')return fail(act,'STALE_VERSION',['이 승인 대상은 이미 오래됨 상태입니다. 새 대상을 확인해야 합니다.']);
  const need=act==='release'?'내용 승인':'내용 승인 대기';
  if(pkg.status!==need)return fail(act,'INVALID_STATE',[`‘${need}’ 상태에서만 가능합니다. (현재 ‘${pkg.status}’)`]);
  if(act==='reject'&&!(reason&&reason.trim()))return fail(act,'REASON_REQUIRED',['반려 사유를 입력해 주세요.']);
  const cur=snapHash();
  if(c.hash!==pkg.hash||cur!==pkg.hash){const cv=latestImg().ver;const before=pkg.status;pkg.status='오래됨';
    log(NAMES[act],'STALE_VERSION',`제출 대상 ${pkg.hash.slice(0,8)} ≠ 현재 대상 ${cur.slice(0,8)} · ${before}→오래됨`,cur);
    S.msg={type:'stale',code:'STALE_VERSION',text:`검토한 v${pkg.imgVer} 이후 v${cv}이(가) 등록되었습니다. 현재 파일을 다시 확인해 주세요. 이전 화면의 요청은 거절되었습니다.`};return{ok:false,code:'STALE_VERSION'}}
  if(act!=='reject'){const b=blockers();if(b.length)return fail(act,'BLOCKED',['필수 조건이 남아 있습니다: '+b.join(' · ')])}
  if(act==='approve'){pkg.status='내용 승인';return done(act,`${pkg.id} 내용 승인 · 대상 해시 ${cur.slice(0,12)}…`,cur)}
  if(act==='reject'){pkg.status='반려';return done(act,`${pkg.id} 반려 · 사유: ${reason.trim()}`,cur)}
  pkg.status='출고 확정';S.release={pkgId:pkg.id,files:[{name:`ad_v${pkg.imgVer}.svg`,ver:pkg.imgVer,sha:pkg.imgSha}],at:T(),by:ROLES[S.role],hash:cur};
  return done(act,`${pkg.id} 출고 확정 · 승인된 파일 묶음과 출고 기록을 한 번에 저장 · 파일 해시 ${pkg.imgSha.slice(0,12)}…`,cur)}

/* ---------- 화면 ---------- */
const tag=(j,ex)=>{const m={'충족':'t-ok','미충족':'t-bad','확인 필요':'t-warn','해당 없음':'t-na','완료':'t-ok','미실행':'t-na','실패':'t-bad'};return `<span class="tag ${m[j]||'t-na'}">${j}${ex||''}</span>`};
function runTable(run){const stale=isStale(run);return `<div class="tw"><table><thead><tr><th>항목</th><th>기준(기대값)</th><th>관찰값</th><th>판정</th><th>실행 상태</th><th>근거·방법</th><th></th></tr></thead><tbody>${run.items.map(it=>{
  const j=effJ(run,it),human=S.reviews[reviewKey(run,it)];
  const canRev=it.judgment==='확인 필요'&&it.execution==='완료'&&!human&&!stale;
  return `<tr><td>${it.label}</td><td>${esc(it.expected)}<div class="muted">${it.src}</div></td><td>${esc(it.observed)}</td><td>${tag(j,human?' (사람 확인)':'')}</td><td>${tag(it.execution)}</td><td>${esc(it.evidence)}<div class="muted">${it.method}${human?` · 검토: ${esc(human.by)} “${esc(human.note)}”`:''}</div></td>
  <td>${canRev?`<button onclick="UI.openReview('${it.id}')" ${S.role!=='pm'?'disabled title="PM(검수 담당)만 담당 검토를 입력할 수 있습니다"':''}>담당 검토</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`}
function agentTable(run){return `<details><summary>에이전트 역할별 실행 이력 (모의 · ${run.id})</summary><div class="tw"><table><thead><tr><th>역할</th><th>상태</th><th>내용</th></tr></thead><tbody>${run.agents.map(a=>`<tr><td>${a[0]}</td><td>${tag(a[1]==='실행'?'완료':'미실행',a[1]==='실행'?'':' (미호출)')}</td><td>${a[2]}</td></tr>`).join('')}</tbody></table></div><div class="muted">실제로 호출된 역할만 “완료”로 표시합니다. 8개 역할이 설계되어 있다는 이유로 모두 실행된 것으로 표시하지 않습니다.</div></details>`}
const imgBox=(ver,hl,cap)=>{const i=S.imgs.find(x=>x.ver===ver);return i?`<div class="img">${adSVG(ver,hl)}</div><div class="muted">${cap||''}이미지 v${ver} · SHA-256 <span class="mono">${i.sha.slice(0,16)}…</span></div>`:''};
const hint=t=>`<div class="hint"><strong>시연 안내</strong> · ${t}</div>`;
const dis=(cond,why)=>cond?`disabled title="${esc(why)}"`:'';
const roleOk=(act)=>PERM[act].includes(S.role);
const why=(act)=>`${PERM[act].map(r=>ROLE_TEXT[r]).join('·')}만 할 수 있습니다 (현재: ${ROLE_TEXT[S.role]})`;

function view1(){return hint('제작자·PM이 의뢰서와 납품 이미지를 접수합니다. 파일마다 버전과 SHA-256 해시가 기록됩니다. 사용자 전환은 위의 역할 버튼으로 합니다.')+`<div class="panel"><h2>SC-01 · 발주·자료 접수</h2>
<div class="card"><strong>ORD-DEMO-001</strong> · MORNING CUP 딸기라떼 프로모션 · 납기 2026-10-16 · 발주 revision <strong>${S.revision}</strong><div class="muted">게시처 Instagram(가상) · 발주 담당자 PM 김담당 · 제작자 이하나</div></div>

<button onclick="UI.act('regImg')" ${dis(S.imgs.length||!roleOk('regImg'),S.imgs.length?'이미 접수됨':why('regImg'))}>납품 이미지 v1 접수 (제작자)</button>
<button class="primary" onclick="UI.go(2)" ${dis(!(S.req&&S.imgs.length),'의뢰서와 이미지를 모두 접수해야 합니다')}>다음 → 기준 확정</button></div>
${S.imgs[0]?`<h3>접수된 이미지</h3>${imgBox(1)}`:''}</div>`}

function view2(){const q=S.crit.q;return hint('PM이 원문과 추출 기준을 나란히 보고 필수 질문을 해소한 뒤 기준을 확정합니다. 추출만으로는 확정되지 않고, 확정은 사람이 합니다.')+`<div class="panel"><h2>SC-02 · 추출 기준 검토·확정</h2>
<div class="grid2"><div><h3>원문 · 의뢰서 v2</h3>${REQ.map(r=>`<blockquote><span class="muted">${r[0]}</span> ${r[1].replace('30% 할인','<mark>30% 할인</mark>')}</blockquote>`).join('')}</div>
<div><h3>추출 기준 ${S.crit.baseline?tag('충족',' 확정 v1'):S.crit.extracted?tag('확인 필요',' 초안'):tag('미실행',' 추출 전')}</h3>
${S.crit.extracted?`<div class="tw"><table><thead><tr><th>항목</th><th>기대값</th><th>출처</th><th>필수</th></tr></thead><tbody>${ITEMS.map(i=>`<tr><td>${i.label}</td><td>${esc(i.expected)}</td><td>${i.src}</td><td>필수</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">아직 추출하지 않았습니다. 샘플 값으로 채우지 않습니다.</div>'}</div></div>
<div class="row"><button onclick="UI.act('extract')" ${dis(S.crit.extracted||!roleOk('extract'),S.crit.extracted?'이미 추출됨':why('extract'))}>기준 추출 실행 (모의 LLM)</button></div>
${q?`<div class="card" style="margin-top:10px"><strong>필수 질문 1건</strong> · ${q.text}
<div class="row"><select id="ans" ${q.answer?'disabled':''}><option value="">선택…</option><option ${q.answer==='2026-10-16 ~ 10-31 (고객 확인)'?'selected':''}>2026-10-16 ~ 10-31 (고객 확인)</option><option ${q.answer==='기간 표기 불필요'?'selected':''}>기간 표기 불필요</option></select>
<button onclick="UI.answer()" ${dis(q.answer||!roleOk('answer'),q.answer?'해소됨':why('answer'))}>답변 저장</button> ${q.answer?tag('충족',' 해소'):tag('확인 필요',' 미해소')}</div></div>`:''}
<div class="row"><button class="primary" onclick="UI.act('confirmBaseline')" ${dis(S.crit.baseline||!roleOk('confirmBaseline')||!S.crit.extracted||!(q&&q.answer),S.crit.baseline?'이미 확정됨':!roleOk('confirmBaseline')?why('confirmBaseline'):'추출과 필수 질문 해소가 필요합니다')}>기준 확정</button>
<button onclick="UI.go(3)" ${dis(!S.crit.baseline,'기준을 확정해야 합니다')}>다음 → 검수</button></div></div>`}

function view3(){const r=lastRun(),i=latestImg();return hint('PM이 검수를 실행합니다. 결과는 “판정”과 “실행 상태”를 따로 보여줍니다. 같은 입력으로 다시 실행하면 새 run을 만들지 않고 기존 결과를 재사용합니다. 1차 run은 문구 검사만, 재검수부터 개수·외관 검사를 실행하도록 시연용으로 구성했습니다.')+`<div class="panel"><h2>SC-06·03 · 검수 실행과 결과</h2>

${r?`<span class="muted">${r.id} · 기준 v${r.baseline} · 이미지 v${r.imgVer} ${isStale(r)?tag('확인 필요',' 현재 이미지 아님(과거 결과)'):tag('완료',' 현재 결과')}</span>`:''}</div>
${r?`<div class="gimg"><div>${imgBox(r.imgVer,true,'빨간 점선: 할인 문구 관찰 영역 · ')}</div><div><div class="muted">발주 revision ${S.revision} · 기준 v${r.baseline}</div>${runTable(r)}</div></div>${agentTable(r)}
<div class="hint">${r.items.some(x=>x.judgment==='미충족')?'할인율이 기준(30%)과 다른 20%로 관찰되어 <strong>미충족 / 실행 완료</strong>입니다. 개수·외관은 <strong>확인 필요 / 미실행</strong>이라 “통과”가 아니며, 이 결과만으로 승인할 수 없습니다.':'미충족 항목이 없습니다. 아직 확인 필요 항목이 있으면 담당 검토가 필요합니다.'}</div>`:'<div class="muted">아직 실행 이력이 없습니다.</div>'}

function view4(){const r=lastRun(),t=S.task,f=r&&r.items.find(x=>x.judgment==='미충족'),i=latestImg();
  const draft=f&&!t?`<div class="card"><strong>수정 요청 초안</strong> ${tag('확인 필요',' 사람 확정 전')}<div>${f.label}: 기준 “${f.expected}” / 관찰 “${esc(f.observed)}” → 문구를 기준대로 수정</div><div class="muted">근거: ${r.id} · ${f.evidence} · 초안은 사람이 확정하기 전에는 전달된 것이 아닙니다.</div></div>`:'';
  return hint('PM이 수정 요청을 확정하면 제작자에게 내부 작업이 생깁니다. 제작자의 수정본 제출은 “해결”이 아닙니다. 재검수에서 근거가 확인되어야 PM이 해결 확인을 할 수 있습니다. 해결 확인을 먼저 눌러보면 거절됩니다.')+`<div class="panel"><h2>SC-04 · 보완 작업함·수정본 제출</h2>${draft}
${t?`<div class="tw"><table><thead><tr><th>작업</th><th>대상</th><th>담당·기한</th><th>상태</th></tr></thead><tbody><tr><td>${t.id}<div class="muted">${esc(t.text)}</div></td><td>${t.target}</td><td>${t.assignee}<div class="muted">${t.due}</div></td><td>${tag(t.status==='해결 확인'?'충족':'확인 필요',' '+t.status)}${t.evidence?`<div class="muted">근거 ${t.evidence}</div>`:''}</td></tr></tbody></table></div>`:(f?'':'<div class="muted">보완 작업이 없습니다. 검사가 끝나지 않았다면 “작업 없음”은 통과를 뜻하지 않습니다.</div>')}
<div class="row"><button onclick="UI.act('confirmTask')" ${dis(!f||t||!roleOk('confirmTask'),!roleOk('confirmTask')?why('confirmTask'):t?'이미 확정됨':'미충족 지적이 필요합니다')}>① 요청 확정 (PM)</button>
<button onclick="UI.act('submitFix')" ${dis(!t||t.status!=='확정'||!roleOk('submitFix'),!roleOk('submitFix')?why('submitFix'):'확정된 작업이 필요합니다')}>② 수정본 v2 제출 (제작자)</button>
<button onclick="UI.act('runQA')" ${dis(!roleOk('runQA')||!i||(r&&!isStale(r)),!roleOk('runQA')?why('runQA'):'새 이미지 버전이 있어야 재검수가 필요합니다')}>③ 재검수 실행 (PM)</button>
<button onclick="UI.act('resolveTask')" ${dis(!t||t.status!=='수정 제출'||!roleOk('resolveTask'),!roleOk('resolveTask')?why('resolveTask'):'수정 제출 상태의 작업이 필요합니다')}>④ 해결 확인 (PM)</button></div>
${r&&r.imgVer>=2?`<h3>재검수 결과 · 이미지 v${r.imgVer}</h3><div class="gimg"><div>${imgBox(r.imgVer,true)}</div><div>${runTable(r)}</div></div>${agentTable(r)}<div id="reviewBox"></div>
<div class="hint">음료 외관은 모의 VLM이 불확실로 관찰해 <strong>확인 필요 / 실행 완료</strong>입니다. 필수 항목이므로 PM의 담당 검토 전까지 승인할 수 없습니다.${r.imgVer>2?' 새 버전 v3에는 이전 버전의 사람 확인이 자동으로 이어지지 않습니다.':''}</div>`:''}
<div class="row"><button class="primary" onclick="UI.go(5)">다음 → 승인·출고</button></div></div>`}

function view5(){const b=blockers(),c=S.clientPkg,pkg=c&&S.pkgs.find(p=>p.id===c.id),i=latestImg();
  const stale=pkg&&pkg.status==='오래됨';
  return hint('승인 요청은 “지정 고객”이 내용 승인·반려를, “PM”이 내용 승인 이후 출고 확정을 합니다. 제작자에게는 승인 동작이 없습니다. 승인 화면을 열어 둔 채 새 이미지가 들어오면 서버가 이전 화면의 요청을 STALE_VERSION으로 거절합니다.')+`<div class="panel"><h2>SC-05 · 버전·최종 확인·승인</h2>
<div class="row"><span class="muted">발주 revision <strong>${S.revision}</strong> · 현재 이미지 ${i?'v'+i.ver:'—'} · 기준 ${S.crit.baseline?'v1':'—'}</span></div>
<h3>차단과 참고 사항</h3>${b.length?`<ul class="bl">${b.map(x=>`<li><span class="tag t-bad">차단</span> ${esc(x)}</li>`).join('')}</ul>`:'<div class="tag t-ok">차단 사유 없음</div>'}
<ul class="bl"><li><span class="tag t-na">참고</span> N1: 배경색이 브랜드 가이드의 권장 톤과 약간 다름 — 승인을 막지 않는 참고 알림</li></ul>
${!c?`<div class="row"><button class="primary" onclick="UI.act('prepare')" ${dis(b.length||!roleOk('prepare'),!roleOk('prepare')?why('prepare'):'차단 사유가 남아 있어 승인 요청을 준비할 수 없습니다')}>승인 요청 준비 (PM)</button></div>`
 :`<h3>승인 패키지 ${tag(pkg.status==='출고 확정'||pkg.status==='내용 승인'?'충족':pkg.status==='오래됨'||pkg.status==='반려'?'미충족':'확인 필요',' '+pkg.status)}</h3>
<div class="grid2"><div>${imgBox(c.imgVer,false,'승인 대상 · ')}</div><div class="card"><dl style="margin:0"><dt class="muted">패키지</dt><dd>${c.id}</dd><dt class="muted">화면이 본 대상(요약 해시)</dt><dd class="mono">${c.hash.slice(0,16)}…</dd><dt class="muted">화면이 본 발주 revision</dt><dd>${c.revision}</dd><dt class="muted">서버의 현재 대상</dt><dd class="mono">${snapHash().slice(0,16)}…</dd></dl><div class="muted">해시는 요약 표시이며 서버는 전체 값으로 비교합니다.</div></div></div>
<div class="row" style="margin-top:12px">
 <button class="primary" onclick="UI.act('approve')" ${dis(!roleOk('approve'),why('approve'))}>내용 승인 (지정 고객)</button>
 <button onclick="UI.reject()" ${dis(!roleOk('reject'),why('reject'))}>반려 (지정 고객)</button>
 <button class="primary" onclick="UI.act('release')" ${dis(!roleOk('release'),why('release'))}>출고 확정 (PM)</button>
 <button onclick="UI.refresh()">화면 새로고침</button></div>
${S.role==='producer'?'<div class="muted">제작자에게는 승인 버튼이 동작하지 않습니다(서버가 거절). 위의 역할 버튼으로 지정 고객·PM으로 전환하세요.</div>':''}
<div class="row"><button onclick="UI.act('arrive')" ${dis(S.imgs.length!==2||!roleOk('arrive'),S.imgs.length!==2?'수정본 v2 접수 후 1회만 사용':why('arrive'))}>🧪 시연: 승인 화면을 열어 둔 채 제작자가 새 이미지 v3 제출</button></div>`}
${S.release?`<h3>승인된 납품 목록</h3><div class="tw"><table><thead><tr><th>파일</th><th>버전</th><th>SHA-256</th><th>QA</th><th></th></tr></thead><tbody>${S.release.files.map(f=>`<tr><td>${f.name}</td><td>v${f.ver}</td><td class="mono">${f.sha.slice(0,24)}…</td><td>${lastRun().id}</td><td><button onclick="UI.download()">다운로드</button></td></tr>`).join('')}</tbody></table></div><div class="muted">출고 ${S.release.by} · ${S.release.at} · 승인 해시 ${S.release.hash.slice(0,12)}… · 이후 새 버전은 별도 재검수·승인 대상입니다. (다운로드와 플랫폼 게시 완료는 별개)</div>`:''}</div>`}

const VIEWS={1:view1,2:view2,3:view3,4:view4,5:view5};
function render(){
  document.getElementById('roles').innerHTML=Object.keys(ROLES).map(k=>`<button aria-pressed="${S.role===k}" onclick="UI.role('${k}')">${ROLES[k]}</button>`).join(' ');
  const labels=[['1','접수','SC-01'],['2','기준 확정','SC-02'],['3','검수·결과','SC-06·03'],['4','보완·재검수','SC-04'],['5','승인·출고','SC-05']];
  document.getElementById('steps').innerHTML=labels.map(l=>`<button ${S.step==l[0]?'aria-current="step"':''} onclick="UI.go(${l[0]})">${l[0]}. ${l[1]}<small>${l[2]}</small></button>`).join('');
  const m=S.msg?`<div class="toast ${S.msg.type}" role="status"><strong class="code">${S.msg.code}</strong> · ${esc(S.msg.text)}</div>`:'';
  document.getElementById('main').innerHTML=m+VIEWS[S.step]();
  document.getElementById('log').innerHTML=S.audit.map(a=>`<li><span class="muted">${a.t}</span> <strong>${a.actor}</strong><br>${a.action} <span class="code ${a.code==='OK'||a.code==='DUPLICATE_REUSED'?'c-ok':a.code==='STALE_VERSION'?'c-stale':'c-bad'}">${a.code}</span><br><span class="muted">${esc(a.detail)}${a.hash?' · <span class="mono">'+a.hash+'</span>':''}</span></li>`).join('')||'<li class="muted">아직 기록이 없습니다.</li>';
}
const UI={
  role(k){if(playing)return;S.role=k;S.msg=null;render()},
  go(n){S.step=n;render()},
  act(a){if(playing)return;A[a]();render()},
  answer(){if(playing)return;A.answer(document.getElementById('ans').value);render()},
  refresh(){if(playing)return;A.refresh();render()},
  reject(){if(playing)return;const r=prompt('반려 사유를 입력하세요');if(r===null)return;A.reject(r);render()},
  openReview(id){const it=ITEMS.find(x=>x.id===id);document.getElementById('reviewBox').innerHTML=`<div class="card" style="margin-top:10px"><strong>담당 검토 · ${it.label}</strong><div class="muted">읽음·제출이 아니라 검토 근거를 남겨야 확인 필요를 해소할 수 있습니다.</div><textarea id="rvNote" rows="2" placeholder="예: 원본 파일에서 토핑이 3개 보임을 직접 확인"></textarea><div class="row"><button class="primary" onclick="UI.saveReview('${id}')">검토 저장</button></div></div>`},
  saveReview(id){if(playing)return;A.review(id,document.getElementById('rvNote').value);render()},
  download(){const f=S.release.files[0],i=S.imgs.find(x=>x.ver===f.ver);if(sha256(i.svg)!==f.sha){alert('승인된 해시와 다릅니다. 다운로드를 차단합니다.');return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([i.svg],{type:'image/svg+xml'}));a.download=f.name;a.click();log('승인 파일 다운로드','OK',`${f.name} · 해시 일치 확인`,f.sha);render()}
};
/* ---------- 자동 시연 ---------- */
async function autoplay(){
  if(playing)return;S=fresh();playing=true;render();const race=document.getElementById('race').checked;
  document.getElementById('btnPlay').disabled=true;
  const seq=[['producer',1,()=>A.regReq()],['producer',1,()=>A.regImg()],['pm',2,()=>A.extract()],['pm',2,()=>A.confirmBaseline()],
   ['pm',2,()=>A.answer('2026-10-16 ~ 10-31 (고객 확인)')],['pm',2,()=>A.confirmBaseline()],['pm',3,()=>A.runQA()],['pm',3,()=>A.runQA()],
   ['pm',4,()=>A.confirmTask()],['producer',4,()=>A.submitFix()],['pm',4,()=>A.resolveTask()],['pm',4,()=>A.runQA()],
   ['pm',4,()=>A.review('look','원본 파일에서 토핑이 3개 보이고 분홍색 음료임을 직접 확인')],['pm',4,()=>A.resolveTask()],['pm',5,()=>A.prepare()]];
  if(race)seq.push(['producer',5,()=>A.arrive()],['customer',5,()=>A.approve()],['customer',5,()=>A.refresh()],['pm',4,()=>A.runQA()],
   ['pm',4,()=>A.review('look','v3 원본에서도 토핑 3개와 분홍색 음료를 다시 확인')],['pm',5,()=>A.prepare()]);
  seq.push(['customer',5,()=>A.approve()],['pm',5,()=>A.release()]);
  for(const[role,step,fn]of seq){S.role=role;S.step=step;fn();render();await sleep(DELAY)}
  playing=false;document.getElementById('btnPlay').disabled=false;render();
}
document.getElementById('btnPlay').onclick=autoplay;
document.getElementById('btnReset').onclick=()=>{if(playing)return;S=fresh();render()};
render();
</script></body></html>
